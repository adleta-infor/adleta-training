<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3 Class 9 — Customer Service</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8502e'/%3E%3Ctext x='16' y='22' font-family='monospace' font-weight='700' font-size='14' fill='white' text-anchor='middle'%3EM3%3C/text%3E%3C/svg%3E">
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f151c; --bg2:#131b24; --surface:#1a2430; --line:#2a3644;
  --text:#e9eef4; --muted:#9aa8b5; --faint:#5c6b7a;
  --red:#e8502e; --red-dim:#c73e21; --blue:#5da9e6; --green:#3fb96b; --amber:#f2a33c;
  --sim-bg:#eef0f3; --sim-panel:#f7f8fa; --sim-line:#d3d8de; --sim-ink:#1c2733; --sim-muted:#5b6675;
  --font-display:'Cabinet Grotesk','Arial Black',sans-serif;
  --font-body:'General Sans','Helvetica Neue',sans-serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
.mono{font-family:var(--font-mono)}

/* ---------- deck chrome ---------- */
#deck{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:3.5% 6.5%;display:flex;flex-direction:column;justify-content:safe center;overflow-y:auto;opacity:0;transform:translateX(28px);transition:opacity .28s ease,transform .28s ease;pointer-events:none}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.slide.exit-left{transform:translateX(-28px)}
#bar{height:3px;background:var(--line);flex:none}
#barfill{height:100%;background:var(--red);width:0;transition:width .3s ease}
#chrome{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;font-size:13px;color:var(--faint);user-select:none}
#chrome .mono{letter-spacing:.04em}
#hint{display:flex;gap:14px;align-items:center}
#hint span{white-space:nowrap}
#count{font-family:var(--font-mono)}

/* ---------- slide typography ---------- */
.kicker{font-family:var(--font-mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:18px}
.kicker.blue{color:var(--blue)} .kicker.green{color:var(--green)}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,5.6vw,72px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px}
h2{font-family:var(--font-display);font-weight:700;font-size:clamp(32px,4.2vw,54px);line-height:1.08;letter-spacing:-.01em;margin-bottom:16px}
.sub{font-size:clamp(17px,1.6vw,23px);color:var(--muted);max-width:60ch}
.lead{font-size:clamp(19px,1.9vw,26px);max-width:58ch;line-height:1.5}
.accent{color:var(--red)}
.ulist{list-style:none;font-size:clamp(17px,1.7vw,24px);display:flex;flex-direction:column;gap:14px;margin-top:6px}
.ulist li{display:flex;gap:16px;align-items:baseline;line-height:1.45}
.ulist .n{font-family:var(--font-mono);color:var(--red);font-size:.85em;flex:none}
.ulist .tick{color:var(--green);flex:none;font-weight:700}
.small{font-size:clamp(14px,1.25vw,17px);color:var(--muted);margin-top:26px}

/* ---------- layout helpers ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 28px}
.card h3{font-family:var(--font-display);font-size:22px;margin-bottom:10px}
.card p{font-size:17px;color:#b7c3cf;line-height:1.5}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pill{display:inline-block;font-family:var(--font-mono);font-size:14px;background:rgba(93,169,230,.12);color:var(--blue);border:1px solid rgba(93,169,230,.35);padding:3px 10px;border-radius:999px}

/* ---------- NOW YOU TRY ---------- */
.try{background:linear-gradient(135deg,#1d1a10,#171a10);border-left:6px solid var(--amber);padding-left:7.5%}
.try .kicker{color:var(--amber)}
.try .check{background:rgba(242,163,60,.07);border:1px solid rgba(242,163,60,.3);border-radius:14px;padding:26px 30px;margin-top:8px}
.try .check li{display:flex;gap:14px;align-items:baseline;font-size:clamp(18px,1.8vw,25px);line-height:1.5;padding:10px 0;border-bottom:1px dashed rgba(242,163,60,.25)}
.try .check li:last-child{border-bottom:none}
.try .check .box{font-family:var(--font-mono);color:var(--amber);flex:none}
.try .done{margin-top:22px;font-size:clamp(16px,1.4vw,20px);color:var(--amber)}

/* ---------- M3 simulation ---------- */
.sim-wrap{position:relative;margin-inline:auto}
.sim-wrap.left{margin-inline:0}
.sim-tag{position:absolute;top:-14px;left:18px;z-index:5;background:var(--red);color:#fff;font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;padding:4px 12px;border-radius:4px}
.m3{background:var(--sim-bg);border-radius:10px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);border:1px solid #3a4653;color:var(--sim-ink)}
.m3-title{background:#2d3a47;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:15px}
.m3-title .code{font-family:var(--font-mono);font-weight:700;letter-spacing:.03em}
.m3-title .env{font-family:var(--font-mono);font-size:12px;color:#9fc3e8}
.m3-body{padding:14px 20px}
.m3-btns{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--sim-line);background:#e6e9ed}
.m3-btn{background:#fff;border:1px solid #b9c1cb;border-bottom-width:2px;border-radius:5px;padding:6px 20px;font-size:14px;color:var(--sim-ink)}
.m3-btn.primary{background:#0e5fa8;border-color:#0b4f8c;color:#fff}
.m3-btn.hot{outline:3px solid #ffb02e;outline-offset:-1px}
.frow{display:grid;grid-template-columns:190px 1fr;gap:0 18px;padding:5px 0;font-size:15px;align-items:center}
.frow .lab{color:#4d5866;text-align:right}
.frow .val{font-family:var(--font-mono);background:#fff;border:1px solid var(--sim-line);border-radius:4px;padding:5px 10px;min-height:28px}
.frow .val.auto{border-color:#7fb594;background:#eef7f0}
.frow .val.hl{outline:3px solid #ffb02e;outline-offset:-1px}
.frow .req::after{content:" *";color:var(--red);font-weight:700}
.sim-note{margin-top:14px;font-size:14px;color:var(--sim-muted)}
.callout{margin-top:16px;background:#fff6df;border:1px solid #ecd9a0;border-left:4px solid var(--amber);border-radius:6px;padding:12px 16px;font-size:15px;color:#5c4a1e}
.callout b{color:#3d2f0e}

/* grids inside sims */
.m3-table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
.m3-table th{background:#dfe3e8;text-align:left;padding:7px 10px;font-weight:600;color:#3c4856;border:1px solid var(--sim-line)}
.m3-table td{padding:7px 10px;font-family:var(--font-mono);border:1px solid var(--sim-line);font-size:13px}
.m3-table tr.sel td{background:#dbeaf8;outline:2px solid #2f7cc0;outline-offset:-2px}
.ok{color:#1e7a3c;font-weight:700} .st{color:#0e5fa8;font-weight:700}

/* alert modal */
.alertbox{margin:14px auto;max-width:560px;background:#fff;border:1px solid #d98a8a;border-radius:8px;box-shadow:0 10px 30px rgba(160,30,30,.25);overflow:hidden}
.alertbox .t{background:#c0392b;color:#fff;padding:8px 16px;font-weight:600;font-size:14px}
.alertbox .m{padding:18px 20px;font-size:17px;color:#7a1f1f}
.alertbox .b{padding:10px 16px;text-align:right;border-top:1px solid #f0d5d5}

/* typing caret */
@keyframes blink{50%{opacity:0}}
.caret{display:inline-block;width:8px;height:16px;background:var(--sim-ink);vertical-align:-2px;animation:blink .8s infinite}

/* ---------- journey map ---------- */
.journey{display:flex;align-items:stretch;gap:0;margin-top:10px}
.jstep{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;position:relative}
.jstep .jc{font-family:var(--font-mono);color:var(--blue);font-size:15px;margin-bottom:8px}
.jstep .jt{font-weight:700;font-size:18px;margin-bottom:6px}
.jstep .jd{font-size:15px;color:#b7c3cf;line-height:1.45}
.jstep .js{margin-top:10px;display:inline-block;font-family:var(--font-mono);font-size:12px;background:rgba(63,185,107,.12);color:var(--green);border:1px solid rgba(63,185,107,.4);padding:3px 8px;border-radius:4px}
.jarrow{flex:none;width:44px;display:flex;align-items:center;justify-content:center;color:var(--red);font-size:26px}

/* ---------- quiz ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 20px;margin-bottom:12px}
.q h3{font-size:19px;margin-bottom:10px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;background:#141d27;border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:16px;color:#c3ced9;transition:all .15s}
.opt:hover{border-color:var(--blue);color:var(--text)}
.opt .l{font-family:var(--font-mono);color:var(--blue);flex:none}
.opt.correct{background:rgba(63,185,107,.1);border-color:var(--green);color:#c9ecd6}
.opt.correct .l{color:var(--green)}
.opt.wrong{background:rgba(232,80,46,.08);border-color:var(--red);color:#f3c1b3}
.opt.dim{opacity:.45}
.explain{margin-top:12px;background:rgba(93,169,230,.08);border:1px solid rgba(93,169,230,.3);border-radius:10px;padding:10px 14px;font-size:14px;color:#bcd8ef;display:none}
.explain.show{display:block}

/* ---------- presenter notes ---------- */
#notes{position:fixed;left:0;right:0;bottom:0;background:#0a0e13;border-top:2px solid var(--red);padding:16px 26px 20px;z-index:50;transform:translateY(100%);transition:transform .25s ease;max-height:32vh;overflow:auto}
#notes.open{transform:none}
#notes .nt{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;color:var(--red);margin-bottom:8px}
#notes .nb{font-size:16px;color:#c8d2dc;line-height:1.55;max-width:100ch}

/* title slide extras */
.title-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.tmeta{font-family:var(--font-mono);font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 16px}

/* agenda rows */
.agenda{display:flex;flex-direction:column;margin-top:6px}
.arow{display:grid;grid-template-columns:110px 1fr 90px;gap:20px;align-items:baseline;padding:16px 4px;border-bottom:1px solid var(--line);font-size:clamp(17px,1.7vw,23px)}
.arow .at{font-family:var(--font-mono);color:var(--red);font-size:16px}
.arow .am{font-weight:600}
.arow .ad{color:var(--muted);font-size:.78em}
.arow .dur{font-family:var(--font-mono);color:var(--faint);font-size:15px;text-align:right}

.statuschips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.chip{border-radius:12px;padding:18px 20px;border:1px solid var(--line);background:var(--surface)}
.chip .cs{font-family:var(--font-mono);font-weight:700;font-size:18px;margin-bottom:6px}
.chip .ct{font-size:15px;color:#b7c3cf;line-height:1.45}
.chip.c20 .cs{color:var(--amber)} .chip.c33 .cs{color:var(--green)} .chip.c44 .cs{color:var(--blue)} .chip.c10 .cs{color:var(--red)}

@media (max-width:900px){.cols{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.journey{flex-wrap:wrap}.jarrow{display:none}}

/* ---------- real screenshots ---------- */
.kicker.amber{color:var(--amber)}
.shot{display:block;max-width:100%;max-height:62vh;width:auto;height:auto;border-radius:10px;border:1px solid #3a4653;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#fff}
.shotrow{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);gap:36px;align-items:center;margin-top:6px}
.side p{font-size:clamp(17px,1.6vw,22px);line-height:1.5;margin-bottom:14px;color:#dbe3ea}
.side .tip,.tip{font-size:clamp(15px,1.3vw,18px);color:var(--amber);border-left:3px solid var(--amber);padding-left:12px}
ol.steps{counter-reset:s;list-style:none;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:block;position:relative;padding-left:44px;font-size:clamp(17px,1.65vw,23px);line-height:1.45}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:30px;height:30px;border-radius:50%;background:var(--amber);color:#1b1404;font-family:var(--font-mono);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:6px}
.pair figure{margin:0}
.pair .shot{max-height:44vh}
.pair figcaption{margin-top:12px;font-size:clamp(16px,1.45vw,20px);color:#dbe3ea}
.dot{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:10px;vertical-align:-1px}
@media (max-width:900px){.shotrow,.pair{grid-template-columns:1fr}}

.map{width:100%;border-collapse:collapse;margin-top:6px;font-size:clamp(17px,1.6vw,22px)}
.map th{text-align:left;font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);padding:10px 14px;border-bottom:2px solid var(--line)}
.map td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top}
.map td:first-child{color:var(--muted);width:45%}
/* ---------- phone call ---------- */
.kicker.red{color:var(--red)}
.call{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:40px;align-items:start;margin-top:8px}
.phone{background:linear-gradient(170deg,#1f2b38,#141c25);border:1px solid var(--line);border-radius:28px;padding:34px 24px 26px;text-align:center;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.ph-icon{font-size:54px;width:104px;height:104px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(63,185,107,.14);border:2px solid rgba(63,185,107,.5);position:relative;z-index:1}
.phone.ringing .ph-icon{animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.ph-ring{position:absolute;left:50%;top:86px;width:0;height:0}
.ph-ring span{position:absolute;left:-52px;top:-52px;width:104px;height:104px;border-radius:50%;border:2px solid var(--green);opacity:0}
.phone.ringing .ph-ring span{animation:pulse 2s ease-out infinite}
.phone.ringing .ph-ring span:nth-child(2){animation-delay:1s}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2);opacity:0}}
.ph-who{font-family:var(--font-display);font-weight:800;font-size:28px}
.ph-num{font-family:var(--font-mono);color:var(--muted);font-size:15px;margin-top:4px}
.ph-btns{margin-top:22px;display:flex;flex-direction:column;gap:10px;align-items:center}
.cbtn{font:inherit;font-weight:700;font-size:20px;border:none;border-radius:999px;padding:14px 34px;cursor:pointer;min-width:200px}
.cbtn.ans{background:var(--green);color:#06210f}
.cbtn.ans:hover{filter:brightness(1.1)}
.cbtn.rep{background:transparent;color:var(--text);border:1px solid var(--line)}
.ph-state{margin-top:16px;font-size:15px;color:var(--amber)}
.transcript{display:flex;flex-direction:column;gap:12px;max-height:50vh;overflow-y:auto;padding-right:6px}
.tr-empty{color:var(--faint);font-size:18px;padding:30px 0}
.bub{max-width:80%;padding:12px 18px;border-radius:16px;font-size:clamp(17px,1.6vw,22px);line-height:1.4;animation:pop .25s ease}
.bub em{display:block;font-style:normal;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;opacity:.7;margin-bottom:4px}
.bub.csr{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.bub.cust{align-self:flex-end;background:rgba(93,169,230,.14);border:1px solid rgba(93,169,230,.4)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.yourturn{margin-top:18px;font-size:clamp(20px,2vw,28px);background:rgba(242,163,60,.12);border:1px solid rgba(242,163,60,.5);border-radius:14px;padding:16px 22px;color:var(--amber);animation:pop .3s ease}
.heard{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:8px}
.hd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.hd em{display:block;font-style:normal;font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
.hd b{display:block;font-size:clamp(20px,2vw,28px);margin-bottom:6px}
.hd span{color:var(--muted);font-size:15px}
.callcard{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#16202b;border:1px dashed #3a4a5c;border-radius:12px;padding:10px 14px;font-size:15px;align-self:flex-start}
.cc-h{font-weight:700;margin-right:6px}
.cc-i{font-family:var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.cc-i em{font-style:normal;font-family:var(--font-body);font-size:12px;margin-right:6px;opacity:.75}
.cc-i.on{color:#1b1404;background:var(--amber);border-color:var(--amber)}
@media (max-width:900px){.call{grid-template-columns:1fr}.heard{grid-template-columns:1fr 1fr}}
.split{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 40px;align-items:center;background:rgba(240,180,41,.12);border:2px solid #f0b429;border-radius:12px;padding:14px 22px;font-size:24px;color:#f3f4f6}.split>b:first-child{width:100%;font-weight:600;color:#f3f4f6}.split i{font-style:normal;color:#f0b429;font-weight:700;margin-right:6px}.split .mono{font-size:28px}
.navbtns{display:inline-flex;align-items:center;gap:10px;pointer-events:auto}.navbtns button{font:inherit;font-size:13px;background:rgba(255,255,255,.08);color:#e5e7eb;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:5px 12px;cursor:pointer}.navbtns button:hover{background:rgba(255,255,255,.18)}
.frag{opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease}
.frag.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.frag{transition:none}}
.codes td{vertical-align:top;line-height:1.55;padding-top:10px;padding-bottom:10px}.codes td.mono{white-space:nowrap}.codes .today{color:#f0b429;font-weight:700}

/* ---------- click-through call (no sound) ---------- */
.ph-btns .cbtn.nxt{background:var(--amber);color:#1b1404}
.call .transcript{max-height:54vh}
.bub.sys{align-self:center;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:15px}
.hl-note{display:inline-block;width:14px;height:14px;border:3px solid #ff8a00;border-radius:3px;vertical-align:-2px;margin-right:8px}
.heard.h4{grid-template-columns:repeat(4,1fr)} .heard.h6{grid-template-columns:repeat(3,1fr)}
.newbadge{display:inline-block;font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;background:var(--green);color:#06210f;border-radius:4px;padding:2px 8px;margin-left:10px;vertical-align:middle}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
.compare .card h3 .mono{color:var(--blue)}
@media (max-width:900px){.compare,.heard.h4,.heard.h6{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="deck">
  <div id="stage"></div>
  <div id="bar"><div id="barfill"></div></div>
  <div id="chrome">
    <span class="mono">ADLETA · M3 CUSTOMER SERVICE · CLASS 9 · ORDER CHARGES</span>
    <span id="hint"><span>← → navigate</span><span><b>N</b> presenter notes</span><span><b>F11</b> fullscreen</span></span>
    <span class="navbtns"><button id="navPrev" type="button" aria-label="Previous slide">‹ Back</button><span id="count"></span><button id="navNext" type="button" aria-label="Next slide">Next ›</button></span>

const $=s=>document.querySelector(s);
const IMG=n=>`<img class="shot" src="${IMGS[n]}" alt="">`;
const CARD=(hl)=>`<div class="callcard"><span class="cc-h">📞 ${CARDHEAD}</span>${CARDITEMS.map(([k,l,v])=>`<span class="cc-i${hl.includes(k)?' on':''}"><em>${l}</em>${v}</span>`).join('')}</div>`;
const slides=SLIDES();

/* ---- click-through call: no sound, one line per click ---- */
function bubble(box,role,text){
  const e=box.querySelector('.tr-empty');if(e)e.remove();
  const d=document.createElement('div');d.className='bub '+role;
  d.innerHTML=role==='sys'?text:`<em>${role==='csr'?CSR:CALLER}</em>${text}`;
  box.appendChild(d);box.scrollTop=box.scrollHeight;
}
function wireCall(el){
  el.querySelectorAll('.call').forEach(call=>{
    const key=call.dataset.call, lines=CALLS[key]||[];
    const ph=call.querySelector('.phone'),st=call.querySelector('.ph-state'),tr=call.querySelector('.transcript');
    const ans=call.querySelector('.b-ans'),nxt=call.querySelector('.b-next'),all=call.querySelector('.b-all'),rep=call.querySelector('.b-rep');
    const after=call.parentElement.querySelector('.after-call');
    let i=0;
    const reset=()=>{i=0;tr.innerHTML=`<div class="tr-empty">${call.dataset.empty||'The call shows up here when you answer.'}</div>`;
      ph.classList.toggle('ringing',call.dataset.ring!=='no');st.textContent=call.dataset.wait||'Ringing…';
      ans.style.display='';nxt.style.display='none';all.style.display='none';rep.style.display='none';if(after)after.style.display='none'};
    const done=()=>{nxt.style.display='none';all.style.display='none';rep.style.display='';st.textContent=call.dataset.end||'Call on hold.';if(after)after.style.display=''};
    const step=()=>{if(i<lines.length){const [r,t]=lines[i++];bubble(tr,r,t)} if(i>=lines.length)done()};
    ans.onclick=()=>{tr.innerHTML='';ph.classList.remove('ringing');st.textContent=call.dataset.on||'On the call';ans.style.display='none';nxt.style.display='';all.style.display='';step()};
    nxt.onclick=step;
    all.onclick=()=>{while(i<lines.length)step()};
    rep.onclick=reset;
    reset();
  });
}

/* ---- click-by-click reveal (same as Class 1) ---- */
const EXPAND=['grid3','cols','agenda','heard','shotrow','pair','journey','side','steps','compare'];
function fragsOf(el){
  if(el.querySelector('.call'))return [];
  const out=[];
  const walk=node=>{
    for(const c of node.children){
      if(c.matches('.kicker,h1,h2,.callcard,script,style,thead'))continue;
      if(c.matches('table.map')){c.querySelectorAll('tbody tr').forEach(r=>out.push([r]));continue}
      if(c.id==='quiz'){c.querySelectorAll(':scope > .q').forEach(q=>out.push([q]));continue}
      if(c.matches('.jarrow'))continue;
      if(c.matches('.jstep')){const a=c.previousElementSibling;out.push(a&&a.matches('.jarrow')?[a,c]:[c]);continue}
      const plainDiv=c.tagName==='DIV'&&!c.className&&!c.id;
      if(EXPAND.some(k=>c.classList.contains(k))||plainDiv){walk(c);continue}
      out.push([c]);
    }
  };
  walk(el);return out;
}
const FR=new Map();
function setupFrags(el,revealAll){
  let f=FR.get(el);if(!f){f={list:fragsOf(el),i:0};FR.set(el,f);f.list.flat().forEach(x=>x.classList.add('frag'))}
  f.i=revealAll?f.list.length:0;
  f.list.forEach((g,k)=>g.forEach(x=>x.classList.toggle('in',k<f.i)));
}
function revealNext(el){const f=FR.get(el);if(!f||f.i>=f.list.length)return false;f.list[f.i++].forEach(x=>x.classList.add('in'));return true}

/* ---- deck engine ---- */
const stage=$('#stage'),barfill=$('#barfill'),count=$('#count'),notesBody=$('#notes-body');
let cur=0;
slides.forEach(s=>{const el=document.createElement('section');el.className='slide'+(s.cls?' '+s.cls:'');el.innerHTML=s.html;stage.appendChild(el)});
const slideEls=[...stage.querySelectorAll('.slide')];
function show(n,dir=1){
  if(n<0||n>=slideEls.length)return;
  slideEls[cur].classList.remove('active');slideEls[cur].classList.toggle('exit-left',dir>0);
  cur=n;const el=slideEls[cur];el.classList.remove('exit-left');el.classList.add('active');
  setupFrags(el,dir<0);wireCall(el);
  barfill.style.width=((cur+1)/slideEls.length*100)+'%';
  count.textContent=(cur+1)+' / '+slideEls.length;
  notesBody.textContent=slides[cur].notes||'';
}
function next(){if(revealNext(slideEls[cur]))return;if(cur<slideEls.length-1)show(cur+1,1)}
function prev(){if(cur>0)show(cur-1,-1)}
show(0);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  else if(e.key==='Home')show(0);
  else if(e.key==='End')show(slideEls.length-1);
  else if(e.key==='n'||e.key==='N'){$('#notes').classList.toggle('open')}
});
stage.addEventListener('click',e=>{
  if(e.target.closest('#quiz,.call,button,a'))return;
  next();
});
$('#navPrev').addEventListener('click',e=>{e.stopPropagation();prev()});
$('#navNext').addEventListener('click',e=>{e.stopPropagation();next()});
document.querySelectorAll('.q').forEach(q=>{
  const opts=[...q.querySelectorAll('.opt')],ex=q.querySelector('.explain');
  opts.forEach(o=>o.addEventListener('click',()=>{
    if(q.dataset.done)return;q.dataset.done=1;
    opts.forEach(x=>{if(x.dataset.c!==undefined)x.classList.add('correct');else if(x===o)x.classList.add('wrong');else x.classList.add('dim')});
    ex.classList.add('show');
  }));
});

</script>
