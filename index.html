<style>
* { box-sizing: border-box; margin: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  background: #0f2133;
  display: grid;
  place-items: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 700px 400px at 80% 50%, rgba(26,122,109,0.18) 0%, transparent 70%),
    repeating-linear-gradient(120deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 52px);
  pointer-events: none;
}
.card {
  position: relative;
  background: #172d42;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 44px 48px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.4);
}
.logo {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 36px;
}
.logo-mark {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, #22a08f, #1a7a6d);
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-family: 'DM Mono', monospace;
  font-size: 14px;
  font-weight: 500;
  color: white;
}
.logo-text { line-height: 1.25; }
.logo-name { font-size: 15px; font-weight: 700; color: #fff; }
.logo-sub  { font-size: 13px; color: #7fa3be; }

h1 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px; }
.subtitle { font-size: 14px; color: #7fa3be; margin-bottom: 32px; }

.field { margin-bottom: 18px; }
label { display: block; font-size: 13px; font-weight: 600; color: #a8c4d8; margin-bottom: 7px; }
input {
  width: 100%;
  padding: 11px 14px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  color: #fff;
  font: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
input::placeholder { color: rgba(255,255,255,0.3); }
input:focus { border-color: #22a08f; }

.btn {
  width: 100%;
  padding: 12px;
  background: #1a7a6d;
  color: white;
  border: none;
  border-radius: 8px;
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.15s;
}
.btn:hover { background: #22a08f; }

.error {
  display: none;
  background: rgba(192,68,59,0.2);
  border: 1px solid rgba(192,68,59,0.4);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: #f5a09a;
  margin-top: 14px;
  text-align: center;
}
.error.show { display: block; }

.footer {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 12px;
  color: #4e6a80;
  text-align: center;
}
</style>

  <p class="subtitle">Sign in to access the training portal</p>

    </div>
    <div class="field">

    <button class="btn" type="submit">Sign in</button>

  </form>

  <div class="footer">
    Need access? Contact KRISTENB &nbsp;·&nbsp; Adleta Corporation

async function sha256Hex(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
}

async function doLogin(e) {
  e.preventDefault();
  const u = document.getElementById("username").value.trim().toLowerCase();
  const p = document.getElementById("password").value;
  const h = await sha256Hex(u + ":" + p);
  const match = USERS.find(x => x.user === u && x.hash === h);
  if (match) {
    sessionStorage.setItem("adleta_auth3", "ok");
    sessionStorage.setItem("adleta_user3", u);
    window.location.replace("portal.html");
  } else {
    document.getElementById("errorMsg").classList.add("show");
    document.getElementById("password").value = "";
    document.getElementById("password").focus();
  }
}
