function updDP(){const tot=NEXT_ACTIONS.length;const done=NEXT_ACTIONS.filter((_,i)=>ST[`act-${i}`]).length;const pct=Math.round(done/tot*100);const f=document.getElementById("dpf");const l=document.getElementById("dpl");if(f)f.style.width=pct+"%";if(l)l.textContent=pct+"%";}
function renderModules(){const mods=visibleModules();const el=document.getElementById("view-modules");let html=`<div class="sec-hd"><div><div class="sec-eyebrow">Training library</div><h2>${currentUserData.role==="admin"?"All Modules":"My Training"}</h2></div><input class="search-input" id="msr" type="search" placeholder="Search modules…"></div><div class="mod-grid" id="mgr">`;html+=mods.map(m=>{const pct=moduleProgress(m.id);return`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div><div class="tags">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% complete</div><div class="mod-links">${m.links.map(([l,u])=>`<a class="mod-link" href="${u}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">${l}</a>`).join("")}</div></div>`;}).join("");html+=`</div>`;el.innerHTML=html;document.getElementById("msr").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();const f=!q?mods:mods.filter(m=>[m.name,m.owner,m.weeks,m.summary,...m.programs].join(" ").toLowerCase().includes(q));const g=document.getElementById("mgr");if(!f.length){g.innerHTML='<div class="empty">No modules match.</div>';return;}g.innerHTML=f.map(m=>`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div></div>`).join("");});}
function openModuleDetail(mid){const m=MODULES[mid];if(!m)return;const el=document.getElementById("view-session");let html=`<button class="session-back" onclick="switchView('modules')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back to modules</button><div class="session-meta"><span class="pill ${m.pill}">${m.weeks}</span><span class="pill pill-gray">${m.sessions.length} sessions</span></div><div class="session-title">${m.name}</div><p style="margin-bottom:20px;font-size:14px">${m.summary}</p><div class="tags" style="margin-bottom:20px">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="sec-hd"><div><div class="sec-eyebrow">Sessions</div><h2>Choose a session to begin</h2></div></div><div class="mod-grid">`;html+=m.sessions.map((s,i)=>{const pct=sessionProgress(s.id);const sc=ST[`quiz-score-${s.id}`];const passed=sc>=70;return`<div class="mod-card" onclick="openSession('${m.id}','${s.id}')"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="pill pill-gray">Session ${i+1}</span>${passed?`<span class="pill pill-teal">✓ Passed ${sc}%</span>`:""}</div><h3>${s.title}</h3><div class="mod-owner">${s.duration}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% checklist done</div></div>`;}).join("");html+=`</div>`;el.innerHTML=html;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));el.classList.add("active");}
function openSession(mid,sid){const m=MODULES[mid];const s=m.sessions.find(s=>s.id===sid);if(!s)return;const el=document.getElementById("view-session");const sv=ST[`video-${sid}`]||"";const cpct=sessionProgress(sid);let html=`<button class="session-back" onclick="openModuleDetail('${mid}')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back to ${m.name}</button><div class="session-meta"><span class="pill ${m.pill}">${m.weeks}</span><span class="pill pill-gray">${s.duration}</span></div><div class="session-title">${s.title}</div><div class="session-body"><div class="session-content"><div class="card"><div class="card-title">Step-by-Step Walkthrough</div><table class="step-table"><thead><tr><th>#</th><th>Action in Infor M3</th><th>Details</th></tr></thead><tbody>${s.steps.map(([n,a,d])=>`<tr><td>${n}</td><td><b>${a}</b></td><td>${d}</td></tr>`).join("")}</tbody></table></div><div class="card"><div class="card-title">Knowledge Check Quiz</div><div class="quiz-wrap" id="qw">${buildQuiz(s)}</div></div></div><div class="session-sidebar"><div class="card"><div class="card-title">Training Video</div><div id="va">${sv?buildVideoEmbed(sv):'<div class="video-placeholder">No video added yet.<br><br>Paste a YouTube URL below.</div>'}</div><div class="video-input-wrap"><input class="video-input" id="vui" type="url" placeholder="Paste YouTube URL…" value="${sv}"><button class="btn btn-primary btn-sm" onclick="saveVideo('${sid}')">Add</button></div></div><div class="card"><div class="card-title">Session Checklist <span class="pill pill-teal" id="cpill">${cpct}%</span></div><div class="check-list">${s.checklist.map((item,i)=>`<label class="check-item"><input type="checkbox" ${ST[`chk-${sid}-${i}`]?"checked":""} onchange="saveCheck('${sid}',${i},this.checked)"><span>${item}</span></label>`).join("")}</div></div><div class="card"><div class="card-title">SharePoint Resources</div><div class="mod-links">${m.links.map(([l,u])=>`<a class="mod-link" href="${u}" target="_blank" rel="noreferrer">${l}</a>`).join("")}</div></div></div></div>`;el.innerHTML=html;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));el.classList.add("active");}
function buildVideoEmbed(url){const m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);if(!m)return'<div class="video-placeholder">Could not parse YouTube URL.</div>';return`<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe></div>`;}
function saveVideo(sid){const url=document.getElementById("vui").value.trim();ST[`video-${sid}`]=url;save();const a=document.getElementById("va");if(a)a.innerHTML=url?buildVideoEmbed(url):'<div class="video-placeholder">No video added.</div>';}
function saveCheck(sid,idx,checked){ST[`chk-${sid}-${idx}`]=checked;save();const pct=sessionProgress(sid);const p=document.getElementById("cpill");if(p)p.textContent=pct+"%";}
function buildQuiz(s){const score=ST[`quiz-score-${s.id}`];const ans=ST[`quiz-answers-${s.id}`];if(score!==undefined&&ans){const a=JSON.parse(ans);let html=s.quiz.map((q,qi)=>{const c=q.answer,ch=a[qi];return`<div class="quiz-q"><div class="quiz-q-text">${qi+1}. ${q.q}</div><div class="quiz-options">${q.options.map((opt,oi)=>`<div class="quiz-option ${oi===c?"correct":oi===ch&&ch!==c?"wrong":""}"><input type="radio" disabled ${oi===ch?"checked":""}><span>${opt}</span>${oi===c?" ✓":""}</div>`).join("")}</div></div>`;}).join("");html+=`<div class="quiz-result ${score>=70?"pass":"fail"}">${score>=70?"✓ Passed":"✗ Not yet passed"} — Score: ${score}%${score<70?`<br><button class="quiz-btn" style="margin-top:10px" onclick="retakeQuiz('${s.id}')">Retake Quiz</button>`:""}</div>`;return html;}return s.quiz.map((q,qi)=>`<div class="quiz-q"><div class="quiz-q-text">${qi+1}. ${q.q}</div><div class="quiz-options">${q.options.map((opt,oi)=>`<label class="quiz-option"><input type="radio" name="qz-${s.id}-${qi}" value="${oi}"><span>${opt}</span></label>`).join("")}</div></div>`).join("")+`<button class="quiz-btn" onclick="submitQuiz('${s.id}')">Submit Quiz</button>`;}
function submitQuiz(sid){const s=findSession(sid);if(!s)return;const ans=s.quiz.map((_,qi)=>{const sel=document.querySelector(`input[name="qz-${sid}-${qi}"]:checked`);return sel?parseInt(sel.value):-1;});if(ans.includes(-1)){alert("Please answer all questions first.");return;}const cor=ans.filter((a,i)=>a===s.quiz[i].answer).length;const sc=Math.round(cor/s.quiz.length*100);ST[`quiz-score-${sid}`]=sc;ST[`quiz-answers-${sid}`]=JSON.stringify(ans);save();document.getElementById("qw").innerHTML=buildQuiz(s);}
function retakeQuiz(sid){delete ST[`quiz-score-${sid}`];delete ST[`quiz-answers-${sid}`];save();const s=findSession(sid);if(s)document.getElementById("qw").innerHTML=buildQuiz(s);}
function renderRoadmap(){document.getElementById("view-roadmap").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">9-week path</div><h2>Roadmap</h2></div></div><div class="timeline">${PHASES.map(p=>`<div class="phase-card"><div class="phase-weeks">${p.weeks}</div><div class="phase-name">${p.name}</div><div class="phase-purpose">${p.purpose}</div><div class="phase-success">✓ ${p.success}</div></div>`).join("")}</div>`;}
function renderSuperUsers(){const us=Object.entries(USERS).filter(([,u])=>u.role!=="admin");document.getElementById("view-superusers").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Training cohort</div><h2>Super User Team</h2></div><span class="pill pill-teal">${us.length} confirmed</span></div><div class="su-grid">${us.map(([un,u])=>{const ini=u.name.split(" ").map(n=>n[0]).join("").substring(0,2);const mods=u.modules.filter(m=>m!=="all"&&m!=="all-readonly").map(id=>MODULES[id]?.name||id).join(", ");return`<div class="su-card"><div class="su-av" style="background:${u.color}">${ini}</div><div><div class="su-name">${u.name}</div><div class="su-dept">${u.dept}</div><div class="su-mod">${mods||"All modules"}</div></div></div>`;}).join("")}</div>`;}
function renderResources(){document.getElementById("view-resources").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Source library</div><h2>Training Resources</h2></div></div><div class="res-grid">${RESOURCES.map(r=>`<div class="res-card"><h3>${r.name}</h3><p>${r.summary}</p><a class="res-link" href="${r.url}" target="_blank" rel="noreferrer"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Open file</a></div>`).join("")}</div>`;}
function renderAdmin(){if(currentUserData.role!=="admin"){switchView("dashboard");return;}const rows=Object.entries(USERS).map(([un,u])=>{const mods=u.modules.includes("all")?"All":u.modules.filter(m=>m!=="all-readonly").map(id=>MODULES[id]?.name||id).join(", ");return`<tr><td><span class="status-dot dot-green"></span>${un}</td><td>${u.name}</td><td>${u.dept}</td><td>${u.role==="admin"?"Admin":"Super User"}</td><td style="font-size:11px">${mods}</td></tr>`;}).join("");const prows=Object.entries(USERS).filter(([,u])=>u.role!=="admin").map(([un,u])=>{const mm=u.modules.includes("all")?Object.values(MODULES):u.modules.filter(m=>m!=="all-readonly").map(id=>MODULES[id]).filter(Boolean);const ms=mm.flatMap(m=>m.sessions);const ps=ms.filter(s=>(ST[`quiz-score-${s.id}`]||0)>=70).length;const pct=ms.length?Math.round(ps/ms.length*100):0;return`<tr><td>${u.name}</td><td>${u.dept}</td><td>${ps} / ${ms.length}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="prog-track" style="width:80px"><div class="prog-fill" style="width:${pct}%"></div></div><span style="font-size:12px;color:var(--muted)">${pct}%</span></div></td></tr>`;}).join("");document.getElementById("view-admin").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Admin only</div><h2>Admin Panel</h2></div></div><div class="admin-grid"><div class="card"><div class="card-title">User Accounts</div><table class="user-table"><thead><tr><th>Username</th><th>Name</th><th>Department</th><th>Role</th><th>Modules</th></tr></thead><tbody>${rows}</tbody></table><p style="font-size:12px;color:var(--muted);margin-top:10px">To add/change users, edit the USERS object in portal.html on GitHub.</p></div><div class="card"><div class="card-title">Super User Progress</div><table class="user-table"><thead><tr><th>Name</th><th>Department</th><th>Sessions Passed</th><th>Progress</th></tr></thead><tbody>${prows}</tbody></table></div></div>`;}
if(!checkAuth())throw new Error("Not authenticated");
buildNav();buildUserPill();renderDashboard();
</script>
</body>
