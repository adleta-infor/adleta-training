[8,"Monitor through to delivery","Track both the customer order in OIS100 and the vendor PO in PPS200. When the vendor ships, they send confirmation. Update the order status. Invoice the customer upon confirmed delivery."]],quiz:[{q:"Drop ship orders in M3 use which line type?",options:["0","1","2","3"],answer:2},{q:"In a drop ship order, goods are shipped by:",options:["Adleta warehouse","A third-party logistics provider","The supplier directly to the customer","The customer picking up at Adleta"],answer:2},{q:"When you save a drop ship order line, M3 automatically creates a:",options:["Delivery note","Purchase Order linked to the customer order","Credit memo","Journal entry"],answer:1},{q:"Drop ship is used when:",options:["The item is in stock at Adleta","The customer wants will call","The product is not stocked in the Adleta warehouse and ships from supplier","The order is COD"],answer:2}],checklist:["I can create a drop ship order using line type 2 in OIS100","I understand that M3 automatically creates a linked PO for drop ship lines","I can verify the supply chain to confirm supplier and delivery address","I know when to use drop ship vs. ship from Adleta warehouse"]}]},
  financeAP:{id:"financeAP",name:"Finance — AP and AR",owner:"Philip Jones",weeks:"Week 6",pill:"pill-red",color:"#c0443b",programs:["APS100","APS200","ARS100","ARS200","ARS300"],summary:"Supplier invoices, payment runs, customer invoices, cash application, AR aging.",links:[["Deck",SP+"/Adleta_M3_Finance_APAR_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Finance_APAR_LearningGuide.docx"]],sessions:[{id:"fin-1",title:"AP Invoice Entry with PO Match — APS100",duration:"60 min",steps:[[1,"Open APS100 — Supplier Invoice Entry","Press Ctrl+R > APS100. click the + New button to create a new AP invoice. This is used to enter vendor invoices that have a corresponding Purchase Order in M3."],
[2,"Enter the vendor number","Type the vendor number and press Enter. M3 populates the vendor name and default payment terms. Confirm these match the invoice you are holding."],
[3,"Enter the invoice number, date, and amount","Enter the vendor invoice number exactly as it appears on the paper invoice. Enter the invoice date (vendor date, not today). Enter the gross invoice amount including any freight or charges on the invoice."],
[4,"Select the PO to match against","In APS100, click Match or press F14. M3 opens the PO matching screen. Enter the PO number from the invoice (vendors often print the Adleta PO number on their invoice). M3 shows the PO lines and receipt lines."],
[5,"Match invoice lines to PO receipt lines","For each invoice line, select the corresponding received PO line. M3 compares the invoice price and quantity to the PO price and received quantity. If they match exactly, the line is approved automatically."],
[6,"Handle a price variance","If the invoice price differs from the PO price, M3 flags a variance. Do NOT approve a price variance without checking with Purchasing. Contact the buyer — either the PO needs to be corrected or a credit memo is needed from the vendor."],
[7,"Handle a quantity variance","If the invoice quantity exceeds what was received, M3 will not allow the overage to post. Confirm with Purchasing and Receiving — either there was an unreported partial receipt or the vendor invoiced incorrectly."],
[8,"Approve and post the matched invoice","Once all lines match, approve the invoice. M3 posts the AP liability and sets the invoice for payment in the next payment proposal run. Confirm the invoice appears in the AP aging report."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20Invoice%20w%20Po%20(PO%20Match).mp4",quiz:[{q:"The Invoice Date field should contain:",options:["Today's date","The date you entered the invoice","The date on the vendor's invoice","The payment due date"],answer:2},{q:"To run the three-way match in APS100 you press:",options:["F3","F5","F14","F17"],answer:2},{q:"An invoice cannot be processed without:",options:["A shipping address","A valid PO reference","A GL account code","The vendor's email"],answer:1}],checklist:["I can enter a vendor invoice in APS100","I can run the three-way match using F14","I understand the match outcomes — matched vs variance","I know how to resolve a price discrepancy"]},{id:"fin-2",title:"AR Master Data — Customer Terms and Credit Setup",duration:"45 min",steps:[[1,"Open CRS610 — Customer Master","Press Ctrl+R > CRS610. Look up the customer by number or use the lookup icon to search by name. The Customer Master is the central record that controls how AR transactions post for this customer."],
[2,"Review payment terms on the customer","In CRS610, find the Payment Terms field. Confirm the terms match the customer contract (Net 30, Net 60, COD, etc.). Incorrect terms cause invoices to appear past due too early or too late in the aging."],
[3,"Review the credit limit","Find the Credit Limit field. Confirm it reflects the approved credit amount for this customer. A limit of zero may mean no credit is extended (COD only) or it may be blank if unlimited — confirm which with your trainer."],
[4,"Check the customer status and hold flag","Verify the customer status is Active. Check if there is a manual credit hold flag set. If the customer is on hold, all new orders will be blocked until the hold is removed by Collections."],
[5,"Review the customer invoice and statement settings","Check how invoices are delivered to this customer — email, mail, or EDI. Verify the invoice-to email address or EDI trading partner ID is correct. Incorrect settings mean customers do not receive their invoices."],
[6,"Review AR aging for the customer","From CRS610, navigate to Related > Open Items (or run the AR aging). Review the customer open balance, oldest unpaid invoice, and any unapplied cash. This gives context for any credit decision."],
[7,"Update a customer field if needed","If a field is incorrect (wrong terms, wrong email, wrong credit limit), select Change from the action menu. Update the field and save. Only update fields you are authorized to change — credit limit changes require manager approval."],
[8,"Add a new customer ship-to address if needed","If a customer needs a new delivery address, navigate to Related > Ship-To Addresses from CRS610. click the + New button to add a new ship-to. Enter the address, route assignment, and delivery instructions. Save."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/FINANCE/AR%20-%20Finance%20Master%20Data%20List%20Configuration-20241211_083423-Meeting%20Recording.mp4",quiz:[{q:"Unapplied customer payments appear as:",options:["Paid invoices","Open credits on the customer account","Revenue in the GL","Errors in ARS300"],answer:1},{q:"For a partial payment, you should apply to:",options:["The newest invoices first","The largest invoices first","The oldest invoices first","Any invoice randomly"],answer:2},{q:"A customer with 90+ days past due balance should be:",options:["Ignored until they call","Escalated to management for possible collections","Given an automatic credit hold by M3","Sent a new invoice"],answer:1}],checklist:["I can apply a customer payment to invoices in ARS200","I know how to handle partial payments","I can read and act on the AR aging report in ARS300","I know when to escalate overdue accounts to management"]},{id:"fin-3",title:"AP Payment Proposal — In-House Check (CH1)",duration:"60 min",steps:[[1,"Open APS130 — Supplier Payment Proposal","Press Ctrl+R > APS130/B. This is the AP payment proposal screen used to select invoices for payment and generate checks. click the + New button to create a new proposal."],
[2,"Set the payment date and bank account","Enter the payment date (the date checks will be issued). Select the correct bank account (confirm the CH1 / in-house check bank account with your trainer). Set the currency if needed."],
[3,"Set the invoice due date cutoff","Enter the due date range — typically all invoices due on or before the payment date. M3 will pull all matching invoices into the proposal."],
[4,"Review the proposal list","M3 lists all AP invoices selected for payment. Review each vendor, invoice number, and amount. Look for: invoices on hold (should not pay), disputed invoices, or duplicate invoice numbers."],
[5,"Remove invoices that should not be paid this run","For any invoice that should not be paid (on hold, in dispute, pending credit memo), select the line and choose Exclude or Delete from the proposal. Document why it was excluded."],
[6,"Approve the payment proposal","Once the list is clean, approve the proposal. M3 locks the invoices and prepares them for check printing."],
[7,"Print the checks","Navigate to the check print function (confirm the menu path with your trainer). Select the approved proposal. Load blank check stock in the printer. Print. M3 prints each check with the Fifth Third Bank format — vendor name, amount, invoice details."],
[8,"Verify printed checks and post the proposal","After printing, verify each check number and amount are correct. Void and reprint any that misprinted. Post the proposal — M3 closes the AP invoices, records the bank outflow, and updates the GL cash account."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Payment%20Proposal%20CH1%20(Check%20in-house).mp4",quiz:[{q:"Before executing a payment run in APS200, you must:",options:["Automatically run the full proposal without review","Review every invoice in the proposal and remove any that should not be paid this cycle","Get approval from IT","Run the GL period close first"],answer:1},{q:"If a check is lost after a payment run, your first step is:",options:["Re-run the payment immediately","Void the original payment before reissuing — never reissue without voiding first","Contact the supplier and ask them to ignore the original","Wait 30 days"],answer:1},{q:"The due date cutoff parameter in APS200 controls:",options:["When the bank transmits the ACH file","Which invoices are included — only invoices due on or before that date","The accounting period for the GL posting","The payment method — check or ACH"],answer:1},{q:"After a payment run completes, you should:",options:["Close the period immediately","Review AP aging to confirm paid invoices are closed and investigate any that are still open","Send remittances to all suppliers","Archive the invoices in SharePoint"],answer:1}],checklist:["I can set payment parameters in APS200 — payment date, bank account, method, and due date cutoff","I review every invoice in the proposal before approving the run","I know how to remove an invoice from a payment proposal and document the reason","I can execute a payment run and confirm paid invoices are closed in AP aging","I know the correct process for a lost check or returned ACH — void before reissuing","I escalate payment exceptions to Finance management before taking action"]},{id:"fin-4",title:"Holding an AP Invoice — APS205",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20AP%20Display%20(APS205)%20Hold%20Invoice%20.mp4",steps:[[1,"Identify the invoice that needs to be placed on hold","You may need to hold an invoice because: the vendor is disputing the amount, a credit memo is pending, the goods were returned, or the invoice is a duplicate. Get the invoice number and vendor."],
[2,"Open APS205 — AP Invoice Display","Press Ctrl+R > APS205. Search for the invoice by vendor number and invoice number. Review the invoice details — amount, due date, PO match status, and current hold status."],
[3,"Select the invoice and choose Hold","With the invoice selected, right-click and select Hold (or use the action menu). M3 prompts for a hold reason or hold code. Select the appropriate reason (dispute, credit pending, duplicate, etc.)."],
[4,"Enter a hold note","In the notes or comment field, enter a clear explanation: why the invoice is on hold, who authorized the hold, and what needs to happen before it can be paid (e.g., waiting for credit memo from vendor, waiting for receiving confirmation)."],
[5,"Confirm the hold is applied","After saving, verify the invoice status in APS205 shows as On Hold. The invoice will not appear in future payment proposals until the hold is removed."],
[6,"Notify the vendor if appropriate","If the hold is due to a dispute, contact the vendor to explain the issue and what they need to provide (corrected invoice, credit memo, proof of delivery). Document the communication in the invoice notes."],
[7,"Monitor the hold and follow up","Review held invoices weekly. If the issue is resolved (credit memo received, receiving confirmed), remove the hold. Open APS205, select the invoice, and choose Release Hold. Add a note that the hold is released and why."],
[8,"Remove the hold when resolved","Once the dispute or issue is resolved, open APS205, find the held invoice, and select Remove Hold. The invoice will now appear in the next payment proposal run on its next due date."]],quiz:[{q:"Invoice holds are managed in which M3 program?",options:["APS100","APS200","APS205","PPS200"],answer:2},{q:"After reversing an invoice, M3 automatically:",options:["Pays the vendor","Creates an offsetting GL entry","Cancels the related PO","Emails the vendor"],answer:1},{q:"A common reason to hold an invoice is:",options:["The vendor is a new account","A price or quantity discrepancy requiring vendor clarification","The warehouse is busy","The PO was cancelled"],answer:1},{q:"After resolving a hold, you must ___ before payment can process:",options:["Create a new invoice","Delete the hold record","Release the hold in APS205","Re-enter the PO"],answer:2}],checklist:["I can place an invoice on hold using APS205","I can release an invoice hold after resolution","I can reverse a posted invoice in APS200","I understand the GL impact of a reversed invoice","I know when to hold vs. reverse an invoice"]},{id:"fin-5",title:"AP Payment Proposal — Wire Transfer (WID)",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Payment%20Proposal%20WID%20(Wire).mp4",steps:[[1,"Identify invoices approved for wire payment","Wire transfers are used for specific vendors (large international suppliers, urgent payments, or vendors who do not accept checks). Confirm which vendors are set up for wire payment in M3 — check with your trainer or AP manager."],
[2,"Open APS130 — Supplier Payment Proposal","Press Ctrl+R > APS130/B. click the + New button to create a new payment proposal. Set the payment method to WID (Wire) instead of check. Select the correct bank account for wire payments."],
[3,"Set the payment date and filter for wire vendors","Enter the wire payment date. Filter the vendor selection to include only vendors approved for wire payment this run. Set the invoice due date cutoff."],
[4,"Review the wire payment proposal","M3 lists all invoices selected for wire payment. Review each carefully — wire transfers are immediate and difficult to reverse. Verify vendor bank details are on file and correct in M3 before approving."],
[5,"Confirm vendor bank details are current","For each vendor in the proposal, verify in CRS620 that the ACH/wire routing number and account number are correct and current. If bank details are missing or outdated, DO NOT process the wire — contact the vendor to update before proceeding."],
[6,"Get required approval for wire payments","Wire transfers above a certain threshold require additional approval. Confirm the authorization matrix with your AP manager. Do not process large wire payments without the required sign-off."],
[7,"Approve and process the wire proposal","Once all details are verified and approvals are in place, approve the payment proposal. M3 generates the wire transfer file. Submit the file to Fifth Third Bank per the established process."],
[8,"Confirm bank receipt and post in M3","After the bank confirms the wire was sent, post the payment proposal in M3. M3 closes the AP invoices and records the bank outflow. Save the bank wire confirmation for your records."]],quiz:[{q:"Wire payments in M3 use payment method code:",options:["CH1","WC","WID","ACH"],answer:2},{q:"Before running a wire payment proposal, invoices must be:",options:["On hold","Approved and in payable status","Entered today","Matched to a PO"],answer:1},{q:"After confirming the payment proposal in M3, what additional step is required?",options:["Nothing — the wire is sent automatically","Coordinate with Finance to initiate the actual bank transfer","Void the invoices","Print a check"],answer:1},{q:"Wire payment proposals are run from:",options:["PPS200","APS200","APS100","CRS620"],answer:2}],checklist:["I can create an AP wire payment proposal in APS100","I know how to select the correct bank account and payment date","I understand that confirming in M3 does not initiate the actual bank transfer","I can review and confirm a payment proposal before processing","I know the post-wire bank confirmation step"]},{id:"fin-6",title:"Voiding an AP Check",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Void%20Check.mp4",steps:[[1,"Identify the check that needs to be voided","Get the check number, vendor, amount, and payment date. Common reasons to void a check: check printed incorrectly, check was lost or stolen, vendor did not receive it, or payment was made in error."],
[2,"Confirm the check has not been cashed","Before voiding, confirm with the bank that the check has not cleared. A check that has already been cashed cannot be voided in M3 — a stop payment and manual journal entry may be needed instead. Contact your AP manager if the check has cleared."],
[3,"Open the AP payment history or check register","Navigate to APS > Payment History or Check Register (confirm the program with your trainer). Search for the check by check number or vendor. Confirm the check details match."],
[4,"Select the check and choose Void","Select the check and choose the Void action from the action menu. M3 prompts you to confirm. Enter the void date (usually today) and a void reason."],
[5,"Confirm what happens to the invoices","When a check is voided, M3 reopens the AP invoices that were paid by that check. Confirm the invoices are now showing as open/unpaid in APS205. They will need to be included in the next payment proposal run."],
[6,"For a lost/stolen check — place a stop payment with the bank","If the check was lost or stolen, immediately call Fifth Third Bank and request a stop payment on the check number. Document the stop payment confirmation number. Then void the check in M3."],
[7,"Reissue the check if needed","If the check needs to be reissued (vendor still needs payment), include the reopened invoices in the next payment proposal run. Generate and send a new check to the vendor."],
[8,"Document the void","Add a note in M3 to the payment record or vendor account documenting: void date, reason, stop payment confirmation number (if applicable), and whether a replacement check was issued. This is important for audit."]],quiz:[{q:"After voiding a check, the invoice status in M3 returns to:",options:["Cancelled","Unpaid/Approved for Payment","Posted","On Hold"],answer:1},{q:"A check would typically be voided when:",options:["The vendor requests early payment","It was lost, damaged, or issued with incorrect details","The PO was over-received","Month-end close is running"],answer:1},{q:"To re-issue a check after voiding, you create a:",options:["New vendor record","New invoice entry","New payment proposal for the same invoice","Manual GL journal entry"],answer:2},{q:"Voiding a check in M3 does which of the following?",options:["Cancels the invoice permanently","Reverses the payment entry and restores the invoice","Notifies the vendor automatically","Closes the PO"],answer:1}],checklist:["I can void a check payment in M3","I understand what happens to the invoice after a void","I can create a new payment proposal to re-issue a check","I know how to document a void for audit purposes","I know when to void vs. reverse a payment"]},
{id:"fin-7",title:"Lockbox and AP Check Printing",duration:"35 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Lockbox%20Demo.mp4",steps:[[1,"Receive the daily lockbox file notification","Each morning, confirm the bank has sent the lockbox data file. Check your email or the shared drive for the daily lockbox file from Fifth Third Bank. Note the total dollar amount — you will verify this against M3 after import."],
[2,"Import the lockbox file in M3","In M3, navigate to AR > Lockbox Import (confirm the exact menu path with your trainer). Select the lockbox file and run the import. M3 reads the payment data and attempts to match each payment to an open AR invoice by customer number and invoice number."],
[3,"Review unmatched payments","After import, M3 shows a list of unmatched payments — items the system could not automatically apply. For each one, search the customer account in M3 to find the correct open invoice. Manually apply the payment to the invoice."],
[4,"Verify total and post the lockbox batch","Confirm the total of all matched and manually applied payments equals the bank lockbox total. Then post the batch. M3 closes matched invoices, updates customer AR balances, and records the deposit to the GL cash account."],
[5,"Run the End of Day Cash Posting report","Navigate to the AR reports menu and run the End of Day Cash Posting report. Compare the posted total to the bank statement deposit. If there is a difference, review unposted items before closing the day."],
[6,"Create a payment proposal in APS130","Open APS130/B — Supplier Payment Proposal. Set the payment date and bank account. M3 lists all AP invoices due on or before that date. Review the list — verify vendor names, invoice numbers, and amounts. Remove any invoices that should not be paid this run."],
[7,"Print checks from the approved proposal","Approve the payment proposal. Navigate to the check printing function and select the proposal. M3 prints each check using the Fifth Third Bank format on blank check stock — company name, bank routing/account numbers, payee, amount, and remittance details print automatically."],
[8,"Record check numbers and file printed checks","After printing, verify each check number printed correctly in M3. Void and reprint any that misprinted. File or scan printed checks per Adleta policy. Run the AP History File Audit at month end to reconcile all check payments to GL accounts."]],quiz:[{q:"What is the main purpose of lockbox processing?",options:["To print vendor checks","To automate customer payment posting from bank data","To create purchase orders","To reconcile inventory"],answer:1},{q:"After lockbox payments are matched to invoices, the next step is:",options:["Print checks","Post the lockbox batch to update AR and GL","Call the customer","File a credit memo"],answer:1},{q:"AP checks at Adleta are printed using which format?",options:["Standard M3 format","AHF EDI format","Fifth Third Bank required check format","Concur expense format"],answer:2},{q:"Which M3 screen is used to create and approve a payment proposal for check printing?",options:["PPS300","APS130/B","ROO 02","CYC 5"],answer:1}],checklist:["Understand how lockbox processing works","Can receive and validate a lockbox import file in M3","Can review and manually apply unmatched lockbox payments","Can post a lockbox batch and reconcile with bank statement","Understand AP check printing setup (Fifth Third Bank format)","Can create and review a payment proposal in APS130/B","Can initiate and complete the check printing process","Can run AP History File Audit for monthly reconciliation"]}
]},
  financeGL:{id:"financeGL",name:"Finance — General Ledger",owner:"Philip Jones",weeks:"Week 6",pill:"pill-red",color:"#c0443b",programs:["GLS040","GLS100","GLS050","GLS910","GLS990"],summary:"Chart of accounts, journal entries, period close, GL inquiry, financial reports.",links:[["Deck",SP+"/Adleta_M3_Finance_GL_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Finance_GL_LearningGuide.docx"]],sessions:[{id:"gl-1",title:"AP and GL Master Data — Account String Setup",duration:"60 min",steps:[[1,"Understand the GL account string at Adleta","An account string in M3 is a combination of: Company + Division + Department + GL Account + Cost Center. Every AP invoice and transaction posts to a specific account string. Incorrect strings cause GL mispostings that require reversals."],
[2,"Open GLS040 — GL Account Master","Press Ctrl+R > GLS040 (or confirm program with trainer). Look up a GL account number. Review the account description, account type (asset, liability, expense, revenue), and whether the account is active."],
[3,"Look up the AP liability account","Find the AP trade payable account used for vendor invoices. In APS100 (AP invoice entry), M3 defaults the liability to this account when you post an AP invoice. Confirm you know which GL account is the AP trade payable account for Adleta."],
[4,"Review cost center assignments","Navigate to the cost center master (confirm program with trainer). Review which cost centers are assigned to each department. When AP invoices are coded to a department, the correct cost center must be used."],
[5,"Look up a division code","Confirm the division codes Adleta uses (by branch or company entity). Division is part of the account string — make sure invoices for each branch post to the correct division."],
[6,"Practice changing the account string on an AP invoice","In APS200 (AP invoice change), find a test invoice. Navigate to the account coding section. Change the division, department, or cost center. Verify the new account string is valid in GLS040. Do NOT save on a live invoice without authorization."],
[7,"Review the account string on a posted invoice in APS205","Open APS205 and find a recently posted invoice. Review the full account string that was used. Confirm it matches the expected GL coding for that vendor and expense type."],
[8,"Identify who to contact for account coding questions","When you are unsure which GL account, cost center, or division to use, contact the Controller or GL accountant. Do not guess — a miscode requires a journal entry to correct."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/FINANCE/AP-%20Finance%20Master%20List%20Configuration-20241205_093242-Meeting%20Recording.mp4",quiz:[{q:"A journal entry will be rejected by M3 if:",options:["It has a description","Debits do not equal credits","It is entered before noon","It references more than 2 accounts"],answer:1},{q:"After closing a period in GLS050:",options:["Entries can still be posted","No further postings are allowed","The period reopens automatically","Finance receives an email"],answer:1},{q:"All manual journal entries must have:",options:["A vendor reference","A customer number","Clear description and supporting documentation","A purchase order number"],answer:2}],checklist:["I can create a balanced journal entry in GLS100","I understand when to use reversing vs standard journal entries","I can complete the period close checklist steps","I know how to reopen a period with manager authorization if needed"]},{id:"gl-2",title:"Change GL Coding and Reverse an AP Invoice — APS200",duration:"45 min",steps:[[1,"Identify the invoice with incorrect GL coding","Get the vendor, invoice number, and the correct account string it should have been coded to. Common reason: invoice was posted to the wrong cost center, department, or GL account."],
[2,"Open APS200 — AP Invoice Change","Press Ctrl+R > APS200. Search for the invoice by vendor number and invoice number. Review the current account string (company, division, department, GL account, cost center)."],
[3,"Change the account string on the invoice","Select the invoice line and choose Change. Update the incorrect field — division, cost center, GL account, or department — to the correct value. Verify the new account string is valid. Save."],
[4,"If the invoice is already posted — reverse it instead","If the invoice has already been posted to the GL and the period is still open, you need to reverse it. Select the invoice and choose Reverse (confirm the action with your trainer). M3 creates a reversing entry with negative amounts."],
[5,"Confirm the reversal entry","After reversing, open GLS200 or the GL inquiry to confirm the reversal entry posted. The original debit and the reversal credit should now net to zero in the GL."],
[6,"Re-enter the invoice with correct GL coding","After the reversal, return to APS100 and re-enter the invoice with the correct account string. Enter all the same details (vendor, invoice number, date, amount) but with the corrected coding. Post the corrected invoice."],
[7,"Verify the corrected posting in the GL","Open GLS200 or GL inquiry and look up the affected GL account. Confirm: the original incorrect posting, the reversal, and the corrected posting all appear. The net effect in the wrong account should be zero."],
[8,"Notify your GL accountant","Inform the Controller or GL accountant about the reversal and recode so they are aware of the activity in the GL. Provide the invoice number, original coding, corrected coding, and reason. This supports month-end reconciliation."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20AP%20Display%20(APS200)%20Change%20Acc%20String%20and%20Reverse%20Invoice.mp4",quiz:[{q:"A non-posting account in GLS040 means:",options:["The account is closed","Transactions must be posted to detail accounts below it, not to this account directly","The account requires manager approval","The account is only used for reporting"],answer:1},{q:"In GLS910 you can drill into a transaction to see:",options:["The vendor's contact details","The source document — journal entry, invoice, or payment — that created the posting","The budget for that account","The period close status"],answer:1},{q:"The correct way to find why a GL account balance changed in a period is:",options:["Run a new journal entry","Open GLS910, enter the account and period, and review the transaction detail","Ask IT to run a report","Check the AR aging in ARS300"],answer:1},{q:"Account ranges in the Adleta chart of accounts are organized by:",options:["Alphabetical order","Department name","Account type — assets, liabilities, equity, revenue, expense","Transaction date"],answer:2}],checklist:["I can navigate the chart of accounts in GLS040 and identify account types","I can distinguish between posting and non-posting accounts","I can run a GL inquiry in GLS910 for any account and period","I can drill into a transaction to find its source document","I can export GL inquiry results to Excel"]},{id:"gl-3",title:"Automatic Bank Reconciliation in M3",duration:"45 min",steps:[[1,"Obtain the bank statement file","At month end (or more frequently), obtain the electronic bank statement file from Fifth Third Bank. This is typically a BAI2 or CSV file that lists all cleared transactions — deposits, checks cleared, wire payments, fees."],
[2,"Open the bank reconciliation program in M3","Navigate to GLS (GL) > Bank Reconciliation > Import Bank Statement (confirm the exact menu path with your trainer). This is the automatic reconciliation module that matches bank transactions to M3 book entries."],
[3,"Import the bank statement file","Select the bank account and import the statement file from the bank. M3 reads each transaction — check number, amount, cleared date — and attempts to match it to corresponding entries in the GL cash account."],
[4,"Review auto-matched items","M3 displays items it automatically matched — checks that cleared, deposits that posted, wires that were confirmed. Review the matched items to confirm the matches are correct (correct check number, correct amount, correct date)."],
[5,"Review unmatched bank items","M3 shows transactions on the bank statement that it could NOT match to a book entry. These require investigation: bank fees not recorded in M3, deposits in transit, or errors. Create a journal entry for any bank fees that need to be recorded."],
[6,"Review unmatched book items","M3 shows entries in the GL cash account that did NOT appear on the bank statement — these are outstanding checks (issued but not yet cashed) or deposits in transit. Verify the list is reasonable and matches the prior month reconciliation."],
[7,"Resolve outstanding items","For each unmatched item, determine: Is it a timing difference (outstanding check)? Is it an error? Contact the bank if a transaction appears on the bank statement but cannot be identified. Contact AP if a check is very old and uncashed — it may need to be voided."],
[8,"Complete and post the reconciliation","Once all differences are identified and explained, approve the reconciliation in M3. Print the bank reconciliation report and file it. The ending book balance should equal the bank statement balance plus/minus reconciling items."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/FINANCE/Automatic%20Bank%20Reconciliation%20Demo-20240711_140316-Meeting%20Recording.mp4",quiz:[{q:"On a balance sheet, total assets must equal:",options:["Total revenue minus total expenses","Total liabilities plus equity","Net income plus equity","Total debits minus total credits"],answer:1},{q:"Before closing a period, the balance sheet shows a discrepancy. You should:",options:["Close the period anyway and fix it next month","Export to Excel and adjust the spreadsheet","Flag it immediately and do not close until resolved","Repost all journal entries"],answer:2},{q:"The GLS990 parameter that controls whether you see one division or the full company is:",options:["Period","Financial year","Accounting dimension","Report type"],answer:2},{q:"Year-to-date figures in GLS990 represent:",options:["Only the current period","The cumulative total from the start of the financial year through the selected period","The prior year comparison","The budget for the year"],answer:1}],checklist:["I can run a balance sheet and income statement in GLS990","I can select the correct period, year, and accounting dimension","I can compare current period to prior period and identify variances","I know what to do if the balance sheet is out of balance","I can export financial reports and file them to SharePoint"]},{id:"gl-4",title:"AR Debit Note Write Off",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AR%20Debit%20Note%20Write%20Off.mp4",steps:[[1,"Identify the debit note or small balance to write off","Get the customer account, debit note number, and amount. Write-offs are used for: small underpayments (rounding differences), uncollectible balances below the write-off threshold, or agreed deductions. Confirm the write-off is authorized per Adleta policy."],
[2,"Open ARS (AR) > Debit Note or Open Item","Navigate to the AR open items for the customer (confirm the program with your trainer — ARS120 or similar). Find the debit note or open balance to be written off."],
[3,"Review the item before writing off","Confirm: the amount, the original invoice it relates to, and the age. For any write-off above the threshold (confirm dollar limit with your AR manager), management approval is required before proceeding."],
[4,"Select Write Off from the action menu","Select the debit note or open balance. Choose Write Off from the action menu. M3 prompts for a write-off reason code and GL account to charge the write-off to."],
[5,"Enter the write-off reason code","Select the appropriate reason code: small balance rounding, uncollectible, approved customer deduction, etc. Using the correct reason code ensures the write-off is tracked properly in AR reporting."],
[6,"Enter the GL account for the write-off","M3 will debit the bad debt or write-off expense account. Confirm the correct GL account with your GL accountant. The account used depends on the reason — bad debt expense vs. sales adjustment vs. freight adjustment."],
[7,"Post the write-off","Confirm and post the write-off. M3 closes the open AR item and records the expense to the designated GL account. The customer account balance is reduced by the write-off amount."],
[8,"Notify the customer if applicable","If the write-off was for a disputed amount or an agreed deduction, send the customer confirmation that the balance has been cleared. Document the resolution in the customer account notes in M3."]],quiz:[{q:"A debit note in AR represents:",options:["A payment received from a customer","A disputed charge or customer claim against an Adleta invoice","A credit memo issued to a new customer","A GL journal entry"],answer:1},{q:"When a debit note is approved for write-off, M3 posts an entry to:",options:["The vendor account","The write-off GL account","The customer deposit account","The PO budget"],answer:1},{q:"When approved for credit, M3 creates a:",options:["New customer order","Credit memo applicable to future invoices","Refund check","Debit to the AR account"],answer:1},{q:"AR debit note management at Adleta is owned by:",options:["Warehouse","Customer Service","Finance/Credit department","Purchasing"],answer:2}],checklist:["I can view and review open AR debit notes in M3","I understand the difference between write-off and credit approval","I can process a debit note for write-off with the correct GL account","I can process a debit note for credit memo","I know when to escalate a debit note to management for approval"]},{id:"gl-5",title:"AR Tickler Notes — Collections Follow-Up",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AR%20Tickler%20Notes.mp4",steps:[[1,"Understand what AR Tickler Notes are","Tickler notes are a collections tool in M3 that lets the AR team schedule and track follow-up actions for past-due customers. Each note has a follow-up date — on that date, the note appears in your queue as a reminder to call, email, or escalate."],
[2,"Open the AR Tickler / Collections program","Navigate to AR > Collections > Tickler Notes (confirm the program with your trainer — ARS440 or similar). Your queue shows all customers with notes due for follow-up today."],
[3,"Review today's follow-up queue","Open the tickler list. Each line shows: customer name, balance, oldest invoice, and the note from your last contact. Work through each customer in the queue before adding new notes."],
[4,"Open a customer and review the account","Click into a customer. Review their AR aging, open invoices, and previous tickler note history. Understand the full picture before making contact — how much do they owe, how old is it, what was the last communication."],
[5,"Make contact and document the call or email","Call or email the customer. Document exactly what was discussed: promised payment date and amount, dispute raised, request for invoice copy, or no answer. Enter this in the tickler note text field."],
[6,"Set the next follow-up date","After documenting the contact, set the next follow-up date — when do you need to check back? If the customer promised to pay by Friday, set the follow-up for the following Monday to confirm payment posted."],
[7,"Escalate if needed","If a customer has missed multiple promised payment dates or is unresponsive, escalate to your AR manager. Add a note documenting the escalation. The manager may authorize a credit hold, a collection agency referral, or a payment plan."],
[8,"Mark resolved when the account is current","When a customer pays all past-due balances, open the tickler and mark it resolved. Add a final note: payment received, amount, date, and check/wire number. This closes the collection activity for that account."]],quiz:[{q:"Tickler notes in M3 AR are primarily used for:",options:["Recording GL journal entries","Accounts receivable collection follow-up tracking","Entering new customer orders","Processing AP payments"],answer:1},{q:"A tickler note should include at minimum:",options:["Just the customer number","Note text, follow-up date, and assigned collector","Only the invoice amount","The vendor name"],answer:1},{q:"Invoice-level ticklers differ from account-level ticklers because:",options:["They cost more to process","They are tied to a specific invoice rather than the full account","They can only be created by managers","They expire automatically"],answer:1},{q:"After resolving a collection issue, you should:",options:["Delete the tickler note","Leave the tickler open indefinitely","Close the tickler with a resolution note","Create a new debit note"],answer:2}],checklist:["I can create a tickler note at the account and invoice level","I can assign tickler notes with due dates and priority","I can close a resolved tickler with a resolution note","I review open ticklers as part of my daily collection routine","I know how to escalate overdue ticklers per Adleta policy"]}]},
  logistics:{id:"logistics",name:"Logistics / Transportation",owner:"Abbey Parker",weeks:"Week 5-6",pill:"pill-blue",color:"#5b7fa6",programs:["OIS300","MWS410","MWS420","DRS001","OIS600"],summary:"Carrier setup, delivery management, shipment tracking, freight coordination, and logistics reporting.",links:[],sessions:[{id:"log-1",title:"Pick and Pack — Will Call Order",duration:"60 min",steps:[[1,"Receive the will call pick ticket from Order Desk","The counter or order desk prints a pick ticket when a will call order is released. The warehouse receives the pick ticket with: order number, customer name, items, quantities, and warehouse locations."],
[2,"Verify the pick ticket in MWS420 or the WMS","Open the warehouse management screen (MWS420 or confirm the program with your trainer). Find the will call order. Confirm the order status is released and available for picking."],
[3,"Pick the items by warehouse location","Go to the locations listed on the pick ticket. Pick the exact item numbers and quantities. For shade/lot-managed items (carpet, LVP), note the lot number on the pick ticket — you must pick from the lot allocated by the system."],
[4,"Verify quantities match the pick ticket","After picking, count the items and confirm quantities match the pick ticket exactly. If there is a discrepancy (item not in the location, wrong quantity), do NOT substitute — notify the order desk immediately."],
[5,"For lot-managed items — confirm the shade match","If the order has a AAA allocation, confirm the lot/shade you picked matches what M3 allocated. If you find a different lot in the location, stop and contact Purchasing before switching lots — shade mismatches cause customer complaints."],
[6,"Stage the order for customer pickup","Move the picked items to the will call staging area. Label the order with the customer name and order number. Keep will call orders separate from delivery route orders."],
[7,"Update M3 when items are staged","In MWS420 (or the appropriate screen), update the order status to confirm picking is complete. This notifies the order desk that the order is ready for the customer."],
[8,"Release to the customer at pickup","When the customer arrives, verify their name and order number. Count the items with the customer. Have them sign the packing list/POD. Give them their copy. Complete the delivery in M3 to close the order."]],videoUrl:"",quiz:[{q:"Before booking a carrier for a shipment, you must verify:",options:["The GL account for freight expense","Ship-to address, item, quantity, UOM, and requested delivery date are correct","The customer's credit status","The purchase order is approved"],answer:1},{q:"Freight terms Prepaid means:",options:["The customer pays freight at delivery","Adleta pays freight and the cost is included in the invoice","A third party account is billed","Freight is free"],answer:1},{q:"After a carrier picks up a shipment, you must:",options:["Wait for the customer to confirm receipt","Enter the carrier tracking number on the delivery record in M3","Call the warehouse to confirm","Create a new sales order for the next shipment"],answer:1},{q:"If a carrier cannot pick up on time, your first action is:",options:["Cancel the shipment","Contact Sales / CS immediately so they can communicate with the customer","Wait until the next day","Re-assign the order to a different warehouse"],answer:1}],checklist:["I can review deliveries ready for carrier pickup in MWS410","I can assign a carrier, service type, and freight terms to a delivery","I always enter the tracking number after carrier pickup","I know how to confirm a delivery and update the order status in M3","I know the exception process for late pickup or damaged shipment"]},{id:"log-2",title:"Common Carrier Shipping — Order to Shipment",duration:"45 min",steps:[[1,"Identify orders assigned to common carrier","In OIS100 or the dispatch screen, filter orders by ship via = common carrier (UPS, FedEx, LTL freight, etc.). Common carrier orders ship via an outside transportation company rather than Adleta delivery trucks."],
[2,"Verify carrier assignment on the order","Open the customer order in OIS100. Review the Ship Via field. Confirm the correct carrier is assigned. If the customer specified a carrier preference or has a negotiated carrier account, verify it is set correctly."],
[3,"Generate a packing list and BOL","Navigate to the shipping menu. Print the packing list for the order. For LTL shipments, generate a Bill of Lading (BOL) — confirm the program with your trainer (DPS or similar). The BOL lists shipper, consignee, commodity, weight, and freight class."],
[4,"Weigh and measure the shipment","Physically weigh the packed shipment. Confirm the weight against the BOL. For LTL freight, verify the freight class is correct — misclassification leads to freight bill adjustments."],
[5,"Schedule the carrier pickup","Contact the carrier (or use their online portal) to schedule a pickup. Provide the BOL number, shipment details, and pickup window. For FedEx/UPS, generate a shipping label from their system and attach to the carton."],
[6,"Update M3 with the carrier tracking number","Once the carrier generates a tracking number or PRO number, enter it in M3 on the customer order (confirm the field with your trainer). This allows order desk and customers to track the shipment."],
[7,"Confirm departure and update order status","When the carrier picks up the shipment, update the order status in M3 to shipped/departed. This triggers the invoice process for terms customers."],
[8,"Handle freight claim if goods arrive damaged","If the customer reports damaged goods, file a freight claim with the carrier immediately (most carriers require claims within 5 business days). Document the damage with photos. Contact Adleta's logistics manager to initiate the claim process."]],videoUrl:"",quiz:[{q:"An order that is released to warehouse but not yet shipped and is past its requested delivery date should be:",options:["Cancelled and re-entered","Escalated to Warehouse and flagged for the customer","Left until the customer calls","Reassigned to a different carrier automatically"],answer:1},{q:"Your primary job when a shipment will miss its delivery date is:",options:["Wait for the customer to call and then explain","Notify Sales / CS proactively before the customer calls","Update the delivery date in M3 without telling anyone","Contact Infor support"],answer:1},{q:"A High priority logistics issue is one that:",options:["Is a question about carrier setup","Involves a small quantity overage","Blocks a customer delivery","Is a freight cost question"],answer:2},{q:"The OIS600 report shows:",options:["Financial statements for freight expense","Shipment status — confirmed, in transit, delivered, and exceptions — by date range","Inventory stock balances by warehouse","Supplier invoice payment status"],answer:1}],checklist:["I can run OIS600 and identify unconfirmed, in-transit, and exception shipments","I review open shipments each morning as part of my daily rhythm","I notify Sales / CS proactively when a delivery will be late — before the customer calls","I log all carrier exceptions with carrier name, tracking number, customer, and resolution","I know when to escalate a logistics issue to KRISTENB same day"]},{id:"log-3",title:"Carrier Setup and Freight Cost Management — MWS420",duration:"45 min",steps:[["1","Understand carrier master","Every carrier Adleta uses must exist as an active carrier record in M3 before it can be assigned to a delivery. The carrier record controls default service types, freight terms, and contact information."],["2","Open MWS420","Navigate to Warehouse Management > Carrier > MWS420. click the + New button to create a new carrier or enter an existing carrier ID to review."],["3","Review existing carriers","Before adding a new carrier, search for the carrier name to confirm it does not already exist under a different ID. Duplicate carrier records cause reporting errors and split freight history."],["4","Set up a new carrier record","Enter carrier ID, name, contact information, and default service type. Confirm the carrier ID format with IT — Adleta uses a consistent naming convention. Set status to Active."],["5","Configure freight terms","On each delivery you can override the default freight terms. The three main terms are: Prepaid (Adleta pays, cost billed to customer), Collect (customer pays carrier directly), Third Party (billed to a third-party freight account). Confirm which term applies to each customer type."],["6","Review freight cost visibility","If freight costs are captured in M3, open OIS600 and review freight cost by carrier and service type. Identify carriers with higher-than-expected cost per shipment. Flag significant cost increases to management."],["7","Carrier performance tracking","Track on-time pickup rate, damage claims, and tracking accuracy by carrier. If a carrier consistently misses pickups or has high damage rates, document the pattern and raise with management for carrier review."],["8","Keep carrier records current","Update carrier records when contact information or service terms change. Inactivate carriers that are no longer used — do not delete. This preserves freight history for reporting and audit."]],videoUrl:"",quiz:[{q:"Before adding a new carrier in MWS420, you should first:",options:["Call the carrier to confirm they can use M3","Search for the carrier name to confirm it does not already exist under a different ID","Get approval from Finance","Create a test delivery"],answer:1},{q:"Freight terms Collect means:",options:["Adleta pays freight and bills the customer","The customer pays the carrier directly","A third-party account is billed","Freight is included in the product price"],answer:1},{q:"If a carrier consistently misses pickups or has high damage rates, you should:",options:["Immediately delete the carrier from M3","Continue using them until a better option is found","Document the pattern and raise it with management for carrier review","Only use them for low-priority shipments"],answer:2},{q:"When a carrier is no longer used, you should:",options:["Delete the carrier record","Inactivate the carrier — do not delete, to preserve freight history","Leave it active but stop using it","Archive it to SharePoint"],answer:1}],checklist:["I can set up a new carrier record in MWS420 with correct ID, name, service type, and status","I check for duplicate carrier records before creating a new one","I understand the three freight term types — Prepaid, Collect, and Third Party","I can identify freight cost variances in OIS600 and know when to escalate","I track carrier performance — on-time, damage, tracking accuracy — and document patterns","I inactivate unused carriers rather than deleting them to preserve history"]},{id:"log-4",title:"Will Call — Pick, Pack, and Issue",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Pick%20pack%20issue%20WC.mp4",steps:[["1","Receive the Will Call Order","Receive the Will Call order from Customer Service. Order is in picking status in M3."],["2","Print the Pick List","Open the picking program (MWS420 or warehouse picking program). Print or view the pick list for the Will Call order."],["3","Pick Items from Warehouse","Pick items from the warehouse locations per the pick list. Verify item numbers, quantities, and warehouse locations."],["4","Pack the Order","Pack the items for customer pickup. Stage at the Will Call counter or designated staging area."],["5","Confirm Pick Quantities in M3","In M3, confirm the picked quantities for the order. Correct any short picks or substitutions."],["6","Issue the Delivery at Delivery Level","Navigate to the delivery in M3. Issue the delivery at the delivery level — NOT the shipment level. No dock assignment or load building required."],["7","Customer Picks Up","Verify customer identity and order details. Hand over staged goods."],["8","Delivery Confirmed — Inventory Decremented","M3 decrements inventory automatically when the delivery is issued. The order cycle is complete."]],quiz:[{q:"Will Call orders are issued at which level in M3?",options:["Shipment level","Load level","Delivery level","Invoice level"],answer:2},{q:"Why do Will Call orders not require load building?",options:["Will Call orders are too small for load planning","The customer picks up at the warehouse — no truck loading needed","IT disabled load building for Will Call","The warehouse team skips this step"],answer:1},{q:"When is inventory decremented for a Will Call order?",options:["When the pick list is printed","When the customer confirms by phone","When the delivery is issued in M3","At month-end inventory close"],answer:2},{q:"After issuing the Will Call delivery, the next step is:",options:["Create a new order for the customer","Process an AP invoice","The order cycle is complete — inventory is decremented","Submit for supervisor approval"],answer:2}],checklist:["I can locate and print a Will Call pick list in M3","I can confirm pick quantities in M3 after picking","I can issue a Will Call delivery at the delivery level","I understand Will Call does not require load building or dock assignment","I know how to stage orders for customer pickup"]},{id:"log-5",title:"Common Carrier — Shipment Processing",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Common%20carrier%20scenario.mp4",steps:[["1","Receive the Common Carrier Order","Order is released for picking from Customer Service. Confirm delivery method is CC in M3."],["2","Print Pick List and Pick Items","Print the pick list. Pick items from warehouse locations, verifying item numbers and quantities."],["3","Pack and Stage for Carrier","Pack items securely for common carrier shipment. Stage in the carrier staging area."],["4","Issue Delivery at Delivery Level","In M3, issue the delivery at the delivery level — not the shipment level. Use desktop or RF handheld device."],["5","Obtain Tracking Number","Obtain the tracking number from the carrier or TMS system when the carrier picks up."],["6","Enter Tracking Number in M3","Enter the tracking number at the delivery level in M3. This creates the shipment record and links tracking to the customer order."],["7","Update Delivery Address if Needed","If a delivery address change is needed, it MUST be done before issuing the delivery. Use system shortcuts to update."],["8","AR Invoice is Triggered","After the delivery is issued, M3 automatically triggers the AR invoice to the customer. The Order to Cash cycle is complete."]],quiz:[{q:"Common Carrier deliveries are issued at the:",options:["Shipment level","Delivery level","Load level","Order header level"],answer:1},{q:"Tracking numbers for Common Carrier shipments are entered in M3 at the:",options:["Order header","Invoice","Pick list","Delivery level"],answer:3},{q:"A delivery address change must be completed:",options:["After issuing the delivery","At any time up to invoicing","Before issuing the delivery","Only by a Finance user"],answer:2},{q:"After a Common Carrier delivery is issued in M3, what happens automatically?",options:["A PO is created","The AR invoice is triggered","The item is back-ordered","The pick list is reprinted"],answer:1}],checklist:["I can process a Common Carrier pick and pack workflow","I can issue a Common Carrier delivery at the delivery level in M3","I can enter a tracking number at the delivery level","I know how to update a delivery address before issuing","I understand that issuing the delivery triggers the AR invoice"]}]},
  productManagement:{id:"productManagement",name:"Product Management",owner:"Lauren Calvey",weeks:"Week 5-6",pill:"pill-gray",color:"#7a5ea6",programs:["MMS060","MMS001","MMS002","OIS010","MMS200"],summary:"Item master setup and maintenance, product lifecycle, pricing structures, and product catalog management in M3.",links:[],sessions:[{id:"prd-1",title:"Discontinuing an Item — Status 50 and MRP Off",duration:"60 min",steps:[[1,"Confirm the item is being discontinued","Get authorization from Purchasing or Product Management before discontinuing an item. Confirm: no open customer orders, no open POs, and no recent demand. Discontinuing an item with open orders or stock on hand requires additional steps."],
[2,"Open MMS060 — Item Master","Press Ctrl+R > MMS060. Look up the item number being discontinued. Review current status, on-hand quantity, open orders, and open POs before making any changes."],
[3,"Check for open orders and stock","In MMS060, navigate to Related > Open Orders or check the Stock Status screen. If there are open customer orders for this item, they must be filled or cancelled first. If there is stock on hand, a plan for clearance or return is needed."],
[4,"Turn off the MRP flag","In MMS060, find the MRP/planning flag (confirm the field name with your trainer). Set it to OFF or No. This stops M3 from generating new planned purchase orders for this item. Save the change."],
[5,"Change the item status to 50 (Discontinued)","In MMS060, find the Item Status field. Change the status from active (typically status 20) to status 50 — Discontinued. Save. Status 50 prevents new orders from being placed on this item."],
[6,"Verify no new orders can be entered","After saving, open OIS100 and try to enter an order line for the discontinued item. M3 should display an error or warning that the item is discontinued and prevent the order. Confirm this works correctly."],
[7,"Verify no new POs can be created","Open PPS200 and try to create a PO line for the discontinued item. M3 should block or warn. Confirm with your trainer that the system correctly prevents new purchasing for status 50 items."],
[8,"Document the discontinuation","Add a note in MMS060 (Related > Notes) documenting: date discontinued, reason, who authorized, and what to do with any remaining stock. Notify Sales and Order Desk that the item is discontinued so they can advise customers of alternatives."]],videoUrl:"",quiz:[{q:"Before an item can be used on a PO or sales order, its status in MMS060 must be:",options:["10 — Pending","20 — Active","90 — Inactive","Any status is acceptable"],answer:1},{q:"Unit of measure on an item record is critical because:",options:["It only affects the purchase order","It affects POs, sales orders, inventory counts, pricing, and reporting — an incorrect UOM causes errors across all departments","It is only used for reporting","Finance sets it separately from the item record"],answer:1},{q:"A non-stocked item in M3 means:",options:["The item is discontinued","The item is purchased on demand and not held in warehouse inventory","The item has no price assigned","The item requires special handling"],answer:1},{q:"After creating a new item, you should verify it by:",options:["Sending an email to IT","Opening MMS200 to confirm it appears and testing it on a PO and sales order before marking it fully active","Printing the item record","Checking the GL account"],answer:1}],checklist:["I understand why the item master is the foundation for all department transactions","I can create a new item in MMS060 with the correct status, UOM, category, and stock method","I know the Adleta item numbering convention and confirm before creating new items","I verify new items in MMS200 and test on a PO and sales order before activating","I know the three key item statuses: Pending (10), Active (20), Inactive (90)"]},{id:"prd-2",title:"Product Lifecycle and Pricing Structure — MMS060 and OIS010",duration:"60 min",steps:[["1","Understand product lifecycle","Products move through stages: new, active, being phased out, and discontinued. M3 controls which transactions are allowed at each stage through item status. Your job is to keep item records accurate as products change."],["2","Managing a product change","When a product is updated — new description, UOM change, category change — do not delete the old record. Update it in MMS060 and document the change with a note and date."],["3","Discontinuing a product","When Adleta stops selling an item, set status to 90 (Inactive) in MMS060 only after confirming: no open POs, no open sales orders, and zero stock on hand. Contact Purchasing, Sales, and Warehouse before inactivating."],["4","Understand price list structure","Prices in M3 live in OIS010, not on the item record. An item can have different prices on different price lists — standard, promotional, customer-specific."],["5","Open OIS010","Navigate to Sales > Price List > OIS010. Select a price list and find an item. Review base price, effective date, expiry date, and UOM."],["6","Add or update an item price","Select the price list. Add the item number, price, effective date, and UOM. Set an expiry date if this is a promotional price. Save."],["7","Verify price on a sales order","Open OIS100, enter the customer and item. Confirm M3 pulls the correct price based on the customer's assigned price list. If the wrong price appears, check the customer's price list assignment in OIS017."],["8","Coordinate price changes","Price changes affect Sales, Finance, and customer communications. Notify KRISTENB and Sales before updating a price list that is assigned to active customers. Document the effective date and reason for every change."]],videoUrl:"",quiz:[{q:"To discontinue an item in M3, you set its status to 90. Before doing this you must confirm:",options:["The item has been in the system for at least one year","There are no open POs, no open sales orders, and zero stock on hand — and you have notified Purchasing, Sales, and Warehouse","Finance has approved the removal","IT has deleted the item from the price list"],answer:1},{q:"Item prices in M3 are stored in:",options:["MMS060 on the item record","OIS010 on the price list","MMS200 in the stock balance","GLS040 in the chart of accounts"],answer:1},{q:"If a sales order is pulling the wrong price for a customer, the first place to check is:",options:["The item record in MMS060","The customer's price list assignment in OIS017","The GL account","The purchase order"],answer:1},{q:"When making a price list change that affects active customers, you should:",options:["Make the change immediately and notify no one","Update the expiry date but leave the price alone","Notify KRISTENB and Sales before updating, document the effective date and reason","Wait until the end of the financial year"],answer:2}],checklist:["I understand the product lifecycle stages and how item status controls M3 transactions","I know the steps to safely discontinue a product — checking POs, orders, stock, and notifying departments","I can add and update item prices in OIS010 with correct effective and expiry dates","I verify price changes on a test sales order before communicating to the business","I document every price change with effective date and reason and notify affected teams in advance"]},{id:"prd-3",title:"Master Data Quality and New Product Launch Coordination",duration:"60 min",steps:[["1","Understand master data ownership","As Product Management super user, you own the accuracy of the item master. Bad item data — wrong UOM, wrong category, missing description, wrong status — creates errors in Purchasing, Warehouse, Sales, and Finance. Master data quality is not just a Product Management problem; it affects every department."],["2","Run a regular item master audit","Periodically review MMS060 for items that need attention: items with status 10 (Pending) that have been sitting for more than 30 days, items with missing descriptions, items with incorrect UOM, and items that are no longer sold but still show as Active."],["3","Check for duplicate items","Search MMS060 by description keyword to find potential duplicates. Duplicates cause split inventory history, pricing inconsistencies, and reporting errors. If duplicates exist, coordinate with IT and Purchasing before consolidating — do not inactivate without confirming which record is correct."],["4","Coordinate a new product launch","When Adleta adds a new product line: create the item record in MMS060 (status 10 while building). Confirm UOM, category, and stock method with Purchasing and Warehouse. Add the price in OIS010 with correct effective date. Notify Sales before the item goes Active — they need to know it is available to sell."],["5","Communicate launch timing","Product Management owns the launch checklist: item created, UOM confirmed, price set, Purchasing notified to set up supplier, Warehouse notified to receive first stock, Sales notified of availability date. All five must be complete before status changes to 20 (Active)."],["6","Handle item substitutes and alternates","When a product is temporarily out of stock or discontinued, Sales may need a substitute. Document known substitutes on the item record notes field and share with Sales. Communicate lead time and availability differences so Sales can set correct customer expectations."],["7","Manage seasonal and promotional items","Seasonal items should be set up well in advance — confirm with Purchasing on lead times. Set the item price in OIS010 with a specific effective date and expiry date. After the season ends, inactivate if it will not return, or leave Active with no open orders if it will return next season."],["8","Document everything","Every item creation, status change, UOM change, and price change must be documented: who made the change, when, and why. Use the Notes field in MMS060 and the team SharePoint folder. This protects the business during audits and helps troubleshoot issues when something unexpected happens downstream."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Turn%20Off%20MRP%20on%20item%20when%20discontinued%20Sts-50.mp4",quiz:[{q:"Before a new item's status is changed to Active (20) in MMS060, which five things must be complete?",options:["Item number, color, weight, size, and brand","Item created, UOM confirmed, price set, Purchasing and Warehouse notified, Sales notified of availability","IT approval, Finance approval, manager sign-off, legal review, and vendor contract","Item created, test order placed, shipped, invoiced, and paid"],answer:1},{q:"If you find a potential duplicate item in MMS060, you should:",options:["Immediately inactivate the newer one","Coordinate with IT and Purchasing to confirm which record is correct before taking action","Delete both and start over","Leave it — duplicates are normal in M3"],answer:1},{q:"Item substitutes for out-of-stock products should be:",options:["Handled verbally between Sales reps without any documentation","Documented in the item record notes and shared with Sales, including lead time and availability differences","Created as new item records in MMS060","Entered as returns in OIS390"],answer:1},{q:"A seasonal item whose price expires at end of season should be handled by:",options:["Deleting the price record after the season","Setting an expiry date on the price in OIS010 when the price is created — not managing it manually after the fact","Leaving the old price active until the next season starts","Contacting Finance to remove the price"],answer:1}],checklist:["I understand my role as master data owner and how item data quality affects every department","I can run a regular item master audit and identify items needing attention in MMS060","I know the five-step new product launch checklist before changing status to Active","I document all item changes with who, when, and why — in MMS060 notes and SharePoint","I know how to handle item substitutes and communicate them to Sales with lead time differences","I manage seasonal item prices with correct effective and expiry dates in OIS010"]}]},
  week9:{id:"week9",name:"Trainer Readiness and Go-Live Prep",owner:"All super users",weeks:"Week 9",pill:"pill-red",color:"#c0443b",programs:["Teams","SharePoint","Issue Log","Planner"],summary:"Teach-backs, readiness sign-off, FAQ build, go-live support roles, department training handoff, and stabilization.",links:[["Teach-Back Packet",SP+"/Week_9_Teach_Back_Readiness_Signoff_Packet.md"],["Go-Live Playbook",SP+"/Go_Live_Support_Playbook.md"],["Department Handoff Plan",SP+"/Department_Training_Handoff_Plan.md"]],sessions:[{id:"w9-1",title:"Teach-Back Preparation",duration:"60 min",steps:[["1","Review your module","Open your module in the portal and review every session, step, quiz, and checklist. Identify any gaps before your teach-back."],["2","Know your 15-minute structure","2 min: explain the department workflow. 5 min: walk through key M3 programs. 3 min: explain one exception and first response. 2 min: explain a department handoff. 2 min: give a practice question you would ask users. 1 min: confirm escalation path."],["3","Prepare your normal scenario","Choose one complete normal workflow you can walk through live in M3 — from opening the program to saving the transaction."],["4","Prepare your exception scenario","Choose one common exception in your module. Know the steps: identify it, who to contact, how to log it."],["5","Prepare your handoff","Name one department that hands off to you and one you hand off to. Know what data must be correct at each handoff."],["6","Prepare a department training tip","Think about one thing your department users will find confusing. Plan how you would explain or demonstrate it."],["7","Practice with a peer","Run through your 15-minute teach-back with another super user. Time yourself. Get feedback on clarity."],["8","Review the rubric","Passing requires average 2.5 or higher across all criteria and no score of 1 in navigation, transaction accuracy, or trainer readiness."]],videoUrl:"",quiz:[{q:"The teach-back format is 15 minutes. The first 2 minutes should cover:",options:["Walking through every screen in your module","Explaining the department workflow in plain business language","Reading from your training notes","Showing the issue log template"],answer:1},{q:"The passing standard for the teach-back rubric is:",options:["Perfect scores on all criteria","Average of 2.5 or higher and no score of 1 in navigation, accuracy, or trainer readiness","Completing all sessions in the portal","Attending all 9 weeks of training"],answer:1},{q:"If you are scored 1 (Not Ready) on System Navigation, you:",options:["Still pass if your other scores are high enough","Do not pass regardless of other scores","Can retake only that section","Are automatically assigned to IT support"],answer:1},{q:"The best way to prepare for your teach-back is:",options:["Memorize the program codes","Practice the full 15-minute walkthrough with a peer and time yourself","Read the training documents the night before","Ask Kristen to show you the workflow again"],answer:2}],checklist:["I have reviewed every session, step, and checklist in my assigned module","I know my 15-minute teach-back structure","I have a normal scenario I can walk through live in M3","I have an exception scenario with the correct handling steps","I know my upstream and downstream department handoffs","I have practiced with a peer and received feedback","I understand the rubric and passing standard"]},{id:"w9-2",title:"Teach-Back and Readiness Sign-Off",duration:"90 min",steps:[["1","Deliver your 15-minute teach-back","Present to KRISTENB and the group. Follow the structure: workflow, programs, exception, handoff, practice question, escalation path."],["2","Receive rubric scores","KRISTENB scores each criteria 1-3. Listen for feedback. Do not argue — note coaching items for remediation."],["3","Review readiness decision","Ready: proceed to department training plan. Ready With Coaching: targeted remediation assigned before go-live. Not Ready: additional training scheduled with backup support assigned."],["4","Build your FAQ contribution","Write 3-5 questions your department users are likely to ask. Include the correct answer and which program or step it relates to. Submit to the shared FAQ."],["5","Review open issues","Go through the issue log. For each open item in your module: confirm owner, confirm resolution path, and flag anything that could block go-live."],["6","Sign readiness acknowledgment","Complete the readiness acknowledgment form: name, department, module, readiness status, required remediation, and signature. Manager countersigns."],["7","Confirm department training date","Lock in the date, location, and attendee list for your department training session. Confirm practice data is ready."]],videoUrl:"",quiz:[{q:"If you receive a readiness status of Ready With Coaching, your next step is:",options:["Wait for go-live and figure it out on the job","Complete assigned remediation and retest the weak area before go-live","Start training your department immediately","Request a different module assignment"],answer:1},{q:"Your FAQ contribution should include:",options:["Every possible M3 question","3-5 likely questions from your department users with correct answers and program references","Only questions you personally had during training","A copy of all training documents"],answer:1},{q:"The readiness acknowledgment confirms that you:",options:["Scored perfectly on all quizzes","Attended every training session without absence","Completed training, practiced, finished your teach-back, and understand your go-live responsibility","Have read all SharePoint documents"],answer:2},{q:"Before your department training session, you must confirm:",options:["That all super users have passed their teach-backs","Training date, attendees, practice data, and that your known issues are documented","That the portal has been updated","That IT has finished the system configuration"],answer:1}],checklist:["I delivered my 15-minute teach-back","I received my rubric scores and understand any coaching feedback","I know my readiness status — Ready, Ready With Coaching, or Not Ready","I submitted 3-5 FAQ contributions with correct answers","I reviewed all open issues in my module and confirmed owners","I signed the readiness acknowledgment","My department training date and attendee list are confirmed"]},{id:"w9-3",title:"Go-Live Support and Department Handoff",duration:"60 min",steps:[["1","Know your support tier","You are Tier 1 — first-line support for your department. Handle how-to questions, navigation, and known workarounds. Escalate to KRISTENB (Tier 2) when an issue blocks work, affects data, or needs a configuration change."],["2","Know the issue log fields","Every issue must include: date/time, department, reported by, program, process, what happened, steps tried, business impact, priority (High/Medium/Low), owner, status, and resolution."],["3","Understand issue priority","High: blocks orders, shipments, receiving, invoicing, payment, or period close — same day triage. Medium: workaround exists but slows work — 1-2 days. Low: question, training gap, or enhancement — weekly review."],["4","Know the daily go-live rhythm","Start of day: review open high-priority issues. Midday: check blockers. End of day: review resolved items and FAQ updates. Report to KRISTENB if anything is blocking your department."],["5","Confirm your floor support availability","Know your agreed support hours during go-live week. Keep your module guide and quick reference open. Use training materials before guessing."],["6","Review your department training handoff checklist","Confirm: department user list, training date, quick reference ready, practice scenario ready, known issues documented, escalation path shared, sign-off method confirmed."],["7","Avoid unauthorized changes","Never make data or configuration changes in production without approval. Log the issue and escalate. Document everything."],["8","Post go-live stabilization","For the first 2-4 weeks: continue daily issue review, track repeated training gaps, update job aids weekly, hold department check-ins, review open items with leadership weekly."]],videoUrl:"",quiz:[{q:"As a Tier 1 super user, you should escalate an issue to KRISTENB when:",options:["A department user asks a how-to question","The issue blocks work, affects data, or requires a configuration or security change","Someone is confused about navigation","You want to update the FAQ"],answer:1},{q:"A High priority issue is one that:",options:["Is annoying but has a workaround","Blocks orders, shipments, receiving, invoicing, payment, or period close","Is a training gap or question","Was logged more than once"],answer:1},{q:"If a department user asks you how to do something and you are not sure, you should:",options:["Give your best guess","Tell them to call IT","Check your training materials first before answering","Ignore the question until you are certain"],answer:2},{q:"During the post go-live stabilization period, repeated questions should become:",options:["Ignored after the first week","FAQ updates and job aid improvements","Escalations to Infor support","New training sessions from scratch"],answer:1}],checklist:["I know my support tier and what I handle vs what I escalate","I can create a complete issue-log entry with all required fields","I know the three priority levels and response expectations","I know the daily go-live rhythm and when to report to KRISTENB","I have confirmed my floor support availability during go-live week","My department training handoff checklist is complete","I understand I must never make unauthorized data or configuration changes in production"]}]},
