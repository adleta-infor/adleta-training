[8,"Correct a pricing error before invoicing","If an order was entered with the wrong price and has NOT been invoiced yet, open OIS100, find the order, and change the order status to allow edits. Correct the price on the line, document the change in notes, and re-release. If the order has already been invoiced, a credit memo or new order line at the difference may be needed — contact Philip Jones in accounting."]],quiz:[{q:"When is a price override on an order line appropriate?",options:["Any time a customer asks for a better price","For one-time situations like matching a competitor quote or correcting an error — not for routine use","Whenever the standard price seems too high","Only on will call orders"],answer:1},
{q:"What should you always do after overriding a price on an order?",options:["Email the customer the new price","Add a note to the order explaining why the price was changed and who authorized it","Delete the original price from OIS017","Call the warehouse to hold the order"],answer:1},
{q:"What does M3 do when a price override exceeds your authorization limit?",options:["It applies the override automatically","It sends an email to the customer","It places the order on hold and requires manager approval before it can be released","It cancels the order"],answer:2},
{q:"If you find yourself overriding the same customer and item price every order, what should you do instead?",options:["Keep overriding — it saves time","Update the price permanently in OIS017 so M3 calculates it correctly on every new order","Ask IT to disable the standard price for that item","Apply a blanket discount in the customer master"],answer:1}],checklist:["Understands when a price override is and is not appropriate","Can locate and change the unit price on an OIS100 order line","Knows what to do if the override requires manager authorization","Documents every price override with a reason and authorization in order notes","Can find the price override report in Birst to monitor trends","Knows how to correct a pricing error before and after invoicing"]}
]}

const EXERCISES={
"fnd-1":{obj:"Understand why Adleta is implementing M3 and what your super user role requires.",scn:"You are attending the program kickoff. Review the go-live timeline, identify your module responsibilities, and locate your training resources on the portal.",tasks:[{n:"Review the go-live timeline",s:["Open the portal and navigate to the Roadmap tab.","Locate your module in the 9-week schedule.","Note your week, owner name, and the programs listed for your module."]},{n:"Understand your super user responsibilities",s:["On the Super Users tab, find your name and confirm your department.","Review the three-phase model: Kristen trains you, you get certified, you train your department.","Write down 2-3 team members you will be responsible for training."]},{n:"Locate your training materials",s:["Navigate to your module on the Modules tab.","Open the Guide link and confirm you can access the SharePoint document.","Return to the portal and open Session 1 to review the checklist."]}],out:["You can locate your module and sessions on the portal.","You understand your role as the department trainer after certification.","You have access to your SharePoint learning guide."],exc:[{q:"The portal will not load or shows an error",a:"Clear your browser cache and try again. If the issue continues, notify Kristen - do not share your login with others to work around it."},{q:"You cannot find your name on the Super Users tab",a:"Confirm your username with Kristen. Logins are case-sensitive."},{q:"Your SharePoint guide link shows Access Denied",a:"You need to be added to the SharePoint site. Contact Kristen or IT - do not download and share the file directly."},{q:"A team member asks why they are not on the super user list",a:"Only the designated super users per module are on the list. Redirect them to their department super user for training after certification."}]},
"fnd-2":{obj:"Navigate M3 confidently using the 6 core navigation skills every super user must know.",scn:"You are in the M3 training environment. Practice each navigation skill before your first module session.",tasks:[{n:"Launch M3 and use the program search",s:["Log in to the M3 test environment with your training credentials.","Type PPS200 in the program search bar and press Enter.","Confirm the Purchase Order. Open panel loads."]},{n:"Use function keys and panel navigation",s:["In PPS200, press F1 to access Help and review field descriptions.","Press Escape to go back without saving.","Use the breadcrumb at the top to confirm your location in M3."]},{n:"Sort, filter, and right-click",s:["Open MMS200 (Item. Open) and type A in the Item Number field.","Press Enter to display items beginning with A.","Right-click any row and review the available options (Related, Tools).","Click the column header to sort results ascending, then descending."]},{n:"Open a related program",s:["From MMS200, right-click an item and select Related.","Choose Stock Balance (MMS060) to view inventory for that item.","Confirm the stock balance panel opens without re-entering the item number."]}],out:["You can launch any M3 program by typing its code in the search bar.","You can navigate between panels, sort lists, and right-click to related programs.","You understand the difference between Escape (cancel) and closing a panel."],exc:[{q:"M3 opens but the program search bar is missing",a:"You may be in a different view. Press F5 to refresh or look for the Search icon in the top navigation bar."},{q:"Pressing Enter in a search returns no results",a:"Check for leading spaces or extra characters in the field. M3 searches are exact-match on the characters you type."},{q:"Right-click shows no Related option",a:"The Related option only appears on list panels, not header panels. Make sure you are right-clicking a row in a list, not a field."},{q:"A panel opens read-only and you cannot change anything",a:"Your user role may not have edit access for that program. Note the program name and report it to Kristen or IT."}]},
"fnd-3":{obj:"Map Adleta business terms to their M3 equivalents so you can find the right data in the right place.",scn:"A team member asks where to find a customer account in M3. Practice looking up the key terminology mappings and locating each one in the system.",tasks:[{n:"Look up customers in M3",s:["Open OIS300 (Customer. Open) in M3.","Search for customer number ADL1001.","Confirm the record shows - this is what Adleta calls a customer account."]},{n:"Look up suppliers/suppliers",s:["Open CRS620 (Supplier. Open) in M3.","Search for supplier ADL-V001.","Note the M3 term is Supplier - Adleta calls this a vendor."]},{n:"Locate a warehouse and item",s:["Open MMS060 (Item. Open) and search for any flooring item.","Right-click and select Stock Balance to view warehouse 100.","Confirm warehouse 100 is the main Adleta facility."]},{n:"Self-quiz the terminology crosswalk",s:["Open the Foundation Learning Guide from the module Resources section.","Find the Terminology Crosswalk table.","Cover the M3 column and name the M3 term for each Adleta term without looking."]}],out:["You can find customers, suppliers, warehouses, and items in M3.","You know the key Adleta-to-M3 term mappings.","You can locate the correct program for any common lookup."],exc:[{q:"You search for ADL1001 and get no results",a:"Confirm you are in the correct program (OIS300 for customers, CRS620 for suppliers). Customer and supplier numbers live in different programs."},{q:"The M3 term does not match the Adleta term you expected",a:"Use the Terminology Crosswalk in the Foundation Learning Guide as your reference. If something is missing, flag it for Kristen to add."},{q:"A team member uses the wrong program and enters data in the wrong place",a:"Caught early: delete the incorrect entry and re-enter in the correct program. Caught after posting: escalate to the module owner - do not attempt to fix it yourself."},{q:"Warehouse 500 does not appear in stock balance",a:"Warehouse 500 may not carry that item. An empty result is correct - it means no stock, not an error."}]},
"fnd-4":{obj:"Demonstrate all foundation skills without assistance to confirm readiness for module training.",scn:"Kristen will call out tasks one at a time. Complete each one in M3 without referring to notes. This is your certification check for the Foundation module.",tasks:[{n:"Navigation check",s:["Open PPS200 without using the menu - type it in the search bar.","Open MMS200 and sort the item list by description.","Use right-click Related to open stock balance from MMS200."]},{n:"Lookup check",s:["Find supplier ADL-V001 and confirm their payment terms.","Find customer ADL1001 and confirm their credit limit.","Look up any item and confirm its stock in warehouse 100."]},{n:"Terminology check",s:["State the M3 term for: Purchase Order, Vendor, Warehouse, Item Master, Customer.","State the M3 program for: entering a sales order, receiving goods, viewing stock.","Explain the difference between Escape and closing a panel to the trainer."]}],out:["You passed the Foundation check and are cleared for module training.","You can navigate M3 and locate records without assistance.","Your trainer has signed off on your Foundation readiness checklist."],exc:[{q:"You cannot complete a task during the certification check",a:"Tell Kristen immediately. Do not guess or skip - the certification check is pass/fail and you can reschedule."},{q:"You complete a task but Kristen marks it incorrect",a:"Ask Kristen to walk through the correct steps with you before the next attempt. Take notes."},{q:"M3 is slow or unresponsive during the check",a:"Notify Kristen. The check can be paused and rescheduled - a slow system is not a failure."},{q:"You pass navigation but struggle with terminology",a:"You can be cleared for module training and revisit terminology as needed. Flag the gaps to Kristen so she can reinforce them in module sessions."}]},
"pur-1":{obj:"Release a planned purchase order generated by MRP into a confirmed PO in M3.",scn:"MRP has generated a planned order for 500 SQF of carpet from supplier ADL-V001 for warehouse 100. Your buyer code is on the order. Review and release it.",tasks:[{n:"Filter planned orders in PPS170",s:["Open PPS170 (Planned Purchase Orders. Open).","Set Buyer = your buyer code and Warehouse = 100.","Press Enter to display the MRP-generated planned orders."]},{n:"Review the planned PO",s:["Locate the line for supplier ADL-V001.","Right-click and select Open to review: item number, quantity (500 SQF), need date, and suggested supplier.","Confirm all details are correct before releasing."]},{n:"Release the planned PO",s:["Return to the PPS170 list and select the ADL-V001 line.","Right-click and choose Release.","M3 converts the planned order to a PO and assigns a PO number."]},{n:"Verify in PPS200",s:["Open PPS200 (Purchase Order. Open).","Search for the new PO using supplier ADL-V001.","Confirm status = 15 (Confirmed) and quantity = 500 SQF."]}],out:["Planned PO released and converted to status 15 in PPS200.","PO linked to supplier ADL-V001 with correct item and quantity.","MRP planning reflects the order as committed."],exc:[{q:"No planned orders appear after filtering",a:"Check that your buyer code is assigned to items in M3. If the buyer code field is blank, contact Alan Burk - MRP may not be assigning orders to you."},{q:"The planned order quantity looks wrong",a:"Do not release it. Right-click and open the order to review the MRP parameters. Flag it to Alan Burk before releasing."},{q:"The supplier on the planned order is not ADL-V001",a:"MRP assigned a different preferred supplier. Confirm with Alan Burk whether to release as-is or change the supplier before releasing."},{q:"PPS200 does not show the newly released PO",a:"Allow a few minutes for the system to update. If the PO still does not appear after 5 minutes, check PPS170 to confirm the release completed without error."}]},
"pur-2":{obj:"Create a non-stocking warehouse PO for a one-time exception purchase outside normal MRP.",scn:"A project requires 10 boxes of a non-stocked item from supplier ADL-V001. This will not go through MRP. Create a manual WHS PO in PPS200.",tasks:[{n:"Create a new PO header",s:["Open PPS200 (Purchase Order. Open) and click New.","Enter Supplier = ADL-V001 and Order Type = WHS (warehouse non-stocking).","Enter Delivery Date = one week from today and Warehouse = 100."]},{n:"Add the order line",s:["On the order line panel, enter the item number for the non-stocking item.","Enter Quantity = 10 and confirm the unit of measure.","Enter the agreed unit price and press Enter to save the line."]},{n:"Confirm and save the PO",s:["Review the order header and confirm the line total is correct.","Change the status to Confirmed (15).","Note the PO number assigned by M3."]}],out:["WHS PO created in PPS200 with status 15.","Order line shows correct item, quantity (10), and price.","PO is ready to be sent to supplier ADL-V001."],exc:[{q:"The WHS order type is not available in the dropdown",a:"Your user role may not have WHS enabled. Contact IT or Alan Burk to confirm the order type is active for your user."},{q:"The item number is not found when entering the order line",a:"WHS orders are for non-stocked items. If the item exists in the system, confirm the item status is active (not discontinued). If it is truly new, item master setup is needed first."},{q:"The unit price does not pull from a price list",a:"For non-stocking items there may be no price list entry. Enter the agreed price manually and note the source in the order notes."},{q:"You create the PO but forget to confirm it (status stays at 10)",a:"Return to PPS200, find the PO, and change the status to 15 (Confirmed). A PO at status 10 cannot be received against."}]},
"pur-3":{obj:"Process a goods receipt against a confirmed PO and verify the three-way match in M3.",scn:"Supplier ADL-V001 has delivered 500 SQF against PO TEST-PO-001. Receive the goods in PPS300 and confirm the receipt matches the PO and invoice.",tasks:[{n:"Open the PO in PPS300",s:["Open PPS300 (Goods Receiving. Open).","Search for PO number TEST-PO-001.","Confirm the expected quantity (500 SQF) and item are displayed."]},{n:"Enter and post the receipt",s:["Select the PO line and click Receive.","Enter received quantity = 500 and the delivery note number from the supplier packing slip.","Confirm all details match: item, quantity, warehouse 100.","Post the receipt - M3 updates inventory and creates the goods receipt transaction."]},{n:"Verify three-way match",s:["Open APS100 (Supplier Invoice. Enter).","Match the receipt to PO TEST-PO-001.","Confirm quantity and price match - M3 will flag any discrepancy."]}],out:["Goods receipt posted against TEST-PO-001.","Inventory in warehouse 100 increases by 500 SQF.","Three-way match between PO, receipt, and invoice is confirmed."],exc:[{q:"The received quantity is less than the PO quantity",a:"Receive only what physically arrived. Note the shortage on the receipt. The PO line stays open for the balance - notify ADL-V001 to ship the remainder."},{q:"The item on the delivery does not match the PO",a:"Do not receive it. Contact ADL-V001 to confirm what was shipped. If it is the wrong item, reject the delivery and create a discrepancy note."},{q:"M3 flags a three-way match variance on the invoice",a:"Do not pay the invoice. Flag it with the hold reason and notify Alan Burk and Philip Jones to resolve."},{q:"PPS300 does not show the PO when you search",a:"Confirm the PO status is 15 or higher. A PO at status 10 (Draft) cannot be received. Also confirm you are searching the correct PO number."}]},
"pur-4":{obj:"Create a manual PO for a stocking item when MRP has not generated a planned order.",scn:"You need to order 200 SQF of a stocking item from ADL-V001 that MRP missed. Create the PO manually in PPS200.",tasks:[{n:"Create the PO header",s:["Open PPS200 and click New.","Enter Supplier = ADL-V001 and select the standard PO order type.","Set Warehouse = 100 and a delivery date 2 weeks out."]},{n:"Add a stocking item line",s:["On the line entry panel, look up the item number using the search field.","Enter Quantity = 200 and confirm unit = SQF.","Verify unit cost pulls from the supplier price list - adjust if needed."]},{n:"Confirm and save",s:["Review the order total.","Confirm the PO (status 15).","Write down the PO number for follow-up."]}],out:["Manual stocking PO created in PPS200 with correct item and quantity.","PO confirmed at status 15 and linked to supplier ADL-V001.","Order is ready for receiving when goods arrive."],exc:[{q:"The item is in MRP but MRP did not generate a planned order",a:"Check the item planning parameters - safety stock, lead time, and reorder point may not be set. Flag it to Alan Burk rather than creating manual POs repeatedly."},{q:"ADL-V001 does not appear in the supplier search",a:"The supplier may be inactive or the name may be entered differently. Search by supplier number (ADL-V001) not by name."},{q:"The price does not pull from the supplier price list",a:"The item may not be on ADL-V001 price list in M3. Enter the agreed price manually, note it in the order, and ask Alan Burk to set up the price list entry."},{q:"You accidentally confirm the PO with the wrong quantity",a:"If no receipt has been posted, open the PO, change the status back to 10, correct the quantity, and re-confirm. If a receipt has already been posted, do not change it - contact Philip Jones."}]},
"pur-5":{obj:"Cancel, split, and add notes to an existing purchase order in M3.",scn:"You need to cancel one line on TEST-PO-001, split another line into two deliveries, and add a note for the supplier.",tasks:[{n:"Cancel a PO line",s:["Open PPS200 and locate TEST-PO-001.","Select the line to cancel and right-click, then Change Status.","Set status to Cancelled (90) and confirm."]},{n:"Split a PO line",s:["Select the line to split and right-click, then Split Line.","Enter the first delivery quantity and date.","Enter the second delivery quantity and date.","Confirm both lines appear in the order."]},{n:"Add a supplier note",s:["On the PO header, open the Text/Notes panel.","Enter a note for the supplier (e.g., Ship to dock B - call ahead).","Save the note and confirm it is linked to the PO."]}],out:["One PO line cancelled at status 90.","One line split into two delivery schedules.","Supplier note saved on the PO header."],exc:[{q:"M3 will not let you cancel a PO line",a:"The line may already have a receipt posted against it. A received line cannot be cancelled - contact Philip Jones for a reversal if needed."},{q:"After splitting a line the quantities do not add up to the original",a:"Re-check the split quantities before saving. If already saved incorrectly, open the lines and adjust - total must match the original PO."},{q:"The supplier note does not print on the PO confirmation",a:"Check that the note type is set to External (visible to supplier), not Internal. Internal notes do not appear on printed documents."},{q:"You need to cancel the entire PO not just one line",a:"Cancel each line individually by setting each to status 90. The PO header will close automatically when all lines are cancelled."}]},
"pur-6":{obj:"Update supplier information on an open purchase order without cancelling and recreating it.",scn:"Supplier ADL-V001 has changed their delivery contact for TEST-PO-001. Update the PO in M3.",tasks:[{n:"Open the PO and navigate to supplier details",s:["Open PPS200 and search for TEST-PO-001.","Open the PO header.","Navigate to the supplier and delivery detail panel."]},{n:"Update the delivery address and contact",s:["Locate the delivery address field and enter the new address.","Update the supplier contact name field.","Press Enter to save the changes."]},{n:"Verify the update",s:["Confirm the updated details appear on the PO.","Verify the PO confirmation printout reflects the new address.","Confirm no other PO lines or details were changed."]}],out:["PO TEST-PO-001 shows the updated delivery address and contact.","Changes saved without cancelling the PO.","Updated details visible in the PO detail view."],exc:[{q:"The delivery address field is grayed out and cannot be edited",a:"The PO may be at a status that locks the header. Check with Alan Burk - it may need to be set back to status 15 before edits are allowed."},{q:"You update the wrong PO by mistake",a:"If no receipt has been posted, correct the wrong PO back to its original values and then update the correct one. Document both changes in the order notes."},{q:"The supplier calls and says they never received the updated PO confirmation",a:"Re-print the PO confirmation from M3 and email it. Confirm the supplier email address in CRS620 is current."},{q:"The supplier contact name field does not exist on the PO",a:"Supplier contact details may live on the supplier master (CRS620), not the PO. Update it there and it will flow to future POs."}]},
"pur-7":{obj:"Process a pre-receipt in M3 to log an incoming shipment before goods physically arrive.",scn:"ADL-V001 has shipped 500 SQF against TEST-PO-001 and sent an advance ship notice (ASN). Enter the pre-receipt in M3.",tasks:[{n:"Locate the PO for pre-receipt",s:["Open PPS300 and search for TEST-PO-001.","Confirm the PO status allows pre-receipt entry.","Review the expected quantity and item."]},{n:"Enter the pre-receipt",s:["Select the PO line and choose Pre-Receipt.","Enter the ASN number from ADL-V001.","Enter quantity = 500 and the expected arrival date.","Save the pre-receipt."]},{n:"Verify the record",s:["Confirm the pre-receipt appears in the receiving log.","Note that inventory is NOT updated until the final receipt is posted.","Check that the PO status shows In Transit."]}],out:["Pre-receipt recorded against TEST-PO-001.","ASN number linked to the pre-receipt record.","Inventory remains unchanged until final receipt is posted."],exc:[{q:"The pre-receipt does not save - M3 gives an error",a:"Check that the PO status allows pre-receipts. Note the error message exactly and contact IT if the status looks correct."},{q:"The supplier sends an ASN but the quantities on the ASN do not match the PO",a:"Enter the pre-receipt with the ASN quantity as received, not the PO quantity. Flag the discrepancy to Alan Burk before the physical receipt."},{q:"Goods arrive earlier than the pre-receipt arrival date",a:"The pre-receipt date is an estimate. Proceed with the final receipt in PPS300 on the actual arrival date - the pre-receipt date does not block receiving."},{q:"You forget to post the final receipt after the pre-receipt",a:"Inventory will not update and the invoice will not match. Always complete the final receipt in PPS300 when goods physically arrive."}]},
"pur-8":{obj:"Understand how EDI purchase orders from suppliers are processed in M3.",scn:"ADL-V001 sends an EDI order acknowledgment. Review how M3 processes EDI documents and what your role is when exceptions occur.",tasks:[{n:"Review the EDI transaction log",s:["Navigate to the EDI transaction log in M3.","Filter for recent transactions from supplier ADL-V001.","Identify any EDI documents with errors or exceptions."]},{n:"Review a successful EDI order",s:["Open a successfully processed EDI order.","Confirm the PO was created automatically in PPS200.","Verify item, quantity, and price match the EDI document."]},{n:"Handle an EDI exception",s:["Open an EDI transaction with an error.","Identify the error type (item not found, price mismatch, etc.).","Correct the data manually and reprocess the transaction.","Confirm the PO is created after reprocessing."]}],out:["You understand the EDI flow from supplier to M3 PO.","You can identify and resolve EDI exceptions.","Successful EDI orders appear in PPS200 without manual entry."],exc:[{q:"An EDI transaction has been in error status for more than a day",a:"Escalate to IT. EDI errors do not self-correct. The supplier may need to resend the document."},{q:"The EDI order created a duplicate PO",a:"Do not receive against both. Cancel the duplicate (status 90) and note it. Confirm with ADL-V001 which is the correct PO number."},{q:"EDI price on the order does not match the agreed price",a:"Hold the PO and notify Alan Burk. Do not receive or pay until the price discrepancy is resolved with the supplier."},{q:"The EDI integration is down and no transactions are processing",a:"Use the manual PO process (PPS200) as a backup. Notify IT immediately - EDI downtime affects all supplier orders."}]},
"inv-1":{obj:"Look up an item master record and check stock balance across warehouses.",scn:"A sales rep asks if Adleta has enough stock of a flooring item for a customer order. Use MMS060 and MMS200 to check.",tasks:[{n:"Look up the item in MMS060",s:["Open MMS060 (Item. Open).","Search for the item number or description.","Review the item status, unit of measure, and item type."]},{n:"Check stock balance in MMS200",s:["From MMS060, right-click the item and select Related, then Stock Balance.","M3 opens MMS200 filtered to that item.","Review On Hand, Allocated, and Available quantities for warehouse 100."]},{n:"Check additional warehouses",s:["In MMS200, remove the warehouse filter.","Press Enter to see stock across all warehouses.","Note which warehouse has the highest available quantity."]}],out:["You located the item master record in MMS060.","You confirmed on-hand and available quantity in warehouse 100.","You can identify stock across multiple warehouses."],exc:[{q:"The item shows stock in MMS200 but the warehouse says the shelf is empty",a:"This is an inventory discrepancy. Create a cycle count request for that item and location. Do not adjust manually without a count."},{q:"Available quantity is negative",a:"A negative available means more is allocated to orders than is on hand. This is a shortage - notify the buyer and the relevant order owner."},{q:"The item record shows status 50 (Discontinued) but stock still exists",a:"Discontinued status stops new orders but does not remove existing stock. The stock must be dispositioned separately."},{q:"You cannot find an item by number but know it exists",a:"Try searching by description or a partial number using a wildcard. Also confirm you are in the correct division - items are division-specific in M3."}]},
"inv-2":{obj:"Process an inventory transfer between warehouses and a manual inventory adjustment in M3.",scn:"Transfer 100 SQF of a flooring item from warehouse 100 to warehouse 500, then correct an inventory count error with a manual adjustment.",tasks:[{n:"Create an inventory transfer in MMS100",s:["Open MMS100 (Inventory Transfer. Enter).","Enter From Warehouse = 100, To Warehouse = 500.","Enter the item number and Quantity = 100.","Press Enter to process the transfer."]},{n:"Verify the transfer",s:["Open MMS200 and check stock for the item.","Confirm warehouse 100 decreased by 100.","Confirm warehouse 500 increased by 100."]},{n:"Process a manual adjustment in MMS150",s:["Open MMS150 (Inventory Adjustment. Enter).","Enter the item number and warehouse 100.","Enter the adjustment quantity (positive to add, negative to reduce).","Enter an adjustment reason code and post."]}],out:["100 SQF transferred from warehouse 100 to warehouse 500.","Inventory balances updated correctly in MMS200.","Manual adjustment posted with reason code."],exc:[{q:"The transfer completes but inventory in warehouse 500 does not increase",a:"Check MMS200 with no warehouse filter. Allow a few minutes for M3 to update. If still incorrect after 5 minutes, reverse the transfer and redo it."},{q:"M3 will not allow a negative adjustment",a:"M3 blocks adjustments that would take on-hand below zero. Verify the on-hand quantity first. If the system quantity is already wrong, a cycle count must be done before adjusting."},{q:"You adjust the wrong item or wrong warehouse",a:"Reverse the incorrect adjustment with an equal and opposite entry using the same reason code plus a note. Then post the correct adjustment."},{q:"The adjustment reason code is not on the list",a:"Do not use the closest match. Contact Jose Manjarrez or IT to add the correct reason code. Reason codes affect GL posting."}]},
"inv-3":{obj:"Set up and run a cycle count for a group of items in M3.",scn:"It is time for the monthly cycle count in warehouse 100, location A-01. Run the cycle count process in MMS300.",tasks:[{n:"Set up the cycle count",s:["Open MMS300 (Stock Take. Open).","Create a new cycle count for Warehouse = 100.","Select the counting method and location range (A-01)."]},{n:"Print count sheets and enter results",s:["Print the count sheets for location A-01 and distribute to the warehouse team.","After the physical count, return to MMS300 and enter the physical quantities for each item.","Review variances - items where the count differs from M3."]},{n:"Approve and post",s:["Approve the count results.","Post the count - M3 updates inventory to match the physical count.","Confirm inventory balances reflect the physical count results."]}],out:["Cycle count created, counted, and posted for warehouse 100.","Inventory variances identified and reviewed.","M3 inventory balances reflect the physical count results."],exc:[{q:"The count sheets show items that are not physically in the location",a:"Enter zero for items not found. Do not skip the line. M3 will create a variance that must be approved before posting."},{q:"The count results in a large variance on a high-value item",a:"Do not post immediately. Recount that item with a second person and confirm. Large variances require supervisor approval before posting."},{q:"The cycle count was posted with wrong quantities",a:"A posted count cannot be undone directly. A correcting adjustment in MMS150 with the variance quantity and a note is the correct fix. Notify Jose Manjarrez."},{q:"An item was received into the warehouse during the count",a:"Flag the receipt as received after count start. The count team needs to add the received quantity to their count to avoid a false variance."}]},
"inv-4":{obj:"Understand how the Automatic Allocation Algorithm (AAA) assigns inventory to customer orders.",scn:"Several customer orders are waiting for stock. Run the AAA to allocate available inventory based on priority rules.",tasks:[{n:"Review open orders pending allocation",s:["Open OIS300 and filter for orders with status = 22 (picking not started).","Identify orders for customer ADL1001 that need inventory.","Note which items are short - requested quantity exceeds available."]},{n:"Run the AAA",s:["Navigate to the allocation program (MMS121 or equivalent).","Set parameters: Warehouse = 100, date range = today.","Run the allocation - M3 assigns inventory to orders based on priority."]},{n:"Review allocation results",s:["Return to OIS300 and check orders for customer ADL1001.","Confirm allocated quantities are updated.","Identify any orders still short - these need manual buyer follow-up."]}],out:["AAA has run and allocated available inventory to open orders.","Customer ADL1001 orders show updated allocated quantities.","Short orders identified for buyer follow-up."],exc:[{q:"The AAA runs but some orders are still unallocated after",a:"The AAA allocates based on available stock. If orders are still short after running it, there is not enough inventory. The buyer needs to expedite a PO."},{q:"An order for a priority customer is allocated after a lower-priority order",a:"Check the order priority settings on both orders. If the priority is set incorrectly, update it and re-run the AAA."},{q:"The AAA allocates inventory to a cancelled order",a:"The cancelled order should not appear. Confirm the order status is 90 in OIS300. If it is still being allocated, contact IT."},{q:"After the AAA runs, a salesperson manually changes an allocation",a:"Manual allocation changes override the AAA result. Set expectations with sales: manual overrides should be approved by the inventory team."}]},
"ord-1":{obj:"Enter a standard customer sales order for a net-terms customer in M3.",scn:"Customer ADL1001 calls in an order for 100 SQF of flooring on standard Net 30 terms (CL1). Enter the order in OIS300.",tasks:[{n:"Create the order header",s:["Open OIS300 (Customer Order. Open) and click New.","Enter Customer = ADL1001.","Confirm payment terms default to CL1 (Net 30) - adjust if needed.","Set the requested delivery date."]},{n:"Enter order lines",s:["On the order line panel, enter the item number.","Enter Quantity = 100 and confirm unit = SQF.","Verify the price pulls from ADL1001 price list.","Press Enter to save the line."]},{n:"Confirm the order",s:["Review order total and shipping address.","Confirm the order - status advances to 22.","Note the order number to provide to the customer."]}],out:["Customer order created for ADL1001 with CL1 payment terms.","Order line shows 100 SQF at the correct price.","Order status is 22 (confirmed, ready for picking)."],exc:[{q:"The customer number ADL1001 is not found in OIS300",a:"Confirm the customer is active in M3. It may be inactive or spelled differently. If it is truly missing, the customer master needs to be set up."},{q:"Payment terms do not default to CL1 after entering the customer",a:"The customer master may have different terms set. Confirm with Philip Jones before changing the terms on the order."},{q:"The price on the order line is different from what the customer was quoted",a:"Do not change it without authorization. Check OIS017 for the customer price list and compare to the quote. Get approval before overriding."},{q:"The order saves but there is no order confirmation number",a:"The order may be at Draft status (10). Confirm it to advance to status 22 and generate the order number to give to the customer."}]},
"ord-2":{obj:"Create a return order in M3 for goods being sent back by a customer.",scn:"Customer ADL1001 is returning 20 SQF of flooring due to damage. Create a return order referencing the original sales order.",tasks:[{n:"Locate the original order",s:["Open OIS300 and search for customer ADL1001 recent orders.","Find the order containing the item being returned.","Note the original order number."]},{n:"Create the return order",s:["Click New in OIS300 and select Order Type = Return.","Enter Customer = ADL1001.","Reference the original order number in the return reference field."]},{n:"Add return line, reason, and confirm",s:["Enter the item number and return quantity = 20.","Enter the return reason code (e.g., damaged).","Confirm the credit amount calculated by M3 and confirm the return order."]}],out:["Return order created for 20 SQF referencing the original order.","Return reason recorded.","Credit memo process triggered for customer ADL1001."],exc:[{q:"You cannot find the original order to reference on the return",a:"Search by customer ADL1001 and date range in OIS300. If the original order was from a prior system, note it in the return order comments and get approval from Tony Shipka."},{q:"M3 calculates a different credit amount than the customer expects",a:"Do not override the credit amount without approval. If there is a pricing dispute, escalate to Tony Shipka."},{q:"The return reason code that fits the situation is not on the list",a:"Use the closest available code and add a detailed note. Flag the missing code to Tony Shipka to request IT add it."},{q:"The customer wants to return goods but they are outside the return window",a:"Do not create the return order without approval. Escalate to Tony Shipka - this is a policy exception, not an M3 issue."}]},
"ord-3":{obj:"Handle an order entry where the customer is on credit hold in M3.",scn:"Customer ADL1001 is on credit hold. A sales order comes in. Enter the order and understand the hold process and release steps.",tasks:[{n:"Attempt to enter the order",s:["Open OIS300 and start a new order for customer ADL1001.","Enter the item and quantity.","M3 will flag the order with a credit hold warning - note the reason."]},{n:"Review and escalate the hold",s:["Note the hold reason (over credit limit, past due balance, etc.).","Do not release the hold without authorization.","Contact the AR team (Philip Jones) with the hold details."]},{n:"Release the hold (authorized users only)",s:["If authorized, navigate to the credit hold release panel.","Enter your authorization code and release the hold.","Add an order note documenting the hold and release."]}],out:["Credit hold identified and escalated appropriately.","Order held for AR review or released with proper authorization.","Exception documented on the order."],exc:[{q:"The customer insists the hold is a mistake and demands immediate release",a:"Do not release the hold on the customer say-so. Verify with Philip Jones or the AR team before taking any action. Document the customer call in the order notes."},{q:"The credit hold release option is grayed out for your user",a:"You do not have authorization to release credit holds. Escalate to Philip Jones. This is by design."},{q:"The customer makes another order that immediately goes back on hold",a:"The customer is still over their credit limit. Each new order will trigger a hold until the balance is paid down. Redirect to AR."},{q:"The hold reason shows Past Due but the customer says they paid",a:"Verify payment posting in AR. If the payment posted after the cutoff it may not have cleared yet. Contact Philip Jones with the payment details before releasing."}]},
"ord-4":{obj:"Enter a will call order for a customer picking up immediately at the counter.",scn:"Customer ADL1001 walks in and wants to pick up 50 SQF today. Enter a will call order in OIS300 and prepare it for immediate pickup.",tasks:[{n:"Create the will call order",s:["Open OIS300 and click New.","Enter Customer = ADL1001.","Change Order Type to Will Call.","Set requested delivery date = today."]},{n:"Enter item and quantity",s:["Enter the item number and Quantity = 50 SQF.","Confirm the price and any applicable discounts.","Press Enter to save the line."]},{n:"Confirm and notify warehouse",s:["Confirm the order - status advances.","Note the order number and notify the warehouse team.","Warehouse will pick and stage the order for customer pickup."]}],out:["Will call order created for ADL1001 with today date.","50 SQF staged for immediate pickup.","Order number provided to the customer."],exc:[{q:"The customer arrives for pickup but the order is not in the system",a:"Check if the order was entered under a different customer number. If it was never entered, create a new will call order immediately while the customer waits."},{q:"The will call quantity is short - warehouse cannot fill the full order",a:"Notify the customer before they arrive if possible. Offer to ship the shortage or have them pick up the remainder when stock arrives. Document in the order notes."},{q:"The customer wants to change the items or quantity when they arrive",a:"If the order has not been picked, update the order lines. If it has already been picked, check with the warehouse before making changes."},{q:"The warehouse marks the order picked but the customer says items are wrong",a:"Do not let the customer leave with wrong items. Return the incorrect items to the warehouse and either correct the pick or cancel and re-pick."}]},
"ord-5":{obj:"Enter a customer order using credit card or COD payment instead of standard terms.",scn:"A customer without a net-terms account orders 30 SQF and will pay by credit card. Enter the order with the correct payment type in OIS300.",tasks:[{n:"Create the order with payment type",s:["Open OIS300 and click New.","Enter the customer number or use the COD customer code.","Change Payment Terms to Credit Card or COD.","Enter the expected payment amount."]},{n:"Add order line and record payment",s:["Enter the item and Quantity = 30, confirm price and line total.","On the header, enter the authorization code or COD reference.","Confirm the order - note that shipment cannot proceed until payment is confirmed."]}],out:["Order entered with credit card or COD payment terms.","Payment reference recorded on the order.","Order held until payment confirmed before shipping."],exc:[{q:"The credit card authorization fails",a:"Do not ship the order. Have the customer provide a different card or arrange a different payment method. Note the failed attempt in the order."},{q:"The customer wants to pay COD but your location does not accept COD",a:"Confirm accepted payment methods with Tony Shipka. Do not accept COD if it is not an approved method for your location."},{q:"The COD payment is tendered but you do not know how to record it in M3",a:"Record the payment immediately - do not wait. If you are unsure of the steps, call Tony Shipka before the customer leaves."},{q:"An order is shipped COD but the driver cannot collect payment",a:"The driver should not leave goods without payment for COD orders. If goods were left in error, notify Tony Shipka and AR immediately."}]},
"ord-6":{obj:"Process a will call order where the customer pays COD at the time of pickup.",scn:"A customer picks up their will call order and pays cash on delivery. Process the pickup and record the COD payment.",tasks:[{n:"Confirm the order is ready and process pickup",s:["Open OIS300 and find the will call order.","Confirm the warehouse has picked and staged the order.","Update the order status to reflect customer pickup.","Record the COD payment received (amount and method) and issue a receipt."]},{n:"Close and verify",s:["Confirm the order is closed after pickup and payment.","Verify the transaction posts to AR.","Check that inventory decremented for the picked items."]}],out:["Will call order picked up and COD payment recorded.","Transaction posts to AR correctly.","Inventory decremented and order is closed."],exc:[{q:"The customer refuses to pay COD when picking up",a:"Do not release the goods. Hold the order and notify Tony Shipka. The order status should remain unpaid."},{q:"The COD payment is received but the wrong amount is collected",a:"Record the amount actually received. Note the discrepancy. Do not accept partial COD without Tony Shipka approval."},{q:"The will call order shows picked in M3 but the warehouse says it was never picked",a:"Do not release the goods. Investigate with the warehouse team and correct the pick status before the customer picks up."},{q:"The receipt was issued but AR does not show the payment posted",a:"Check that the payment was posted, not just saved as a draft. If it is missing from AR, re-enter the payment with Philip Jones."}]},
"ord-7":{obj:"Convert a customer quote to a confirmed sales order in M3.",scn:"A quote (type N30) was sent to customer ADL1001 last week and they have accepted it. Convert the quote to a live order in OIS300.",tasks:[{n:"Find the quote",s:["Open OIS300 and filter by Order Type = N30 (Quote).","Search for customer ADL1001.","Locate the accepted quote."]},{n:"Convert quote to order",s:["Open the quote and review all lines - confirm quantities and prices are still valid.","Use the Convert to Order function.","M3 changes the order type from N30 to a standard sales order."]},{n:"Confirm and communicate",s:["Confirm the converted order.","Note the new order number (different from the quote number).","Communicate the order confirmation to customer ADL1001."]}],out:["Quote N30 converted to a confirmed sales order.","New order number assigned and order is at status 22.","Customer ADL1001 receives order confirmation."],exc:[{q:"The quote has expired - the effective date has passed",a:"Do not convert it. Contact the customer to confirm they still want to proceed, then update the quote with current pricing before converting."},{q:"Prices on the quote are lower than current price list",a:"Do not convert without approval. Get authorization from Tony Shipka or Jeanell Coral before converting a quote with below-list pricing."},{q:"The customer wants to add items to the quote during conversion",a:"Do not add them during conversion. Convert first, then add lines to the resulting order. Mixing steps causes errors."},{q:"The converted order has a different order number than the quote",a:"This is expected. The quote number and order number are always different. Communicate the new order number to the customer."}]},
"ord-8":{obj:"Process a drop ship order where goods ship directly from the supplier to the customer.",scn:"Customer ADL1001 orders an item Adleta does not stock. The order will ship directly from the manufacturer. Enter a drop ship order with a non-cancellable PO.",tasks:[{n:"Create the customer order",s:["Open OIS300 and create a new order for ADL1001.","Change Order Type to Drop Ship.","Enter the item and quantity."]},{n:"Link to supplier PO",s:["M3 will prompt to create a linked PO to the supplier.","Confirm the supplier and enter the customer address as the delivery address.","Set the PO as non-cancellable per the supplier agreement."]},{n:"Confirm both orders and process",s:["Confirm the sales order for ADL1001 and the linked supplier PO - note both order numbers.","When supplier ships, receive against the PO in PPS300.","M3 auto-ships the sales order upon PO receipt."]}],out:["Drop ship sales order created for ADL1001.","Linked supplier PO created and marked non-cancellable.","Goods ship directly from supplier to customer."],exc:[{q:"The supplier says they cannot ship directly to the customer address",a:"Do not process the drop ship. Notify the customer and Tony Shipka. An alternative fulfillment method will need to be arranged."},{q:"The supplier ships the wrong item directly to the customer",a:"Contact ADL-V001 immediately. Create a return and replacement order. Do not receive the wrong item against the PO."},{q:"The customer cancels after the non-cancellable PO is placed",a:"Non-cancellable means Adleta is obligated to the supplier. Escalate to Tony Shipka and Alan Burk immediately."},{q:"The drop ship PO is received in PPS300 but the customer says they never received the goods",a:"Contact ADL-V001 for proof of delivery. If they cannot provide it, a claim needs to be filed. Do not post the receipt if delivery is unconfirmed."}]},
"fin-1":{obj:"Enter an AP invoice in M3 and match it to the corresponding purchase order receipt.",scn:"An invoice arrives from supplier ADL-V001 for $1,250 against PO TEST-PO-001. Enter the invoice in APS100 and match it to the receipt.",tasks:[{n:"Create the invoice in APS100",s:["Open APS100 (Supplier Invoice. Enter).","Enter Supplier = ADL-V001.","Enter Invoice Number, Invoice Date, and Amount = 1250.","Enter the currency and payment terms."]},{n:"Match to the PO and post",s:["On the invoice line panel, enter PO number = TEST-PO-001.","M3 retrieves the receipt lines - confirm quantity and price match the invoice.","Review the GL coding and confirm the three-way match (PO, receipt, invoice).","Post the invoice - it moves to AP open items for payment."]}],out:["Invoice for $1,250 entered and matched to TEST-PO-001.","Three-way match confirmed with no variances.","Invoice in AP open items ready for payment proposal."],exc:[{q:"The invoice amount in APS100 does not match the PO receipt",a:"Place the invoice on hold. Do not post. Flag the variance to Alan Burk and Philip Jones. A three-way match must be confirmed before payment."},{q:"APS100 returns a duplicate invoice warning",a:"Stop. Do not post. Verify if the invoice was already entered. Duplicate invoice payments are a significant AP control failure."},{q:"The GL account on the invoice line does not match the expense type",a:"Correct the GL code before posting. If you are unsure of the correct account, ask Philip Jones. Posting to the wrong account requires a reversal to fix."},{q:"The supplier sends a credit memo instead of an invoice",a:"Credit memos are entered as negative invoices in APS100. The amount should be negative and it will offset open payables to ADL-V001."}]},
"fin-2":{obj:"Set up AR master data for a customer including payment terms and credit limit.",scn:"Configure customer ADL1001 in M3 for AR with Net 30 terms and a $10,000 credit limit.",tasks:[{n:"Open the customer record and set AR data",s:["Open the customer master panel and search for customer ADL1001.","Open the AR and financial settings tab.","Set Payment Terms = Net 30 (CL1) and Credit Limit = 10000.","Set the credit check method (hard stop vs. warning)."]},{n:"Save and verify",s:["Save the customer record.","Create a test order for ADL1001 and confirm terms default correctly.","Confirm the credit limit appears in the AR overview."]}],out:["ADL1001 configured with Net 30 terms and $10,000 credit limit.","Credit check is active on new orders.","AR master data saved and confirmed."],exc:[{q:"The credit limit you are trying to set exceeds your authorization level",a:"Escalate to Philip Jones or Jaime Johnson. Credit limits above a certain threshold require AR management approval."},{q:"A customer has multiple accounts and you are not sure which one to update",a:"Do not guess. Contact Philip Jones to confirm the correct customer account before making changes."},{q:"The payment terms you want to assign are not on the dropdown list",a:"Do not use the closest match. Contact Philip Jones or IT to add the correct terms. Payment terms affect when invoices are due."},{q:"The customer calls to dispute their credit limit",a:"Do not change the limit based on the call alone. Direct them to contact AR (Philip Jones or Jaime Johnson) for a credit review."}]},
"fin-3":{obj:"Create an AP payment proposal and print an in-house check for supplier payment.",scn:"Supplier ADL-V001 has invoices due this week. Create a payment proposal for in-house check (CH1) and process the check run.",tasks:[{n:"Create and review the payment proposal",s:["Open the AP payment proposal program.","Set Payment Method = CH1 (in-house check) and the due date range for ADL-V001 invoices.","Run the proposal - M3 selects eligible invoices.","Review selected invoices and remove any on hold or in dispute."]},{n:"Print and post the check",s:["Confirm the total payment amount.","Run the check print for the proposal.","Confirm the check number assigned.","Post the payment - M3 clears the invoices from AP open items."]}],out:["Payment proposal created for ADL-V001 invoices due this week.","Check printed with assigned check number.","Invoices cleared from AP open items after posting."],exc:[{q:"An invoice on the payment proposal is flagged as on hold",a:"Do not include it in the payment run. Investigate the hold reason and resolve it before the next proposal."},{q:"The check printer jams mid-run",a:"Stop the print job immediately. Void all checks that printed incorrectly and re-print from the correct sequence number. Do not manually write check numbers on voided checks."},{q:"A check is printed but the wrong amount appears",a:"Void the check immediately before mailing. Identify whether the invoice amount was wrong or the proposal calculation was wrong. Fix and reprint."},{q:"A supplier says they never received the check",a:"Verify the check was printed and mailed. If yes, issue a stop payment with the bank and void and reissue the check in M3."}]},
"fin-4":{obj:"Place an AP invoice on hold to prevent payment until an issue is resolved.",scn:"An invoice from ADL-V001 has a price discrepancy. Hold the invoice in APS205 so it is excluded from payment runs.",tasks:[{n:"Find and hold the invoice",s:["Open APS205 (Supplier Invoice. Display).","Search for invoices from ADL-V001 and locate the one with the price discrepancy.","Select the invoice and choose Hold.","Enter a hold reason code and add a note: Price mismatch - PO $2.50, Invoice $2.75."]},{n:"Verify the hold and notify",s:["Confirm the invoice shows hold status.","Run a test payment proposal - verify the held invoice is excluded.","Notify the buyer (Alan Burk) to resolve the discrepancy with ADL-V001."]}],out:["Invoice on hold and excluded from payment proposals.","Hold reason and note recorded.","Buyer notified to resolve the price discrepancy."],exc:[{q:"You put the wrong invoice on hold by mistake",a:"Remove the hold immediately and verify it will be picked up in the next payment run."},{q:"The buyer resolves the discrepancy but forgets to tell AP",a:"AP should check held invoices weekly. If a hold is older than 5 business days, follow up with the buyer proactively."},{q:"The supplier calls demanding payment on a held invoice",a:"Explain that the invoice is under review and give an expected resolution date. Do not release the hold based on supplier pressure alone."},{q:"The hold reason code does not match the actual situation",a:"Use the closest code and add a detailed note. The note is what the auditor will read, not just the code."}]},
"fin-5":{obj:"Create a wire transfer payment proposal for a supplier requiring electronic payment.",scn:"Supplier ADL-V001 requires payment by wire transfer (WID). Create the payment proposal and process the wire.",tasks:[{n:"Create and confirm the wire proposal",s:["Open the AP payment proposal program.","Set Payment Method = WID (wire transfer).","Select invoices for ADL-V001 due for payment and run the proposal.","Confirm bank account details for ADL-V001 and the total wire amount."]},{n:"Process and post the wire",s:["Approve the proposal for processing.","Submit the wire file to the bank.","Post the payment in M3 once the bank confirms.","Confirm invoices are cleared from AP open items."]}],out:["Wire payment proposal created for ADL-V001.","Wire file generated and submitted to bank.","Invoices cleared from AP after bank confirmation."],exc:[{q:"The bank rejects the wire file",a:"Do not resubmit without investigating the rejection reason. Common causes: wrong bank account number, wrong routing number, or amount mismatch. Verify all details with ADL-V001 before resubmitting."},{q:"The wire is sent but the supplier says they did not receive it",a:"Contact your bank immediately with the wire reference number. Get confirmation of wire delivery before creating a new payment."},{q:"The wire posts in M3 but the bank does not debit the account",a:"Do not post a second time. Work with the bank to trace the wire. A double post creates an overpayment that is difficult to recover."},{q:"ADL-V001 bank details on file differ from what they sent on the invoice",a:"Verify new bank details directly with ADL-V001 by phone - do not use contact information from the invoice. Supplier banking fraud is common."}]},
"fin-6":{obj:"Void a printed AP check that was issued in error or needs to be reissued.",scn:"A check printed to ADL-V001 was damaged and cannot be mailed. Void the check in M3 and reopen the invoices for re-payment.",tasks:[{n:"Locate and void the check",s:["Open the check register in M3 and search for the check number issued to ADL-V001.","Confirm the check has not been cashed.","Select the check and choose Void.","Enter a void reason and the void date - M3 reopens the associated invoices."]},{n:"Verify and re-queue",s:["Confirm the invoices are back in AP open items.","Verify the check is marked void in the check register.","Include the invoices in the next payment proposal run."]}],out:["Check voided and marked in the check register.","Invoices re-open in AP for re-payment.","Void reason documented."],exc:[{q:"You need to void a check but it has already been cashed by the supplier",a:"A cashed check cannot be voided in M3. You will need to pursue recovery directly with the supplier. Contact Philip Jones for the recovery process."},{q:"You void a check but the invoices do not reopen in AP",a:"Check that the void posted correctly. If invoices are still showing as paid, contact Philip Jones - a manual correction may be needed."},{q:"The check sequence is broken after a void",a:"This is expected after a void. Document the void in the check register with the reason. Auditors will ask about any gaps in check sequences."},{q:"A supplier calls to say their check is lost in the mail",a:"Wait the standard mail delivery time plus a buffer. Then confirm the check has not been cashed, void it, and reissue."}]},
"fin-7":{obj:"Process an AR lockbox file and run the AP check print batch.",scn:"The bank has sent a lockbox file with customer payments. Import it and apply payments to AR, then run the daily AP check print.",tasks:[{n:"Import and post the lockbox",s:["Navigate to the AR lockbox import program.","Import today lockbox file from the bank.","M3 matches payments to open AR invoices automatically.","Review match results, identify unmatched payments, and post - AR invoices are cleared."]},{n:"Run the AP check print",s:["Navigate to the AP check print program.","Select the approved payment proposal.","Print checks and confirm check numbers assigned.","Post the payment run."]}],out:["Lockbox imported and AR invoices cleared.","Unmatched payments identified for manual review.","AP checks printed and posted."],exc:[{q:"The lockbox file has payments that do not match any open invoice",a:"Do not force-match them. Leave them as unmatched and flag to Philip Jones. Unmatched payments need to be researched before posting."},{q:"A customer payment is applied to the wrong invoice",a:"Reverse the application and re-apply to the correct invoice. Notify Philip Jones. Incorrect AR application affects aging and collections."},{q:"The AP check print batch runs but no checks print",a:"Confirm the printer is online and has check stock loaded. Also confirm the payment proposal is in Approved status - a Draft proposal cannot print."},{q:"The lockbox total does not match the bank deposit",a:"Do not post. Reconcile the discrepancy before posting. A lockbox posting that does not balance to the bank deposit will cause a reconciliation failure."}]},
"gl-1":{obj:"Review AP and GL master data including the Adleta account string structure in M3.",scn:"Review how the account string maps to Adleta chart of accounts and verify the coding on an existing AP invoice.",tasks:[{n:"Review the account string structure",s:["Open the GL master data panel in M3.","Review Adleta account string: Company, Division, Account, Cost Center.","Identify how each segment maps to an Adleta department."]},{n:"Look up a GL account and review AP coding",s:["Search for an expense account in the GL master.","Review the account type (P and L vs. balance sheet), description, and active status.","Open APS100 and find an invoice from ADL-V001.","Review the GL coding line - confirm company, division, account, cost center match the expense type."]}],out:["You understand the Adleta account string structure.","You can locate and review any GL account in M3.","AP invoices are correctly coded to the GL."],exc:[{q:"An invoice is coded to the wrong division",a:"Catch before posting: correct the coding on the invoice. Catch after posting: a reversal and re-entry are required. Notify Philip Jones immediately."},{q:"A cost center on an invoice does not match any Adleta department",a:"Do not guess. Hold the invoice and get the correct cost center from Philip Jones or the department head before posting."},{q:"You need to look up an account but do not have access to GL master",a:"Contact Philip Jones or IT. Read access to GL master is needed for all AP/AR users and should be set up before go-live."},{q:"An account shows as inactive in GL master",a:"Inactive accounts cannot be posted to. Get the replacement active account from Philip Jones before coding the invoice."}]},
"gl-2":{obj:"Change the GL coding on an AP invoice and reverse an invoice posted in error.",scn:"An AP invoice for ADL-V001 was posted to the wrong GL account. Change the coding and reverse the original posting.",tasks:[{n:"Find the invoice and change GL coding",s:["Open APS200 (Supplier Invoice. Approval).","Search for the incorrectly coded invoice from ADL-V001.","Select the invoice line and choose Change Coding.","Enter the correct GL account number and save."]},{n:"Reverse the original invoice",s:["Use the Reverse function on the posted invoice.","Enter a reversal date and reason.","Post the reversal - M3 creates an offsetting entry.","Re-enter the invoice with the correct GL code."]}],out:["GL coding corrected on the AP invoice.","Reversal posted for the incorrect entry.","Invoice re-entered with the correct account."],exc:[{q:"M3 will not let you change the GL coding on a posted invoice",a:"Fully posted invoices are locked. A reversal and re-entry is the only correction path. Do not attempt workarounds."},{q:"The reversal posts but creates a GL imbalance",a:"Stop. Do not re-enter the invoice until Philip Jones confirms the reversal balanced correctly."},{q:"You reverse the wrong invoice",a:"Reverse the accidental reversal immediately before period close. This creates two offsetting entries that net to zero. Document everything and notify Philip Jones."},{q:"The re-entered invoice with correct coding gets a duplicate invoice warning",a:"The reversed invoice still exists in the system. Confirm the reversal posted fully before re-entering. If the warning persists, contact IT."}]},
"gl-3":{obj:"Run the automatic bank reconciliation process in M3 for Adleta main bank account.",scn:"The monthly bank statement has arrived. Import it and run the automatic reconciliation in M3.",tasks:[{n:"Import the bank statement and run matching",s:["Navigate to the bank reconciliation program in M3.","Import the bank statement file for Adleta main account.","Confirm the statement balance and transaction count.","Run the automatic matching program - M3 matches statement lines to posted GL transactions."]},{n:"Clear exceptions and close",s:["Open unmatched statement items and match manually where possible.","Confirm reconciled balance equals bank statement balance.","Post the reconciliation and print the report for the finance file."]}],out:["Bank statement imported and reconciliation run.","Matched transactions confirmed.","Exceptions identified and reconciliation closed."],exc:[{q:"The bank statement import fails",a:"Check the file format - M3 requires a specific bank file format. Contact IT with the error message. Do not manually key the bank statement into M3."},{q:"Automatic matching only matches 70% of transactions",a:"This is normal for first runs. Manual match the remaining items. Over time the match rate improves as the system learns patterns."},{q:"A transaction matches in M3 but the amount is different from the bank statement",a:"Do not force the match. Flag it as an exception. An amount difference may indicate a bank fee, error, or fraud - investigate before closing."},{q:"The reconciliation closes but Philip Jones finds an error afterward",a:"A closed reconciliation can be reopened by IT. Do not attempt to adjust GL entries manually to cover a reconciliation error."}]},
"gl-4":{obj:"Process an AR debit note write-off for an uncollectable customer balance.",scn:"A balance of $45.00 on customer ADL1001 account is uncollectable. Write it off using the AR debit note process.",tasks:[{n:"Locate the balance and create the write-off",s:["Open the AR open items panel and filter for customer ADL1001.","Identify the $45.00 balance and confirm it is uncollectable.","Open the AR debit note program.","Enter Customer = ADL1001, Amount = 45.00, write-off reason code, and GL account for bad debt expense."]},{n:"Post and verify",s:["Review the debit note details.","Post - M3 clears the $45.00 from AR open items.","Verify the balance on ADL1001 account is now zero."]}],out:["$45.00 balance written off for customer ADL1001.","Bad debt expense posted to the correct GL account.","AR open items for ADL1001 cleared."],exc:[{q:"The write-off amount is larger than your authorization limit",a:"Escalate to Philip Jones or Jaime Johnson. Write-offs above a threshold require management approval. Do not split the write-off to stay under the limit."},{q:"The customer disputes the write-off and says they will pay",a:"Place the write-off on hold. If payment is received, apply it to the open balance. Do not write off a balance a customer has committed to pay."},{q:"The bad debt GL account is not on the approved list",a:"Contact Philip Jones for the correct account. Posting to the wrong account affects financial reporting."},{q:"You write off the wrong customer balance",a:"Reverse the write-off immediately. Post the correct amount to the correct customer. Notify Philip Jones."}]},
"gl-5":{obj:"Create and manage AR tickler notes for collections follow-up on overdue accounts.",scn:"Customer ADL1001 has an invoice 45 days past due. Create a collections tickler note and document the follow-up action.",tasks:[{n:"Find the overdue invoice and create a tickler note",s:["Open the AR aging report or open items panel and filter for customer ADL1001.","Identify the invoice that is 45 days past due.","Open the AR tickler notes program.","Enter Customer = ADL1001, link to the overdue invoice, add note: Called - customer says check mailed, and set follow-up date = 5 business days."]},{n:"Schedule and track follow-up",s:["Save the tickler note.","Confirm the follow-up date appears in the collections queue.","On the follow-up date, return to the tickler to update the status."]}],out:["Tickler note created for ADL1001 overdue invoice.","Follow-up date scheduled.","Collections activity documented in M3."],exc:[{q:"The customer ignores all tickler follow-ups",a:"After 3 unanswered attempts, escalate to Jaime Johnson for formal collections action. Document every attempt in the tickler."},{q:"The customer contact information has changed",a:"Update the contact information in the customer master in M3. Do not use personal cell numbers or emails for collections calls - use the account contacts on file."},{q:"The follow-up date passes and no one followed up",a:"Collections gaps hurt recovery rates. Set a reminder in your calendar in addition to M3. If someone else was supposed to follow up, confirm with them directly."},{q:"The customer makes a partial payment on a large overdue balance",a:"Apply the payment in AR immediately. Update the tickler note with the partial payment received and set a new follow-up date for the remaining balance."}]},
"log-1":{obj:"Pick and pack a will call order in M3 using MWS410.",scn:"Customer ADL1001 is coming to pick up their order. Use MWS410 to generate the pick list and confirm the pick.",tasks:[{n:"Open pick list and pick the items",s:["Open MWS410 (Picking List. Open) and filter for will call orders ready to pick.","Locate the order for customer ADL1001.","Print or display the pick list and go to the warehouse location specified.","Pick the quantity listed and confirm the actual quantity picked."]},{n:"Pack and confirm",s:["Enter the picked quantities back in MWS410.","Confirm the pick - status updates in M3.","Notify the counter that ADL1001 order is ready for pickup."]}],out:["Pick list generated for ADL1001 will call order.","Items picked and confirmed in MWS410.","Order staged and ready for customer pickup."],exc:[{q:"The pick list shows a location that the warehouse team cannot find",a:"Do not substitute a different location without approval. Flag it to Jose Manjarrez - the item may have been moved and the location in M3 is outdated."},{q:"The warehouse picks the wrong quantity",a:"Do not post until the quantity is corrected. Posting the wrong picked quantity creates an inventory error that is difficult to fix after the fact."},{q:"The item is on the pick list but the shelf is empty",a:"Do not substitute another item. Mark it as short, notify the customer, and flag the discrepancy to Jose Manjarrez for an inventory investigation."},{q:"The customer arrives before the pick is confirmed in MWS410",a:"Ask the customer to wait. Do not release goods before the pick is confirmed - the confirmation is what decrements inventory."}]},
"log-2":{obj:"Process a common carrier shipment from order confirmation to shipment in M3.",scn:"A customer order for ADL1001 is ready to ship via UPS. Process the full shipment flow through OIS300 and MWS420.",tasks:[{n:"Confirm the order is ready to ship",s:["Open OIS300 and find the ADL1001 order at status 22.","Verify inventory is allocated and picking is complete.","Confirm the shipping address and carrier selection."]},{n:"Create and confirm the shipment in MWS420",s:["Open MWS420 (Shipment. Open) and create a new shipment linked to the ADL1001 order.","Enter carrier = UPS and shipping date = today.","Add the order to the shipment, confirm all lines are included.","Confirm the shipment - M3 updates order status to shipped."]}],out:["Shipment created for ADL1001 order.","UPS assigned and shipment confirmed.","Order status updates to shipped in M3."],exc:[{q:"The carrier UPS does not appear in the carrier list",a:"Confirm the carrier is set up in M3. If missing, notify Jose Manjarrez or Abbey Parker. Do not use a similar carrier as a substitute."},{q:"The shipment is confirmed in MWS420 but the order status in OIS300 does not update",a:"Allow a few minutes. If the status still does not update after 5 minutes, check for errors in the shipment record and contact IT."},{q:"The shipping address on the order is different from the physical address the customer gave",a:"Confirm with the customer. Update the order before creating the shipment. A shipment with a wrong address is very difficult to reroute."},{q:"The order is partially picked - some lines are not ready to ship",a:"Create the shipment for only the lines that are ready. Leave the unready lines on the order. Partial shipments are supported in M3."}]},
"log-3":{obj:"Set up a new carrier in M3 and configure freight cost management in MWS420.",scn:"Adleta is adding a new regional carrier. Set up the carrier record in M3 and configure the freight rate for warehouse 100.",tasks:[{n:"Create the carrier and configure freight rates",s:["Open MWS420 (Carrier. Open) and click New.","Enter carrier code, name, and contact information.","On the carrier record, open the freight rate panel.","Enter the rate structure and link the freight rate to warehouse 100."]},{n:"Test the carrier setup",s:["Create a test shipment in M3.","Assign the new carrier.","Confirm the freight cost calculates correctly on the shipment."]}],out:["New carrier set up in MWS420.","Freight rates configured for warehouse 100.","Test shipment shows correct freight cost."],exc:[{q:"The new carrier does not have a standard rate structure - they quote per shipment",a:"Set up the carrier in M3 without freight rates. Enter the actual freight cost manually on each shipment. Flag this to Abbey Parker for a longer-term rate agreement."},{q:"The test shipment calculates zero freight cost",a:"Check that the freight rate is linked to warehouse 100 and the correct weight and zone ranges are entered. A zero freight cost will not flag as an error in M3."},{q:"The carrier requires a contract before being set up in M3",a:"Do not create the carrier in M3 until the contract is signed. Notify Abbey Parker that setup is pending contract completion."},{q:"An existing carrier changes their rate structure",a:"Update the freight rates in M3 on the effective date. Do not backdate rate changes."}]},
"log-4":{obj:"Process the full pick, pack, and issue workflow for a will call order in M3.",scn:"Customer ADL1001 will call order needs to go through the full pick, pack, and issue process before they arrive.",tasks:[{n:"Generate pick list and pick items",s:["Open MWS410 and find the will call order for ADL1001.","Print the pick list and confirm the item locations in the warehouse.","Pick the items from the listed locations.","Enter confirmed quantities in MWS410 - if short, note the shortage and notify the customer."]},{n:"Pack and issue",s:["Move the order to the packing station.","Confirm the pack in M3.","Issue the order - M3 decrements inventory and the order is ready."]}],out:["Will call order for ADL1001 picked, packed, and issued.","Inventory decremented.","Order is at shipped/issued status in M3."],exc:[{q:"The pick list shows the item in a location but the item is not there",a:"Mark it as short, notify the customer of the delay, and flag the discrepancy for a physical count of that location."},{q:"The pack confirmation fails in M3",a:"Do not manually skip the pack step. The pack confirmation is required for inventory accuracy. Investigate the error message and contact IT if it persists."},{q:"The issue posts but the inventory quantity does not decrement",a:"Do not issue again. A double issue creates an inventory error. Contact IT with the transaction details."},{q:"The customer arrives early - the order has been picked but not issued",a:"Confirm the pick and issue immediately. Do not release goods to the customer before the issue is posted in M3."}]},
"log-5":{obj:"Complete the full common carrier shipment processing workflow in M3.",scn:"Three customer orders need to be combined into a single carrier shipment going out today. Process the consolidated shipment.",tasks:[{n:"Identify orders and create consolidated shipment",s:["Open OIS300 and filter for orders at status 22 shipping today.","Identify orders going to the same region as candidates for consolidation.","Open MWS420 and create a new shipment.","Add all three orders to the shipment and assign the carrier."]},{n:"Confirm and document",s:["Confirm the shipment in M3.","Print the bill of lading and packing slips.","Update all three orders to shipped status."]}],out:["Three orders consolidated into one carrier shipment.","Bill of lading and packing slips printed.","All three orders updated to shipped status in M3."],exc:[{q:"One of the three orders has a different carrier than the other two",a:"Do not combine orders on different carriers into one shipment. Create separate shipments per carrier."},{q:"A consolidated shipment exceeds the carrier weight limit",a:"Split into two shipments on the same carrier. Do not overload - the carrier will reject the shipment or charge extra."},{q:"One order in the consolidated shipment is cancelled after the bill of lading is printed",a:"Void the bill of lading, remove the cancelled order from the shipment, and reprint. A bill of lading with a cancelled order line is invalid."},{q:"The truck leaves before all orders are confirmed in M3",a:"Post the shipment immediately when the truck leaves, not at the end of the day. Late posting creates AR timing issues."}]},
"prd-1":{obj:"Discontinue an item in M3 by updating its status to 50 and turning off MRP planning.",scn:"A flooring style is being discontinued. Update the item status in MMS060 and disable MRP so no new orders are generated.",tasks:[{n:"Update item status and turn off MRP",s:["Open MMS060 (Item. Open) and search for the item to discontinue.","Change Item Status to 50 (Discontinue) and save.","On the item record, open the planning panel.","Set MRP = Off and save - M3 will no longer generate planned orders for this item."]},{n:"Process remaining inventory and notify",s:["Check MMS200 for remaining stock of the discontinued item.","Decide disposition: sell through, return to supplier, or write off.","Inform the sales team the item is discontinued and update any open quotes."]}],out:["Item status is 50 in MMS060.","MRP disabled - no new planned orders will generate.","Remaining inventory dispositioned and stakeholders notified."],exc:[{q:"There is still a large open PO for the discontinued item",a:"Do not cancel automatically. Discuss with Alan Burk - the PO may need to be received and inventory sold through, or cancelled with supplier agreement."},{q:"Sales continues to enter orders for the discontinued item",a:"Set status 50 in MMS060 - M3 will block new orders. If orders are still getting through, confirm the status was saved correctly."},{q:"The item is discontinued but customer returns keep coming in",a:"Returns can still be processed regardless of item status. Receive the return and disposition the inventory based on condition."},{q:"A team member asks if they can reactivate a discontinued item",a:"This requires product management approval (Lauren Calvey). Do not change item status without written approval."}]},
"prd-2":{obj:"Review an item lifecycle stage and manage the pricing structure in OIS010.",scn:"Review the lifecycle of a carpet item in MMS060 and update its customer price list entry in OIS010.",tasks:[{n:"Review item lifecycle in MMS060",s:["Open MMS060 and search for the carpet item.","Review the item status, introduction date, and phase-out date.","Confirm the item is active and available for sale."]},{n:"Review and update the price list in OIS010",s:["Open OIS010 (Price List. Open) and search for the price list that applies to customer ADL1001.","Locate the line for the carpet item.","Select the price list line and choose Change.","Enter the new price and effective date - save and confirm."]}],out:["Item lifecycle stage confirmed in MMS060.","Price list updated in OIS010 with effective date.","New orders for ADL1001 will use the updated price."],exc:[{q:"The new price takes effect but existing open orders still show the old price",a:"Price changes in OIS010 only apply to new orders. Existing orders keep the price at the time of entry. Update manually only if the customer was quoted the new price."},{q:"The item is in an intermediate lifecycle stage you are not familiar with",a:"Do not guess at the status meaning. Consult Lauren Calvey or the M3 item lifecycle documentation before making changes."},{q:"A customer price list shows a price higher than the standard price list",a:"Customer-specific prices override standard prices in M3. This is by design. Confirm with Tony Shipka or Jeanell Coral before changing it."},{q:"The effective date on the price update is wrong",a:"If the price is not yet live, edit it. If it is already effective, create a new price list entry with the correct date - do not change a live price retroactively without Philip Jones approval."}]},
"prd-3":{obj:"Complete all master data steps for a new product launch so it is available for purchase and sale in M3.",scn:"A new flooring product is being added to Adleta catalog. Complete all master data steps in M3 to make it purchaseable and sellable.",tasks:[{n:"Create the item master in MMS060",s:["Open MMS060 and click New.","Enter item number, description, item type, and unit of measure.","Set the item status to 20 (Active) and save.","Open the planning panel - set MRP = On, safety stock level, lead time, and assign to warehouse 100."]},{n:"Set up the price list and test",s:["Open OIS010 and add the new item to the applicable price list with a price and effective date.","Create a test purchase order from ADL-V001 and a test sales order for ADL1001.","Confirm both process without errors, then delete the test orders."]}],out:["New item active in MMS060 with full master data.","MRP and inventory parameters set for warehouse 100.","Item is on the price list and available for ordering and selling."],exc:[{q:"The new item number is already taken by an existing item",a:"Do not reuse numbers. Each item needs a unique number. Coordinate with Lauren Calvey on the item numbering convention."},{q:"The item master saves but the item does not appear in order entry",a:"Confirm the item status is 20 (Active) and the item is assigned to the correct division and warehouse. Inactive or mis-assigned items are invisible in order entry."},{q:"MRP generates orders immediately after item setup with unrealistic quantities",a:"Check the safety stock and reorder point settings - they may be set too high. Correct them and cancel any unrealistic planned orders before they are released."},{q:"The test order processes but pricing is zero",a:"The item was not added to a price list. Add it to OIS010 before going live. An item with zero price will create billing errors."}]},
