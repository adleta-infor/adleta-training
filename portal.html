<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Adleta Infor M3 — Training Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================
   ADLETA M3 TRAINING PORTAL — FULL BUILD
   Role-based access | Sessions | Quizzes | Video
   ===================================== */
:root {
  --navy:#0f2133;--navy2:#172d42;--navy3:#1f3a52;
  --teal:#1a7a6d;--teal2:#22a08f;--teal3:#e0f2ee;
  --gold:#c49a2a;--gold2:#faf0db;
  --red:#c0443b;--red2:#fce8e7;
  --blue:#2d6fa3;--blue2:#e0ecf7;
  --ink:#0f1f2e;--body:#344b5f;--muted:#6b8199;
  --line:#dde5ed;--bg:#f2f5f8;--surface:#fff;--surface2:#f7f9fb;
  --r:10px;--rsm:6px;
  --shadow:0 2px 12px rgba(15,33,51,0.08);
  --shadow2:0 8px 32px rgba(15,33,51,0.12);
  font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.55;
}
*,*::before,*::after{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--ink);min-height:100vh;}
a{color:var(--teal);text-decoration:none;font-weight:500;}
a:hover{text-decoration:underline;}
button,input,select{font:inherit;}
h1,h2,h3,h4{line-height:1.2;font-weight:700;}
p{color:var(--body);line-height:1.6;}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{background:var(--navy);color:#e8f1f8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-top{padding:22px 18px 16px;}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;}
.brand-mark{width:42px;height:42px;background:linear-gradient(135deg,var(--teal2),var(--teal));border-radius:10px;display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:13px;color:#fff;flex-shrink:0;}
.brand-name{font-size:14px;font-weight:700;color:#fff;line-height:1.2;}
.brand-sub{font-size:12px;color:#7fa3be;}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:var(--rsm);color:#a8c4d8;font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:all .15s;}
.nav-btn svg{opacity:.65;flex-shrink:0;}
.nav-btn:hover,.nav-btn.active{background:var(--navy3);color:#fff;}
.nav-btn.active svg{opacity:1;}
.sidebar-footer{margin-top:auto;padding:14px 18px 20px;border-top:1px solid rgba(255,255,255,0.07);}
.user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--navy3);border-radius:var(--rsm);}
.user-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;color:#fff;}
.user-role{font-size:11px;color:#7fa3be;}
.logout-btn{margin-top:8px;width:100%;padding:7px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:var(--rsm);color:#7fa3be;font-size:13px;cursor:pointer;transition:all .15s;}
.logout-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
.main{display:flex;flex-direction:column;min-width:0;}
.hero{background:var(--navy);padding:28px 36px 24px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 500px 250px at 100% 50%,rgba(26,122,109,0.2) 0%,transparent 70%),repeating-linear-gradient(120deg,rgba(255,255,255,0.015) 0 1px,transparent 1px 52px);pointer-events:none;}
.hero-inner{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.hero-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--teal2);font-weight:700;margin-bottom:8px;}
.hero h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;}
.hero-sub{font-size:13px;color:#7fa3be;}
.hero-actions{display:flex;gap:8px;flex-shrink:0;margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rsm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--teal2);color:#fff;}
.btn-primary:hover{background:var(--teal);color:#fff;text-decoration:none;}
.btn-ghost{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}
.btn-ghost:hover{background:rgba(255,255,255,0.18);color:#fff;text-decoration:none;}
.btn-sm{padding:6px 12px;font-size:13px;}
.content{padding:24px 36px 40px;flex:1;}
.view{display:none;}
.view.active{display:block;}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.sec-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);font-weight:700;margin-bottom:4px;}
.sec-hd h2{font-size:20px;color:var(--ink);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--teal);}
.metric:nth-child(2){border-top-color:var(--blue);}
.metric:nth-child(3){border-top-color:var(--gold);}
.metric:nth-child(4){border-top-color:var(--red);}
.metric-val{font-size:28px;font-weight:800;color:var(--teal);line-height:1;margin-bottom:3px;}
.metric:nth-child(2) .metric-val{color:var(--blue);}
.metric:nth-child(3) .metric-val{color:var(--gold);}
.metric:nth-child(4) .metric-val{color:var(--red);}
.metric-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.dash-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:20px;}
.mastery{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr;align-items:center;}
.mastery-node{background:var(--teal3);border:1px solid #b0d9d2;border-radius:var(--r);padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--teal);min-height:64px;display:grid;place-items:center;}
.mastery-arr{display:grid;place-items:center;color:var(--teal);opacity:.5;}
.prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.prog-track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.prog-label{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;}
.check-list{display:flex;flex-direction:column;gap:6px;}
.check-item{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.check-item:last-child{border-bottom:none;}
.check-item input{width:15px;height:15px;margin-top:2px;accent-color:var(--teal);cursor:pointer;}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.pill-teal{background:var(--teal3);color:#145c52;}
.pill-blue{background:var(--blue2);color:#1e4f7a;}
.pill-gold{background:var(--gold2);color:#7a5c12;}
.pill-red{background:var(--red2);color:#8a2e28;}
.pill-gray{background:#eef2f6;color:#344b5f;}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.mod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all .15s;}
.mod-card:hover{border-color:var(--teal);box-shadow:var(--shadow2);transform:translateY(-1px);}
.mod-card h3{font-size:14px;color:var(--ink);}
.mod-owner{font-size:11px;color:var(--muted);font-weight:600;}
.mod-summary{font-size:12px;color:var(--body);line-height:1.5;flex:1;}
.tags{display:flex;flex-wrap:wrap;gap:4px;}
.tag{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:#eef2f6;color:#344b5f;}
.mod-progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px;}
.mod-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.mod-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.mod-link{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--rsm);color:var(--teal);font-weight:600;transition:all .15s;}
.mod-link:hover{background:var(--teal3);border-color:var(--teal);text-decoration:none;}
.session-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;border:none;background:none;padding:0;margin-bottom:12px;}
.session-back:hover{color:var(--teal);}
.session-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.session-title{font-size:22px;font-weight:700;margin-bottom:16px;}
.session-body{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
.session-content{display:flex;flex-direction:column;gap:16px;}
.session-sidebar{display:flex;flex-direction:column;gap:14px;}
.notes-area{width:100%;min-height:90px;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:13px;color:var(--ink);background:var(--surface);resize:vertical;font-family:inherit;}
.notes-area:focus{outline:none;border-color:var(--teal);}
.notes-saved{font-size:11px;color:var(--teal);margin-top:4px;display:none;}
@media print{body *{visibility:hidden;}.print-zone,.print-zone *{visibility:visible;}.print-zone{position:fixed;top:0;left:0;width:100%;padding:20px;}.print-hide{display:none!important;}}
.step-cards{display:flex;flex-direction:column;gap:12px;}
.step-card{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:box-shadow .15s;}
.step-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.step-num{width:36px;height:36px;min-width:36px;border-radius:50%;background:var(--teal);color:#fff;font-size:15px;font-weight:800;display:grid;place-items:center;font-family:'DM Mono',monospace;}
.step-body{flex:1;}
.step-action{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.step-detail{font-size:13px;color:var(--body);line-height:1.55;display:none;}
.step-detail.open{display:block;margin-top:8px;}
.step-hint-btn{margin-top:6px;background:none;border:none;font-size:12px;color:var(--teal);cursor:pointer;padding:0;font-family:inherit;}
.step-hint-btn:hover{text-decoration:underline;}
.session-progress-header{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:16px;margin-bottom:4px;}
.session-progress-header .prog-track{flex:1;height:8px;border-radius:4px;background:var(--line);}
.session-progress-header .prog-fill{height:100%;border-radius:4px;background:var(--teal);transition:width .3s;}
.session-nav{display:flex;gap:10px;margin-top:8px;}
.session-nav .btn{flex:1;justify-content:center;}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--r);}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:var(--r);}
.video-placeholder{background:var(--navy2);border-radius:var(--r);aspect-ratio:16/9;display:grid;place-items:center;color:#7fa3be;font-size:13px;text-align:center;padding:20px;}
.video-input-wrap{display:flex;gap:8px;margin-top:8px;}
.video-input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:var(--rsm);font-size:13px;outline:none;}
.video-input:focus{border-color:var(--teal);}
.quiz-wrap{display:flex;flex-direction:column;gap:16px;}
.quiz-q{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
.quiz-q-text{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--ink);}
.quiz-options{display:flex;flex-direction:column;gap:8px;}
.quiz-option{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--rsm);cursor:pointer;font-size:13px;transition:all .15s;background:var(--surface);}
.quiz-option:hover{border-color:var(--teal);background:var(--teal3);}
.quiz-option.correct{border-color:#22a08f;background:#e0f2ee;color:#145c52;}
.quiz-option.wrong{border-color:var(--red);background:var(--red2);color:var(--red);}
.quiz-option input{margin-top:2px;accent-color:var(--teal);}
.quiz-result{text-align:center;padding:16px;border-radius:var(--r);font-size:15px;font-weight:700;}
.quiz-result.pass{background:var(--teal3);color:#145c52;}
.quiz-result.fail{background:var(--red2);color:var(--red);}
.quiz-btn{width:100%;padding:10px;background:var(--teal);color:#fff;border:none;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .15s;}
.quiz-btn:hover{background:var(--teal2);}
.gp-wrap{background:var(--surface2);border:1px solid var(--teal2);border-radius:var(--r);padding:22px;margin-bottom:8px;}
.gp-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.gp-step-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;}
.gp-bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
.gp-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .3s;}
.gp-action{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:12px;line-height:1.4;}
.gp-detail{font-size:13px;color:var(--body);line-height:1.65;margin-bottom:22px;}
.gp-nav{display:flex;gap:10px;}
.gp-next{flex:1;padding:12px;background:var(--teal);color:#fff;border:none;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;}
.gp-next:hover{background:var(--teal2);}
.gp-back{padding:12px 16px;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:var(--rsm);font-size:13px;cursor:pointer;}
.gp-done{background:var(--teal3);border:1px solid var(--teal2);border-radius:var(--r);padding:20px;text-align:center;}
.gp-done-title{font-size:17px;font-weight:800;color:var(--teal);margin-bottom:8px;}
.gp-done-sub{font-size:13px;color:var(--body);margin-bottom:16px;}
.ex-obj{font-size:13px;color:var(--body);margin-bottom:14px;padding:10px 14px;background:var(--surface2);border-left:3px solid var(--teal);border-radius:0 var(--rsm) var(--rsm) 0;}
.ex-scenario{background:var(--navy2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;font-size:13px;color:var(--body);line-height:1.6;}
.ex-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--teal);margin-bottom:6px;}
.ex-task{margin-bottom:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.ex-task-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);}
.ex-task-num{width:24px;height:24px;min-width:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;}
.ex-task-name{font-size:13px;font-weight:700;color:var(--ink);}
.ex-steps{margin:0;padding:10px 16px 12px 32px;display:flex;flex-direction:column;gap:6px;}
.ex-steps li{font-size:13px;color:var(--body);line-height:1.5;}
.ex-outcome{background:var(--teal3);border:1px solid var(--teal2);border-radius:var(--r);padding:12px 16px;margin-top:4px;}
.ex-outcome ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;}
.ex-outcome li{font-size:13px;color:#145c52;line-height:1.5;}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.phase-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border-top:4px solid var(--teal);}
.phase-card:nth-child(2){border-top-color:var(--blue);}
.phase-card:nth-child(3){border-top-color:var(--gold);}
.phase-card:nth-child(4){border-top-color:var(--red);}
.phase-weeks{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
.phase-name{font-size:16px;font-weight:700;margin-bottom:8px;}
.phase-purpose{font-size:12px;color:var(--body);margin-bottom:8px;line-height:1.5;}
.phase-success{font-size:12px;color:var(--teal);font-style:italic;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;line-height:1.5;}
.su-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.su-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.su-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;}
.su-name{font-size:14px;font-weight:700;}
.su-dept{font-size:11px;color:var(--muted);}
.su-mod{font-size:10px;font-family:'DM Mono',monospace;color:var(--teal);margin-top:3px;}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;}
.res-card h3{font-size:14px;}
.res-card p{font-size:12px;color:var(--body);flex:1;}
.res-link{font-size:13px;display:inline-flex;align-items:center;gap:5px;margin-top:4px;}
.search-input{padding:8px 13px;border-radius:var(--rsm);border:1px solid var(--line);background:var(--surface);width:260px;font-size:13px;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--teal);}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.user-table{width:100%;border-collapse:collapse;font-size:13px;}
.user-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:12px;font-weight:600;}
.user-table td{padding:9px 12px;border-bottom:1px solid var(--line);}
.user-table tr:hover td{background:var(--surface2);}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.dot-green{background:#22a08f;}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
@media(max-width:1100px){.mod-grid,.res-grid,.su-grid{grid-template-columns:repeat(2,1fr);}.timeline{grid-template-columns:repeat(2,1fr);}.metrics{grid-template-columns:repeat(2,1fr);}.session-body{grid-template-columns:1fr;}}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{height:auto;position:static;}.hero{padding:20px;}.content{padding:16px 18px 32px;}.dash-grid,.admin-grid{grid-template-columns:1fr;}.mod-grid,.res-grid,.su-grid,.timeline{grid-template-columns:1fr;}.mastery{grid-template-columns:1fr;gap:6px;}}

.admin-tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:20px;}
.admin-tab{padding:10px 20px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;}
.admin-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
.admin-tab-pane{display:none;}.admin-tab-pane.active{display:block;}
.guide-section{margin-bottom:28px;}
.guide-section h3{font-size:14px;font-weight:800;color:var(--ink);margin:0 0 10px 0;padding-bottom:8px;border-bottom:1px solid var(--line);}
.guide-su-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px;}
.guide-su-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);}
.guide-su-name{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:2px;}
.guide-su-dept{font-size:11px;color:var(--muted);margin-bottom:8px;}
.guide-su-modules{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}

MMS060) to view inventory for that item.", "Confirm the stock balance panel opens without re-entering the item number."]}],outcome:["You can launch any M3 program by typing its code in the search bar.", "You can navigate between panels, sort lists, and right-click to related programs.", "You understand the difference between Escape (cancel) and closing a panel."],,videoUrl:"",quiz:[{q:"To open a program in M3, you type the program code in:",options:["The URL bar","The left panel search bar","The Settings menu","The Help menu"],answer:1},{q:"In a list view, right-clicking a row and choosing Change does:",options:["Deletes the record","Opens the record for editing","Displays the record read-only","Copies the record"],answer:1},{q:"The panel tabs at the bottom of a program (E, F, G...) represent:",options:["Different companies","Different users logged in","Different data panels for the same record","Different warehouses"],answer:2}],checklist:["I can open any M3 program by typing its code in the search bar","I can navigate panel tabs and name what each contains","I use right-click (not double-click) to Select, Change, and Display records","I can use the lookup icon to search for a customer, supplier, or item","I have submitted a test entry to the issue log"]},{id:"fnd-3",title:"Terminology — What We Call It vs. What M3 Calls It",duration:"1.5 hours",objective:"Map Adleta business terms to their M3 equivalents so you can find the right data in the right place.",scenario:"A team member asks where to find a customer account in M3. Practice looking up the key terminology mappings and locating each one in the system.",tasks:[{"name": "Look up customers in M3", "steps": ["Open OIS300 (Customer. Open) in M3.", "Search for customer number ADL1001.", "Confirm the record shows \u2014 this is what Adleta calls a customer account."]}, {"name": "Look up vendors/suppliers", "steps": ["Open CRS620 (Supplier. Open) in M3.", "Search for supplier ADL-V001.", "Note the M3 term is Supplier \u2014 Adleta calls this a vendor."]}, {"name": "Locate a warehouse and item", "steps": ["Open MMS060 (Item. Open) and search for any flooring item.", "Right-click and select Stock Balance to view warehouse 100.", "Confirm warehouse 100 is the main Adleta facility."]}, {"name": "Self-quiz the terminology crosswalk", "steps": ["Open the Foundation Learning Guide from the module Resources section.", "Find the Terminology Crosswalk table.", "Cover the M3 column and name the M3 term for each Adleta term without looking."]}],outcome:["You can find customers, vendors, warehouses, and items in M3.", "You know the key Adleta-to-M3 term mappings.", "You can locate the correct program for any common lookup."],,videoUrl:"",quiz:[{q:"The M3 program for managing customer master records is:",options:["PPS200","CRS610","MMS060","OIS100"],answer:1},{q:"In Adleta terminology, a branch maps to which M3 entity?",options:["Division","Warehouse","Company","Cost Center"],answer:1},{q:"Procure to Pay starts with a PO in PPS200 and ends with:",options:["A customer invoice in OIS300","A cash receipt in ARS110","A vendor payment in APS130","A stock receipt in MMS060"],answer:2}],checklist:["I can name the M3 program for each core entity in my module","I can translate Adleta terms to M3 terms without notes","I can trace Procure to Pay from PO through vendor payment","I can trace Order to Cash from customer order through cash receipt"]},{id:"fnd-4",title:"Foundation Check — Prove You Can Do It",duration:"1.5 hours",objective:"Demonstrate all foundation skills without assistance to confirm readiness for module training.",scenario:"Kristen will call out tasks one at a time. Complete each one in M3 without referring to notes. This is your certification check for the Foundation module.",tasks:[{"name": "Navigation check", "steps": ["Open PPS200 without using the menu \u2014 type it in the search bar.", "Open MMS200 and sort the item list by description.", "Use right-click Related to open stock balance from MMS200."]}, {"name": "Lookup check", "steps": ["Find supplier ADL-V001 and confirm their payment terms.", "Find customer ADL1001 and confirm their credit limit.", "Look up any item and confirm its stock in warehouse 100."]}, {"name": "Terminology check", "steps": ["State the M3 term for: Purchase Order, Vendor, Warehouse, Item Master, Customer.", "State the M3 program for: entering a sales order, receiving goods, viewing stock.", "Explain the difference between Escape and closing a panel to the trainer."]}],outcome:["You passed the Foundation check and are cleared for module training.", "You can navigate M3 and locate records without assistance.", "Your trainer has signed off on your Foundation readiness checklist."],,videoUrl:"",quiz:[{q:"During the navigation practical, you should open programs:",options:["Using bookmarks a trainer set up","By typing program codes in the search bar without coaching","By asking IT to open them","From the help menu"],answer:1},{q:"To edit a record in a list view, the correct method is to:",options:["Double-click the row","Single-click the row","Right-click and choose Change","Press F5"],answer:2},{q:"A super user is cleared for go-live when they:",options:["Attend all sessions","Pass the teach-back and complete the issue log review","Complete the online quiz only","Get IT approval"],answer:1}],checklist:["I opened three role-relevant programs without coaching","I looked up a customer, supplier, and item and named key fields","I right-clicked correctly to open a record for editing","I completed my teach-back without notes","All my open issues from fnd-1 through fnd-3 are assigned or resolved"]}]},
  purchasing:{id:"purchasing",name:"Purchasing / Procurement",owner:"Alan Burk",weeks:"Week 3",pill:"pill-blue",color:"#2d6fa3",programs:["CRS620","PPS200","PPS201","PPS300","APS100"],summary:"Supplier lookup, purchase orders, receiving handoff, approvals, and three-way match.",links:[["Deck",SP+"/Adleta_M3_Purchasing_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Purchasing_LearningGuide.docx"]],sessions:[{id:"pur-1",title:"Planned PO Release",duration:"45 min",objective:"Release a planned purchase order generated by MRP into a confirmed PO in M3.",scenario:"MRP has generated a planned order for 500 SQF of carpet from vendor ADL-V001 for warehouse 100. Your buyer code is on the order. Review and release it.",tasks:[{"name": "Filter planned orders in PPS170", "steps": ["Open PPS170 (Planned Purchase Orders. Open).", "Set Buyer = your buyer code and Warehouse = 100.", "Press Enter to display the MRP-generated planned orders."]}, {"name": "Review the planned PO", "steps": ["Locate the line for vendor ADL-V001.", "Right-click and select Open to review: item number, quantity (500 SQF), need date, and suggested supplier.", "Confirm all details are correct before releasing."]}, {"name": "Release the planned PO", "steps": ["Return to the PPS170 list and select the ADL-V001 line.", "Right-click and choose Release.", "M3 converts the planned order to a PO and assigns a PO number."]}, {"name": "Verify in PPS200", "steps": ["Open PPS200 (Purchase Order. Open).", "Search for the new PO using vendor ADL-V001.", "Confirm status = 15 (Confirmed) and quantity = 500 SQF."]}],outcome:["Planned PO is released and converted to status 15 in PPS200.", "PO is linked to vendor ADL-V001 with the correct item and quantity.", "MRP planning reflects the order as committed."],,videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Planned%20PO%20Release.mp4",quiz:[{q:"Planned POs P%20P2P-20251215%20Non-Stocking%20WHS%20PO%20for%20one%20time%20exception.mp4",quiz:[{q:"Before creating a PO, you must verify the vendor status is:",options:["Pending","Inactive","Active","On hold"],answer:2},{q:"If a vendor is not in M3 or is inactive, you should:",options:["Create a new vendor record yourself","Contact Finance to set up or reactivate the vendor","Use a different vendor instead","Skip the vendor field and proceed"],answer:1},{q:"You should NEVER contact a vendor about a PO until the PO status shows:",options:["Entered (10)","Pending Approval (20)","Released (40)","Invoiced (90)"],answer:2}],checklist:["I can look up a vendor in CRS620 and verify status, terms, and pricing","I can create a non-stock PO header in PPS200 with the correct PO type","I can add PO lines in PPS201 with item, qty, price, and justification reference","I know how to check PO approval status and when it is safe to contact the vendor","I can transmit the PO to the vendor using PPS310"]},{id:"pur-3",title:"Receiving Goods — PPS300 and Three-Way Match",duration:"60 min",objective:"Process a goods receipt against a confirmed PO and verify the three-way match in M3.",scenario:"Vendor ADL-V001 has delivered 500 SQF against PO TEST-PO-001. Receive the goods in PPS300 and confirm the receipt matches the PO and invoice.",tasks:[{"name": "Open the PO in PPS300", "steps": ["Open PPS300 (Goods Receiving. Open).", "Search for PO number TEST-PO-001.", "Confirm the expected quantity (500 SQF) and item are displayed."]}, {"name": "Enter the receipt", "steps": ["Select the PO line and click Receive.", "Enter received quantity = 500.", "Enter the delivery note number from the vendor packing slip.", "Press Enter to save."]}, {"name": "Post the receipt", "steps": ["Confirm all details match: item, quantity, warehouse 100.", "Post the receipt \u2014 M3 updates inventory and creates the goods receipt transaction.", "Note the receipt number generated."]}, {"name": "Verify three-way match", "steps": ["Open APS100 (Supplier Invoice. Enter).", "Match the receipt to PO TEST-PO-001.", "Confirm quantity and price match \u2014 M3 will flag any discrepancy."]}],outcome:["Goods receipt is posted against TEST-PO-001.", "Inventory in warehouse 100 increases by 500 SQF.", "Three-way match between PO, receipt, and invoice is confirmed."],,videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215_141931-Meeting%20Recording.mp4",quiz:[{q:"Lot numbers for lot-tracked items must be entered:",options:["After posting the receipt","Only if quantity exceeds 100","Before saving the receipt in PPS300","In APS100, not PPS300"],answer:2},{q:"If you receive less than the PO quantity, M3:",options:["Closes the PO line automatically","Keeps the PO open for the remaining quantity","Creates an error and blocks the receipt","Notifies the vendor automatically"],answer:1},{q:"Never receive goods into M3 that you:",options:["Have already invoiced","Do not physically have in the warehouse","Ordered more than 30 days ago","Received from a non-EDI vendor"],answer:1}],checklist:["I can open PPS300, enter a PO number, and verify PO lines before receiving","I can enter received quantities and lot numbers correctly","I know how to handle a short receipt and where to see the open balance","I know NOT to receive more than the PO quantity without a PO amendment","I can confirm the receipt and verify PO status updated in PPS200"]},{id:"pur-4",title:"Manual Purchase Order — Stocking Item",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2003%202025%20-%20P2P/Bravo%20-%20Mini%20CRP%20P2P%20scenarios-20251203%20Manual%20PO%20Stocking%20Item.mp4",objective:"Create a manual PO for a stocking item when MRP has not generated a planned order.",scenario:"You need to order 200 SQF of a stocking item from ADL-V001 that MRP missed. Create the PO manually in PPS200.",tasks:[{"name": "Create the PO header", "steps": ["Open PPS200 and click New.", "Enter Supplier = ADL-V001 and select the standard PO order type.", "Set Warehouse = 100 and a delivery date 2 weeks out."]}, {"name": "Add a stocking item line", "steps": ["On the line entry panel, look up the item number using the search field.", "Enter Quantity = 200 and confirm unit = SQF.", "Verify unit cost pulls from the supplier price list \u2014 adjust if needed."]}, {"name": "Confirm and save", "steps": ["Review the order total.", "Confirm the PO (status 15).", "Write down the PO number for follow-up."]}],outcome:["Manual stocking PO created in PPS200 with correct item and quantity.", "PO confirmed at status 15 and linked to vendor ADL-V001.", "Order is ready for receiving when goods arrive."],,quiz:[{q:"To create a manual purchase order, you open:",options:["CRS620","OIS100","PPS200","APS100"],answer:2},{q:"Individual item lines are added to a PO in:",options:["PPS200","PPS201","PPS300","CRS620"],answer:1},{q:"To print or transmit a PO to a vendor, you use:",options:["PPS200","PPS201","PPS310","APS100"],answer:2},{q:"Before creating a PO you should verify the vendor is active in:",options:["OIS100","PPS200","CRS620","MMS060"],answer:2}],checklist:["I can look up a vendor in CRS620 and verify their account is active","I can create a manual PO header in PPS200","I can add item lines in PPS201","I can verify pricing against the vendor agreement","I can print/transmit a PO using PPS310"]},{id:"pur-5",title:"PO Management — Cancel, Split, and Notes",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Cancel%20PO%20in%20Status%2035%20Standalone.mp4",objective:"Cancel, split, and add notes to an existing purchase order in M3.",scenario:"You need to cancel one line on TEST-PO-001, split another line into two deliveries, and add a note for the vendor.",tasks:[{"name": "Cancel a PO line", "steps": ["Open PPS200 and locate TEST-PO-001.", "Select the line to cancel and right-click \u2192 Change Status.", "Set status to Cancelled (90) and confirm."]}, {"name": "Split a PO line", "steps": ["Select the line to split and right-click \u2192 Split Line.", "Enter the first delivery quantity and date.", "Enter the second delivery quantity and date.", "Confirm both lines appear in the order."]}, {"name": "Add a vendor note", "steps": ["On the PO header, open the Text/Notes panel.", "Enter a note for the vendor (e.g., Ship to dock B \u2014 call ahead).", "Save the note and confirm it is linked to the PO."]}],outcome:["One PO line is cancelled at status 90.", "One line is split into two delivery schedules.", "Vendor note is saved on the PO header."],,quiz:[{q:"PO status 35 in M3 means:",options:["PO is in draft","PO has been released/sent to the vendor","PO is fully received","PO is cancelled"],answer:1},{q:"Before cancelling a PO, you should:",options:["Print the PO first","Verify no partial receiving has occurred and contact the vendor","Change status to 20","Delete all PO lines"],answer:1},{q:"The Split action on a PO line is used to:",options:["Copy the line to a new PO","Divide one PO line into two separate lines","Cancel half the quantity","Move the line to a different vendor"],answer:1},{q:"PO notes are most useful for documenting:",options:["Financial journal entries","Vendor communication, change reasons, and special instructions","Customer order details","Inventory adjustments"],answer:1}],checklist:["I can add notes to a purchase order in PPS200","I can split a PO line into multiple lines","I can cancel a PO in status 35 after verifying no partial receiving","I can update warehouse and supplier on a PO","I know when to cancel vs. close a PO"]},{id:"pur-6",title:"Updating the Supplier on a Purchase Order",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/site e process for requesting new vendor setup","I know how to check EDI settings for a vendor"]},

ery day"]}

,"I can print the packing list for the customer","I can update the order status to ready for pickup and verify it in OIS100"]},{id:"log-2",title:"Common Carrier Shipping — Order to Shipment",duration:"45 min",objective:"Process a common carrier shipment from order confirmation to shipment in M3.",scenario:"A customer order for ADL1001 is ready to ship via UPS. Process the full shipment flow through OIS300 and MWS420.",tasks:[{"name": "Confirm the order is ready to ship", "steps": ["Open OIS300 and find the ADL1001 order at status 22.", "Verify inventory is allocated and picking is complete.", "Confirm the shipping address and carrier selection."]}, {"name": "Create the shipment in MWS420", "steps": ["Open MWS420 (Shipment. Open).", "Create a new shipment linked to the ADL1001 order.", "Enter carrier = UPS and shipping date = today."]}, {"name": "Process and confirm shipment", "steps": ["Add the order to the shipment.", "Confirm all lines are included.", "Confirm the shipment \u2014 M3 updates order status to shipped."]}],outcome:["Shipment created for ADL1001 order.", "UPS assigned and shipment confirmed.", "Order status updates to shipped in M3."],,videoUrl:"",quiz:[{q:"The carrier assigned to an order is shown in the Ship Via field in:",options:["PPS200","MWS420","OIS100","GLS040"],answer:2},{q:"A Bill of Lading for an LTL shipment is generated in:",options:["OIS100","DPS100","ARS120","PPS310"],answer:1},{q:"The customer manifest showing today's deliveries and COD amounts is found in:",options:["Birst","WAR 8 > C3","OIS300","MWS420"],answer:1}],checklist:["I can verify and update the carrier assignment in OIS100","I can generate a BOL in DPS100 with correct shipper, consignee, and freight class","I can print a customer manifest for today's route","I can enter a carrier tracking number back into the order after pickup"]},{id:"log-3",title:"Carrier Setup and Freight Cost Management — MWS420",duration:"45 min",objective:"Set up a new carrier in M3 and configure freight cost management in MWS420.",scenario:"Adleta is adding a new regional carrier. Set up the carrier record in M3 and configure the freight rate for warehouse 100.",tasks:[{"name": "Create the carrier record", "steps": ["Open MWS420 (Carrier. Open).", "Click New to create a new carrier.", "Enter carrier code, name, and contact information."]}, {"name": "Configure freight rates", "steps": ["On the carrier record, open the freight rate panel.", "Enter the rate structure: base rate plus per-unit or weight-based.", "Link the freight rate to warehouse 100."]}, {"name": "Test the carrier setup", "steps": ["Create a test shipment in M3.", "Assign the new carrier.", "Confirm the freight cost calculates correctly on the shipment."]}],outcome:["New carrier set up in MWS420.", "Freight rates configured for warehouse 100.", "Test shipment shows correct freight cost."],,videoUrl:"",quiz:[{q:"Before adding a new carrier in MWS420, you should first:",options:["Call the carrier to confirm they can use M3","Search for the carrier name to confirm it does not already exist under a different ID","Get approval from Finance","Create a test delivery"],answer:1},{q:"Freight terms Collect means:",options:["Adleta pays freight and bills the customer","The customer pays the carrier directly","A third-party account is billed","Freight is included in the product price"],answer:1},{q:"If a carrier consistently misses pickups or has high damage rates, you should:",options:["Immediately delete the carrier from M3","Continue using them until a better option is found","Document the pattern and raise it with management for carrier review","Only use them for low-priority shipments"],answer:2},{q:"When a carrier is no longer used, you should:",options:["Delete the carrier record","Inactivate the carrier — do not delete, to preserve freight history","Leave it active but stop using it","Archive it to SharePoint"],answer:1}],checklist:["I can set up a new carrier record in MWS420 with correct ID, name, service type, and status","I check for duplicate carrier records before creating a new one","I understand the three freight term types — Prepaid, Collect, and Third Party","I can identify freight cost variances in OIS600 and know when to escalate","I track carrier performance — on-time, damage, tracking accuracy — and document patterns","I inactivate unused carriers rather than deleting them to preserve history"]},{id:"log-4",title:"Will Call — Pick, Pack, and Issue",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Pick%20pack%20issue%20WC.mp4",objective:"Process the full pick, pack, and issue workflow for a will call order in M3.",scenario:"Customer ADL1001 will call order needs to go through the full pick, pack, and issue process before they arrive.",tasks:[{"name": "Generate and review pick list", "steps": ["Open MWS410 and find the will call order for ADL1001.", "Print the pick list.", "Confirm the item locations in the warehouse."]}, {"name": "Confirm the pick", "steps": ["Pick the items from the listed locations.", "Enter confirmed quantities in MWS410.", "If short, note the shortage and notify the customer."]}, {"name": "Pack and issue", "steps": ["Move the order to the packing station.", "Confirm the pack in M3.", "Issue the order \u2014 M3 decrements inventory and the order is ready."]}],outcome:["Will call order for ADL1001 picked, packed, and issued.", "Inventory decremented.", "Order is at shipped/issued status in M3."],,quiz:[{q:"Will Call orders are issued at which level in M3?",options:["Shipment level","Load level","Delivery level","Invoice level"],answer:2},{q:"Why do Will Call orders not require load building?",options:["Will Call orders are too small for load planning","The customer picks up at the warehouse — no truck loading needed","IT disabled load building for Will Call","The warehouse team skips this step"],answer:1},{q:"When is inventory decremented for a Will Call order?",options:["When the pick list is printed","When the customer confirms by phone","When the delivery is issued in M3","At month-end inventory close"],answer:2},{q:"After issuing the Will Call delivery, the next step is:",options:["Create a new order for the customer","Process an AP invoice","The order cycle is complete — inventory is decremented","Submit for supervisor approval"],answer:2}],checklist:["I can locate and print a Will Call pick list in M3","I can confirm pick quantities in M3 after picking","I can issue a Will Call delivery at the delivery level","I understand Will Call does not require load building or dock assignment","I know how to stage orders for customer pickup"]},{id:"log-5",title:"Common Carrier — Shipment Processing",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Common%20carrier%20scenario.mp4",objective:"Complete the full common carrier shipment processing workflow in M3.",scenario:"Three customer orders need to be combined into a single carrier shipment going out today. Process the consolidated shipment.",tasks:[{"name": "Identify orders for consolidation", "steps": ["Open OIS300 and filter for orders at status 22 shipping today.", "Identify orders going to the same region as candidates for consolidation.", "Confirm available inventory for all three orders."]}, {"name": "Create consolidated shipment", "steps": ["Open MWS420 and create a new shipment.", "Add all three orders to the shipment.", "Assign the carrier and confirm total weight and volume."]}, {"name": "Confirm and document", "steps": ["Confirm the shipment in M3.", "Print the bill of lading and packing slips.", "Update all three orders to shipped status."]}],outcome:["Three orders consolidated into one carrier shipment.", "Bill of lading and packing slips printed.", "All three orders updated to shipped status in M3."],,quiz:[{q:"Common Carrier deliveries are issued at the:",options:["Shipment level","Delivery level","Load level","Order header level"],answer:1},{q:"Tracking numbers for Common Carrier shipments are entered in M3 at the:",options:["Order header","Invoice","Pick list","Delivery level"],answer:3},{q:"A delivery address change must be completed:",options:["After issuing the delivery","At any time up to invoicing","Before issuing the delivery","Only by a Finance user"],answer:2},{q:"After a Common Carrier delivery is issued in M3, what happens automatically?",options:["A PO is created","The AR invoice is triggered","The item is back-ordered","The pick list is reprinted"],answer:1}],checklist:["I can process a Common Carrier pick and pack workflow","I can issue a Common Carrier delivery at the delivery level in M3","I can enter a tracking number at the delivery level","I know how to update a delivery address before issuing","I understand that issuing the delivery triggers the AR invoice"]}]},
  productManagement:{id:"productManagement",name:"Product Management",owner:"Lauren Calvey",weeks:"Week 5-6",pill:"pill-gray",color:"#7a5ea6",programs:["MMS060","MMS001","MMS002","OIS010","MMS200"],summary:"Item master setup and maintenance, product lifecycle, pricing structures, and product catalog management in M3.",links:[["Guide",SP+"/Adleta_M3_ProductManagement_LearningGuide.docx"]],sessions:[{id:"prd-1",title:"Discontinuing an Item — Status 50 and MRP Off",duration:"60 min",objective:"Discontinue an item in M3 by updating its status to 50 and turning off MRP planning.",scenario:"A flooring style is being discontinued. Update the item status in MMS060 and disable MRP so no new orders are generated.",tasks:[{"name": "Update item status in MMS060", "steps": ["Open MMS060 (Item. Open) and search for the item to discontinue.", "Change Item Status to 50 (Discontinue).", "Save the change."]}, {"name": "Turn off MRP for the item", "steps": ["On the item record, open the planning panel.", "Set MRP = Off (or Planning Method = no planning).", "Save \u2014 M3 will no longer generate planned orders for this item."]}, {"name": "Process remaining inventory and notify", "steps": ["Check MMS200 for remaining stock of the discontinued item.", "Decide disposition: sell through, return to vendor, or write off.", "Inform the sales team the item is discontinued and update any open quotes."]}],outcome:["Item status is 50 in MMS060.", "MRP disabled \u2014 no new planned orders will generate.", "Remaining inventory dispositioned and stakeholders notified."],,videoUrl:"",quiz:[{q:"Item master records are managed in:",options:["OIS100","CRS610","MMS060","PPS200"],answer:2},{q:"Setting the MRP flag to OFF on an item stops M3 from:",options:["Shipping the item","Auto-generating planned purchase orders for that item","Displaying the item in OIS100","Deleting the item"],answer:1},{q:"Item Status 50 prevents:",options:["Receiving against open POs","New customer orders from being placed","Existing open orders from shipping","The item from appearing in Birst"],answer:1}],checklist:["I can look up an item in MMS060 and review its status and open orders","I can turn off the MRP planning flag and explain what it does","I can change Item Status to 50 and verify new orders are blocked in OIS100","I add a note to the item with discontinuation date, reason, and authorizer"]},{id:"prd-2",title:"Product Lifecycle and Pricing Structure — MMS060 and OIS010",duration:"60 min",objective:"Review an item's lifecycle stage and manage the pricing structure in OIS010.",scenario:"Review the lifecycle of a carpet item in MMS060 and update its customer price list entry in OIS010.",tasks:[{"name": "Review item lifecycle in MMS060", "steps": ["Open MMS060 and search for the carpet item.", "Review the item status, introduction date, and phase-out date.", "Confirm the item is active and available for sale."]}, {"name": "Review the price list in OIS010", "steps": ["Open OIS010 (Price List. Open).", "Search for the price list that applies to customer ADL1001.", "Locate the line for the carpet item."]}, {"name": "Update the price", "steps": ["Select the price list line and choose Change.", "Enter the new price and effective date.", "Save \u2014 confirm the new price applies to orders after the effective date."]}],outcome:["Item lifecycle stage confirmed in MMS060.", "Price list updated in OIS010 with effective date.", "New orders for ADL1001 will use the updated price."],,videoUrl:"",quiz:[{q:"To discontinue an item in M3, you set its status to 90. Before doing this you must confirm:",options:["The item has been in the system for at least one year","There are no open POs, no open sales orders, and zero stock on hand — and you have notified Purchasing, Sales, and Warehouse","Finance has approved the removal","IT has deleted the item from the price list"],answer:1},{q:"Item prices in M3 are stored in:",options:["MMS060 on the item record","OIS010 on the price list","MMS200 in the stock balance","GLS040 in the chart of accounts"],answer:1},{q:"If a sales order is pulling the wrong price for a customer, the first place to check is:",options:["The item record in MMS060","The customer's price list assignment in OIS017","The GL account","The purchase order"],answer:1},{q:"When making a price list change that affects active customers, you should:",options:["Make the change immediately and notify no one","Update the expiry date but leave the price alone","Notify KRISTENB and Sales before updating, document the effective date and reason","Wait until the end of the financial year"],answer:2}],checklist:["I understand the product lifecycle stages and how item status controls M3 transactions","I know the steps to safely discontinue a product — checking POs, orders, stock, and notifying departments","I can add and update item prices in OIS010 with correct effective and expiry dates","I verify price changes on a test sales order before communicating to the business","I document every price change with effective date and reason and notify affected teams in advance"]},{id:"prd-3",title:"Master Data Quality and New Product Launch Coordination",duration:"60 min",objective:"Complete all master data steps for a new product launch so it is available for purchase and sale in M3.",scenario:"A new flooring product is being added to Adleta's catalog. Complete all master data steps in M3 to make it purchaseable and sellable.",tasks:[{"name": "Create the item master in MMS060", "steps": ["Open MMS060 and click New.", "Enter item number, description, item type, and unit of measure.", "Set the item status to 20 (Active) and save."]}, {"name": "Set up planning and inventory parameters", "steps": ["Open the planning panel for the new item.", "Set MRP = On, safety stock level, and lead time.", "Assign the item to warehouse 100."]}, {"name": "Set up the price list and test", "steps": ["Open OIS010 and add the new item to the applicable price list with a price and effective date.", "Create a test purchase order from ADL-V001 and a test sales order for ADL1001.", "Confirm both process without errors, then delete the test orders."]}],outcome:["New item active in MMS060 with full master data.", "MRP and inventory parameters set for warehouse 100.", "Item is on the price list and available for ordering and selling."],,videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Turn%20Off%20MRP%20on%20item%20when%20discontinued%20Sts-50.mp4",quiz:[{q:"Before a new item's status is changed to Active (20) in MMS060, which five things must be complete?",options:["Item number, color, weight, size, and brand","Item created, UOM confirmed, price set, Purchasing and Warehouse notified, Sales notified of availability","IT approval, Finance approval, manager sign-off, legal review, and vendor contract","Item created, test order placed, shipped, invoiced, and paid"],answer:1},{q:"If you find a potential duplicate item in MMS060, you should:",options:["Immediately inactivate the newer one","Coordinate with IT and Purchasing to confirm which record is correct before taking action","Delete both and start over","Leave it — duplicates are normal in M3"],answer:1},{q:"Item substitutes for out-of-stock products should be:",options:["Handled verbally between Sales reps without any documentation","Documented in the item record notes and shared with Sales, including lead time and availability differences","Created as new item records in MMS060","Entered as returns in OIS390"],answer:1},{q:"A seasonal item whose price expires at end of season should be handled by:",options:["Deleting the price record after the season","Setting an expiry date on the price in OIS010 when the price is created — not managing it manually after the fact","Leaving the old price active until the next season starts","Contacting Finance to remove the price"],answer:1}],checklist:["I understand my role as master data owner and how item data quality affects every department","I can run a regular item master audit and identify items needing attention in MMS060","I know the five-step new product launch checklist before changing status to Active","I document all item changes with who, when, and why — in MMS060 notes and SharePoint","I know how to handle item substitutes and communicate them to Sales with lead time differences","I manage seasonal item prices with correct effective and expiry dates in OIS010"]}]},
  week9:{id:"week9",name:"Trainer Readiness and Go-Live Prep",owner:"All super users",weeks:"Week 9",pill:"pill-red",color:"#c0443b",programs:["Teams","SharePoint","Issue Log","Planner"],summary:"Teach-backs, readiness sign-off, FAQ build, go-live support roles, department training handoff, and stabilization.",links:[["Teach-Back Packet",SP+"/Week_9_Teach_Back_Readiness_Signoff_Packet.md"],["Go-Live Playbook",SP+"/Go_Live_Support_Playbook.md"],["Department Handoff Plan",SP+"/Department_Training_Handoff_Plan.md"]],sessions:[{id:"w9-1",title:"Teach-Back Preparation",duration:"60 min",steps:[["1","Review your module","Open your module in the portal and review every session, step, quiz, and checklist. Identify any gaps before your teach-back."],["2","Know your 15-minute structure","2 min: explain the department workflow. 5 min: walk through key M3 programs. 3 min: explain one exception and first response. 2 min: explain a department handoff. 2 min: give a practice question you would ask users. 1 min: confirm escalation path."],["3","Prepare your normal scenario","Choose one complete normal workflow you can walk through live in M3 — from opening the program to saving the transaction."],["4","Prepare your exception scenario","Choose one common exception in your module. Know the steps: identify it, who to contact, how to log it."],["5","Prepare your handoff","Name one department that hands off to you and one you hand off to. Know what data must be correct at each handoff."],["6","Prepare a department training tip","Think about one thing your department users will find confusing. Plan how you would explain or demonstrate it."],["7","Practice with a peer","Run through your 15-minute teach-back with another super user. Time yourself. Get feedback on clarity."],["8","Review the rubric","Passing requires average 2.5 or higher across all criteria and no score of 1 in navigation, transaction accuracy, or trainer readiness."]],videoUrl:"",quiz:[{q:"The teach-back format is 15 minutes. The first 2 minutes should cover:",options:["Walking through every screen in your module","Explaining the department workflow in plain business language","Reading from your training notes","Showing the issue log template"],answer:1},{q:"The passing standard for the teach-back rubric is:",options:["Perfect scores on all criteria","Average of 2.5 or higher and no score of 1 in navigation, accuracy, or trainer readiness","Completing all sessions in the portal","Attending all 9 weeks of training"],answer:1},{q:"If you are scored 1 (Not Ready) on System Navigation, you:",options:["Still pass if your other scores are high enough","Do not pass regardless of other scores","Can retake only that section","Are automatically assigned to IT support"],answer:1},{q:"The best way to prepare for your teach-back is:",options:["Memorize the program codes","Practice the full 15-minute walkthrough with a peer and time yourself","Read the training documents the night before","Ask Kristen to show you the workflow again"],answer:2}],checklist:["I have reviewed every session, step, and checklist in my assigned module","I know my 15-minute teach-back structure","I have a normal scenario I can walk through live in M3","I have an exception scenario with the correct handling steps","I know my upstream and downstream department handoffs","I have practiced with a peer and received feedback","I understand the rubric and passing standard"]},{id:"w9-2",title:"Teach-Back and Readiness Sign-Off",duration:"90 min",steps:[["1","Deliver your 15-minute teach-back","Present to KRISTENB and the group. Follow the structure: workflow, programs, exception, handoff, practice question, escalation path."],["2","Receive rubric scores","KRISTENB scores each criteria 1-3. Listen for feedback. Do not argue — note coaching items for remediation."],["3","Review readiness decision","Ready: proceed to department training plan. Ready With Coaching: targeted remediation assigned before go-live. Not Ready: additional training scheduled with backup support assigned."],["4","Build your FAQ contribution","Write 3-5 questions your department users are likely to ask. Include the correct answer and which program or step it relates to. Submit to the shared FAQ."],["5","Review open issues","Go through the issue log. For each open item in your module: confirm owner, confirm resolution path, and flag anything that could block go-live."],["6","Sign readiness acknowledgment","Complete the readiness acknowledgment form: name, department, module, readiness status, required remediation, and signature. Manager countersigns."],["7","Confirm department training date","Lock in the date, location, and attendee list for your department training session. Confirm practice data is ready."]],videoUrl:"",quiz:[{q:"If you receive a readiness status of Ready With Coaching, your next step is:",options:["Wait for go-live and figure it out on the job","Complete assigned remediation and retest the weak area before go-live","Start training your department immediately","Request a different module assignment"],answer:1},{q:"Your FAQ contribution should include:",options:["Every possible M3 question","3-5 likely questions from your department users with correct answers and program references","Only questions you personally had during training","A copy of all training documents"],answer:1},{q:"The readiness acknowledgment confirms that you:",options:["Scored perfectly on all quizzes","Attended every training session without absence","Completed training, practiced, finished your teach-back, and understand your go-live responsibility","Have read all SharePoint documents"],answer:2},{q:"Before your department training session, you must confirm:",options:["That all super users have passed their teach-backs","Training date, attendees, practice data, and that your known issues are documented","That the portal has been updated","That IT has finished the system configuration"],answer:1}],checklist:["I delivered my 15-minute teach-back","I received my rubric scores and understand any coaching feedback","I know my readiness status — Ready, Ready With Coaching, or Not Ready","I submitted 3-5 FAQ contributions with correct answers","I reviewed all open issues in my module and confirmed owners","I signed the readiness acknowledgment","My department training date and attendee list are confirmed"]},{id:"w9-3",title:"Go-Live Support and Department Handoff",duration:"60 min",steps:[["1","Know your support tier","You are Tier 1 — first-line support for your department. Handle how-to questions, navigation, and known workarounds. Escalate to KRISTENB (Tier 2) when an issue blocks work, affects data, or needs a configuration change."],["2","Know the issue log fields","Every issue must include: date/time, department, reported by, program, process, what happened, steps tried, business impact, priority (High/Medium/Low), owner, status, and resolution."],["3","Understand issue priority","High: blocks orders, shipments, receiving, invoicing, payment, or period close — same day triage. Medium: workaround exists but slows work — 1-2 days. Low: question, training gap, or enhancement — weekly review."],["4","Know the daily go-live rhythm","Start of day: review open high-priority issues. Midday: check blockers. End of day: review resolved items and FAQ updates. Report to KRISTENB if anything is blocking your department."],["5","Confirm your floor support availability","Know your agreed support hours during go-live week. Keep your module guide and quick reference open. Use training materials before guessing."],["6","Review your department training handoff checklist","Confirm: department user list, training date, quick reference ready, practice scenario ready, known issues documented, escalation path shared, sign-off method confirmed."],["7","Avoid unauthorized changes","Never make data or configuration changes in production without approval. Log the issue and escalate. Document everything."],["8","Post go-live stabilization","For the first 2-4 weeks: continue daily issue review, track repeated training gaps, update job aids weekly, hold department check-ins, review open items with leadership weekly."]],videoUrl:"",quiz:[{q:"As a Tier 1 super user, you should escalate an issue to KRISTENB when:",options:["A department user asks a how-to question","The issue blocks work, affects data, or requires a configuration or security change","Someone is confused about navigation","You want to update the FAQ"],answer:1},{q:"A High priority issue is one that:",options:["Is annoying but has a workaround","Blocks orders, shipments, receiving, invoicing, payment, or period close","Is a training gap or question","Was logged more than once"],answer:1},{q:"If a department user asks you how to do something and you are not sure, you should:",options:["Give your best guess","Tell them to call IT","Check your training materials first before answering","Ignore the question until you are certain"],answer:2},{q:"During the post go-live stabilization period, repeated questions should become:",options:["Ignored after the first week","FAQ updates and job aid improvements","Escalations to Infor support","New training sessions from scratch"],answer:1}],checklist:["I know my support tier and what I handle vs what I escalate","I can create a complete issue-log entry with all required fields","I know the three priority levels and response expectations","I know the daily go-live rhythm and when to report to KRISTENB","I have confirmed my floor support availability during go-live week","My department training handoff checklist is complete","I understand I must never make unauthorized data or configuration changes in production"]}]},
  endToEnd:{id:"endToEnd",name:"End-to-End Process Walkthroughs",owner:"All super users",weeks:"Week 8",pill:"pill-gold",color:"#c49a2a",programs:["CRS610","CRS620","PPS200","PPS300","OIS100","OIS300","APS100","APS200","ARS100","ARS200","MMS200"],summary:"Full cross-functional walkthroughs connecting Purchasing, Warehouse, Sales, and Finance through Procure to Pay and Order to Cash.",links:[["Procure to Pay Packet",SP+"/Week_8_Procure_to_Pay_Walkthrough_Packet.md"],["Order to Cash Packet",SP+"/Week_8_Order_to_Cash_Walkthrough_Packet.md"]],sessions:[{id:"w8-1",title:"Procure to Pay — Full Walkthrough",duration:"90 min",steps:[["1","Verify supplier — CRS620","Purchasing opens CRS620 and confirms the supplier is active, has payment terms, and is ready for a PO."],["2","Create PO header — PPS200","Purchasing opens PPS200, clicks New for a new PO. Enters supplier, PO type, buyer, warehouse, and requested delivery date."],["3","Add PO lines — PPS201","Purchasing adds at least two lines: item number, quantity, UOM, price, and delivery date. Records the PO number assigned by M3."],["4","Approve and release PO","Purchasing confirms the PO status is released/ready per Adleta rules before communicating to the supplier."],["5","Receive goods — PPS300","Warehouse opens PPS300, finds the PO, verifies packing slip against PO items and quantities, enters actual received quantities, and confirms. Records receipt number."],["6","Verify inventory update — MMS200","Warehouse opens MMS200 and confirms the received item shows updated on-hand and available balances."],["7","Enter supplier invoice — APS100","Finance AP opens APS100, enters the supplier invoice referencing the PO number. Enters invoice date, amount, and runs F14 three-way match."],["8","Resolve match result","If matched: invoice is auto-approved. If variance: Finance AP contacts Purchasing (price issue) or Warehouse (quantity issue) to resolve before payment."],["9","Create payment proposal — APS200","Finance AP opens APS200, includes the approved invoice in a payment proposal. Reviews before processing."],["10","Debrief — handoff questions","Group discusses: what must each department get right for the next step to work? Where do delays or errors originate?"]],videoUrl:"",quiz:[{q:"Before Warehouse can receive goods, Purchasing must ensure:",options:["The invoice is already entered in APS100","The PO is released and the supplier, item, quantity, and UOM are correct","The payment proposal is approved","Inventory is at zero for that item"],answer:1},{q:"The three-way match in APS100 compares:",options:["PO, receipt, and supplier invoice","PO, customer order, and payment","Supplier invoice, GL account, and payment","PO, warehouse, and freight invoice"],answer:0},{q:"A quantity variance on the three-way match means:",options:["The supplier invoice price is wrong","The invoice quantity does not match what was received","The PO was not released","Finance entered the wrong supplier number"],answer:1},{q:"Which department owns resolving a price variance between the PO and the supplier invoice?",options:["Warehouse","Finance AR","Purchasing and Finance AP together","IT"],answer:2}],checklist:["I can trace all 10 steps of the Procure to Pay process","I understand what each department must get right before the handoff","I can identify whether a match exception is a price variance or quantity variance","I know who to contact to resolve each type of exception","I completed a proof-of-completion entry with supplier, PO, receipt, and invoice references"]},{id:"w8-2",title:"Order to Cash — Full Walkthrough",duration:"90 min",steps:[["1","Verify customer — CRS610","Sales / CS opens CRS610 and confirms the customer is active, reviews payment terms, price list, and credit status."],["2","Create order header — OIS100","Sales / CS opens OIS100, clicks New for a new order. Enters customer number, order type, ship-to address, requested delivery date, and customer PO number."],["3","Add order lines — OIS101","Sales / CS adds at least two lines: item, quantity, UOM, price, and delivery date. Verifies M3 auto-populated the correct price from the customer's price list."],["4","Check availability — MMS200","Sales / CS or Warehouse checks available quantity in MMS200. If stock is short, a backorder decision is made and communicated to the customer before proceeding."],["5","Confirm shipment — OIS300","Warehouse opens OIS300, finds the order, verifies items and ship-to address, enters actual shipped quantities, ship date, and carrier/tracking. Presses F5 to confirm — inventory updates and invoice is triggered."],["6","Review customer invoice — ARS100","Finance AR opens ARS100, locates the invoice generated from the shipment. Verifies customer, order number, shipped quantity, and invoice amount."],["7","Apply customer payment — ARS200","Finance AR opens ARS200, enters the customer payment, and applies it to the correct invoice. Verifies the invoice balance clears to zero."],["8","Review aging if needed — ARS300","Finance AR opens ARS300 to confirm the customer's aging is updated. Flags any remaining overdue balances for follow-up."],["9","Handle exception — backorder or credit hold","If backorder: Sales / CS documents and communicates delay. If credit hold: Sales / CS stops and contacts Finance AR before any customer communication."],["10","Debrief — handoff questions","Group discusses: where do customer-facing problems start? Where do financial problems start? What does each department need from the previous step?"]],videoUrl:"",quiz:[{q:"Before Warehouse can ship an order, Sales / CS must ensure:",options:["The payment is already collected","The customer invoice is generated","The customer order has correct items, quantities, ship-to address, and requested date","The AR aging is reviewed"],answer:2},{q:"Confirming a shipment in OIS300 automatically:",options:["Creates a new customer order","Updates inventory and triggers the customer invoice","Sends an email to the customer","Closes the customer account"],answer:1},{q:"If a customer is on credit hold, Sales / CS should:",options:["Ship the order and let Finance sort it out","Contact the customer directly to collect payment","Stop order processing and contact Finance AR before any customer communication","Cancel the order without notifying anyone"],answer:2},{q:"Applying a customer payment in ARS200 to the wrong invoice causes:",options:["No problem — it can be corrected later without impact","The correct invoice to remain open and appear overdue, possibly triggering a credit hold","The payment to be lost","The order to be cancelled"],answer:1}],checklist:["I can trace all steps of the Order to Cash process from customer order to payment","I understand what each department must get right before the handoff","I know how to handle a backorder — availability check, decision, and customer communication","I know the credit hold process and that Sales / CS must contact Finance before communicating with the customer","I completed a proof-of-completion entry with customer, order, shipment, invoice, and payment references"]}]},

function visibleModules(){if(currentUserData.role==="admin"||currentUserData.modules.includes("all"))return Object.values(MODULES);return currentUserData.modules.filter(id=>id!=="all-readonly").map(id=>MODULES[id]).filter(Boolean);}
function findSession(sid){for(const m of Object.values(MODULES)){const s=m.sessions.find(s=>s.id===sid);if(s)return s;}return null;}
function sessionProgress(sid){const s=findSession(sid);if(!s)return 0;const done=s.checklist.filter((_,i)=>ST[`chk-${sid}-${i}`]).length;return Math.round(done/s.checklist.length*100);}
function moduleProgress(mid){const m=MODULES[mid];if(!m||!m.sessions.length)return 0;const scores=m.sessions.map(s=>ST[`quiz-score-${s.id}`]||0);return Math.round(scores.reduce((a,b)=>a+b,0)/m.sessions.length);}
function renderDashboard(){const mods=visibleModules();const tot=mods.reduce((a,m)=>a+m.sessions.length,0);const done=mods.reduce((a,m)=>a+m.sessions.filter(s=>(ST[`quiz-score-${s.id}`]||0)>=70).length,0);let html=`<div class="metrics"><div class="metric"><div class="metric-val">${mods.length}</div><div class="metric-label">My Modules</div></div><div class="metric"><div class="metric-val">${tot}</div><div class="metric-label">Sessions</div></div><div class="metric"><div class="metric-val">${done}</div><div class="metric-label">Completed</div></div><div class="metric"><div class="metric-val">${tot?Math.round(done/tot*100):0}%</div><div class="metric-label">Progress</div></div></div><div class="dash-grid"><div class="card"><div class="card-title">Mastery Model <span class="pill pill-teal">Required for sign-off</span></div><div class="mastery"><div class="mastery-node">Do it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Explain it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Troubleshoot it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Teach it</div></div></div><div class="card"><div class="card-title">Next Actions <span class="pill pill-gray">${NEXT_ACTIONS.length} items</span></div><div class="prog-wrap"><div class="prog-track"><div class="prog-fill" id="dpf" style="width:0%"></div></div><div class="prog-label" id="dpl">0%</div></div><div class="check-list" id="dcl"></div></div></div>`;
if(mods.length){html+=`<div class="sec-hd" style="margin-top:20px"><div><div class="sec-eyebrow">Your training</div><h2>My Modules</h2></div></div><div class="mod-grid">`;html+=mods.map(m=>{const pct=moduleProgress(m.id);return`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div><div class="tags">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% complete · ${m.sessions.length} session${m.sessions.length!==1?"s":""}</div></div>`;}).join("");html+=`</div>`;}

const cl=document.getElementById("dcl");if(cl){NEXT_ACTIONS.forEach((text,i)=>{const id=`act-${i}`;const div=document.createElement("label");div.className="check-item";div.innerHTML=`<input type="checkbox" ${ST[id]?"checked":""}><span>${text}</span>`;div.querySelector("input").addEventListener("change",e=>{ST[id]=e.target.checked;save();updDP();});cl.appendChild(div);});updDP();}}
function updDP(){const tot=NEXT_ACTIONS.length;const done=NEXT_ACTIONS.filter((_,i)=>ST[`act-${i}`]).length;const pct=Math.round(done/tot*100);const f=document.getElementById("dpf");const l=document.getElementById("dpl");if(f)f.style.width=pct+"%";if(l)l.textContent=pct+"%";}
function renderModules(){const mods=visibleModules();const el=document.getElementById("view-modules");let html=`<div class="sec-hd"><div><div class="sec-eyebrow">Training library</div><h2>${currentUserData.role==="admin"?"All Modules":"My Training"}</h2></div><input class="search-input" id="msr" type="search" placeholder="Search modules…"></div><div class="mod-grid" id="mgr">`;html+=mods.map(m=>{const pct=moduleProgress(m.id);return`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div><div class="tags">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% complete</div><div class="mod-links">${m.links.map(([l,u])=>`<a class="mod-link" href="${u}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">${l}</a>`).join("")}</div></div>`;}).join("");html+=`</div>`;el.innerHTML=html;document.getElementById("msr").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();const f=!q?mods:mods.filter(m=>[m.name,m.owner,m.weeks,m.summary,...m.programs].join(" ").toLowerCase().includes(q));const g=document.getElementById("mgr");if(!f.length){g.innerHTML='<div class="empty">No modules match.</div>';return;}g.innerHTML=f.map(m=>`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div></div>`).join("");});}
