<title>Adleta Infor M3 — Training Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* =====================================
   ADLETA M3 TRAINING PORTAL — FULL BUILD
   Role-based access | Sessions | Quizzes | Video
   ===================================== */
:root {
  --navy:#0f2133;--navy2:#172d42;--navy3:#1f3a52;
  --teal:#1a7a6d;--teal2:#22a08f;--teal3:#e0f2ee;
  --gold:#c49a2a;--gold2:#faf0db;
  --red:#c0443b;--red2:#fce8e7;
  --blue:#2d6fa3;--blue2:#e0ecf7;
  --ink:#0f1f2e;--body:#344b5f;--muted:#6b8199;
  --line:#dde5ed;--bg:#f2f5f8;--surface:#fff;--surface2:#f7f9fb;
  --r:10px;--rsm:6px;
  --shadow:0 2px 12px rgba(15,33,51,0.08);
  --shadow2:0 8px 32px rgba(15,33,51,0.12);
  font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.55;
}
*,*::before,*::after{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--ink);min-height:100vh;}
a{color:var(--teal);text-decoration:none;font-weight:500;}
a:hover{text-decoration:underline;}
button,input,select{font:inherit;}
h1,h2,h3,h4{line-height:1.2;font-weight:700;}
p{color:var(--body);line-height:1.6;}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{background:var(--navy);color:#e8f1f8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-top{padding:22px 18px 16px;}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;}
.brand-mark{width:42px;height:42px;background:linear-gradient(135deg,var(--teal2),var(--teal));border-radius:10px;display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:13px;color:#fff;flex-shrink:0;}
.brand-name{font-size:14px;font-weight:700;color:#fff;line-height:1.2;}
.brand-sub{font-size:12px;color:#7fa3be;}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:var(--rsm);color:#a8c4d8;font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:all .15s;}
.nav-btn svg{opacity:.65;flex-shrink:0;}
.nav-btn:hover,.nav-btn.active{background:var(--navy3);color:#fff;}
.nav-btn.active svg{opacity:1;}
.sidebar-footer{margin-top:auto;padding:14px 18px 20px;border-top:1px solid rgba(255,255,255,0.07);}
.user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--navy3);border-radius:var(--rsm);}
.user-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;color:#fff;}
.user-role{font-size:11px;color:#7fa3be;}
.logout-btn{margin-top:8px;width:100%;padding:7px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:var(--rsm);color:#7fa3be;font-size:13px;cursor:pointer;transition:all .15s;}
.logout-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
.main{display:flex;flex-direction:column;min-width:0;}
.hero{background:var(--navy);padding:28px 36px 24px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 500px 250px at 100% 50%,rgba(26,122,109,0.2) 0%,transparent 70%),repeating-linear-gradient(120deg,rgba(255,255,255,0.015) 0 1px,transparent 1px 52px);pointer-events:none;}
.hero-inner{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.hero-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--teal2);font-weight:700;margin-bottom:8px;}
.hero h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;}
.hero-sub{font-size:13px;color:#7fa3be;}
.hero-actions{display:flex;gap:8px;flex-shrink:0;margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rsm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--teal2);color:#fff;}
.btn-primary:hover{background:var(--teal);color:#fff;text-decoration:none;}
.btn-ghost{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}
.btn-ghost:hover{background:rgba(255,255,255,0.18);color:#fff;text-decoration:none;}
.btn-sm{padding:6px 12px;font-size:13px;}
.content{padding:24px 36px 40px;flex:1;}
.view{display:none;}
.view.active{display:block;}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.sec-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);font-weight:700;margin-bottom:4px;}
.sec-hd h2{font-size:20px;color:var(--ink);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--teal);}
.metric:nth-child(2){border-top-color:var(--blue);}
.metric:nth-child(3){border-top-color:var(--gold);}
.metric:nth-child(4){border-top-color:var(--red);}
.metric-val{font-size:28px;font-weight:800;color:var(--teal);line-height:1;margin-bottom:3px;}
.metric:nth-child(2) .metric-val{color:var(--blue);}
.metric:nth-child(3) .metric-val{color:var(--gold);}
.metric:nth-child(4) .metric-val{color:var(--red);}
.metric-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.dash-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:20px;}
.mastery{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr;align-items:center;}
.mastery-node{background:var(--teal3);border:1px solid #b0d9d2;border-radius:var(--r);padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--teal);min-height:64px;display:grid;place-items:center;}
.mastery-arr{display:grid;place-items:center;color:var(--teal);opacity:.5;}
.prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.prog-track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.prog-label{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;}
.check-list{display:flex;flex-direction:column;gap:6px;}
.check-item{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.check-item:last-child{border-bottom:none;}
.check-item input{width:15px;height:15px;margin-top:2px;accent-color:var(--teal);cursor:pointer;}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.pill-teal{background:var(--teal3);color:#145c52;}
.pill-blue{background:var(--blue2);color:#1e4f7a;}
.pill-gold{background:var(--gold2);color:#7a5c12;}
.pill-red{background:var(--red2);color:#8a2e28;}
.pill-gray{background:#eef2f6;color:#344b5f;}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.mod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all .15s;}
.mod-card:hover{border-color:var(--teal);box-shadow:var(--shadow2);transform:translateY(-1px);}
.mod-card h3{font-size:14px;color:var(--ink);}
.mod-owner{font-size:11px;color:var(--muted);font-weight:600;}
.mod-summary{font-size:12px;color:var(--body);line-height:1.5;flex:1;}
.tags{display:flex;flex-wrap:wrap;gap:4px;}
.tag{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:#eef2f6;color:#344b5f;}
.mod-progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px;}
.mod-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.mod-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.mod-link{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--rsm);color:var(--teal);font-weight:600;transition:all .15s;}
.mod-link:hover{background:var(--teal3);border-color:var(--teal);text-decoration:none;}
.session-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;border:none;background:none;padding:0;margin-bottom:12px;}
.session-back:hover{color:var(--teal);}
.session-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.session-title{font-size:22px;font-weight:700;margin-bottom:16px;}
.session-body{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
.session-content{display:flex;flex-direction:column;gap:16px;}
.session-sidebar{display:flex;flex-direction:column;gap:14px;}
.step-table{width:100%;border-collapse:collapse;font-size:13px;}
.step-table th{background:var(--navy);color:#fff;padding:9px 12px;text-align:left;font-weight:600;font-size:12px;}
.step-table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
.step-table tr:nth-child(even) td{background:var(--surface2);}
.step-table td:first-child{text-align:center;font-family:'DM Mono',monospace;font-weight:700;color:var(--teal);width:40px;}
.step-table td b{color:var(--ink);}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--r);}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:var(--r);}
.video-placeholder{background:var(--navy2);border-radius:var(--r);aspect-ratio:16/9;display:grid;place-items:center;color:#7fa3be;font-size:13px;text-align:center;padding:20px;}
.video-input-wrap{display:flex;gap:8px;margin-top:8px;}
.video-input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:var(--rsm);font-size:13px;outline:none;}
.video-input:focus{border-color:var(--teal);}
.quiz-wrap{display:flex;flex-direction:column;gap:16px;}
.quiz-q{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
.quiz-q-text{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--ink);}
.quiz-options{display:flex;flex-direction:column;gap:8px;}
.quiz-option{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--rsm);cursor:pointer;font-size:13px;transition:all .15s;background:var(--surface);}
.quiz-option:hover{border-color:var(--teal);background:var(--teal3);}
.quiz-option.correct{border-color:#22a08f;background:#e0f2ee;color:#145c52;}
.quiz-option.wrong{border-color:var(--red);background:var(--red2);color:var(--red);}
.quiz-option input{margin-top:2px;accent-color:var(--teal);}
.quiz-result{text-align:center;padding:16px;border-radius:var(--r);font-size:15px;font-weight:700;}
.quiz-result.pass{background:var(--teal3);color:#145c52;}
.quiz-result.fail{background:var(--red2);color:var(--red);}
.quiz-btn{width:100%;padding:10px;background:var(--teal);color:#fff;border:none;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .15s;}
.quiz-btn:hover{background:var(--teal2);}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.phase-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border-top:4px solid var(--teal);}
.phase-card:nth-child(2){border-top-color:var(--blue);}
.phase-card:nth-child(3){border-top-color:var(--gold);}
.phase-card:nth-child(4){border-top-color:var(--red);}
.phase-weeks{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
.phase-name{font-size:16px;font-weight:700;margin-bottom:8px;}
.phase-purpose{font-size:12px;color:var(--body);margin-bottom:8px;line-height:1.5;}
.phase-success{font-size:12px;color:var(--teal);font-style:italic;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;line-height:1.5;}
.su-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.su-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.su-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;}
.su-name{font-size:14px;font-weight:700;}
.su-dept{font-size:11px;color:var(--muted);}
.su-mod{font-size:10px;font-family:'DM Mono',monospace;color:var(--teal);margin-top:3px;}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;}
.res-card h3{font-size:14px;}
.res-card p{font-size:12px;color:var(--body);flex:1;}
.res-link{font-size:13px;display:inline-flex;align-items:center;gap:5px;margin-top:4px;}
.search-input{padding:8px 13px;border-radius:var(--rsm);border:1px solid var(--line);background:var(--surface);width:260px;font-size:13px;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--teal);}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.user-table{width:100%;border-collapse:collapse;font-size:13px;}
.user-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:12px;font-weight:600;}
.user-table td{padding:9px 12px;border-bottom:1px solid var(--line);}
.user-table tr:hover td{background:var(--surface2);}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.dot-green{background:#22a08f;}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
@media(max-width:1100px){.mod-grid,.res-grid,.su-grid{grid-template-columns:repeat(2,1fr);}.timeline{grid-template-columns:repeat(2,1fr);}.metrics{grid-template-columns:repeat(2,1fr);}.session-body{grid-template-columns:1fr;}}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{height:auto;position:static;}.hero{padding:20px;}.content{padding:16px 18px 32px;}.dash-grid,.admin-grid{grid-template-columns:1fr;}.mod-grid,.res-grid,.su-grid,.timeline{grid-template-columns:1fr;}.mastery{grid-template-columns:1fr;gap:6px;}}
</style>
</head>

  purchasing:{id:"purchasing",name:"Purchasing / Procurement",owner:"Alan Burk",weeks:"Week 3",pill:"pill-blue",color:"#2d6fa3",programs:["CRS620","PPS200","PPS201","PPS300","APS100"],summary:"Supplier lookup, purchase orders, receiving handoff, approvals, and three-way match.",links:[["Deck",SP+"/Adleta_M3_Purchasing_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Purchasing_LearningGuide.docx"]],sessions:[{id:"pur-1",title:"Supplier Lookup — CRS620",duration:"45 min",steps:[["1","Open CRS620","Navigate to Purchasing > Supplier Master > CRS620"],["2","Search by Vendor Number","Enter the vendor number and press Enter"],["3","Search by Name","Press F4 to open search window, enter vendor name"],["4","Review Details","Check vendor name, address, payment terms, status"],["5","Confirm Active","Status must be Active before creating any PO"]],videoUrl:"",quiz:[{q:"What M3 program is used to look up vendor records?",options:["PPS200","CRS620","MMS060","OIS100"],answer:1},{q:"Before creating a PO, the vendor status must be:",options:["Pending","Inactive","Active","Approved"],answer:2},{q:"If a vendor is not in M3, you should:",options:["Create the record yourself","Contact Finance to set them up","Skip the vendor field","Use a different vendor"],answer:1}],checklist:["I can find a vendor by number in CRS620","I can search a vendor by name using F4","I know what fields to verify before creating a PO","I understand what to do if a vendor is missing or inactive"]},{id:"pur-2",title:"Creating a Purchase Order — PPS200",duration:"60 min",steps:[["1","Open PPS200","Navigate to Purchasing > Purchase Orders > PPS200"],["2","Press F3","Click New or press F3 for a blank PO header"],["3","Enter Vendor Number","M3 auto-fills name, address, payment terms"],["4","Select PO Type","Use the standard Adleta PO type (confirm with trainer)"],["5","Enter Delivery Date","Date goods are needed at the warehouse"],["6","Enter Buyer Reference","Your name or buyer code"],["7","Save","Press Enter — M3 assigns a PO number. Record it."],["8","Add Lines","M3 opens PPS201 to add product lines"]],videoUrl:"",quiz:[{q:"What keyboard shortcut creates a new PO in PPS200?",options:["F1","F3","F5","F14"],answer:1},{q:"After saving the PO header, M3 automatically opens:",options:["PPS300","APS100","PPS201","CRS620"],answer:2},{q:"The Requested Delivery Date is:",options:["Today's date","The date you want goods at the warehouse","The vendor's ship date","The invoice date"],answer:1}],checklist:["I can create a PO header in PPS200","I can add PO lines in PPS201","I know how to verify pricing on PO lines","I can record and track the PO number assigned by M3"]},{id:"pur-3",title:"Receiving Goods — PPS300 and Three-Way Match",duration:"60 min",steps:[["1","Open PPS300","Navigate to Purchasing > Goods Receiving > PPS300"],["2","Find PO","Enter the PO number"],["3","Verify Delivery","Confirm packing slip matches PO items and quantities"],["4","Enter Receipt Date","Today's date"],["5","Enter Received Quantities","Actual quantity physically received"],["6","Confirm","Press F5 — M3 updates inventory and creates receipt"],["7","Check Three-Way Match","Finance enters invoice in APS100 and runs F14 match"],["8","Resolve Discrepancies","Price or qty variance — contact vendor for corrected invoice"]],videoUrl:"",quiz:[{q:"What program is used to receive goods against a PO?",options:["PPS200","APS100","PPS300","MMS150"],answer:2},{q:"The three-way match compares:",options:["PO, receipt, and vendor invoice","PO, customer order, and payment","Receipt, invoice, and credit memo","PO, vendor, and warehouse"],answer:0},{q:"If you receive LESS than the PO quantity, M3 will:",options:["Close the PO automatically","Delete the remaining lines","Keep the PO open for the remaining quantity","Reject the receipt"],answer:2}],checklist:["I can receive a full shipment in PPS300","I can handle a partial receipt","I understand how the three-way match works","I know how to resolve a price or quantity discrepancy"]}]},
  inventory:{id:"inventory",name:"Inventory Management",owner:"Alan Burk / Jose Manjarrez",weeks:"Week 4",pill:"pill-teal",color:"#1a7a6d",programs:["MMS060","MMS200","MMS100","MMS150","MMS300"],summary:"Item lookup, stock balances, transfers, adjustments, cycle counts, discrepancy handling.",links:[["Deck",SP+"/Adleta_M3_Inventory_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Inventory_LearningGuide.docx"]],sessions:[{id:"inv-1",title:"Item Lookup and Stock Balance — MMS060 and MMS200",duration:"45 min",steps:[["1","Open MMS060","Navigate to Inventory > Item Master > MMS060"],["2","Enter Item Number","Type the Adleta item number and press Enter"],["3","Review Item Record","Check status, UOM, item category, stock method"],["4","Open MMS200","Navigate to Inventory > Stock Balance > MMS200"],["5","Enter Item Number","See all stock for that item across all locations"],["6","Check Available Qty","On-hand minus Allocated = Available. Use Available when promising stock"]],videoUrl:"",quiz:[{q:"What does Available quantity mean in MMS200?",options:["Total in warehouse","On-hand minus allocated","Quantity on order","Quantity shipped today"],answer:1},{q:"Before any inventory transaction, the item status must be:",options:["Pending (10)","Active (20)","Inactive (90)","On hold (50)"],answer:1},{q:"Which program shows stock balance by location?",options:["MMS060","MMS150","MMS200","MMS300"],answer:2}],checklist:["I can look up an item record in MMS060","I can check on-hand and available stock in MMS200","I understand the difference between on-hand, allocated, and available","I know which quantity to use when promising stock to Sales"]},{id:"inv-2",title:"Transfers and Adjustments — MMS100 and MMS150",duration:"60 min",steps:[["1","Open MMS100","Navigate to Inventory > Stock Transfer > MMS100"],["2","Enter Item and From Location","Item number and the bin the stock is leaving"],["3","Enter To Location","Destination warehouse and bin"],["4","Enter Quantity","Must not exceed available at From location"],["5","Confirm Transfer","Press Enter — both balances update immediately"],["6","Open MMS150 for Adjustments","Navigate to Inventory > Stock Adjustment > MMS150"],["7","Enter Reason Code","CYCLE / DAMAGE / EXPIRE / RCVERR / SHRINK / WRITUP"],["8","Enter Notes","Required for audit — explain why the adjustment is needed"]],videoUrl:"",quiz:[{q:"Which program is used to move stock between warehouse locations?",options:["MMS060","MMS150","MMS200","MMS100"],answer:3},{q:"An inventory adjustment for damaged goods uses reason code:",options:["CYCLE","DAMAGE","SHRINK","RCVERR"],answer:1},{q:"Adjustments above $500 in value require:",options:["IT approval","Manager approval before entry","Finance approval after entry","No approval needed"],answer:1}],checklist:["I can process a stock transfer between locations","I can process an inventory adjustment with the correct reason code","I know when manager approval is required for adjustments","I always verify available quantity before transferring"]},{id:"inv-3",title:"Cycle Counting — MMS300",duration:"60 min",steps:[["1","Understand cycle counting","Cycle counting is a method of counting a subset of inventory on a regular schedule instead of shutting down for a full physical count. M3 manages this in MMS300."],["2","Open MMS300","Navigate to Inventory > Cycle Count > MMS300."],["3","Review the count list","M3 generates a list of items and locations assigned for counting. Review item number, location, and system on-hand quantity."],["4","Perform the physical count","Go to the physical location. Count actual units. Do not look at the system quantity before counting — blind counts are more accurate."],["5","Enter count results","Return to MMS300. Enter the actual counted quantity for each line. If the count matches, confirm. If different, recount before entering."],["6","Review variances","M3 flags lines where counted quantity differs from system quantity. Review each variance — note the item, location, system qty, counted qty, and difference."],["7","Approve or escalate variances","Small variances within Adleta tolerance: enter with reason code CYCLE. Large variances: escalate to manager before posting. Finance may need to approve if financial impact is significant."],["8","Post the count","After approval, post the cycle count. M3 updates on-hand balances to match counted quantities and creates an audit record."],["9","Investigate root cause","For repeated variances on the same item or location, investigate: receiving errors, transfer errors, unreported damage, or picking errors. Log findings in the issue log."]],videoUrl:"",quiz:[{q:"The best practice when performing a physical cycle count is:",options:["Check the system quantity first so you know what to expect","Count blind — do not look at the system quantity before counting","Only count items with recent transactions","Count everything in the warehouse at once"],answer:1},{q:"A large cycle count variance should be:",options:["Posted immediately so the system is updated","Escalated to management before posting, especially if the financial impact is significant","Ignored if the item is low value","Adjusted using reason code DAMAGE"],answer:1},{q:"After posting a cycle count, M3:",options:["Sends an alert to Finance automatically","Updates on-hand balances to match the counted quantities and creates an audit record","Closes the item record until the next count","Requires IT approval to finalize"],answer:1},{q:"Repeated variances on the same item or location most likely indicate:",options:["A system configuration error that only IT can fix","A counting error by the same person","A process problem — receiving, transfer, damage, or picking errors — that needs root cause investigation","Normal inventory shrinkage that requires no action"],answer:2}],checklist:["I understand the purpose of cycle counting and how it differs from a full physical count","I can open MMS300 and review a cycle count list","I perform counts blind without checking system quantity first","I know how to enter count results and review variances","I know when to post a variance vs escalate to management","I can investigate and log the root cause of a repeated variance"]}]},
  orderManagement:{id:"orderManagement",name:"Order Management / Sales",owner:"Tony Shipka + Jeanell Coral",weeks:"Week 5",pill:"pill-gold",color:"#c49a2a",programs:["CRS610","OIS100","OIS101","OIS300","OIS390","MMS200"],summary:"Customer lookup, order entry, pricing, availability, shipments, backorders, and returns.",links:[["Deck",SP+"/Adleta_M3_OrderManagement_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_OrderManagement_LearningGuide.docx"]],sessions:[{id:"ord-1",title:"Customer Lookup and Sales Order Entry — OIS100",duration:"60 min",steps:[["1","Open CRS610","Navigate to Sales > Customer Master > CRS610"],["2","Look Up Customer","Enter customer number or press F4 to search by name"],["3","Verify Customer","Check name, address, payment terms, credit status, price list"],["4","Open OIS100","Navigate to Sales > Customer Orders > OIS100"],["5","Press F3","New sales order"],["6","Enter Customer Number","M3 auto-fills name, address, terms"],["7","Enter Delivery Date","Date customer wants the order"],["8","Enter Customer PO Number","Required when customer provides one"],["9","Save","M3 assigns order number — record it"]],videoUrl:"",quiz:[{q:"Where do you look up a customer's price list assignment?",options:["OIS100","OIS010","CRS610","MMS060"],answer:2},{q:"The Customer PO Number field is:",options:["Not required ever","Required when the customer provides one","Generated automatically by M3","Only used for returns"],answer:1},{q:"After saving the order header in OIS100, you add products in:",options:["OIS300","CRS610","OIS101","OIS390"],answer:2}],checklist:["I can look up a customer in CRS610 and verify their details","I can create a sales order header in OIS100","I always enter the customer PO number when provided","I record the M3 order number after saving"]},{id:"ord-2",title:"Shipments and Returns — OIS300 and OIS390",duration:"60 min",steps:[["1","Open OIS300","Navigate to Sales > Shipment Processing > OIS300"],["2","Find Order","Enter customer order number"],["3","Verify Shipment","Confirm items, quantities, ship-to address"],["4","Enter Ship Date","Today's date"],["5","Enter Tracking","Carrier name and tracking number if available"],["6","Confirm","Press F5 — inventory updated, invoice generated"],["7","For Returns open OIS390","Get manager authorization first"],["8","Reference Original Order","Enter original sales order number"],["9","Enter Return Reason","DEFECT / WRONGITEM / WRONGQTY / CUSTCANCEL"]],videoUrl:"",quiz:[{q:"Confirming a shipment in OIS300 automatically:",options:["Creates a new order","Updates inventory and generates invoice","Sends email to customer","Closes the customer account"],answer:1},{q:"Before processing a return in OIS390, you must:",options:["Enter the return in CRS610","Get manager authorization","Check stock in MMS200","Create a new sales order"],answer:1},{q:"Which reason code is used when the wrong item was shipped?",options:["DEFECT","CUSTCANCEL","WRONGITEM","OVERSHIP"],answer:2}],checklist:["I can process a shipment confirmation in OIS300","I can handle a partial shipment correctly","I know the return process and when to get authorization","I can select the correct return reason code in OIS390"]},{id:"ord-3",title:"Availability, Backorders, and Order Status — MMS200 and OIS101",duration:"60 min",steps:[["1","Check availability before promising — MMS200","Open MMS200, enter the item number. Use Available quantity — not On-hand — when telling a customer what can ship. Available = On-hand minus Allocated."],["2","Check availability on the order line — OIS101","Open the order in OIS101. M3 shows availability directly on the order line. If available qty is less than ordered qty, a backorder will be created automatically."],["3","Understand backorder behavior","When M3 cannot fulfill the full quantity, it creates two lines: one for the quantity that can ship now, one for the remaining quantity on backorder. Both carry the same order number."],["4","Communicate backorder to the customer","Before confirming the order, contact the customer to confirm: partial shipment acceptable, backorder date, or whether to wait for full availability. Document the customer's decision in the order notes."],["5","Check order status","In OIS100, the order status tells you where the order is in the process. Know the key statuses: open, released to warehouse, partly shipped, fully shipped, invoiced."],["6","Locate a stuck order","If a customer calls about an order that has not shipped, open OIS100 and check status. If released but not shipped, contact Warehouse. If on hold, check credit status in CRS610."],["7","Handle a partial shipment","If Warehouse ships less than the full order quantity, OIS300 captures the actual shipped amount. The remaining quantity stays open on the order unless the customer cancels the backorder."],["8","Cancel a backorder line","If the customer does not want the remaining quantity, open OIS101, select the backorder line, and cancel it using the correct cancel reason code. Confirm with manager if the value is significant."]],videoUrl:"",quiz:[{q:"When promising stock to a customer, you should use:",options:["On-hand quantity","Allocated quantity","Available quantity — on-hand minus allocated","Quantity on order from suppliers"],answer:2},{q:"When M3 cannot fulfill the full order quantity, it:",options:["Cancels the entire order","Holds the order until all stock is available","Creates two lines — one for what can ship now and one backorder line for the remainder","Sends an automatic email to the customer"],answer:2},{q:"If a customer's order shows status Released but has not shipped, your first step is:",options:["Cancel the order and re-enter it","Contact Warehouse to check the shipment status","Call the customer and tell them it shipped","Re-enter the order with a new delivery date"],answer:1},{q:"Before confirming a backorder with a customer, you must:",options:["Process the shipment first","Get manager approval to create any backorder","Contact the customer to confirm whether partial shipment, backorder, or cancellation is acceptable","Check the GL account balance"],answer:2}],checklist:["I use Available quantity from MMS200 — not On-hand — when promising stock","I understand how M3 handles backorders and can explain it to a customer","I know the key order status codes and what each one means","I can locate a stuck order and identify whether it is a warehouse or credit issue","I know how to handle a partial shipment and what happens to the remaining quantity","I can cancel a backorder line with the correct reason code"]}]},
  financeAP:{id:"financeAP",name:"Finance — AP and AR",owner:"Philip Jones",weeks:"Week 6",pill:"pill-red",color:"#c0443b",programs:["APS100","APS200","ARS100","ARS200","ARS300"],summary:"Supplier invoices, payment runs, customer invoices, cash application, AR aging.",links:[["Deck",SP+"/Adleta_M3_Finance_APAR_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Finance_APAR_LearningGuide.docx"]],sessions:[{id:"fin-1",title:"Vendor Invoice Entry and Three-Way Match — APS100",duration:"60 min",steps:[["1","Open APS100","Navigate to Accounts Payable > Invoice Entry > APS100"],["2","Enter Supplier Number","M3 fills vendor name and payment terms"],["3","Enter Invoice Number","Exact match to vendor invoice — must be unique per vendor"],["4","Enter Invoice Date","Date on vendor invoice — not today"],["5","Enter Invoice Amount","Total including taxes and freight"],["6","Reference PO Number","Required for three-way match"],["7","Run Match","Press F14 — M3 compares invoice to PO and receipt"],["8","Review Result","Matched = auto-approved. Variance = manual review"]],videoUrl:"",quiz:[{q:"The Invoice Date field should contain:",options:["Today's date","The date you entered the invoice","The date on the vendor's invoice","The payment due date"],answer:2},{q:"To run the three-way match in APS100 you press:",options:["F3","F5","F14","F17"],answer:2},{q:"An invoice cannot be processed without:",options:["A shipping address","A valid PO reference","A GL account code","The vendor's email"],answer:1}],checklist:["I can enter a vendor invoice in APS100","I can run the three-way match using F14","I understand the match outcomes — matched vs variance","I know how to resolve a price discrepancy"]},{id:"fin-2",title:"Cash Application and AR Aging — ARS200 and ARS300",duration:"45 min",steps:[["1","Open ARS200","Navigate to Accounts Receivable > Cash Application > ARS200"],["2","Enter Customer Number","Find the paying customer"],["3","Enter Payment Details","Amount, date, and reference number"],["4","Select Invoices","Choose invoices this payment covers"],["5","Verify Balance","Total applied must equal payment amount"],["6","Confirm","M3 marks selected invoices as paid"],["7","Open ARS300","Navigate to AR > Aging > ARS300"],["8","Review Overdue","Buckets: Current / 1-30 / 31-60 / 61-90 / 90+ days past due"]],videoUrl:"",quiz:[{q:"Unapplied customer payments appear as:",options:["Paid invoices","Open credits on the customer account","Revenue in the GL","Errors in ARS300"],answer:1},{q:"For a partial payment, you should apply to:",options:["The newest invoices first","The largest invoices first","The oldest invoices first","Any invoice randomly"],answer:2},{q:"A customer with 90+ days past due balance should be:",options:["Ignored until they call","Escalated to management for possible collections","Given an automatic credit hold by M3","Sent a new invoice"],answer:1}],checklist:["I can apply a customer payment to invoices in ARS200","I know how to handle partial payments","I can read and act on the AR aging report in ARS300","I know when to escalate overdue accounts to management"]}]},
  financeGL:{id:"financeGL",name:"Finance — General Ledger",owner:"Philip Jones",weeks:"Week 6",pill:"pill-red",color:"#c0443b",programs:["GLS040","GLS100","GLS050","GLS910","GLS990"],summary:"Chart of accounts, journal entries, period close, GL inquiry, financial reports.",links:[["Deck",SP+"/Adleta_M3_Finance_GL_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Finance_GL_LearningGuide.docx"]],sessions:[{id:"gl-1",title:"Journal Entries and Period Close — GLS100 and GLS050",duration:"60 min",steps:[["1","Open GLS100","Navigate to General Ledger > Journal Entry > GLS100"],["2","Enter Journal Date","Must be in an open accounting period"],["3","Enter Description","Clear explanation — required for audit"],["4","Enter Debit Lines","Account number, amount, line description"],["5","Enter Credit Lines","Account number, amount, line description"],["6","Verify Balance","Debits must equal credits — M3 blocks unbalanced entries"],["7","Attach Documentation","Supporting docs required for all manual entries"],["8","Post","Press F5 after approval — M3 updates GL balances"],["9","Period Close via GLS050","Confirm all transactions done, get approval, close period"]],videoUrl:"",quiz:[{q:"A journal entry will be rejected by M3 if:",options:["It has a description","Debits do not equal credits","It is entered before noon","It references more than 2 accounts"],answer:1},{q:"After closing a period in GLS050:",options:["Entries can still be posted","No further postings are allowed","The period reopens automatically","Finance receives an email"],answer:1},{q:"All manual journal entries must have:",options:["A vendor reference","A customer number","Clear description and supporting documentation","A purchase order number"],answer:2}],checklist:["I can create a balanced journal entry in GLS100","I understand when to use reversing vs standard journal entries","I can complete the period close checklist steps","I know how to reopen a period with manager authorization if needed"]},{id:"gl-2",title:"Chart of Accounts and GL Inquiry — GLS040 and GLS910",duration:"45 min",steps:[["1","Open GLS040","Navigate to General Ledger > Chart of Accounts > GLS040"],["2","Browse the account structure","Review account ranges: assets, liabilities, equity, revenue, expense. Note the Adleta account numbering convention."],["3","Look up an account","Enter an account number and press Enter. Review account type, description, and posting rules."],["4","Check if an account allows posting","Look at the posting flag. Non-posting accounts are summary accounts — transactions must go to detail accounts below them."],["5","Open GLS910","Navigate to General Ledger > GL Inquiry > GLS910"],["6","Enter account and period","Type the GL account number, financial year, and period range."],["7","Review balance and transactions","See opening balance, period activity (debits and credits), and closing balance."],["8","Drill into transactions","Select a transaction line and press Enter to see the source document — journal entry, AP invoice, AR payment, etc."],["9","Export if needed","Press F17 to export the inquiry results to Excel for review or reconciliation."]],videoUrl:"",quiz:[{q:"A non-posting account in GLS040 means:",options:["The account is closed","Transactions must be posted to detail accounts below it, not to this account directly","The account requires manager approval","The account is only used for reporting"],answer:1},{q:"In GLS910 you can drill into a transaction to see:",options:["The vendor's contact details","The source document — journal entry, invoice, or payment — that created the posting","The budget for that account","The period close status"],answer:1},{q:"The correct way to find why a GL account balance changed in a period is:",options:["Run a new journal entry","Open GLS910, enter the account and period, and review the transaction detail","Ask IT to run a report","Check the AR aging in ARS300"],answer:1},{q:"Account ranges in the Adleta chart of accounts are organized by:",options:["Alphabetical order","Department name","Account type — assets, liabilities, equity, revenue, expense","Transaction date"],answer:2}],checklist:["I can navigate the chart of accounts in GLS040 and identify account types","I can distinguish between posting and non-posting accounts","I can run a GL inquiry in GLS910 for any account and period","I can drill into a transaction to find its source document","I can export GL inquiry results to Excel"]},{id:"gl-3",title:"Financial Reports and Period Review — GLS990",duration:"45 min",steps:[["1","Open GLS990","Navigate to General Ledger > Financial Reports > GLS990"],["2","Select report type","Choose from: Balance Sheet, Income Statement, or custom report layout configured for Adleta."],["3","Enter parameters","Select financial year, period, and accounting dimension (division, cost center, or consolidated)."],["4","Run the report","Press F5 — M3 generates the financial statement with current period and year-to-date figures."],["5","Review key lines","Check total revenue, total expenses, and net income on the income statement. Check total assets equals total liabilities plus equity on the balance sheet."],["6","Compare to prior period","Re-run with the previous period selected. Note significant variances that need explanation."],["7","Export to Excel","Press F17 to export. Use for management reporting, variance commentary, or audit support."],["8","Identify out-of-balance items","If the balance sheet does not balance, flag immediately — do not close the period until resolved."],["9","File the signed-off report","Save a copy to SharePoint as part of the period close documentation package."]],videoUrl:"",quiz:[{q:"On a balance sheet, total assets must equal:",options:["Total revenue minus total expenses","Total liabilities plus equity","Net income plus equity","Total debits minus total credits"],answer:1},{q:"Before closing a period, the balance sheet shows a discrepancy. You should:",options:["Close the period anyway and fix it next month","Export to Excel and adjust the spreadsheet","Flag it immediately and do not close until resolved","Repost all journal entries"],answer:2},{q:"The GLS990 parameter that controls whether you see one division or the full company is:",options:["Period","Financial year","Accounting dimension","Report type"],answer:2},{q:"Year-to-date figures in GLS990 represent:",options:["Only the current period","The cumulative total from the start of the financial year through the selected period","The prior year comparison","The budget for the year"],answer:1}],checklist:["I can run a balance sheet and income statement in GLS990","I can select the correct period, year, and accounting dimension","I can compare current period to prior period and identify variances","I know what to do if the balance sheet is out of balance","I can export financial reports and file them to SharePoint"]}]},
  logistics:{id:"logistics",name:"Logistics / Transportation",owner:"Abbey Parker",weeks:"Week 5-6",pill:"pill-blue",color:"#5b7fa6",programs:["OIS300","MWS410","MWS420","DRS001","OIS600"],summary:"Carrier setup, delivery management, shipment tracking, freight coordination, and logistics reporting.",links:[],sessions:[{id:"log-1",title:"Delivery Management and Shipment Tracking — OIS300 and MWS410",duration:"60 min",steps:[["1","Understand logistics in M3","Logistics in M3 connects warehouse fulfillment with carrier delivery. Your role is to ensure shipments leave with the right carrier, correct freight terms, and accurate tracking information."],["2","Open OIS300","Navigate to Sales > Shipment Processing > OIS300. This is where warehouse confirms shipments. Logistics reviews and coordinates carrier assignment at this stage."],["3","Review shipment details","For each shipment confirm: ship-to address, item, quantity, UOM, and requested delivery date. Flag any mismatches before the carrier is booked."],["4","Open MWS410","Navigate to Warehouse Management > Delivery > MWS410. This is the delivery toolbox — review deliveries ready for carrier pickup."],["5","Assign carrier","Select the delivery. Enter the carrier ID, service type (standard, express, freight), and freight terms (prepaid, collect, third party)."],["6","Enter tracking number","Once the carrier picks up, enter the carrier tracking number on the delivery record. This connects the physical shipment to the M3 record."],["7","Confirm delivery","Press F5 to confirm. M3 updates the order status to shipped and the tracking number is available to Sales / CS for customer inquiries."],["8","Handle exceptions","If a carrier cannot pick up on time: contact Sales / CS immediately. If a shipment is damaged in transit: log issue with carrier name, tracking number, delivery reference, and business impact."]],videoUrl:"",quiz:[{q:"Before booking a carrier for a shipment, you must verify:",options:["The GL account for freight expense","Ship-to address, item, quantity, UOM, and requested delivery date are correct","The customer's credit status","The purchase order is approved"],answer:1},{q:"Freight terms Prepaid means:",options:["The customer pays freight at delivery","Adleta pays freight and the cost is included in the invoice","A third party account is billed","Freight is free"],answer:1},{q:"After a carrier picks up a shipment, you must:",options:["Wait for the customer to confirm receipt","Enter the carrier tracking number on the delivery record in M3","Call the warehouse to confirm","Create a new sales order for the next shipment"],answer:1},{q:"If a carrier cannot pick up on time, your first action is:",options:["Cancel the shipment","Contact Sales / CS immediately so they can communicate with the customer","Wait until the next day","Re-assign the order to a different warehouse"],answer:1}],checklist:["I can review deliveries ready for carrier pickup in MWS410","I can assign a carrier, service type, and freight terms to a delivery","I always enter the tracking number after carrier pickup","I know how to confirm a delivery and update the order status in M3","I know the exception process for late pickup or damaged shipment"]},{id:"log-2",title:"Freight Coordination and Logistics Reporting — OIS600",duration:"45 min",steps:[["1","Understand your reporting role","As the logistics super user you own visibility into shipment status, on-time delivery, and freight cost. You are the first person to know when something is delayed or missing."],["2","Open OIS600 — Shipment Status Report","Navigate to Sales > Reports > OIS600. Enter a date range. Review orders by shipment status: confirmed, in transit, delivered, and exceptions."],["3","Identify unconfirmed shipments","Filter for orders that are released to warehouse but not yet shipped. These are at risk of missing the customer's requested delivery date. Contact Warehouse if overdue."],["4","Identify in-transit exceptions","Review any shipments flagged as delayed by the carrier. Cross-reference with tracking numbers. Log each exception with carrier, tracking number, customer, and expected resolution date."],["5","Review freight costs","If freight cost reporting is available, review cost by carrier and service type. Flag shipments where actual freight significantly exceeds expected cost."],["6","Communicate proactively","For any shipment that will miss its delivery date, notify Sales / CS before the customer calls. Include: order number, expected new delivery date, and reason."],["7","Build your daily rhythm","Each morning: review open shipments due today. Check for unconfirmed pickups. Verify yesterday's shipments are showing tracking activity. Escalate anything that is stuck."],["8","Log and escalate","Log all carrier exceptions, damages, and delays in the issue log with priority, owner, and resolution. Escalate High priority issues — anything blocking a customer delivery — to KRISTENB same day."]],videoUrl:"",quiz:[{q:"An order that is released to warehouse but not yet shipped and is past its requested delivery date should be:",options:["Cancelled and re-entered","Escalated to Warehouse and flagged for the customer","Left until the customer calls","Reassigned to a different carrier automatically"],answer:1},{q:"Your primary job when a shipment will miss its delivery date is:",options:["Wait for the customer to call and then explain","Notify Sales / CS proactively before the customer calls","Update the delivery date in M3 without telling anyone","Contact Infor support"],answer:1},{q:"A High priority logistics issue is one that:",options:["Is a question about carrier setup","Involves a small quantity overage","Blocks a customer delivery","Is a freight cost question"],answer:2},{q:"The OIS600 report shows:",options:["Financial statements for freight expense","Shipment status — confirmed, in transit, delivered, and exceptions — by date range","Inventory stock balances by warehouse","Supplier invoice payment status"],answer:1}],checklist:["I can run OIS600 and identify unconfirmed, in-transit, and exception shipments","I review open shipments each morning as part of my daily rhythm","I notify Sales / CS proactively when a delivery will be late — before the customer calls","I log all carrier exceptions with carrier name, tracking number, customer, and resolution","I know when to escalate a logistics issue to KRISTENB same day"]}]},
  productManagement:{id:"productManagement",name:"Product Management",owner:"Lauren Calvey",weeks:"Week 5-6",pill:"pill-gray",color:"#7a5ea6",programs:["MMS060","MMS001","MMS002","OIS010","MMS200"],summary:"Item master setup and maintenance, product lifecycle, pricing structures, and product catalog management in M3.",links:[],sessions:[{id:"prd-1",title:"Item Master Setup and Maintenance — MMS060",duration:"60 min",steps:[["1","Understand the item master","Every product Adleta buys, sells, or stocks must exist as an active item in MMS060 before it can appear on a PO, sales order, or inventory transaction. The item record is the foundation of every department's work."],["2","Open MMS060","Navigate to Inventory > Item Master > MMS060. Press F3 to create a new item or enter an existing item number to review."],["3","Enter item number and description","Item numbers follow the Adleta naming convention — confirm the standard with your manager before creating new items. Description must be clear and consistent."],["4","Set item status","New items start at status 10 (Pending). Change to status 20 (Active) only after all required fields are complete and the item is approved. Inactive items use status 90."],["5","Set unit of measure","UOM is critical for flooring products — confirm whether the item sells in SQF, BOX, RL, EA, or PLT. Incorrect UOM causes errors on POs, sales orders, and inventory counts."],["6","Set item category and type","Item category controls how M3 handles the item in purchasing, inventory, and sales. Confirm the correct category with IT or your implementation team."],["7","Set stock method","Choose whether the item is stocked (held in warehouse) or non-stocked (purchased on demand). This affects replenishment, forecasting, and reporting."],["8","Save and verify","Press Enter to save. Open MMS200 to confirm the item appears in inventory with zero stock balance. Verify the item can be added to a test PO and sales order before marking it fully active."]],videoUrl:"",quiz:[{q:"Before an item can be used on a PO or sales order, its status in MMS060 must be:",options:["10 — Pending","20 — Active","90 — Inactive","Any status is acceptable"],answer:1},{q:"Unit of measure on an item record is critical because:",options:["It only affects the purchase order","It affects POs, sales orders, inventory counts, pricing, and reporting — an incorrect UOM causes errors across all departments","It is only used for reporting","Finance sets it separately from the item record"],answer:1},{q:"A non-stocked item in M3 means:",options:["The item is discontinued","The item is purchased on demand and not held in warehouse inventory","The item has no price assigned","The item requires special handling"],answer:1},{q:"After creating a new item, you should verify it by:",options:["Sending an email to IT","Opening MMS200 to confirm it appears and testing it on a PO and sales order before marking it fully active","Printing the item record","Checking the GL account"],answer:1}],checklist:["I understand why the item master is the foundation for all department transactions","I can create a new item in MMS060 with the correct status, UOM, category, and stock method","I know the Adleta item numbering convention and confirm before creating new items","I verify new items in MMS200 and test on a PO and sales order before activating","I know the three key item statuses: Pending (10), Active (20), Inactive (90)"]},{id:"prd-2",title:"Product Lifecycle and Pricing Structure — MMS060 and OIS010",duration:"60 min",steps:[["1","Understand product lifecycle","Products move through stages: new, active, being phased out, and discontinued. M3 controls which transactions are allowed at each stage through item status. Your job is to keep item records accurate as products change."],["2","Managing a product change","When a product is updated — new description, UOM change, category change — do not delete the old record. Update it in MMS060 and document the change with a note and date."],["3","Discontinuing a product","When Adleta stops selling an item, set status to 90 (Inactive) in MMS060 only after confirming: no open POs, no open sales orders, and zero stock on hand. Contact Purchasing, Sales, and Warehouse before inactivating."],["4","Understand price list structure","Prices in M3 live in OIS010, not on the item record. An item can have different prices on different price lists — standard, promotional, customer-specific."],["5","Open OIS010","Navigate to Sales > Price List > OIS010. Select a price list and find an item. Review base price, effective date, expiry date, and UOM."],["6","Add or update an item price","Select the price list. Add the item number, price, effective date, and UOM. Set an expiry date if this is a promotional price. Save."],["7","Verify price on a sales order","Open OIS100, enter the customer and item. Confirm M3 pulls the correct price based on the customer's assigned price list. If the wrong price appears, check the customer's price list assignment in OIS017."],["8","Coordinate price changes","Price changes affect Sales, Finance, and customer communications. Notify KRISTENB and Sales before updating a price list that is assigned to active customers. Document the effective date and reason for every change."]],videoUrl:"",quiz:[{q:"To discontinue an item in M3, you set its status to 90. Before doing this you must confirm:",options:["The item has been in the system for at least one year","There are no open POs, no open sales orders, and zero stock on hand — and you have notified Purchasing, Sales, and Warehouse","Finance has approved the removal","IT has deleted the item from the price list"],answer:1},{q:"Item prices in M3 are stored in:",options:["MMS060 on the item record","OIS010 on the price list","MMS200 in the stock balance","GLS040 in the chart of accounts"],answer:1},{q:"If a sales order is pulling the wrong price for a customer, the first place to check is:",options:["The item record in MMS060","The customer's price list assignment in OIS017","The GL account","The purchase order"],answer:1},{q:"When making a price list change that affects active customers, you should:",options:["Make the change immediately and notify no one","Update the expiry date but leave the price alone","Notify KRISTENB and Sales before updating, document the effective date and reason","Wait until the end of the financial year"],answer:2}],checklist:["I understand the product lifecycle stages and how item status controls M3 transactions","I know the steps to safely discontinue a product — checking POs, orders, stock, and notifying departments","I can add and update item prices in OIS010 with correct effective and expiry dates","I verify price changes on a test sales order before communicating to the business","I document every price change with effective date and reason and notify affected teams in advance"]}]},
  week9:{id:"week9",name:"Trainer Readiness and Go-Live Prep",owner:"All super users",weeks:"Week 9",pill:"pill-red",color:"#c0443b",programs:["Teams","SharePoint","Issue Log","Planner"],summary:"Teach-backs, readiness sign-off, FAQ build, go-live support roles, department training handoff, and stabilization.",links:[["Teach-Back Packet",SP+"/Week_9_Teach_Back_Readiness_Signoff_Packet.md"],["Go-Live Playbook",SP+"/Go_Live_Support_Playbook.md"],["Department Handoff Plan",SP+"/Department_Training_Handoff_Plan.md"]],sessions:[{id:"w9-1",title:"Teach-Back Preparation",duration:"60 min",steps:[["1","Review your module","Open your module in the portal and review every session, step, quiz, and checklist. Identify any gaps before your teach-back."],["2","Know your 15-minute structure","2 min: explain the department workflow. 5 min: walk through key M3 programs. 3 min: explain one exception and first response. 2 min: explain a department handoff. 2 min: give a practice question you would ask users. 1 min: confirm escalation path."],["3","Prepare your normal scenario","Choose one complete normal workflow you can walk through live in M3 — from opening the program to saving the transaction."],["4","Prepare your exception scenario","Choose one common exception in your module. Know the steps: identify it, who to contact, how to log it."],["5","Prepare your handoff","Name one department that hands off to you and one you hand off to. Know what data must be correct at each handoff."],["6","Prepare a department training tip","Think about one thing your department users will find confusing. Plan how you would explain or demonstrate it."],["7","Practice with a peer","Run through your 15-minute teach-back with another super user. Time yourself. Get feedback on clarity."],["8","Review the rubric","Passing requires average 2.5 or higher across all criteria and no score of 1 in navigation, transaction accuracy, or trainer readiness."]],videoUrl:"",quiz:[{q:"The teach-back format is 15 minutes. The first 2 minutes should cover:",options:["Walking through every screen in your module","Explaining the department workflow in plain business language","Reading from your training notes","Showing the issue log template"],answer:1},{q:"The passing standard for the teach-back rubric is:",options:["Perfect scores on all criteria","Average of 2.5 or higher and no score of 1 in navigation, accuracy, or trainer readiness","Completing all sessions in the portal","Attending all 9 weeks of training"],answer:1},{q:"If you are scored 1 (Not Ready) on System Navigation, you:",options:["Still pass if your other scores are high enough","Do not pass regardless of other scores","Can retake only that section","Are automatically assigned to IT support"],answer:1},{q:"The best way to prepare for your teach-back is:",options:["Memorize the program codes","Practice the full 15-minute walkthrough with a peer and time yourself","Read the training documents the night before","Ask Kristen to show you the workflow again"],answer:2}],checklist:["I have reviewed every session, step, and checklist in my assigned module","I know my 15-minute teach-back structure","I have a normal scenario I can walk through live in M3","I have an exception scenario with the correct handling steps","I know my upstream and downstream department handoffs","I have practiced with a peer and received feedback","I understand the rubric and passing standard"]},{id:"w9-2",title:"Teach-Back and Readiness Sign-Off",duration:"90 min",steps:[["1","Deliver your 15-minute teach-back","Present to KRISTENB and the group. Follow the structure: workflow, programs, exception, handoff, practice question, escalation path."],["2","Receive rubric scores","KRISTENB scores each criteria 1-3. Listen for feedback. Do not argue — note coaching items for remediation."],["3","Review readiness decision","Ready: proceed to department training plan. Ready With Coaching: targeted remediation assigned before go-live. Not Ready: additional training scheduled with backup support assigned."],["4","Build your FAQ contribution","Write 3-5 questions your department users are likely to ask. Include the correct answer and which program or step it relates to. Submit to the shared FAQ."],["5","Review open issues","Go through the issue log. For each open item in your module: confirm owner, confirm resolution path, and flag anything that could block go-live."],["6","Sign readiness acknowledgment","Complete the readiness acknowledgment form: name, department, module, readiness status, required remediation, and signature. Manager countersigns."],["7","Confirm department training date","Lock in the date, location, and attendee list for your department training session. Confirm practice data is ready."]],videoUrl:"",quiz:[{q:"If you receive a readiness status of Ready With Coaching, your next step is:",options:["Wait for go-live and figure it out on the job","Complete assigned remediation and retest the weak area before go-live","Start training your department immediately","Request a different module assignment"],answer:1},{q:"Your FAQ contribution should include:",options:["Every possible M3 question","3-5 likely questions from your department users with correct answers and program references","Only questions you personally had during training","A copy of all training documents"],answer:1},{q:"The readiness acknowledgment confirms that you:",options:["Scored perfectly on all quizzes","Attended every training session without absence","Completed training, practiced, finished your teach-back, and understand your go-live responsibility","Have read all SharePoint documents"],answer:2},{q:"Before your department training session, you must confirm:",options:["That all super users have passed their teach-backs","Training date, attendees, practice data, and that your known issues are documented","That the portal has been updated","That IT has finished the system configuration"],answer:1}],checklist:["I delivered my 15-minute teach-back","I received my rubric scores and understand any coaching feedback","I know my readiness status — Ready, Ready With Coaching, or Not Ready","I submitted 3-5 FAQ contributions with correct answers","I reviewed all open issues in my module and confirmed owners","I signed the readiness acknowledgment","My department training date and attendee list are confirmed"]},{id:"w9-3",title:"Go-Live Support and Department Handoff",duration:"60 min",steps:[["1","Know your support tier","You are Tier 1 — first-line support for your department. Handle how-to questions, navigation, and known workarounds. Escalate to KRISTENB (Tier 2) when an issue blocks work, affects data, or needs a configuration change."],["2","Know the issue log fields","Every issue must include: date/time, department, reported by, program, process, what happened, steps tried, business impact, priority (High/Medium/Low), owner, status, and resolution."],["3","Understand issue priority","High: blocks orders, shipments, receiving, invoicing, payment, or period close — same day triage. Medium: workaround exists but slows work — 1-2 days. Low: question, training gap, or enhancement — weekly review."],["4","Know the daily go-live rhythm","Start of day: review open high-priority issues. Midday: check blockers. End of day: review resolved items and FAQ updates. Report to KRISTENB if anything is blocking your department."],["5","Confirm your floor support availability","Know your agreed support hours during go-live week. Keep your module guide and quick reference open. Use training materials before guessing."],["6","Review your department training handoff checklist","Confirm: department user list, training date, quick reference ready, practice scenario ready, known issues documented, escalation path shared, sign-off method confirmed."],["7","Avoid unauthorized changes","Never make data or configuration changes in production without approval. Log the issue and escalate. Document everything."],["8","Post go-live stabilization","For the first 2-4 weeks: continue daily issue review, track repeated training gaps, update job aids weekly, hold department check-ins, review open items with leadership weekly."]],videoUrl:"",quiz:[{q:"As a Tier 1 super user, you should escalate an issue to KRISTENB when:",options:["A department user asks a how-to question","The issue blocks work, affects data, or requires a configuration or security change","Someone is confused about navigation","You want to update the FAQ"],answer:1},{q:"A High priority issue is one that:",options:["Is annoying but has a workaround","Blocks orders, shipments, receiving, invoicing, payment, or period close","Is a training gap or question","Was logged more than once"],answer:1},{q:"If a department user asks you how to do something and you are not sure, you should:",options:["Give your best guess","Tell them to call IT","Check your training materials first before answering","Ignore the question until you are certain"],answer:2},{q:"During the post go-live stabilization period, repeated questions should become:",options:["Ignored after the first week","FAQ updates and job aid improvements","Escalations to Infor support","New training sessions from scratch"],answer:1}],checklist:["I know my support tier and what I handle vs what I escalate","I can create a complete issue-log entry with all required fields","I know the three priority levels and response expectations","I know the daily go-live rhythm and when to report to KRISTENB","I have confirmed my floor support availability during go-live week","My department training handoff checklist is complete","I understand I must never make unauthorized data or configuration changes in production"]}]},
  endToEnd:{id:"endToEnd",name:"End-to-End Process Walkthroughs",owner:"All super users",weeks:"Week 8",pill:"pill-gold",color:"#c49a2a",programs:["CRS610","CRS620","PPS200","PPS300","OIS100","OIS300","APS100","APS200","ARS100","ARS200","MMS200"],summary:"Full cross-functional walkthroughs connecting Purchasing, Warehouse, Sales, and Finance through Procure to Pay and Order to Cash.",links:[["Procure to Pay Packet",SP+"/Week_8_Procure_to_Pay_Walkthrough_Packet.md"],["Order to Cash Packet",SP+"/Week_8_Order_to_Cash_Walkthrough_Packet.md"]],sessions:[{id:"w8-1",title:"Procure to Pay — Full Walkthrough",duration:"90 min",steps:[["1","Verify supplier — CRS620","Purchasing opens CRS620 and confirms the supplier is active, has payment terms, and is ready for a PO."],["2","Create PO header — PPS200","Purchasing opens PPS200, presses F3 for a new PO. Enters supplier, PO type, buyer, warehouse, and requested delivery date."],["3","Add PO lines — PPS201","Purchasing adds at least two lines: item number, quantity, UOM, price, and delivery date. Records the PO number assigned by M3."],["4","Approve and release PO","Purchasing confirms the PO status is released/ready per Adleta rules before communicating to the supplier."],["5","Receive goods — PPS300","Warehouse opens PPS300, finds the PO, verifies packing slip against PO items and quantities, enters actual received quantities, and confirms. Records receipt number."],["6","Verify inventory update — MMS200","Warehouse opens MMS200 and confirms the received item shows updated on-hand and available balances."],["7","Enter supplier invoice — APS100","Finance AP opens APS100, enters the supplier invoice referencing the PO number. Enters invoice date, amount, and runs F14 three-way match."],["8","Resolve match result","If matched: invoice is auto-approved. If variance: Finance AP contacts Purchasing (price issue) or Warehouse (quantity issue) to resolve before payment."],["9","Create payment proposal — APS200","Finance AP opens APS20 function buildNav(){const nav=document.getElementById("navLinks");const items=currentUserData.role==="admin"?ADMIN_NAV:USER_NAV;nav.innerHTML=items.map(item=>`<button class="nav-btn ${item.id==="dashboard"?"active":""}" data-view="${item.id}"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${item.icon}</svg>${item.label}</button>`).join("");nav.querySelectorAll(".nav-btn").forEach(btn=>{btn.addEventListener("click",()=>switchView(btn.dataset.view));});}
function buildUserPill(){const u=currentUserData;const ini=u.name.split(" ").map(n=>n[0]).join("").substring(0,2);document.getElementById("userAvatar").textContent=ini;document.getElementById("userAvatar").style.background=u.color;document.getElementById("userName").textContent=u.name;document.getElementById("userRoleLabel").textContent=u.role==="admin"?"Administrator":u.dept;document.getElementById("heroSub").textContent="Adleta Corporation · Infor M3 Rollout · 9-Week Program · "+u.name;}
function switchView(viewId){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));const el=document.getElementById("view-"+viewId);if(el)el.classList.add("active");const btn=document.querySelector(`[data-view="${viewId}"]`);if(btn)btn.classList.add("active");renderView(viewId);}

function visibleModules(){if(currentUserData.role==="admin"||currentUserData.modules.includes("all"))return Object.values(MODULES);return currentUserData.modules.filter(id=>id!=="all-readonly").map(id=>MODULES[id]).filter(Boolean);}
function findSession(sid){for(const m of Object.values(MODULES)){const s=m.sessions.find(s=>s.id===sid);if(s)return s;}return null;}
function sessionProgress(sid){const s=findSession(sid);if(!s)return 0;const done=s.checklist.filter((_,i)=>ST[`chk-${sid}-${i}`]).length;return Math.round(done/s.checklist.length*100);}
function moduleProgress(mid){const m=MODULES[mid];if(!m||!m.sessions.length)return 0;const scores=m.sessions.map(s=>ST[`quiz-score-${s.id}`]||0);return Math.round(scores.reduce((a,b)=>a+b,0)/m.sessions.length);}
function renderDashboard(){const mods=visibleModules();const tot=mods.reduce((a,m)=>a+m.sessions.length,0);const done=mods.reduce((a,m)=>a+m.sessions.filter(s=>(ST[`quiz-score-${s.id}`]||0)>=70).length,0);let html=`<div class="metrics"><div class="metric"><div class="metric-val">${mods.length}</div><div class="metric-label">My Modules</div></div><div class="metric"><div class="metric-val">${tot}</div><div class="metric-label">Sessions</div></div><div class="metric"><div class="metric-val">${done}</div><div class="metric-label">Completed</div></div><div class="metric"><div class="metric-val">${tot?Math.round(done/tot*100):0}%</div><div class="metric-label">Progress</div></div></div><div class="dash-grid"><div class="card"><div class="card-title">Mastery Model <span class="pill pill-teal">Required for sign-off</span></div><div class="mastery"><div class="mastery-node">Do it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Explain it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Troubleshoot it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Teach it</div></div></div><div class="card"><div class="card-title">Next Actions <span class="pill pill-gray">${NEXT_ACTIONS.length} items</span></div><div class="prog-wrap"><div class="prog-track"><div class="prog-fill" id="dpf" style="width:0%"></div></div><div class="prog-label" id="dpl">0%</div></div><div class="check-list" id="dcl"></div></div></div>`;
if(mods.length){html+=`<div class="sec-hd" style="margin-top:20px"><div><div class="sec-eyebrow">Your training</div><h2>My Modules</h2></div></div><div class="mod-grid">`;html+=mods.map(m=>{const pct=moduleProgress(m.id);return`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div><div class="tags">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% complete · ${m.sessions.length} session${m.sessions.length!==1?"s":""}</div></div>`;}).join("");html+=`</div>`;}
