"rep-1":{obj:"Use Birst to pull the daily sales performance report and identify top-selling items and customers.",scn:"It is the start of the day. Pull yesterday sales numbers in Birst and identify which items and customers drove the most revenue.",tasks:[{n:"Open the sales dashboard in Birst",s:["Open Birst from the portal Resources tab or your bookmarks.","Navigate to the Sales Performance dashboard.","Confirm the date filter shows yesterday date."]},{n:"Review daily summary and drill down",s:["Review total orders, total revenue, and number of customers.","Identify the top 3 items by revenue and the top 3 customers by order volume.","Click on the customer with the highest revenue to drill down.","Export the summary to Excel for the daily sales meeting."]}],out:["Daily sales summary reviewed in Birst.","Top items and customers identified.","Report exported for the sales meeting."],exc:[{q:"The Birst dashboard shows no data for yesterday",a:"Check if the data refresh job ran. Birst data is typically refreshed overnight. If data is missing for more than one day, contact IT."},{q:"The numbers in Birst do not match what you see in M3",a:"Birst pulls data on a schedule - it may be one day behind M3. If the gap is larger than one day, flag it to IT. Do not use Birst for real-time transaction decisions."},{q:"You cannot export to Excel from the dashboard",a:"Check your browser settings - Excel export may be blocked by a popup blocker. Try right-clicking the export button or use a different browser."},{q:"A customer shows in M3 but not in the Birst report",a:"Confirm the customer had orders in the date range selected. Also confirm the customer is in the correct division - Birst may filter by division."}]},
"rep-2":{obj:"Build a custom sales report in Birst Visualizer using M3 sales data.",scn:"The sales manager wants a report showing sales by customer and item category for the last 30 days. Build it in Birst Visualizer.",tasks:[{n:"Open Birst Visualizer and set up the report",s:["In Birst, navigate to Visualizer (report builder).","Create a new report and select the Sales data subject area.","Drag Customer Name to the row dimension.","Drag Item Category to the column dimension and Revenue ($) to the measure area."]},{n:"Apply filters, format, and save",s:["Add a date filter: last 30 days.","Sort by Revenue descending.","Change the visualization type to Bar Chart.","Name the report and save."]}],out:["Custom report shows sales by customer and item category.","Date filter applied for last 30 days.","Report saved in Birst for ongoing use."],exc:[{q:"The custom report returns more rows than expected",a:"Check your filters. A missing date filter or wrong dimension will return all history. Add filters before sharing the report."},{q:"Revenue numbers in your custom report differ from the standard dashboard",a:"Confirm you are using the same measure definition. Revenue in Birst can be defined as net, gross, or invoiced - confirm which one applies."},{q:"You save the report but cannot find it later",a:"Confirm you saved to your personal folder or a shared folder. Reports saved to the default location may be overwritten by system updates."},{q:"The bar chart displays but some item categories are missing",a:"Filter results may be hiding categories with no sales. Change the filter to include all categories, then sort to identify zeros."}]},
"rep-3":{obj:"Build a Birst KPI dashboard with key sales metrics for daily monitoring.",scn:"Build a dashboard in Birst showing total daily orders, revenue vs. goal, top customer, and fill rate for the daily sales standup.",tasks:[{n:"Create a new Birst dashboard with KPI tiles",s:["In Birst, navigate to Dashboards and click New Dashboard.","Name it: Daily Sales KPI.","Add a KPI tile for Total Orders (today).","Add KPI tiles for Revenue vs. Goal (%), Top Customer by Revenue, and Fill Rate (%)."]},{n:"Configure filters and publish",s:["Add a date parameter so viewers can change the date.","Set the default to today date.","Save and publish the dashboard.","Share the link with the sales team."]}],out:["Daily Sales KPI dashboard created in Birst.","4 KPI tiles configured and displaying live data.","Dashboard shared with the sales team."],exc:[{q:"A KPI tile shows a number that looks wrong",a:"Verify the measure definition and date filter on that tile. A wrong filter is the most common cause of unexpected KPI values."},{q:"The dashboard is published but the sales team says they cannot access it",a:"Check the sharing settings - the dashboard may be set to private. Change to shared and confirm the team has Birst login access."},{q:"The date parameter defaults to yesterday instead of today",a:"Update the default parameter value to today. In Birst today is typically a relative date expression - confirm the correct syntax with IT if needed."},{q:"Fill rate is showing as 100% which seems too high",a:"Verify the fill rate measure definition. 100% is possible but uncommon. Confirm the numerator and denominator are both pulling from the correct data set."}]},
"rep-4":{obj:"View and manage customer-specific price lists in OIS017.",scn:"Customer ADL1001 has a negotiated price for flooring items. Review their price list in OIS017 and confirm pricing is correct.",tasks:[{n:"Open OIS017 and review price list",s:["Open OIS017 (Customer Price. Open) in M3.","Enter Customer = ADL1001 and press Enter to display the price list.","Review each item on the price list.","Confirm prices match the current negotiated agreement and identify any missing items."]},{n:"Update a price",s:["Select an item with an incorrect price and choose Change.","Enter the correct price and effective date.","Save and confirm the change."]}],out:["ADL1001 customer price list reviewed in OIS017.","All prices match the current negotiated agreement.","Missing or incorrect prices updated."],exc:[{q:"The customer has no price list in OIS017",a:"The customer may be using the standard price list, not a customer-specific one. Check OIS010 for the standard list. If they should have a specific list, set one up."},{q:"A price in OIS017 is lower than cost",a:"This is a red flag. Do not change it without flagging to Tony Shipka and Philip Jones. Selling below cost requires management awareness."},{q:"You update a price but the change does not appear on new orders",a:"Confirm the effective date has passed. Also confirm there is not a higher-priority customer-specific pricing record overriding the list."},{q:"OIS017 shows a price for an item that is discontinued",a:"The price list entry can remain - it will not affect orders since the item is status 50 and blocked. No action needed unless it causes confusion."}]},
"rep-5":{obj:"Set up and maintain a standard price list in OIS010 for use across multiple customers.",scn:"Adleta is launching a new price list effective next quarter. Set it up in OIS010 and link it to customer ADL1001.",tasks:[{n:"Create the price list and add items",s:["Open OIS010 (Price List. Open) and click New.","Enter price list ID, description, effective date = first day of next quarter, and currency = USD.","On the price list detail, click New for each item, enter the item number and price.","Save when all items are added."]},{n:"Link to customer ADL1001 and test",s:["Open the customer master for ADL1001.","In the pricing section, set Price List = the new list.","Create a test order and verify the new prices apply after the effective date."]}],out:["New price list created in OIS010 with all items and prices.","Price list linked to customer ADL1001.","New prices take effect on the configured start date."],exc:[{q:"The new price list effective date is wrong after saving",a:"If the list is not yet active, edit the effective date. If it is already effective, create a new version of the list with the correct date. Do not modify a live list retroactively."},{q:"The test order does not pick up the new price list",a:"Confirm the price list is linked to ADL1001 in the customer master and the effective date has passed. Also confirm there is no higher-priority price override on the order."},{q:"Another user overwrites your price list changes",a:"Confirm who has edit access to price lists. For a major new price list, make the change during off-hours to avoid conflicts."},{q:"The price list has hundreds of items and manual entry will take hours",a:"Ask IT about bulk price list import. M3 supports price list upload from a spreadsheet which is much faster than manual entry."}]},
"rep-6":{obj:"Apply a price override on a customer order when the standard price list does not apply.",scn:"Customer ADL1001 has a one-time deal on a flooring item. Override the price on the order without changing the price list.",tasks:[{n:"Create the order and apply the override",s:["Open OIS300 and create a new order for customer ADL1001.","Enter the item and quantity - note the price that defaults from the price list.","On the order line, select Change Price.","Enter the override price, a price override reason code, and save."]},{n:"Confirm and document",s:["Confirm the order total reflects the override price.","Add a note documenting the approval.","Confirm the order - the override applies to this order only."]}],out:["Price override applied to ADL1001 order.","Override reason documented.","Price list unchanged - override is order-specific only."],exc:[{q:"You apply a price override but do not have an authorization code",a:"Do not proceed. Get the override approved and documented before applying it. An override without authorization creates an audit finding."},{q:"The customer asks for the same override on every order",a:"This is a signal to update OIS017 permanently. A recurring override means the standard price is wrong for this customer. Escalate to Tony Shipka."},{q:"You override the price but the override does not appear on the order confirmation",a:"Check that you saved the override on the line, not just on the header. Some override screens require a separate save step."},{q:"A manager asks you to backdate a price override to a prior order",a:"Do not backdate. If an order was invoiced at the wrong price, a credit memo is the correct fix - not a backdated override."}]},

function renderExercise(s){
  var ex=EXERCISES[s.id];
  if(!ex){
    var h='<div class="card"><div class="card-title">Step-by-Step Walkthrough <span class="pill pill-gray">'+s.steps.length+' steps</span></div><div class="step-cards">';
    for(var i=0;i<s.steps.length;i++){var r=s.steps[i];h+='<div class="step-card"><div class="step-num">'+r[0]+'</div><div class="step-body"><div class="step-action">'+r[1]+'</div><div class="step-detail">'+r[2]+'</div></div></div>';}
    return h+'</div></div>';
  }
  var h='<div class="card ex-card">';
  h+='<div class="ex-objective"><div class="ex-label">Objective</div><div class="ex-text">'+ex.obj+'</div></div>';
  h+='<div class="ex-scenario"><div class="ex-label">Scenario</div><div class="ex-text">'+ex.scn+'</div></div>';
  h+='<div class="ex-section-title">Tasks</div>';
  for(var t=0;t<ex.tasks.length;t++){
    var task=ex.tasks[t];
    h+='<div class="ex-task"><div class="ex-task-head"><span class="ex-task-num">'+(t+1)+'</span><span class="ex-task-name">'+task.n+'</span></div><ol class="ex-steps">';
    for(var st=0;st<task.s.length;st++){h+='<li>'+task.s[st]+'</li>';}
    h+='</ol></div>';
  }
  h+='<div class="ex-outcome"><div class="ex-label">Expected Outcome</div><ul class="ex-outcome-list">';
  for(var o=0;o<ex.out.length;o++){h+='<li>'+ex.out[o]+'</li>';}
  h+='</ul></div>';
  if(ex.exc&&ex.exc.length){
    h+='<div class="ex-exceptions"><div class="ex-label">Exception Handling</div><div class="ex-exc-list">';
    for(var e=0;e<ex.exc.length;e++){h+='<div class="ex-exc-item"><div class="ex-exc-q">'+ex.exc[e].q+'</div><div class="ex-exc-a">'+ex.exc[e].a+'</div></div>';}
    h+='</div></div>';
  }
  return h+'</div>';
}

function visibleModules(){if(currentUserData.role==="admin"||currentUserData.modules.includes("all"))return Object.values(MODULES);return currentUserData.modules.filter(id=>id!=="all-readonly").map(id=>MODULES[id]).filter(Boolean);}
function findSession(sid){for(const m of Object.values(MODULES)){const s=m.sessions.find(s=>s.id===sid);if(s)return s;}return null;}
function sessionProgress(sid){const s=findSession(sid);if(!s)return 0;const done=s.checklist.filter((_,i)=>ST[`chk-${sid}-${i}`]).length;return Math.round(done/s.checklist.length*100);}
function moduleProgress(mid){const m=MODULES[mid];if(!m||!m.sessions.length)return 0;const scores=m.sessions.map(s=>ST[`quiz-score-${s.id}`]||0);return Math.round(scores.reduce((a,b)=>a+b,0)/m.sessions.length);}

tle">Resources</div><div class="mod-links">${m.links.map(([l,u])=>`<a class="mod-link" href="${u}" target="_blank" rel="noreferrer">${l}</a>`).join("")}</div></div></div></div>`;el.innerHTML=html;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));el.classList.add("active");}

function submitQuiz(sid){const s=findSession(sid);if(!s)return;const ans=s.quiz.map((_,qi)=>{const sel=document.querySelector(`input[name="qz-${sid}-${qi}"]:checked`);return sel?parseInt(sel.value):-1;});if(ans.includes(-1)){alert("Please answer all questions first.");return;}const cor=ans.filter((a,i)=>a===s.quiz[i].answer).length;const sc=Math.round(cor/s.quiz.length*100);ST[`quiz-score-${sid}`]=sc;ST[`quiz-answers-${sid}`]=JSON.stringify(ans);save();document.getElementById("qw").innerHTML=buildQuiz(s);}

<h3>How to Run a Training Session (Step by Step)</h3>
<ul class="guide-step-list">
<li><div class="guide-step-num">1</div><div><strong>Open the portal together</strong> — have the Super User log in to the portal on their own computer. You log in as admin on yours so you can see their progress.</div></li>
<li><div class="guide-step-num">2</div><div><strong>Navigate to the session</strong> — Super User clicks Modules → opens their module → selects the session. Review the session title and duration together.</div></li>
<li><div class="guide-step-num">3</div><div><strong>Watch the video first</strong> — click Watch Recording. Watch the full CRP video together. Don't skip it — the video shows the exact scenario they need to learn.</div></li>
<li><div class="guide-step-num">4</div><div><strong>Walk through the steps in M3 test</strong> — open M3 test environment side by side. Go through each numbered step on the portal, doing it live in M3. You narrate; they type.</div></li>
<li><div class="guide-step-num">5</div><div><strong>Super User does it solo</strong> — reset or start a new record and have them repeat the workflow start to finish without guidance. Only intervene if they are stuck for more than 60 seconds.</div></li>
<li><div class="guide-step-num">6</div><div><strong>Take the quiz</strong> — have them answer all questions on their own. Do not hint. Submit and review the results together. If they score below 70%, walk through the missed questions and have them retake it.</div></li>
<li><div class="guide-step-num">7</div><div><strong>Complete the checklist</strong> — go through the session checklist together. Check off each item they demonstrated. Items not yet checked = topics to revisit next session.</div></li>
<li><div class="guide-step-num">8</div><div><strong>Add notes</strong> — have the Super User type their key takeaways and any Adleta-specific tips into the My Notes box. These notes will be there when they train their dept.</div></li>
</ul>
<div class="guide-tip"><strong>💡 Tip:</strong> Cover 2–3 sessions per sitting. Back-to-back sessions on related topics (e.g., all 3 AP payment sessions in one afternoon) build context faster than spreading them out.</div>

function switchAdminTab(id,el){document.querySelectorAll(".admin-tab").forEach(t=>t.classList.remove("active"));document.querySelectorAll(".admin-tab-pane").forEach(p=>p.classList.remove("active"));el.classList.add("active");const pane=document.getElementById("atab-"+id);if(pane)pane.classList.add("active");}
function renderTeam(){
  const isAdmin=currentUserData.role==="admin";
  const suMap=Object.entries(USERS).filter(([,u])=>u.superuser===true).map(([un,u])=>({un,name:u.name,dept:u.dept,color:u.color,users:DEPT_USERS[un]||[]}));
  let teamsToShow=isAdmin?suMap:suMap.filter(s=>s.un===currentUser);
  if(!isAdmin&&teamsToShow.length===0){document.getElementById("view-team").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Department Users</div><h2>My Team</h2></div></div><div class="card"><p style="color:var(--muted)">No team roster found for your account. Contact KRISTENB.</p></div>`;return;}
  const title=isAdmin?"All Department Teams":"My Team";
  const eyebrow=isAdmin?"All departments":"Your training group";
  const totalUsers=teamsToShow.reduce((a,s)=>a+s.users.length,0);
  const html=teamsToShow.map(s=>{
    const ini=s.name.split(" ").map(n=>n[0]).join("").substring(0,2);
    const statusColors={trained:"#1a7a6d",inprogress:"#c49a2a","not-started":"var(--muted)"};
    const statusLabels={trained:"✓ Trained",inprogress:"In Progress","not-started":"Not Started"};
    const rows=s.users.map((u,i)=>{const key=`team-status-${s.un}-${u.email}`;const cur=ST[key]||"not-started";const color=statusColors[cur];return`<tr style="background:${i%2===0?"var(--surface2)":"var(--surface)"}"><td style="padding:8px 12px;font-size:13px;font-weight:600">${u.first} ${u.last}</td><td style="padding:8px 12px;font-size:13px;color:var(--body)">${u.title}</td><td style="padding:8px 12px;font-size:12px;color:var(--muted)">${u.email}</td><td style="padding:8px 12px"><select style="font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);color:${color};font-weight:600;cursor:pointer" onchange="saveTeamStatus('${s.un}','${u.email}',this.value,this)"><option value="not-started" ${cur==="not-started"?"selected":""}>Not Started</option><option value="inprogress" ${cur==="inprogress"?"selected":""}>In Progress</option><option value="trained" ${cur==="trained"?"selected":""}>✓ Trained</option></select></td></tr>`;}).join("");
    const trainedCount=s.users.filter(u=>(ST[`team-status-${s.un}-${u.email}`]||"not-started")==="trained").length;
    return`<div class="card" style="margin-bottom:16px"><div class="card-title"><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:${s.color};display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0">${ini}</div><div><div style="font-size:15px;font-weight:700">${s.name}</div><div style="font-size:12px;color:var(--muted);font-weight:400">${s.dept}</div></div></div><div style="display:flex;gap:8px"><span class="pill pill-teal">${trainedCount}/${s.users.length} trained</span></div></div><table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:2px solid var(--line)"><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Name</th><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Job Title</th><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Email</th><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Training Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");
  document.getElementById("view-team").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">${eyebrow}</div><h2>${title}</h2></div><span class="pill pill-teal">${totalUsers} total users</span></div>${html}`;
}
if(!checkAuth())throw new Error("Not authenticated");
buildNav();buildUserPill();renderDashboard();
</script>
