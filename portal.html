const cl=document.getElementById("dcl");if(cl){NEXT_ACTIONS.forEach((text,i)=>{const id=`act-${i}`;const div=document.createElement("label");div.className="check-item";div.innerHTML=`<input type="checkbox" ${ST[id]?"checked":""}><span>${text}</span>`;div.querySelector("input").addEventListener("change",e=>{ST[id]=e.target.checked;save();updDP();});cl.appendChild(div);});updDP();}}
function updDP(){const tot=NEXT_ACTIONS.length;const done=NEXT_ACTIONS.filter((_,i)=>ST[`act-${i}`]).length;const pct=Math.round(done/tot*100);const f=document.getElementById("dpf");const l=document.getElementById("dpl");if(f)f.style.width=pct+"%";if(l)l.textContent=pct+"%";}
function renderModules(){const mods=visibleModules();const el=document.getElementById("view-modules");let html=`<div class="sec-hd"><div><div class="sec-eyebrow">Training library</div><h2>${currentUserData.role==="admin"?"All Modules":"My Training"}</h2></div><input class="search-input" id="msr" type="search" placeholder="Search modules…"></div><div class="mod-grid" id="mgr">`;html+=mods.map(m=>{const pct=moduleProgress(m.id);return`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div><div class="tags">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% complete</div><div class="mod-links">${m.links.map(([l,u])=>`<a class="mod-link" href="${u}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">${l}</a>`).join("")}</div></div>`;}).join("");html+=`</div>`;el.innerHTML=html;document.getElementById("msr").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();const f=!q?mods:mods.filter(m=>[m.name,m.owner,m.weeks,m.summary,...m.programs].join(" ").toLowerCase().includes(q));const g=document.getElementById("mgr");if(!f.length){g.innerHTML='<div class="empty">No modules match.</div>';return;}g.innerHTML=f.map(m=>`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div></div>`).join("");});}
function openModuleDetail(mid){const m=MODULES[mid];if(!m)return;const el=document.getElementById("view-session");let html=`<button class="session-back" onclick="switchView('modules')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back to modules</button><div class="session-meta"><span class="pill ${m.pill}">${m.weeks}</span><span class="pill pill-gray">${m.sessions.length} sessions</span></div><div class="session-title">${m.name}</div><p style="margin-bottom:20px;font-size:14px">${m.summary}</p><div class="tags" style="margin-bottom:20px">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="sec-hd"><div><div class="sec-eyebrow">Sessions</div><h2>Choose a session to begin</h2></div></div><div class="mod-grid">`;html+=m.sessions.map((s,i)=>{const pct=sessionProgress(s.id);const sc=ST[`quiz-score-${s.id}`];const passed=sc>=70;return`<div class="mod-card" onclick="openSession('${m.id}','${s.id}')"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="pill pill-gray">Session ${i+1}</span>${passed?`<span class="pill pill-teal">✓ Passed ${sc}%</span>`:""}</div><h3>${s.title}</h3><div class="mod-owner">${s.duration}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% checklist done</div></div>`;}).join("");html+=`</div>`;el.innerHTML=html;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));el.classList.add("active");}
function openSession(mid,sid){const m=MODULES[mid];const sIdx=m.sessions.findIndex(s=>s.id===sid);const s=m.sessions[sIdx];if(!s)return;const el=document.getElementById("view-session");const sv=ST[`video-${sid}`]||s.videoUrl||"";const cpct=sessionProgress(sid);const prevS=sIdx>0?m.sessions[sIdx-1]:null;const nextS=sIdx<m.sessions.length-1?m.sessions[sIdx+1]:null;const sc=ST[`quiz-score-${sid}`];const passed=sc>=70;let html=`<button class="session-back" onclick="openModuleDetail('${mid}')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back to ${m.name}</button><div class="session-progress-header"><div style="flex:1"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px">${m.name} &rsaquo; Session ${sIdx+1} of ${m.sessions.length}</div><div style="font-size:17px;font-weight:700;color:var(--ink)">${s.title}</div><div style="font-size:12px;color:var(--muted);margin-top:3px">${s.duration}</div></div><div style="text-align:right;min-width:90px"><div style="font-size:20px;font-weight:800;color:${passed?"var(--teal)":"var(--ink)"}">${passed?"✓ Passed":""+cpct+"%"}</div><div style="font-size:11px;color:var(--muted)">${passed?"Quiz passed":"Checklist done"}</div><div class="prog-track" style="margin-top:6px;width:90px"><div class="prog-fill" id="cpill-bar" style="width:${cpct}%"></div></div></div></div><div class="session-body"><div class="session-content">${sv?`<div class="card"><div class="card-title"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:6px;vertical-align:-2px"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>Training Video</div>${buildVideoEmbed(sv)}</div>`:""}<div class="card"><div class="card-title">Step-by-Step Walkthrough <span class="pill pill-gray">${s.steps.length} steps</span></div><div class="step-cards">${s.steps.map(([n,a,d])=>`<div class="step-card"><div class="step-num">${n}</div><div class="step-body"><div class="step-action">${a}</div><div class="step-detail">${d}</div></div></div>`).join("")}</div></div><div class="card"><div class="card-title">Knowledge Check <span class="pill ${passed?"pill-teal":"pill-gray"}">${passed?"Passed "+sc+"%":""+s.quiz.length+" questions"}</span></div><div class="quiz-wrap" id="qw">${buildQuiz(s)}</div></div>${nextS||prevS?`<div class="session-nav">${prevS?`<button class="btn" onclick="openSession('${mid}','${prevS.id}')"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Previous</button>`:""}${nextS?`<button class="btn btn-primary" onclick="openSession('${mid}','${nextS.id}')">Next: ${nextS.title} <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>`:""}</div>`:""}
</div><div class="session-sidebar">${!sv?`<div class="card"><div class="card-title">Training Video</div><div id="va"><div class="video-placeholder">No video added yet.<br><br>Paste a YouTube or SharePoint URL below.</div></div><div class="video-input-wrap"><input class="video-input" id="vui" type="url" placeholder="Paste video URL…" value="${sv}"><button class="btn btn-primary btn-sm" onclick="saveVideo('${sid}')">Add</button></div></div>`:`<div class="card"><div class="card-title">Update Video URL</div><div class="video-input-wrap"><input class="video-input" id="vui" type="url" placeholder="Paste video URL…" value="${sv}"><button class="btn btn-primary btn-sm" onclick="saveVideo('${sid}')">Save</button></div></div>`}<div class="card print-zone"><div class="card-title" style="display:flex;align-items:center;justify-content:space-between">Session Checklist <span class="pill pill-teal" id="cpill">${cpct}%</span><button class="btn btn-sm print-hide" style="font-size:11px;padding:4px 10px" onclick="window.print()"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:4px"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</button></div><div style="font-size:12px;color:var(--muted);margin-bottom:10px">${s.title}</div><div class="check-list">${s.checklist.map((item,i)=>`<label class="check-item"><input type="checkbox" ${ST[`chk-${sid}-${i}`]?"checked":""} onchange="saveCheck('${sid}',${i},this.checked)"><span>${item}</span></label>`).join("")}</div></div><div class="card"><div class="card-title">My Notes</div><textarea class="notes-area" id="notesArea" placeholder="Add tips, shortcuts, or reminders for your team…" oninput="saveNote('${sid}',this.value)">${ST[`note-${sid}`]||""}</textarea><div class="notes-saved" id="notesSaved">Saved ✓</div></div><div class="card"><div class="card-title">Resources</div><div class="mod-links">${m.links.map(([l,u])=>`<a class="mod-link" href="${u}" target="_blank" rel="noreferrer">${l}</a>`).join("")}</div></div></div></div>`;el.innerHTML=html;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));el.classList.add("active");}
function buildVideoEmbed(url){if(!url)return'';const yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);if(yt)return`<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe></div>`;return`<a href="${url}" target="_blank" rel="noreferrer" class="btn btn-primary" style="display:inline-flex;margin-bottom:8px"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:6px"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>Watch Recording</a><div style="font-size:12px;color:var(--muted);margin-top:4px">Opens in SharePoint — sign in with your Adleta account if prompted.</div>`;}
function saveVideo(sid){const url=document.getElementById("vui").value.trim();ST[`video-${sid}`]=url;save();const a=document.getElementById("va");if(a)a.innerHTML=url?buildVideoEmbed(url):'<div class="video-placeholder">No video added.</div>';}
function saveNote(sid,val){ST[`note-${sid}`]=val;save();const el=document.getElementById("notesSaved");if(el){el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",1500);}}
function saveTeamStatus(suName,email,val,sel){ST[`team-status-${suName}-${email}`]=val;save();const colors={trained:"#1a7a6d",inprogress:"#c49a2a","not-started":"var(--muted)"};sel.style.color=colors[val]||"var(--muted)";}
function saveCheck(sid,idx,checked){ST[`chk-${sid}-${idx}`]=checked;save();const pct=sessionProgress(sid);const p=document.getElementById("cpill");if(p)p.textContent=pct+"%";}
function buildQuiz(s){const score=ST[`quiz-score-${s.id}`];const ans=ST[`quiz-answers-${s.id}`];if(score!==undefined&&ans){const a=JSON.parse(ans);let html=s.quiz.map((q,qi)=>{const c=q.answer,ch=a[qi];return`<div class="quiz-q"><div class="quiz-q-text">${qi+1}. ${q.q}</div><div class="quiz-options">${q.options.map((opt,oi)=>`<div class="quiz-option ${oi===c?"correct":oi===ch&&ch!==c?"wrong":""}"><input type="radio" disabled ${oi===ch?"checked":""}><span>${opt}</span>${oi===c?" ✓":""}</div>`).join("")}</div></div>`;}).join("");html+=`<div class="quiz-result ${score>=70?"pass":"fail"}">${score>=70?"✓ Passed":"✗ Not yet passed"} — Score: ${score}%${score<70?`<br><button class="quiz-btn" style="margin-top:10px" onclick="retakeQuiz('${s.id}')">Retake Quiz</button>`:""}</div>`;return html;}return s.quiz.map((q,qi)=>`<div class="quiz-q"><div class="quiz-q-text">${qi+1}. ${q.q}</div><div class="quiz-options">${q.options.map((opt,oi)=>`<label class="quiz-option"><input type="radio" name="qz-${s.id}-${qi}" value="${oi}"><span>${opt}</span></label>`).join("")}</div></div>`).join("")+`<button class="quiz-btn" onclick="submitQuiz('${s.id}')">Submit Quiz</button>`;}
function submitQuiz(sid){const s=findSession(sid);if(!s)return;const ans=s.quiz.map((_,qi)=>{const sel=document.querySelector(`input[name="qz-${sid}-${qi}"]:checked`);return sel?parseInt(sel.value):-1;});if(ans.includes(-1)){alert("Please answer all questions first.");return;}const cor=ans.filter((a,i)=>a===s.quiz[i].answer).length;const sc=Math.round(cor/s.quiz.length*100);ST[`quiz-score-${sid}`]=sc;ST[`quiz-answers-${sid}`]=JSON.stringify(ans);save();document.getElementById("qw").innerHTML=buildQuiz(s);}
function retakeQuiz(sid){delete ST[`quiz-score-${sid}`];delete ST[`quiz-answers-${sid}`];save();const s=findSession(sid);if(s)document.getElementById("qw").innerHTML=buildQuiz(s);}
function renderRoadmap(){document.getElementById("view-roadmap").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">9-week path</div><h2>Roadmap</h2></div></div><div class="timeline">${PHASES.map(p=>`<div class="phase-card"><div class="phase-weeks">${p.weeks}</div><div class="phase-name">${p.name}</div><div class="phase-purpose">${p.purpose}</div><div class="phase-success">✓ ${p.success}</div></div>`).join("")}</div>`;}
function renderSuperUsers(){const us=Object.entries(USERS).filter(([,u])=>u.superuser===true);document.getElementById("view-superusers").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Training cohort</div><h2>Super User Team</h2></div><span class="pill pill-teal">${us.length} confirmed</span></div><div class="su-grid">${us.map(([un,u])=>{const ini=u.name.split(" ").map(n=>n[0]).join("").substring(0,2);const mods=u.modules.filter(m=>m!=="all"&&m!=="all-readonly").map(id=>MODULES[id]?.name||id).join(", ");return`<div class="su-card"><div class="su-av" style="background:${u.color}">${ini}</div><div><div class="su-name">${u.name}</div><div class="su-dept">${u.dept}</div><div class="su-mod">${mods||"All modules"}</div></div></div>`;}).join("")}</div>`;}
function renderResources(){document.getElementById("view-resources").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Source library</div><h2>Training Resources</h2></div></div><div class="res-grid">${RESOURCES.map(r=>`<div class="res-card"><h3>${r.name}</h3><p>${r.summary}</p><a class="res-link" href="${r.url}" target="_blank" rel="noreferrer"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Open file</a></div>`).join("")}</div>`;}
function renderAdmin(){if(currentUserData.role!=="admin"){switchView("dashboard");return;}const rows=Object.entries(USERS).map(([un,u])=>{const mods=u.modules.includes("all")?"All":u.modules.filter(m=>m!=="all-readonly").map(id=>MODULES[id]?.name||id).join(", ");return`<tr><td><span class="status-dot dot-green"></span>${un}</td><td>${u.name}</td><td>${u.dept}</td><td>${u.role==="admin"?"Admin":"Super User"}</td><td style="font-size:11px">${mods}</td></tr>`;}).join("");const prows=Object.entries(USERS).filter(([,u])=>u.superuser===true).map(([un,u])=>{const mm=u.modules.includes("all")?Object.values(MODULES):u.modules.filter(m=>m!=="all-readonly").map(id=>MODULES[id]).filter(Boolean);const ms=mm.flatMap(m=>m.sessions);const ps=ms.filter(s=>(ST[`quiz-score-${s.id}`]||0)>=70).length;const pct=ms.length?Math.round(ps/ms.length*100):0;return`<tr><td>${u.name}</td><td>${u.dept}</td><td>${ps} / ${ms.length}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="prog-track" style="width:80px"><div class="prog-fill" style="width:${pct}%"></div></div><span style="font-size:12px;color:var(--muted)">${pct}%</span></div></td></tr>`;}).join("");document.getElementById("view-admin").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Admin only</div><h2>Admin Panel</h2></div></div><div class="card" style="margin-bottom:16px"><div class="card-title">Downloads</div><div style="display:flex;flex-wrap:wrap;gap:10px"><a class="btn btn-primary" href="Adleta_M3_Department_User_Roster.xlsx" download><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Department User Roster</a></div><p style="font-size:12px;color:var(--muted);margin-top:10px">Roster includes all 87 Adleta employees pre-mapped to their super user. Update Training Status as sessions are completed.</p></div><div class="admin-grid"><div class="card"><div class="card-title">User Accounts</div><table class="user-table"><thead><tr><th>Username</th><th>Name</th><th>Department</th><th>Role</th><th>Modules</th></tr></thead><tbody>${rows}</tbody></table><p style="font-size:12px;color:var(--muted);margin-top:10px">To add/change users, edit the USERS object in portal.html on GitHub.</p></div><div class="card"><div class="card-title">Super User Progress</div><table class="user-table"><thead><tr><th>Name</th><th>Department</th><th>Sessions Passed</th><th>Progress</th></tr></thead><tbody>${prows}</tbody></table></div></div>`;}
function renderTeam(){
  const isAdmin=currentUserData.role==="admin";
  const suMap=Object.entries(USERS).filter(([,u])=>u.superuser===true).map(([un,u])=>({un,name:u.name,dept:u.dept,color:u.color,users:DEPT_USERS[un]||[]}));
  let teamsToShow=isAdmin?suMap:suMap.filter(s=>s.un===currentUser);
  if(!isAdmin&&teamsToShow.length===0){document.getElementById("view-team").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Department Users</div><h2>My Team</h2></div></div><div class="card"><p style="color:var(--muted)">No team roster found for your account. Contact KRISTENB.</p></div>`;return;}
  const title=isAdmin?"All Department Teams":"My Team";
  const eyebrow=isAdmin?"All departments":"Your training group";
  const totalUsers=teamsToShow.reduce((a,s)=>a+s.users.length,0);
  const html=teamsToShow.map(s=>{
    const ini=s.name.split(" ").map(n=>n[0]).join("").substring(0,2);
    const statusColors={trained:"#1a7a6d",inprogress:"#c49a2a","not-started":"var(--muted)"};
    const statusLabels={trained:"✓ Trained",inprogress:"In Progress","not-started":"Not Started"};
    const rows=s.users.map((u,i)=>{const key=`team-status-${s.un}-${u.email}`;const cur=ST[key]||"not-started";const color=statusColors[cur];return`<tr style="background:${i%2===0?"var(--surface2)":"var(--surface)"}"><td style="padding:8px 12px;font-size:13px;font-weight:600">${u.first} ${u.last}</td><td style="padding:8px 12px;font-size:13px;color:var(--body)">${u.title}</td><td style="padding:8px 12px;font-size:12px;color:var(--muted)">${u.email}</td><td style="padding:8px 12px"><select style="font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);color:${color};font-weight:600;cursor:pointer" onchange="saveTeamStatus('${s.un}','${u.email}',this.value,this)"><option value="not-started" ${cur==="not-started"?"selected":""}>Not Started</option><option value="inprogress" ${cur==="inprogress"?"selected":""}>In Progress</option><option value="trained" ${cur==="trained"?"selected":""}>✓ Trained</option></select></td></tr>`;}).join("");
    const trainedCount=s.users.filter(u=>(ST[`team-status-${s.un}-${u.email}`]||"not-started")==="trained").length;
    return`<div class="card" style="margin-bottom:16px"><div class="card-title"><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:${s.color};display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0">${ini}</div><div><div style="font-size:15px;font-weight:700">${s.name}</div><div style="font-size:12px;color:var(--muted);font-weight:400">${s.dept}</div></div></div><div style="display:flex;gap:8px"><span class="pill pill-teal">${trainedCount}/${s.users.length} trained</span></div></div><table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:2px solid var(--line)"><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Name</th><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Job Title</th><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Email</th><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Training Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");
  document.getElementById("view-team").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">${eyebrow}</div><h2>${title}</h2></div><span class="pill pill-teal">${totalUsers} total users</span></div>${html}`;
}
if(!checkAuth())throw new Error("Not authenticated");
buildNav();buildUserPill();renderDashboard();
</script>
