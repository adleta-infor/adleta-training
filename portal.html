[8,"Correct a pricing error before invoicing","If an order was entered with the wrong price and has NOT been invoiced yet, open OIS100, find the order, and change the order status to allow edits. Correct the price on the line, document the change in notes, and re-release. If the order has already been invoiced, a credit memo or new order line at the difference may be needed — contact Philip Jones in accounting."]],quiz:[{q:"When is a price override on an order line appropriate?",options:["Any time a customer asks for a better price","For one-time situations like matching a competitor quote or correcting an error — not for routine use","Whenever the standard price seems too high","Only on will call orders"],answer:1},
{q:"What should you always do after overriding a price on an order?",options:["Email the customer the new price","Add a note to the order explaining why the price was changed and who authorized it","Delete the original price from OIS017","Call the warehouse to hold the order"],answer:1},
{q:"What does M3 do when a price override exceeds your authorization limit?",options:["It applies the override automatically","It sends an email to the customer","It places the order on hold and requires manager approval before it can be released","It cancels the order"],answer:2},
{q:"If you find yourself overriding the same customer and item price every order, what should you do instead?",options:["Keep overriding — it saves time","Update the price permanently in OIS017 so M3 calculates it correctly on every new order","Ask IT to disable the standard price for that item","Apply a blanket discount in the customer master"],answer:1}],checklist:["Understands when a price override is and is not appropriate","Can locate and change the unit price on an OIS100 order line","Knows what to do if the override requires manager authorization","Documents every price override with a reason and authorization in order notes","Can find the price override report in Birst to monitor trends","Knows how to correct a pricing error before and after invoicing"]}
]}

const EXERCISES={
"fnd-1":{obj:"Understand why Adleta is implementing M3 and what your super user role requires.",scn:"You are attending the program kickoff. Review the go-live timeline, identify your module responsibilities, and locate your training resources on the portal.",tasks:[{n:"Review the go-live timeline",s:["Open the portal and navigate to the Roadmap tab.","Locate your module in the 9-week schedule.","Note your week, owner name, and the programs listed for your module."]},{n:"Understand your super user responsibilities",s:["On the Super Users tab, find your name and confirm your department.","Review the three-phase model: Kristen trains you, you get certified, you train your department.","Write down 2-3 team members you will be responsible for training."]},{n:"Locate your training materials",s:["Navigate to your module on the Modules tab.","Open the Guide link and confirm you can access the SharePoint document.","Return to the portal and open Session 1 to review the checklist."]}],out:["You can locate your module and sessions on the portal.","You understand your role as the department trainer after certification.","You have access to your SharePoint learning guide."],exc:[{q:"The portal will not load or shows an error",a:"Clear your browser cache and try again. If the issue continues, notify Kristen - do not share your login with others to work around it."},{q:"You cannot find your name on the Super Users tab",a:"Confirm your username with Kristen. Logins are case-sensitive."},{q:"Your SharePoint guide link shows Access Denied",a:"You need to be added to the SharePoint site. Contact Kristen or IT - do not download and share the file directly."},{q:"A team member asks why they are not on the super user list",a:"Only the designated super users per module are on the list. Redirect them to their department super user for training after certification."}]},
"fnd-2":{obj:"Navigate M3 confidently using the 6 core navigation skills every super user must know.",scn:"You are in the M3 training environment. Practice each navigation skill before your first module session.",tasks:[{n:"Launch M3 and use the program search",s:["Log in to the M3 test environment with your training credentials.","Type PPS200 in the program search bar and press Enter.","Confirm the Purchase Order. Open panel loads."]},{n:"Use function keys and panel navigation",s:["In PPS200, press F1 to access Help and review field descriptions.","Press Escape to go back without saving.","Use the breadcrumb at the top to confirm your location in M3."]},{n:"Sort, filter, and right-click",s:["Open MMS200 (Item. Open) and type A in the Item Number field.","Press Enter to display items beginning with A.","Right-click any row and review the available options (Related, Tools).","Click the column header to sort results ascending, then descending."]},{n:"Open a related program",s:["From MMS200, right-click an item and select Related.","Choose Stock Balance (MMS060) to view inventory for that item.","Confirm the stock balance panel opens without re-entering the item number."]}],out:["You can launch any M3 program by typing its code in the search bar.","You can navigate between panels, sort lists, and right-click to related programs.","You understand the difference between Escape (cancel) and closing a panel."],exc:[{q:"M3 opens but the program search bar is missing",a:"You may be in a different view. Press F5 to refresh or look for the Search icon in the top navigation bar."},{q:"Pressing Enter in a search returns no results",a:"Check for leading spaces or extra characters in the field. M3 searches are exact-match on the characters you type."},{q:"Right-click shows no Related option",a:"The Related option only appears on list panels, not header panels. Make sure you are right-clicking a row in a list, not a field."},{q:"A panel opens read-only and you cannot change anything",a:"Your user role may not have edit access for that program. Note the program name and report it to Kristen or IT."}]},
"fnd-3":{obj:"Map Adleta business terms to their M3 equivalents so you can find the right data in the right place.",scn:"A team member asks where to find a customer account in M3. Practice looking up the key terminology mappings and locating each one in the system.",tasks:[{n:"Look up customers in M3",s:["Open OIS300 (Customer. Open) in M3.","Search for customer number 000382.","Confirm the record shows - this is what Adleta calls a customer account."]},{n:"Look up suppliers/suppliers",s:["Open CRS620 (Supplier. Open) in M3.","Search for supplier ADL-V001.","Note the M3 term is Supplier - Adleta calls this a vendor."]},{n:"Locate a warehouse and item",s:["Open MMS060 (Item. Open) and search for any flooring item.","Right-click and select Stock Balance to view warehouse 100.","Confirm warehouse 100 is the main Adleta facility."]},{n:"Self-quiz the terminology crosswalk",s:["Open the Foundation Learning Guide from the module Resources section.","Find the Terminology Crosswalk table.","Cover the M3 column and name the M3 term for each Adleta term without looking."]}],out:["You can find customers, suppliers, warehouses, and items in M3.","You know the key Adleta-to-M3 term mappings.","You can locate the correct program for any common lookup."],exc:[{q:"You search for 000382 and get no results",a:"Confirm you are in the correct program (OIS300 for customers, CRS620 for suppliers). Customer and supplier numbers live in different programs."},{q:"The M3 term does not match the Adleta term you expected",a:"Use the Terminology Crosswalk in the Foundation Learning Guide as your reference. If something is missing, flag it for Kristen to add."},{q:"A team member uses the wrong program and enters data in the wrong place",a:"Caught early: delete the incorrect entry and re-enter in the correct program. Caught after posting: escalate to the module owner - do not attempt to fix it yourself."},{q:"Warehouse 500 does not appear in stock balance",a:"Warehouse 500 may not carry that item. An empty result is correct - it means no stock, not an error."}]},
"fnd-4":{obj:"Demonstrate all foundation skills without assistance to confirm readiness for module training.",scn:"Kristen will call out tasks one at a time. Complete each one in M3 without referring to notes. This is your certification check for the Foundation module.",tasks:[{n:"Navigation check",s:["Open PPS200 without using the menu - type it in the search bar.","Open MMS200 and sort the item list by description.","Use right-click Related to open stock balance from MMS200."]},{n:"Lookup check",s:["Find supplier ADL-V001 and confirm their payment terms.","Find customer 000382 and confirm their credit limit.","Look up any item and confirm its stock in warehouse 100."]},{n:"Terminology check",s:["State the M3 term for: Purchase Order, Vendor, Warehouse, Item Master, Customer.","State the M3 program for: entering a sales order, receiving goods, viewing stock.","Explain the difference between Escape and closing a panel to the trainer."]}],out:["You passed the Foundation check and are cleared for module training.","You can navigate M3 and locate records without assistance.","Your trainer has signed off on your Foundation readiness checklist."],exc:[{q:"You cannot complete a task during the certification check",a:"Tell Kristen immediately. Do not guess or skip - the certification check is pass/fail and you can reschedule."},{q:"You complete a task but Kristen marks it incorrect",a:"Ask Kristen to walk through the correct steps with you before the next attempt. Take notes."},{q:"M3 is slow or unresponsive during the check",a:"Notify Kristen. The check can be paused and rescheduled - a slow system is not a failure."},{q:"You pass navigation but struggle with terminology",a:"You can be cleared for module training and revisit terminology as needed. Flag the gaps to Kristen so she can reinforce them in module sessions."}]},
"pur-1":{obj:"Open PPS170 and release a planned purchase order generated by MRP into a confirmed PO.",scn:"MRP has generated planned orders for supplier AHF PRODUCTS (S900400) assigned to buyer ABURK. Open PPS170, review the planned order, and release it to a firm PO.",tasks:[{n:"Open PPS170 using the sidebar search",s:["Click the hamburger menu (three lines) on the left side of the M3 toolbar to open the search panel.","Type PPS170 in the search box and click Planned Purchase Order. Open when it appears.","PPS170 opens showing a list sorted by Buyer, Supplier, PO type, and release date."]},{n:"Review the planned orders in the list",s:["The list columns are: Buyer, Supplier, Supplier name, Otp (order type), Rel dt (release date), Plan qty, Net price.","Use the Filter Options to narrow by Fac (facility = CAR) or Stat (status) if needed, then click Apply.","Locate a line for buyer ABURK and supplier S900400 (AHF PRODUCTS).","Review the planned quantity, release date, and order type before releasing."]},{n:"Release the planned order",s:["Right-click the planned order line and review the available options.","Select the release action to convert the planned order to a firm PO.","M3 creates a PO in PPS200 and assigns a PO number (format: 200100xxx)."]},{n:"Verify the new PO in PPS200",s:["Open PPS200 (Purchase Order. Open) using the sidebar search.","Find the new PO - it will show supplier S900400, buyer ABURK, order type B01, and warehouse CAR.","Confirm the status and quantity match what was on the planned order."]}],out:["Planned order released and a new PO appears in PPS200.","PO linked to supplier S900400 (AHF PRODUCTS) with correct item and quantity.","MRP no longer shows the planned order - it is now a firm PO."],exc:[{q:"No planned orders appear in PPS170",a:"PPS170 shows orders for your buyer code. If the list is empty, MRP may not have generated orders yet or the buyer code filter is set to a different buyer. Check with Alan Burk."},{q:"The planned order quantity looks incorrect",a:"Do not release it. Right-click and open the order detail to review the MRP parameters. Flag the issue to Alan Burk before releasing."},{q:"The supplier on the planned order is not the expected supplier",a:"MRP assigns the preferred supplier. Confirm with Alan Burk whether to release as-is or change the supplier before releasing."},{q:"The new PO does not appear in PPS200 after releasing",a:"Allow a minute for M3 to update. If it still does not appear, return to PPS170 to confirm the release completed without an error message."}]},
"pur-2":{obj:"Create a manual non-stock purchase order in PPS200 for a one-time exception item.",scn:"A project needs a non-stocked item that will not go through MRP. Create a manual PO in PPS200 for supplier AHF PRODUCTS (S900400), warehouse CAR.",tasks:[{n:"Open PPS200 and start a new PO",s:["Open PPS200 (Purchase Order. Open) from the sidebar search.","Click the + (New) button in the toolbar to open a new PO header.","Enter Supplier = S900400. M3 auto-fills the supplier name (AHF PRODUCTS) and default payment terms."]},{n:"Enter the PO header details",s:["Confirm Order type = B01 or select the appropriate order type for this purchase.","Set Warehouse = CAR (Carrollton).","Enter the requested delivery date.","Save the header - M3 assigns a PO number in the format 200100xxx."]},{n:"Add the order line",s:["On the order lines panel, enter the item number (e.g., ARM51899031 or the correct item for this purchase).","Enter the quantity and confirm the unit of measure (CT = cartons for most flooring items).","Verify the unit price against the supplier quote - adjust if no price list entry exists.","Save the line."]}],out:["Manual PO created in PPS200 with a system-assigned PO number.","PO linked to supplier S900400, warehouse CAR, order type B01.","Order line shows correct item, quantity, and price - ready for receiving."],exc:[{q:"Supplier S900400 does not appear when you search",a:"Search by the supplier number S900400, not by name. If it still does not appear, the supplier may be inactive - check status in CRS620 (should show 20-Approved)."},{q:"The order type B01 is not available",a:"Contact Alan Burk or IT. The order type must be active and assigned to your user role before it will appear."},{q:"No price pulls from the price list for the item",a:"Enter the agreed price manually and note the source in the PO line reference field. Ask Alan Burk to set up the price list entry so future orders price automatically."},{q:"You save the PO but cannot find it in PPS200 afterward",a:"Filter PPS200 by your buyer code (ABURK) or search by the PO number M3 assigned. Check that you are in company CMP100."}]},
"pur-3":{obj:"Receive goods against a confirmed PO in PPS300 and confirm the receipt details.",scn:"AHF PRODUCTS has delivered cartons of tile against an open PO. Open PPS300, enter the received quantities, and post the receipt.",tasks:[{n:"Open PPS300 and locate the PO",s:["Open PPS300 (Purchase Order. Receive Goods) from the sidebar search.","In the filter area, enter the PO number in the PO number field.","Confirm Warehouse = CAR (Carrollton) is already populated - this defaults to your warehouse.","Click Apply to display the PO lines."]},{n:"Review PO lines before receiving",s:["The list shows columns: Ln (line), Sub, Item number, PO item name, Remain (remaining qty to receive), Recved qty, Com (complete), Location.","Confirm the item number and PO item name match the physical delivery.","Check the Remain column - this is the outstanding quantity not yet received.","Verify the delivery note from AHF PRODUCTS matches the items and quantities shown."]},{n:"Enter received quantity and post",s:["Select the PO line and enter the quantity actually received in the Recved qty field.","Enter the delivery note number from the AHF PRODUCTS packing slip.","If the delivery is complete, confirm the Com (complete) flag.","Post the receipt - M3 updates inventory in warehouse CAR and creates the receipt transaction."]}],out:["Goods receipt posted against the PO in PPS300.","Inventory in warehouse CAR increases by the received quantity.","Receipt transaction created and the PO line Remain quantity decreases."],exc:[{q:"PPS300 shows no lines after entering the PO number",a:"Confirm the PO exists in PPS200 and has a status that allows receiving (not status 90 cancelled). Also confirm the warehouse filter shows CAR."},{q:"The received quantity is less than the PO quantity",a:"Enter only what physically arrived. The Remain quantity stays open for the balance - do not mark the line complete. Follow up with AHF PRODUCTS on the short delivery."},{q:"The item on the delivery does not match the PO item name",a:"Do not receive it. Stop and contact AHF PRODUCTS to confirm what was shipped. If it is the wrong item, reject the delivery."},{q:"PPS300 shows the receipt posted but inventory in CAR did not increase",a:"Allow a few minutes for M3 to update. If inventory still does not reflect the receipt after 5 minutes, contact IT with the receipt transaction number."}]},
"pur-4":{obj:"Create a manual PO in PPS200 for a stocking item when MRP has not generated a planned order.",scn:"A stocking item from AHF PRODUCTS (S900400) is running low and MRP has not reordered. Create a manual PO in PPS200.",tasks:[{n:"Verify the supplier and item in M3 before creating the PO",s:["Open CRS620 (Supplier. Open) and search for S900400.","Confirm the supplier status shows 20-Approved and review payment terms.","Note the buyer assigned to AHF PRODUCTS (ABURK) - this should match Alan Burk."]},{n:"Create the PO header in PPS200",s:["Open PPS200 and click the + (New) button.","Enter Supplier = S900400. Confirm M3 auto-fills AHF PRODUCTS.","Set Order type = B01, Warehouse = CAR, and the required delivery date.","Save the header and note the PO number assigned."]},{n:"Add the stocking item line",s:["On the order lines, look up the item using the item search field.","Enter the quantity needed and confirm unit of measure (CT for cartons).","Verify the price pulls from the AHF PRODUCTS price list.","Save the line and confirm the PO total looks correct."]}],out:["Manual stocking PO created in PPS200 with a system-assigned PO number.","PO linked to S900400 (AHF PRODUCTS), warehouse CAR.","Item and quantity correct - PO ready for receiving when goods arrive."],exc:[{q:"MRP did not generate a planned order for a stocking item",a:"This should be investigated - do not just create manual POs repeatedly. Check the item planning parameters with Alan Burk. Safety stock, lead time, or reorder point may not be configured."},{q:"The item does not appear in the item search on the PO line",a:"Confirm the item status is active in MMS060. An inactive or discontinued item will not appear on PO lines."},{q:"The price on the PO line does not match the current AHF PRODUCTS quote",a:"Enter the correct price manually and note the source. Ask Alan Burk to update the price list in M3 so it pulls correctly next time."},{q:"You create the PO but Alan Burk says it was already ordered",a:"Check PPS200 first before creating manual POs. Search for open POs for supplier S900400 to confirm one does not already exist."}]},
"pur-5":{obj:"Manage an existing PO in PPS200 - cancel a line, add a delivery note, and review PO status.",scn:"An open PO with supplier S900400 (AHF PRODUCTS) needs one line cancelled and a delivery instruction note added.",tasks:[{n:"Find the PO in PPS200",s:["Open PPS200 and search for the PO by PO number or filter by supplier S900400 and buyer ABURK.","Click the PO number to open PPS201 (Purchase Order. Open Lines) and review the line detail.","Identify the line to be cancelled and confirm its current status."]},{n:"Cancel the PO line",s:["In PPS201, right-click the line to be cancelled.","Review the available status change options.","Select the cancel or close action - confirm M3 updates the line status.","Note: A line that already has a receipt posted cannot be cancelled directly."]},{n:"Add a note to the PO",s:["From the PO header, navigate to the Text or Notes option (check Actions or Options menu).","Enter the delivery instruction note (e.g., Deliver to dock B - call ahead on 972-555-0100).","Set the note type as appropriate (internal vs. external - external notes print on the PO).","Save the note and confirm it is linked to the PO."]}],out:["Selected PO line status updated to cancelled.","Delivery note saved and linked to the PO header.","Remaining PO lines are unchanged."],exc:[{q:"M3 will not let you cancel the PO line",a:"The line may already have a receipt posted against it (status 50 or 75). A received line cannot be cancelled directly - contact Philip Jones."},{q:"The note type options are not clear",a:"An Internal note is visible only in M3. An External note prints on the PO confirmation sent to AHF PRODUCTS. Use External for supplier delivery instructions."},{q:"You cancel the wrong line by mistake",a:"If the cancellation can be reversed, do so immediately. If not, you will need to add a new line with the correct item and quantity. Notify Alan Burk."},{q:"The PO shows a status you have not seen before",a:"Check the PPS200 status codes: 20=Approved, 40=Released, 50=Goods Received, 75=Ready for Invoice, 90=Closed. Do not change a status you are unsure about - ask Alan Burk."}]},
"pur-6":{obj:"Look up a supplier record in CRS620 and confirm the key fields used on purchase orders.",scn:"Before creating a PO for a new supplier, verify their record in CRS620. Then confirm the same information pulls correctly to a PO in PPS200.",tasks:[{n:"Open CRS620 and review the supplier record",s:["Open CRS620 (Supplier. Open) from the sidebar search.","The list shows: Supplier number, Supplier name, Telephone no 1, Sts (status), Sgr (supplier group), Sta (state).","Search for supplier S900400 by entering it in the Supplier filter field.","Confirm Sts = 20-Approved. A supplier that is not 20-Approved cannot be used on new POs."]},{n:"Review purchase and financial settings in CRS624",s:["From CRS620, right-click S900400 and navigate to the purchase and financial settings (CRS624).","Confirm the buyer assigned to this supplier (should show ABURK for AHF PRODUCTS).","Review payment terms and any other purchasing defaults.","Note any supplier-specific settings that affect PO creation."]},{n:"Confirm supplier data pulls to a PO",s:["Open PPS200 and click New to start a new PO.","Enter Supplier = S900400 and confirm M3 auto-fills: supplier name (AHF PRODUCTS), payment terms, and buyer (ABURK).","Do not save this test PO - press Escape to cancel without saving.","Confirm the auto-filled values match what you saw in CRS620 and CRS624."]}],out:["Supplier S900400 confirmed as 20-Approved in CRS620.","Buyer ABURK and payment terms confirmed in CRS624.","PO creation auto-fills supplier data correctly from the supplier master."],exc:[{q:"The supplier shows a status other than 20-Approved",a:"Do not create a PO for an inactive or unapproved supplier. Contact Finance (Philip Jones) to reactivate. Do NOT create a new supplier record yourself."},{q:"The buyer assigned in CRS624 is wrong",a:"The buyer on the supplier master controls which buyer sees planned orders in PPS170. Contact Alan Burk to have the buyer assignment corrected in CRS624."},{q:"You need a supplier that is not in CRS620 at all",a:"New suppliers must be set up by Finance before any PO can be created. Provide the supplier name, address, and payment terms to Philip Jones and wait for the setup to be completed."},{q:"The supplier data on the PO does not match what is in CRS620",a:"The PO pulls data at the time of creation. If the supplier master was updated after the PO was created, the PO header may need to be manually corrected."}]},
"pur-7":{obj:"Process a pre-receipt in PPS300 to record an incoming shipment before goods physically arrive.",scn:"AHF PRODUCTS has sent an advance ship notice (ASN) for a shipment in transit. Enter the pre-receipt in PPS300 to log it before physical arrival.",tasks:[{n:"Open PPS300 and locate the PO",s:["Open PPS300 from the sidebar search.","Enter the PO number in the PO number filter field and click Apply.","Confirm Warehouse = CAR and review the lines showing Item number, Remain (qty outstanding), and Recved qty."]},{n:"Enter the pre-receipt",s:["Select the PO line and look for the pre-receipt option in the Actions or Options menu.","Enter the ASN reference number from AHF PRODUCTS.","Enter the quantity on the ASN and the expected arrival date.","Save the pre-receipt record."]},{n:"Verify and understand the pre-receipt",s:["Confirm the pre-receipt appears linked to the PO.","Note that inventory in CAR does NOT update yet - a pre-receipt is a record only.","When goods physically arrive, you must complete the final receipt in PPS300 to update inventory."]}],out:["Pre-receipt recorded against the PO with the AHF PRODUCTS ASN reference.","Inventory in CAR remains unchanged until the final receipt is posted.","The PO shows the inbound shipment in the system."],exc:[{q:"The pre-receipt option does not appear on the PO line",a:"Pre-receipt may not be enabled for this order type or supplier. Check with Alan Burk - not all POs support pre-receipt entry."},{q:"The ASN quantity from AHF PRODUCTS does not match the PO quantity",a:"Enter the ASN quantity as sent. Flag the discrepancy to Alan Burk before the physical receipt - do not assume the PO or ASN is correct without verification."},{q:"Goods arrive before the expected pre-receipt date",a:"Proceed with the final receipt in PPS300 regardless of the pre-receipt date. The pre-receipt date is an estimate only and does not block receiving."},{q:"You post a pre-receipt but forget to do the final receipt",a:"Inventory will not update and AP invoices cannot match. Always follow up the pre-receipt with a final receipt in PPS300 when goods physically arrive at Carrollton."}]},
"pur-8":{obj:"Understand the full purchasing cycle in M3 from planned order to received goods.",scn:"Walk through the complete purchasing cycle for a replenishment order: from MRP planned order in PPS170, to PO in PPS200, to receipt in PPS300.",tasks:[{n:"Trace the cycle: PPS170 to PPS200",s:["Open PPS170 and identify a planned order for buyer ABURK and supplier S900400.","Note the Plan qty, Rel dt (release date), and Otp (order type = B01).","Open PPS200 and find an existing PO for S900400 with buyer ABURK - this is what a released planned order becomes.","Compare the PO status progression: a new PO starts at a low status and advances through 20-Approved, 40-Released, 50-Goods Received, 75-Ready for Invoice."]},{n:"Review a PO in detail",s:["In PPS200, click a PO number to open PPS201 (Purchase Order. Open Lines).","Review the line detail: Line number, Status (Lst), Warehouse (CAR), Item number (e.g., ARM51899031), Order qty, U/M (CT = cartons).","Scroll right to see additional fields - each column represents a key piece of the order."]},{n:"Trace the cycle: PPS200 to PPS300",s:["Open PPS300 and enter a PO number from an order at status 50 (Goods Received) or 75 (Ready for Invoice).","Review the Recved qty column - this shows what has already been received against that PO.","Compare Remain vs. Recved qty - if Remain = 0, the order was fully received.","Note that once a PO reaches status 75-Ready for Invoice, it is ready for AP to match and pay."]}],out:["You can trace a replenishment order from MRP plan to receipt in M3.","You understand the PO status codes: 20-Approved, 40-Released, 50-Goods Received, 75-Ready for Invoice.","You know which program handles each stage: PPS170 (plan), PPS200 (PO), PPS300 (receipt)."],exc:[{q:"A PO is stuck at a status and not advancing",a:"Status does not advance automatically in all cases. Some transitions require an action (e.g., a receipt must be posted to advance to status 50). Identify which step is missing."},{q:"PPS170 shows planned orders but none are releasing to PPS200",a:"Planned orders require a manual release action. They do not auto-release. Alan Burk or the buyer must review and release each one in PPS170."},{q:"A PO shows status 75-Ready for Invoice but AP says there is no receipt",a:"Status 75 means a receipt was posted in PPS300. Pull up the PO in PPS300 and review the Recved qty. Share the receipt details with Philip Jones."},{q:"The PO status in PPS200 does not match what the warehouse says happened",a:"PPS200 status reflects M3 transactions only. If goods were received physically but no receipt was posted in PPS300, the status will not match. The warehouse team must post the receipt in M3."}]},
"inv-1":{obj:"Check the on-hand stock balance for an item in a specific warehouse in M3.",scn:"A customer asks if you have stock of item ARM51830031 (IMPERIAL TEXTURE 1/8 INCH TILE) available in the Carrollton warehouse. Look up the balance in MMS200.",tasks:[{n:"Open MMS200 and filter by warehouse",s:["Open MMS200 (Item. Open Toolbox) from the left sidebar search.","In the Filter Options, set Warehouse = CAR (Carrollton).","In the Item number filter field, type ARM51830031.","Click Apply to filter the list."]},{n:"View the stock balance",s:["ARM51830031 (IMPERIAL TEXTURE 1/8 INCH TILE) appears in the list with item type VCT and status 20.","Right-click the row and select Related > Balance Identity to open MWS068.","MWS068 shows the on-hand balance by location - note Location = CAR1A10 and On-hand approve = 24.","This tells you there are 24 units on hand at location CAR1A10 in the CAR warehouse."]},{n:"Interpret the balance",s:["On-hand approve = 24 means 24 units are approved and available.","The Lot number field shows A1234 - this is the lot the stock is assigned to.","If the quantity is sufficient for the customer order, proceed to enter the order in OIS300.","If stock is low, check Availability All Warehouses (Related > Availability All Warehouses) to see other locations."]}],out:["Stock balance checked in MMS200 for item ARM51830031.","Location CAR1A10 confirmed with 24 units on hand.","Availability confirmed before entering customer order."]},
"inv-2":{obj:"Transfer inventory from one warehouse location to another in M3.",scn:"Stock of item ARM51830031 needs to be moved from location CAR1A10 to another location in the CAR warehouse. Perform the transfer in MMS200.",tasks:[{n:"Open MMS200 and locate the item",s:["Open MMS200 (Item. Open Toolbox) from the left sidebar.","Set Warehouse = CAR and Item number = ARM51830031, then click Apply.","Right-click the ARM51830031 row and select Related > Balance Identity to confirm current location CAR1A10 with 24 on hand."]},{n:"Initiate the warehouse transfer",s:["Right-click the ARM51830031 row in MMS200 and select Related > Stock Transaction History or look for a Move/Transfer option.","Alternatively, open MMS060 (Stock Balance. Open) directly from the sidebar.","In MMS060, filter for item ARM51830031 in warehouse CAR.","Right-click the balance line at location CAR1A10 and look for the Move or Transfer option."]},{n:"Enter transfer details and confirm",s:["Enter the To location (destination location in CAR warehouse).","Enter the quantity to transfer.","Confirm lot number A1234 carries over to the new location.","Submit the transfer - M3 updates the balance at both locations.","Return to MWS068 Balance Identity to verify the stock moved to the new location."]}],out:["Stock transfer initiated for ARM51830031 in CAR warehouse.","Quantity moved from location CAR1A10 to destination location.","Balance confirmed at new location in MWS068."]},
"inv-3":{obj:"Perform a physical inventory count and enter the count result in M3.",scn:"A cycle count is being performed at CAR warehouse, location CAR1A10. The physical count for item ARM51830031 shows 22 units. Enter the count in M3 and review the variance.",tasks:[{n:"Check the current book balance",s:["Open MMS200, set Warehouse = CAR, filter Item number = ARM51830031, click Apply.","Right-click ARM51830031 and select Related > Balance Identity (MWS068).","Confirm current On-hand approve = 24 at location CAR1A10, lot A1234.","Note this as your book quantity before the count."]},{n:"Enter the physical count",s:["Open MMS165 (Physical Inventory. Open) from the left sidebar.","Search for an open count for warehouse CAR, location CAR1A10.","Locate item ARM51830031 in the count list.","Enter the counted quantity = 22.","Save the count entry."]},{n:"Review the variance and approve",s:["M3 calculates the variance: Book = 24, Count = 22, Variance = -2.","Review the variance - a negative variance means the physical count is lower than the book.","If the variance is within tolerance, approve the count.","M3 adjusts the on-hand balance to 22 at location CAR1A10.","Return to MWS068 to confirm the updated balance."]}],out:["Physical count entered in MMS165 for ARM51830031 at CAR1A10.","Variance of -2 reviewed (book 24 vs count 22).","Balance adjusted to 22 after count approval."]},
"inv-4":{obj:"Review item warehouse settings and update replenishment parameters in M3.",scn:"The buyer wants to review and update the reorder point and order quantity for item ARM51830031 in the CAR warehouse. Update the settings in MMS200.",tasks:[{n:"Open the item warehouse record in MMS200",s:["Open MMS200 (Item. Open Toolbox) from the left sidebar.","Set Warehouse = CAR, filter Item number = ARM51830031, click Apply.","Click Change (or double-click) on the ARM51830031 row to open the item/warehouse detail."]},{n:"Review replenishment settings",s:["Navigate to the replenishment or planning panel (look for panel tabs at the bottom).","Review the Reorder point - this is the stock level that triggers a new purchase order.","Review the Order quantity - this is the standard quantity ordered when replenishment triggers.","Note the Safety stock value if populated."]},{n:"Update the parameters and save",s:["Update the Reorder point to the new value provided by the buyer.","Update the Order quantity if required.","Click Next or Save to store the changes.","Confirm the updated values are saved by reopening the record.","The buyer can run a material plan to verify the new parameters take effect in MRP."]}],out:["Item warehouse record opened in MMS200 for ARM51830031 in CAR.","Replenishment parameters (reorder point, order quantity) reviewed.","Updated values saved to the item/warehouse record."]},
"ord-1":{obj:"Enter a standard customer sales order in M3 using order type C01.",scn:"Customer 000382 (AAA EXPRESS WATER AND FIRE RES) calls in an order for 5 CT of item ARM51830031 (IMPERIAL TEXTURE 1/8 INCH TILE). Enter the order.",tasks:[{n:"Open OIS300 and start a new order",s:["Open OIS300 (Customer Order. Open) from the left sidebar search.","Click the + (New) button. OIS100/A opens.","Enter Customer = 000382.","Enter CO type = C01.","Enter Req delivery dt = today's date.","Click Next."]},{n:"Review order defaults (OIS100/I)",s:["Confirm Payment terms = N30 (30 days net).","Confirm Warehouse = CAR (Carrollton).","Confirm Delivery method = OT (Our Truck).","Add your name in Your ref 1 if desired.","Click Next."]},{n:"Enter the order line (OIS101)",s:["In the Item field enter ARM51830031.","Enter Order qty = 5.","Confirm U/M = CT.","Verify Net price populates automatically from price list LP1.","Click Add to save the line.","Note the CO no (order number) assigned by M3."]}],out:["Sales order created in M3 with CO type C01.","Order line entered with correct item, quantity, and price.","CO number noted for follow-up."]},
"ord-2":{obj:"Create a return/credit order in M3 for goods being sent back by a customer.",scn:"Customer 000382 (AAA EXPRESS WATER AND FIRE RES) is returning 2 CT of item ARM51830031 due to damage. Create a return order using CO type C05.",tasks:[{n:"Find the original order in OIS300",s:["Open OIS300 and search for customer 000382.","Locate the original order containing the item being returned.","Note the CO no of the original order."]},{n:"Create the return order",s:["Click + (New) in OIS300. OIS100/A opens.","Enter Customer = 000382.","Enter CO type = C05 (Credit NoStkUpd).","Enter Req delivery dt = today.","Click Next."]},{n:"Enter the return line and confirm",s:["In OIS101, enter Item = ARM51830031.","Enter Order qty = 2 (the quantity being returned).","Confirm U/M = CT.","In Your ref 1 on OIS100/I, enter the original CO no for reference.","Click Add and note the new credit order CO no."]}],out:["Return order created with CO type C05.","Original order referenced on the credit order.","Credit CO number noted."]},
"ord-3":{obj:"Understand what happens when a customer order is stopped due to a credit limit in M3.",scn:"You enter an order for a customer who has exceeded their credit limit. M3 places a CO stop on the order. Learn what the stop looks like and who to contact.",tasks:[{n:"Enter the order",s:["Open OIS300 and click + (New). OIS100/A opens.","Enter Customer = 000382, CO type = C01.","Enter Req delivery dt and click Next.","Add an order line in OIS101 and click Add."]},{n:"Identify the credit stop",s:["Return to OIS100/I (Generic Panel) for the order.","Look at the CO stop field - a value of 3 means Credit limit stop.","A CO stop prevents the order from advancing to picking and shipping.","Do NOT release the stop without authorization from AR."]},{n:"Escalate to AR",s:["Contact the AR team with the customer number, CO no, and order amount.","AR will review the account and either release the stop or ask the customer to pay.","Once released, the CO stop field will clear and the order can proceed.","Add a note in Your ref 1 with the date and who approved the release."]}],out:["Credit stop identified on the order (CO stop = 3).","AR team contacted with order details.","Process for release understood."]},
"ord-4":{obj:"Enter a will call order for a customer picking up at the Carrollton counter.",scn:"Customer 000382 walks in and wants to pick up 3 CT of ARM51830031 today. Enter a will call order in OIS300 using CO type C01.",tasks:[{n:"Create the will call order",s:["Open OIS300 and click + (New). OIS100/A opens.","Enter Customer = 000382.","Enter CO type = C01 (Bravo Normal/WC - WC stands for Will Call).","Enter Req delivery dt = today.","Click Next."]},{n:"Set delivery method to will call (OIS100/I)",s:["On OIS100/I change Delivery method from OT (Our Truck) to WC (Will Call).","Confirm Warehouse = CAR.","Click Next."]},{n:"Enter order line and notify warehouse",s:["In OIS101, enter Item = ARM51830031, Order qty = 3, confirm U/M = CT.","Click Add and note the CO no.","Notify the warehouse team so they can pick and stage the order for customer pickup."]}],out:["Will call order created with CO type C01.","Warehouse notified to pick and stage.","CO number given to customer."]},
"ord-5":{obj:"Enter a customer order where payment terms are different from the account default.",scn:"A customer wants to pay COD or with a credit card instead of their standard net terms. Enter the order and change the payment terms in OIS100/I.",tasks:[{n:"Create the order header",s:["Open OIS300 and click + (New). OIS100/A opens.","Enter Customer number and CO type = C01.","Enter Req delivery dt and click Next."]},{n:"Change payment terms (OIS100/I)",s:["On OIS100/I, locate the Payment terms field (defaults to N30 for most customers).","Click the search icon next to Payment terms to see available terms.","Select the appropriate COD or prepay term.","Note the Payment mtd AR field - confirm it matches the payment method (e.g., credit card, cash).","Click Next."]},{n:"Enter order line and confirm",s:["In OIS101, enter the item, quantity, and confirm U/M.","Click Add.","Note the CO no and communicate the updated payment terms to the customer."]}],out:["Order entered with non-standard payment terms.","Payment method confirmed on the order header.","CO number recorded."]},
"ord-6":{obj:"Process a will call order pickup and verify the order closes correctly in M3.",scn:"A customer arrives to pick up their will call order. Confirm the order is ready, verify status, and understand how the order closes after pickup.",tasks:[{n:"Look up the will call order in OIS300",s:["Open OIS300 and search by customer number or CO no.","Confirm the order status - it should be at 44 (Picking list) or higher before the customer picks up.","Confirm warehouse has the goods staged and ready."]},{n:"Confirm pickup details",s:["Open the order in OIS100 and verify all lines are correct.","Confirm quantity, item, and any special handling notes.","If payment is due at pickup, confirm payment terms and collect payment before releasing goods."]},{n:"Verify order closes after pickup",s:["After warehouse processes the will call pickup, check OIS300 for the order.","Status should advance to 90 (Closed) once all lines are delivered.","Verify the transaction posts correctly in AR."]}],out:["Will call order confirmed ready at status 44+.","Customer pickup processed.","Order closes to status 90 after pickup."]},
"ord-7":{obj:"Create a quotation in M3 and convert it to a confirmed sales order when the customer accepts.",scn:"Customer 000382 requests a price quote for 10 CT of ARM51830031. Create a quotation using CO type C04. When the customer accepts, convert it to a live order.",tasks:[{n:"Create the quotation",s:["Open OIS300 and click + (New). OIS100/A opens.","Enter Customer = 000382.","Enter CO type = C04 (Quotation).","Enter Req delivery dt and click Next.","In OIS101, enter Item = ARM51830031, Order qty = 10, U/M = CT.","Click Add and note the CO no (quote number)."]},{n:"Review the quote with the customer",s:["Locate the quote in OIS300 by filtering CO type = C04.","Review all lines - confirm quantities and pricing are correct.","Communicate the quote details and pricing to the customer."]},{n:"Convert the quote to a sales order",s:["When the customer accepts, open the quote in OIS100.","Go to Actions menu and select the option to copy or convert the order.","Change CO type from C04 to C01 to make it a live order.","Confirm the new order - note the new CO no.","The original C04 quote should be closed or cancelled."]}],out:["Quotation created with CO type C04.","Customer accepted the quote.","Order converted to C01 with a new CO number."]},
"ord-8":{obj:"Process a drop ship order in M3 where goods ship directly from the supplier to the customer.",scn:"Customer 000382 orders an item Adleta does not stock. The order will ship directly from the manufacturer. Enter a drop ship order using CO type C02.",tasks:[{n:"Create the drop ship customer order",s:["Open OIS300 and click + (New). OIS100/A opens.","Enter Customer = 000382.","Enter CO type = C02 (Drop Ship Order).","Enter Req delivery dt and click Next.","On OIS100/I confirm the delivery address is the customer's address.","Click Next."]},{n:"Enter the order line",s:["In OIS101, enter the item number and quantity.","Confirm the supplier for the item - M3 will route to the correct supplier.","Click Add and note the CO no."]},{n:"Confirm and communicate",s:["M3 will create a linked purchase order to the supplier automatically.","Confirm both the sales order CO no and the linked PO number.","When the supplier ships, the PO is received and the customer order closes.","Communicate the expected ship date to customer 000382."]}],out:["Drop ship order created with CO type C02.","Linked supplier PO created automatically by M3.","Customer notified of expected ship date."]},
"fin-1":{obj:"Enter an AP invoice in M3 and match it to the corresponding purchase order receipt.",scn:"An invoice arrives from supplier S900400 (AHF PRODUCTS). Enter the invoice in APS100 and match it to the PO receipt.",tasks:[{n:"Open APS100 and select the FAM function",s:["Open APS100 (Supplier Invoice. Record) from the left sidebar.","A division selection screen appears - select division AAA (Adleta 100/AAA).","Select FAM Function 300 (Approved NMS=3 - PO, D/Note, Suppl O/No) and click Apply.","Click + (New) to enter a new invoice."]},{n:"Enter the invoice header",s:["Enter Supplier = S900400.","Enter the Supplier invoice no from the paper invoice.","Enter Invoice date and the invoice amount.","Confirm Currency = USD.","Click Next."]},{n:"Match to the PO and post",s:["On the invoice line panel, enter the PO number from the invoice (format: 20010XXXXX).","M3 retrieves the receipt lines - confirm quantity and price match the invoice.","If the amounts match, approve the invoice.","If there is a price discrepancy, place the invoice on hold (see fin-4)."]}],out:["AP invoice entered in APS100 against supplier S900400.","Invoice matched to PO receipt.","Invoice approved or placed on hold if discrepancy found."]},
"fin-2":{obj:"Review and update AR settings for a customer including payment terms and credit limit in CRS610.",scn:"Review the AR configuration for customer 000382 (AAA EXPRESS WATER AND FIRE RES) - confirm payment terms, credit limit, and payment method are set correctly.",tasks:[{n:"Open the customer record in CRS610",s:["Open CRS610 (Customer. Open) from the left sidebar.","Search for customer 000382.","Navigate to the Financial Information 1 tab (panel I) at the bottom."]},{n:"Review AR payment settings",s:["Confirm Payment terms = N30 (30 days net).","Confirm Payment mtd AR = CH1 (Chk,allc,no rem).","Note the Credit group field - this controls credit limit checking.","If payment terms need to be changed, click the edit icon and update the Payment terms field."]},{n:"Save and verify",s:["Save any changes to the customer record.","Create a test order for customer 000382 in OIS300 and confirm payment terms default to N30.","Check that the CO stop field on the order is 0-No stop."]}],out:["Customer 000382 AR settings reviewed in CRS610.","Payment terms N30 and payment method CH1 confirmed.","Test order verified with correct defaults."]},
"fin-3":{obj:"Create an AP payment proposal and process a check run for supplier invoices.",scn:"Supplier S900400 (AHF PRODUCTS) has invoices due. Create a payment proposal in APS130 and process the check run.",tasks:[{n:"Open APS130 and create a payment proposal",s:["Open APS130 (Suppl Payment Proposal. Open) from the left sidebar.","Click + (New) to create a new proposal.","Set the payment method and due date range to capture invoices due for S900400.","Run the proposal - M3 selects eligible invoices.","Review the selected invoices and remove any that are on hold or in dispute."]},{n:"Approve and process the check run",s:["Confirm the total payment amount on the proposal.","Approve the proposal.","Run the check print process - M3 generates the checks.","Verify checks printed correctly and note the check numbers."]},{n:"Post the payments",s:["Post the payment proposal - M3 clears the AP invoices and records the payments.","Confirm the invoices no longer appear in open AP.","File the printed checks for mailing."]}],out:["Payment proposal created in APS130 for supplier S900400.","Check run processed and checks printed.","AP invoices cleared after posting."]},
"fin-4":{obj:"Place an AP invoice on hold to prevent it from being included in payment runs.",scn:"An invoice from supplier S900400 has a price discrepancy. Hold the invoice in APS450 so it is excluded from payment proposals until resolved.",tasks:[{n:"Find the invoice in APS450",s:["Open APS450 (Supplier Invoice Batch. Open) from the left sidebar.","Set Division = AAA and click Apply.","Search for invoices from supplier S900400.","Locate the invoice with the price discrepancy."]},{n:"Place the invoice on hold",s:["Right-click the invoice and look for a Hold or Change Status option.","Enter a hold reason - example: Price mismatch, PO $2.50 vs Invoice $2.75.","Save the hold status.","Confirm the invoice is excluded from the next payment proposal in APS130."]},{n:"Notify and resolve",s:["Contact supplier S900400 to resolve the price discrepancy.","Once resolved, return to APS450 and release the hold.","The invoice will be included in the next payment proposal run."]}],out:["Invoice from S900400 placed on hold in APS450.","Hold reason documented.","Invoice excluded from payment runs until resolved."]},
"fin-5":{obj:"Create a wire transfer payment proposal for a supplier requiring electronic payment.",scn:"A supplier requires payment by wire transfer instead of check. Create the payment proposal in APS130 and process the wire.",tasks:[{n:"Create the wire payment proposal in APS130",s:["Open APS130 (Suppl Payment Proposal. Open) from the left sidebar.","Click + (New) to create a new proposal.","Set Payment method = WID (wire transfer) instead of CH1.","Select invoices for the supplier due for payment and run the proposal.","Confirm bank account details for the supplier and verify the total wire amount."]},{n:"Approve and submit the wire",s:["Review and approve the wire proposal.","Submit the wire file to the bank through your banking portal.","Note the wire reference number from the bank."]},{n:"Post the wire payment",s:["Post the payment proposal in APS130 - M3 clears the AP invoices.","Confirm the invoices no longer appear in open AP.","Record the bank wire reference number in M3 for audit purposes."]}],out:["Wire transfer proposal created in APS130 with payment method WID.","Wire submitted to bank.","AP invoices cleared after posting."]},
"fin-6":{obj:"Void an AP check that was issued in error or cannot be mailed.",scn:"A check printed to a supplier was damaged and cannot be mailed. Void the check in M3 and reopen the invoices for re-payment.",tasks:[{n:"Locate the check in APS130",s:["Open APS130 (Suppl Payment Proposal. Open) from the left sidebar.","Search for the payment proposal that generated the check.","Locate the specific check by supplier name or check number.","Confirm the check has not already been cashed."]},{n:"Void the check",s:["Select the check and look for the Void option under Actions or right-click menu.","Enter the void reason (example: Check damaged - reissue required).","Enter the void date.","M3 reopens the associated invoices back to open AP status."]},{n:"Verify and re-queue for payment",s:["Confirm the invoices are back in open AP in APS450.","Confirm the voided check is no longer in open payments.","Create a new payment proposal in APS130 to reissue the payment."]}],out:["Check voided in APS130.","Associated invoices reopened to open AP.","New payment proposal created to reissue the check."]},
"fin-7":{obj:"Understand the daily AP payment and AR cash application process in M3.",scn:"Learn the end-to-end flow: AP invoices are entered and batched, payment proposals are created in APS130, and customer payments are applied to open AR invoices.",tasks:[{n:"AP daily process - invoice batching",s:["AP invoices are entered in APS100 (division AAA, function 300) throughout the day.","Batches are reviewed and approved in APS450 (Supplier Invoice Batch. Open).","Invoices on hold or with discrepancies are resolved before the payment run.","Payment proposals are created in APS130 for invoices due."]},{n:"AR daily process - cash application",s:["Customer payments arrive by check, wire, or ACH.","Payments are applied to open AR invoices in M3 using the appropriate AR cash application program.","Unapplied payments are researched and matched to the correct customer and invoice.","Confirm open AR is updated and customer balances are current."]},{n:"End of day verification",s:["Confirm all AP batches for the day are posted.","Confirm all customer payments received are applied in AR.","Run a quick AR aging report to verify no unexpected balances.","Flag any items that need follow-up to the AR or AP team."]}],out:["AP daily batch process understood (APS100 -> APS450 -> APS130).","AR cash application process understood.","End of day verification steps completed."]},
"gl-1":{obj:"Enter a manual journal entry in M3 using the GL Journal Voucher program.",scn:"An accrual entry needs to be posted for the current period. Enter a manual journal voucher in GLS100 for Division AAA using FAM function 201 (USD Multi Function Entry).",tasks:[{n:"Open GLS100 and select the FAM function",s:["Open GLS100 (Journal Voucher. Enter) from the left sidebar.","The Select FAM Function screen appears - confirm Division = AAA.","Select FAM function 201 (USD Multi Function Entry, voucher name GL01201).","Click Apply or double-click 201 to open the journal entry form."]},{n:"Enter the journal voucher header",s:["A new voucher header opens with Division AAA pre-filled.","Enter the Accounting date (the period the entry should post to).","Enter a Voucher text describing the purpose of the entry (e.g., Monthly accrual - [description]).","The voucher number is assigned automatically by M3."]},{n:"Enter the debit and credit lines",s:["On the journal lines panel, enter the first account number and debit amount.","Enter the offsetting account number and credit amount.","Confirm debit total equals credit total - M3 will not allow an unbalanced voucher.","Click Save or Next to post the journal entry.","Note the voucher number assigned - use GLS200 (Voucher. Display) to confirm it posted."]}],out:["Manual journal entry posted in GLS100 for Division AAA.","FAM function 201 (USD Multi Function Entry) used.","Voucher confirmed in GLS200 after posting."]},
"gl-2":{obj:"Reverse a GL journal voucher that was posted in error.",scn:"A journal entry was posted to the wrong accounting period or account. Reverse the original voucher in GLS100 using FAM function 101 (Autoreverse Voucher) or use Voucher. Reverse from the GL menu.",tasks:[{n:"Find the incorrect voucher in GLS200",s:["Open GLS200 (Voucher. Display) from the left sidebar.","Set Division = AAA and click Apply.","Filter by Voucher number or Accounting date to locate the incorrect entry.","Click the voucher to review the lines and confirm it is the entry to be reversed."]},{n:"Reverse the voucher",s:["From GLS200, right-click the voucher and look for a Reverse option.","Alternatively, open GLS100, select FAM function 101 (Autoreverse Voucher).","Enter the original voucher number to reverse.","Enter the reversal date - typically the first day of the next period.","M3 creates a new voucher with all debit and credit lines swapped."]},{n:"Verify the reversal posted",s:["Return to GLS200 and search for the reversal voucher.","Confirm the reversal voucher has the same amounts as the original but opposite signs.","If a correcting entry is also needed, enter it in GLS100 with FAM 201 (USD Multi Function Entry).","Confirm the net effect on the affected accounts is correct."]}],out:["Incorrect voucher located in GLS200.","Reversal voucher posted using FAM 101 or Voucher. Reverse.","Correcting entry posted if required."]},
"gl-3":{obj:"Display GL account balances and review period activity for a GL account.",scn:"The controller asks you to pull the current period balance and activity for a GL account. Use GLS215 (GL Balance File. Display) to review the account.",tasks:[{n:"Open GLS215 and set filters",s:["Open GLS215 (GL Balance File. Display) from the left sidebar (search 'GL Balance File').","Set Period = current period (format YYMM, e.g., 2606 for June 2026).","Set Division = AAA.","Set the Account From and To range for the account you want to review.","Click Apply."]},{n:"Review the account balance",s:["GLS215 shows each account with Actual Period, Budget Period, and Variance columns.","The Actual Period column shows the net activity posted to the account in the current period.","To see individual transactions behind the balance, right-click the account row and select Related > Voucher lines or Transaction detail.","Review the voucher lines to identify what transactions make up the balance."]},{n:"Investigate discrepancies",s:["If the balance does not match expectations, drill into the voucher lines.","Note the voucher numbers and accounting dates of any unexpected entries.","Use GLS200 (Voucher. Display) to pull up the full voucher detail for any questionable entry.","Escalate any unrecognized entries to the controller or accounting team."]}],out:["GL account balance reviewed in GLS215 for Division AAA.","Period activity confirmed.","Voucher detail drilled into via GLS200 for any discrepancies."]},
"gl-4":{obj:"Process a period close checklist step - confirm all AP batches and GL journals are posted before close.",scn:"It is month-end. Walk through the key M3 steps to confirm AP invoices are posted, GL journals are complete, and the period is ready to close in GLS910.",tasks:[{n:"Confirm AP invoices are posted",s:["Open APS450 (Supplier Invoice Batch. Open), set Division = AAA, click Apply.","Confirm no invoices remain in an unposted or error status.","Open APS130 (Suppl Payment Proposal. Open) and confirm all payment proposals for the period are finalized.","If any invoices need to post before close, process them now."]},{n:"Confirm GL journals are complete",s:["Open GLS100 (Journal Voucher. Enter), Division AAA.","Check for any saved but unposted journal vouchers.","Open GLS200 (Voucher. Display), set Division = AAA, filter to current period, click Apply.","Review the list to confirm all expected accrual and adjusting entries are present."]},{n:"Run the period close in GLS910",s:["Open GLS910 (Year/Period. Close) from the left sidebar.","Set Division = AAA and the period to close.","Review any warnings M3 displays before closing.","Confirm the close - once closed, no additional entries can be posted to that period without reopening.","Notify the controller that the period is closed."]}],out:["AP invoices confirmed posted before close.","GL journals reviewed and complete in GLS200.","Period closed in GLS910 for Division AAA."]},
"gl-5":{obj:"Run a GL financial report in M3 to review the income statement or balance sheet.",scn:"The controller needs a quick income statement for the current period. Run the GL financial report in GLS990 for Division AAA.",tasks:[{n:"Open GLS990 and set report parameters",s:["Open GLS990 (Financial Report. Create) from the left sidebar.","Set Division = AAA.","Set the Period range to the current period.","Select the report layout for the income statement (the controller or GL admin can tell you which layout to use).","Click Apply or Run."]},{n:"Review the report output",s:["GLS990 generates the financial report showing revenue, cost, and expense account balances.","Review the totals for each section - Revenue, Cost of Goods Sold, Operating Expenses.","Compare actual amounts to budget if the report includes a budget column.","Note any accounts with unexpected balances or large variances to budget."]},{n:"Export or print the report",s:["Use the Tools menu or print icon to export the report to Excel or PDF.","Share the report with the controller or finance team.","If an account balance needs investigation, use GLS215 (GL Balance File. Display) to drill into the detail.","Document any variances or items requiring follow-up before the next leadership review."]}],out:["Financial report run in GLS990 for Division AAA.","Income statement reviewed for current period.","Variances identified and escalated as needed."]},
"log-1":{obj:"Locate a delivery in MWS410 and review the pick list status for a customer order.",scn:"A customer order for consignee 007822 is ready for picking in the CAR warehouse. Open MWS410 to find the delivery and review its status.",tasks:[{n:"Open MWS410 and filter for the delivery",s:["Open MWS410 (Delivery. Open Toolbox) from the left sidebar.","Set Warehouse = CAR (Carrollton) and click Apply.","The list shows deliveries with columns: Dely no, Consignee, Dmt (Delivery method), Order no, and status.","Locate the delivery for consignee 007822 - note the Delivery number and status (e.g., 1-Picking List Generated)."]},{n:"Review the delivery detail",s:["Click the Delivery number link to open the delivery detail.","Review the delivery lines - confirm item, quantity, and warehouse location.","Note the Delivery method (Dmt) field - OT means Our Truck, WC means Will Call.","If status is 1-Picking List Generated, the pick list has been printed and picking is in progress."]},{n:"Confirm pick status in MWS420",s:["Open MWS420 (Picking List. Report) from the left sidebar.","Set Warehouse = CAR, Pick sts = 40-Picking, and click Apply.","Locate the delivery in the list - confirm it shows the correct print date (Prt dt) and pick time.","Once warehouse confirms picking is complete, the delivery status will advance to the next step."]}],out:["Delivery located in MWS410 for warehouse CAR.","Pick list status confirmed in MWS420.","Delivery detail reviewed with correct items and quantities."]},
"log-2":{obj:"Process a customer order shipment from pick list to delivery confirmation in M3.",scn:"An OT (Our Truck) delivery for consignee 007822 has been picked. Confirm the delivery in MWS410 to advance the order to shipped status.",tasks:[{n:"Verify the order and delivery in OIS300",s:["Open OIS300 (Customer Order. Open) and search for the order number (e.g., 1000000002).","Confirm the order status - it should be at status 44 (Picking list printed) or higher.","Verify the delivery address, carrier (Dmt = OT for Our Truck), and requested delivery date.","Confirm all order lines are included and quantities match what was ordered."]},{n:"Confirm the delivery in MWS410",s:["Open MWS410 (Delivery. Open Toolbox), set Warehouse = CAR, click Apply.","Locate the delivery for order 1000000002.","Right-click the delivery and look for a Confirm or Report option.","Enter the actual shipped quantity if different from the ordered quantity.","Confirm the delivery - M3 advances the order to shipped status."]},{n:"Verify the order closes in OIS300",s:["Return to OIS300 and look up the order.","Confirm the order status has advanced to 70 (Delivered) or higher.","The invoice will be generated automatically based on the delivery confirmation.","Verify the consignee 007822 account shows the new invoice in AR."]}],out:["Order status verified in OIS300 before shipment.","Delivery confirmed in MWS410 for warehouse CAR.","Order advanced to delivered status after confirmation."]},
"log-3":{obj:"Print and review a pick list report in MWS420 for the CAR warehouse.",scn:"The warehouse team needs the pick list for today's deliveries. Run MWS420 to print or display the picking list for CAR warehouse.",tasks:[{n:"Open MWS420 and set filters",s:["Open MWS420 (Picking List. Report) from the left sidebar.","Set Warehouse = CAR.","Set Pick sts = 40-Picking to show orders actively being picked.","Set Rep date = today's date.","Click Apply - the list shows all deliveries with their delivery number, size (Sz), print date (Prt dt), and print time (Prt t)."]},{n:"Review the pick list",s:["The list shows columns: Dely no (delivery number), Sfx, Sz (size/carton count), Prt dt (print date), Prt t (print time), Pck t (pick time), Picker.","Confirm the deliveries that need to go out today are listed.","If a delivery is missing from the list, return to MWS410 and verify the delivery status.","Click a delivery number to drill into the individual pick lines for that delivery."]},{n:"Assign pickers and track progress",s:["Use the Picker field to assign a warehouse employee to a delivery if required.","Once items are picked, the warehouse team enters the pick time (Pck t) to confirm completion.","Deliveries with a pick time confirmed are ready for loading and shipment.","Return to MWS410 to process the delivery confirmation once all lines are picked."]}],out:["Pick list report run in MWS420 for CAR warehouse.","Deliveries at pick status 40 reviewed.","Pick assignments tracked and confirmed."]},
"log-4":{obj:"Look up shipment and delivery information using OIS600 for a customer order.",scn:"A customer calls asking about delivery status for their order. Use OIS600 to look up the delivery and shipment details.",tasks:[{n:"Open OIS600 and search for the delivery",s:["Open OIS600 (Delivery. Open) from the left sidebar.","Filter by customer (consignee) number or order number to locate the delivery.","Set Warehouse = CAR if searching for Carrollton shipments.","Click Apply to see the matching deliveries."]},{n:"Review delivery status and details",s:["OIS600 shows the delivery status, ship date, carrier (Dmt), and tracking information.","Click the delivery to open the detail view and review individual lines.","Confirm the shipped quantity and the actual delivery date.","If the delivery shows OT (Our Truck), contact the driver or dispatch for an ETA."]},{n:"Communicate status to the customer",s:["Note the delivery number and expected delivery date to share with the customer.","If the delivery is confirmed (status 70+), advise the customer the order has shipped.","If the delivery is still in picking (status 40-50), advise the customer of the expected ship date.","Document the customer contact in the order's Your ref 1 field in OIS300 if needed."]}],out:["Delivery status looked up in OIS600.","Shipped quantity and date confirmed.","Customer advised of delivery status."]},
"log-5":{obj:"Understand the full logistics flow from order entry to delivery confirmation in M3.",scn:"Walk through the end-to-end logistics process: order in OIS300, pick list in MWS410/MWS420, delivery confirmation, and how it connects to invoicing.",tasks:[{n:"Order entry and release (OIS300)",s:["A customer order is entered in OIS300 (Customer Order. Open).","Once the order is saved and released, M3 creates a delivery record automatically in MWS410.","The order status advances from 11 (New) through to 44 (Picking list) as the logistics steps are completed.","The delivery method (Dmt) on the order determines how it is handled - OT = Our Truck, WC = Will Call."]},{n:"Pick list and picking (MWS410 and MWS420)",s:["Open MWS410 (Delivery. Open Toolbox) to see the delivery created for the order.","The pick list is printed or displayed using MWS420 (Picking List. Report) - filter Warehouse = CAR, Pick sts = 40-Picking.","Warehouse staff pick the items from location CAR1A10 (or the assigned location) and confirm quantities.","Once picking is complete, the pick time is recorded and the delivery is ready to confirm."]},{n:"Delivery confirmation and invoicing",s:["Return to MWS410 and confirm the delivery - M3 advances the order to status 70 (Delivered).","Use OIS600 (Delivery. Open) to verify the delivery status and ship date after confirmation.","M3 automatically generates the customer invoice based on the confirmed delivery.","The invoice appears in AR for consignee 007822 and the order closes to status 90."]}],out:["Full logistics flow understood: OIS300 > MWS410 > MWS420 > OIS600.","Order status progression from 11 to 90 confirmed.","Delivery confirmation triggers automatic invoicing in AR."]},
"prd-1":{obj:"Discontinue an item in M3 by updating its status and reviewing remaining inventory.",scn:"A flooring style is being discontinued. Update the item status in MMS001 and review remaining stock in the CAR warehouse before the item is phased out.",tasks:[{n:"Find the item and update status in MMS001",s:["Open MMS001 (Item. Open) from the left sidebar.","In the Item number filter, type the item number to discontinue and click Apply.","Click Change (or right-click > Change) on the item row to open the edit screen.","On the Basic Information panel, change Item status from 20-Released to 90-Discontinued (or the appropriate phase-out status).","Save the change."]},{n:"Review remaining inventory in MMS200",s:["Open MMS200 (Item. Open Toolbox), set Warehouse = CAR, enter the item number, click Apply.","Right-click the item and select Related > Balance Identity (MWS068) to see on-hand quantity.","If stock remains, coordinate with purchasing to cancel any open purchase orders for this item.","Notify the sales team so no new customer orders are placed for the discontinued item."]},{n:"Confirm item is no longer orderable",s:["Return to MMS001 and confirm the item status is updated.","Attempt to add the item to a test order in OIS300 - M3 should warn or block the item based on its status.","If the item appears on any active open orders, review those orders with the sales team.","Document the discontinuation date and notify the product manager (Lauren Calvey)."]}],out:["Item status updated to discontinued in MMS001.","Remaining inventory reviewed in MMS200/MWS068 for CAR warehouse.","Sales and purchasing teams notified of discontinuation."]},
"prd-2":{obj:"Review an item record in MMS001 and update the customer price list in OIS010.",scn:"A product manager needs to review the item master for a VCT tile and confirm its pricing in OIS010 for customer 000382 (AAA EXPRESS WATER AND FIRE RES).",tasks:[{n:"Review the item in MMS001",s:["Open MMS001 (Item. Open) from the left sidebar.","Filter by Item type = VCT (Vinyl Composition Tile) and Status = 20-Released, then click Apply.","Locate item ARM51830031 (IMPERIAL TEXTURE 1/8 INCH TILE) in the list.","Click Change to open the item and review: Description, Item type (VCT), U/M (CT), Item mgr (MPARSONS), and P grp (AHC).","Confirm Status = 20-Released and the item is active."]},{n:"Review the price list in OIS010",s:["Open OIS010 (Price List. Open) from the left sidebar.","Search for the price list that applies to customer 000382 - this is typically LP1.","Filter for item ARM51830031 to see the current price.","Review the price, effective date, and currency (USD).","If the price needs to be updated, click Change and enter the new price and effective date."]},{n:"Verify pricing on a test order",s:["Open OIS300 and create a test order for customer 000382 with item ARM51830031.","Confirm the Net price field on OIS101 populates automatically from price list LP1.","Verify the price matches what was set in OIS010.","Cancel the test order - do not submit it."]}],out:["Item ARM51830031 reviewed in MMS001 - status 20-Released, type VCT.","Price confirmed in OIS010 for price list LP1.","Price verified on test order in OIS300 for customer 000382."]},
"prd-3":{obj:"Complete all master data steps in M3 to set up a new product for purchasing and sales.",scn:"A new flooring product is being added to the Adleta catalog. Set up the item master in MMS001, assign it to the CAR warehouse in MMS002, and add it to the price list in OIS010.",tasks:[{n:"Create the item master in MMS001",s:["Open MMS001 (Item. Open) and click + (New) to create a new item.","Enter the Item number (follow Adleta naming convention, e.g., manufacturer prefix + style code).","Enter the item Name and Description 2 (full product description).","Set Item type = VCT (or RES for residential, depending on the product category).","Set U/M = CT (carton) or LF (linear foot) as appropriate.","Set Status = 20-Released and assign Item mgr = MPARSONS (or the responsible product manager).","Set P grp (Product group) = AHC (or appropriate group) and save."]},{n:"Assign the item to the CAR warehouse in MMS002",s:["Open MMS002 (Item. Connect Warehouse) from the left sidebar.","Enter the new item number and Warehouse = CAR.","Set the reorder point, order quantity, and lead time based on purchasing input.","Set Lot control = 3-In lot master if the item is lot-tracked.","Save the item/warehouse record - the item is now available for ordering in the CAR warehouse."]},{n:"Add the item to the price list in OIS010 and test",s:["Open OIS010 (Price List. Open) and locate price list LP1.","Click + (New) to add a line for the new item.","Enter the item number, sales price, and effective date.","Save the price list entry.","Create a test order in OIS300 for customer 000382 - add the new item and confirm the price defaults from LP1.","Cancel the test order after verifying pricing."]}],out:["New item created in MMS001 with correct type, U/M, and status 20-Released.","Item connected to CAR warehouse in MMS002 with replenishment parameters.","Item added to price list LP1 in OIS010 and verified on test order."]},
"rep-1":{obj:"Navigate to Infor M3 Analytics (Birst) and explore the Sales collection dashboards.",scn:"Jeanell needs to check the open order book for the week. Open Birst from the M3 toolbar, navigate to the Sales collection, and review the Open Customer Order Book dashboard.",tasks:[{n:"Open Birst from the M3 toolbar",s:["In M3, look at the top navigation bar - you will see tabs: Rhythm Commerce Business Center, Rhythm Portal, Infor M3, and Birst.","Click the Birst tab. Infor M3 Analytics for M3 Cloud opens (version 2025.10.00).","The landing page shows admin options and a Spaces list. You will work in the M3ADIS-Consumer space.","Click into the M3ADIS-Consumer space if it does not open automatically."]},{n:"Navigate to the Sales collection",s:["Click the hamburger menu (three lines) on the upper left to open the Collections panel.","The Collections list shows: Home, Admin, Sales, Procurement, Finance, Production, Rental, Equipment, Warehouse, C-Suite.","Click Sales. The first dashboard that opens is Open Customer Order Book.","Note the breadcrumb at the top: Sales / Open Customer Order Book."]},{n:"Review the Open Customer Order Book dashboard",s:["The filter chips at the top show: = 100 - CMP100 (company/division), = Open Orders, = Week, = [current week number], = 2026.","Review the KPI tiles on the left: Overdue Line Amt, Line Amt, Order Value, No. of Stopped Order Lines, Order Qty.","The charts on the right show Overdue Stock Analysis and Stop Code Analysis by week.","To change the week, click the week number filter chip and select a different period.","To see all Sales dashboards, click the dropdown arrow next to Open Customer Order Book in the breadcrumb - there are 17 Sales dashboards total."]}],out:["Birst opens from the M3 toolbar - no separate login needed.","Sales collection shows 17 dashboards including Open Customer Order Book.","Open Customer Order Book shows current week open orders, overdue amounts, and stopped order lines."],exc:[{q:"The Birst tab is not visible in the M3 toolbar",a:"The Birst tab appears next to the Infor M3 tab in the top navigation bar. If it is not there, try refreshing M3 or contact IT - your user account may not have Birst access yet."},{q:"Birst opens but shows no data for the current week",a:"Birst data loads daily at approximately 6:02 AM. If today's ETL has not run yet, data will reflect yesterday. Check Admin > Incremental Load Logs to confirm the last successful load date."},{q:"The dashboard shows data but the numbers look unusually high or low",a:"Check the Company filter - it should show 100 - CMP100. If it is blank or set to a different company, the numbers will be wrong. Click the filter chip and set it to 100."},{q:"You cannot find the Sales collection",a:"Click the hamburger menu on the upper left. If it is already open and you do not see Sales, scroll down in the Collections panel - it appears after Admin."}]},
"rep-2":{obj:"Use the Sales Manager - Margin dashboard in Birst to review gross margin performance.",scn:"Jeanell needs to review margin performance by product and customer for the current year. Open the Sales Manager - Margin dashboard and identify any margin concerns.",tasks:[{n:"Open the Sales Manager - Margin dashboard",s:["In Birst with the Sales collection open, click the dropdown arrow next to the current dashboard name in the breadcrumb.","Select Sales Manager - Margin from the list.","The dashboard header shows: Sales Manager - Margin | Currency: USD | Year: 2026."]},{n:"Review the KPI tiles and charts",s:["The four KPI tiles across the top show: Gross Margin % FY, Invcd Net Amt, Gross Profit $, COGS Standard.","Gross Margin % FY is the primary metric - this is your year-to-date margin percentage.","Below the tiles are charts: Sales Margin by Period (trend over time), Pct of Total by Product, Pct of Total by Customer, Invcd Amt Breakdown of Top Gross Profit 2, and Top Sales Margin.","Sales Margin by Period shows how margin has trended week by week or month by month."]},{n:"Filter and drill into margin details",s:["The filter chips show: = 100 - CMP100, = Invcd Net Amt, = [period], = 2026.","To change from weekly to monthly view, click the period filter chip (Week/Month) and switch to Month.","To drill into a specific product line, click Drill Across on the Pct of Total by Product chart.","Note any products or customers showing lower-than-expected margin for follow-up."]}],out:["Gross Margin % FY, Invcd Net Amt, Gross Profit $, and COGS Standard reviewed.","Sales Margin by Period chart shows margin trend across the year.","Product and customer margin breakdowns visible for drill-down."],exc:[{q:"All KPI tiles show 0 or No data was returned",a:"The filter period may have no invoiced data. Change the period filter from Week to Month, or change the year. In the test environment, data may only exist for certain periods."},{q:"Gross Margin % FY seems much lower than expected",a:"Confirm the filter is set to Invcd Net Amt (invoiced amount) and not a different measure. Also confirm the company filter = 100 - CMP100. If both are correct, bring the number to Tony Shipka before taking action."},{q:"You want to export the margin data to Excel",a:"Use the export icon in the dashboard toolbar (the share/upload icon). Select the export format. If the export is blocked by a popup blocker, allow popups for the Birst URL and try again."},{q:"A product line is missing from the Pct of Total by Product chart",a:"The chart may only show top N products. Use the Sales Analysis Ad Hoc dashboard or drill across to see the full product list including items with small volumes."}]},
"rep-3":{obj:"Use the Customer Profitability Analysis dashboard in Birst to review revenue and margin by customer.",scn:"Jeanell needs to identify which customers are driving the most profit this year. Open Customer Profitability Analysis and review the top customers.",tasks:[{n:"Open the Customer Profitability Analysis dashboard",s:["In Birst Sales collection, click the dashboard dropdown in the breadcrumb and select Customer Profitability Analysis.","The dashboard loads showing customer-level revenue and profitability data.","Confirm the filters show Company = 100 - CMP100 and Year = 2026."]},{n:"Review customer profitability",s:["Review the top customers by invoiced amount and gross profit.","Look for customers with high revenue but low margin - these may need pricing review.","Look for customers with declining revenue year-over-year - these may need sales follow-up.","Use the Drill Across option on any chart to get more detail on a specific customer."]},{n:"Connect findings to M3 for action",s:["If a customer shows an unusual margin, open M3 and check their price list in OIS017 (Customer Price per Item).","Search by customer number - remember the format is six digits, e.g., 000382 for AAA EXPRESS WATER AND FIRE RES.","Compare the OIS017 price list entries to the Birst margin data to identify whether pricing or cost is the issue.","Document any customers needing pricing review and bring to Tony Shipka."]}],out:["Top customers by revenue and profit identified in Birst.","Customers with margin concerns flagged for pricing review.","Connection made between Birst profitability data and M3 price list in OIS017."],exc:[{q:"A major customer does not appear in the Customer Profitability Analysis",a:"Confirm the customer had invoiced orders in the period. Open customer orders (not yet invoiced) will not appear in profitability reports. Check OIS300 in M3 for open orders."},{q:"Birst shows a different margin for a customer than you expected",a:"Birst uses invoiced data. If
