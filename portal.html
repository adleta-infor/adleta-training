      [3,"Check Stock On Hand in MMS200","Open MMS200 (Stock Balance Inquiry). Enter the item number. Review all three balances: On-hand (total physical quantity), Allocated (committed to open orders), and Available (on-hand minus allocated). Available is the number to use when promising stock to customers — never quote on-hand."],
      [4,"Filter by Warehouse and Location","In MMS200, filter by warehouse ID to see stock at a specific location. Filter further by bin location to see exactly where in the warehouse the stock is. Use F9 to scroll through all locations where this item is stocked across all warehouses."]],videoUrl:"",quiz:[{q:"Item master records are managed in:",options:["OIS100","CRS610","MMS060","PPS200"],answer:2},{q:"When promising stock availability to a customer, you should quote:",options:["The on-hand quantity","The allocated quantity","The available quantity (on-hand minus allocated)","The reorder point quantity"],answer:2},{q:"To transact against an item, the item status must be:",options:["Discontinued (50)","Pending (10)","Active (20)","On hold (30)"],answer:2}],checklist:["I can look up any item in MMS060 and read its status, UOM, and category","I can navigate to MMS080 to view warehouse-specific parameters like reorder point","I can check stock balance in MMS200 and distinguish on-hand, allocated, and available","I always use available quantity (not on-hand) when committing stock to customers"]},{id:"inv-2",title:"Transfers and Adjustments — MMS100 and MMS150",duration:"60 min",steps:[[1,"Open MMS100 and Enter Transfer Details","Open MMS100 (Stock Transfer). Enter the item number. Enter the FROM location — the source warehouse and bin where the stock currently is. Enter the TO location — the destination warehouse and bin. Never enter a transfer for stock you cannot physically locate.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; MMS100 / MMS150 &mdash; Stock Transfer and Inventory Adjustment</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>MMS100 Transfer between locations</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>MMS150 Qty correction</span></div><br><b>MMS100 &mdash; Move stock between locations:</b><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Item number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>ARM51899031</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>From location<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>CAR-A-01</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>To location<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>CAR-B-03</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Lot number</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>LOT-2601</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Qty to transfer<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>50</span></span></div><div style='margin-top:8px'><b>MMS150 &mdash; Adjust qty up or down:</b></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Reason code<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>01 = Physical count</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Adjustment qty<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>+25 or -25</span></span></div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; All adjustments post a transaction to the GL. Negative adjustments reduce on-hand &mdash; verify the count before saving.</div></div>"],
      [2,"Enter Transfer Quantity and Confirm","Enter the transfer quantity. It must not exceed the available quantity at the FROM location — check MMS200 first if unsure. Verify the unit of measure is correct. Enter today as the transfer date. Press Enter to confirm. M3 updates both location balances immediately."],
      [3,"Verify the Transfer in MMS200","Open MMS200. Look up the item. Verify the FROM location decreased by the transferred quantity and the TO location increased by the same amount. Both changes should be visible immediately after confirming the transfer."],
      [4,"Log a Discrepancy Instead of Covering It","If MMS200 shows stock at a location but you cannot physically find it, do NOT process a transfer to cover it. Log the discrepancy in the issue log with the item number, location, quantity in M3, and quantity physically found. Covering discrepancies with transfers hides inventory problems."]],videoUrl:"",quiz:[{q:"MMS100 is used to:",options:["Adjust inventory quantities up or down","Move inventory from one location to another","Process a cycle count","Create a new item in the item master"],answer:1},{q:"Before entering a transfer quantity, you should verify in MMS200 that:",options:["The item is on a customer order","The available quantity at the FROM location is sufficient","The item has a supplier price agreement","The TO location bin is empty"],answer:1},{q:"If MMS200 shows stock at a location you cannot physically find, you should:",options:["Transfer it to a different location to clear the balance","Log the discrepancy in the issue log — do NOT cover it with a transfer","Delete the inventory record","Call IT to reset the balance"],answer:1}],checklist:["I can open MMS100 and enter a valid FROM and TO location transfer","I verify available quantity in MMS200 before entering a transfer","I can confirm the transfer and verify both location balances updated in MMS200","I log inventory discrepancies rather than covering them with transfers"]},{id:"inv-3",title:"Cycle Counting — MMS300",duration:"60 min",steps:[[1,"Open MMS150 and Enter Item and Location","Open MMS150 (Stock Adjustment). Enter the item number and the warehouse location being adjusted. This is used when a physical count reveals a discrepancy, when product is damaged and must be removed, or when a receiving error needs to be corrected.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; MMS300 &mdash; Cycle Count &mdash; Physical Inventory</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Generate count list</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Assign counters</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter counts MMS301</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Review variances MMS302</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Approve and post</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Warehouse<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>CAR</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Location range</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>CAR-A-01 to CAR-A-20</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Count date<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>2026-06-10</span></span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Item</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Location</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>System qty</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Counted qty</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Variance</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>ARM51899031</td><td style='padding:3px 8px;background:#fffbe6;'>CAR-A-01</td><td style='padding:3px 8px;background:#fffbe6;'>500</td><td style='padding:3px 8px;background:#fffbe6;'>498</td><td style='padding:3px 8px;background:#fffbe6;'>-2</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>SHW9876543</td><td style='padding:3px 8px;'>CAR-A-02</td><td style='padding:3px 8px;'>200</td><td style='padding:3px 8px;'>200</td><td style='padding:3px 8px;'>0</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>MOH1234567</td><td style='padding:3px 8px;background:#fffbe6;'>CAR-A-03</td><td style='padding:3px 8px;background:#fffbe6;'>150</td><td style='padding:3px 8px;background:#fffbe6;'>155</td><td style='padding:3px 8px;background:#fffbe6;'>+5</td></tr></table><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Variances need manager approval before posting. Investigate before you approve.</div></div>"],
      [2,"Enter Adjustment Quantity and Reason","Enter a positive number to ADD stock or a negative number to REMOVE stock. Select the reason code: CYCLE (cycle count result), DAMAGE (damaged goods write-off), EXPIRE (expired product), RCVERR (receiving error correction), SHRINK (unexplained loss), WRITUP (found inventory). Enter today as the adjustment date."],
      [3,"Enter Notes and Confirm","Enter a clear note explaining why this adjustment is being made — required for audit purposes. Press Enter to confirm. M3 updates the stock balance and creates an audit record. For write-offs above $500 in value, get manager approval FIRST before entering the adjustment."],
      [4,"Notify Finance for Write-Offs","For any inventory write-off (DAMAGE, EXPIRE, SHRINK), notify Finance on the same day the adjustment is made. Finance needs to record the financial impact. Do not delay — same-day notification is Adleta policy."]],videoUrl:"",quiz:[{q:"To remove damaged goods from inventory, use adjustment reason code:",options:["CYCLE","RCVERR","DAMAGE","WRITUP"],answer:2},{q:"In MMS150, to ADD stock you enter:",options:["A negative quantity","Zero","A positive quantity","The difference from the last count"],answer:2},{q:"Inventory adjustments above $500 in value require:",options:["IT department approval","Manager approval BEFORE entering the adjustment","CFO sign-off within 30 days","Finance to enter them in GLS100 instead"],answer:1}],checklist:["I can open MMS150 and enter an inventory adjustment with item, location, and quantity","I select the correct reason code for each type of adjustment","I enter a clear explanatory note on every adjustment (required for audit)","I get manager approval before entering adjustments above $500","I notify Finance same-day for any inventory write-off"]},
{id:"inv-4",title:"AAA - Automatic Allocation Algorithm",duration:"45 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/AAA%2010-16-2025.mp4",steps:[[1,"Open MMS300 and Find the Count List","Open MMS300 (Cycle Count). Enter the count list ID provided by your manager. The list shows all items and bin locations to be physically counted in this cycle. Review the list before going to the floor — understand the scope of the count.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; AAA &mdash; Automatic Allocation Algorithm</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>AAA decides...</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Based on...</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Which warehouse fills the order</td><td style='padding:3px 8px;'>Facility / warehouse rules</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Which lot number to allocate</td><td style='padding:3px 8px;'>FIFO, FEFO, or lot-specific rules</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Which location to pick from</td><td style='padding:3px 8px;'>Pick sequence / zone rules</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>When allocation runs</td><td style='padding:3px 8px;'>Order status change to 44</td></tr></table><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; You do NOT manually allocate. AAA runs automatically when the order is released to status 44. If allocation fails, check MMS060 for stock.</div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; If an order shows status 44 but no pick list was generated, check MMS060 for stock availability.</div></div>"],
      [2,"Enter Physical Count Results","For each item and location on the list, enter the quantity physically counted. If an item listed is not found at that location, enter zero. Do not guess or estimate — count the actual physical quantity. Submit results when all items on the list are counted."],
      [3,"Review Variances and Recount if Needed","M3 compares your counted quantities to system balances and displays variances. Review each variance. For large discrepancies, conduct a physical recount before proceeding — do not post a large variance without verification. Enter recount results in MMS300."],
      [4,"Approve and Post — M3 Reconciles the Difference","After variances are reviewed (and recounted if needed), your manager reviews and approves the count. M3 posts adjustments to reconcile the differences. The stock balance is now corrected. Finance is notified automatically for any adjustments above the threshold."]],quiz:[{q:"If an item on the cycle count list is not found at the listed location, you enter:",options:["The last known quantity","The system balance as the count","Zero","Skip the item"],answer:2},{q:"For a large variance found during a cycle count, you should:",options:["Post it immediately to correct the system","Conduct a physical recount before posting","Contact the supplier to resolve it","Transfer stock from another location to balance it"],answer:1},{q:"Cycle count adjustments are posted after:",options:["Any team member confirms the count","Manager review and approval","IT validates the count list","Finance approves all variances"],answer:1}],checklist:["I can open MMS300 and navigate a cycle count list","I enter physical count quantities accurately — zero for items not found","I review all variances before posting and recount large discrepancies","I understand the manager must approve before M3 posts the adjustments"]}
]},
  orderManagement:{id:"orderManagement",name:"Order Management / Sales",owner:"Tony Shipka + Jeanell Coral",weeks:"Week 5",pill:"pill-gold",color:"#c49a2a",programs:["CRS610","OIS100","OIS101","OIS300","OIS390","MMS200"],summary:"Customer lookup, order entry, pricing, availability, shipments, backorders, and returns.",links:[["Deck",SP+"/Adleta_M3_OrderManagement_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_OrderManagement_LearningGuide.docx"]],sessions:[{id:"ord-1",title:"Manual Order Entry — Standard Net Terms (CL1)",duration:"60 min",steps:[[1,"Look Up the Customer in CRS610","Open CRS610. Search for customer number 000382 (or the test customer provided). Verify the customer name, address, payment terms, price list, and that the status is Active. Record the customer number. If a customer is not in M3, contact Finance — do NOT create a new record yourself.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS100 &mdash; Customer Order Entry &mdash; Standard Net Terms</div><b>Four screens in sequence:</b><br><br><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS100/A Header</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS100/I Customer PO#</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS102/H Address</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS101/B1 Order Lines</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Customer<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>000382 &mdash; AAA EXPRESS WATER AND FIRE RES</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>CO type<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>C01 &mdash; Bravo Normal/WC (standard)</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Your ref 1<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Customer PO number</span></span></div><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; OIS101/B1 = order lines. Fill warehouse, item, qty, U/M &rarr; click Add per line &rarr; click Change to save.</div><div style='display:flex;gap:3px;margin-top:10px;flex-wrap:wrap'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700'>A</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>B</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>E</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>I</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:3px 10px;font-size:11px;margin-left:auto'>Next &rsaquo;</span></div></div>"],
      [2,"Create a New Sales Order in OIS100","Open OIS100. Click the New button. Enter the customer number — M3 auto-fills name, address, payment terms, and price list. Enter the order type (standard). Set the requested delivery date to 2 weeks from today. Enter customer PO number: TEST-PO-001. Press Enter — M3 assigns an order number. Record it."],
      [3,"Add Order Lines in OIS101","M3 opens OIS101 for order line entry. Enter an item number (use test items provided by your trainer). Enter quantity 100 SQF. Verify M3 auto-fills the correct price from the customer price list. Press F14 to check stock availability. Repeat for 2 more items. Click Done or close the lines panel when all lines are entered."],
      [4,"Verify Pricing on Each Line","Review each order line. The sales price should be pulled automatically from the customer price list. If a price does not match what was quoted, do NOT override it yourself — document the discrepancy and contact your sales manager or Finance for authorization before changing any price."],
      [5,"Release the Order","Save the order header. M3 assigns the order number. Confirm the order status shows Released (status 22) — this means the order is in the warehouse queue for picking. The customer PO number appears on the order and will print on the invoice and packing slip."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2005%202025%20-%20Manual%20Order/Bravo%20-%20Mini-CRP%20Manual%20order%20scenarios-20251205%20Manual%20Order%20CL1.mp4",quiz:[{q:"When you enter a customer number in OIS100, M3 automatically fills in:",options:["Item prices only","Name, address, payment terms, and price list","Warehouse location and carrier","Nothing — you fill all fields manually"],answer:1},{q:"The customer PO number field is important because:",options:["It is required to release the order","It prints on the invoice and packing slip for customer reference","It auto-populates the price list","It routes the order to the correct warehouse"],answer:1},{q:"If the price in M3 does not match what was quoted to the customer:",options:["Override it immediately to match the quote","Document the discrepancy and get authorization before changing","Delete the line and re-enter with the correct price","Cancel the order and re-enter it"],answer:1}],checklist:["I can look up a customer in CRS610 and verify their terms, price list, and status","I can create a sales order header in OIS100 and record the assigned order number","I can add order lines in OIS101 with correct item, quantity (100 SQF), and UOM","I always verify pricing against the customer price list before saving","I know the process for getting a price override authorized before entering it"]},{id:"ord-2",title:"Customer Return — Creating a Return Order",duration:"60 min",steps:[[1,"Get Return Authorization Before Entering in M3","Before entering anything in M3, confirm you have authorization from a sales manager. Not all return requests are approved. Do NOT enter a return order without authorization — it cannot be easily undone once the credit memo is generated.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS100 &mdash; Customer Return Order</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Open OIS100</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter customer</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Select RETURN CO type</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter original order ref</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter item + qty</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Release</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Customer<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>000382</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>CO type<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Return CO type &mdash; confirm with Bravo</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Your ref 1</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Original CO number for reference</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Item number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Returned item</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Qty<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Enter as positive &mdash; M3 credits automatically</span></span></div><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Confirm with your manager before entering a return over $500.</div></div>"],
      [2,"Open OIS390 and Reference the Original Order","Open OIS390. Enter the original sales order number the product was shipped on. M3 pulls in the original order details so you do not have to re-enter them. Verify the customer name and original items are correct."],
      [3,"Select Lines and Enter Return Quantity","Select the order lines being returned. Enter the quantity being returned — for this exercise, enter 50 SQF on one line item. Verify the unit of measure is correct. Enter today as the return date."],
      [4,"Enter Return Reason Code","Select the return reason code. For this exercise use CUSTCANCEL (customer cancelled after shipment). Other codes: DEFECT (damaged/defective), WRONGITEM (wrong item shipped), WRONGQTY (incorrect quantity), OVERSHIP (more than ordered). Always select the most accurate reason code."],
      [5,"Confirm Return and Record the Return Order Number","Press Enter to save and confirm the return order. M3 assigns a return order number — record it. A credit memo is generated automatically and Finance will process the credit to the customer account. The warehouse team will receive and inspect the returned product."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Customer%20Return.mp4",quiz:[{q:"Before entering a return in M3, you must first:",options:["Check inventory availability","Get authorization from a sales manager","Create a new customer order","Call the supplier for a credit"],answer:1},{q:"The return reason code CUSTCANCEL is used when:",options:["The product is defective","The wrong item was shipped","The customer cancelled after shipment","Too much product was shipped"],answer:2},{q:"After confirming a return order in OIS390:",options:["You must manually create the credit memo","A credit memo is generated automatically","The customer receives a refund immediately","Finance must re-enter the return in ARS100"],answer:1}],checklist:["I always get manager authorization before entering a return in M3","I can open OIS390 and reference the original order number","I enter return quantity (50 SQF) with correct UOM and return date","I select the correct return reason code (CUSTCANCEL or other)","I record the return order number assigned by M3"]},{id:"ord-3",title:"Order Entry — Handling a Credit Hold",duration:"60 min",steps:[[1,"Attempt to Release a Credit-Hold Customer Order","Enter a complete order in OIS100 for the designated credit-hold customer. Fill in all required fields and all order lines. Attempt to save and release the order. M3 will block the release.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS100 &mdash; Credit Hold &mdash; Order Entry</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Status</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Meaning</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Action</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>20</td><td style='padding:3px 8px;'>Registered &mdash; on hold</td><td style='padding:3px 8px;'>Check CRS610/J for credit limit and AR balance</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>44</td><td style='padding:3px 8px;background:#fffbe6;'>Released &mdash; approved</td><td style='padding:3px 8px;background:#fffbe6;'>Credit OK, order proceeds normally</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>66</td><td style='padding:3px 8px;'>Delivery note</td><td style='padding:3px 8px;'>Shipped</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>75</td><td style='padding:3px 8px;'>Ready to invoice</td><td style='padding:3px 8px;'>Send invoice</td></tr></table><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Customer credit limit</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>CRS610 / J panel</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Current AR balance</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>ARS300</span></span></div><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Never release a credit hold without manager approval. Document the approval in the order notes.</div></div>"],
      [2,"Read and Recognize the Credit Hold Message","When M3 blocks the release, read the exact error message carefully. Write it down. Every super user must be able to recognize this message on the floor — do not confuse it with other order errors. It will include the words &quot;credit hold&quot; or show a credit status code."],
      [3,"Locate the Credit Hold Flag in CRS610","Open CRS610. Look up the blocked customer. Navigate to the customer record and find the credit status field. The hold flag is set here. Note the field name and location — you are here to SEE it, not change it. Only Philip Jones or the designated AR manager removes credit holds."],
      [4,"Document the Hold in Order Notes","Go back to the blocked order in OIS100. Add a note documenting: who you called, when you called, what was said, and what the next step is. This creates an audit trail. Example: &quot;Called Philip Jones 10:15am 6/10/26. He is reviewing. Will confirm release by EOD.&quot;"]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20Manual%20Order%20Hard%20Hold%20Credit.mp4",quiz:[{q:"When a credit hold blocks an order release, you should:",options:["Change the payment terms to bypass the hold","Escalate to Philip Jones or the AR team — never bypass","Delete the order and re-enter under a different customer number","Approve it yourself if the amount is small"],answer:1},{q:"The credit hold flag on a customer record is located in:",options:["OIS100 on the order header","CRS610 the customer master","APS100 the invoice entry screen","MMS060 the item master"],answer:1},{q:"Order notes documenting a credit hold must include:",options:["The customer email address only","Who you called, when, what was said, and next steps","The GL account code for the order","The warehouse bin location"],answer:1}],checklist:["I can recognize a credit hold message when M3 blocks an order release","I know NOT to bypass, override, or work around a credit hold under any circumstances","I know the escalation path: Philip Jones or AR team removes holds — not me","I can locate the credit hold flag in CRS610 (view only)","I can add order notes documenting who I called, when, and what was said"]},{id:"ord-4",title:"Will Call Order — Immediate Pickup",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Immediate%20delivery%20via%20will%20call.mp4",steps:[[1,"Open OIS100 and create a new order","In the M3 search bar, type OIS100 and press Enter. Click the + New button. The customer is at the counter or calling in for same-day pickup. Enter the customer number and verify the account is active.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS100 &mdash; Will Call Order &mdash; Immediate Pickup</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS100/A Customer + Will Call CO type</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS100/I Customer PO#</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS101/B1 Lines</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Release</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Customer arrives</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Warehouse issues</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Customer<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>000382</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>CO type<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Will Call CO type &mdash; confirm with Bravo</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Your ref 1<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Customer PO number</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Requested delivery dt</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Today or specific pickup date</span></span></div><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Confirm stock in MMS060 before entering a Will Call order. The customer will be there expecting to pick up.</div></div>"],
[2,"Set the order type to Will Call","Set the delivery method to Will Call (WC). This tells M3 the customer is picking up at the warehouse — no delivery route is needed. Set the warehouse to the location where the customer will pick up."],
[3,"Set the requested delivery date to today","Enter today as the requested delivery date. For immediate/same-day will call, this is critical so the warehouse prioritizes the pick."],
[4,"Enter order lines — check available quantity first","Enter the item number. Before confirming the quantity, check the Available field. Confirm the quantity is available in the warehouse TODAY. If not, let the customer know before accepting the order."],
[5,"Confirm pricing and any customer discounts","Verify the price on the line. Will call customers sometimes have specific pickup pricing. Confirm before finalizing."],
[6,"Release the order and print the pick ticket","Release the order. M3 allocates the inventory. Print the pick ticket immediately and hand it to the warehouse team — they need to pull the order before the customer arrives."],
[7,"Notify the warehouse team","Call or radio the warehouse to let them know a will call order is ready to pick. Give them the order number, items, and quantities. Tell them when the customer is expected."],
[8,"Invoice when customer picks up","When the customer arrives and signs for the goods, mark the order as picked up in M3. Process the invoice and collect payment (cash, check, or credit card) at the time of pickup. Hand the customer their invoice."]],quiz:[{q:"Will Call orders are issued at which level?",options:["Shipment level","Load level","Delivery level","Invoice level"],answer:2},{q:"Why do Will Call orders not require load building?",options:["They are too small","Customer picks up at the warehouse — no truck loading needed","IT disabled it for Will Call","The warehouse skips this step"],answer:1},{q:"Where do you change the delivery method to Will Call?",options:["CRS610","APS100","OIS300/OIS100 order header","PPS200"],answer:2},{q:"Will Call charges are added in which section of the order?",options:["Item lines","Order header comments","Charges section","Delivery notes"],answer:2}],checklist:["I can create a Will Call order in OIS300/OIS100","I know how to change the delivery method to Will Call","I can add Will Call charges to an order","I understand Will Call orders are issued at the delivery level — no load building required","I can verify the correct warehouse and Will Call route are assigned"]},{id:"ord-5",title:"Manual Order — Credit Card and COD Payment",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20Manual%20Order%20CC%20COD.mp4",steps:[[1,"Create a COD Order in OIS100","Open OIS100. Click the New button. Enter the customer number. Set the payment terms to COD. Complete all order header fields. Add order lines with items and quantities. When you save, M3 populates the COD amount field with the order total — this is the exact amount the driver must collect.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS100 &mdash; Credit Card and COD Order Entry</div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Customer<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>000382</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>CO type<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>C01 or CC/COD-specific type</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Payment terms<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>COD code &mdash; confirm with Bravo</span></span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Payment type</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>When paid</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Where entered</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Net terms (standard)</td><td style='padding:3px 8px;'>On invoice due date</td><td style='padding:3px 8px;'>CRS610/J payment terms</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Credit card</td><td style='padding:3px 8px;'>At order entry</td><td style='padding:3px 8px;'>OIS100 payment field</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>COD</td><td style='padding:3px 8px;'>At delivery / pickup</td><td style='padding:3px 8px;'>OIS100 COD code</td></tr></table><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; COD orders must have the COD code confirmed with Bravo. Do not ship a COD order without confirming payment method.</div></div>"],
      [2,"Verify the COD Amount on the Order","Review the COD amount field on the completed order. This amount flows automatically to the load manifest that the driver carries. Confirm it matches the order total including any freight charges. Any discrepancy between M3 and what the driver collects must be resolved before delivery."],
      [3,"Understand the Driver Collection Process","The COD amount on the order flows to the load manifest. Drivers must collect this exact amount before leaving the delivery address — cash, certified check, or approved payment method only. No exceptions without manager approval. Partial COD collections are not accepted."],
      [4,"Credit Card Payment Handling","If the customer is paying by credit card: if Adleta processes the card in M3, enter the payment method on the order. If using a separate terminal, the terminal charge must exactly match the M3 order amount. The signed receipt must be attached to the order in M3 before the order is released for delivery."]],quiz:[{q:"On a COD order, the amount the driver must collect is:",options:["Whatever the customer offers","The exact COD amount shown on the order in M3","The deposit amount only","Determined at the door by the driver"],answer:1},{q:"The COD order amount flows automatically to:",options:["The AR aging report only","The load manifest the driver carries","The GL directly without AP involvement","Birst reporting only"],answer:1},{q:"For credit card orders using a separate terminal, the terminal charge must:",options:["Be entered in Birst for tracking","Exactly match the M3 order amount — receipt attached to order","Be approved by IT before processing","Be entered separately in APS100"],answer:1}],checklist:["I can create a COD order in OIS100 with COD payment terms","I can verify the COD amount field matches the order total","I understand the driver collection process and the no-exceptions policy","I know the credit card handling procedure (M3 entry or terminal + receipt attachment)"]},{id:"ord-6",title:"Will Call Order — COD Payment at Pickup",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Manual%20Order%20WC%20COD.mp4",steps:[[1,"Open OIS100 and enter the customer","In the M3 search bar, type OIS100 and press Enter. Click the + New button. Enter the customer number. Will Call COD means the customer is picking up AND paying at time of pickup — common for cash customers or new accounts without established credit.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS100 &mdash; Will Call COD &mdash; Pickup and Payment</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter Will Call + COD terms</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Release to warehouse</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Warehouse picks and packs</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Customer arrives and pays</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Warehouse issues</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Invoice generated</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>CO type<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Will Call type</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Payment terms<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>COD code</span></span></div><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Warehouse must confirm payment received before issuing goods. Do not mark issued until cash or check is in hand.</div></div>"],
[2,"Set delivery method to Will Call","In the order header, set the delivery method to Will Call. Set today as the delivery date if the customer is coming in. Set the warehouse to the pickup location."],
[3,"Set payment type to COD","In the payment/terms field, set the type to COD. For will call, COD means they pay at the counter when they pick up — not when a driver delivers."],
[4,"Enter order lines and check availability","Enter item number and quantity. Confirm available quantity is sufficient for today's pickup. Do not promise items that are not in stock."],
[5,"Review the total and confirm with the customer","Before releasing, confirm the order total with the customer so they know how much to bring or have their card ready. No surprises at pickup."],
[6,"Release the order and pull the pick ticket","Release the order. Print the pick ticket for the warehouse. Alert the counter or warehouse that a will call COD order is being prepped."],
[7,"Collect payment before releasing goods","When the customer arrives, collect full payment BEFORE releasing the goods. Process cash, check, or card as appropriate. Do not allow pickup without payment — this is a COD order."],
[8,"Post the cash receipt and invoice","After payment is collected, post the cash receipt to the customer account in M3. Print and hand the customer their invoice. Mark the order as complete."]],quiz:[{q:"COD stands for:",options:["Confirmed Order Delivery","Cash On Delivery","Customer Order Date","Close of Day"],answer:1},{q:"When is payment collected for COD orders?",options:["30 days after invoice","At or before delivery","Upon order entry","After the monthly statement"],answer:1},{q:"If a COD customer wants will call, the delivery method should be set to:",options:["OT","CC","Will Call with COD terms","Standard delivery"],answer:2},{q:"Prepayment for a COD order in M3 must be processed:",options:["After goods ship","Before releasing the order to the warehouse","At month end","By Finance only"],answer:1}],checklist:["I understand the difference between COD and net terms orders","I can enter a COD order in OIS100 for will call and common carrier scenarios","I know when prepayment is required and how to process it","I can apply the correct delivery method for COD orders"]},{id:"ord-7",title:"Quote to Customer Order — Converting a Quote (N30)",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20LnTp%200%20Quote%20to%20CO%20OT%20N30.mp4",steps:[[1,"Create a Quote in OIS100","Open OIS100. Click the New button. Select the Quote order type. Enter the customer number. Add items, quantities, and verify pricing. Save — M3 assigns a quote number. Note: inventory is NOT allocated on a quote. No stock is reserved until the quote is converted to a firm CO.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS100 &mdash; Quote to Customer Order Conversion</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS100 enter Quote N30</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Customer approves</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Open quote</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Right-click &rarr; Convert to order</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>New CO number generated</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Order proceeds normally</span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Quote field</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Value</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>CO type</td><td style='padding:3px 8px;background:#fffbe6;'>N30 &mdash; Quote</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Valid until date</td><td style='padding:3px 8px;'>Date quote expires</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>After approval</td><td style='padding:3px 8px;'>Converts to standard CO type</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Reference</td><td style='padding:3px 8px;'>Original quote number stays in Your ref 1</td></tr></table></div>"],
      [2,"Give the Customer Their Quote Number","Confirm the quote is saved in OIS100 with Quote status. The quote number shown in M3 is what the sales rep gives to the customer. When the customer calls to confirm, reference this number to pull up the quote immediately."],
      [3,"Convert Quote to a Customer Order","When the customer confirms, open the quote in OIS100. Change the order type from Quote to the CO type (standard net terms). M3 allocates inventory at this exact step. Confirm the inventory allocation message — if any item is out of stock, M3 will flag it."],
      [4,"Verify the Converted Order","After conversion, M3 assigns a new CO number. Verify all lines carried over correctly — item numbers, quantities, and pricing must match the original quote. Confirm the order status shows Released. The original quote is now closed."]],quiz:[{q:"When you save a quote in OIS100, inventory is:",options:["Allocated immediately — stock is reserved","Not reserved — no inventory commitment until converted to a CO","Shipped automatically when the quote is approved","Billed to the customer immediately"],answer:1},{q:"The quote number given to the customer comes from:",options:["The customer choosing a reference number","M3 assigning it when the quote is saved","The salesperson entering it manually","Finance approving the quote amount"],answer:1},{q:"When converting a quote to a CO, inventory is allocated:",options:["When the quote was first created","When the customer calls to confirm","When you change the order type to CO in OIS100","When the order ships from the warehouse"],answer:2}],checklist:["I can create a quote in OIS100 using the correct Quote order type","I can give a customer their quote number from the saved quote in OIS100","I can convert a quote to a firm CO — and know that inventory allocates at that step","I verify all lines, quantities, and pricing carried over correctly after conversion"]},{id:"ord-8",title:"Drop Ship Order — Quote to Customer Order with Non-Cancel",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Drop%20Ship%20Quote%20to%20CO%20with%20NonCX.mp4",steps:[[1,"Open OIS100 and create a Drop Ship Quote","In the M3 search bar, type OIS100 and press Enter. Click the + New button. Select the Drop Ship order type. Enter the customer number and the supplier who will ship directly to the customer. Drop ship means the supplier ships directly — Adleta never physically handles the product.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS100 &mdash; Drop Ship Order Entry</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter CO drop ship type</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>M3 auto-creates PO</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Supplier ships to customer</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Supplier invoice to Adleta</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>3-way match APS100</span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>M3 object</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What happens</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>OIS100 CO</td><td style='padding:3px 8px;'>Entered with drop ship CO type</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>PPS200 PO</td><td style='padding:3px 8px;'>Auto-created and linked to CO</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>MMS060 inventory</td><td style='padding:3px 8px;'>NOT updated &mdash; no physical movement at Adleta</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>APS100 invoice</td><td style='padding:3px 8px;'>Still matched to PO for 3-way match</td></tr></table><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; Drop ship orders do NOT affect on-hand inventory at Adleta. Confirm the item is set up as a drop-ship item before entering.</div></div>"],
[2,"Enter the customer ship-to address","For drop ships, verify the ship-to is the customer delivery address (not Adleta warehouse). click the lookup icon in the Ship-To field if you need to add a new delivery address for this customer."],
[3,"Enter the item and quantity on the quote line","Add the item number and quantity. For drop ship, confirm the item is set up for drop ship in M3 (your trainer can verify). Enter the sell price to the customer."],
[4,"Set the Non-Cancel (NonCX) flag","On the order line, locate the Non-Cancel field and set it to YES (or the correct NonCX indicator). This flag means once Adleta places the PO with the supplier, the customer cannot cancel the order without penalty. Confirm the customer agrees to this before setting NonCX."],
[5,"Save the quote and get customer confirmation","Save the drop ship quote. Contact the customer to confirm: item, quantity, delivery address, price, and the non-cancel terms. Get their approval before converting to a firm order."],
[6,"Convert the quote to a Customer Order","Once the customer confirms, open the quote and convert it to a Customer Order. M3 automatically generates a corresponding Purchase Order to the drop ship supplier."],
[7,"Verify the auto-generated PO in PPS200","Open PPS200 and confirm the drop ship PO was created to the correct supplier with the correct item, quantity, and the customer delivery address as the ship-to. Transmit the PO to the supplier."],
[8,"Monitor through to delivery","Track both the customer order in OIS100 and the supplier PO in PPS200. When the supplier ships, they send confirmation. Update the order status. Invoice the customer upon confirmed delivery."]],quiz:[{q:"Drop ship orders in M3 use which line type?",options:["0","1","2","3"],answer:2},{q:"In a drop ship order, goods are shipped by:",options:["Adleta warehouse","A third-party logistics provider","The supplier directly to the customer","The customer picking up at Adleta"],answer:2},{q:"When you save a drop ship order line, M3 automatically creates a:",options:["Delivery note","Purchase Order linked to the customer order","Credit memo","Journal entry"],answer:1},{q:"Drop ship is used when:",options:["The item is in stock at Adleta","The customer wants will call","The product is not stocked in the Adleta warehouse and ships from supplier","The order is COD"],answer:2}],checklist:["I can create a drop ship order using line type 2 in OIS100","I understand that M3 automatically creates a linked PO for drop ship lines","I can verify the supply chain to confirm supplier and delivery address","I know when to use drop ship vs. ship from Adleta warehouse"]}]},
  financeAP:{id:"financeAP",name:"Finance — AP and AR",owner:"Philip Jones",weeks:"Week 6",pill:"pill-red",color:"#c0443b",programs:["APS100","APS200","ARS100","ARS200","ARS300"],summary:"Supplier invoices, payment runs, customer invoices, cash application, AR aging.",links:[["Deck",SP+"/Adleta_M3_Finance_APAR_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Finance_APAR_LearningGuide.docx"]],sessions:[{id:"fin-1",title:"AP Invoice Entry with PO Match — APS100",duration:"60 min",steps:[[1,"Open APS100 and Enter Invoice Header","Open APS100. Enter the supplier (supplier) number — M3 auto-fills supplier name and payment terms. Enter the invoice number exactly as shown on the supplier invoice (must be unique per supplier — M3 rejects duplicates). Enter the invoice DATE from the supplier invoice, not today's date. Enter the total invoice amount.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; APS100 &mdash; AP Invoice Entry &mdash; 3-Way Match</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Open APS100</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>FAM Function screen</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Division AAA &rarr; Apply</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Right-click Fn 300 &rarr; Select</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter invoice</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Match to PO</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Supplier<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>300001 &mdash; CAR Flooring</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Invoice number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Supplier invoice number</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Invoice date<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Date on supplier invoice</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Invoice amount<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Gross amount</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>PO number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Must match PPS200 PO</span></span></div><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Function 300 = 3-way match (PO + receipt + invoice). System verifies qty and price match before approving payment.</div></div>"],
      [2,"Reference the PO and Run Three-Way Match","Enter the purchase order number this invoice relates to. M3 retrieves the PO details. Press F14 to run the three-way match. M3 compares the invoice to the PO and the goods receipt in PPS300."],
      [3,"Review a Clean Match","If all three documents match within tolerance — the invoice auto-approves and is queued for the next payment run. No further action is needed. Confirm the match status shows Approved. The invoice will appear in the next APS200 payment proposal."],
      [4,"Identify and Handle a Price Variance","If the invoice price differs from the PO price, M3 flags a variance. Do NOT approve a variance on your own. Process: (1) Compare PO price in PPS200 to invoice price. (2) If the PO price is wrong, contact Purchasing to amend the PO. (3) If the invoice is wrong, contact the supplier for a corrected invoice. Log the discrepancy in the issue tracker — all variances must be resolved within 5 business days."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20Invoice%20w%20Po%20(PO%20Match).mp4",quiz:[{q:"The Invoice Date field in APS100 should contain:",options:["Today's date","The date you entered the invoice in M3","The date shown on the supplier's invoice","The PO creation date"],answer:2},{q:"To run the three-way match in APS100 you press:",options:["F3","F5","F14","F17"],answer:2},{q:"When a price variance is flagged in APS100 you should:",options:["Approve it to keep payments on schedule","Contact Purchasing or the supplier to resolve — never approve without authorization","Delete the invoice and re-enter it","Change the PO price yourself to match the invoice"],answer:1}],checklist:["I can enter a supplier invoice in APS100 with correct supplier, number, DATE (from invoice), and amount","I can enter the PO reference and run the three-way match using F14","I know what a clean match looks like and what happens next (queued for payment)","I know NOT to approve a price variance without Purchasing or supplier resolution","I log all match discrepancies in the issue tracker"]},{id:"fin-2",title:"AR Master Data — Customer Terms and Credit Setup",duration:"45 min",steps:[[1,"In the M3 search bar, type CRS610 and press Enter. CRS610 opens to the customer list.","In the M3 search bar, type CRS610 and press Enter. Look up the customer by number or use the lookup icon to search by name. The Customer Master is the central record that controls how AR transactions post for this customer.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; CRS610/J &mdash; AR Master Data &mdash; Customer Terms and Credit</div><div style='display:flex;gap:3px;margin-top:10px;flex-wrap:wrap'><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>E Contact</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>F Details</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>G Order Info</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700'>J Financial</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:3px 10px;font-size:11px;margin-left:auto'>Next &rsaquo;</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Payment terms<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>N30 = Net 30 days</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Credit limit<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>$50,000.00</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Credit stop<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>0 = No stop  |  1 = Stop on credit</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Cust no. mand</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>1 = Customer PO number required on every order</span></span></div><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Changes to payment terms or credit limits take effect on the next order. Open orders are not retroactively changed.</div></div>"],
[2,"Review payment terms on the customer","In CRS610, find the Payment Terms field. Confirm the terms match the customer contract (Net 30, Net 60, COD, etc.). Incorrect terms cause invoices to appear past due too early or too late in the aging."],
[3,"Review the credit limit","Find the Credit Limit field. Confirm it reflects the approved credit amount for this customer. A limit of zero may mean no credit is extended (COD only) or it may be blank if unlimited — confirm which with your trainer."],
[4,"Check the customer status and hold flag","Verify the customer status is Active. Check if there is a manual credit hold flag set. If the customer is on hold, all new orders will be blocked until the hold is removed by Collections."],
[5,"Review the customer invoice and statement settings","Check how invoices are delivered to this customer — email, mail, or EDI. Verify the invoice-to email address or EDI trading partner ID is correct. Incorrect settings mean customers do not receive their invoices."],
[6,"Review AR aging for the customer","From CRS610, navigate to Related > Open Items (or run the AR aging). Review the customer open balance, oldest unpaid invoice, and any unapplied cash. This gives context for any credit decision."],
[7,"Update a customer field if needed","If a field is incorrect (wrong terms, wrong email, wrong credit limit), select Change from the action menu. Update the field and save. Only update fields you are authorized to change — credit limit changes require manager approval."],
