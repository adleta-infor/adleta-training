<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Auth guard
var _u = sessionStorage.getItem("adleta_user3");
if(!_u) { window.location.replace("index.html"); }
</script>
<title>Adleta Infor M3 — Training Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================
   ADLETA M3 TRAINING PORTAL — FULL BUILD
   Role-based access | Sessions | Quizzes | Video
   ===================================== */
:root {
  --navy:#0f2133;--navy2:#172d42;--navy3:#1f3a52;
  --teal:#1a7a6d;--teal2:#22a08f;--teal3:#e0f2ee;
  --gold:#c49a2a;--gold2:#faf0db;
  --red:#c0443b;--red2:#fce8e7;
  --blue:#2d6fa3;--blue2:#e0ecf7;
  --ink:#0f1f2e;--body:#344b5f;--muted:#6b8199;
  --line:#dde5ed;--bg:#f2f5f8;--surface:#fff;--surface2:#f7f9fb;
  --r:10px;--rsm:6px;
  --shadow:0 2px 12px rgba(15,33,51,0.08);
  --shadow2:0 8px 32px rgba(15,33,51,0.12);
  font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.55;
}
*,*::before,*::after{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--ink);min-height:100vh;}
a{color:var(--teal);text-decoration:none;font-weight:500;}
a:hover{text-decoration:underline;}
button,input,select{font:inherit;}
h1,h2,h3,h4{line-height:1.2;font-weight:700;}
p{color:var(--body);line-height:1.6;}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{background:var(--navy);color:#e8f1f8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-top{padding:22px 18px 16px;}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;}
.brand-mark{width:42px;height:42px;background:linear-gradient(135deg,var(--teal2),var(--teal));border-radius:10px;display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:13px;color:#fff;flex-shrink:0;}
.brand-name{font-size:14px;font-weight:700;color:#fff;line-height:1.2;}
.brand-sub{font-size:12px;color:#7fa3be;}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:var(--rsm);color:#a8c4d8;font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:all .15s;}
.nav-btn svg{opacity:.65;flex-shrink:0;}
.nav-btn:hover,.nav-btn.active{background:var(--navy3);color:#fff;}
.nav-btn.active svg{opacity:1;}
.sidebar-footer{margin-top:auto;padding:14px 18px 20px;border-top:1px solid rgba(255,255,255,0.07);}
.user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--navy3);border-radius:var(--rsm);}
.user-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;color:#fff;}
.user-role{font-size:11px;color:#7fa3be;}
.logout-btn{margin-top:8px;width:100%;padding:7px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:var(--rsm);color:#7fa3be;font-size:13px;cursor:pointer;transition:all .15s;}
.logout-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
.main{display:flex;flex-direction:column;min-width:0;}
.hero{background:var(--navy);padding:28px 36px 24px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 500px 250px at 100% 50%,rgba(26,122,109,0.2) 0%,transparent 70%),repeating-linear-gradient(120deg,rgba(255,255,255,0.015) 0 1px,transparent 1px 52px);pointer-events:none;}
.hero-inner{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.hero-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--teal2);font-weight:700;margin-bottom:8px;}
.hero h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;}
.hero-sub{font-size:13px;color:#7fa3be;}
.hero-actions{display:flex;gap:8px;flex-shrink:0;margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rsm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--teal2);color:#fff;}
.btn-primary:hover{background:var(--teal);color:#fff;text-decoration:none;}
.btn-ghost{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}
.btn-ghost:hover{background:rgba(255,255,255,0.18);color:#fff;text-decoration:none;}
.btn-sm{padding:6px 12px;font-size:13px;}
.content{padding:24px 36px 40px;flex:1;}
.view{display:none;}
.view.active{display:block;}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.sec-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);font-weight:700;margin-bottom:4px;}
.sec-hd h2{font-size:20px;color:var(--ink);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--teal);}
.metric:nth-child(2){border-top-color:var(--blue);}
.metric:nth-child(3){border-top-color:var(--gold);}
.metric:nth-child(4){border-top-color:var(--red);}
.metric-val{font-size:28px;font-weight:800;color:var(--teal);line-height:1;margin-bottom:3px;}
.metric:nth-child(2) .metric-val{color:var(--blue);}
.metric:nth-child(3) .metric-val{color:var(--gold);}
.metric:nth-child(4) .metric-val{color:var(--red);}
.metric-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.dash-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:20px;}
.mastery{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr;align-items:center;}
.mastery-node{background:var(--teal3);border:1px solid #b0d9d2;border-radius:var(--r);padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--teal);min-height:64px;display:grid;place-items:center;}
.mastery-arr{display:grid;place-items:center;color:var(--teal);opacity:.5;}
.prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.prog-track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.prog-label{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;}
.check-list{display:flex;flex-direction:column;gap:6px;}
.check-item{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.check-item:last-child{border-bottom:none;}
.check-item input{width:15px;height:15px;margin-top:2px;accent-color:var(--teal);cursor:pointer;}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.pill-teal{background:var(--teal3);color:#145c52;}
.pill-blue{background:var(--blue2);color:#1e4f7a;}
.pill-gold{background:var(--gold2);color:#7a5c12;}
.pill-red{background:var(--red2);color:#8a2e28;}
.pill-gray{background:#eef2f6;color:#344b5f;}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.mod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all .15s;}
.mod-card:hover{border-color:var(--teal);box-shadow:var(--shadow2);transform:translateY(-1px);}
.mod-card h3{font-size:14px;color:var(--ink);}
.mod-owner{font-size:11px;color:var(--muted);font-weight:600;}
.mod-summary{font-size:12px;color:var(--body);line-height:1.5;flex:1;}
.tags{display:flex;flex-wrap:wrap;gap:4px;}
.tag{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:#eef2f6;color:#344b5f;}
.mod-progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px;}
.mod-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.mod-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.mod-link{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--rsm);color:var(--teal);font-weight:600;transition:all .15s;}
.mod-link:hover{background:var(--teal3);border-color:var(--teal);text-decoration:none;}
.session-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;border:none;background:none;padding:0;margin-bottom:12px;}
.session-back:hover{color:var(--teal);}
.session-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.session-title{font-size:22px;font-weight:700;margin-bottom:16px;}
.session-body{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
.session-content{display:flex;flex-direction:column;gap:16px;}
.session-sidebar{display:flex;flex-direction:column;gap:14px;}
.notes-area{width:100%;min-height:90px;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:13px;color:var(--ink);background:var(--surface);resize:vertical;font-family:inherit;}
.notes-area:focus{outline:none;border-color:var(--teal);}
.notes-saved{font-size:11px;color:var(--teal);margin-top:4px;display:none;}
@media print{body *{visibility:hidden;}.print-zone,.print-zone *{visibility:visible;}.print-zone{position:fixed;top:0;left:0;width:100%;padding:20px;}.print-hide{display:none!important;}}
.step-cards{display:flex;flex-direction:column;gap:12px;}
.step-card{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:box-shadow .15s;}
.step-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.step-num{width:36px;height:36px;min-width:36px;border-radius:50%;background:var(--teal);color:#fff;font-size:15px;font-weight:800;display:grid;place-items:center;font-family:'DM Mono',monospace;}
.step-body{flex:1;}
.step-action{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.step-detail{font-size:13px;color:var(--body);line-height:1.55;}
.session-progress-header{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:16px;margin-bottom:4px;}
.session-progress-header .prog-track{flex:1;height:8px;border-radius:4px;background:var(--line);}
.session-progress-header .prog-fill{height:100%;border-radius:4px;background:var(--teal);transition:width .3s;}
.session-nav{display:flex;gap:10px;margin-top:8px;}
.session-nav .btn{flex:1;justify-content:center;}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--r);}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:var(--r);}
.video-placeholder{background:var(--navy2);border-radius:var(--r);aspect-ratio:16/9;display:grid;place-items:center;color:#7fa3be;font-size:13px;text-align:center;padding:20px;}
.video-input-wrap{display:flex;gap:8px;margin-top:8px;}
.video-input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:var(--rsm);font-size:13px;outline:none;}
.video-input:focus{border-color:var(--teal);}
.quiz-wrap{display:flex;flex-direction:column;gap:16px;}
.quiz-q{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
.quiz-q-text{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--ink);}
.quiz-options{display:flex;flex-direction:column;gap:8px;}
.quiz-option{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--rsm);cursor:pointer;font-size:13px;transition:all .15s;background:var(--surface);}
.quiz-option:hover{border-color:var(--teal);background:var(--teal3);}
.quiz-option.correct{border-color:#22a08f;background:#e0f2ee;color:#145c52;}
.quiz-option.wrong{border-color:var(--red);background:var(--red2);color:var(--red);}
.quiz-option input{margin-top:2px;accent-color:var(--teal);}
.quiz-result{text-align:center;padding:16px;border-radius:var(--r);font-size:15px;font-weight:700;}
.quiz-result.pass{background:var(--teal3);color:#145c52;}
.quiz-result.fail{background:var(--red2);color:var(--red);}
.quiz-btn{width:100%;padding:10px;background:var(--teal);color:#fff;border:none;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .15s;}
.quiz-btn:hover{background:var(--teal2);}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.phase-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border-top:4px solid var(--teal);}
.phase-card:nth-child(2){border-top-color:var(--blue);}
.phase-card:nth-child(3){border-top-color:var(--gold);}
.phase-card:nth-child(4){border-top-color:var(--red);}
.phase-weeks{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
.phase-name{font-size:16px;font-weight:700;margin-bottom:8px;}
.phase-purpose{font-size:12px;color:var(--body);margin-bottom:8px;line-height:1.5;}
.phase-success{font-size:12px;color:var(--teal);font-style:italic;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;line-height:1.5;}
.su-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.su-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.su-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;}
.su-name{font-size:14px;font-weight:700;}
.su-dept{font-size:11px;color:var(--muted);}
.su-mod{font-size:10px;font-family:'DM Mono',monospace;color:var(--teal);margin-top:3px;}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;}
.res-card h3{font-size:14px;}
.res-card p{font-size:12px;color:var(--body);flex:1;}
.res-link{font-size:13px;display:inline-flex;align-items:center;gap:5px;margin-top:4px;}
.search-input{padding:8px 13px;border-radius:var(--rsm);border:1px solid var(--line);background:var(--surface);width:260px;font-size:13px;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--teal);}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.user-table{width:100%;border-collapse:collapse;font-size:13px;}
.user-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:12px;font-weight:600;}
.user-table td{padding:9px 12px;border-bottom:1px solid var(--line);}
.user-table tr:hover td{background:var(--surface2);}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.dot-green{background:#22a08f;}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
@media(max-width:1100px){.mod-grid,.res-grid,.su-grid{grid-template-columns:repeat(2,1fr);}.timeline{grid-template-columns:repeat(2,1fr);}.metrics{grid-template-columns:repeat(2,1fr);}.session-body{grid-template-columns:1fr;}}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{height:auto;position:static;}.hero{padding:20px;}.content{padding:16px 18px 32px;}.dash-grid,.admin-grid{grid-template-columns:1fr;}.mod-grid,.res-grid,.su-grid,.timeline{grid-template-columns:1fr;}.mastery{grid-template-columns:1fr;gap:6px;}}

.admin-tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:20px;}
.admin-tab{padding:10px 20px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;}
.admin-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
.admin-tab-pane{display:none;}.admin-tab-pane.active{display:block;}
.guide-section{margin-bottom:28px;}
.guide-section h3{font-size:14px;font-weight:800;color:var(--ink);margin:0 0 10px 0;padding-bottom:8px;border-bottom:1px solid var(--line);}
.guide-su-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px;}
.guide-su-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);}
.guide-su-name{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:2px;}
.guide-su-dept{font-size:11px;color:var(--muted);margin-bottom:8px;}
.guide-su-modules{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.guide-su-sessions{font-size:12px;color:var(--body);margin-bottom:6px;}
.guide-step-list{list-style:none;padding:0;margin:0;}
.guide-step-list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--body);}
.guide-step-list li:last-child{border-bottom:none;}
.guide-step-num{width:22px;height:22px;min-width:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;}
.guide-tip{background:#fef9ec;border:1px solid #f0d060;border-radius:var(--r);padding:12px 14px;font-size:12px;color:#7a6020;margin-top:8px;}
.guide-tip strong{color:#5a4010;}


.ex-card{padding:0!important;}
.ex-objective,.ex-scenario{padding:16px 20px;border-bottom:1px solid var(--line);}
.ex-objective{background:color-mix(in srgb,var(--teal) 8%,var(--surface));}
.ex-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);margin-bottom:4px;}
.ex-text{font-size:14px;color:var(--ink);line-height:1.5;}
.ex-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 20px 4px;}
.ex-task{padding:12px 20px;border-bottom:1px solid var(--line);}
.ex-task-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.ex-task-num{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ex-task-name{font-size:13px;font-weight:700;color:var(--ink);}
.ex-steps{margin:0 0 0 32px;padding:0;font-size:13px;color:var(--body);line-height:1.7;}
.ex-outcome{padding:14px 20px;background:color-mix(in srgb,var(--teal) 6%,var(--surface));border-top:1px solid var(--line);}
.ex-outcome-list{margin:4px 0 0 16px;padding:0;font-size:13px;color:var(--body);line-height:1.7;}
.ex-exceptions{padding:14px 20px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--navy2) 4%,var(--surface));}
.ex-exc-list{margin-top:8px;display:flex;flex-direction:column;gap:10px;}
.ex-exc-item{background:var(--surface2);border-radius:var(--rsm);padding:10px 14px;border-left:3px solid var(--teal3);}
.ex-exc-q{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.ex-exc-a{font-size:12px;color:var(--body);line-height:1.6;}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="sidebar-top">
    <div class="brand">
      <div class="brand-mark">M3</div>
      <div><div class="brand-name">Adleta Infor M3</div><div class="brand-sub">Training Portal</div></div>
    </div>
    <nav id="navLinks"></nav>
  </div>
  <div class="sidebar-footer">
    <div class="user-pill">

      [6,"Open Discussion","Each super user names their biggest department workflow and their biggest concern about M3. Capture concerns in the issue log."]],videoUrl:"",quiz:[{q:"Super users are responsible for supporting their department during:",options:["Discovery workshops only","Go-live and the first 90 days","IT testing only","Annual audits"],answer:1},{q:"The Adleta training model ends with:",options:["A written test","A teach-back to the group","A manager sign-off form","A Birst dashboard"],answer:1},{q:"Module ownership means a super user is accountable for:",options:["Entering all data in their module","Supporting their department and escalating issues","Approving all transactions","Writing training documentation"],answer:1}],checklist:["I can name my module and what I own","I understand my responsibilities before, during, and after go-live","I know the training model and what is required for sign-off","I have documented my biggest workflow concern in the issue log"]},{id:"fnd-2",title:"Getting Around M3 — The 6 Things You Need to Know",duration:"2 hours",steps:[[1,"Log In Together","Log in to M3 together. Point out the TST badge (top-right = test environment), the home screen Favorites and Recent, and the company/division indicator. Confirm everyone is in the correct environment.<br><br><div style='font-family:monospace;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;line-height:1.8'><div style='background:#1a7a6d;color:#fff;padding:4px 10px;border-radius:4px;margin-bottom:8px;font-size:11px'>&#9472;&#9472; TOP BAR &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; <span style='float:right'>&#9660; TST = YOU ARE IN TEST</span></div><div style='display:flex;gap:12px'><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:8px;min-width:140px;font-size:11px'><b>LEFT PANEL</b><br>&#128269; Search bar &#8592; type here<br>&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;<br>&#9733; Favorites<br>&nbsp;&nbsp;OIS100<br>&nbsp;&nbsp;CRS610<br>&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;<br>&#128336; Recent</div><div style='background:#fff;border:1px solid #d0d5dd;border-radius:4px;padding:8px;flex:1;font-size:11px'><b>MAIN AREA</b><br><br>&#9733; Favorites &nbsp;&nbsp;&nbsp;&nbsp; &#128336; Recent<br>&nbsp;&nbsp;cmp100 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; CRS610<br>&nbsp;&nbsp;OIS100<br><br><br>Company: 100 CMP100<br>Division: Adleta (100/Blank)<br>User: KBICKERSTA</div></div></div><br><b>Key things to notice:</b> The <b>TST badge</b> in the top right means you are in the test environment — safe to practice. The <b>search bar</b> in the left panel is how you open any program. Your <b>Favorites</b> are shortcuts to programs you use often."],
      [2,"Open a Program by Code","Click the search bar in the left panel (click &#8801; to open it if closed). Type CRS610 and press Enter. Show the program list panel on the right. Navigate to a customer record."],
      [3,"Multiple Programs Open at Once","Open CRS610, then PPS200, then OIS100. Show the tabs at the top &#8212; all three programs are open simultaneously. Explain how to switch between them without losing work."],
      [4,"Panel Navigation","Open CRS610 and look up customer 000382. Point to the panel tabs at the bottom (E, F, G, H, J&#8230;). Click through each and name what it contains. Explain that every program has its own panel set."],
      [5,"Right-Click in a List","From the CRS610 list, right-click any row. Show: Select (Ctrl+1) = open/use it, Change (Ctrl+2) = edit it, Display (Ctrl+4) = read-only. Right-click is the main navigation method in M3."],
      [6,"Lookup Icon","In any field with a &#128269; icon, click it to search. Type part of a name, press Enter, click the result. Demo in both a customer field and an item field."],
      [7,"Add and Change Buttons","Show OIS101 &#8212; the entry row at the bottom with the Add button adds a line. The Change button at the top saves edits to existing lines. These are different from the panel tabs."],
      [8,"Set Up a Favorite","Navigate to a program, right-click the tab or use the star icon. Show how it appears on the home screen under Favorites for quick access."],
      [9,"Issue Log Practice","Show the issue log in Teams/SharePoint. Have each learner submit one test entry: program code, steps to reproduce, question, and business impact. This is how they escalate problems during go-live."]],videoUrl:"",quiz:[{q:"To open a program in M3, you type the program code in:",options:["The URL bar","The left panel search bar","The Settings menu","The Help menu"],answer:1},{q:"In a list view, right-clicking a row and choosing Change does:",options:["Deletes the record","Opens the record for editing","Displays the record read-only","Copies the record"],answer:1},{q:"The panel tabs at the bottom of a program (E, F, G...) represent:",options:["Different companies","Different users logged in","Different data panels for the same record","Different warehouses"],answer:2}],checklist:["I can open any M3 program by typing its code in the search bar","I can navigate panel tabs and name what each contains","I use right-click (not double-click) to Select, Change, and Display records","I can use the lookup icon to search for a customer, supplier, or item","I have submitted a test entry to the issue log"]},{id:"fnd-3",title:"Terminology — What We Call It vs. What M3 Calls It",duration:"1.5 hours",steps:[[1,"M3 Entity Map","Walk the M3 entity map: Customer (CRS610), Supplier (CRS620), Item/Stock Balance (MMS060), Warehouse, Purchase Order (PPS200), Customer Order (OIS100), AP Invoice (APS100), GL Account (GLS040). Show where each lives.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; Terminology &mdash; Adleta Word vs. M3 Word</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What you call it today</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What M3 calls it</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Customer</td><td style='padding:3px 8px;'>Customer</td><td style='padding:3px 8px;'>CRS610</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Supplier / supplier</td><td style='padding:3px 8px;'>Supplier</td><td style='padding:3px 8px;'>CRS620</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>SKU / part number</td><td style='padding:3px 8px;'>Item number</td><td style='padding:3px 8px;'>MMS001</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Stock on hand</td><td style='padding:3px 8px;'>On-hand balance</td><td style='padding:3px 8px;'>MMS060</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Lot / shade / dye lot</td><td style='padding:3px 8px;'>Lot number</td><td style='padding:3px 8px;'>MMS060</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Sales order</td><td style='padding:3px 8px;'>Customer Order (CO)</td><td style='padding:3px 8px;'>OIS100</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Purchase order</td><td style='padding:3px 8px;'>Purchase Order (PO)</td><td style='padding:3px 8px;'>PPS200</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Customer PO number</td><td style='padding:3px 8px;'>Your ref 1</td><td style='padding:3px 8px;'>OIS100/I</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Receiving</td><td style='padding:3px 8px;'>Pre-Receipt / Receipt</td><td style='padding:3px 8px;'>PPS300 / PPS500</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>AP invoice</td><td style='padding:3px 8px;'>Supplier Invoice</td><td style='padding:3px 8px;'>APS100</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Check run</td><td style='padding:3px 8px;'>Payment Proposal</td><td style='padding:3px 8px;'>APS130</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Wire</td><td style='padding:3px 8px;'>WID payment</td><td style='padding:3px 8px;'>APS130</td></tr></table></div>"],
      [2,"Terminology Crosswalk","Review the Terminology Crosswalk &#8212; map Adleta terms to M3 terms. Examples: &quot;vendor&quot; = Supplier, &quot;product/SKU&quot; = Item number, &quot;branch&quot; = Warehouse, &quot;invoice&quot; = AP Invoice or AR Invoice depending on direction."],
      [3,"Procure to Pay Trace","Trace Procure to Pay in M3: PO (PPS200) &#8594; Receiving (PPS300) &#8594; AP Invoice (APS100) &#8594; Three-Way Match &#8594; Payment (APS130). Open each program briefly so they see the flow in action."],
      [4,"Order to Cash Trace","Trace Order to Cash: Customer Order (OIS100) &#8594; Shipment (OIS300) &#8594; AR Invoice &#8594; Cash Receipt (ARS110). Connect the dots between sales, warehouse, and AR."],
      [5,"Teach-Back: Name an Entity","Each super user explains one entity: what it is, which program it lives in, who owns it, and why it matters to their department. No notes allowed &#8212; this is the teach-back portion."]],videoUrl:"",quiz:[{q:"The M3 program for managing customer master records is:",options:["PPS200","CRS610","MMS060","OIS100"],answer:1},{q:"In Adleta terminology, a branch maps to which M3 entity?",options:["Division","Warehouse","Company","Cost Center"],answer:1},{q:"Procure to Pay starts with a PO in PPS200 and ends with:",options:["A customer invoice in OIS300","A cash receipt in ARS110","A supplier payment in APS130","A stock receipt in MMS060"],answer:2}],checklist:["I can name the M3 program for each core entity in my module","I can translate Adleta terms to M3 terms without notes","I can trace Procure to Pay from PO through supplier payment","I can trace Order to Cash from customer order through cash receipt"]},{id:"fnd-4",title:"Foundation Check — Prove You Can Do It",duration:"1.5 hours",steps:[[1,"Navigation Practical","Ask each super user to open three programs relevant to their module using the search bar &#8212; no coaching. Watch for hesitation; note anyone who needs more practice before next session.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; Foundation Check &mdash; Competency Demonstration</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Task</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>You can do it when...</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Open any program</td><td style='padding:3px 8px;'>M3 search bar</td><td style='padding:3px 8px;'>You type the code and press Enter without help</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Find a customer record</td><td style='padding:3px 8px;'>CRS610</td><td style='padding:3px 8px;'>You right-click a row and choose Select</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Look up stock by location</td><td style='padding:3px 8px;'>MMS060</td><td style='padding:3px 8px;'>You enter an item and read On-hand qty correctly</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Enter a sales order header</td><td style='padding:3px 8px;'>OIS100/A</td><td style='padding:3px 8px;'>You enter Customer + CO type and click Next</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Enter an order line</td><td style='padding:3px 8px;'>OIS101/B1</td><td style='padding:3px 8px;'>You fill item, qty, click Add then Change</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Open a PO</td><td style='padding:3px 8px;'>PPS200</td><td style='padding:3px 8px;'>You right-click a row and choose Select</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Navigate to a panel</td><td style='padding:3px 8px;'>Panel tabs at bottom</td><td style='padding:3px 8px;'>You click the correct tab without help</td></tr></table><div style='display:flex;gap:3px;margin-top:10px;flex-wrap:wrap'><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>B</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>E</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700'>F</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>G</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>J</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:3px 10px;font-size:11px;margin-left:auto'>Next &rsaquo;</span></div></div>"],
      [2,"Record Lookup Practical","Ask them to find a specific customer, supplier, and item by number. Then ask them to name 2&#8211;3 key fields on the record. No looking at notes."],
      [3,"Right-Click Practical","Open a list view (e.g., CRS610). Ask them to open a record for editing. Watch that they right-click and choose Change &#8212; not just single-click or double-click."],
      [4,"Entity Explanation","Each super user explains one record type &#8212; what it is, which program, who owns it, why it matters &#8212; in plain language to the rest of the group."],
      [5,"Teach-Back","Each super user explains (3&#8211;5 min) how they would help a department user find the right screen and look up a record. No notes. Grade on clarity and accuracy."],
      [6,"Issue Log Review","Go through all open issues from fnd-1 through fnd-3. Assign owners. Resolve all access blockers before the next module begins."]],videoUrl:"",quiz:[{q:"During the navigation practical, you should open programs:",options:["Using bookmarks a trainer set up","By typing program codes in the search bar without coaching","By asking IT to open them","From the help menu"],answer:1},{q:"To edit a record in a list view, the correct method is to:",options:["Double-click the row","Single-click the row","Right-click and choose Change","Press F5"],answer:2},{q:"A super user is cleared for go-live when they:",options:["Attend all sessions","Pass the teach-back and complete the issue log review","Complete the online quiz only","Get IT approval"],answer:1}],checklist:["I opened three role-relevant programs without coaching","I looked up a customer, supplier, and item and named key fields","I right-clicked correctly to open a record for editing","I completed my teach-back without notes","All my open issues from fnd-1 through fnd-3 are assigned or resolved"]}]},
  purchasing:{id:"purchasing",name:"Purchasing / Procurement",owner:"Alan Burk",weeks:"Week 3",pill:"pill-blue",color:"#2d6fa3",programs:["CRS620","PPS200","PPS201","PPS300","APS100"],summary:"Supplier lookup, purchase orders, receiving handoff, approvals, and three-way match.",links:[["Deck",SP+"/Adleta_M3_Purchasing_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Purchasing_LearningGuide.docx"]],sessions:[{id:"pur-1",title:"Planned PO Release",duration:"45 min",steps:[[1,"Open PPS170 and Set Your Filters","Open PPS170 (Planned Purchase Orders). Set Buyer = your buyer code and Warehouse = the main warehouse. Press Enter. M3 displays the list of planned POs generated by MRP for your buyer code.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; PPS200 &mdash; Purchase Order. Open</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>PO Number</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Supplier</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Item</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Req Del Dt</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Status</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Qty Ordered</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>2300-00101</td><td style='padding:3px 8px;background:#fffbe6;'>CAR Flooring</td><td style='padding:3px 8px;background:#fffbe6;'>ARM51899031</td><td style='padding:3px 8px;background:#fffbe6;'>2026-06-20</td><td style='padding:3px 8px;background:#fffbe6;'>35 Ready</td><td style='padding:3px 8px;background:#fffbe6;'>500 CT</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>2300-00102</td><td style='padding:3px 8px;'>Shaw Industries</td><td style='padding:3px 8px;'>SHW9876543</td><td style='padding:3px 8px;'>2026-06-22</td><td style='padding:3px 8px;'>35 Ready</td><td style='padding:3px 8px;'>200 CT</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>2300-00103</td><td style='padding:3px 8px;'>Mohawk</td><td style='padding:3px 8px;'>MOH1234567</td><td style='padding:3px 8px;'>2026-06-25</td><td style='padding:3px 8px;'>35 Ready</td><td style='padding:3px 8px;'>150 CT</td></tr></table><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Status 35 = Ready to release. Right-click the row &rarr; Select to open and review before releasing.</div></div>"],
      [2,"Review a Planned PO","Click into one planned PO. Review each field: item number, order quantity, supplier, and the system-suggested need date. These are system-generated suggestions — not firm orders yet."],
      [3,"Release Selected POs to Firm Status","Select 2-3 planned POs from the list. Choose Release. M3 converts them to firm purchase orders and assigns a PO number to each. Record the PO numbers."],
      [4,"Verify Released POs in PPS200","Open PPS200. Search for the PO numbers you just released. Verify the PO status shows Released (status 40). The PO is now a firm order ready to be sent to the supplier."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Planned%20PO%20Release.mp4",quiz:[{q:"Planned POs in PPS170 are created by:",options:["The buyer manually","The MRP planning engine based on demand","The supplier sending an ASN","Finance during invoice entry"],answer:1},{q:"After releasing planned POs, you verify them in:",options:["APS100","CRS620","PPS200","PPS300"],answer:2},{q:"A planned PO becomes a firm PO when:",options:["The supplier confirms it","You release it in PPS170","Finance approves the budget","Goods are received"],answer:1}],checklist:["I can open PPS170 and filter by my buyer code","I can review planned PO fields before releasing","I can release selected planned POs to firm status","I can verify released POs appear in PPS200 with status Released"]},{id:"pur-2",title:"Non-Stocking WHS PO — One-Time Exception",duration:"60 min",steps:[[1,"Look Up the Supplier in CRS620","Open CRS620. Search for the supplier number. Verify the supplier name, address, payment terms, and that the status is Active. Record the supplier number — you will need it on the PO. If a supplier is inactive, contact Finance — do NOT create a new record yourself.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; PPS200/A &mdash; Non-Stocking WHS PO &mdash; New Header</div><b>Non-stocking WHS PO = one-time PO for an item NOT in the item master:</b><br><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Supplier<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>e.g. 300001</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>PO type<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>WHS</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Req delivery dt<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>2026-06-30</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Item number</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>(leave blank for free-text line)</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Description</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Office Supplies Q2</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Qty / Price</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>1 / 250.00</span></span></div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; WHS PO type is for one-time non-stock items only. For regular inventory use the standard stocking PO type.</div></div>"],
      [2,"Create a New PO Header in PPS200","Open PPS200. Click the New button to open a blank PO header. Enter the supplier number — M3 auto-fills name, address, and payment terms. Select the non-stock PO type. Enter a requested delivery date and confirm the receiving warehouse is correct. Press Enter — M3 assigns a PO number. Record it."],
      [3,"Add PO Lines in PPS201","After saving the header, M3 opens PPS201. Enter the non-stock item code. Enter the order quantity and confirm the unit of measure. Verify the purchase price against the supplier quote. In the line reference field, enter the business justification for this purchase. Press Enter to save the line."],
      [4,"Check Approval Status","In PPS200, check the PO status. If the PO amount exceeds the approval threshold, the status will show Pending Approval (status 20). Follow up with your manager if no action within 24 hours. Never contact the supplier until the PO is in Released status (status 40)."],
      [5,"Transmit PO to Supplier via PPS310","Open PPS310. Find the PO and select Print/Transmit. Verify the supplier email address is correct. Send the PO. Confirm the supplier received it and record the transmission date in the PO notes."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Non-Stocking%20WHS%20PO%20for%20one%20time%20exception.mp4",quiz:[{q:"Before creating a PO, you must verify the supplier status is:",options:["Pending","Inactive","Active","On hold"],answer:2},{q:"If a supplier is not in M3 or is inactive, you should:",options:["Create a new supplier record yourself","Contact Finance to set up or reactivate the supplier","Use a different supplier instead","Skip the supplier field and proceed"],answer:1},{q:"You should NEVER contact a supplier about a PO until the PO status shows:",options:["Entered (10)","Pending Approval (20)","Released (40)","Invoiced (90)"],answer:2}],checklist:["I can look up a supplier in CRS620 and verify status, terms, and pricing","I can create a non-stock PO header in PPS200 with the correct PO type","I can add PO lines in PPS201 with item, qty, price, and justification reference","I know how to check PO approval status and when it is safe to contact the supplier","I can transmit the PO to the supplier using PPS310"]},{id:"pur-3",title:"Receiving Goods — PPS300 and Three-Way Match",duration:"60 min",steps:[[1,"Open PPS300 and Find the PO","Open PPS300 (Goods Receiving). Enter the PO number. M3 loads all PO lines with their ordered quantities. Verify the supplier name and items match the physical delivery before entering anything.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; PPS300 &mdash; Receive Goods</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>PPS200 PO approved</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>PPS300 Pre-Receipt</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>PPS500 Receipt</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>3-way match APS100</span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Field</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What to enter</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>PO number</td><td style='padding:3px 8px;background:#fffbe6;'>Scan or type &mdash; e.g. 2300-00101</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Delivery note / BOL</td><td style='padding:3px 8px;'>Carrier BOL number</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Qty received</td><td style='padding:3px 8px;'>Count what is physically on the dock</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Location</td><td style='padding:3px 8px;'>Warehouse location &mdash; e.g. CAR</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Lot number</td><td style='padding:3px 8px;'>Shade / dye lot if applicable</td></tr></table><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; PPS300 = Pre-Receipt (records qty before putaway) | PPS500 = Actual Receipt (posts to inventory)</div></div>"],
      [2,"Verify Delivery Note and Enter Receipt Date","Confirm the packing slip or delivery note matches the PO — check supplier name, items, and quantities. Enter today as the receipt date. Enter the delivery note number from the supplier packing slip."],
      [3,"Enter Received Quantities and Lot Numbers","For each PO line, enter the actual quantity received — this may differ from the ordered quantity. For lot-tracked items, enter the lot or serial number from the packing slip before saving. M3 requires lot numbers before it will allow you to save."],
      [4,"Handle a Short Receipt","If you received less than the PO quantity on a line, enter only the actual quantity received. M3 keeps the PO open for the remaining quantity and tracks it automatically. Follow up with the supplier on the outstanding delivery."],
      [5,"Handle an Over-Receipt Attempt","If a delivery contains more than the PO quantity, do NOT receive the excess. M3 will show an error if you enter more than the ordered quantity. Contact Purchasing to create a PO amendment for extra quantity before receiving it."],
      [6,"Confirm the Receipt and Verify Status","Press F5 or click Confirm. M3 updates inventory and creates a receipt record. Open PPS200, find the PO, and verify the status has updated — partially received lines show status 60, fully received show status 80."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215_141931-Meeting%20Recording.mp4",quiz:[{q:"Lot numbers for lot-tracked items must be entered:",options:["After posting the receipt","Only if quantity exceeds 100","Before saving the receipt in PPS300","In APS100, not PPS300"],answer:2},{q:"If you receive less than the PO quantity, M3:",options:["Closes the PO line automatically","Keeps the PO open for the remaining quantity","Creates an error and blocks the receipt","Notifies the supplier automatically"],answer:1},{q:"Never receive goods into M3 that you:",options:["Have already invoiced","Do not physically have in the warehouse","Ordered more than 30 days ago","Received from a non-EDI supplier"],answer:1}],checklist:["I can open PPS300, enter a PO number, and verify PO lines before receiving","I can enter received quantities and lot numbers correctly","I know how to handle a short receipt and where to see the open balance","I know NOT to receive more than the PO quantity without a PO amendment","I can confirm the receipt and verify PO status updated in PPS200"]},{id:"pur-4",title:"Manual Purchase Order — Stocking Item",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2003%202025%20-%20P2P/Bravo%20-%20Mini%20CRP%20P2P%20scenarios-20251203%20Manual%20PO%20Stocking%20Item.mp4",steps:[["1","Verify the Supplier","Open CRS620. Look up the supplier by number or name. Confirm the account is active and payment terms are correct.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; PPS200/A &mdash; Manual Purchase Order &mdash; Stocking Item</div><b>Creating a manual stocking PO from scratch:</b><br><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Supplier<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>300001 &mdash; CAR Flooring</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>PO type<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>100 (standard stocking)</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Req delivery dt<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>2026-07-01</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Facility<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>101</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Warehouse</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>CAR</span></span></div><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; After header, click Next to reach order lines. Enter item, qty, price per line. Click Add per line then Change to save.</div></div>"],["2","Open PPS200","Open PPS200 and select Create to start a new Purchase Order."],["3","Enter PO Header","Enter supplier number, order type, buyer, warehouse, and requested delivery date. Save the header — M3 assigns a PO number."],["4","Add PO Lines in PPS201","M3 opens PPS201. Enter item number, quantity, unit of measure, and price for each item line."],["5","Verify Pricing","Verify pricing on each line against the supplier price agreement in CRS620. Flag any discrepancies before saving."],["6","Save PO Lines","Save all PO lines. Review the PO total."],["7","Submit for Approval if Required","If the PO total exceeds the approval threshold, M3 routes it for approval. Monitor approval status."],["8","Print/Transmit PO to Supplier","Once approved, use PPS310 to print, email, or EDI-transmit the PO to the supplier."],["9","Monitor Until Received","Track PO status in PPS200 until goods are received."]],quiz:[{q:"To create a manual purchase order, you open:",options:["CRS620","OIS100","PPS200","APS100"],answer:2},{q:"Individual item lines are added to a PO in:",options:["PPS200","PPS201","PPS300","CRS620"],answer:1},{q:"To print or transmit a PO to a supplier, you use:",options:["PPS200","PPS201","PPS310","APS100"],answer:2},{q:"Before creating a PO you should verify the supplier is active in:",options:["OIS100","PPS200","CRS620","MMS060"],answer:2}],checklist:["I can look up a supplier in CRS620 and verify their account is active","I can create a manual PO header in PPS200","I can add item lines in PPS201","I can verify pricing against the supplier agreement","I can print/transmit a PO using PPS310"]},{id:"pur-5",title:"PO Management — Cancel, Split, and Notes",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Cancel%20PO%20in%20Status%2035%20Standalone.mp4",steps:[["1","Locate the PO","Open PPS200. Find the PO by PO number, supplier, or status.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; PPS200 &mdash; PO Management &mdash; Cancel, Split, Notes</div><b>Right-click any PO row to see all available actions:</b><br><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>PO Number</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Supplier</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Status</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Req Del Dt</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>2300-00101</td><td style='padding:3px 8px;background:#fffbe6;'>CAR Flooring</td><td style='padding:3px 8px;background:#fffbe6;'>35 Ready</td><td style='padding:3px 8px;background:#fffbe6;'>2026-06-20</td></tr></table><br><div style='background:#fff;border:1px solid #ccc;border-radius:4px;padding:4px 0;display:inline-block;font-size:11px;min-width:180px'><div style='padding:3px 12px;font-weight:700;color:#1a7a6d;background:#e8f4f2'>&#9654; Select &mdash; open</div><div style='padding:3px 12px'>Change &mdash; edit header</div><div style='padding:3px 12px'>Copy &mdash; duplicate PO</div><div style='padding:3px 12px'>Cancel &mdash; cancel PO</div><div style='padding:3px 12px'>Display &mdash; view only</div></div></div>"],["2","Add Notes to a PO","Right-click the PO and select Notes. Enter note text — use notes to document supplier communication, changes, or special instructions. Save."],["3","Split a PO Line","Select the PO line to split. Choose Split from the action menu. Enter the quantity to split off — M3 creates a new line with the split quantity. Use this to manage partial shipments or different delivery dates."],["4","Update Warehouse on a PO Line (Status 35)","Select the PO line. Choose Change. Update the warehouse field. Save."],["5","Update Supplier on a PO","Select the PO header. Choose Change. Update the supplier field (only available in certain statuses). Save."],["6","Cancel a PO in Status 35","Verify that no partial receiving has occurred on this PO. Contact the supplier first to confirm cancellation. Select the PO and choose Cancel from the action menu. Confirm — M3 changes status to Cancelled."],["7","Verify the Cancellation","Confirm the PO status shows as Cancelled. If partial receiving has occurred, the PO cannot be fully cancelled — close it instead."]],quiz:[{q:"PO status 35 in M3 means:",options:["PO is in draft","PO has been released/sent to the supplier","PO is fully received","PO is cancelled"],answer:1},{q:"Before cancelling a PO, you should:",options:["Print the PO first","Verify no partial receiving has occurred and contact the supplier","Change status to 20","Delete all PO lines"],answer:1},{q:"The Split action on a PO line is used to:",options:["Copy the line to a new PO","Divide one PO line into two separate lines","Cancel half the quantity","Move the line to a different supplier"],answer:1},{q:"PO notes are most useful for documenting:",options:["Financial journal entries","Supplier communication, change reasons, and special instructions","Customer order details","Inventory adjustments"],answer:1}],checklist:["I can add notes to a purchase order in PPS200","I can split a PO line into multiple lines","I can cancel a PO in status 35 after verifying no partial receiving","I can update warehouse and supplier on a PO","I know when to cancel vs. close a PO"]},{id:"pur-6",title:"Updating the Supplier on a Purchase Order",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2003%202025%20-%20P2P/Bravo%20-%20Mini%20CRP%20P2P%20scenarios-20251203%20Update%20Supplier%20on%20PO.mp4",steps:[[1,"Open PPS200 and find the PO","In the M3 search bar, type PPS200 and press Enter. Search for the PO by PO number or filter by original supplier. Confirm the PO status — supplier changes are only allowed before the PO is received (status below 50).<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; PPS200/A &mdash; Update Supplier on a Purchase Order</div><b>Right-click the PO &rarr; Change to update supplier info:</b><br><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>PO number</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'>2300-00101</span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Supplier<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'>300002 &mdash; Shaw Industries (changed)</span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Req delivery dt</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'>2026-07-10 (updated)</span></div><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; You can only change the supplier if PO status is below 50 (not yet received).</div></div>"],
[2,"Confirm why the supplier is changing","Before making any change, document the reason: supplier merger, pricing issue, supplier out of stock, or routing to a backup supplier. Add a note to the PO (right-click > Notes) with the reason and date."],
[3,"Select the PO and choose Change","Click the PO header line. Right-click and select Change (or click the lookup icon). The PO header opens in edit mode."],
[4,"Update the Supplier field","In the Supplier field, clear the current supplier number and type the new supplier number. click the lookup icon if you need to search. M3 will update the supplier name and default payment terms automatically."],
[5,"Verify updated supplier fields","After changing the supplier, review: supplier name, payment terms, currency, and default delivery address. Confirm these are correct for the new supplier. Adjust if needed."],
[6,"Update pricing if required","Navigate to the PO lines (PPS201). If the new supplier has different pricing, update the unit price on each line. Verify against the new supplier price agreement in CRS620."],
[7,"Save and re-transmit the PO","Save the PO header changes. Then open PPS310 to transmit the revised PO to the new supplier. Confirm the new supplier received the PO."],
[8,"Cancel or notify the original supplier","If the original supplier was already notified of the PO, contact them to cancel the order. Document this in the PO notes. Update the PO status if the original supplier confirms cancellation."]],quiz:[{q:"The M3 program for supplier/supplier records is:",options:["OIS100","PPS200","CRS620","MMS060"],answer:2},{q:"Supplier price agreements are found in CRS620 under:",options:["The Notes tab","Related → Price Agreements","The Change screen","PPS201"],answer:1},{q:"Who is responsible for creating new supplier records in M3?",options:["The purchasing super user","Any M3 user","Finance/Purchasing admin","The supplier themselves"],answer:2},{q:"Supplier lead time in CRS620 affects:",options:["Customer invoice dates","The recommended PO release date for planned orders","Payroll processing","Inventory cycle counts"],answer:1}],checklist:["I can look up a supplier in CRS620 by number and by name","I can review payment terms, lead time, and price agreements","I know which supplier fields I am authorized to update","I understand the process for requesting new supplier setup","I know how to check EDI settings for a supplier"]},
{id:"pur-7",title:"Pre-Receipts in M3",duration:"35 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/PreReceipt%20Discussion.mp4",steps:[[1,"Enter Expected Shipment Quantities","Open PPS300. Enter the PO number. Instead of entering actual received quantities, enter the expected shipment quantities from the supplier&apos;s advance shipping notice (ASN) or email.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; PPS300 &mdash; Pre-Receipts &mdash; Goods Arriving at Dock</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Truck arrives</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Open PPS300</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter PO + qty + lot</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Save pre-receipt</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Putaway</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Run PPS500</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>PO number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>2300-00101</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Delivery note / BOL</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>BOL-20260610-001</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Qty pre-received<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Count on dock</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Lot number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Shade / dye lot number</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Location</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>CAR (default warehouse)</span></span></div><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Pre-receipt = records goods as arrived but NOT posted to inventory. Run PPS500 after putaway to post.</div></div>"],
      [2,"Enter Lot Numbers Before Arrival","For each line, enter the lot or shade number from the supplier&apos;s emailed shipping notice. Explain: this is done the day before the shipment arrives so the warehouse is ready to receive immediately."],
      [3,"Enter Freight Charges at Header","In the Charge fields at the PO header, enter the freight cost from the supplier&apos;s invoice. M3 prorates the freight cost across all lines automatically &#8212; no manual allocation required."],
      [4,"Save the Pre-Receipt","Save the pre-receipt. Show Alan that the pre-receipt is now on file &#8212; the warehouse only needs to confirm actual quantities on delivery day, not re-enter all the lot and freight data."]],quiz:[{q:"A pre-receipt in PPS300 is entered:",options:["After the goods arrive","The day before the shipment arrives using the ASN","Only by the warehouse team","In APS100"],answer:1},{q:"Freight charges entered at the PO header in a pre-receipt are:",options:["Ignored until the invoice arrives","Prorated across all lines automatically","Added only to the first line","Sent to Birst"],answer:1},{q:"Lot numbers in a pre-receipt come from:",options:["The M3 item master","The supplier advance shipping notice (ASN)","The warehouse label printer","PPS200"],answer:1}],checklist:["I can create a pre-receipt in PPS300 before goods arrive","I can enter lot numbers from the supplier ASN","I can enter freight charges at the header level","I understand that warehouse only confirms quantities on delivery day"]}
,
{id:"pur-8",title:"EDI in Purchasing",duration:"30 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/BRAVO%20EDI%20WebService%20Demo.mp4",steps:[[1,"Review EDI Settings on a Supplier","Open CRS620 for an EDI-enabled supplier. Navigate to Related &#8594; EDI. Show the trading partner ID and which EDI transaction types are enabled: 850 (PO out), 856 (ASN in), 810 (Invoice in).<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; EDI &mdash; Electronic Data Interchange in Purchasing</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Supplier sends 855 PO Ack</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>M3 receives</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>PPS200 updated</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Supplier sends 856 ASN</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>PPS300 created</span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>EDI Transaction</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What it does in M3</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>850 &mdash; Purchase Order</td><td style='padding:3px 8px;'>Outbound: M3 sends PO to supplier</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>855 &mdash; PO Acknowledgement</td><td style='padding:3px 8px;'>Inbound: supplier confirms PO receipt</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>856 &mdash; Advance Ship Notice</td><td style='padding:3px 8px;'>Inbound: supplier confirms shipment + contents</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>810 &mdash; Invoice</td><td style='padding:3px 8px;'>Inbound: supplier invoice sent electronically</td></tr></table><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; EDI transactions process automatically. Your role is to review exceptions where POs did not match or ASNs show qty differences.</div></div>"],
      [2,"Show a PO Transmitted via EDI","Show a PO in PPS200 that was transmitted via EDI (visible in the transmission status field). Explain: when you release a PO for an EDI supplier, M3 sends the 850 transaction automatically."],
      [3,"Show an EDI Auto-Created Pre-Receipt","Show an auto-created pre-receipt in PPS300 that came from a supplier&apos;s 856 ASN. Show that lot numbers are already populated &#8212; the supplier sent them in the ASN so the team didn&apos;t have to key them."],
      [4,"Show an EDI 810 Invoice Match","Open APS100 and show an EDI 810 invoice that arrived automatically. Show the match status &#8212; matched invoices require no action. Show what a match exception looks like and explain the resolution process."]],quiz:[{q:"The EDI transaction that sends a purchase order to the supplier is:",options:["810","856","850","820"],answer:2},{q:"An 856 ASN sent by the supplier creates what in M3?",options:["A new purchase order","An auto-created pre-receipt with lot numbers","A payment proposal","An AP invoice"],answer:1},{q:"An EDI 810 invoice that matches the PO in APS100 requires:",options:["Manual approval by the buyer","No action — it approves automatically","A check to be printed immediately","Escalation to the CFO"],answer:1}],checklist:["I can verify EDI settings on a supplier record in CRS620","I understand the EDI flow: 850 out, 856 in, 810 in","I can show where a PO transmission status appears in PPS200","I know how to handle an EDI 810 match exception in APS100"]}
]},
  inventory:{id:"inventory",name:"Inventory Management",owner:"Alan Burk / Jose Manjarrez",weeks:"Week 4",pill:"pill-teal",color:"#1a7a6d",programs:["MMS060","MMS200","MMS100","MMS150","MMS300"],summary:"Item lookup, stock balances, transfers, adjustments, cycle counts, discrepancy handling.",links:[["Deck",SP+"/Adleta_M3_Inventory_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Inventory_LearningGuide.docx"]],sessions:[{id:"inv-1",title:"Item Lookup and Stock Balance — MMS060 and MMS200",duration:"45 min",steps:[[1,"Look Up an Item in MMS001","Open MMS001 (Item. Open). Enter the item number and press Enter. If you don't know the number, press F4 to search by description or manufacturer name. Review: item name, status (must be Active/20 to transact), basic unit of measure, item category, and stock method.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; MMS001 / MMS200 &mdash; Stock Balance by Location vs. Warehouse Total</div><b>MMS060 Balance Identity</b> &mdash; stock by location AND lot number:<br><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Item number</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Location</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Lot number</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>On-hand</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Allocated</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Available</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>U/M</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>ARM51899031</td><td style='padding:3px 8px;background:#fffbe6;'>CAR-A-01</td><td style='padding:3px 8px;background:#fffbe6;'>LOT-2601</td><td style='padding:3px 8px;background:#fffbe6;'>500</td><td style='padding:3px 8px;background:#fffbe6;'>100</td><td style='padding:3px 8px;background:#fffbe6;'>400</td><td style='padding:3px 8px;background:#fffbe6;'>CT</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>ARM51899031</td><td style='padding:3px 8px;'>CAR-B-02</td><td style='padding:3px 8px;'>LOT-2602</td><td style='padding:3px 8px;'>200</td><td style='padding:3px 8px;'>0</td><td style='padding:3px 8px;'>200</td><td style='padding:3px 8px;'>CT</td></tr></table><br><b>MMS200</b> &mdash; warehouse total only (no lots or locations):<br><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Item number</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Warehouse</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>On-hand total</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Allocated</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Available</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>ARM51899031</td><td style='padding:3px 8px;background:#fffbe6;'>CAR</td><td style='padding:3px 8px;background:#fffbe6;'>700</td><td style='padding:3px 8px;background:#fffbe6;'>100</td><td style='padding:3px 8px;background:#fffbe6;'>600</td></tr></table><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Use MMS060 to see which lot or bin. Use MMS200 for a quick total balance.</div></div>"],
      [2,"Check Warehouse Parameters in MMS080","From the item record, press F15 to open MMS080 (Item Warehouse). Review warehouse-specific parameters: reorder point, safety stock level, and picking location. These settings control how M3 plans and manages this item at each warehouse."],
