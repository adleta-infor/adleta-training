s:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>APS130 Select invoices</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Review proposal</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Approve</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Print checks APS170</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Post to GL</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Payment method<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>CH1 = In-house check</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Pay-thru date<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>All invoices due by this date are selected</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Bank account<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Adleta operating account</span></span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Supplier</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Invoice</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Amount</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Due date</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Selected</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>CAR Flooring</td><td style='padding:3px 8px;background:#fffbe6;'>INV-2026-001</td><td style='padding:3px 8px;background:#fffbe6;'>$12,500.00</td><td style='padding:3px 8px;background:#fffbe6;'>2026-06-15</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989;</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Shaw Industries</td><td style='padding:3px 8px;background:#fffbe6;'>INV-2026-045</td><td style='padding:3px 8px;background:#fffbe6;'>$8,200.00</td><td style='padding:3px 8px;background:#fffbe6;'>2026-06-20</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989;</td></tr></table></div>"],
      [2,"Review the Proposal — Invoice by Invoice","M3 displays all eligible invoices. Review every line: verify vendor name, invoice number, amount, and due date are correct. Look for any invoices that should NOT be in this run — disputed invoices, invoices on hold, or invoices with unresolved match discrepancies."],
      [3,"Remove Exceptions from the Proposal","For any invoice that should not be paid in this run, remove it from the proposal list. Removing an invoice does not void it — it stays open and will appear in future proposals. Document your reason for removal in the notes field."],
      [4,"Approve and Process the Payment Run","Manager reviews and approves the payment proposal. After approval, press F5 to process. M3 generates payment records and marks invoices as paid. Print checks or export ACH files for bank processing. Review before releasing — once payments are processed they cannot be reversed in M3."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Payment%20Proposal%20CH1%20(Check%20in-house).mp4",quiz:[{q:"The due date cutoff in APS200 determines:",options:["When checks are mailed to vendors","Which invoices are included in this payment run","The bank account routing number","The check number sequence to use"],answer:1},{q:"Removing an invoice from a payment proposal in APS200:",options:["Voids the invoice permanently","Leaves it open for future payment runs","Sends a rejection notice to the vendor","Creates a credit memo automatically"],answer:1},{q:"Once payments are processed in APS200 they:",options:["Can be reversed with one click","Cannot be reversed in M3 — errors require manual journal entries","Are automatically emailed to vendors","Are sent to Birst for reporting"],answer:1}],checklist:["I can create a payment proposal in APS200 with correct date, bank code, and due date cutoff","I review every invoice on the proposal before approving — not just the total","I can remove specific invoices from the proposal without voiding them","I understand that payment processing is irreversible in M3 — I review carefully first"]},{id:"fin-4",title:"Holding an AP Invoice — APS205",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20AP%20Display%20(APS205)%20Hold%20Invoice%20.mp4",steps:[[1,"Identify the invoice that needs to be placed on hold","You may need to hold an invoice because: the vendor is disputing the amount, a credit memo is pending, the goods were returned, or the invoice is a duplicate. Get the invoice number and vendor.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; APS205 &mdash; AP Invoice Hold</div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Invoice number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>INV-2026-001</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Supplier<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>300001</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Hold reason</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Dispute / waiting credit memo / manager approval</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Hold until date</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Date when hold expires automatically</span></span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Hold status</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Meaning</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>0 &mdash; No hold</td><td style='padding:3px 8px;background:#fffbe6;'>Invoice included in next payment run</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>1 &mdash; Hold</td><td style='padding:3px 8px;'>Invoice excluded from all payment runs</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>2 &mdash; Approved hold</td><td style='padding:3px 8px;'>Hold approved by manager</td></tr></table><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Always enter a reason for the hold. Auditors review all held invoices monthly.</div></div>"],
[2,"Open APS205 — AP Invoice Display","In the M3 search bar, type APS205 and press Enter. Search for the invoice by vendor number and invoice number. Review the invoice details — amount, due date, PO match status, and current hold status."],
[3,"Select the invoice and choose Hold","With the invoice selected, right-click and select Hold (or use the action menu). M3 prompts for a hold reason or hold code. Select the appropriate reason (dispute, credit pending, duplicate, etc.)."],
[4,"Enter a hold note","In the notes or comment field, enter a clear explanation: why the invoice is on hold, who authorized the hold, and what needs to happen before it can be paid (e.g., waiting for credit memo from vendor, waiting for receiving confirmation)."],
[5,"Confirm the hold is applied","After saving, verify the invoice status in APS205 shows as On Hold. The invoice will not appear in future payment proposals until the hold is removed."],
[6,"Notify the vendor if appropriate","If the hold is due to a dispute, contact the vendor to explain the issue and what they need to provide (corrected invoice, credit memo, proof of delivery). Document the communication in the invoice notes."],
[7,"Monitor the hold and follow up","Review held invoices weekly. If the issue is resolved (credit memo received, receiving confirmed), remove the hold. Open APS205, select the invoice, and choose Release Hold. Add a note that the hold is released and why."],
[8,"Remove the hold when resolved","Once the dispute or issue is resolved, open APS205, find the held invoice, and select Remove Hold. The invoice will now appear in the next payment proposal run on its next due date."]],quiz:[{q:"Invoice holds are managed in which M3 program?",options:["APS100","APS200","APS205","PPS200"],answer:2},{q:"After reversing an invoice, M3 automatically:",options:["Pays the vendor","Creates an offsetting GL entry","Cancels the related PO","Emails the vendor"],answer:1},{q:"A common reason to hold an invoice is:",options:["The vendor is a new account","A price or quantity discrepancy requiring vendor clarification","The warehouse is busy","The PO was cancelled"],answer:1},{q:"After resolving a hold, you must ___ before payment can process:",options:["Create a new invoice","Delete the hold record","Release the hold in APS205","Re-enter the PO"],answer:2}],checklist:["I can place an invoice on hold using APS205","I can release an invoice hold after resolution","I can reverse a posted invoice in APS200","I understand the GL impact of a reversed invoice","I know when to hold vs. reverse an invoice"]},{id:"fin-5",title:"AP Payment Proposal — Wire Transfer (WID)",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Payment%20Proposal%20WID%20(Wire).mp4",steps:[[1,"Identify invoices approved for wire payment","Wire transfers are used for specific vendors (large international suppliers, urgent payments, or vendors who do not accept checks). Confirm which vendors are set up for wire payment in M3 — check with your trainer or AP manager.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; APS130 &mdash; AP Payment Proposal &mdash; Wire Transfer WID</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>APS130 select WID method</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Select invoices</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Approve</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Wire file generated</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Send to bank</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Post to GL</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Payment method<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>WID = Wire Transfer</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Pay-thru date<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>All invoices due by this date</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Bank account<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Adleta wire account</span></span></div><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Wire files must be sent to the bank by the cutoff time. Confirm cutoff with Finance before running.</div></div>"],
[2,"Open APS130 — Supplier Payment Proposal","In the M3 search bar, type APS130 and press Enter. Click the + New button to create a new payment proposal. Set the payment method to WID (Wire) instead of check. Select the correct bank account for wire payments."],
[3,"Set the payment date and filter for wire vendors","Enter the wire payment date. Filter the vendor selection to include only vendors approved for wire payment this run. Set the invoice due date cutoff."],
[4,"Review the wire payment proposal","M3 lists all invoices selected for wire payment. Review each carefully — wire transfers are immediate and difficult to reverse. Verify vendor bank details are on file and correct in M3 before approving."],
[5,"Confirm vendor bank details are current","For each vendor in the proposal, verify in CRS620 that the ACH/wire routing number and account number are correct and current. If bank details are missing or outdated, DO NOT process the wire — contact the vendor to update before proceeding."],
[6,"Get required approval for wire payments","Wire transfers above a certain threshold require additional approval. Confirm the authorization matrix with your AP manager. Do not process large wire payments without the required sign-off."],
[7,"Approve and process the wire proposal","Once all details are verified and approvals are in place, approve the payment proposal. M3 generates the wire transfer file. Submit the file to Fifth Third Bank per the established process."],
[8,"Confirm bank receipt and post in M3","After the bank confirms the wire was sent, post the payment proposal in M3. M3 closes the AP invoices and records the bank outflow. Save the bank wire confirmation for your records."]],quiz:[{q:"Wire payments in M3 use payment method code:",options:["CH1","WC","WID","ACH"],answer:2},{q:"Before running a wire payment proposal, invoices must be:",options:["On hold","Approved and in payable status","Entered today","Matched to a PO"],answer:1},{q:"After confirming the payment proposal in M3, what additional step is required?",options:["Nothing — the wire is sent automatically","Coordinate with Finance to initiate the actual bank transfer","Void the invoices","Print a check"],answer:1},{q:"Wire payment proposals are run from:",options:["PPS200","APS200","APS100","CRS620"],answer:2}],checklist:["I can create an AP wire payment proposal in APS100","I know how to select the correct bank account and payment date","I understand that confirming in M3 does not initiate the actual bank transfer","I can review and confirm a payment proposal before processing","I know the post-wire bank confirmation step"]},{id:"fin-6",title:"Voiding an AP Check",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Void%20Check.mp4",steps:[[1,"Look Up the Check in APS220","Open APS220. Look up the check by vendor number or check number. Review check details: vendor name, check amount, check date, and the list of invoices the check covered. Confirm this is the correct check before proceeding.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; APS170 &mdash; Void AP Check</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Find check in APS170</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Right-click &rarr; Void</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter void date and reason</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>GL reversed automatically</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Invoice returns to open</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Check number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>CHK-000456</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Void date<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Date of void</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Reason</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Lost in mail / incorrect amount / stop payment</span></span></div><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; A voided check creates a reversing GL entry. Finance must be notified of every void for monthly bank reconciliation.</div></div>"],
      [2,"Void the Check","Select the check and choose Void. Enter the void date (today) and select the void reason code. Confirm the void. M3 marks the check as voided."],
      [3,"Verify Invoices Reopened in APS205","Open APS205. Look up the vendor. Verify the invoices that were on the voided check now show as Open again. They are available for the next payment proposal — no data was lost."],
      [4,"Bank Contact Requirement for Lost Checks","IMPORTANT: for a lost or stolen check, Philip must call Fifth Third Bank to issue a stop payment BEFORE voiding in M3. Voiding in M3 does not stop the check at the bank. Both steps are required: (1) call bank to issue stop payment, (2) then void in M3. Doing M3 only leaves a live check at the bank."]],quiz:[{q:"After voiding a check in APS220, the invoices it covered are:",options:["Permanently closed — cannot be paid again","Open again and available for the next payment run","Sent to the vendor as a credit note","Written off to the GL expense account"],answer:1},{q:"To look up a check in payment history you use:",options:["APS100","APS200","APS205","APS220"],answer:3},{q:"For a lost check, BEFORE voiding in M3 you must:",options:["Email the vendor to reissue","Call Fifth Third Bank to issue a stop payment","Create a new check in APS200 first","Post a journal entry in GLS100"],answer:1}],checklist:["I can look up a check by vendor or check number in APS220","I can void a check with the correct void date and reason code","I can verify invoices reopen in APS205 after the void","I know to call Fifth Third Bank for a stop payment BEFORE voiding a lost check in M3"]},
{id:"fin-7",title:"Lockbox and AP Check Printing",duration:"35 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Lockbox%20Demo.mp4",steps:[[1,"Import the Daily Lockbox File in ARS110","Open ARS110 (or the lockbox import menu path). Select the bank account for Fifth Third lockbox. Import today's lockbox file from the bank. M3 processes the file and attempts to match incoming payments to open customer invoices automatically.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; APS170 / Lockbox &mdash; Lockbox Import and Check Printing</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Customer pays bank</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Bank sends lockbox file</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Import into M3</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>M3 matches to invoices</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Unmatched = unapplied cash</span></div><br><br><b>Check printing after payment proposal is approved:</b><br><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Payment proposal<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Select approved proposal</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Printer<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Select check printer</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Check number start<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Next check number in sequence</span></span></div></div>"],
      [2,"Review Matched and Unmatched Items","After import, M3 shows two groups: auto-matched items (M3 applied these to open invoices — no action needed) and unmatched items (payments M3 could not match). For each unmatched item, search for the correct open invoice by customer number or check reference number and apply it manually."],
      [3,"Post the Lockbox Batch","When all items are matched or handled, post the lockbox batch. M3 closes the matched invoices and updates customer AR balances."],
      [4,"Verify Invoices Closed in ARS120","Open ARS120. Look up one of the customers whose payment was in today's lockbox. Verify their invoice is now closed (balance zero). This confirms the cash application posted correctly."]],quiz:[{q:"The lockbox file imported in ARS110 is provided by:",options:["M3 nightly processing","Fifth Third Bank each business day","The customer by email attachment","Birst reporting system"],answer:1},{q:"Auto-matched lockbox items require:",options:["Manual review and approval for each one","No action — M3 matched them correctly","Finance director sign-off","An additional journal entry in GLS100"],answer:1},{q:"After posting the lockbox batch, you verify invoices closed in:",options:["APS130","PPS200","ARS120","GLS200"],answer:2}],checklist:["I can import the daily lockbox file in ARS110 and select the correct bank account","I can distinguish auto-matched items (no action) from unmatched items (need manual application)","I can manually apply an unmatched payment to the correct open invoice","I can post the lockbox batch and verify invoices closed in ARS120"]}
]},
  financeGL:{id:"financeGL",name:"Finance — General Ledger",owner:"Philip Jones",weeks:"Week 6",pill:"pill-red",color:"#c0443b",programs:["GLS040","GLS100","GLS050","GLS910","GLS990"],summary:"Chart of accounts, journal entries, period close, GL inquiry, financial reports.",links:[["Deck",SP+"/Adleta_M3_Finance_GL_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Finance_GL_LearningGuide.docx"]],sessions:[{id:"gl-1",title:"AP and GL Master Data — Account String Setup",duration:"60 min",steps:[[1,"Look Up GL Accounts in GLS040","Open GLS040 (Chart of Accounts). Enter an account number and press Enter to view account details. Review: account type, description, normal balance (debit or credit), and Active status. Use F4 to search by account description. Look up the AP trade payable account and 2-3 expense accounts Philip uses frequently (freight, COGS, overhead).<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; CRS630 &mdash; GL Account Setup &mdash; Account String</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Segment</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Example</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Meaning</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Division</td><td style='padding:3px 8px;'>100</td><td style='padding:3px 8px;'>Adleta main company</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Account</td><td style='padding:3px 8px;'>400000</td><td style='padding:3px 8px;'>Chart of accounts code</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Cost center</td><td style='padding:3px 8px;'>0100</td><td style='padding:3px 8px;'>Department / location</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Project</td><td style='padding:3px 8px;'>(if used)</td><td style='padding:3px 8px;'>Optional project code</td></tr></table><br><b>Setting up a new account in CRS630:</b><br><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Account number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>e.g. 400001</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Account type<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>1=Asset 2=Liability 3=Equity 4=Revenue 5=Expense</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Account name<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Description</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Division<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>100</span></span></div></div>"],
      [2,"Understand Adleta Account Structure","Adleta GL accounts follow this structure: 1XXXXX = Assets, 2XXXXX = Liabilities, 3XXXXX = Equity, 4XXXXX = Revenue, 5XXXXX = Cost of Goods, 6XXXXX = Operating Expenses, 7XXXXX = Other. Philip must know which range his AP and expense accounts fall in."],
      [3,"Look Up Cost Centers","Navigate to the cost center master. Find the list of cost centers and which department each belongs to. Philip must know his cost centers by heart — they are required on every AP invoice entry for correct department coding. Record the cost centers for the departments he works with most."],
      [4,"Build a Full Account String from Scratch","Practice building a complete Adleta account string: Company + Division + Department + GL Account + Cost Center. Build 2-3 valid account strings using real Adleta account numbers provided by your trainer. Never create or modify GL accounts yourself — changes require CFO authorization."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/FINANCE/AP-%20Finance%20Master%20List%20Configuration-20241205_093242-Meeting%20Recording.mp4",quiz:[{q:"GL account master records are maintained in:",options:["APS100","CRS610","GLS040","MMS060"],answer:2},{q:"Adleta GL accounts beginning with 6XXXXX represent:",options:["Revenue accounts","Asset accounts","Operating expense accounts","Liability accounts"],answer:2},{q:"If a new GL account is needed, you should:",options:["Create it yourself in GLS040","Contact the CFO and IT — never create accounts without authorization","Copy an existing account and rename it","Ask IT to duplicate the nearest account number"],answer:1}],checklist:["I can look up any GL account in GLS040 and read its type, description, and status","I understand Adleta's account number ranges (1XXXXX through 7XXXXX)","I know the cost centers for the departments I work with","I can assemble a valid Adleta account string from scratch"]},{id:"gl-2",title:"Change GL Coding and Reverse an AP Invoice — APS200",duration:"45 min",steps:[[1,"Identify the invoice with incorrect GL coding","Get the vendor, invoice number, and the correct account string it should have been coded to. Common reason: invoice was posted to the wrong cost center, department, or GL account.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; APS200 &mdash; Change GL Coding and Reverse AP Invoice</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Find invoice in APS200</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Right-click &rarr; Change GL coding</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter correct account</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Save &rarr; reversing entry posted</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Invoice number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>INV-2026-001</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Original account</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>400000</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Corrected account<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>410000</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Reason / note<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Explain change for audit trail</span></span></div><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; GL changes on paid invoices require Finance manager approval. Always document the reason.</div></div>"],
[2,"Open APS200 — AP Invoice Change","In the M3 search bar, type APS200 and press Enter. Search for the invoice by vendor number and invoice number. Review the current account string (company, division, department, GL account, cost center)."],
[3,"Change the account string on the invoice","Select the invoice line and choose Change. Update the incorrect field — division, cost center, GL account, or department — to the correct value. Verify the new account string is valid. Save."],
[4,"If the invoice is already posted — reverse it instead","If the invoice has already been posted to the GL and the period is still open, you need to reverse it. Select the invoice and choose Reverse (confirm the action with your trainer). M3 creates a reversing entry with negative amounts."],
[5,"Confirm the reversal entry","After reversing, open GLS200 or the GL inquiry to confirm the reversal entry posted. The original debit and the reversal credit should now net to zero in the GL."],
[6,"Re-enter the invoice with correct GL coding","After the reversal, return to APS100 and re-enter the invoice with the correct account string. Enter all the same details (vendor, invoice number, date, amount) but with the corrected coding. Post the corrected invoice."],
[7,"Verify the corrected posting in the GL","Open GLS200 or GL inquiry and look up the affected GL account. Confirm: the original incorrect posting, the reversal, and the corrected posting all appear. The net effect in the wrong account should be zero."],
[8,"Notify your GL accountant","Inform the Controller or GL accountant about the reversal and recode so they are aware of the activity in the GL. Provide the invoice number, original coding, corrected coding, and reason. This supports month-end reconciliation."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20AP%20Display%20(APS200)%20Change%20Acc%20String%20and%20Reverse%20Invoice.mp4",quiz:[{q:"A non-posting account in GLS040 means:",options:["The account is closed","Transactions must be posted to detail accounts below it, not to this account directly","The account requires manager approval","The account is only used for reporting"],answer:1},{q:"In GLS910 you can drill into a transaction to see:",options:["The vendor's contact details","The source document — journal entry, invoice, or payment — that created the posting","The budget for that account","The period close status"],answer:1},{q:"The correct way to find why a GL account balance changed in a period is:",options:["Run a new journal entry","Open GLS910, enter the account and period, and review the transaction detail","Ask IT to run a report","Check the AR aging in ARS300"],answer:1},{q:"Account ranges in the Adleta chart of accounts are organized by:",options:["Alphabetical order","Department name","Account type — assets, liabilities, equity, revenue, expense","Transaction date"],answer:2}],checklist:["I can navigate the chart of accounts in GLS040 and identify account types","I can distinguish between posting and non-posting accounts","I can run a GL inquiry in GLS910 for any account and period","I can drill into a transaction to find its source document","I can export GL inquiry results to Excel"]},{id:"gl-3",title:"Automatic Bank Reconciliation in M3",duration:"45 min",steps:[[1,"Import the Bank Statement File","Navigate to the bank reconciliation menu. Open the import screen. Import the sample bank statement file from Fifth Third Bank. M3 loads the bank transactions and begins comparing them to book entries in M3.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; GLS850 &mdash; Automatic Bank Reconciliation</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Download bank statement</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Import into M3</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>M3 auto-matches</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Review unmatched</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Post reconciliation</span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Status</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Meaning</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Action needed</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Matched</td><td style='padding:3px 8px;background:#fffbe6;'>GL record = bank record</td><td style='padding:3px 8px;background:#fffbe6;'>No action</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>GL only</td><td style='padding:3px 8px;'>In M3 but not on statement</td><td style='padding:3px 8px;'>Outstanding check or deposit in transit</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Bank only</td><td style='padding:3px 8px;'>On statement but not in M3</td><td style='padding:3px 8px;'>Missing entry &mdash; investigate</td></tr></table><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; All unmatched items must be resolved before closing the period.</div></div>"],
      [2,"Review Auto-Matched and Unmatched Items","M3 shows auto-matched items (bank transaction matched to a book entry — no action needed) and two types of unmatched exceptions: (1) bank items with no book entry, and (2) book entries not on the bank statement. Review each exception category."],
      [3,"Manually Match an Exception","Select an unmatched bank item. Use the search to find the corresponding book entry. Link them together to clear the exception from both sides of the reconciliation. Repeat for each unmatched item until the reconciliation is balanced."],
      [4,"Record a Bank Fee as a Journal Entry","For bank fees that appear on the statement but have no book entry in M3, create a journal entry in GLS100. Debit the bank fee expense account. Credit the cash/bank GL account. Post the entry. The fee will now clear on the next reconciliation run."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/FINANCE/Automatic%20Bank%20Reconciliation%20Demo-20240711_140316-Meeting%20Recording.mp4",quiz:[{q:"After importing a bank statement, auto-matched items require:",options:["Manual review and confirmation for each one","No action — M3 already matched them","A journal entry to post them","Finance director approval"],answer:1},{q:"A bank fee on the statement that has no book entry in M3 should be recorded as:",options:["An AP invoice in APS100","Ignored until next month","A journal entry in GLS100","A lockbox item in ARS110"],answer:2},{q:"Outstanding items on the bank side (no book entry) indicate:",options:["A Birst reporting error","Transactions that may need investigation or timing differences","The reconciliation is complete","IT must reset the bank feed"],answer:1}],checklist:["I can navigate to the bank reconciliation menu and import a bank statement file","I can identify auto-matched items vs. unmatched exceptions on both sides","I can manually match an unmatched bank item to its book entry","I can record a bank fee as a journal entry in GLS100 to clear it from the reconciliation"]},{id:"gl-4",title:"AR Debit Note Write Off",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AR%20Debit%20Note%20Write%20Off.mp4",steps:[[1,"Find the Open Debit Note in ARS120","Open ARS120. Enter the test customer number. Find a small open debit note or balance that needs to be written off. Review the amount, invoice date, and aging to confirm it qualifies for write-off under Adleta policy.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; ARS300 &mdash; AR Debit Note Write-Off</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Identify open debit note ARS300</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Manager approves</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Enter write-off</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>GL posts to bad debt expense</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Customer<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>001001</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Invoice / debit note<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Open balance to write off</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Write-off amount<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>$</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>GL account</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Bad debt expense &mdash; confirm with Finance</span></span></div><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Write-offs over $100 require VP Finance approval. Document the approval before posting.</div></div>"],
      [2,"Apply the Write-Off","Right-click the item and select Write Off (or navigate to the write-off program). Select the correct write-off reason code. Select the GL account for write-off expense — confirm with your trainer which account to use. Enter any required notes explaining the write-off."],
      [3,"Post and Verify in ARS120","Post the write-off. Return to ARS120 for the same customer. Verify the debit note is now closed — the balance should show zero. The write-off is complete on the AR side."],
      [4,"Verify the GL Posting in GLS200","Open GLS200. Look up the write-off expense transaction. Confirm you can see the debit to the write-off expense account and the credit to the AR account. The transaction has posted correctly to the GL."]],quiz:[{q:"Open customer balances and debit notes are viewed and managed in:",options:["GLS200","APS100","ARS120","CRS610"],answer:2},{q:"When applying a write-off, the two required selections are:",options:["Vendor number and invoice number","Reason code and GL expense account","PO number and receipt number","Customer email and payment terms"],answer:1},{q:"After posting a write-off, you verify the GL transaction in:",options:["PPS200","OIS100","GLS200","ARS440"],answer:2}],checklist:["I can locate a small open debit note for a test customer in ARS120","I can apply a write-off with the correct reason code and GL expense account","I verify the item is closed (balance zero) in ARS120 after posting","I can confirm the write-off transaction posted correctly in GLS200"]},{id:"gl-5",title:"AR Tickler Notes — Collections Follow-Up",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AR%20Tickler%20Notes.mp4",steps:[[1,"Work the Daily Tickler Queue in ARS440","Open ARS440. Review today's follow-up list. For each customer on the queue, review the previous note before calling. The note tells you what was promised last time, so you do not have to re-explain the situation on every call.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; ARS300 &mdash; AR Tickler Notes &mdash; Collections</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Field</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What to enter</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Customer</td><td style='padding:3px 8px;background:#fffbe6;'>001001 &mdash; Alan Wheelock Floor Coverings</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Note date</td><td style='padding:3px 8px;'>Today</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Note type</td><td style='padding:3px 8px;'>Phone call / email / dispute / promise to pay</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Note text</td><td style='padding:3px 8px;'>Detail: amount discussed, customer response, next action date</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Next action date</td><td style='padding:3px 8px;'>Date to follow up</td></tr></table><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Every customer contact about an overdue balance must be logged here. This creates the audit trail if the account goes to collections.</div></div>"],
      [2,"Review AR Aging While on the Call","Open ARS120 for the same customer. Review their full aging, oldest open invoice, and total outstanding balance while you are on the call (or immediately before). You must know the numbers before calling — do not ask the customer what they owe you."],
      [3,"Document the Call Completely","After each call (or no-answer attempt), enter a complete note: contact name, date, time, what was discussed, amount promised, and promise date. Example: &quot;Called John Smith 6/10/26 at 2pm. Promised $2,450 by 6/13. No answer on 6/10 — left voicemail.&quot;"],
      [4,"Set the Next Follow-Up Date","Set the next follow-up date based on the customer's promise or the next scheduled contact attempt. Save. The note and follow-up date are now saved — ARS440 will surface this customer again on that exact date."],
      [5,"Know the Escalation Path","After 3 calls with no payment, notify Philip's manager or Mike Parsons to authorize a credit hold. Super users do not place credit holds without manager authorization. The credit hold is set in CRS610 — but only after manager approval is confirmed."]],quiz:[{q:"The tickler queue in ARS440 shows:",options:["All open AP invoices for the period","Today's AR collection follow-ups that are due","All unmatched lockbox items","Birst dashboard alerts"],answer:1},{q:"A complete call documentation note must include:",options:["Customer email address only","Contact name, date, amount promised, and next follow-up date","The salesperson name and territory","Only the invoice number and amount due"],answer:1},{q:"After 3 calls with no payment, the next step is:",options:["Write off the balance immediately","Notify management to authorize a credit hold in CRS610","Call every day until paid","Email the customer's CEO directly"],answer:1}],checklist:["I can work the daily tickler queue in ARS440","I review a customer's full AR aging in ARS120 before calling","Every call note includes: contact name, date, amount promised, next follow-up date","I set follow-up dates so customers never fall through the cracks","I know the escalation path: 3 unanswered calls → manager authorization → credit hold in CRS610"]}]},
  logistics:{id:"logistics",name:"Logistics / Transportation",owner:"Abbey Parker",weeks:"Week 5-6",pill:"pill-blue",color:"#5b7fa6",programs:["OIS300","MWS410","MWS420","DRS001","OIS600"],summary:"Carrier setup, delivery management, shipment tracking, freight coordination, and logistics reporting.",links:[["Guide",SP+"/Adleta_M3_Logistics_LearningGuide.docx"]],sessions:[{id:"log-1",title:"Pick and Pack — Will Call Order",duration:"60 min",steps:[[1,"Locate the Will Call Order","Open MWS420. Find the will call order in the pick queue. Show the pick list &#8212; items, quantities, and bin locations. Confirm the order type is Will Call before proceeding.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS300 &mdash; Pick and Pack &mdash; Will Call Order</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Order status 44</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Print pick list OIS300</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Pick items from bin</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Pack</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Confirm MWS410</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Customer picks up</span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>M3 Step</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What happens</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Pick list generated</td><td style='padding:3px 8px;background:#fffbe6;'>OIS300</td><td style='padding:3px 8px;background:#fffbe6;'>Available after order status 44</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Pick confirmed</td><td style='padding:3px 8px;'>MWS410</td><td style='padding:3px 8px;'>Warehouse confirms items picked</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Pack</td><td style='padding:3px 8px;'>MWS420 optional</td><td style='padding:3px 8px;'>Items packed into shipment container</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Issue</td><td style='padding:3px 8px;'>OIS300</td><td style='padding:3px 8px;'>Order status moves to 66 delivered</td></tr></table></div>"],
      [2,"Confirm Pick Quantities","Walk through the picking process in the system: select the order, confirm the quantities picked for each line. Show what to do if a quantity is short &#8212; adjust before saving."],
      [3,"Print the Packing List","Show how to print the packing list for the customer. The packing list goes in or on the box and serves as the customer&apos;s receipt at pickup."],
      [4,"Update Status to Ready for Pickup","Update the order status to ready for pickup. Open OIS100 and show that the order status has advanced &#8212; the customer can now be called to come in."]],videoUrl:"",quiz:[{q:"Will call orders are found for picking in:",options:["OIS100","MWS410","MWS420","PPS300"],answer:2},{q:"The packing list given to the customer at pickup is printed from:",options:["Birst","OIS100 directly","The print function in the picking program","PPS310"],answer:2},{q:"After confirming pick quantities and updating status, the order in OIS100 shows:",options:["Status unchanged","An advanced status showing ready for pickup","A credit hold","A backorder"],answer:1}],checklist:["I can find a will call order in MWS420 and view the pick list","I can confirm pick quantities and adjust for shorts before saving","I can print the packing list for the customer","I can update the order status to ready for pickup and verify it in OIS100"]},{id:"log-2",title:"Common Carrier Shipping — Order to Shipment",duration:"45 min",steps:[[1,"Verify Carrier Assignment","Show a released order in OIS100 with a carrier assigned in the Ship Via field. Show how to update Ship Via if it is incorrect &#8212; right-click the order &#8594; Change, update the field, save.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS300 &mdash; Common Carrier Shipping &mdash; Order to Shipment</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Order status 44</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Pick list created</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Items picked</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Shipment OIS300</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>BOL generated</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Carrier picks up</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Status 66</span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Role in shipping flow</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>OIS300</td><td style='padding:3px 8px;background:#fffbe6;'>Shipment entry &mdash; group orders onto a shipment</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>MWS410</td><td style='padding:3px 8px;'>Pick list confirmation</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>MWS420</td><td style='padding:3px 8px;'>Freight / carrier assignment and BOL</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>OIS300 Issue</td><td style='padding:3px 8px;'>Final step &mdash; posts inventory movement</td></tr></table></div>"],
      [2,"Generate a Bill of Lading","Open the BOL program (DPS100). Show how to generate a BOL for an LTL shipment. Walk through the fields: shipper, consignee, carrier, freight class, and total weight."],
      [3,"Print the Customer Manifest","Open WAR 8 &#8594; C3 (Customer Manifest). Run for today&apos;s date and route. Show the manifest output &#8212; this is the driver&apos;s delivery list and COD collection sheet."],
      [4,"Enter Carrier Tracking Number","Show how to enter a carrier tracking number back into the order in OIS100 after the carrier picks up the shipment. This gives the customer a way to track their delivery."]],videoUrl:"",quiz:[{q:"The carrier assigned to an order is shown in the Ship Via field in:",options:["PPS200","MWS420","OIS100","GLS040"],answer:2},{q:"A Bill of Lading for an LTL shipment is generated in:",options:["OIS100","DPS100","ARS120","PPS310"],answer:1},{q:"The customer manifest showing today's deliveries and COD amounts is found in:",options:["Birst","WAR 8 > C3","OIS300","MWS420"],answer:1}],checklist:["I can verify and update the carrier assignment in OIS100","I can generate a BOL in DPS100 with correct shipper, consignee, and freight class","I can print a customer manifest for today's route","I can enter a carrier tracking number back into the order after pickup"]},{id:"log-3",title:"Carrier Setup and Freight Cost Management — MWS420",duration:"45 min",steps:[["1","Understand carrier master","Every carrier Adleta uses must exist as an active carrier record in M3 before it can be assigned to a delivery. The carrier record controls default service types, freight terms, and contact information.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; MWS420 &mdash; Carrier Setup and Freight Management</div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Carrier<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>UPS / FedEx / SAIA / etc.</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Service type</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Ground / LTL / Express</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Freight terms</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Prepaid / Collect / 3rd party</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Account number</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Adleta carrier account number</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>BOL number</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Auto-generated or manual entry</span></span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Setting</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Where to find it</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Default carrier per customer</td><td style='padding:3px 8px;'>CRS610/G Order Info panel</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Freight cost on order</td><td style='padding:3px 8px;'>OIS101 order line freight field</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>BOL template</td><td style='padding:3px 8px;'>MWS420 carrier setup</td></tr></table></div>"],["2","Open MWS420","Navigate to Warehouse Management > Carrier > MWS420. click the + New button to create a new carrier or enter an existing carrier ID to review."],["3","Review existing carriers","Before adding a new carrier, search for the carrier name to confirm it does not already exist under a different ID. Duplicate carrier records cause reporting errors and split freight history."],["4","Set up a new carrier record","Enter carrier ID, name, contact information, and default service type. Confirm the carrier ID format with IT — Adleta uses a consistent naming convention. Set status to Active."],["5","Configure freight terms","On each delivery you can override the default freight terms. The three main terms are: Prepaid (Adleta pays, cost billed to customer), Collect (customer pays carrier directly), Third Party (billed to a third-party freight account). Confirm which term applies to each customer type."],["6","Review freight cost visibility","If freight costs are captured in M3, open OIS600 and review freight cost by carrier and service type. Identify carriers with higher-than-expected cost per shipment. Flag significant cost increases to management."],["7","Carrier performance tracking","Track on-time pickup rate, damage claims, and tracking accuracy by carrier. If a carrier consistently misses pickups or has high damage rates, document the pattern and raise with management for carrier review."],["8","Keep carrier records current","Update carrier records when contact information or service terms change. Inactivate carriers that are no longer used — do not delete. This preserves freight history for reporting and audit."]],videoUrl:"",quiz:[{q:"Before adding a new carrier in MWS420, you should first:",options:["Call the carrier to confirm they can use M3","Search for the carrier name to confirm it does not already exist under a different ID","Get approval from Finance","Create a test delivery"],answer:1},{q:"Freight terms Collect means:",options:["Adleta pays freight and bills the customer","The customer pays the carrier directly","A third-party account is billed","Freight is included in the product price"],answer:1},{q:"If a carrier consistently misses pickups or has high damage rates, you should:",options:["Immediately delete the carrier from M3","Continue using them until a better option is found","Document the pattern and raise it with management for carrier review","Only use them for low-priority shipments"],answer:2},{q:"When a carrier is no longer used, you should:",options:["Delete the carrier record","Inactivate the carrier — do not delete, to preserve freight history","Leave it active but stop using it","Archive it to SharePoint"],answer:1}],checklist:["I can set up a new carrier record in MWS420 with correct ID, name, service type, and status","I check for duplicate carrier records before creating a new one","I understand the three freight term types — Prepaid, Collect, and Third Party","I can identify freight cost variances in OIS600 and know when to escalate","I track carrier performance — on-time, damage, tracking accuracy — and document patterns","I inactivate unused carriers rather than deleting them to preserve history"]},{id:"log-4",title:"Will Call — Pick, Pack, and Issue",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Pick%20pack%20issue%20WC.mp4",steps:[["1","Receive the Will Call Order","Receive the Will Call order from Customer Service. Order is in picking status in M3.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS300 / MWS410 &mdash; Will Call &mdash; Pick, Pack, and Issue</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Status 44 released</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Print pick list</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Pick from bin</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Pack container</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Confirm MWS410</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Issue OIS300 &rarr; status 66</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Order number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>CO number from OIS100</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Pick location<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>From MMS060 / pick list</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Lot number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Must match allocated lot</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Qty picked<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Confirm against order qty</span></span></div><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Do NOT issue the order until the customer has signed the pickup receipt and (if COD) payment is confirmed.</div></div>"],["2","Print the Pick List","Open the picking program (MWS420 or warehouse picking program). Print or view the pick list for the Will Call order."],["3","Pick Items from Warehouse","Pick items from the warehouse locations per the pick list. Verify item numbers, quantities, and warehouse locations."],["4","Pack the Order","Pack the items for customer pickup. Stage at the Will Call counter or designated staging area."],["5","Confirm Pick Quantities in M3","In M3, confirm the picked quantities for the order. Correct any short picks or substitutions."],["6","Issue the Delivery at Delivery Level","Navigate to the delivery in M3. Issue the delivery at the delivery level — NOT the shipment level. No dock assignment or load building required."],["7","Customer Picks Up","Verify customer identity and order details. Hand over staged goods."],["8","Delivery Confirmed — Inventory Decremented","M3 decrements inventory automatically when the delivery is issued. The order cycle is complete."]],quiz:[{q:"Will Call orders are issued at which level in M3?",options:["Shipment level","Load level","Delivery level","Invoice level"],answer:2},{q:"Why do Will Call orders not require load building?",options:["Will Call orders are too small for load planning","The customer picks up at the warehouse — no truck loading needed","IT disabled load building for Will Call","The warehouse team skips this step"],answer:1},{q:"When is inventory decremented for a Will Call order?",options:["When the pick list is printed","When the customer confirms by phone","When the delivery is issued in M3","At month-end inventory close"],answer:2},{q:"After issuing the Will Call delivery, the next step is:",options:["Create a new order for the customer","Process an AP invoice","The order cycle is complete — inventory is decremented","Submit for supervisor approval"],answer:2}],checklist:["I can locate and print a Will Call pick list in M3","I can confirm pick quantities in M3 after picking","I can issue a Will Call delivery at the delivery level","I understand Will Call does not require load building or dock assignment","I know how to stage orders for customer pickup"]},{id:"log-5",title:"Common Carrier — Shipment Processing",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Common%20carrier%20scenario.mp4",steps:[["1","Receive the Common Carrier Order","Order is released for picking from Customer Service. Confirm delivery method is CC in M3.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px s
