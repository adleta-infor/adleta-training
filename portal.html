ed order's quantity looks wrong. You:","options":["Release it anyway","Don't release it and ask Alan","Delete the item","Change the supplier master"],"answer":1}],"checklist":["I can filter PPS170 to my buyer code","I review each planned order before releasing","I can release a planned order and find the new PO in PPS200"]},{"id":"pur-2","title":"Manual PO — Non-Stock / One-Time Purchase","duration":"60 min","steps":[[1,"Check the Supplier","Press Ctrl+S to open Search and Start, type CRS620, select from the list, and click OK. Find the supplier. Status should be 20-Approved. If not, contact Finance. Don't create suppliers yourself."],[2,"Create the Header","Press Ctrl+S to open Search and Start, type PPS200, select from the list, and click OK. Click + (New). Enter the supplier (name and terms fill in). Pick the order type, warehouse CAR, and requested delivery date. Save; note the PO number."],[3,"Add the Line","On the lines (PPS201) enter the item, quantity, and U/M (CT = cartons for most flooring). Check the price against the supplier quote. If no price pulls, enter the agreed price and note where it came from."],[4,"Approval and Sending","Follow Adleta's approval rule before the PO goes to the supplier.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> Whether Adleta will use a PO approval threshold, and what it is, has not been decided.</div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> How POs are printed or emailed to suppliers at Adleta has not been confirmed. PPS310 is receipt inspection, not PO printing. Confirm the PO output step with Mike.</div>"]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Non-Stocking%20WHS%20PO%20for%20one%20time%20exception.mp4","quiz":[{"q":"Supplier status needed to buy from them:","options":["10","20-Approved","90","Any"],"answer":1},{"q":"A supplier is missing in CRS620. You:","options":["Create it","Contact Finance","Use another supplier","Leave the supplier blank"],"answer":1},{"q":"No price pulls on the PO line. You:","options":["Leave it at zero","Enter the agreed price and note the source","Cancel the PO","Use last year's price"],"answer":1}],"checklist":["I check the supplier is 20-Approved first","I can create a manual PO header and line","I check price against the quote and note manual prices"]},{"id":"pur-3","title":"Receiving Goods — PPS300","duration":"60 min","steps":[[1,"Open PPS300","Press Ctrl+S to open Search and Start, type PPS300, select Purchase Order. Receive Goods from the list, and click OK. Enter the PO number and confirm Warehouse = CAR. Click Apply."],[2,"Check Before You Receive","The lines show Item, Remain (still to receive), Recved qty, and Location. Compare to the packing slip: supplier, items, quantities. Wrong item? Don't receive it."],[3,"Enter What Arrived","Enter the quantity physically on the dock, the delivery note number, and the lot (dye lot) where the item is lot-controlled. Mark complete only if nothing more is coming."],[4,"Short or Over","Short: receive what arrived. Remain stays open for the balance. Over: don't receive the extra; contact Purchasing."],[5,"Post and Check","Post the receipt. Remain drops, and the stock shows in MWS068 at the location and lot you received.<div style='background:#e8f4f2;border:1px solid #9fd0c7;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; PPS310 (Receipt inspection) is used only when received goods must be inspected or approved. Ask your trainer whether any Adleta items need it.</div>"]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215_141931-Meeting%20Recording.mp4","quiz":[{"q":"Receive only what:","options":["Is on the PO","Is physically on the dock","The supplier invoiced","Purchasing expects"],"answer":1},{"q":"After a short receipt, the balance:","options":["Is cancelled","Stays open in Remain","Goes to AP","Is written off"],"answer":1},{"q":"Where can you see the received lot by location?","options":["MWS068","CRS620","OIS100","GLS210"],"answer":0}],"checklist":["I can find a PO in PPS300 and check it against the packing slip","I enter only what arrived, with lot and delivery note","I handle short and over shipments correctly","I can see the received stock in MWS068"]},{"id":"pur-4","title":"Manual PO — Stocking Item","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2003%202025%20-%20P2P/Bravo%20-%20Mini%20CRP%20P2P%20scenarios-20251203%20Manual%20PO%20Stocking%20Item.mp4","steps":[[1,"Check for an Existing PO First","Press Ctrl+S to open Search and Start, type PPS220, select Purchase Order. Display Lines from the list, and click OK. Search open lines for the supplier and item so you don't double-order. Then check MMS080 for the item: maybe a PO is already coming."],[2,"Check the Supplier-Item Setup","Press Ctrl+S to open Search and Start, type PPS040, select Supplier. Connect Item from the list, and click OK. Look at the supplier's item number, lead time, and purchase price. PPS100 holds purchase agreements (agreed prices)."],[3,"Create the PO","In PPS200 click + (New). Supplier, order type B01, warehouse CAR, delivery date. Save, note the PO number, then add the lines in PPS201."],[4,"Check Price on Every Line","The price should pull from the supplier-item setup or agreement. If it doesn't match the quote, flag it to Alan before sending."],[5,"Why Wasn't It Planned?","If M3 didn't suggest this purchase for a stocking item, the planning settings may be off (MMS002). Tell Alan rather than creating manual POs over and over.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> Whether Adleta will use a PO approval threshold, and what it is, has not been decided.</div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> How POs are printed or emailed to suppliers at Adleta has not been confirmed. PPS310 is receipt inspection, not PO printing. Confirm the PO output step with Mike.</div>"]],"quiz":[{"q":"Before creating a manual PO you check:","options":["PPS220 and MMS080 for existing supply","GLS200","OIS350","Nothing"],"answer":0},{"q":"Supplier item numbers and lead times live in:","options":["PPS040","OIS002","CRS610","MWS410"],"answer":0},{"q":"Purchase agreements (agreed prices) are in:","options":["PPS100","OIS120","ARS200","MMS310"],"answer":0}],"checklist":["I check PPS220 and MMS080 before buying","I can read supplier-item data in PPS040 and agreements in PPS100","I can create a stocking PO and check every line price"]},{"id":"pur-5","title":"Changing a PO — Lines, Notes, and Cancelling","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Cancel%20PO%20in%20Status%2035%20Standalone.mp4","steps":[[1,"Find the PO","Press Ctrl+S to open Search and Start, type PPS200, select from the list, and click OK. Filter by supplier and buyer, or use PPS220 to search lines. Open the lines (PPS201)."],[2,"Change a Line","Right-click the line and choose Change to update quantity or date. A line with a receipt posted can't be cancelled directly. Close it instead."],[3,"Add a Note","Use the PO text/notes option. External notes print on what goes to the supplier; internal notes stay in M3. Use external for delivery instructions.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Confirm where the notes option is on Adleta's screens (Actions or Options menu).</div>"],[4,"Cancel","Call the supplier first. Then cancel the line or PO. If anything was received, close the remainder instead of cancelling.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> PO status numbers haven't been confirmed on Adleta's screens yet. Read the lowest/highest status columns in PPS200 and PPS220 and confirm what each number means with your trainer. Don't rely on a number from an old handout.</div>"]],"quiz":[{"q":"A line already has a receipt. You:","options":["Cancel it","Close the remainder instead","Delete the PO","Change the supplier"],"answer":1},{"q":"Delivery instructions for the supplier go in:","options":["An external note","An internal note","The item master","Nowhere"],"answer":0},{"q":"Before cancelling a PO:","options":["Call the supplier","Tell AR","Run MRP","Nothing"],"answer":0}],"checklist":["I can find and change PO lines","I know external vs internal notes","I call the supplier before cancelling","I close received lines instead of cancelling"]},{"id":"pur-6","title":"Supplier Records and Changing the Supplier on a PO","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2003%202025%20-%20P2P/Bravo%20-%20Mini%20CRP%20P2P%20scenarios-20251203%20Update%20Supplier%20on%20PO.mp4","steps":[[1,"Read the Supplier","Press Ctrl+S to open Search and Start, type CRS620, select Supplier. Open from the list, and click OK. Status must be 20-Approved. Purchase and financial settings (buyer, payment terms) are in CRS624."],[2,"Supplier-Item and Agreements","PPS040 holds supplier item numbers, lead times, and purchase prices. PPS100 holds purchase agreements. The planned orders in PPS170 go to the buyer set on the supplier."],[3,"Changing the Supplier on a PO","Only before anything is received. Document why (note on the PO). Change the supplier on the header, then check terms and every line price for the new supplier.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Whether changing the supplier on an existing PO is allowed at Adleta, or whether the PO should be cancelled and re-created, needs confirming on screen.</div>"],[4,"Tell Both Suppliers","Send the PO to the new supplier and tell the original supplier it's cancelled. Note both in the PO text.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> How POs are printed or emailed to suppliers at Adleta has not been confirmed. PPS310 is receipt inspection, not PO printing. Confirm the PO output step with Mike.</div>"]],"quiz":[{"q":"Supplier buyer and payment terms are in:","options":["CRS624","OIS100","MMS001","GLS100"],"answer":0},{"q":"A new supplier is needed. Who sets it up?","options":["Any buyer","Finance","The warehouse","The supplier"],"answer":1},{"q":"You can change the supplier on a PO:","options":["Anytime","Only before anything is received","Only after invoicing","Never"],"answer":1}],"checklist":["I can check supplier status, buyer, and terms","I know where supplier-item data and agreements live","I document and re-check prices when changing a supplier"]},{"id":"pur-7","title":"Supplier Delivery Notes and Containers — PPS260 and PPS360","duration":"45 min","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/PreReceipt%20Discussion.mp4","steps":[[1,"What These Programs Do","<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>PPS260</td><td style='padding:3px 8px;'>PO delivery notes / advise</td><td style='padding:3px 8px;'>Connect a supplier delivery note to the PO</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>PPS360</td><td style='padding:3px 8px;'>Delivery notes waiting to be received</td><td style='padding:3px 8px;'>Supplier shipment / container manifests</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Both names come from training videos, not Infor's manuals. Check them on screen.</div>"],[2,"Record the Delivery Note Ahead of Time","When a supplier sends shipping details before the truck arrives, connect the delivery note to the PO in PPS260 with the quantities and lots on the notice. Receiving is faster on delivery day."],[3,"See What's Coming","PPS360 lists delivery notes that are waiting to be received, such as container manifests. Use it to plan the dock."],[4,"Nothing Is On Hand Yet","A delivery note is a record only. Stock doesn't change until the goods are received in PPS300."]],"quiz":[{"q":"A delivery note recorded in PPS260:","options":["Adds stock","Is a record only until received in PPS300","Pays the supplier","Cancels the PO"],"answer":1},{"q":"Where do you see delivery notes waiting to be received?","options":["PPS360","OIS300","APS200","CRS610"],"answer":0},{"q":"Stock goes on hand when:","options":["The ASN arrives","The receipt is posted in PPS300","The PO is created","AP pays"],"answer":1}],"checklist":["I can connect a supplier delivery note to a PO","I can see incoming deliveries in PPS360","I know stock only changes at receipt in PPS300"]},{"id":"pur-8","title":"Following a PO — Confirmations and History","duration":"45 min","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/BRAVO%20EDI%20WebService%20Demo.mp4","steps":[[1,"Find POs and Their Status","Press Ctrl+S to open Search and Start, type PPS220, select Purchase Order. Display Lines from the list, and click OK. Filter by supplier, buyer, or item. This is the fastest way to see what's open.<div style='background:#e8f4f2;border:1px solid #9fd0c7;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; On 21 Oct 2026 PPS220 opened with \"Sorting option X9 of MPLINE is inactive. Activate it in (CRS021).\" It needs that setup before it can be used.</div>"],[2,"Record the Supplier's Confirmation","Press Ctrl+S to open Search and Start, type PPS250, select Purchase Order. Confirm from the list, and click OK. When the supplier confirms a PO (dates, quantities), record it here so planning uses the confirmed date."],[3,"Check PO History","Press Ctrl+S to open Search and Start, type PPS330, select from the list, and click OK. Purchase order transactions show what happened on a PO and when.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> PPS330's name comes from training videos. Check it on screen.</div>"],[4,"Trace the Whole Cycle","PPS170 (planned) → PPS200 (PO) → PPS250 (confirmed) → PPS300 (received) → AP matches the invoice in APS100.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> PO status numbers haven't been confirmed on Adleta's screens yet. Read the lowest/highest status columns in PPS200 and PPS220 and confirm what each number means with your trainer. Don't rely on a number from an old handout.</div>"],[5,"EDI","Some suppliers may send confirmations, ship notices, and invoices electronically.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> Which Adleta suppliers will be on EDI has not been confirmed.</div>"]],"quiz":[{"q":"To find open PO lines fast, use:","options":["PPS220","OIS301","GLS210","MMS310"],"answer":0},{"q":"A supplier confirms new dates. Record it in:","options":["PPS250","PPS390","CRS610","OIS120"],"answer":0},{"q":"The PO cycle in order is:","options":["PPS300 → PPS200 → PPS170","PPS170 → PPS200 → PPS250 → PPS300","APS100 → PPS200","OIS100 → PPS300"],"answer":1}],"checklist":["I can find PO lines in PPS220","I can record a supplier confirmation in PPS250","I can trace a PO from plan to receipt"]},{"id":"pur-9","title":"Returning Goods to a Supplier — PPS390","duration":"45 min","steps":[[1,"When to Use It","Wrong item, damaged on arrival but already received, or an agreed return to the supplier. Get the supplier's return authorization first."],[2,"Open PPS390","Press Ctrl+S to open Search and Start, type PPS390, select from the list, and click OK. Find the PO and receipt the goods came in on.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> PPS390 (return to supplier / supplier claim) comes from training videos. Walk through it on screen with your trainer before teaching it.</div>"],[3,"Enter the Return","Enter the item, quantity, and lot going back. Save. Stock leaves the location."],[4,"Tell AP","AP needs to know to expect a supplier credit. Give them the PO, receipt, and return details."]],"videoUrl":"","quiz":[{"q":"Before returning goods to a supplier:","options":["Get their return authorization","Delete the PO","Change the customer","Nothing"],"answer":0},{"q":"Supplier returns are entered in:","options":["PPS390","OIS100 C05","MMS310","APS100"],"answer":0},{"q":"After a supplier return, tell:","options":["AP, so they expect a credit","The customer","IT","Nobody"],"answer":0}],"checklist":["I get return authorization first","I can enter a supplier return in PPS390 with my trainer","I tell AP to expect a credit"]}]},"inventory":{"id":"inventory","name":"Inventory and Stock Control","owner":"Alan Burk / Jose Manjarrez","weeks":"Week 4","pill":"pill-teal","color":"#1a7a6d","programs":["MMS001","MMS200","MMS002","MWS068","MMS060","MWS070","MMS235","MMS310","MMS100","MMS101","MMS080"],"summary":"Item and stock lookups, lots and rolls by location, stock history, count corrections, transfers between warehouses, and planning settings.","links":[["Deck","resources/adleta-m3-inventory-training-deck.html"],["Guide","resources/adleta-m3-inventory-learningguide.html"]],"sessions":[{"id":"inv-1","title":"Item and Stock Lookup — MMS001, MMS200, MMS002, MWS068","duration":"45 min","steps":[[1,"The Inventory Programs","<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS001</td><td style='padding:3px 8px;'>Item. Open</td><td style='padding:3px 8px;'>Look up an item</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS200</td><td style='padding:3px 8px;'>Item. Open Toolbox</td><td style='padding:3px 8px;'>Search items</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS002</td><td style='padding:3px 8px;'>Item. Connect Warehouse</td><td style='padding:3px 8px;'>Item in a warehouse: on hand, planning, issue multiple</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MWS068</td><td style='padding:3px 8px;'>Balance Identity. Open Toolbox</td><td style='padding:3px 8px;'>Exactly which rolls / lots are where</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS060</td><td style='padding:3px 8px;'>Balance Identity. Open</td><td style='padding:3px 8px;'>One roll or lot in detail</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MWS070</td><td style='padding:3px 8px;'>Stock Transaction. Display History</td><td style='padding:3px 8px;'>What moved, when, by whom</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS310</td><td style='padding:3px 8px;'>Physical Inventory. Quick Entry</td><td style='padding:3px 8px;'>Count corrections / stock adjustments</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS100 / MMS101</td><td style='padding:3px 8px;'>Req/Distr Order. Open / Open Lines</td><td style='padding:3px 8px;'>Transfers between warehouses</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"Find the Item","Press Ctrl+S to open Search and Start, type MMS200, select Item. Open Toolbox from the list, and click OK. Filter Warehouse = CAR and the item number (or part of the name). Check item type and status (20 = can be transacted). MMS001 opens the full item record."],[3,"Item in a Warehouse","Press Ctrl+S to open Search and Start, type MMS002, select Item. Connect Warehouse from the list, and click OK. Shows the item at one warehouse: on hand, planning settings, and issue multiple (the quantity it must be sold in)."],[4,"Which Lot, Which Location","From MMS200 right-click the item → Related → Balance Identity (MWS068). Each line is a location + lot with its on-hand quantity. This is where you answer \"do we have it in that dye lot?\""],[5,"On Hand Isn't Available","Stock already allocated to orders is not available to promise. In order entry, Item search shows what's available by warehouse (green = available)."]],"videoUrl":"","quiz":[{"q":"Which program shows exactly which rolls / lots are where?","options":["MWS068","MMS001","OIS100","PPS200"],"answer":0},{"q":"Item settings for one warehouse (on hand, issue multiple) are in:","options":["MMS002","CRS610","MWS420","GLS100"],"answer":0},{"q":"To promise stock to a customer, use:","options":["On hand","Available","Last receipt","Reorder point"],"answer":1}],"checklist":["I can find an item in MMS200 and open MMS001","I can read MMS002 for one warehouse","I can find lot and location in MWS068","I promise available, not on hand"]},{"id":"inv-2","title":"Tracing Stock — Lots, Rolls, and History","duration":"45 min","steps":[[1,"One Roll or Lot in Detail","Press Ctrl+S to open Search and Start, type MMS060, select from the list, and click OK. Open a single balance identity to see that roll or lot in detail and trace containers.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> MMS060's name comes from training videos. Check it on screen.</div>"],[2,"Lot Master","MMS235 holds the lot (dye lot) master and dates. Use it when a customer asks about a specific dye lot."],[3,"What Moved, When, by Whom","Press Ctrl+S to open Search and Start, type MWS070, select Stock Transaction. Display History from the list, and click OK. Filter by item and warehouse. Every receipt, pick, adjustment, and transfer shows with date and user."],[4,"Find a Discrepancy Before You Fix It","If MWS068 says stock is there and you can't find it, check MWS070 for the last movement before doing anything. Log what you find. Never cover a discrepancy with a move or adjustment."]],"videoUrl":"","quiz":[{"q":"Stock transaction history is in:","options":["MWS070","OIS350","PPS250","CRS620"],"answer":0},{"q":"Dye lot master and dates are in:","options":["MMS235","MMS310","OIS002","APS200"],"answer":0},{"q":"You can't find stock that M3 shows. First:","options":["Adjust it out","Check MWS070 history and log it","Move it to another location","Ignore it"],"answer":1}],"checklist":["I can open one roll or lot in MMS060","I can read stock history in MWS070","I investigate before correcting stock"]},{"id":"inv-3","title":"Count Corrections — MMS310","duration":"60 min","steps":[[1,"When to Correct Stock","After a count shows a difference that history (MWS070) doesn't explain, damage that must come out of stock, or a receiving error. Get approval first, per Adleta's rule.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> The dollar threshold for adjustment approval hasn't been set for M3.</div>"],[2,"Open MMS310","Press Ctrl+S to open Search and Start, type MMS310, select Physical Inventory. Quick Entry from the list, and click OK. Enter warehouse, item, location, and lot."],[3,"Enter the Counted Quantity","Enter what's physically there. M3 shows the difference from the book balance. Check it before confirming.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Reason codes on adjustments have not been confirmed for Adleta. Use what your trainer gives you.</div>"],[4,"Confirm and Check","Confirm. Check MWS068 shows the new balance and MWS070 shows the adjustment."],[5,"Tell Finance About Write-Offs","Damage and shrink write-offs have a cost. Tell Finance the same day."]],"videoUrl":"","quiz":[{"q":"Count corrections are entered in:","options":["MMS310","MMS100","PPS300","OIS101"],"answer":0},{"q":"Before correcting stock you should:","options":["Check MWS070 and get approval","Just enter it","Move stock to cover it","Delete the lot"],"answer":0},{"q":"After the correction, check:","options":["MWS068 and MWS070","CRS620","GLS990","OIS350"],"answer":0}],"checklist":["I check history and get approval before correcting","I can enter a count correction in MMS310","I verify the result in MWS068 and MWS070","I tell Finance about write-offs"]},{"id":"inv-4","title":"Transfers Between Warehouses — MMS100 and MMS101","duration":"60 min","steps":[[1,"Distribution Orders","Moving stock between Adleta warehouses (Carrollton, Little Rock, Lenexa) is done with a distribution order: MMS100 (header) and MMS101 (lines). It's picked and shipped like a customer order, then received at the other end.<div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"Create the Order","Press Ctrl+S to open Search and Start, type MMS100, select Req/Distr Order. Open from the list, and click OK. Enter the from and to warehouses and the date needed. Save."],[3,"Add the Lines","In MMS101 enter item and quantity. Check the from warehouse has available stock (MMS002 / MWS068)."],[4,"Follow It","The sending warehouse releases and picks it (MWS410 / MWS420); the receiving warehouse receives it. Check both balances afterwards.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> The receiving step for distribution orders at Adleta hasn't been walked through on screen yet.</div>"],[5,"Moves Inside One Warehouse","Moving stock between bins in the same warehouse is a different task.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> The program Adleta will use for bin-to-bin moves isn't on the program list yet. Ask Mike.</div>"]],"videoUrl":"","quiz":[{"q":"Transfers between warehouses use:","options":["MMS100 / MMS101 distribution orders","MMS310","OIS100","PPS200"],"answer":0},{"q":"Before adding a transfer line, check:","options":["Available stock in the from warehouse","GL balance","Customer credit","Nothing"],"answer":0},{"q":"A distribution order is picked using:","options":["MWS410 / MWS420","APS100","CRS620","GLS100"],"answer":0}],"checklist":["I can create a distribution order in MMS100 / MMS101","I check available stock first","I know it's picked and received like other deliveries"]},{"id":"inv-5","title":"Supply, Demand, and Planning Settings — MMS080 and MMS002","duration":"45 min","steps":[[1,"When Is Stock Coming?","Press Ctrl+S to open Search and Start, type MMS080, select Material Plan. Open from the list, and click OK. Enter item and warehouse. You'll see supply (POs, transfers) and demand (orders) by date, and the projected balance."],[2,"Planning Settings","MMS002 holds the planning settings for the item in that warehouse: reorder point, order quantity, safety stock. These drive the planned POs in PPS170."],[3,"Changing Settings","Only the buyer/inventory owner changes them. Change, save, then reopen to confirm the new value saved."],[4,"Check the Effect","After a change, the next planning run should reflect it in MMS080 and PPS170.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> When Adleta's planning run happens (and whether it's automatic) hasn't been confirmed.</div>"]],"videoUrl":"","quiz":[{"q":"Supply and demand by date for an item:","options":["MMS080","MWS070","OIS350","CRS620"],"answer":0},{"q":"Reorder point and order quantity live in:","options":["MMS002","OIS100","PPS390","GLS200"],"answer":0},{"q":"Planning settings drive:","options":["Planned POs in PPS170","Customer invoices","AR aging","Cash desk"],"answer":0}],"checklist":["I can read MMS080 to answer \"when is it coming\"","I know planning settings are in MMS002","I check the change saved and shows in planning"]}]},"logistics":{"id":"logistics","name":"Warehouse, Shipping, and Routes","owner":"Abbey Parker","weeks":"Week 5-6","pill":"pill-blue","color":"#5b7fa6","programs":["MWS410","MWS420","MWS422","DRS100","MWS068","MWS070","DRS005","DRS006","DRS011","DRS016","CRS070","MMS008"],"summary":"Releasing deliveries for picking, reporting picks, building truck loads, will call pickup, delivery questions, and route setup.","links":[["Guide","resources/adleta-m3-logistics-learningguide.html"]],"sessions":[{"id":"log-1","title":"The Delivery Toolbox — MWS410","duration":"60 min","steps":[[1,"Warehouse Programs","<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MWS410</td><td style='padding:3px 8px;'>Delivery. Open Toolbox</td><td style='padding:3px 8px;'>Every delivery: release for picking, stops (C10), dock door</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MWS420</td><td style='padding:3px 8px;'>Picking List. Report</td><td style='padding:3px 8px;'>Report picked quantities</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MWS422</td><td style='padding:3px 8px;'>Picking List. Report Lines</td><td style='padding:3px 8px;'>Pick list line detail</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>DRS100</td><td style='padding:3px 8px;'>Shipment. Open</td><td style='padding:3px 8px;'>Build and close truck loads</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MWS068</td><td style='padding:3px 8px;'>Balance Identity. Open Toolbox</td><td style='padding:3px 8px;'>Stock by location, lot, and roll</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MWS070</td><td style='padding:3px 8px;'>Stock Transaction. Display History</td><td style='padding:3px 8px;'>What moved, when, by whom</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"Find Deliveries","Press Ctrl+S to open Search and Start, type MWS410, select Delivery. Open Toolbox from the list, and click OK. Set Warehouse = CAR and Apply. Columns: Dely no, Consignee, Dmt (delivery method), Order no, status."],[3,"Read the Delivery Method","OT = Our Truck, WC = Will Call, CC = common carrier. It tells you how the delivery leaves the building."],[4,"Release for Picking","A new customer order sits here at 0-Release (the order shows 33-ALLOCATED in OIS300). Releasing it creates the pick list; OIS300 then shows 44-PICK RELEASED. Release is a manual step in the warehouse, not part of order entry."],[5,"Stops and Dock Doors","A delivery can carry a stop. <b>C10 \"delivery not paid\"</b> means a prepay order waiting for payment at the cash desk. Don't try to work around it. The dock door is also set here."]],"videoUrl":"","quiz":[{"q":"Where do you release a delivery for picking?","options":["MWS410","OIS100","PPS300","CRS610"],"answer":0},{"q":"Stop C10 on a delivery means:","options":["Short stock","Prepay order not yet paid","Credit hold","Wrong address"],"answer":1},{"q":"WC on a delivery means:","options":["Will Call","Warehouse Count","Wire Check","Weight Class"],"answer":0}],"checklist":["I can find deliveries in MWS410 by warehouse","I can read delivery method and status","I know release for picking is a manual warehouse step","I recognize a C10 stop"]},{"id":"log-2","title":"Picking — Reporting Picked Quantities in MWS420 / MWS422","duration":"45 min","steps":[[1,"Open the Pick Lists","Press Ctrl+S to open Search and Start, type MWS420, select Picking List. Report from the list, and click OK. Set Warehouse = CAR, pick status, and today's date. Apply."],[2,"Read the List","Columns: Dely no, Sfx, Sz, print date and time, pick time, Picker. MWS422 shows the line detail."],[3,"Pick and Report","Pick from the location and lot on the pick list. Report the quantity actually picked. Short? Report what you picked; don't report what you didn't."],[4,"Lot Matters","For dye-lot items, pick the lot on the list. A different lot can't be swapped in without checking with CS."]],"videoUrl":"","quiz":[{"q":"Picked quantities are reported in:","options":["MWS420","OIS101","PPS201","GLS100"],"answer":0},{"q":"Pick list line detail is in:","options":["MWS422","MMS001","OIS002","ARS200"],"answer":0},{"q":"You can only find 8 of 10 on the pick list. You report:","options":["10","8","0","Nothing"],"answer":1}],"checklist":["I can open and filter pick lists in MWS420","I report what was actually picked","I pick the lot on the list"]},{"id":"log-3","title":"Truck Loads — DRS100 Shipments","duration":"45 min","steps":[[1,"What a Shipment Is","A shipment is a truck load: the deliveries going out together on a route. DRS100 is where loads are built and closed.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> DRS100's name and the load-building steps come from training videos. Walk through them on screen with your trainer.</div>"],[2,"Build the Load","Press Ctrl+S to open Search and Start, type DRS100, select from the list, and click OK. Find the shipment for the route and date. Check the deliveries on it match what's staged for the truck."],[3,"Check Before It Leaves","Every delivery on the load should be picked and reported. Anything with a stop (like C10) shouldn't be on the truck."],[4,"Close the Load","Close the shipment when the truck is loaded. This is what moves the deliveries on toward invoicing."]],"videoUrl":"","quiz":[{"q":"Truck loads are built in:","options":["DRS100","OIS300","PPS300","CRS620"],"answer":0},{"q":"A delivery with a C10 stop should:","options":["Go on the truck","Stay off until paid","Be cancelled","Be re-entered"],"answer":1},{"q":"Before closing the load, every delivery should be:","options":["Picked and reported","Invoiced","Quoted","Credited"],"answer":0}],"checklist":["I can find a shipment in DRS100","I check every delivery is picked and has no stop","I can close a load with my trainer"]},{"id":"log-4","title":"Will Call — Release, Pick, and Hand Over","duration":"1 hour","steps":[[1,"The Will Call Order","CS enters the order with delivery method WC. It shows in MWS410 like any other delivery."],[2,"Paid First?","If the customer is on a pay-first term, the delivery shows C10 until the cash desk takes payment in OIS215. Don't release or hand over until the stop is gone."],[3,"Release and Pick","Release in MWS410, pick from the pick list, report the pick in MWS420, and stage it at the counter."],[4,"Hand Over","Check the customer and order number, hand over the goods. Issue the delivery so stock is relieved.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> The exact issue step for will call at Adleta hasn't been confirmed on screen.</div>"]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Pick%20pack%20issue%20WC.mp4","quiz":[{"q":"A will call delivery shows C10. You:","options":["Hand over anyway","Wait until the cash desk takes payment","Cancel it","Change the terms"],"answer":1},{"q":"Will call deliveries are found in:","options":["MWS410","PPS220","GLS200","CRS620"],"answer":0},{"q":"After picking, report the pick in:","options":["MWS420","OIS215","APS100","MMS080"],"answer":0}],"checklist":["I find will call deliveries in MWS410","I wait for payment on C10 deliveries","I release, pick, report, and stage will call orders"]},{"id":"log-5","title":"Delivery Questions and Common Carrier","duration":"45 min","steps":[[1,"Where Is the Delivery?","Start in OIS300 for the order's status, then MWS410 for the delivery: status, stop, dock door. MWS070 shows the stock movements behind it."],[2,"Our Truck vs Common Carrier","OT goes on an Adleta route and load (DRS100). CC goes out with a carrier."],[3,"Common Carrier Paperwork","Carrier, tracking number, and bill of lading.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> How Adleta will create BOLs and record carrier tracking numbers in M3 has not been decided.</div>"],[4,"Address Changes","A ship-to change must happen before the delivery is released. Tell CS. They update it on the order (OIS002 holds the customer's addresses)."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Common%20carrier%20scenario.mp4","quiz":[{"q":"Customer asks where their delivery is. Start with:","options":["OIS300, then MWS410","GLS200","PPS250","CRS620"],"answer":0},{"q":"A ship-to change must happen:","options":["Before the delivery is released","After it ships","At invoicing","Anytime"],"answer":0},{"q":"OT deliveries go out on:","options":["An Adleta route/load","A carrier","Will call","Drop ship"],"answer":0}],"checklist":["I can answer delivery questions from OIS300 and MWS410","I know OT vs CC","I route address changes to CS before release"]},{"id":"log-6","title":"Routes and Delivery Setup (Setup Users Only)","duration":"1 hour","steps":[[1,"Who This Is For","Only the few people who maintain routes. Changes here affect every order's delivery date.<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>DRS005</td><td style='padding:3px 8px;'>Route. Open</td><td style='padding:3px 8px;'>Truck and carrier routes</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>DRS006</td><td style='padding:3px 8px;'>Route. Departure</td><td style='padding:3px 8px;'>Which days and times a route leaves</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>DRS011</td><td style='padding:3px 8px;'>Route Selection Table. Open</td><td style='padding:3px 8px;'>Which route each customer gets</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>DRS016</td><td style='padding:3px 8px;'>Loading Platform. Open</td><td style='padding:3px 8px;'>Dock doors</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS070</td><td style='padding:3px 8px;'>Delivery Method. Open</td><td style='padding:3px 8px;'>Ship-via codes (OT, CC, WC…)</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS008</td><td style='padding:3px 8px;'>Place. Open</td><td style='padding:3px 8px;'>Places (WHCAR, WHLIT, WHLEN)</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"Routes and Departures","A route (DRS005) has departures (DRS006): the days and times it leaves. The delivery calendar CS sees in OIS100, including the 3:00 PM cutoff the day before, comes from these."],[3,"Which Customer Gets Which Route","DRS011 assigns routes to customers. If a customer's delivery days look wrong in order entry, check here."],[4,"Delivery Methods and Docks","CRS070 holds the ship-via codes (OT, CC, WC). DRS016 holds dock doors."],[5,"Change Control","Test changes in company 100 first, and tell CS before a route change goes live."]],"videoUrl":"","quiz":[{"q":"The days a route leaves are set in:","options":["DRS006","DRS100","OIS300","MMS310"],"answer":0},{"q":"Which route a customer gets is set in:","options":["DRS011","CRS620","PPS040","GLS040"],"answer":0},{"q":"Delivery method codes (OT, CC, WC) are in:","options":["CRS070","OIS010","MWS420","ARS200"],"answer":0}],"checklist":["I know which route programs control what","I can trace a customer's delivery days to DRS011 and DRS006","I test route changes in company 100 and tell CS first"]}]},"financeAP":{"id":"financeAP","name":"Finance — Accounts Payable","owner":"Philip Jones","weeks":"Week 6","pill":"pill-red","color":"#c0443b","programs":["APS100","APS110","APS200","APS450","APS130","PPS220","PPS300"],"summary":"Supplier invoices and PO matching, invoice batches, recoding, holds, payment runs, wires, and voids.","links":[["Deck","resources/adleta-m3-finance-apar-training-deck.html"],["Guide","resources/adleta-m3-finance-apar-learningguide.html"]],"sessions":[{"id":"fin-1","title":"Supplier Invoice Entry with PO Match — APS100","duration":"60 min","steps":[[1,"The AP Programs","<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>APS100</td><td style='padding:3px 8px;'>Supplier Invoice. Record</td><td style='padding:3px 8px;'>Key supplier invoices</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>APS110</td><td style='padding:3px 8px;'>Supplier Invoice. Recode</td><td style='padding:3px 8px;'>Correct an invoice's coding</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>APS200</td><td style='padding:3px 8px;'>Acc Payable. Display</td><td style='padding:3px 8px;'>Supplier ledger</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>APS450</td><td style='padding:3px 8px;'>Supplier Invoice Batch. Open</td><td style='padding:3px 8px;'>Invoice batches (scanned / imported)</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"Open APS100","Press Ctrl+S to open Search and Start, type APS100, select Supplier Invoice. Record from the list, and click OK. Select your division (A01 in the test company), then FAM function 300 (PO, delivery note, supplier order no). Click + (New)."],[3,"Enter the Header","Supplier (e.g. S900400), the supplier's invoice number exactly as printed, the invoice date from the invoice (not today), amount, currency USD. Next."],[4,"Match to the PO","Enter the PO number (format 20010XXXXX). M3 pulls the receipt lines. Compare quantity and price to the invoice."],[5,"Match or Hold","If it matches, approve. If price or quantity differs, don't approve. Hold the invoice (fin-4), check the PO (PPS220) and receipt (PPS300), and work it with Purchasing."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20Invoice%20w%20Po%20(PO%20Match).mp4","quiz":[{"q":"Which FAM function is used for PO-matched invoices in the exercise?","options":["101","201","300","900"],"answer":2},{"q":"The invoice date you enter is:","options":["Today","The date on the supplier invoice","The PO date","The receipt date"],"answer":1},{"q":"The invoice price doesn't match the PO. You:","options":["Approve it","Hold it and work it with Purchasing","Change the PO yourself","Delete the invoice"],"answer":1}],"checklist":["I can open APS100 in your division (A01 in the test company) with FAM 300","I enter the supplier invoice number and date exactly","I can match to the PO and compare to the receipt","I hold mismatches instead of approving them"]},{"id":"fin-3","title":"Payment Proposal — Check Run (CH1)","duration":"60 min","steps":[[1,"Before the Run","Make sure the day's invoices are posted (APS450) and anything disputed is on hold.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> APS130 (supplier payment proposal) isn't on Adleta's M3 Programs We Use list (20 Oct 2026). Confirm with Mike that this is the program Adleta will use before teaching it.</div>"],[2,"Create the Proposal","Open APS130, click + (New). Set payment method CH1 and the due-date cutoff. Run it. M3 picks the invoices that are due."],[3,"Review Every Line","Supplier, invoice, amount, due date. Remove anything disputed or on hold. Removing doesn't void it; it comes back next run."],[4,"Approve, Print, Post","Manager approves. Print checks, note the check numbers, then post. Check APS200: the invoices are no longer open."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Payment%20Proposal%20CH1%20(Check%20in-house).mp4","quiz":[{"q":"Removing an invoice from a payment proposal:","options":["Voids it","Leaves it open for the next run","Deletes the supplier","Pays it twice"],"answer":1},{"q":"Removing an invoice from a payment proposal in APS200:","options":["Voids the invoice permanently","Leaves it open for future payment runs","Sends a rejection notice to the supplier","Creates a credit memo automatically"],"answer":1},{"q":"Once payments are processed in APS200 they:","options":["Can be reversed with one click","Cannot be reversed in M3 — errors require manual journal entries","Are automatically emailed to suppliers","Are sent to Birst for reporting"],"answer":1}],"checklist":["I check batches are posted and disputes held before the run","I can create and review a CH1 proposal","I get approval before printing and posting","I confirm the invoices cleared in APS200"]},{"id":"fin-4","title":"Holding a Supplier Invoice","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20AP%20Display%20(APS205)%20Hold%20Invoice%20.mp4","steps":[[1,"When to Hold","Price or quantity mismatch, supplier dispute, credit pending, duplicate. A held invoice stays out of payment runs."],[2,"Find the Invoice","Press Ctrl+S to open Search and Start, type APS450, select Supplier Invoice Batch. Open from the list, and click OK. Division (A01 in the test company), Apply. Find the supplier's invoice. APS200 (Acc Payable. Display) shows the supplier's whole ledger."],[3,"Put It on Hold","Right-click the invoice and use the hold or change status option. Enter a clear reason, e.g. Price mismatch, PO $2.50 vs invoice $2.75.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> The exact hold option and hold codes haven't been confirmed on Adleta's screens. Older handouts named APS205; it isn't on the program list.</div>"],[4,"Follow Up and Release","Work it with the supplier and Purchasing. When resolved, release the hold and note why. Review held invoices weekly."]],"quiz":[{"q":"A held invoice:","options":["Is paid next run","Stays out of payment runs until released","Is deleted","Goes to the GL"],"answer":1},{"q":"Every hold needs:","options":["A clear reason","A new PO","A customer number","Nothing"],"answer":0},{"q":"The supplier's full ledger is in:","options":["APS200","OIS350","GLS990","CRS610"],"answer":0},{"q":"How often should held invoices be reviewed?","options":["Weekly","Yearly","Never","Only at audit"],"answer":0}],"checklist":["I know when to hold an invoice","I can find it in APS450 / APS200","I enter a clear hold reason","I release the hold when resolved and note why"]},{"id":"fin-5","title":"AP Payment Proposal — Wire Transfer (WID)","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Payment%20Proposal%20WID%20(Wire).mp4","steps":[[1,"Identify invoices approved for wire payment","Wire transfers are used for specific suppliers (large international suppliers, urgent payments, or suppliers who do not accept checks). Confirm which suppliers are set up for wire payment in M3 — check with your trainer or AP manager.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; APS130 &mdash; AP Payment Proposal &mdash; Wire Transfer WID</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>APS130 select WID method</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Select invoices</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Approve</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Wire file generated</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Send to bank</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Post to GL</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Payment method<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>WID = Wire Transfer</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Pay-thru date<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>All invoices due by this date</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Bank account<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Adleta wire account</span></span></div><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Wire files must be sent to the bank by the cutoff time. Confirm cutoff with Finance before running.</div></div>"],[2,"Open APS130 — Supplier Payment Proposal","Open APS130. Click the + New button to create a new payment proposal. Set the payment method to WID (Wire) instead of check. Select the correct bank account for wire payments.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> APS130 (supplier payment proposal) isn't on Adleta's M3 Programs We Use list (20 Oct 2026). Confirm with Mike that this is the program Adleta will use before teaching it.</div>"],[3,"Set the payment date and filter for wire suppliers","Enter the wire payment date. Filter the supplier selection to include only suppliers approved for wire payment this run. Set the invoice due date cutoff."],[4,"Review the wire payment proposal","M3 lists all invoices selected for wire payment. Review each carefully — wire transfers are immediate and difficult to reverse. Verify supplier bank details are on file and correct in M3 before approving."],[5,"Confirm supplier bank details are current","For each supplier in the proposal, verify on the supplier record (CRS620) that the ACH/wire routing number and account number are correct and current. If bank details are missing or outdated, DO NOT process the wire — contact the supplier to update before proceeding."],[6,"Get required approval for wire payments","Wire transfers above a certain threshold require additional approval. Confirm the authorization matrix with your AP manager. Do not process large wire payments without the required sign-off."],[7,"Approve and process the wire proposal","Once all details are verified and approvals are in place, approve the payment proposal. M3 generates the wire transfer file. Submit the file to Fifth Third Bank per the established process."],[8,"Confirm bank receipt and post in M3","After the bank confirms the wire was sent, post the payment proposal in M3. M3 closes the AP invoices and records the bank outflow. Save the bank wire confirmation for your records."]],"quiz":[{"q":"Wire payments in M3 use payment method code:","options":["CH1","WC","WID","ACH"],"answer":2},{"q":"Before running a wire payment proposal, invoices must be:","options":["On hold","Approved and in payable status","Entered today","Matched to a PO"],"answer":1},{"q":"After confirming the payment proposal in M3, what additional step is required?","options":["Nothing — the wire is sent automatically","Coordinate with Finance to initiate the actual bank transfer","Void the invoices","Print a check"],"answer":1},{"q":"Wire payment proposals are run from:","options":["PPS200","APS200","APS100","CRS620"],"answer":2}],"checklist":["I can create an AP wire payment proposal in APS100","I know how to select the correct bank account and payment date","I understand that confirming in M3 does not initiate the actual bank transfer","I can review and confirm a payment proposal before processing","I know the post-wire bank confirmation step"]},{"id":"fin-6","title":"Voiding an AP Check","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Void%20Check.mp4","steps":[[1,"Stop Payment First (Lost or Stolen Checks)","For a lost or stolen check, call Fifth Third Bank to stop payment <b>before</b> voiding in M3. Voiding in M3 doesn't stop the check at the bank."],[2,"Find the Check","Open APS130 and find the proposal that produced the check, by supplier or check number. Confirm it hasn't cleared the bank.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> The void step in APS130 isn't on Adleta's M3 Programs We Use list (20 Oct 2026). Confirm with Mike that this is the program Adleta will use before teaching it.</div>"],[3,"Void It","Select the check, choose Void, enter the reason and date. The invoices go back to open."],[4,"Check and Reissue","Confirm in APS200 that the invoices are open again, then include them in the next payment proposal."]],"quiz":[{"q":"For a lost check, the first step is:","options":["Void in M3","Call the bank to stop payment","Reissue","Nothing"],"answer":1},{"q":"After a void, the invoices:","options":["Are deleted","Go back to open","Are paid","Go to AR"],"answer":1},{"q":"Confirm the invoices reopened in:","options":["APS200","OIS300","MWS410","GLS040"],"answer":0}],"checklist":["I stop payment at the bank before voiding a lost check","I can void a check with my trainer","I confirm invoices reopened in APS200"]},{"id":"fin-8","title":"Recoding an Invoice and Reading the Supplier Ledger — APS110, APS200","duration":"45 min","steps":[[1,"Supplier Ledger","Press Ctrl+S to open Search and Start, type APS200, select Acc Payable. Display from the list, and click OK. Find the supplier. Every open and paid invoice, with due dates and payments, is here."],[2,"Wrong Coding?","If an invoice posted to the wrong account or cost center, correct it in <b>APS110</b> (Supplier Invoice. Recode).<div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[3,"Recode","Press Ctrl+S to open Search and Start, type APS110, select Supplier Invoice. Recode from the list, and click OK. Find the invoice, change the account string to the correct one, and save. Add a note with the reason.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Whether a recode is allowed after the period closes, and who approves it, needs confirming with Finance.</div>"],[4,"Check the GL","Look up the account in GLS210 (General Ledger. Display Transactions): you should see the move out of the wrong account and into the right one. Tell the GL accountant."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20AP%20Display%20(APS200)%20Change%20Acc%20String%20and%20Reverse%20Invoice.mp4","quiz":[{"q":"To correct an invoice's coding, use:","options":["APS110","APS200","APS100 re-entry only","OIS350"],"answer":0},{"q":"The supplier ledger is:","options":["APS200","ARS200","GLS200","PPS220"],"answer":0},{"q":"After recoding, check the accounts in:","options":["GLS210","MWS070","OIS300","CRS620"],"answer":0}],"checklist":["I can read a supplier ledger in APS200","I can recode an invoice in APS110","I check the result in GLS210 and tell the GL accountant"]}]},"credit":{"id":"credit","name":"Credit and Accounts Receivable","owner":"Accounting / credit","weeks":"Week 6","pill":"pill-red","color":"#a8473f","programs":["OIS120","OIS300","CRS610","CRS315","ARS200","ARS110","ARS300","ARS120","RMS420","OIS002"],"summary":"Credit holds and releases, prepay customers, customer terms and limits, the customer ledger, payments, write-offs, and collections.","links":[["Guide","resources/adleta-m3-credit-learningguide.html"]],"sessions":[{"id":"cr-1","title":"Credit Holds — Reviewing and Releasing Orders","duration":"1 hour","steps":[[1,"The Credit Programs","<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS120</td><td style='padding:3px 8px;'>Customer Order. Stop</td><td style='padding:3px 8px;'>Release a credit-held order (0 or 9)</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS300</td><td style='padding:3px 8px;'>Customer Order. Open Toolbox</td><td style='padding:3px 8px;'>Credit view: all held orders</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS610</td><td style='padding:3px 8px;'>Customer. Open</td><td style='padding:3px 8px;'>Panel J: credit limits, payment terms, customer stop. Panel K: credit manager</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS315</td><td style='padding:3px 8px;'>Customer Credit Limit. Open</td><td style='padding:3px 8px;'>Limits and current balances; F15 refreshes them</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>ARS200</td><td style='padding:3px 8px;'>Acc Receivable. Display</td><td style='padding:3px 8px;'>Customer ledger: open invoices, aging</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>RMS420</td><td style='padding:3px 8px;'>Credit risk display</td><td style='padding:3px 8px;'>Risk by credit manager</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"See What's Held","Press Ctrl+S to open Search and Start, type OIS300, select from the list, and click OK. Use the credit view to see every held order."],[3,"Look at the Customer","CRS610 panel J: limits, terms, customer stop. CRS315: limit vs current balance (F15 refreshes). ARS200: open invoices and aging."],[4,"Decide and Release","Press Ctrl+S to open Search and Start, type OIS120, select Customer Order. Stop from the list, and click OK. Release the order by setting the stop to 0 or 9 as your process says.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> What 0 vs 9 mean in Adleta's setup should be confirmed on screen.</div><div style='background:#e8f4f2;border:1px solid #9fd0c7;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; OIS120 lists orders by facility with a Stp column and a <b>Force to Credit Review</b> button.</div>"],[5,"Prepay Isn't Credit","A prepay order doesn't show in the credit view. It stops on the delivery (C10) until paid at the cash desk.<div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: How to Set Up a Prepay (Cash Only) Customer in M3, Mike Parsons, 6 Oct 2026 (draft, not yet proven with a test order)</div>"]],"videoUrl":"","quiz":[{"q":"Credit-held orders are released in:","options":["OIS120","OIS100","MWS410","APS100"],"answer":0},{"q":"Limit vs current balance (refresh with F15) is in:","options":["CRS315","CRS620","GLS200","PPS040"],"answer":0},{"q":"The credit manager for a customer is on:","options":["CRS610 panel K","OIS101","MMS002","DRS011"],"answer":0}],"checklist":["I can find held orders in OIS300","I can read CRS610 J/K, CRS315, and ARS200","I can release an order in OIS120 with my trainer","I know prepay holds are not credit holds"]},{"id":"cr-2","title":"Setting a Customer to Prepay — CRS610 Panel J","duration":"45 min","steps":[[1,"Prepay Is the Payment Term","No checkbox. Put a pay-first term on the customer: PCD (Prep Cash Desk) or CSH (Cash Desk). Both have the prepayment switches on.<div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: How to Set Up a Prepay (Cash Only) Customer in M3, Mike Parsons, 6 Oct 2026 (draft, not yet proven with a test order)</div>"],[2,"Set It","In company 100 first. Press Ctrl+S to open Search and Start, type CRS610, select from the list, and click OK. Find the customer, right-click → Change, go to panel J. Payment terms = PCD. Leave payment method (today everyone is CH1). Press Next through the panels to save."],[3,"Credit Limit","Not needed for prepay. A prepay hold isn't a credit hold. If credit should also review every order, a $0.01 limit is one option in the credit guide."],[4,"Open Questions","<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> PCD vs CSH: which to use for which customers. COD (681 customers) has every switch off and doesn't stop orders. Part payments vs 100%. Cash-only (no checks) has no per-customer switch. Drivers collecting on delivery is a different flow. Pro shop accounts aren't in M3 yet.</div>"],[5,"Test It","Run the test in Mike's guide in company 100: PCD order → C10 on the delivery → pay in OIS215 → released. Repeat with COD (expect no stop) and CSH. Write down what you see."]],"videoUrl":"","quiz":[{"q":"To make a customer prepay you change:","options":["Their payment terms on CRS610 panel J","A prepay checkbox","The order type only","The warehouse"],"answer":0},{"q":"Which terms make orders wait for payment today?","options":["PCD and CSH","COD and PP","N30","CH1"],"answer":0},{"q":"Where should you make the change first?","options":["Company 100 (test)","Production","Either","Neither"],"answer":0}],"checklist":["I can set PCD on CRS610 panel J in company 100","I know a credit limit isn't needed for prepay","I can run the prepay test and record results"]},{"id":"fin-2","title":"Customer Terms and Credit Setup — CRS610","duration":"45 min","steps":[[1,"Open the Customer","Press Ctrl+S to open Search and Start, type CRS610, select from the list, and click OK. Find the customer. Panel J holds the credit limits, payment terms, and customer stop; panel K the credit manager."],[2,"Payment Terms","Check the terms match the agreement (N30, PCD, etc.). Wrong terms make invoices age wrong, and the term decides whether orders wait for prepayment."],[3,"Credit Limits","Check the limit reflects what's approved. Limit changes need manager approval."],[4,"Payment Method","Payment mtd AR is a default only (most customers show CH1). It doesn't block anything."],[5,"Credit Manager","Every credit manager on CRS610 must also exist in ARS025.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> ARS025 (credit managers) comes from training videos. Check it on screen.</div>"],[6,"Ship-To Addresses","New delivery addresses are added in OIS002 (Customer. Connect Addresses)."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/FINANCE/AR%20-%20Finance%20Master%20Data%20List%20Configuration-20241211_083423-Meeting%20Recording.mp4","quiz":[{"q":"Credit limits and payment terms are on CRS610 panel:","options":["E","J","B","H"],"answer":1},{"q":"The payment method on the customer:","options":["Blocks checks","Is a default only","Sets the credit limit","Sets the route"],"answer":1},{"q":"Customer ship-to addresses are added in:","options":["OIS002","PPS040","MMS008","GLS040"],"answer":0}],"checklist":["I can find terms, limits, and stop on CRS610 panel J","I know the payment method is a default only","I know limit changes need approval","I know ship-tos are in OIS002"]},{"id":"cr-3","title":"The Customer Ledger — ARS200","duration":"45 min","steps":[[1,"Open the Ledger","Press Ctrl+S to open Search and Start, type ARS200, select Acc Receivable. Display from the list, and click OK. Find the customer. Open invoices, payments, credits, and aging are all here."],[2,"Before Any Credit Decision","Know the numbers: total open, oldest invoice, anything unapplied. Don't ask the customer what they owe."],[3,"Invoices","OIS350 (CO Invoice. Display) shows the invoice itself. ARS120 is for manual invoices and credits (gl-4)."],[4,"Aging","Use the ledger's aging to spot past-due balances for follow-up (gl-5)."]],"videoUrl":"","quiz":[{"q":"The customer ledger is:","options":["ARS200","APS200","GLS200","OIS301"],"answer":0},{"q":"To see the invoice document, use:","options":["OIS350","ARS110","MMS001","DRS100"],"answer":0},{"q":"Manual AR invoices and credits are entered in:","options":["ARS120","OIS100","APS100","GLS100"],"answer":0}],"checklist":["I can read a customer's ledger and aging in ARS200","I know the numbers before any credit call","I know where invoices and manual items live"]},{"id":"fin-7","title":"Recording Customer Payments — ARS110 and Check Deposits","duration":"35 min","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Lockbox%20Demo.mp4","steps":[[1,"Post Customer Payments","Press Ctrl+S to open Search and Start, type ARS110, select Payment Received. Record from the list, and click OK. Enter the payment and apply it to the right invoices."],[2,"Unapplied Cash","If you can't match a payment, search by customer and check reference. Don't leave it unapplied without a note."],[3,"Checks From the Cash Desk","Checks taken at the cash desk go to the bank through the check deposit proposal (ARS300).<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> ARS300's name comes from training videos. Check it on screen.</div>"],[4,"Lockbox","Bank lockbox files.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> Whether Adleta will import lockbox files into M3, and how, has not been confirmed.</div>"],[5,"Check It Cleared","In ARS200, the invoice balance should now be zero."]],"quiz":[{"q":"Customer payments are posted in:","options":["ARS110","ARS120","APS100","OIS215"],"answer":0},{"q":"Checks taken at the cash desk go to the bank via:","options":["ARS300","GLS910","PPS300","MWS410"],"answer":0},{"q":"Confirm the invoice cleared in:","options":["ARS200","OIS101","CRS620","MMS002"],"answer":0}],"checklist":["I can post a payment in ARS110","I don't leave cash unapplied without a note","I know cash desk checks go through ARS300","I confirm in ARS200"]},{"id":"gl-4","title":"Manual Invoices, Credits, and Write-Offs — ARS120","duration":"1.5 hours","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AR%20Debit%20Note%20Write%20Off.mp4","steps":[[1,"Find the Open Item","Press Ctrl+S to open Search and Start, type ARS200, select from the list, and click OK. Find the customer and the small open balance. Check amount, date, and aging."],[2,"Get Approval","Write-offs need approval per Finance policy. Document it first.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> The write-off approval threshold for M3 hasn't been set.</div>"],[3,"Enter It","Press Ctrl+S to open Search and Start, type ARS120, select Customer Invoice. Enter Manual from the list, and click OK. Enter the manual credit (or invoice) against the customer, with the account Finance gives you.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> ARS120's name comes from training videos. The write-off method in Adleta's setup should be confirmed on screen.</div>"],[4,"Check","ARS200: the item is closed. GLS210: the expense and AR entries posted."]],"quiz":[{"q":"Manual AR invoices and credits are entered in:","options":["ARS120","ARS200","OIS100","APS110"],"answer":0},{"q":"Before a write-off:","options":["Get approval and document it","Just post it","Call the supplier","Close the period"],"answer":0},{"q":"Confirm the item closed in:","options":["ARS200","PPS220","MWS420","OIS002"],"answer":0}],"checklist":["I check the item in ARS200","I get approval first","I can enter a manual credit in ARS120 with my trainer","I confirm in ARS200 and GLS210"]},{"id":"gl-5","title":"Collections Follow-Up","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AR%20Tickler%20Notes.mp4","steps":[[1,"Work From the Aging","Press Ctrl+S to open Search and Start, type ARS200, select from the list, and click OK. Pull the customer's aging before you call. Know the oldest invoice and total due."],[2,"Notes on Every Contact","Record who you talked to, when, what was promised, and the next follow-up date.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> Where collections notes and follow-up dates will be kept in M3 (older handouts named ARS440) hasn't been confirmed.</div>"],[3,"Escalate","After repeated missed promises, talk to your manager about a stop. Stops are set by credit (CRS610 panel J), only with approval."],[4,"Credit Risk View","RMS420 shows risk by credit manager.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> RMS420's name comes from training videos. Check it on screen.</div>"]],"quiz":[{"q":"Before a collections call, review:","options":["ARS200 aging","PPS220","MWS410","GLS990"],"answer":0},{"q":"A customer stop is set:","options":["By credit, with approval","By the CSR","By the warehouse","Automatically after 1 call"],"answer":0},{"q":"Every contact note should include:","options":["Who, when, what was promised, next date","Only the amount","Nothing","The item number"],"answer":0}],"checklist":["I review ARS200 before calling","I record every contact and promise","I escalate before any stop is set"]}]},"financeGL":{"id":"financeGL","name":"Finance — General Ledger","owner":"Philip Jones","weeks":"Week 6","pill":"pill-red","color":"#c0443b","programs":["GLS100","GLS200","GLS210","GLS215","GLS910","GLS990"],"summary":"Journal vouchers, reversing entries, GL inquiry, bank reconciliation, period close, and financial reports.","links":[["Deck","resources/adleta-m3-finance-gl-training-deck.html"],["Guide","resources/adleta-m3-finance-gl-learningguide.html"]],"sessions":[{"id":"gl-1","title":"Journal Voucher Entry — GLS100","duration":"60 min","steps":[[1,"The GL Programs","<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>GLS100</td><td style='padding:3px 8px;'>Journal voucher entry</td><td style='padding:3px 8px;'>Key a journal voucher</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>GLS200</td><td style='padding:3px 8px;'>Voucher. Display</td><td style='padding:3px 8px;'>Look up a voucher</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>GLS210</td><td style='padding:3px 8px;'>General Ledger. Display Transactions</td><td style='padding:3px 8px;'>GL transactions by account</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"Open GLS100","Press Ctrl+S to open Search and Start, type GLS100, select from the list, and click OK. Confirm your division (A01 in the test company) and select FAM function 201 (USD Multi Function Entry)."],[3,"Header","Enter the accounting date (the period it posts to) and voucher text that explains the entry. The voucher number is assigned by M3."],[4,"Lines","Enter the debit line, then the offsetting credit. Debits must equal credits; M3 won't post an unbalanced voucher.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Adleta's account string (account, cost center, and any other dimensions) should be confirmed with Finance before entering live entries.</div>"],[5,"Confirm It Posted","Note the voucher number and look it up in GLS200."]],"videoUrl":"","quiz":[{"q":"Which FAM function is used for a manual USD journal?","options":["101","201","300","900"],"answer":1},{"q":"A journal voucher must:","options":["Balance (debits = credits)","Have one line","Use today's date","Be approved by IT"],"answer":0},{"q":"Look up a posted voucher in:","options":["GLS200","APS100","OIS350","MMS001"],"answer":0}],"checklist":["I can open GLS100 with FAM 201","I enter a clear voucher text and correct accounting date","I enter balanced lines","I confirm the voucher in GLS200"]},{"id":"gl-2","title":"Reversing a Journal Voucher","duration":"45 min","steps":[[1,"Find the Wrong Entry","Press Ctrl+S to open Search and Start, type GLS200, select Voucher. Display from the list, and click OK. Division (A01 in the test company). Filter by voucher number or accounting date and check its lines."],[2,"Reverse It","Right-click the voucher and use Reverse, or in GLS100 use FAM function 101 (Autoreverse Voucher) with the original voucher number. Pick the reversal date, usually the first day of the next period."],[3,"Correct It","If a correct entry is needed, enter it in GLS100 with FAM 201."],[4,"Check","Find the reversal in GLS200: same amounts, opposite signs. Check the accounts net correctly in GLS210."]],"videoUrl":"","quiz":[{"q":"FAM function 101 is used to:","options":["Enter AP invoices","Autoreverse a voucher","Run reports","Close the period"],"answer":1},{"q":"A reversal has:","options":["Same amounts, opposite signs","Double amounts","No lines","A new supplier"],"answer":0},{"q":"Supplier invoice coding errors are
