<title>Adleta Infor M3 — Training Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================
   ADLETA M3 TRAINING PORTAL — FULL BUILD
   Role-based access | Sessions | Quizzes | Video
   ===================================== */
:root {
  --navy:#0f2133;--navy2:#172d42;--navy3:#1f3a52;
  --teal:#1a7a6d;--teal2:#22a08f;--teal3:#e0f2ee;
  --gold:#c49a2a;--gold2:#faf0db;
  --red:#c0443b;--red2:#fce8e7;
  --blue:#2d6fa3;--blue2:#e0ecf7;
  --ink:#0f1f2e;--body:#344b5f;--muted:#6b8199;
  --line:#dde5ed;--bg:#f2f5f8;--surface:#fff;--surface2:#f7f9fb;
  --r:10px;--rsm:6px;
  --shadow:0 2px 12px rgba(15,33,51,0.08);
  --shadow2:0 8px 32px rgba(15,33,51,0.12);
  font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.55;
}
*,*::before,*::after{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--ink);min-height:100vh;}
a{color:var(--teal);text-decoration:none;font-weight:500;}
a:hover{text-decoration:underline;}
button,input,select{font:inherit;}
h1,h2,h3,h4{line-height:1.2;font-weight:700;}
p{color:var(--body);line-height:1.6;}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{background:var(--navy);color:#e8f1f8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-top{padding:22px 18px 16px;}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;}
.brand-mark{width:42px;height:42px;background:linear-gradient(135deg,var(--teal2),var(--teal));border-radius:10px;display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:13px;color:#fff;flex-shrink:0;}
.brand-name{font-size:14px;font-weight:700;color:#fff;line-height:1.2;}
.brand-sub{font-size:12px;color:#7fa3be;}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:var(--rsm);color:#a8c4d8;font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:all .15s;}
.nav-btn svg{opacity:.65;flex-shrink:0;}
.nav-btn:hover,.nav-btn.active{background:var(--navy3);color:#fff;}
.nav-btn.active svg{opacity:1;}
.sidebar-footer{margin-top:auto;padding:14px 18px 20px;border-top:1px solid rgba(255,255,255,0.07);}
.user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--navy3);border-radius:var(--rsm);}
.user-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;color:#fff;}
.user-role{font-size:11px;color:#7fa3be;}
.logout-btn{margin-top:8px;width:100%;padding:7px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:var(--rsm);color:#7fa3be;font-size:13px;cursor:pointer;transition:all .15s;}
.logout-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
.main{display:flex;flex-direction:column;min-width:0;}
.hero{background:var(--navy);padding:28px 36px 24px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 500px 250px at 100% 50%,rgba(26,122,109,0.2) 0%,transparent 70%),repeating-linear-gradient(120deg,rgba(255,255,255,0.015) 0 1px,transparent 1px 52px);pointer-events:none;}
.hero-inner{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.hero-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--teal2);font-weight:700;margin-bottom:8px;}
.hero h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;}
.hero-sub{font-size:13px;color:#7fa3be;}
.hero-actions{display:flex;gap:8px;flex-shrink:0;margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rsm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--teal2);color:#fff;}
.btn-primary:hover{background:var(--teal);color:#fff;text-decoration:none;}
.btn-ghost{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}
.btn-ghost:hover{background:rgba(255,255,255,0.18);color:#fff;text-decoration:none;}
.btn-sm{padding:6px 12px;font-size:13px;}
.content{padding:24px 36px 40px;flex:1;}
.view{display:none;}
.view.active{display:block;}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.sec-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);font-weight:700;margin-bottom:4px;}
.sec-hd h2{font-size:20px;color:var(--ink);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--teal);}
.metric:nth-child(2){border-top-color:var(--blue);}
.metric:nth-child(3){border-top-color:var(--gold);}
.metric:nth-child(4){border-top-color:var(--red);}
.metric-val{font-size:28px;font-weight:800;color:var(--teal);line-height:1;margin-bottom:3px;}
.metric:nth-child(2) .metric-val{color:var(--blue);}
.metric:nth-child(3) .metric-val{color:var(--gold);}
.metric:nth-child(4) .metric-val{color:var(--red);}
.metric-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.dash-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:20px;}
.mastery{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr;align-items:center;}
.mastery-node{background:var(--teal3);border:1px solid #b0d9d2;border-radius:var(--r);padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--teal);min-height:64px;display:grid;place-items:center;}
.mastery-arr{display:grid;place-items:center;color:var(--teal);opacity:.5;}
.prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.prog-track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.prog-label{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;}
.check-list{display:flex;flex-direction:column;gap:6px;}
.check-item{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.check-item:last-child{border-bottom:none;}
.check-item input{width:15px;height:15px;margin-top:2px;accent-color:var(--teal);cursor:pointer;}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.pill-teal{background:var(--teal3);color:#145c52;}
.pill-blue{background:var(--blue2);color:#1e4f7a;}
.pill-gold{background:var(--gold2);color:#7a5c12;}
.pill-red{background:var(--red2);color:#8a2e28;}
.pill-gray{background:#eef2f6;color:#344b5f;}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.mod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all .15s;}
.mod-card:hover{border-color:var(--teal);box-shadow:var(--shadow2);transform:translateY(-1px);}
.mod-card h3{font-size:14px;color:var(--ink);}
.mod-owner{font-size:11px;color:var(--muted);font-weight:600;}
.mod-summary{font-size:12px;color:var(--body);line-height:1.5;flex:1;}
.tags{display:flex;flex-wrap:wrap;gap:4px;}
.tag{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:#eef2f6;color:#344b5f;}
.mod-progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px;}
.mod-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.mod-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.mod-link{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--rsm);color:var(--teal);font-weight:600;transition:all .15s;}
.mod-link:hover{background:var(--teal3);border-color:var(--teal);text-decoration:none;}
.session-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;border:none;background:none;padding:0;margin-bottom:12px;}
.session-back:hover{color:var(--teal);}
.session-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.session-title{font-size:22px;font-weight:700;margin-bottom:16px;}
.session-body{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
.session-content{display:flex;flex-direction:column;gap:16px;}
.session-sidebar{display:flex;flex-direction:column;gap:14px;}
.notes-area{width:100%;min-height:90px;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:13px;color:var(--ink);background:var(--surface);resize:vertical;font-family:inherit;}
.notes-area:focus{outline:none;border-color:var(--teal);}
.notes-saved{font-size:11px;color:var(--teal);margin-top:4px;display:none;}
@media print{body *{visibility:hidden;}.print-zone,.print-zone *{visibility:visible;}.print-zone{position:fixed;top:0;left:0;width:100%;padding:20px;}.print-hide{display:none!important;}}
.step-cards{display:flex;flex-direction:column;gap:12px;}
.step-card{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:box-shadow .15s;}
.step-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.step-num{width:36px;height:36px;min-width:36px;border-radius:50%;background:var(--teal);color:#fff;font-size:15px;font-weight:800;display:grid;place-items:center;font-family:'DM Mono',monospace;}
.step-body{flex:1;}
.step-action{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.step-detail{font-size:13px;color:var(--body);line-height:1.55;}
.session-progress-header{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:16px;margin-bottom:4px;}
.session-progress-header .prog-track{flex:1;height:8px;border-radius:4px;background:var(--line);}
.session-progress-header .prog-fill{height:100%;border-radius:4px;background:var(--teal);transition:width .3s;}
.session-nav{display:flex;gap:10px;margin-top:8px;}
.session-nav .btn{flex:1;justify-content:center;}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--r);}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:var(--r);}
.video-placeholder{background:var(--navy2);border-radius:var(--r);aspect-ratio:16/9;display:grid;place-items:center;color:#7fa3be;font-size:13px;text-align:center;padding:20px;}
.video-input-wrap{display:flex;gap:8px;margin-top:8px;}
.video-input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:var(--rsm);font-size:13px;outline:none;}
.video-input:focus{border-color:var(--teal);}
.quiz-wrap{display:flex;flex-direction:column;gap:16px;}
.quiz-q{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
.quiz-q-text{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--ink);}
.quiz-options{display:flex;flex-direction:column;gap:8px;}
.quiz-option{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--rsm);cursor:pointer;font-size:13px;transition:all .15s;background:var(--surface);}
.quiz-option:hover{border-color:var(--teal);background:var(--teal3);}
.quiz-option.correct{border-color:#22a08f;background:#e0f2ee;color:#145c52;}
.quiz-option.wrong{border-color:var(--red);background:var(--red2);color:var(--red);}
.quiz-option input{margin-top:2px;accent-color:var(--teal);}
.quiz-result{text-align:center;padding:16px;border-radius:var(--r);font-size:15px;font-weight:700;}
.quiz-result.pass{background:var(--teal3);color:#145c52;}
.quiz-result.fail{background:var(--red2);color:var(--red);}
.quiz-btn{width:100%;padding:10px;background:var(--teal);color:#fff;border:none;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .15s;}
.quiz-btn:hover{background:var(--teal2);}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.phase-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border-top:4px solid var(--teal);}
.phase-card:nth-child(2){border-top-color:var(--blue);}
.phase-card:nth-child(3){border-top-color:var(--gold);}
.phase-card:nth-child(4){border-top-color:var(--red);}
.phase-weeks{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
.phase-name{font-size:16px;font-weight:700;margin-bottom:8px;}
.phase-purpose{font-size:12px;color:var(--body);margin-bottom:8px;line-height:1.5;}
.phase-success{font-size:12px;color:var(--teal);font-style:italic;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;line-height:1.5;}
.su-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.su-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.su-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;}
.su-name{font-size:14px;font-weight:700;}
.su-dept{font-size:11px;color:var(--muted);}
.su-mod{font-size:10px;font-family:'DM Mono',monospace;color:var(--teal);margin-top:3px;}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;}
.res-card h3{font-size:14px;}
.res-card p{font-size:12px;color:var(--body);flex:1;}
.res-link{font-size:13px;display:inline-flex;align-items:center;gap:5px;margin-top:4px;}
.search-input{padding:8px 13px;border-radius:var(--rsm);border:1px solid var(--line);background:var(--surface);width:260px;font-size:13px;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--teal);}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.user-table{width:100%;border-collapse:collapse;font-size:13px;}
.user-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:12px;font-weight:600;}
.user-table td{padding:9px 12px;border-bottom:1px solid var(--line);}
.user-table tr:hover td{background:var(--surface2);}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.dot-green{background:#22a08f;}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
@media(max-width:1100px){.mod-grid,.res-grid,.su-grid{grid-template-columns:repeat(2,1fr);}.timeline{grid-template-columns:repeat(2,1fr);}.metrics{grid-template-columns:repeat(2,1fr);}.session-body{grid-template-columns:1fr;}}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{height:auto;position:static;}.hero{padding:20px;}.content{padding:16px 18px 32px;}.dash-grid,.admin-grid{grid-template-columns:1fr;}.mod-grid,.res-grid,.su-grid,.timeline{grid-template-columns:1fr;}.mastery{grid-template-columns:1fr;gap:6px;}}
</style>
</head>

 type (confirm with trainer)"],["5","Enter Delivery Date","Date goods are needed at the warehouse"],["6","Enter Buyer Reference","Your name or buyer code"],["7","Save","Press Enter — M3 assigns a PO number. Record it."],["8","Add Lines","M3 opens PPS201 to add product lines"]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Non-Stocking%20WHS%20PO%20for%20one%20time%20exception.mp4",quiz:[{q:"What keyboard shortcut creates a new PO in PPS200?",options:["F1","F3","F5","F14"],answer:1},{q:"After saving the PO header, M3 automatically opens:",options:["PPS300","APS100","PPS201","CRS620"],answer:2},{q:"The Requested Delivery Date is:",options:["Today's date","The date you want goods at the warehouse","The vendor's ship date","The invoice date"],answer:1}],checklist:["I can create a PO header in PPS200","I can add PO lines in PPS201","I know how to verify pricing on PO lines","I can record and track the PO number assigned by M3"]},{id:"pur-3",title:"Receiving Goods — PPS300 and Three-Way Match",duration:"60 min",steps:[["1","Open PPS300","Navigate to Purchasing > Goods Receiving > PPS300"],["2","Find PO","Enter the PO number"],["3","Verify Delivery","Confirm packing slip matches PO items and quantities"],["4","Enter Receipt Date","Today's date"],["5","Enter Received Quantities","Actual quantity physically received"],["6","Confirm","Press F5 — M3 updates inventory and creates receipt"],["7","Check Three-Way Match","Finance enters invoice in APS100 and runs F14 match"],["8","Resolve Discrepancies","Price or qty variance — contact vendor for corrected invoice"]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215_141931-Meeting%20Recording.mp4",quiz:[{q:"What program is used to receive goods against a PO?",options:["PPS200","APS100","PPS300","MMS150"],answer:2},{q:"The three-way match compares:",options:["PO, receipt, and vendor invoice","PO, customer order, and payment","Receipt, invoice, and credit memo","PO, vendor, and warehouse"],answer:0},{q:"If you receive LESS than the PO quantity, M3 will:",options:["Close the PO automatically","Delete the remaining lines","Keep the PO open for the remaining quantity","Reject the receipt"],answer:2}],checklist:["I can receive a full shipment in PPS300","I can handle a partial receipt","I understand how the three-way match works","I know how to resolve a price or quantity discrepancy"]},{id:"pur-4",title:"Manual Purchase Order — Stocking Item",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2003%202025%20-%20P2P/Bravo%20-%20Mini%20CRP%20P2P%20scenarios-20251203%20Manual%20PO%20Stocking%20Item.mp4",steps:[["1","Verify the Vendor","Open CRS620. Look up the vendor by number or name. Confirm the account is active and payment terms are correct."],["2","Open PPS200","Open PPS200 and select Create to start a new Purchase Order."],["3","Enter PO Header","Enter vendor number, order type, buyer, warehouse, and requested delivery date. Save the header — M3 assigns a PO number."],["4","Add PO Lines in PPS201","M3 opens PPS201. Enter item number, quantity, unit of measure, and price for each item line."],["5","Verify Pricing","Verify pricing on each line against the vendor price agreement in CRS620. Flag any discrepancies before saving."],["6","Save PO Lines","Save all PO lines. Review the PO total."],["7","Submit for Approval if Required","If the PO total exceeds the approval threshold, M3 routes it for approval. Monitor approval status."],["8","Print/Transmit PO to Vendor","Once approved, use PPS310 to print, email, or EDI-transmit the PO to the vendor."],["9","Monitor Until Received","Track PO status in PPS200 until goods are received."]],quiz:[{q:"To create a manual purchase order, you open:",options:["CRS620","OIS100","PPS200","APS100"],answer:2},{q:"Individual item lines are added to a PO in:",options:["PPS200","PPS201","PPS300","CRS620"],answer:1},{q:"To print or transmit a PO to a vendor, you use:",options:["PPS200","PPS201","PPS310","APS100"],answer:2},{q:"Before creating a PO you should verify the vendor is active in:",options:["OIS100","PPS200","CRS620","MMS060"],answer:2}],checklist:["I can look up a vendor in CRS620 and verify their account is active","I can create a manual PO header in PPS200","I can add item lines in PPS201","I can verify pricing against the vendor agreement","I can print/transmit a PO using PPS310"]},{id:"pur-5",title:"PO Management — Cancel, Split, and Notes",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Cancel%20PO%20in%20Status%2035%20Standalone.mp4",steps:[["1","Locate the PO","Open PPS200. Find the PO by PO number, vendor, or status."],["2","Add Notes to a PO","Right-click the PO and select Notes. Enter note text — use notes to document vendor communication, changes, or special instructions. Save."],["3","Split a PO Line","Select the PO line to split. Choose Split from the action menu. Enter the quantity to split off — M3 creates a new line with the split quantity. Use this to manage partial shipments or different delivery dates."],["4","Update Warehouse on a PO Line (Status 35)","Select the PO line. Choose Change. Update the warehouse field. Save."],["5","Update Supplier on a PO","Select the PO header. Choose Change. Update the supplier field (only available in certain statuses). Save."],["6","Cancel a PO in Status 35","Verify that no partial receiving has occurred on this PO. Contact the vendor first to confirm cancellation. Select the PO and choose Cancel from the action menu. Confirm — M3 changes status to Cancelled."],["7","Verify the Cancellation","Confirm the PO status shows as Cancelled. If partial receiving has occurred, the PO cannot be fully cancelled — close it instead."]],quiz:[{q:"PO status 35 in M3 means:",options:["PO is in draft","PO has been released/sent to the vendor","PO is fully received","PO is cancelled"],answer:1},{q:"Before cancelling a PO, you should:",options:["Print the PO first","Verify no partial receiving has occurred and contact the vendor","Change status to 20","Delete all PO lines"],answer:1},{q:"The Split action on a PO line is used to:",options:["Copy the line to a new PO","Divide one PO line into two separate lines","Cancel half the quantity","Move the line to a different vendor"],answer:1},{q:"PO notes are most useful for documenting:",options:["Financial journal entries","Vendor communication, change reasons, and special instructions","Customer order details","Inventory adjustments"],answer:1}],checklist:["I can add notes to a purchase order in PPS200","I can split a PO line into multiple lines","I can cancel a PO in status 35 after verifying no partial receiving","I can update warehouse and supplier on a PO","I know when to cancel vs. close a PO"]},{id:"pur-6",title:"Vendor Record Management",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2003%202025%20-%20P2P/Bravo%20-%20Mini%20CRP%20P2P%20scenarios-20251203%20Update%20Supplier%20on%20PO.mp4",steps:[["1","Open CRS620","Open CRS620 — the Supplier Master. Search for the vendor by number or use F4 to search by name."],["2","Review Key Vendor Fields","Review: vendor name, payment terms, currency, lead time, buyer, and account status. Note any fields that seem incorrect."],["3","Check Price Agreements","In CRS620, navigate to Related → Price Agreements. Review vendor price agreements that apply to Adleta orders."],["4","Review Vendor Addresses","Check the vendor order address and any alternate delivery addresses on file."],["5","Update Vendor Information","Select the vendor and press Change (or right-click → Change). Update payment terms, lead time, contact info, or other authorized fields. Save."],["6","Check EDI Settings","If the vendor uses EDI ordering, verify EDI settings are configured correctly. Contact IT if EDI setup changes are needed."],["7","Vendor Creation Process","Do NOT create new vendor records. New vendors must be set up by Finance/Purchasing admin. Submit a new vendor request through the approved process."]],quiz:[{q:"The M3 program for vendor/supplier records is:",options:["OIS100","PPS200","CRS620","MMS060"],answer:2},{q:"Vendor price agreements are found in CRS620 under:",options:["The Notes tab","Related → Price Agreements","The Change screen","PPS201"],answer:1},{q:"Who is responsible for creating new vendor records in M3?",options:["The purchasing super user","Any M3 user","Finance/Purchasing admin","The vendor themselves"],answer:2},{q:"Vendor lead time in CRS620 affects:",options:["Customer invoice dates","The recommended PO release date for planned orders","Payroll processing","Inventory cycle counts"],answer:1}],checklist:["I can look up a vendor in CRS620 by number and by name","I can review payment terms, lead time, and price agreements","I know which vendor fields I am authorized to update","I understand the process for requesting new vendor setup","I know how to check EDI settings for a vendor"]},
{id:"pur-7",title:"Pre-Receipts in M3",duration:"35 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/PreReceipt%20Discussion.mp4",steps:[[1,"Understand why Pre-Receipts matter","Pre-receipts allow you to record lot numbers, shade/dye-lot data, and freight costs BEFORE the physical goods arrive. This is critical for floor covering items where shade matching is essential. It enables fast turnaround when trucks arrive at the warehouse."],[2,"Open PPS300 - Pre-Receipt Entry","Navigate to Procurement > PPS300. You will either enter data manually or it will be populated automatically via EDI 856 (Advance Ship Notice) from your supplier."],[3,"Enter the Purchase Order and Delivery Note","In PPS300, enter the PO number and delivery note/manifest number. The system will pull in all PO lines for that delivery."],[4,"Enter lot numbers and shade data","For each PO line, enter the lot number (shade/dye-lot) from the supplier shipping notice or carton labels. This data is often included in the EDI 856 or emailed by the supplier."],[5,"Distribute freight and other charges","Enter freight costs, dock fees, and other charges at the header level. M3 automatically distributes these costs across ALL PO lines in the delivery note proportionally."],[6,"Confirm and save the pre-receipt","Review all lines to confirm lot data and cost distribution are correct. Save the pre-receipt. When the truck arrives, warehouse staff can receive quickly because the data is already in the system."],[7,"EDI 856 auto-populates pre-receipts","When a supplier sends an EDI 856 Advance Ship Notice, M3 automatically creates the pre-receipt record with lot numbers and quantities. You only need to add freight charges and confirm."],[8,"Verify pre-receipt status in PPS300","After saving, use PPS300 to review pre-receipt status. Confirm all lines show the correct lot/shade assignments before the physical receipt is processed."]],quiz:[{q:"What is the main benefit of entering a pre-receipt before goods arrive?",options:["It automatically orders more stock","It records lot/shade data and freight costs for fast warehouse receiving","It generates the customer invoice","It creates the purchase order"],answer:1},{q:"Which M3 screen is used for manual pre-receipt entry?",options:["PPS001","PPS300","ROO 02","WAR 8"],answer:1},{q:"When a supplier sends an EDI 856, what does M3 do automatically?",options:["Places a new purchase order","Approves the payment","Creates the pre-receipt record with lot numbers and quantities","Sends a packing list to the warehouse"],answer:2},{q:"Freight costs entered at the header level in PPS300 are:",options:["Assigned only to the first PO line","Distributed proportionally across all PO lines in the delivery","Added to the customer invoice","Ignored until final receipt"],answer:1}],checklist:["Understand the purpose of pre-receipts for lot/shade-managed items","Can open PPS300 and enter a PO and delivery note","Can enter lot numbers and shade data for each PO line","Can distribute freight and dock charges across PO lines","Can save and confirm a pre-receipt","Understand how EDI 856 auto-populates pre-receipt data","Can verify pre-receipt status before warehouse receiving"]}
,
{id:"pur-8",title:"EDI in Purchasing",duration:"30 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/BRAVO%20EDI%20WebService%20Demo.mp4",steps:[[1,"The four key EDI document types","EDI 850: Purchase Order sent to supplier. EDI 855: PO Acknowledgement received from supplier. EDI 856: Advance Ship Notice received - triggers pre-receipt. EDI 810: Invoice received from supplier."],[2,"EDI 850 - Sending Purchase Orders","When you create a PO in M3 for an EDI-enabled supplier, M3 automatically generates and transmits an EDI 850 to the supplier. No manual steps required."],[3,"EDI 855 - Receiving PO Acknowledgement","The supplier responds with an EDI 855 confirming they received and can fulfill your PO. Monitor incoming 855 acknowledgements to catch any line rejections or quantity changes early."],[4,"EDI 856 - Advance Ship Notice triggers Pre-Receipt","When your supplier ships the order, they send an EDI 856 ASN. M3 receives this and automatically creates a pre-receipt record with lot numbers, quantities, and shipment details."],[5,"EDI 810 - Inbound Invoice matching","Suppliers send EDI 810 invoices directly into M3 AP. The system attempts a 3-way match (PO, receipt, invoice). Review any exceptions in the AP invoice queue where the match failed."],[6,"Monitor EDI transaction status","Check the EDI transaction log in M3 to confirm outbound 850s were transmitted successfully and inbound 855/856/810 documents were received and processed without errors."],[7,"Handle EDI exceptions","If an EDI 856 fails to create a pre-receipt (e.g., mismatched PO number), you will need to manually enter the pre-receipt in PPS300. Contact your EDI administrator if transmission errors persist."],[8,"AHF Products EDI setup","AHF Products is one of Adleta key EDI-enabled suppliers. Their EDI 850 PO format uses specific item number conventions. Refer to the AHF EDI spec document when troubleshooting AHF transactions."]],quiz:[{q:"Which EDI document type is sent by Adleta to the supplier to place a purchase order?",options:["EDI 810","EDI 855","EDI 850","EDI 856"],answer:2},{q:"An EDI 856 Advance Ship Notice automatically creates:",options:["A new purchase order","A pre-receipt record in M3","An AP invoice","A customer shipment"],answer:1},{q:"EDI 810 is used for:",options:["Sending purchase orders","Receiving inbound supplier invoices","Advance ship notices","PO acknowledgements"],answer:1},{q:"If an EDI 856 fails to process, you should:",options:["Delete the PO and start over","Wait for the supplier to resend","Manually enter the pre-receipt in PPS300","Call the customer"],answer:2}],checklist:["Know the four EDI document types (850, 855, 856, 810) and their purposes","Understand how EDI 850 is sent automatically when a PO is created","Can monitor incoming EDI 855 acknowledgements for exceptions","Understand how EDI 856 triggers automatic pre-receipt creation","Can review EDI 810 invoice matches and exceptions in AP","Can check EDI transaction log for errors","Know how to manually handle EDI failures via PPS300"]}
]},
  inventory:{id:"inventory",name:"Inventory Management",owner:"Alan Burk / Jose Manjarrez",weeks:"Week 4",pill:"pill-teal",color:"#1a7a6d",programs:["MMS060","MMS200","MMS100","MMS150","MMS300"],summary:"Item lookup, stock balances, transfers, adjustments, cycle counts, discrepancy handling.",links:[["Deck",SP+"/Adleta_M3_Inventory_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Inventory_LearningGuide.docx"]],sessions:[{id:"inv-1",title:"Item Lookup and Stock Balance — MMS060 and MMS200",duration:"45 min",steps:[["1","Open MMS060","Navigate to Inventory > Item Master > MMS060"],["2","Enter Item Number","Type the Adleta item number and press Enter"],["3","Review Item Record","Check status, UOM, item category, stock method"],["4","Open MMS200","Navigate to Inventory > Stock Balance > MMS200"],["5","Enter Item Number","See all stock for that item across all locations"],["6","Check Available Qty","On-hand minus Allocated = Available. Use Available when promising stock"]],videoUrl:"",quiz:[{q:"What does Available quantity mean in MMS200?",options:["Total in warehouse","On-hand minus allocated","Quantity on order","Quantity shipped today"],answer:1},{q:"Before any inventory transaction, the item status must be:",options:["Pending (10)","Active (20)","Inactive (90)","On hold (50)"],answer:1},{q:"Which program shows stock balance by location?",options:["MMS060","MMS150","MMS200","MMS300"],answer:2}],checklist:["I can look up an item record in MMS060","I can check on-hand and available stock in MMS200","I understand the difference between on-hand, allocated, and available","I know which quantity to use when promising stock to Sales"]},{id:"inv-2",title:"Transfers and Adjustments — MMS100 and MMS150",duration:"60 min",steps:[["1","Open MMS100","Navigate to Inventory > Stock Transfer > MMS100"],["2","Enter Item and From Location","Item number and the bin the stock is leaving"],["3","Enter To Location","Destination warehouse and bin"],["4","Enter Quantity","Must not exceed available at From location"],["5","Confirm Transfer","Press Enter — both balances update immediately"],["6","Open MMS150 for Adjustments","Navigate to Inventory > Stock Adjustment > MMS150"],["7","Enter Reason Code","CYCLE / DAMAGE / EXPIRE / RCVERR / SHRINK / WRITUP"],["8","Enter Notes","Required for audit — explain why the adjustment is needed"]],videoUrl:"",quiz:[{q:"Which program is used to move stock between warehouse locations?",options:["MMS060","MMS150","MMS200","MMS100"],answer:3},{q:"An inventory adjustment for damaged goods uses reason code:",options:["CYCLE","DAMAGE","SHRINK","RCVERR"],answer:1},{q:"Adjustments above $500 in value require:",options:["IT approval","Manager approval before entry","Finance approval after entry","No approval needed"],answer:1}],checklist:["I can process a stock transfer between locations","I can process an inventory adjustment with the correct reason code","I know when manager approval is required for adjustments","I always verify available quantity before transferring"]},{id:"inv-3",title:"Cycle Counting — MMS300",duration:"60 min",steps:[["1","Understand cycle counting","Cycle counting is a method of counting a subset of inventory on a regular schedule instead of shutting down for a full physical count. M3 manages this in MMS300."],["2","Open MMS300","Navigate to Inventory > Cycle Count > MMS300."],["3","Review the count list","M3 generates a list of items and locations assigned for counting. Review item number, location, and system on-hand quantity."],["4","Perform the physical count","Go to the physical location. Count actual units. Do not look at the system quantity before counting — blind counts are more accurate."],["5","Enter count results","Return to MMS300. Enter the actual counted quantity for each line. If the count matches, confirm. If different, recount before entering."],["6","Review variances","M3 flags lines where counted quantity differs from system quantity. Review each variance — note the item, location, system qty, counted qty, and difference."],["7","Approve or escalate variances","Small variances within Adleta tolerance: enter with reason code CYCLE. Large variances: escalate to manager before posting. Finance may need to approve if financial impact is significant."],["8","Post the count","After approval, post the cycle count. M3 updates on-hand balances to match counted quantities and creates an audit record."],["9","Investigate root cause","For repeated variances on the same item or location, investigate: receiving errors, transfer errors, unreported damage, or picking errors. Log findings in the issue log."]],videoUrl:"",quiz:[{q:"The best practice when performing a physical cycle count is:",options:["Check the system quantity first so you know what to expect","Count blind — do not look at the system quantity before counting","Only count items with recent transactions","Count everything in the warehouse at once"],answer:1},{q:"A large cycle count variance should be:",options:["Posted immediately so the system is updated","Escalated to management before posting, especially if the financial impact is significant","Ignored if the item is low value","Adjusted using reason code DAMAGE"],answer:1},{q:"After posting a cycle count, M3:",options:["Sends an alert to Finance automatically","Updates on-hand balances to match the counted quantities and creates an audit record","Closes the item record until the next count","Requires IT approval to finalize"],answer:1},{q:"Repeated variances on the same item or location most likely indicate:",options:["A system configuration error that only IT can fix","A counting error by the same person","A process problem — receiving, transfer, damage, or picking errors — that needs root cause investigation","Normal inventory shrinkage that requires no action"],answer:2}],checklist:["I understand the purpose of cycle counting and how it differs from a full physical count","I can open MMS300 and review a cycle count list","I perform counts blind without checking system quantity first","I know how to enter count results and review variances","I know when to post a variance vs escalate to management","I can investigate and log the root cause of a repeated variance"]},
{id:"inv-4",title:"AAA - Automatic Allocation Algorithm",duration:"45 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/AAA%2010-16-2025.mp4",steps:[[1,"Understand why AAA exists","Floor covering products from the same item number can have different shades or dye-lots. Selling mismatched shades to a customer for the same room is a serious quality issue. AAA ensures M3 automatically selects matching shade inventory when entering orders."],[2,"Identify AAA-eligible items","AAA only applies to items flagged as AAA items. Check the item master custom fields (G panel) for the AAA item flag. If set to YES, the AAA logic runs during order entry."],[3,"Understand the Rule Set ID","Each AAA item has a Rule Set ID assigned in the item master. The Rule Set defines the allocation priority logic - for example, prioritizing by best shade match, then by age, then by warehouse location."],[4,"Order entry with AAA","When an order line is entered for an AAA item, M3 automatically evaluates available lot/shade inventory and allocates the best matching lot(s) based on the item Rule Set. The order entry person sees the proposed allocation and can accept or override it."],[5,"Roll Goods vs. Cut Goods","AAA distinguishes between Roll Goods (continuous rolls sold by length) and Cut Goods (tiles, planks). The Roll Good Indicator field in the item master controls this. Rolls try to fulfill from a single roll to avoid shade breaks."],[6,"Handling back-order lines with AAA","When new inventory arrives for a back-ordered AAA item, the system automatically evaluates the incoming lot shade against waiting orders and fills back-orders in priority order based on the Rule Set."],[7,"Accessing AAA screens","AAA configuration screens are accessed via Control R in M3 (or through Administration Tools > AAA 900 during setup). Super users should know how to look up an item AAA settings but should not change Rule Sets without IT or purchasing manager approval."],[8,"When AAA does not allocate as expected","If an order comes through without AAA allocation, check: (1) Is the AAA flag set on the item? (2) Is the Rule Set ID populated? (3) Is there qualifying inventory on hand? Contact Purchasing if settings appear incorrect."]],quiz:[{q:"What is the primary business reason AAA was built for floor covering distribution?",options:["To speed up order entry","To ensure customers receive matching shade/dye-lot inventory","To reduce purchase order processing time","To automate truck routing"],answer:1},{q:"AAA logic only applies to items where which flag is set?",options:["Roll Good Indicator = YES","AAA Item flag = YES","Lot Managed = YES","Direct Ship = YES"],answer:1},{q:"What is a Rule Set ID?",options:["The item lot number","The configuration that defines AAA allocation priority logic","The EDI transaction code","The warehouse zone for the item"],answer:1},{q:"If an order is not being allocated by AAA, what should you check first?",options:["The customer credit limit","Whether the AAA flag and Rule Set ID are set on the item master","The freight terms on the order","The EDI 850 status"],answer:1}],checklist:["Understand why AAA exists and what business problem it solves","Can identify AAA-eligible items using the item master custom fields","Know what a Rule Set ID controls","Understand Roll Goods vs Cut Goods allocation difference","Know how order entry works with AAA allocation","Understand how back-orders are filled using AAA logic","Can look up AAA settings on an item (view-only)","Know when to escalate AAA allocation issues to Purchasing"]}
]},
  orderManagement:{id:"orderManagement",name:"Order Management / Sales",owner:"Tony Shipka + Jeanell Coral",weeks:"Week 5",pill:"pill-gold",color:"#c49a2a",programs:["CRS610","OIS100","OIS101","OIS300","OIS390","MMS200"],summary:"Customer lookup, order entry, pricing, availability, shipments, backorders, and returns.",links:[["Deck",SP+"/Adleta_M3_OrderManagement_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_OrderManagement_LearningGuide.docx"]],sessions:[{id:"ord-1",title:"Customer Lookup and Sales Order Entry — OIS100",duration:"60 min",steps:[["1","Open CRS610","Navigate to Sales > Customer Master > CRS610"],["2","Look Up Customer","Enter customer number or press F4 to search by name"],["3","Verify Customer","Check name, address, payment terms, credit status, price list"],["4","Open OIS100","Navigate to Sales > Customer Orders > OIS100"],["5","Press F3","New sales order"],["6","Enter Customer Number","M3 auto-fills name, address, terms"],["7","Enter Delivery Date","Date customer wants the order"],["8","Enter Customer PO Number","Required when customer provides one"],["9","Save","M3 assigns order number — record it"]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2005%202025%20-%20Manual%20Order/Bravo%20-%20Mini-CRP%20Manual%20order%20scenarios-20251205%20Manual%20Order%20CL1.mp4",quiz:[{q:"Where do you look up a customer's price list assignment?",options:["OIS100","OIS010","CRS610","MMS060"],answer:2},{q:"The Customer PO Number field is:",options:["Not required ever","Required when the customer provides one","Generated automatically by M3","Only used for returns"],answer:1},{q:"After saving the order header in OIS100, you add products in:",options:["OIS300","CRS610","OIS101","OIS390"],answer:2}],checklist:["I can look up a customer in CRS610 and verify their details","I can create a sales order header in OIS100","I always enter the customer PO number when provided","I record the M3 order number after saving"]},{id:"ord-2",title:"Shipments and Returns — OIS300 and OIS390",duration:"60 min",steps:[["1","Open OIS300","Navigate to Sales > Shipment Processing > OIS300"],["2","Find Order","Enter customer order number"],["3","Verify Shipment","Confirm items, quantities, ship-to address"],["4","Enter Ship Date","Today's date"],["5","Enter Tracking","Carrier name and tracking number if available"],["6","Confirm","Press F5 — inventory updated, invoice generated"],["7","For Returns open OIS390","Get manager authorization first"],["8","Reference Original Order","Enter original sales order number"],["9","Enter Return Reason","DEFECT / WRONGITEM / WRONGQTY / CUSTCANCEL"]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Customer%20Return.mp4",quiz:[{q:"Confirming a shipment in OIS300 automatically:",options:["Creates a new order","Updates inventory and generates invoice","Sends email to customer","Closes the customer account"],answer:1},{q:"Before processing a return in OIS390, you must:",options:["Enter the return in CRS610","Get manager authorization","Check stock in MMS200","Create a new sales order"],answer:1},{q:"Which reason code is used when the wrong item was shipped?",options:["DEFECT","CUSTCANCEL","WRONGITEM","OVERSHIP"],answer:2}],checklist:["I can process a shipment confirmation in OIS300","I can handle a partial shipment correctly","I know the return process and when to get authorization","I can select the correct return reason code in OIS390"]},{id:"ord-3",title:"Availability, Backorders, and Order Status — MMS200 and OIS101",duration:"60 min",steps:[["1","Check availability before promising — MMS200","Open MMS200, enter the item number. Use Available quantity — not On-hand — when telling a customer what can ship. Available = On-hand minus Allocated."],["2","Check availability on the order line — OIS101","Open the order in OIS101. M3 shows availability directly on the order line. If available qty is less than ordered qty, a backorder will be created automatically."],["3","Understand backorder behavior","When M3 cannot fulfill the full quantity, it creates two lines: one for the quantity that can ship now, one for the remaining quantity on backorder. Both carry the same order number."],["4","Communicate backorder to the customer","Before confirming the order, contact the customer to confirm: partial shipment acceptable, backorder date, or whether to wait for full availability. Document the customer's decision in the order notes."],["5","Check order status","In OIS100, the order status tells you where the order is in the process. Know the key statuses: open, released to warehouse, partly shipped, fully shipped, invoiced."],["6","Locate a stuck order","If a customer calls about an order that has not shipped, open OIS100 and check status. If released but not shipped, contact Warehouse. If on hold, check credit status in CRS610."],["7","Handle a partial shipment","If Warehouse ships less than the full order quantity, OIS300 captures the actual shipped amount. The remaining quantity stays open on the order unless the customer cancels the backorder."],["8","Cancel a backorder line","If the customer does not want the remaining quantity, open OIS101, select the backorder line, and cancel it using the correct cancel reason code. Confirm with manager if the value is significant."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20Manual%20Order%20Hard%20Hold%20Credit.mp4",quiz:[{q:"When promising stock to a customer, you should use:",options:["On-hand quantity","Allocated quantity","Available quantity — on-hand minus allocated","Quantity on order from suppliers"],answer:2},{q:"When M3 cannot fulfill the full order quantity, it:",options:["Cancels the entire order","Holds the order until all stock is available","Creates two lines — one for what can ship now and one backorder line for the remainder","Sends an automatic email to the customer"],answer:2},{q:"If a customer's order shows status Released but has not shipped, your first step is:",options:["Cancel the order and re-enter it","Contact Warehouse to check the shipment status","Call the customer and tell them it shipped","Re-enter the order with a new delivery date"],answer:1},{q:"Before confirming a backorder with a customer, you must:",options:["Process the shipment first","Get manager approval to create any backorder","Contact the customer to confirm whether partial shipment, backorder, or cancellation is acceptable","Check the GL account balance"],answer:2}],checklist:["I use Available quantity from MMS200 — not On-hand — when promising stock","I understand how M3 handles backorders and can explain it to a customer","I know the key order status codes and what each one means","I can locate a stuck order and identify whether it is a warehouse or credit issue","I know how to handle a partial shipment and what happens to the remaining quantity","I can cancel a backorder line with the correct reason code"]},{id:"ord-4",title:"Will Call Order Processing",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Immediate%20delivery%20via%20will%20call.mp4",steps:[["1","Open Order Entry","Open OIS300 or OIS100. Confirm you are in the correct environment (Test or Production)."],["2","Enter Customer and Order Details","Enter the customer account number. Select the appropriate Ship-To code. Enter the desired order date. Proceed to the next screen and confirm."],["3","Set Warehouse and Delivery Method","Verify the correct warehouse is selected. Change the delivery method to Will Call."],["4","Enter PO Number and Side Mark","Enter the customer PO number. Enter side mark information if required."],["5","Add Items","Enter item number and order quantity. Confirm inventory selection to source material from the selected warehouse."],["6","Process the Order","Review delivery details — confirm Will Call, warehouse, and order date. Save the order. Press F3 to process."],["7","Add Will Call Charges","Highlight the order. Navigate to the Charges section. Right-click and select Change. Enter the Will Call charge amount. Save the charge."],["8","Verify Documents and Charges","Verify correct documents are linked to the order type. Confirm Will Call charges appear correctly. Adjust or delete charges if necessary."],["9","Release to Warehouse","Order is released to the warehouse for picking and packing. Order can be issued directly without load building."]],quiz:[{q:"Will Call orders are issued at which level?",options:["Shipment level","Load level","Delivery level","Invoice level"],answer:2},{q:"Why do Will Call orders not require load building?",options:["They are too small","Customer picks up at the warehouse — no truck loading needed","IT disabled it for Will Call","The warehouse skips this step"],answer:1},{q:"Where do you change the delivery method to Will Call?",options:["CRS610","APS100","OIS300/OIS100 order header","PPS200"],answer:2},{q:"Will Call charges are added in which section of the order?",options:["Item lines","Order header comments","Charges section","Delivery notes"],answer:2}],checklist:["I can create a Will Call order in OIS300/OIS100","I know how to change the delivery method to Will Call","I can add Will Call charges to an order","I understand Will Call orders are issued at the delivery level — no load building required","I can verify the correct warehouse and Will Call route are assigned"]},{id:"ord-5",title:"Common Carrier Order Processing",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20Manual%20Order%20CC%20COD.mp4",steps:[["1","Start a New Order","Open OIS100. Start a new order."],["2","Select Customer and Set Delivery Method","Select the correct customer. Set the Delivery Method to Common Carrier (CC). Verify and confirm the delivery address."],["3","Add Items","Enter item numbers and quantities. Confirm the inventory source location. Add required notes (e.g., CO number) in Quick Notes if applicable."],["4","Apply Charges","Add delivery charges at the line level or order header as required. Use default charges tied to the order type when available. Enter charges manually if defaults are not applied."],["5","Process Order","Review all order details. Confirm delivery method, address accuracy, and charges. Finalize and process the order."],["6","Picking and Staging","Warehouse team picks items. Orders are staged for common carrier shipment."],["7","Issue Deliveries","Issue deliveries at the delivery level — not the shipment level. Use desktop or RF handheld device."],["8","Address Changes if Needed","Use system shortcuts to update delivery addresses. Address changes must be completed before issuing the delivery."],["9","Enter Tracking Number","Enter tracking numbers at the delivery level. Tracking may be entered manually or via TMS integration."]],quiz:[{q:"The delivery method code for Common Carrier in M3 is:",options:["OT","WC","CC","PP"],answer:2},{q:"Tracking numbers for Common Carrier shipments are entered at the:",options:["Order header","Invoice","Delivery level","Shipment level"],answer:2},{q:"A delivery address change must be completed:",options:["After issuing the delivery","Before issuing the delivery","At the invoice stage","At any time"],answer:1},{q:"If you encounter load building or tracking number issues, you should:",options:["Skip that step","Delete the order and re-enter","Escalate to the Support Team","Ask the customer to call back"],answer:2}],checklist:["I can create a Common Carrier order in OIS100","I know how to apply delivery charges at the line and header level","I can issue a delivery at the delivery level","I know how to update a delivery address before issuing","I can enter a tracking number at the delivery level"]},{id:"ord-6",title:"COD Order Processing",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Manual%20Order%20WC%20COD.mp4",steps:[["1","Start a New Order","Open OIS100. Start a new order for the COD customer."],["2","Enter Customer Details","Enter the customer account number. M3 will recognize the COD payment terms from the customer master."],["3","Set Delivery Method","Set delivery method based on how the customer is receiving: Will Call (WC), Common Carrier (CC), or OT route."],["4","Add Items and Quantities","Enter item numbers and quantities. Confirm inventory source location."],["5","Review COD Terms","Confirm COD payment terms are applied to the order. COD requires payment at or before delivery."],["6","Process Prepayment if Required","For COD customers requiring prepayment, process the prepayment in M3 before releasing the order to the warehouse."],["7","Add Charges","Add any applicable delivery or handling charges."],["8","Process and Release Order","Review all details. Process the order and release to the warehouse."],["9","Collect Payment at Delivery","For common carrier COD — confirm carrier collects payment. For will call COD — collect payment before releasing goods."]],quiz:[{q:"COD stands for:",options:["Confirmed Order Delivery","Cash On Delivery","Customer Order Date","Close of Day"],answer:1},{q:"When is payment collected for COD orders?",options:["30 days after invoice","At or before delivery","Upon order entry","After the monthly statement"],answer:1},{q:"If a COD customer wants will call, the delivery method should be set to:",options:["OT","CC","Will Call with COD terms","Standard delivery"],answer:2},{q:"Prepayment for a COD order in M3 must be processed:",options:["After goods ship","Before releasing the order to the warehouse","At month end","By Finance only"],answer:1}],checklist:["I understand the difference between COD and net terms orders","I can enter a COD order in OIS100 for will call and common carrier scenarios","I know when prepayment is required and how to process it","I can apply the correct delivery method for COD orders"]},{id:"ord-7",title:"Quote to Customer Order Conversion",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20LnTp%200%20Quote%20to%20CO%20OT%20N30.mp4",steps:[["1","Open OIS100","Open OIS100 and select the Quote order type or line type 0."],["2","Enter Customer and Delivery Details","Enter the customer number, delivery date, and customer PO number."],["3","Add Items and Quantities","Enter items and quantities as a quotation. Pricing is applied but inventory is not committed."],["4","Save the Quote","Save the quote — M3 assigns a Quote number. The quote is now in the system but does not affect inventory or firm demand."],["5","Customer Confirmation","When the customer confirms the order, locate the quote in OIS100 by quote number or customer."],["6","Convert Quote to Customer Order","Use the conversion action in OIS100 to convert the quote to a confirmed Customer Order. M3 changes the order type from Quote to CO."],["7","Verify Converted Order","Confirm pricing, delivery details, and order lines after conversion. M3 now commits inventory to this order."],["8","Process Normally","Process the confirmed customer order through the normal Order to Cash workflow."]],quiz:[{q:"A quote in M3 differs from a confirmed customer order because:",options:["Quotes have no items","Quotes do not commit inventory until converted to a CO","Quotes cannot have delivery dates","Quotes skip the invoicing step"],answer:1},{q:"To convert a quote to a customer order, you use:",options:["A new order entry in OIS100","The conversion action within OIS100","PPS200","A manual journal entry"],answer:1},{q:"After converting a quote to a CO, M3 will:",options:["Delete the original quote","Commit inventory to the order","Automatically invoice the customer","Require re-entry of all items"],answer:1},{q:"The quote workflow is typically used for:",options:["All routine daily orders","Small will call orders","Large or custom orders requiring customer approval before commitment","COD customers only"],answer:2}],checklist:["I can create a quote in OIS100 using the correct order type or line type","I can save a quote and locate it later by quote number or customer","I can convert a quote to a confirmed customer order","I understand the inventory commitment difference between a quote and a CO"]},{id:"ord-8",title:"Drop Ship Order Processing",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Drop%20Ship%20Quote%20to%20CO%20with%20NonCX.mp4",steps:[["1","Open OIS100","Open OIS100 and start a new order."],["2","Enter Customer and Delivery Details","Enter customer number and delivery details. The delivery address should reflect the customer's location — not Adleta's warehouse."],["3","Set Line Type to 2","On the order line, set the line type to 2 (Direct Delivery — from supplier directly to customer)."],["4","Enter Item and Supplier","Enter item number, quantity, and the supplier who will ship directly to the customer."],["5","M3 Creates Linked PO","When saved, M3 automatically creates a Purchase Order tied to this customer order line. The PO routes to the supplier."],["6","Review the Supply Chain","Verify the linked PO in the supply chain view. Confirm supplier, quantity, and delivery address are correct."],["7","Supplier Ships to Customer","The supplier ships directly to the customer. Adleta does not physically handle the goods."],["8","Confirm Receipt and Invoice","When the supplier confirms shipment, receive/confirm in M3. M3 then invoices the customer based on the customer order."]],quiz:[{q:"Drop ship orders in M3 use which line type?",options:["0","1","2","3"],answer:2},{q:"In a drop ship order, goods are shipped by:",options:["Adleta warehouse","A third-party logistics provider","The supplier directly to the customer","The customer picking up at Adleta"],answer:2},{q:"When you save a drop ship order line, M3 automatically creates a:",options:["Delivery note","Purchase Order linked to the customer order","Credit memo","Journal entry"],answer:1},{q:"Drop ship is used when:",options:["The item is in stock at Adleta","The customer wants will call","The product is not stocked in the Adleta warehouse and ships from supplier","The order is COD"],answer:2}],checklist:["I can create a drop ship order using line type 2 in OIS100","I understand that M3 automatically creates a linked PO for drop ship lines","I can verify the supply chain to confirm supplier and delivery address","I know when to use drop ship vs. ship from Adleta warehouse"]}]},
  financeAP:{id:"financeAP",name:"Finance — AP and AR",owner:"Philip Jones",weeks:"Week 6",pill:"pill-red",color:"#c0443b",programs:["APS100","APS200","ARS100","ARS200","ARS300"],summary:"Supplier invoices, payment runs, customer invoices, cash application, AR aging.",links:[["Deck",SP+"/Adleta_M3_Finance_APAR_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Finance_APAR_LearningGuide.docx"]],sessions:[{id:"fin-1",title:"Vendor Invoice Entry and Three-Way Match — APS100",duration:"60 min",steps:[["1","Open APS100","Navigate to Accounts Payable > Invoice Entry > APS100"],["2","Enter Supplier Number","M3 fills vendor name and payment terms"],["3","Enter Invoice Number","Exact match to vendor invoice — must be unique per vendor"],["4","Enter Invoice Date","Date on vendor invoice — not today"],["5","Enter Invoice Amount","Total including taxes and freight"],["6","Reference PO Number","Required for three-way match"],["7","Run Match","Press F14 — M3 compares invoice to PO and receipt"],["8","Review Result","Matched = auto-approved. Variance = manual review"]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20Invoice%20w%20Po%20(PO%20Match).mp4",quiz:[{q:"The Invoice Date field should contain:",options:["Today's date","The date you entered the invoice","The date on the vendor's invoice","The payment due date"],answer:2},{q:"To run the three-way match in APS100 you press:",options:["F3","F5","F14","F17"],answer:2},{q:"An invoice cannot be processed without:",options:["A shipping address","A valid PO reference","A GL account code","The vendor's email"],answer:1}],checklist:["I can enter a vendor invoice in APS100","I can run the three-way match using F14","I understand the match outcomes — matched vs variance","I know how to resolve a price discrepancy"]},{id:"fin-2",title:"Cash Application and AR Aging — ARS200 and ARS300",duration:"45 min",steps:[["1","Open ARS200","Navigate to Accounts Receivable > Cash Application > ARS200"],["2","Enter Customer Number","Find the paying customer"],["3","Enter Payment Details","Amount, date, and reference number"],["4","Select Invoices","Choose invoices this payment covers"],["5","Verify Balance","Total applied must equal payment amount"],["6","Confirm","M3 marks selected invoices as paid"],["7","Open ARS300","Navigate to AR > Aging > ARS300"],["8","Review Overdue","Buckets: Current / 1-30 / 31-60 / 61-90 / 90+ days past due"]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/FINANCE/AR%20-%20Finance%20Master%20Data%20List%20Configuration-20241211_083423-Meeting%20Recording.mp4",quiz:[{q:"Unapplied customer payments appear as:",options:["Paid invoices","Open credits on the customer account","Revenue in the GL","Errors in ARS300"],answer:1},{q:"For a partial payment, you should apply to:",options:["The newest invoices first","The largest invoices first","The oldest invoices first","Any invoice randomly"],answer:2},{q:"A customer with 90+ days past due balance should be:",options:["Ignored until they call","Escalated to management for possible collections","Given an automatic credit hold by M3","Sent a new invoice"],answer:1}],checklist:["I can apply a customer payment to invoices in ARS200","I know how to handle partial payments","I can read and act on the AR aging report in ARS300","I know when to escalate overdue accounts to management"]},{id:"fin-3",title:"Payment Runs and AP Aging — APS200",duration:"60 min",steps:[["1","Understand payment runs","A payment run is a batch process that selects approved invoices due for payment and generates checks or ACH payments. Running payments at the wrong time or with wrong parameters can result in duplicate payments, missed discounts, or paying invoices on hold."],["2","Open APS200","Navigate to Accounts Payable > Payment > APS200. This is the payment proposal screen — M3 shows all invoices approved and due within your selected date range."],["3","Set payment parameters","Enter the payment date, bank account, and payment method (check or ACH). Set the due date cutoff — only invoices due on or before this date will be included."],["4","Review the proposal","Before running, review every invoice in the proposal. Confirm: supplier name, invoice number, amount, and due date are correct. Flag any surprises — unknown vendors, unusually large amounts, or invoices you expected to be on hold."],["5","Remove invoices from the run","If an invoice should not be paid this cycle, select it and remove it from the proposal. Document the reason. Common reasons: dispute in progress, awaiting credit memo, payment terms renegotiated."],["6","Approve and execute","After review and approval from your manager, press F5 to execute the payment run. M3 generates the payment records. Print check remittances or transmit ACH file as required by your bank process."],["7","Review AP aging after the run","Open APS200 or the AP aging report. Confirm paid invoices are now showing as closed. If any invoice that should have paid is still open, investigate before the next run."],["8","Handle payment exceptions","If a check is lost or an ACH is returned, do not re-run without voiding the original first. Log the exception with supplier, invoice number, original payment date, and issue. Escalate to Finance management before reissuing."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Payment%20Proposal%20CH1%20(Check%20in-house).mp4",quiz:[{q:"Before executing a payment run in APS200, you must:",options:["Automatically run the full proposal without review","Review every invoice in the proposal and remove any that should not be paid this cycle","Get approval from IT","Run the GL period close first"],answer:1},{q:"If a check is lost after a payment run, your first step is:",options:["Re-run the payment immediately","Void the original payment before reissuing — never reissue without voiding first","Contact the supplier and ask them to ignore the original","Wait 30 days"],answer:1},{q:"The due date cutoff parameter in APS200 controls:",options:["When the bank transmits the ACH file","Which invoices are included — only invoices due on or before that date","The accounting period for the GL posting","The payment method — check or ACH"],answer:1},{q:"After a payment run completes, you should:",options:["Close the period immediately","Review AP aging to confirm paid invoices are closed and investigate any that are still open","Send remittances to all suppliers","Archive the invoices in SharePoint"],answer:1}],checklist:["I can set payment parameters in APS200 — payment date, bank account, method, and due date cutoff","I review every invoice in the proposal before approving the run","I know how to remove an invoice from a payment proposal and document the reason","I can execute a payment run and confirm paid invoices are closed in AP aging","I know the correct process for a lost check or returned ACH — void before reissuing","I escalate payment exceptions to Finance management before taking action"]},{id:"fin-4",title:"Hold and Reverse an Invoice",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20AP%20Display%20(APS205)%20Hold%20Invoice%20.mp4",steps:[["1","Locate the Invoice in APS200","Open APS200. Search for the invoice by invoice number, vendor, or date. Confirm the invoice details."],["2","Place a Hold","Select the invoice. Navigate to APS205 or right-click → Hold. Enter a hold reason code. Save — M3 prevents payment processing until the hold is released."],["3","Communicate the Hold","Notify the vendor and relevant Finance team members of the hold reason and expected resolution."],["4","Release the Hold","Once the discrepancy is resolved, open APS205. Select the hold. Choose Release. M3 returns the invoice to approved/payable status."],["5","Reverse a Posted Invoice","For a posted invoice that needs full reversal: open APS200, locate the posted invoice. Select Change → Reverse Invoice."],["6","Enter Reversal Details","Enter the reversal reason and confirm. M3 creates an offsetting entry in the GL to cancel the original invoice."],["7","Review the Reversal","Review the reversed invoice and confirm the GL impact. The invoice is now cancelled — re-enter corrected invoice if needed."]],quiz:[{q:"Invoice holds are managed in which M3 program?",options:["APS100","APS200","APS205","PPS200"],answer:2},{q:"After reversing an invoice, M3 automatically:",options:["Pays the vendor","Creates an offsetting GL entry","Cancels the related PO","Emails the vendor"],answer:1},{q:"A common reason to hold an invoice is:",options:["The vendor is a new account","A price or quantity discrepancy requiring vendor clarification","The warehouse is busy","The PO was cancelled"],answer:1},{q:"After resolving a hold, you must ___ before payment can process:",options:["Create a new invoice","Delete the hold record","Release the hold in APS205","Re-enter the PO"],answer:2}],checklist:["I can place an invoice on hold using APS205","I can release an invoice hold after resolution","I can reverse a posted invoice in APS200","I understand the GL impact of a reversed invoice","I know when to hold vs. reverse an invoice"]},{id:"fin-5",title:"AP Wire Payment Processing",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Payment%20Proposal%20WID%20(Wire).mp4",steps:[["1","Confirm Invoices are Approved","Open APS100. Confirm the invoices for wire payment are approved and in payable status."],["2","Create Payment Proposal","Navigate to the payment proposal function in APS100."],["3","Select Wire Payment Method","Select payment method WID (Wire). Enter the payment date and select the correct Adleta bank account."],["4","Select Invoices","Select the invoices to include in the wire payment run. Review vendor bank details are on file."],["5","Review the Proposal","Review the payment proposal — verify amounts, vendors, and bank account details. Correct any errors before confirming."],["6","Confirm the Proposal","Confirm the wire payment proposal in M3. This does not initiate the actual bank transfer — it records the payment in M3."],["7","Coordinate with Finance for Bank Transfer","Share the wire details with the Finance team to initiate the actual bank transfer through the banking system."],["8","Post After Bank Confirmation","Once the wire is confirmed by the bank, post the payment in M3 to finalize."]],quiz:[{q:"Wire payments in M3 use payment method code:",options:["CH1","WC","WID","ACH"],answer:2},{q:"Before running a wire payment proposal, invoices must be:",options:["On hold","Approved and in payable status","Entered today","Matched to a PO"],answer:1},{q:"After confirming the payment proposal in M3, what additional step is required?",options:["Nothing — the wire is sent automatically","Coordinate with Finance to initiate the actual bank transfer","Void the invoices","Print a check"],answer:1},{q:"Wire payment proposals are run from:",options:["PPS200","APS200","APS100","CRS620"],answer:2}],checklist:["I can create an AP wire payment proposal in APS100","I know how to select the correct bank account and payment date","I understand that confirming in M3 does not initiate the actual bank transfer","I can review and confirm a payment proposal before processing","I know the post-wire bank confirmation step"]},{id:"fin-6",title:"AP Void and Re-issue Check",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AP%20Void%20Check.mp4",steps:[["1","Locate the Check","Open the payment record in APS200 or the check register. Locate the check by number, date, or vendor."],["2","Void the Check","Select the payment. Choose Void Check. Enter the void reason (lost, damaged, incorrect amount/payee). Confirm the void."],["3","Confirm Invoice is Restored","After voiding, M3 reverses the payment and restores the invoice to unpaid/approved-for-payment status. Verify this in APS200."],["4","Document the Void","Add a note to the vendor record or invoice documenting the void reason and date for audit purposes."],["5","Create New Payment Proposal","Create a new payment proposal for the same invoice. Select Check (CH1) as the payment method."],["6","Assign Check Number","Assign a new check number or let M3 auto-assign. Print the new check."],["7","Confirm the Re-issue","Confirm the re-issued check and post the payment in M3 once the check is delivered to the vendor."]],quiz:[{q:"After voiding a check, the invoice status in M3 returns to:",options:["Cancelled","Unpaid/Approved for Payment","Posted","On Hold"],answer:1},{q:"A check would typically be voided when:",options:["The vendor requests early payment","It was lost, damaged, or issued with incorrect details","The PO was over-received","Month-end close is running"],answer:1},{q:"To re-issue a check after voiding, you create a:",options:["New vendor record","New invoice entry","New payment proposal for the same invoice","Manual GL journal entry"],answer:2},{q:"Voiding a check in M3 does which of the following?",options:["Cancels the invoice permanently","Reverses the payment entry and restores the invoice","Notifies the vendor automatically","Closes the PO"],answer:1}],checklist:["I can void a check payment in M3","I understand what happens to the invoice after a void","I can create a new payment proposal to re-issue a check","I know how to document a void for audit purposes","I know when to void vs. reverse a payment"]},
{id:"fin-7",title:"Lockbox and AP Check Printing",duration:"35 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Lockbox%20Demo.mp4",steps:[[1,"Understand Lockbox processing","A lockbox is a bank service where customer payments are sent directly to the bank, which processes them and sends a data file to M3. This automates cash posting and reduces manual data entry in Accounts Receivable."],[2,"Receive the lockbox file from the bank","The bank sends a lockbox file daily. In M3, navigate to the AR Lockbox import function. Select the incoming file and validate that payment totals match the bank daily lockbox report."],[3,"Review and apply lockbox payments","M3 attempts to automatically match lockbox payments to open AR invoices by customer and invoice number. Review any unmatched payments and manually apply them to the correct open items."],[4,"Post lockbox cash receipts","Once all payments are matched, post the lockbox batch. This updates customer balances, closes matched invoices, and records the deposit in GL. Run the End of Day Cash Posting report to reconcile against the bank statement."],[5,"Understand AP Check Printing setup","Adleta prints checks on blank check stock using M3 and Fifth Third Bank required format. The check layout is defined in M3 IDM (Intelligent Document Management) via the APS141PF printer file."],[6,"Create a Payment Proposal","Navigate to APS130/B - Supplier Payment Proposal. Select open AP invoices due for payment. Review the proposal for accuracy - verify vendor names, amounts, and due dates before approving."],[7,"Print checks from the payment proposal","Approve the payment proposal and initiate check printing. M3 prints the check using the Fifth Third Bank format with remittance details, invoice numbers, check amount, and company banking information on blank check stock."],[8,"Reconcile printed checks","After printing, record the check numbers in M3. File or scan printed checks per company policy. Run the AP History File Audit monthly to reconcile check payments against GL accounts."]],quiz:[{q:"What is the main purpose of lockbox processing?",options:["To print vendor checks","To automate customer payment posting from bank data","To create purchase orders","To reconcile inventory"],answer:1},{q:"After lockbox payments are matched to invoices, the next step is:",options:["Print checks","Post the lockbox batch to update AR and GL","Call the customer","File a credit memo"],answer:1},{q:"AP checks at Adleta are printed using which format?",options:["Standard M3 format","AHF EDI format","Fifth Third Bank required check format","Concur expense format"],answer:2},{q:"Which M3 screen is used to create and approve a payment proposal for check printing?",options:["PPS300","APS130/B","ROO 02","CYC 5"],answer:1}],checklist:["Understand how lockbox processing works","Can receive and validate a lockbox import file in M3","Can review and manually apply unmatched lockbox payments","Can post a lockbox batch and reconcile with bank statement","Understand AP check printing setup (Fifth Third Bank format)","Can create and review a payment proposal in APS130/B","Can initiate and complete the check printing process","Can run AP History File Audit for monthly reconciliation"]}
]},
