  endToEnd:{id:"endToEnd",name:"End-to-End Process Walkthroughs",owner:"All super users",weeks:"Week 8",pill:"pill-gold",color:"#c49a2a",programs:["CRS610","CRS620","PPS200","PPS300","OIS100","OIS300","APS100","APS200","ARS100","ARS200","MMS200"],summary:"Full cross-functional walkthroughs connecting Purchasing, Warehouse, Sales, and Finance through Procure to Pay and Order to Cash.",links:[["Procure to Pay Packet",SP+"/Week_8_Procure_to_Pay_Walkthrough_Packet.md"],["Order to Cash Packet",SP+"/Week_8_Order_to_Cash_Walkthrough_Packet.md"]],sessions:[{id:"w8-1",title:"Procure to Pay — Full Walkthrough",duration:"90 min",steps:[["1","Verify supplier — CRS620","Purchasing opens CRS620 and confirms the supplier is active, has payment terms, and is ready for a PO."],["2","Create PO header — PPS200","Purchasing opens PPS200, presses F3 for a new PO. Enters supplier, PO type, buyer, warehouse, and requested delivery date."],["3","Add PO lines — PPS201","Purchasing adds at least two lines: item number, quantity, UOM, price, and delivery date. Records the PO number assigned by M3."],["4","Approve and release PO","Purchasing confirms the PO status is released/ready per Adleta rules before communicating to the supplier."],["5","Receive goods — PPS300","Warehouse opens PPS300, finds the PO, verifies packing slip against PO items and quantities, enters actual received quantities, and confirms. Records receipt number."],["6","Verify inventory update — MMS200","Warehouse opens MMS200 and confirms the received item shows updated on-hand and available balances."],["7","Enter supplier invoice — APS100","Finance AP opens APS100, enters the supplier invoice referencing the PO number. Enters invoice date, amount, and runs F14 three-way match."],["8","Resolve match result","If matched: invoice is auto-approved. If variance: Finance AP contacts Purchasing (price issue) or Warehouse (quantity issue) to resolve before payment."],["9","Create payment proposal — APS200","Finance AP opens APS200, includes the approved invoice in a payment proposal. Reviews before processing."],["10","Debrief — handoff questions","Group discusses: what must each department get right for the next step to work? Where do delays or errors originate?"]],videoUrl:"",quiz:[{q:"Before Warehouse can receive goods, Purchasing must ensure:",options:["The invoice is already entered in APS100","The PO is released and the supplier, item, quantity, and UOM are correct","The payment proposal is approved","Inventory is at zero for that item"],answer:1},{q:"The three-way match in APS100 compares:",options:["PO, receipt, and supplier invoice","PO, customer order, and payment","Supplier invoice, GL account, and payment","PO, warehouse, and freight invoice"],answer:0},{q:"A quantity variance on the three-way match means:",options:["The supplier invoice price is wrong","The invoice quantity does not match what was received","The PO was not released","Finance entered the wrong supplier number"],answer:1},{q:"Which department owns resolving a price variance between the PO and the supplier invoice?",options:["Warehouse","Finance AR","Purchasing and Finance AP together","IT"],answer:2}],checklist:["I can trace all 10 steps of the Procure to Pay process","I understand what each department must get right before the handoff","I can identify whether a match exception is a price variance or quantity variance","I know who to contact to resolve each type of exception","I completed a proof-of-completion entry with supplier, PO, receipt, and invoice references"]},{id:"w8-2",title:"Order to Cash — Full Walkthrough",duration:"90 min",steps:[["1","Verify customer — CRS610","Sales / CS opens CRS610 and confirms the customer is active, reviews payment terms, price list, and credit status."],["2","Create order header — OIS100","Sales / CS opens OIS100, presses F3 for a new order. Enters customer number, order type, ship-to address, requested delivery date, and customer PO number."],["3","Add order lines — OIS101","Sales / CS adds at least two lines: item, quantity, UOM, price, and delivery date. Verifies M3 auto-populated the correct price from the customer's price list."],["4","Check availability — MMS200","Sales / CS or Warehouse checks available quantity in MMS200. If stock is short, a backorder decision is made and communicated to the customer before proceeding."],["5","Confirm shipment — OIS300","Warehouse opens OIS300, finds the order, verifies items and ship-to address, enters actual shipped quantities, ship date, and carrier/tracking. Presses F5 to confirm — inventory updates and invoice is triggered."],["6","Review customer invoice — ARS100","Finance AR opens ARS100, locates the invoice generated from the shipment. Verifies customer, order number, shipped quantity, and invoice amount."],["7","Apply customer payment — ARS200","Finance AR opens ARS200, enters the customer payment, and applies it to the correct invoice. Verifies the invoice balance clears to zero."],["8","Review aging if needed — ARS300","Finance AR opens ARS300 to confirm the customer's aging is updated. Flags any remaining overdue balances for follow-up."],["9","Handle exception — backorder or credit hold","If backorder: Sales / CS documents and communicates delay. If credit hold: Sales / CS stops and contacts Finance AR before any customer communication."],["10","Debrief — handoff questions","Group discusses: where do customer-facing problems start? Where do financial problems start? What does each department need from the previous step?"]],videoUrl:"",quiz:[{q:"Before Warehouse can ship an order, Sales / CS must ensure:",options:["The payment is already collected","The customer invoice is generated","The customer order has correct items, quantities, ship-to address, and requested date","The AR aging is reviewed"],answer:2},{q:"Confirming a shipment in OIS300 automatically:",options:["Creates a new customer order","Updates inventory and triggers the customer invoice","Sends an email to the customer","Closes the customer account"],answer:1},{q:"If a customer is on credit hold, Sales / CS should:",options:["Ship the order and let Finance sort it out","Contact the customer directly to collect payment","Stop order processing and contact Finance AR before any customer communication","Cancel the order without notifying anyone"],answer:2},{q:"Applying a customer payment in ARS200 to the wrong invoice causes:",options:["No problem — it can be corrected later without impact","The correct invoice to remain open and appear overdue, possibly triggering a credit hold","The payment to be lost","The order to be cancelled"],answer:1}],checklist:["I can trace all steps of the Order to Cash process from customer order to payment","I understand what each department must get right before the handoff","I know how to handle a backorder — availability check, decision, and customer communication","I know the credit hold process and that Sales / CS must contact Finance before communicating with the customer","I completed a proof-of-completion entry with customer, order, shipment, invoice, and payment references"]}]},
  reporting:{id:"reporting",name:"Pricing and Reporting",owner:"Jeanell Coral",weeks:"Week 7",pill:"pill-gray",color:"#344b5f",programs:["OIS600","OIS620","OIS017","OIS010","MMS600","ARS300","GLS990"],summary:"Price lists, customer pricing, price overrides, standard reports, exports, scheduled reports, and KPI dashboards.",links:[["Deck",SP+"/Adleta_M3_Reporting_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Reporting_LearningGuide.docx"]],sessions:[{id:"rep-1",title:"Birst for Sales — Daily Sales Performance",duration:"40 min",steps:[[1,"Log in to Birst","Open your browser and go to the Birst URL provided by IT (bookmark this — you will use it every day). Log in with your Adleta credentials. The Birst home screen shows your saved reports and dashboards on the left panel."],
[2,"Open the Sales Performance report","In the left panel, navigate to the Sales folder. Open the pre-built Sales Performance report. This report pulls live data from M3 — every order, invoice, and return is reflected here as of the last data refresh."],
[3,"Set the date range to the current month","At the top of the report, click the date filter. Select This Month (or enter the current month start and end dates). The report refreshes automatically. This is your monthly sales snapshot."],
[4,"Filter by your branch or region","Click the Branch filter. Select your branch (or All Branches if you manage multiple). The report narrows to show only sales activity for that branch. Use this to compare branch performance."],
[5,"Review the key sales numbers","Read the report: Total Sales dollars for the month, number of orders, average order value, and top-selling items. Compare to the same period last month or last year if those columns are available."],
[6,"Identify the top 10 customers this month","Sort the Customer column by Sales Amount descending. Review the top 10 customers driving revenue this month. Flag any top customer whose sales dropped significantly versus last month — that may need a follow-up call."],
[7,"Drill into a specific customer","Click on a customer name in the report. Birst drills down to show individual orders for that customer this month — order dates, items, quantities, and amounts. Use this to answer questions like: did their order ship? Is there an open quote?"],
[8,"Save your filtered view as a favorite","Once you have the date, branch, and any other filters set the way you want them, click Save View (or Favorite). Name it something like 'My Daily Sales - Houston.' Tomorrow morning, open this saved view and it will already have your filters set — just refresh the date range."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Content%20Overview%20Workshop.mp4",quiz:[{q:"In Birst, what does drilling into a customer show you?",options:["Their credit limit in M3","Individual orders, items, quantities, and amounts for that customer","Their full AR balance and aging","Their contact information from CRM"],answer:1},
{q:"What should you do if a top customer's sales dropped significantly this month?",options:["Nothing — sales fluctuate naturally","Flag them for a follow-up call to understand what changed","Remove them from your report","Submit a price adjustment"],answer:1},
{q:"Why should you save a filtered view as a Favorite in Birst?",options:["It permanently deletes the data you don't need","So your preferred filters are already applied when you open Birst tomorrow","It shares the report with all users automatically","It locks the date range so it never changes"],answer:1},
{q:"Where does the data in Birst come from?",options:["You enter it manually in Birst","It is exported from Excel files by IT each week","It pulls live from M3 — orders, invoices, and returns are reflected automatically","It comes from the Adleta website"],answer:2}],checklist:["Can log in to Birst and navigate to the Sales folder","Applies date range and branch filters to a sales report","Reads key metrics: total sales, order count, top customers","Drills into a customer to see individual order detail","Saves a filtered view as a Favorite for daily use"]},{id:"rep-2",title:"Birst Visualizer — Building a Custom Sales Report",duration:"50 min",steps:[[1,"Open the Birst Visualizer","From the Birst home screen, click the Visualizer tab (or navigate to Create > New Report). The Visualizer is where you build custom reports from scratch using M3 data — no IT help needed, no coding required."],
[2,"Select the Sales subject area","When the Visualizer opens, it asks which Subject Area to use. Select Sales (or Order Management — confirm the exact name with IT). This gives you access to all sales-related fields: customers, orders, items, sales reps, amounts, dates."],
[3,"Add Customer Name as your row dimension","From the field list on the left, find Customer Name under the Customer section. Drag it onto the report canvas (or double-click it). Customer names now appear as rows in your report."],
[4,"Add Sales Amount as your measure","Find Sales Amount (or Invoice Amount) under the Measures section. Drag it onto the canvas next to Customer Name. Birst calculates the total sales per customer and displays it in the second column."],
[5,"Add a date filter for this quarter","Click Add Filter at the top. Select Invoice Date (or Order Date). Set it to This Quarter. The report now shows sales by customer for the current quarter only. You can change this to any date range at any time."],
[6,"Sort by Sales Amount — highest first","Click the Sales Amount column header to sort. Click once for ascending, click again for descending. Your highest-revenue customers are now at the top. Add a Top N filter (click the funnel icon) and set it to Top 20 to focus on your best accounts."],
[7,"Switch to a bar chart","Click the Chart Type selector at the top. Choose Bar Chart (horizontal bar works well for customer names — they are long). The report switches from a table to a visual bar chart. Switch back to Table view if you need to export the numbers to Excel."],
[8,"Save the report and share it","Click Save. Name the report 'Sales by Customer — This Quarter.' Save it to a shared folder so Tony Shipka and the order desk team can also access it. The report refreshes automatically with current M3 data every time someone opens it."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Visualizer%20workshop.mp4",quiz:[{q:"What does the Subject Area selection in Birst Visualizer determine?",options:["The color scheme of the report","Which M3 data fields are available to use in the report","How many rows the report can display","Which users can see the report"],answer:1},
{q:"In Birst, what is the difference between a dimension and a measure?",options:["A dimension is a number; a measure is a label","A dimension is a label (like Customer Name); a measure is a number (like Sales Amount)","They are the same thing","Dimensions are for charts only; measures are for tables only"],answer:1},
{q:"After building a report, how do you make it available to your teammates?",options:["Email them a screenshot","Save it to a shared folder in Birst","Print it and put it on their desk","Export to Excel and share the file"],answer:1},
{q:"What happens to a saved Birst report when new orders are entered in M3?",options:["Nothing — the report only reflects data from when it was saved","You have to manually click Refresh to update it","It automatically shows updated M3 data the next time it is opened","IT has to re-run it every morning"],answer:2}],checklist:["Can open Birst Visualizer and select the correct Subject Area","Adds a dimension (Customer Name) and a measure (Sales Amount) to build a report","Applies a date filter and Top N filter to narrow results","Can switch between table and bar chart views","Saves the report to a shared folder so the team can access it"]},{id:"rep-3",title:"Birst Dashboards — Building a Sales KPI Dashboard",duration:"45 min",steps:[[1,"Open Birst and create a new dashboard","From the Birst home screen, click Dashboards, then Create New Dashboard. A blank dashboard canvas opens. Dashboards are different from individual reports — they combine multiple reports and KPIs onto one screen for a daily at-a-glance view."],
[2,"Add a Sales Total KPI tile","Click Add Widget, then select KPI or Metric. Choose the Sales Amount measure. Set the time period to This Month. Enter a target value (your monthly sales goal for this branch or team). Birst will show the actual vs. target with a color indicator — green if on track, red if behind."],
[3,"Add a Top Customers chart widget","Click Add Widget, then Chart. Select the Sales by Customer report you built in the Visualizer session (or any pre-built customer report). Resize the widget to fill about half the dashboard. This gives you a visual snapshot of your top accounts every time you open the dashboard."],
[4,"Add an Open Quotes table","Click Add Widget, then Table. Select a subject area and add: Quote Number, Customer Name, Quote Amount, and Quote Date. Filter for status = Open Quotes only. This keeps all your pending quotes visible without having to open M3 and search manually."],
[5,"Add a dashboard-level date filter","Click Add Filter at the top of the dashboard. Select Order Date or Invoice Date. Set it as a dashboard filter (not just for one widget). Now when you change the date range at the top, ALL widgets on the dashboard update simultaneously."],
[6,"Add a branch filter","Add a second dashboard-level filter for Branch. This lets you switch between branches in one click and see all your KPIs update together. Set your default branch as the starting value so the dashboard opens correctly each morning."],
[7,"Arrange the layout","Drag and resize widgets to create a clean layout: KPI tiles at the top (Sales Total, Number of Orders, Average Order Value), Top Customers chart in the middle, Open Quotes table at the bottom. Aim for everything visible without scrolling if possible."],
[8,"Save and share the dashboard","Click Save. Name it 'Sales Dashboard — Jeanell.' Click Share and add the names of teammates who should see it (Tony Shipka, order desk team, Mike Parsons). They will find it in their Birst Dashboards list. Set an auto-refresh if the option is available so the data updates throughout the day."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Dashboards%20workshop.mp4",quiz:[{q:"What is the main difference between a Birst Dashboard and a Birst Report?",options:["Dashboards are only for managers; reports are for everyone","A dashboard combines multiple reports and KPIs on one screen for an at-a-glance view","Reports update automatically; dashboards require manual refresh","Dashboards can only show charts, not tables"],answer:1},
{q:"What does a dashboard-level filter do that a widget-level filter does not?",options:["It makes the dashboard load faster","When you change it, ALL widgets on the dashboard update at the same time","It restricts which users can see the dashboard","It only applies to KPI tiles, not charts"],answer:1},
{q:"What is a KPI tile in Birst used for?",options:["Displaying a full list of customer orders","Showing one key number (like total sales) compared to a target","Building a custom report from scratch","Setting up automated email reports"],answer:1},
{q:"After you share a Birst dashboard with a teammate, what do they need to do to see it?",options:["Download a file you send them","Log in to Birst — it will appear in their Dashboards list","Install a separate Birst app on their computer","Ask IT to copy the data to their account"],answer:1}],checklist:["Creates a new Birst dashboard from scratch","Adds a KPI tile with a sales target","Adds a chart widget from a saved report","Adds a table widget for open quotes","Applies dashboard-level date and branch filters that update all widgets","Shares the dashboard with teammates"]},
{id:"rep-4",title:"Pricing in M3 — OIS017 Customer Price Lists",duration:"45 min",videoUrl:"",steps:[[1,"Understand how M3 pricing works at Adleta","When an order line is entered in OIS100, M3 looks up the price in a specific order: (1) Customer-item specific price in OIS017, (2) Customer price list, (3) Standard price list. The first match wins. If you have set a specific price for a customer and item in OIS017, that price overrides everything else."],
[2,"Open OIS017 — Customer Price List","Press Ctrl+R and type OIS017, then press Enter. This is the Customer Item Price program — where you set the price a specific customer pays for a specific item. Every customer-item price agreement at Adleta lives here."],
[3,"Look up an existing customer price","In OIS017, click the lookup icon in the Customer field and search for a customer. Press Enter. M3 displays all item prices set up for that customer. Review the list: item number, price, unit of measure, and the date range the price is valid."],
[4,"Check the effective dates on a price line","Click into a price line and review the Valid From and Valid To dates. This is how time-limited pricing works — a promotional price can be set with a future Valid To date and M3 will automatically stop using it after that date. Prices with no Valid To date are open-ended."],
[5,"Add a new customer-item price","Click the + New button. Enter the customer number, item number, and unit of measure. Enter the price amount. Set the Valid From date (usually today or the start of the new agreement). Set Valid To date if the price is temporary, or leave blank for an ongoing price. Click the checkmark ✓ to save."],
[6,"Update an existing price","In OIS017, find the customer-item price line you need to change. Right-click and select Change. Update the price amount or the Valid To date. Click the checkmark ✓ to save. The new price will apply to all new orders entered after your save — it does not retroactively change existing open orders."],
[7,"Verify the new price on a test order","Open OIS100 and enter a test order for that customer and item. When the order line populates the price, verify it shows the price you just set in OIS017. If the price is wrong, the most common cause is an overlapping price line with a different date range — go back to OIS017 and check for duplicate entries."],
[8,"Delete an expired or incorrect price line","In OIS017, find the price line that needs to be removed. Right-click and select Delete. M3 asks you to confirm. Once deleted, M3 will fall back to the next price source (standard price list). Only delete lines that are truly wrong — if a price is simply expired, it is better to set a past Valid To date so there is a record that it existed."]],quiz:[{q:"In M3, which price source takes highest priority when pricing an order line?",options:["The standard price list","The customer price list","A customer-item specific price set in OIS017","The price entered manually by the order desk"],answer:2},
{q:"What is the purpose of the Valid To date on a price line in OIS017?",options:["It shows when the price was last updated","It is the date the price will automatically expire and no longer apply to new orders","It is required on every price line","It controls which warehouse the price applies to"],answer:1},
{q:"If you update a price in OIS017 today, what happens to open orders that were already entered?",options:["They are automatically updated to the new price","They keep the price they were entered at — only new orders get the new price","M3 sends an alert to the order desk to review them","They are put on hold until repriced"],answer:1},
{q:"If a customer order line shows the wrong price, what should you check first?",options:["Call the customer to confirm the price","Open OIS017 for that customer and item and look for overlapping or duplicate price lines","Delete all prices for that customer and re-enter them","Open OIS100 and manually override the price on the order"],answer:1}],checklist:["Can open OIS017 and look up existing prices for a customer","Reads effective date ranges on price lines","Adds a new customer-item price with correct dates","Updates an existing price and verifies on a test order in OIS100","Identifies and resolves overlapping price lines"]}
,
{id:"rep-5",title:"Price List Setup and Maintenance — OIS010",duration:"40 min",videoUrl:"",steps:[[1,"Understand the difference between OIS010 and OIS017","OIS010 is where you manage standard price lists — lists that apply to a group of customers (like a contractor price list or a dealer price list). OIS017 is for customer-specific item prices. Think of it this way: OIS010 = a price list with a name that can be assigned to many customers. OIS017 = a one-to-one price for a single customer and item."],
[2,"Open OIS010 — Price List","Press Ctrl+R and type OIS010, then press Enter. This program shows all active price lists at Adleta. Review the list: price list name, currency, description, and effective dates. These are the named price lists you can assign to customers in CRS610."],
[3,"Open a price list and review its lines","Click into a price list (right-click > Open, or double-click). The price list lines screen shows every item on this list with its price and unit of measure. Scroll through and review a few items. Note the structure: each line is an item number + price + unit."],
[4,"Add a new item to a price list","In the price list lines screen, click the + New button. Enter the item number. Enter the price and unit of measure. Set effective dates if this is a temporary pricing change (like a promotion). Click the checkmark ✓ to save. The item will now be priced from this list for all customers assigned to it."],
[5,"Update a price on an existing price list line","Find the item in the price list you need to update. Right-click and select Change. Update the price amount. Click the checkmark ✓. Confirm: this price change applies to ALL customers on this price list immediately for new orders. If only one customer needs a different price, use OIS017 instead."],
[6,"Check which price list a customer is assigned to","Open CRS610 and look up the customer. Find the Price List field (it may be on panel B or C — confirm with Bravo). The price list shown here is what M3 uses as the default for this customer when no specific OIS017 price exists. If it is blank, the customer gets the standard price list."],
[7,"Assign a price list to a customer","In CRS610 for the customer, navigate to the Price List field. Click the lookup icon and select the correct price list. Click the checkmark ✓ to save. From this point forward, new orders for this customer will use prices from that price list (unless overridden by OIS017)."],
[8,"Run a price list comparison before a price increase","Before updating prices in OIS010, export the current price list to Excel (use the export/print function in OIS010). This gives you a before snapshot. After the price increase is applied, run the same export and compare. Share the comparison with the sales team so they know what changed and can notify their accounts."]],quiz:[{q:"What is the key difference between OIS010 and OIS017?",options:["OIS010 is for inventory; OIS017 is for accounting","OIS010 manages named price lists assigned to groups of customers; OIS017 sets a price for one specific customer and item","OIS010 is read-only; OIS017 is where you make changes","They are the same program with different menu paths"],answer:1},
{q:"If you update a price in OIS010, who does it affect?",options:["Only the customer you are currently viewing","All customers who are assigned to that price list","Only customers in the same branch","Only new customers — existing customers keep their old price"],answer:1},
{q:"Where in M3 do you check which price list a customer is assigned to?",options:["OIS017","OIS010","CRS610 — the Customer Master","OIS100 — the Order Entry screen"],answer:2},
{q:"When should you use OIS010 vs OIS017 to set a price?",options:["Use OIS010 when the price applies to all customers on a list; use OIS017 when only one customer gets that specific price","Use OIS010 for new items; OIS017 for existing items","Use OIS010 for temporary prices; OIS017 for permanent prices","It does not matter — they do the same thing"],answer:0}],checklist:["Can navigate OIS010 and view all active price lists","Opens a price list and reviews its line items","Adds a new item to a price list with correct effective dates","Updates an existing price list line","Checks and updates a customer price list assignment in CRS610","Understands when to use OIS010 vs OIS017"]}
,
{id:"rep-6",title:"Price Overrides on Customer Orders",duration:"35 min",videoUrl:"",steps:[[1,"Understand when a price override is appropriate","A price override is when you manually change the price on a specific order line to something different from what M3 calculated. This is appropriate for: one-time promotional pricing, correcting a pricing error, matching a competitor quote, or honoring a verbal agreement. It is NOT appropriate to routinely override prices without updating OIS017 — that creates inconsistency and audit problems."],
[2,"Open OIS100 and enter an order line for practice","Press Ctrl+R and type OIS100, then press Enter. Click the + New button. Enter a test customer number and proceed to the order lines. Enter a test item. Note the price M3 calculates automatically — this is the price from OIS017 or OIS010."],
[3,"Override the price on the order line","On the order line, find the Unit Price field. The current price is shown. Click directly into the price field and type the new price. M3 may prompt you with a warning that the price has been changed from the standard. Acknowledge the warning and continue."],
[4,"Check if your user role allows price overrides","After entering a lower price, M3 may require authorization — it depends on how much below the standard price you are going. If M3 shows a hold or authorization message, the override exceeds your approval limit. You will need to get approval from a sales manager before the order can be released."],
[5,"Document the reason for the override in order notes","Right-click the order header and select Notes. Add a note explaining: why the price was overridden, who authorized it, and what the customer was told. Example: 'Price matched competitor quote from XYZ Supply. Authorized by Mike Parsons 6/10/26.' This documentation is required for audit purposes."],
[6,"Release the order after authorization","Once the override is approved (either automatically within your authority, or after manager authorization), release the order normally. The overridden price will appear on the customer invoice. Verify the price on the confirmation before it goes to the customer."],
[7,"Review price override reports in Birst","Open Birst and find the Price Override or Discount Report (confirm the report name with IT or your Birst administrator). This report shows all orders where the price was changed from the standard. Review it weekly to identify patterns — frequent overrides for the same customer or item may mean the OIS017 price needs to be updated."],
[8,"Correct a pricing error before invoicing","If an order was entered with the wrong price and has NOT been invoiced yet, open OIS100, find the order, and change the order status to allow edits. Correct the price on the line, document the change in notes, and re-release. If the order has already been invoiced, a credit memo or new order line at the difference may be needed — contact Philip Jones in accounting."]],quiz:[{q:"When is a price override on an order line appropriate?",options:["Any time a customer asks for a better price","For one-time situations like matching a competitor quote or correcting an error — not for routine use","Whenever the standard price seems too high","Only on will call orders"],answer:1},
{q:"What should you always do after overriding a price on an order?",options:["Email the customer the new price","Add a note to the order explaining why the price was changed and who authorized it","Delete the original price from OIS017","Call the warehouse to hold the order"],answer:1},
{q:"What does M3 do when a price override exceeds your authorization limit?",options:["It applies the override automatically","It sends an email to the customer","It places the order on hold and requires manager approval before it can be released","It cancels the order"],answer:2},
{q:"If you find yourself overriding the same customer and item price every order, what should you do instead?",options:["Keep overriding — it saves time","Update the price permanently in OIS017 so M3 calculates it correctly on every new order","Ask IT to disable the standard price for that item","Apply a blanket discount in the customer master"],answer:1}],checklist:["Understands when a price override is and is not appropriate","Can locate and change the unit price on an OIS100 order line","Knows what to do if the override requires manager authorization","Documents every price override with a reason and authorization in order notes","Can find the price override report in Birst to monitor trends","Knows how to correct a pricing error before and after invoicing"]}
]}

function buildNav(){const nav=document.getElementById("navLinks");const items=currentUserData.role==="admin"?ADMIN_NAV:USER_NAV;nav.innerHTML=items.map(item=>`<button class="nav-btn ${item.id==="dashboard"?"active":""}" data-view="${item.id}"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${item.icon}</svg>${item.label}</button>`).join("");nav.querySelectorAll(".nav-btn").forEach(btn=>{btn.addEventListener("click",()=>switchView(btn.dataset.view));});}
function buildUserPill(){const u=currentUserData;const ini=u.name.split(" ").map(n=>n[0]).join("").substring(0,2);document.getElementById("userAvatar").textContent=ini;document.getElementById("userAvatar").style.background=u.color;document.getElementById("userName").textContent=u.name;document.getElementById("userRoleLabel").textContent=u.role==="admin"?"Administrator":u.dept;document.getElementById("heroSub").textContent="Adleta Corporation · Infor M3 Rollout · 9-Week Program · "+u.name;}
function switchView(viewId){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));const el=document.getElementById("view-"+viewId);if(el)el.classList.add("active");const btn=document.querySelector(`[data-view="${viewId}"]`);if(btn)btn.classList.add("active");renderView(viewId);}
function renderView(v){const r={dashboard:renderDashboard,modules:renderModules,roadmap:renderRoadmap,superusers:renderSuperUsers,resources:renderResources,team:renderTeam,admin:renderAdmin};if(r[v])r[v]();}
function visibleModules(){if(currentUserData.role==="admin"||currentUserData.modules.includes("all"))return Object.values(MODULES);return currentUserData.modules.filter(id=>id!=="all-readonly").map(id=>MODULES[id]).filter(Boolean);}
function findSession(sid){for(const m of Object.values(MODULES)){const s=m.sessions.find(s=>s.id===sid);if(s)return s;}return null;}
function sessionProgress(sid){const s=findSession(sid);if(!s)return 0;const done=s.checklist.filter((_,i)=>ST[`chk-${sid}-${i}`]).length;return Math.round(done/s.checklist.length*100);}
function moduleProgress(mid){const m=MODULES[mid];if(!m||!m.sessions.length)return 0;const scores=m.sessions.map(s=>ST[`quiz-score-${s.id}`]||0);return Math.round(scores.reduce((a,b)=>a+b,0)/m.sessions.length);}
function renderDashboard(){const mods=visibleModules();const tot=mods.reduce((a,m)=>a+m.sessions.length,0);const done=mods.reduce((a,m)=>a+m.sessions.filter(s=>(ST[`quiz-score-${s.id}`]||0)>=70).length,0);let html=`<div class="metrics"><div class="metric"><div class="metric-val">${mods.length}</div><div class="metric-label">My Modules</div></div><div class="metric"><div class="metric-val">${tot}</div><div class="metric-label">Sessions</div></div><div class="metric"><div class="metric-val">${done}</div><div class="metric-label">Completed</div></div><div class="metric"><div class="metric-val">${tot?Math.round(done/tot*100):0}%</div><div class="metric-label">Progress</div></div></div><div class="dash-grid"><div class="card"><div class="card-title">Mastery Model <span class="pill pill-teal">Required for sign-off</span></div><div class="mastery"><div class="mastery-node">Do it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Explain it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Troubleshoot it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Teach it</div></div></div><div class="card"><div class="card-title">Next Actions <span class="pill pill-gray">${NEXT_ACTIONS.length} items</span></div><div class="prog-wrap"><div class="prog-track"><div class="prog-fill" id="dpf" style="width:0%"></div></div><div class="prog-label" id="dpl">0%</div></div><div class="check-list" id="dcl"></div></div></div>`;
if(mods.length){html+=`<div class="sec-hd" style="margin-top:20px"><div><div class="sec-eyebrow">Your training</div><h2>My Modules</h2></div></div><div class="mod-grid">`;html+=mods.map(m=>{const pct=moduleProgress(m.id);return`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div><div class="tags">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% complete · ${m.sessions.length} session${m.sessions.length!==1?"s":""}</div></div>`;}).join("");html+=`</div>`;}
document.getElementById("view-dashboard").innerHTML=html;
const cl=document.getElementById("dcl");if(cl){NEXT_ACTIONS.forEach((text,i)=>{const id=`act-${i}`;const div=document.createElement("label");div.className="check-item";div.innerHTML=`<input type="checkbox" ${ST[id]?"checked":""}><span>${text}</span>`;div.querySelector("input").addEventListener("change",e=>{ST[id]=e.target.checked;save();updDP();});cl.appendChild(div);});updDP();}}
function updDP(){const tot=NEXT_ACTIONS.length;const done=NEXT_ACTIONS.filter((_,i)=>ST[`act-${i}`]).length;const pct=Math.round(done/tot*100);const f=document.getElementById("dpf");const l=document.getElementById("dpl");if(f)f.style.width=pct+"%";if(l)l.textContent=pct+"%";}
function renderModules(){const mods=visibleModules();const el=document.getElementById("view-modules");let html=`<div class="sec-hd"><div><div class="sec-eyebrow">Training library</div><h2>${currentUserData.role==="admin"?"All Modules":"My Training"}</h2></div><input class="search-input" id="msr" type="search" placeholder="Search modules…"></div><div class="mod-grid" id="mgr">`;html+=mods.map(m=>{const pct=moduleProgress(m.id);return`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div><div class="tags">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% complete</div><div class="mod-links">${m.links.map(([l,u])=>`<a class="mod-link" href="${u}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">${l}</a>`).join("")}</div></div>`;}).join("");html+=`</div>`;el.innerHTML=html;document.getElementById("msr").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();const f=!q?mods:mods.filter(m=>[m.name,m.owner,m.weeks,m.summary,...m.programs].join(" ").toLowerCase().includes(q));const g=document.getElementById("mgr");if(!f.length){g.innerHTML='<div class="empty">No modules match.</div>';return;}g.innerHTML=f.map(m=>`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div></div>`).join("");});}
function openModuleDetail(mid){const m=MODULES[mid];if(!m)return;const el=document.getElementById("view-session");let html=`<button class="session-back" onclick="switchView('modules')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back to modules</button><div class="session-meta"><span class="pill ${m.pill}">${m.weeks}</span><span class="pill pill-gray">${m.sessions.length} sessions</span></div><div class="session-title">${m.name}</div><p style="margin-bottom:20px;font-size:14px">${m.summary}</p><div class="tags" style="margin-bottom:20px">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="sec-hd"><div><div class="sec-eyebrow">Sessions</div><h2>Choose a session to begin</h2></div></div><div class="mod-grid">`;html+=m.sessions.map((s,i)=>{const pct=sessionProgress(s.id);const sc=ST[`quiz-score-${s.id}`];const passed=sc>=70;return`<div class="mod-card" onclick="openSession('${m.id}','${s.id}')"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="pill pill-gray">Session ${i+1}</span>${passed?`<span class="pill pill-teal">✓ Passed ${sc}%</span>`:""}</div><h3>${s.title}</h3><div class="mod-owner">${s.duration}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% checklist done</div></div>`;}).join("");html+=`</div>`;el.innerHTML=html;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));el.classList.add("active");}
function openSession(mid,sid){const m=MODULES[mid];const sIdx=m.sessions.findIndex(s=>s.id===sid);const s=m.sessions[sIdx];if(!s)return;const el=document.getElementById("view-session");const sv=ST[`video-${sid}`]||s.videoUrl||"";const cpct=sessionProgress(sid);const prevS=sIdx>0?m.sessions[sIdx-1]:null;const nextS=sIdx<m.sessions.length-1?m.sessions[sIdx+1]:null;const sc=ST[`quiz-score-${sid}`];const passed=sc>=70;let html=`<button class="session-back" onclick="openModuleDetail('${mid}')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back to ${m.name}</button><div class="session-progress-header"><div style="flex:1"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px">${m.name} &rsaquo; Session ${sIdx+1} of ${m.sessions.length}</div><div style="font-size:17px;font-weight:700;color:var(--ink)">${s.title}</div><div style="font-size:12px;color:var(--muted);margin-top:3px">${s.duration}</div></div><div style="text-align:right;min-width:90px"><div style="font-size:20px;font-weight:800;color:${passed?"var(--teal)":"var(--ink)"}">${passed?"✓ Passed":""+cpct+"%"}</div><div style="font-size:11px;color:var(--muted)">${passed?"Quiz passed":"Checklist done"}</div><div class="prog-track" style="margin-top:6px;width:90px"><div class="prog-fill" id="cpill-bar" style="width:${cpct}%"></div></div></div></div><div class="session-body"><div class="session-content">${sv?`<div class="card"><div class="card-title"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:6px;vertical-align:-2px"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>Training Video</div>${buildVideoEmbed(sv)}</div>`:""}<div class="card"><div class="card-title">Step-by-Step Walkthrough <span class="pill pill-gray">${s.steps.length} steps</span></div><div class="step-cards">${s.steps.map(([n,a,d])=>`<div class="step-card"><div class="step-num">${n}</div><div class="step-body"><div class="step-action">${a}</div><div class="step-detail">${d}</div></div></div>`).join("")}</div></div><div class="card"><div class="card-title">Knowledge Check <span class="pill ${passed?"pill-teal":"pill-gray"}">${passed?"Passed "+sc+"%":""+s.quiz.length+" questions"}</span></div><div class="quiz-wrap" id="qw">${buildQuiz(s)}</div></div>${nextS||prevS?`<div class="session-nav">${prevS?`<button class="btn" onclick="openSession('${mid}','${prevS.id}')"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Previous</button>`:""}${nextS?`<button class="btn btn-primary" onclick="openSession('${mid}','${nextS.id}')">Next: ${nextS.title} <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>`:""}</div>`:""}
</div><div class="session-sidebar">${!sv?`<div class="card"><div class="card-title">Training Video</div><div id="va"><div class="video-placeholder">No video added yet.<br><br>Paste a YouTube or SharePoint URL below.</div></div><div class="video-input-wrap"><input class="video-input" id="vui" type="url" placeholder="Paste video URL…" value="${sv}"><button class="btn btn-primary btn-sm" onclick="saveVideo('${sid}')">Add</button></div></div>`:`<div class="card"><div class="card-title">Update Video URL</div><div class="video-input-wrap"><input class="video-input" id="vui" type="url" placeholder="Paste video URL…" value="${sv}"><button class="btn btn-primary btn-sm" onclick="saveVideo('${sid}')">Save</button></div></div>`}<div class="card print-zone"><div class="card-title" style="display:flex;align-items:center;justify-content:space-between">Session Checklist <span class="pill pill-teal" id="cpill">${cpct}%</span><button class="btn btn-sm print-hide" style="font-size:11px;padding:4px 10px" onclick="window.print()"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:4px"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</button></div><div style="font-size:12px;color:var(--muted);margin-bottom:10px">${s.title}</div><div class="check-list">${s.checklist.map((item,i)=>`<label class="check-item"><input type="checkbox" ${ST[`chk-${sid}-${i}`]?"checked":""} onchange="saveCheck('${sid}',${i},this.checked)"><span>${item}</span></label>`).join("")}</div></div><div class="card"><div class="card-title">My Notes</div><textarea class="notes-area" id="notesArea" placeholder="Add tips, shortcuts, or reminders for your team…" oninput="saveNote('${sid}',this.value)">${ST[`note-${sid}`]||""}</textarea><div class="notes-saved" id="notesSaved">Saved ✓</div></div><div class="card"><div class="card-title">Resources</div><div class="mod-links">${m.links.map(([l,u])=>`<a class="mod-link" href="${u}" target="_blank" rel="noreferrer">${l}</a>`).join("")}</div></div></div></div>`;el.innerHTML=html;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));el.classList.add("active");}
function buildVideoEmbed(url){if(!url)return'';const yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);if(yt)return`<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe></div>`;return`<a href="${url}" target="_blank" rel="noreferrer" class="btn btn-primary" style="display:inline-flex;margin-bottom:8px"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:6px"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>Watch Recording</a><div style="font-size:12px;color:var(--muted);margin-top:4px">Opens in SharePoint — sign in with your Adleta account if prompted.</div>`;}
function saveVideo(sid){const url=document.getElementById("vui").value.trim();ST[`video-${sid}`]=url;save();const a=document.getElementById("va");if(a)a.innerHTML=url?buildVideoEmbed(url):'<div class="video-placeholder">No video added.</div>';}
function saveNote(sid,val){ST[`note-${sid}`]=val;save();const el=document.getElementById("notesSaved");if(el){el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",1500);}}
function saveTeamStatus(suName,email,val,sel){ST[`team-status-${suName}-${email}`]=val;save();const colors={trained:"#1a7a6d",inprogress:"#c49a2a","not-started":"var(--muted)"};sel.style.color=colors[val]||"var(--muted)";}
function saveCheck(sid,idx,checked){ST[`chk-${sid}-${idx}`]=checked;save();const pct=sessionProgress(sid);const p=document.getElementById("cpill");if(p)p.textContent=pct+"%";}
function buildQuiz(s){const score=ST[`quiz-score-${s.id}`];const ans=ST[`quiz-answers-${s.id}`];if(score!==undefined&&ans){const a=JSON.parse(ans);let html=s.quiz.map((q,qi)=>{const c=q.answer,ch=a[qi];return`<div class="quiz-q"><div class="quiz-q-text">${qi+1}. ${q.q}</div><div class="quiz-options">${q.options.map((opt,oi)=>`<div class="quiz-option ${oi===c?"correct":oi===ch&&ch!==c?"wrong":""}"><input type="radio" disabled ${oi===ch?"checked":""}><span>${opt}</span>${oi===c?" ✓":""}</div>`).join("")}</div></div>`;}).join("");html+=`<div class="quiz-result ${score>=70?"pass":"fail"}">${score>=70?"✓ Passed":"✗ Not yet passed"} — Score: ${score}%${score<70?`<br><button class="quiz-btn" style="margin-top:10px" onclick="retakeQuiz('${s.id}')">Retake Quiz</button>`:""}</div>`;return html;}return s.quiz.map((q,qi)=>`<div class="quiz-q"><div class="quiz-q-text">${qi+1}. ${q.q}</div><div class="quiz-options">${q.options.map((opt,oi)=>`<label class="quiz-option"><input type="radio" name="qz-${s.id}-${qi}" value="${oi}"><span>${opt}</span></label>`).join("")}</div></div>`).join("")+`<button class="quiz-btn" onclick="submitQuiz('${s.id}')">Submit Quiz</button>`;}
function submitQuiz(sid){const s=findSession(sid);if(!s)return;const ans=s.quiz.map((_,qi)=>{const sel=document.querySelector(`input[name="qz-${sid}-${qi}"]:checked`);return sel?parseInt(sel.value):-1;});if(ans.includes(-1)){alert("Please answer all questions first.");return;}const cor=ans.filter((a,i)=>a===s.quiz[i].answer).length;const sc=Math.round(cor/s.quiz.length*100);ST[`quiz-score-${sid}`]=sc;ST[`quiz-answers-${sid}`]=JSON.stringify(ans);save();document.getElementById("qw").innerHTML=buildQuiz(s);}
function retakeQuiz(sid){delete ST[`quiz-score-${sid}`];delete ST[`quiz-answers-${sid}`];save();const s=findSession(sid);if(s)document.getElementById("qw").innerHTML=buildQuiz(s);}
function renderRoadmap(){document.getElementById("view-roadmap").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">9-week path</div><h2>Roadmap</h2></div></div><div class="timeline">${PHASES.map(p=>`<div class="phase-card"><div class="phase-weeks">${p.weeks}</div><div class="phase-name">${p.name}</div><div class="phase-purpose">${p.purpose}</div><div class="phase-success">✓ ${p.success}</div></div>`).join("")}</div>`;}

<div class="guide-section">
<h3>How to Run a Training Session (Step by Step)</h3>
<ul class="guide-step-list">
<li><div class="guide-step-num">1</div><div><strong>Open the portal together</strong> — have the Super User log in to the portal on their own computer. You log in as admin on yours so you can see their progress.</div></li>
<li><div class="guide-step-num">2</div><div><strong>Navigate to the session</strong> — Super User clicks Modules → opens their module → selects the session. Review the session title and duration together.</div></li>
<li><div class="guide-step-num">3</div><div><strong>Watch the video first</strong> — click Watch Recording. Watch the full CRP video together. Don't skip it — the video shows the exact scenario they need to learn.</div></li>
<li><div class="guide-step-num">4</div><div><strong>Walk through the steps in M3 test</strong> — open M3 test environment side by side. Go through each numbered step on the portal, doing it live in M3. You narrate; they type.</div></li>
<li><div class="guide-step-num">5</div><div><strong>Super User does it solo</strong> — reset or start a new record and have them repeat the workflow start to finish without guidance. Only intervene if they are stuck for more than 60 seconds.</div></li>
<li><div class="guide-step-num">6</div><div><strong>Take the quiz</strong> — have them answer all questions on their own. Do not hint. Submit and review the results together. If they score below 70%, walk through the missed questions and have them retake it.</div></li>
<li><div class="guide-step-num">7</div><div><strong>Complete the checklist</strong> — go through the session checklist together. Check off each item they demonstrated. Items not yet checked = topics to revisit next session.</div></li>
<li><div class="guide-step-num">8</div><div><strong>Add notes</strong> — have the Super User type their key takeaways and any Adleta-specific tips into the My Notes box. These notes will be there when they train their dept.</div></li>
</ul>
<div class="guide-tip"><strong>💡 Tip:</strong> Cover 2–3 sessions per sitting. Back-to-back sessions on related topics (e.g., all 3 AP payment sessions in one afternoon) build context faster than spreading them out.</div>
</div>

    const statusLabels={trained:"✓ Trained",inprogress:"In Progress","not-started":"Not Started"};

  }).join("");
