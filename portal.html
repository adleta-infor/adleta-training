 fixed in:","options":["APS110, not a GL reversal","GLS990","OIS300","MMS310"],"answer":0}],"checklist":["I can find a voucher in GLS200","I can reverse it with FAM 101 or Reverse","I confirm the reversal and net effect"]},{"id":"gl-3","title":"GL Inquiry — Balances and Transactions","duration":"45 min","steps":[[1,"Transactions by Account","Press Ctrl+S to open Search and Start, type GLS210, select General Ledger. Display Transactions from the list, and click OK. Enter the account and period to see every transaction behind it."],[2,"Balances","GLS215 (GL Balance File. Display) shows actual, budget, and variance by account for a period (format YYMM, e.g. 2606).<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> GLS215 isn't on Adleta's M3 Programs We Use list (20 Oct 2026). Confirm with Mike that this is the program Adleta will use before teaching it.</div>"],[3,"Drill to the Voucher","From a transaction, open the voucher (GLS200) to see the full entry."],[4,"Escalate","Unrecognized entries go to the controller with the voucher number and date."]],"videoUrl":"","quiz":[{"q":"Transactions by GL account are in:","options":["GLS210","APS100","OIS301","MWS070"],"answer":0},{"q":"Period format in GLS215 is:","options":["YYMM","MMDD","YYYY","DDMM"],"answer":0},{"q":"To see a whole entry, open:","options":["GLS200 Voucher. Display","CRS610","PPS200","OIS110"],"answer":0}],"checklist":["I can read transactions by account in GLS210","I can read period balances","I can drill to the voucher in GLS200"]},{"id":"gl-6","title":"Bank Reconciliation","duration":"45 min","steps":[[1,"Import the Bank Statement File","Navigate to the bank reconciliation menu. Open the import screen. Import the sample bank statement file from Fifth Third Bank. M3 loads the bank transactions and begins comparing them to book entries in M3.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; GLS850 &mdash; Automatic Bank Reconciliation</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Download bank statement</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Import into M3</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>M3 auto-matches</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Review unmatched</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Post reconciliation</span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Status</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Meaning</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Action needed</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Matched</td><td style='padding:3px 8px;background:#fffbe6;'>GL record = bank record</td><td style='padding:3px 8px;background:#fffbe6;'>No action</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>GL only</td><td style='padding:3px 8px;'>In M3 but not on statement</td><td style='padding:3px 8px;'>Outstanding check or deposit in transit</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Bank only</td><td style='padding:3px 8px;'>On statement but not in M3</td><td style='padding:3px 8px;'>Missing entry &mdash; investigate</td></tr></table><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; All unmatched items must be resolved before closing the period.</div></div><div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> Which M3 program Adleta will use for bank reconciliation, and whether statements are imported automatically, has not been confirmed. Treat this session as the concept until it is.</div>"],[2,"Review Auto-Matched and Unmatched Items","M3 shows auto-matched items (bank transaction matched to a book entry — no action needed) and two types of unmatched exceptions: (1) bank items with no book entry, and (2) book entries not on the bank statement. Review each exception category."],[3,"Manually Match an Exception","Select an unmatched bank item. Use the search to find the corresponding book entry. Link them together to clear the exception from both sides of the reconciliation. Repeat for each unmatched item until the reconciliation is balanced."],[4,"Record a Bank Fee as a Journal Entry","For bank fees that appear on the statement but have no book entry in M3, create a journal entry in GLS100. Debit the bank fee expense account. Credit the cash/bank GL account. Post the entry. The fee will now clear on the next reconciliation run."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/FINANCE/Automatic%20Bank%20Reconciliation%20Demo-20240711_140316-Meeting%20Recording.mp4","quiz":[{"q":"After importing a bank statement, auto-matched items require:","options":["Manual review and confirmation for each one","No action — M3 already matched them","A journal entry to post them","Finance director approval"],"answer":1},{"q":"A bank fee on the statement that has no book entry in M3 should be recorded as:","options":["An AP invoice in APS100","Ignored until next month","A journal entry in GLS100","A lockbox item in ARS110"],"answer":2},{"q":"Outstanding items on the bank side (no book entry) indicate:","options":["A Birst reporting error","Transactions that may need investigation or timing differences","The reconciliation is complete","IT must reset the bank feed"],"answer":1}],"checklist":["I can navigate to the bank reconciliation menu and import a bank statement file","I can identify auto-matched items vs. unmatched exceptions on both sides","I can manually match an unmatched bank item to its book entry","I can record a bank fee as a journal entry in GLS100 to clear it from the reconciliation"]},{"id":"gl-7","title":"Period Close Checklist","duration":"45 min","steps":[[1,"AP First","In APS450 (your division (A01 in the test company)) confirm nothing is unposted or in error. Confirm payment proposals for the period are finished."],[2,"Journals","In GLS200, filter to the period and confirm every expected accrual and adjusting entry is there. Check GLS100 for saved but unposted vouchers."],[3,"Close","Close the period in GLS910 (Year/Period. Close) for your division (A01 in the test company). Read any warnings first.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> GLS910 isn't on Adleta's M3 Programs We Use list (20 Oct 2026). Confirm with Mike that this is the program Adleta will use before teaching it.</div>"],[4,"Tell the Controller","Once closed, nothing posts to that period without reopening it. Tell the controller."]],"videoUrl":"","quiz":[{"q":"Before closing, check AP batches in:","options":["APS450","OIS300","MWS410","CRS610"],"answer":0},{"q":"Once a period is closed:","options":["Nothing posts to it without reopening","It can still take entries","AP reopens automatically","Nothing changes"],"answer":0},{"q":"Expected accruals are confirmed in:","options":["GLS200","PPS250","OIS350","MMS080"],"answer":0}],"checklist":["I confirm AP and journals are complete before close","I can close a period with my trainer","I tell the controller after close"]},{"id":"gl-8","title":"Financial Reports — GLS990","duration":"45 min","steps":[[1,"Run the Report","Open GLS990 (Financial Report. Create). Division (A01 in the test company), the period range, and the layout the controller gives you.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> GLS990 isn't on Adleta's M3 Programs We Use list (20 Oct 2026). Confirm with Mike that this is the program Adleta will use before teaching it.</div>"],[2,"Read It","Revenue, cost of goods, operating expenses. Compare to budget if the layout includes it."],[3,"Investigate","For an unexpected balance, drill into GLS210 and GLS200."],[4,"Share","Export to Excel or PDF and send to the controller with any variances noted."]],"videoUrl":"","quiz":[{"q":"Financial reports are created in:","options":["GLS990","GLS100","APS100","OIS300"],"answer":0},{"q":"An unexpected balance is investigated in:","options":["GLS210 and GLS200","MWS410","CRS620","OIS002"],"answer":0},{"q":"The report layout comes from:","options":["The controller / GL admin","The supplier","IT only","Any layout"],"answer":0}],"checklist":["I can run GLS990 with the right layout","I can investigate a balance in GLS210","I export and share the report"]}]},"productManagement":{"id":"productManagement","name":"Product Management","owner":"Lauren Calvey","weeks":"Week 5-6","pill":"pill-gray","color":"#7a5ea6","programs":["MMS001","MMS200","MMS002","MMS235","MWS068","OIS017"],"summary":"Item master setup and maintenance, item status and phase-out, warehouse setup, price lists, and new product launches.","links":[["Guide","resources/adleta-m3-productmanagement-learningguide.html"]],"sessions":[{"id":"prd-1","title":"Discontinuing an Item — Status 50 and MRP Off","duration":"60 min","steps":[[1,"Review the Item in MMS001","Open MMS001. Look up the test item to be discontinued. Review its current status, on-hand quantity, and any open purchase orders or customer orders that reference it.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; MMS001 &mdash; Discontinue Item &mdash; Status 50 + MRP Off</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Open MMS001</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Status &rarr; 50</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>MRP &rarr; OFF</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Review open orders</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Cancel remaining POs</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Archive item</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Item number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>ARM51899031</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Item status<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>50 = Discontinued</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>MRP indicator<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>0 = Off (no more POs generated)</span></span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Status code</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Meaning</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>10</td><td style='padding:3px 8px;'>New &mdash; not yet active</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>20</td><td style='padding:3px 8px;'>Active &mdash; normal ordering</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>50</td><td style='padding:3px 8px;background:#fffbe6;'>Phase-out &mdash; sell remaining stock only</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>90</td><td style='padding:3px 8px;'>Inactive &mdash; no transactions allowed</td></tr></table><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; Before setting status 50, check MMS001 for remaining on-hand stock and OIS100 for any open customer orders.</div></div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Item status codes for phase-out and inactive (50, 90) and where the planning (MRP) flag sits should be confirmed on screen. The exercise shows 20-Released as the active status.</div>"],[2,"Turn Off MRP Planning Flag","Navigate to the correct panel in MMS001. Change the MRP/planning flag to OFF. Save. This stops M3 from auto-generating planned purchase orders for the item going forward."],[3,"Change Item Status to 50","Change the Item Status to 50 (Discontinued). Save. Status 50 prevents new customer orders from being placed for this item. Existing open orders are not affected."],[4,"Verify New Orders Are Blocked","Open OIS100 and try to enter an order line for the discontinued item. M3 should error or display a warning. Show the exact message so Lauren knows what the customer service team will see."],[5,"Document the Discontinuation","Add a note to the item in MMS001 documenting: the discontinuation date, the reason (e.g., replaced by new item number), and who authorized the change. This is required for audit purposes."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Turn%20Off%20MRP%20on%20item%20when%20discontinued%20Sts-50.mp4","quiz":[{"q":"Item master records are managed in:","options":["OIS100","CRS610","MMS001","PPS200"],"answer":2},{"q":"Setting the MRP flag to OFF on an item stops M3 from:","options":["Shipping the item","Auto-generating planned purchase orders for that item","Displaying the item in OIS100","Deleting the item"],"answer":1},{"q":"Item Status 50 prevents:","options":["Receiving against open POs","New customer orders from being placed","Existing open orders from shipping","The item from appearing in Birst"],"answer":1}],"checklist":["I can look up an item in MMS001 and review its status and open orders","I can turn off the MRP planning flag and explain what it does","I can change Item Status to 50 and verify new orders are blocked in OIS100","I add a note to the item with discontinuation date, reason, and authorizer"]},{"id":"prd-2","title":"Product Lifecycle and Pricing Structure — MMS001 and OIS017","duration":"60 min","steps":[["1","Understand product lifecycle","Products move through stages: new, active, being phased out, and discontinued. M3 controls which transactions are allowed at each stage through item status. Your job is to keep item records accurate as products change.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; MMS001 / OIS017 &mdash; Product Lifecycle and Pricing Structure</div><b>Pricing hierarchy in M3:</b><br><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Level</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What it controls</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Item base price</td><td style='padding:3px 8px;'>MMS001</td><td style='padding:3px 8px;'>Default list price per item</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Customer price list</td><td style='padding:3px 8px;background:#fffbe6;'>OIS017</td><td style='padding:3px 8px;background:#fffbe6;'>Price list assigned to a customer or group</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Price list details</td><td style='padding:3px 8px;'>OIS017</td><td style='padding:3px 8px;'>Specific items + prices on a price list</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Order-line override</td><td style='padding:3px 8px;'>OIS101</td><td style='padding:3px 8px;'>One-time price change on a specific line</td></tr></table><br><b>MMS001 &mdash; item lifecycle fields to know:</b><br><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Item status</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>20 = Active</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>On-hand qty</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>500 CT</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Last received date</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>2026-05-15</span></span></div></div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Older material put price lists in OIS010. At Adleta OIS010 is CO Type. Open (order types). Price lists are in OIS017. Pricing programs aren't on the M3 Programs We Use list yet, so confirm the screens with Mike.</div>"],["2","Managing a product change","When a product is updated — new description, UOM change, category change — do not delete the old record. Update it in MMS001 and document the change with a note and date."],["3","Discontinuing a product","When Adleta stops selling an item, set status to 90 (Inactive) in MMS001 only after confirming: no open POs, no open sales orders, and zero stock on hand. Contact Purchasing, Sales, and Warehouse before inactivating."],["4","Understand price list structure","Prices in M3 live in OIS017, not on the item record. An item can have different prices on different price lists — standard, promotional, customer-specific."],["5","Open OIS017","Press Ctrl+S and open OIS017 (price lists). Select a price list and find an item. Review base price, effective date, expiry date, and UOM."],["6","Add or update an item price","Select the price list. Add the item number, price, effective date, and UOM. Set an expiry date if this is a promotional price. Save."],["7","Verify price on a sales order","Open OIS100, enter the customer and item. Confirm M3 pulls the correct price based on the customer's assigned price list. If the wrong price appears, check the customer's price list assignment in OIS017."],["8","Coordinate price changes","Price changes affect Sales, Finance, and customer communications. Notify KRISTENB and Sales before updating a price list that is assigned to active customers. Document the effective date and reason for every change."]],"videoUrl":"","quiz":[{"q":"To discontinue an item in M3, you set its status to 90. Before doing this you must confirm:","options":["The item has been in the system for at least one year","There are no open POs, no open sales orders, and zero stock on hand — and you have notified Purchasing, Sales, and Warehouse","Finance has approved the removal","IT has deleted the item from the price list"],"answer":1},{"q":"Item prices in M3 are stored in:","options":["MMS001 on the item record","OIS017 on the price list","MMS200 in the stock balance","GLS040 in the chart of accounts"],"answer":1},{"q":"If a sales order is pulling the wrong price for a customer, the first place to check is:","options":["The item record in MMS001","The customer's price list assignment in OIS017","The GL account","The purchase order"],"answer":1},{"q":"When making a price list change that affects active customers, you should:","options":["Make the change immediately and notify no one","Update the expiry date but leave the price alone","Notify KRISTENB and Sales before updating, document the effective date and reason","Wait until the end of the financial year"],"answer":2}],"checklist":["I understand the product lifecycle stages and how item status controls M3 transactions","I know the steps to safely discontinue a product — checking POs, orders, stock, and notifying departments","I can add and update item prices in OIS017 with correct effective and expiry dates","I verify price changes on a test sales order before communicating to the business","I document every price change with effective date and reason and notify affected teams in advance"]},{"id":"prd-3","title":"Master Data Quality and New Product Launch Coordination","duration":"60 min","steps":[["1","Understand master data ownership","As Product Management super user, you own the accuracy of the item master. Bad item data — wrong UOM, wrong category, missing description, wrong status — creates errors in Purchasing, Warehouse, Sales, and Finance. Master data quality is not just a Product Management problem; it affects every department.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; MMS001 &mdash; New Product Launch &mdash; Master Data Checklist</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Data element</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Required?</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Item number and description</td><td style='padding:3px 8px;background:#fffbe6;'>MMS001</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Item status = 20 active</td><td style='padding:3px 8px;background:#fffbe6;'>MMS001</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Unit of measure CT / SF / EA</td><td style='padding:3px 8px;background:#fffbe6;'>MMS001</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Base price</td><td style='padding:3px 8px;background:#fffbe6;'>MMS001 / OIS017</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Stocking warehouse</td><td style='padding:3px 8px;'>MMS002</td><td style='padding:3px 8px;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>MRP indicator</td><td style='padding:3px 8px;'>MMS002</td><td style='padding:3px 8px;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Lot tracking on/off</td><td style='padding:3px 8px;'>MMS001</td><td style='padding:3px 8px;'>Required if shade/dye lot item</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Customer price list</td><td style='padding:3px 8px;'>OIS017 / OIS017</td><td style='padding:3px 8px;'>If customer-specific pricing</td></tr></table><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Do not enter sales orders for a new item until all required fields above are complete and verified in the test environment.</div></div><div style='background:#e8f4f2;border:1px solid #9fd0c7;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Warehouse settings (on hand, planning, issue multiple, lot control) for a new item are in MMS002. Lot (dye lot) master is MMS235.</div>"],["2","Run a regular item master audit","Periodically review MMS001 for items that need attention: items with status 10 (Pending) that have been sitting for more than 30 days, items with missing descriptions, items with incorrect UOM, and items that are no longer sold but still show as Active."],["3","Check for duplicate items","Search MMS001 by description keyword to find potential duplicates. Duplicates cause split inventory history, pricing inconsistencies, and reporting errors. If duplicates exist, coordinate with IT and Purchasing before consolidating — do not inactivate without confirming which record is correct."],["4","Coordinate a new product launch","When Adleta adds a new product line: create the item record in MMS001 (status 10 while building). Confirm UOM, category, and stock method with Purchasing and Warehouse. Add the price in OIS017 with correct effective date. Notify Sales before the item goes Active — they need to know it is available to sell."],["5","Communicate launch timing","Product Management owns the launch checklist: item created, UOM confirmed, price set, Purchasing notified to set up supplier, Warehouse notified to receive first stock, Sales notified of availability date. All five must be complete before status changes to 20 (Active)."],["6","Handle item substitutes and alternates","When a product is temporarily out of stock or discontinued, Sales may need a substitute. Document known substitutes on the item record notes field and share with Sales. Communicate lead time and availability differences so Sales can set correct customer expectations."],["7","Manage seasonal and promotional items","Seasonal items should be set up well in advance — confirm with Purchasing on lead times. Set the item price in OIS017 with a specific effective date and expiry date. After the season ends, inactivate if it will not return, or leave Active with no open orders if it will return next season."],["8","Document everything","Every item creation, status change, UOM change, and price change must be documented: who made the change, when, and why. Use the Notes field in MMS001 and the team SharePoint folder. This protects the business during audits and helps troubleshoot issues when something unexpected happens downstream."]],"videoUrl":"","quiz":[{"q":"Before a new item's status is changed to Active (20) in MMS001, which five things must be complete?","options":["Item number, color, weight, size, and brand","Item created, UOM confirmed, price set, Purchasing and Warehouse notified, Sales notified of availability","IT approval, Finance approval, manager sign-off, legal review, and supplier contract","Item created, test order placed, shipped, invoiced, and paid"],"answer":1},{"q":"If you find a potential duplicate item in MMS001, you should:","options":["Immediately inactivate the newer one","Coordinate with IT and Purchasing to confirm which record is correct before taking action","Delete both and start over","Leave it — duplicates are normal in M3"],"answer":1},{"q":"Item substitutes for out-of-stock products should be:","options":["Handled verbally between Sales reps without any documentation","Documented in the item record notes and shared with Sales, including lead time and availability differences","Created as new item records in MMS001","Entered as returns in OIS390"],"answer":1},{"q":"A seasonal item whose price expires at end of season should be handled by:","options":["Deleting the price record after the season","Setting an expiry date on the price in OIS017 when the price is created — not managing it manually after the fact","Leaving the old price active until the next season starts","Contacting Finance to remove the price"],"answer":1}],"checklist":["I understand my role as master data owner and how item data quality affects every department","I can run a regular item master audit and identify items needing attention in MMS001","I know the five-step new product launch checklist before changing status to Active","I document all item changes with who, when, and why — in MMS001 notes and SharePoint","I know how to handle item substitutes and communicate them to Sales with lead time differences","I manage seasonal item prices with correct effective and expiry dates in OIS017"]}]},"reporting":{"id":"reporting","name":"Pricing and Reporting","owner":"Jeanell Coral","weeks":"Week 7","pill":"pill-gray","color":"#344b5f","programs":["Birst","OIS017","OIS101","OIS300"],"summary":"Birst dashboards for sales, margin, and customer profitability; ad hoc reports; customer price lists; and price overrides.","links":[["Deck","resources/adleta-m3-reporting-training-deck.html"],["Guide","resources/adleta-m3-reporting-learningguide.html"]],"sessions":[{"id":"rep-1","title":"Birst — Open Customer Order Book","duration":"40 min","steps":[[1,"Open Birst from M3","In M3's top bar, click the Birst tab. Infor M3 Analytics opens with no separate login. Work in the M3ADIS-Consumer space."],[2,"Find the Sales Collection","Open the hamburger menu (top left) → Collections → Sales. Collections include Sales, Procurement, Finance, Warehouse, and C-Suite."],[3,"Open Customer Order Book","The first Sales dashboard. Filters across the top: 100 - CMP100, Open Orders, Week. KPI tiles: Overdue Line Amt, Line Amt, Order Value, No. of Stopped Order Lines, Order Qty."],[4,"Read the Charts","Overdue Stock Analysis and Stop Code Analysis by week. Stopped lines tie back to holds you'd see in M3 (credit in OIS300, C10 in MWS410)."],[5,"Birst Isn't Live","Birst refreshes on a schedule. For the status of one order right now, check OIS300 in M3.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Confirm the Birst refresh schedule for Adleta.</div>"]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Content%20Overview%20Workshop.mp4","quiz":[{"q":"Birst opens from:","options":["The Birst tab in M3's top bar","A separate website with its own login","OIS300","Teams"],"answer":0},{"q":"The first Sales dashboard is:","options":["Open Customer Order Book","Sales Manager - Margin","AP Aging","Stock Count"],"answer":0},{"q":"For one order's live status, use:","options":["OIS300 in M3","Birst","Excel","GLS990"],"answer":0}],"checklist":["I can open Birst and the Sales collection","I can read the Open Customer Order Book tiles and filters","I use OIS300 for live order status"]},{"id":"rep-2","title":"Birst — Sales Manager Margin","duration":"40 min","steps":[[1,"Open the Dashboard","In the Sales collection, use the dropdown next to the dashboard name in the breadcrumb and pick Sales Manager - Margin."],[2,"KPI Tiles","Gross Margin % FY (year to date), Invcd Net Amt, Gross Profit $, COGS Standard."],[3,"Trend and Mix","Sales Margin by Period shows the trend. Pct of Total by Product and by Customer show the mix."],[4,"Drill","Switch Week/Month with the period chip. Use Drill Across on a chart to dig into a product line. Note anything with low margin for follow-up."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Visualizer%20workshop.mp4","quiz":[{"q":"Year-to-date margin % is the tile:","options":["Gross Margin % FY","Order Qty","Line Amt","Stop Code"],"answer":0},{"q":"To dig into one product line, use:","options":["Drill Across","Delete","Export only","Refresh"],"answer":0},{"q":"Margin trend over time is in:","options":["Sales Margin by Period","Stop Code Analysis","Overdue Stock","AP Aging"],"answer":0}],"checklist":["I can open Sales Manager - Margin","I can read the four KPI tiles","I can change period and drill across"]},{"id":"rep-3","title":"Birst — Customer Profitability and Ad Hoc Reports","duration":"45 min","steps":[[1,"Customer Profitability Analysis","Pick it from the Sales dashboard dropdown. Confirm Company = 100 - CMP100 and the year."],[2,"What to Look For","High revenue with low margin (pricing review), and customers whose revenue is falling (sales follow-up)."],[3,"Back to M3","For a margin problem, check the customer's prices in OIS017 to see whether it's price or cost.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Older material put price lists in OIS010. At Adleta OIS010 is CO Type. Open (order types). Price lists are in OIS017. Pricing programs aren't on the M3 Programs We Use list yet, so confirm the screens with Mike.</div>"],[4,"Ad Hoc Reports","Sales Analysis Ad Hoc has more flexible filters: customer, product group, date range, rep. Set company 100 - CMP100 and the date range, run it, and export to Excel."],[5,"Sharing","Name exports clearly (e.g. Sales_by_ProductGroup_Q2_2026). Send the file, not the Birst link, to people without Birst access."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Dashboards%20workshop.mp4","quiz":[{"q":"Low margin on a big customer suggests:","options":["A pricing review","Nothing","A credit hold","A new route"],"answer":0},{"q":"For a custom date range and filters, use:","options":["Sales Analysis Ad Hoc","Open Customer Order Book","OIS300","GLS910"],"answer":0},{"q":"Someone without Birst access needs the data. Send:","options":["The Excel export","The Birst link","Your password","Nothing"],"answer":0}],"checklist":["I can find margin problems in Customer Profitability Analysis","I can check prices in OIS017","I can build and export an ad hoc report"]},{"id":"rep-4","title":"Customer Prices — OIS017","duration":"45 min","videoUrl":"","steps":[[1,"How a Price Gets on the Line","When a line is entered in OIS101, the sales price fills in from the customer's price list. CS shouldn't have to type prices.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Older material put price lists in OIS010. At Adleta OIS010 is CO Type. Open (order types). Price lists are in OIS017. Pricing programs aren't on the M3 Programs We Use list yet, so confirm the screens with Mike.</div>"],[2,"Open the Price List","Press Ctrl+S to open Search and Start, type OIS017, select from the list, and click OK. Filter on the price list or customer and the item."],[3,"Read a Price Line","Item, price, U/M, valid from and valid to dates. A price with a past valid-to date no longer applies to new orders."],[4,"Add or Change","Change: select the line, Change, new price and from date. New: + (New), item, price, U/M, from date. Set a to date for promotions. Prefer ending an old price over deleting it."],[5,"Test It","Start a test order in OIS100 for the customer and item. The price should fill in. If it's wrong, look for overlapping date ranges. Don't save the test order."]],"quiz":[{"q":"Customer price lists are maintained in:","options":["OIS017","OIS010 (that's CO types)","CRS620","MMS310"],"answer":0},{"q":"A promotional price should have:","options":["A valid-to date","No dates","A new item number","A credit hold"],"answer":0},{"q":"The price on the order is wrong. First check:","options":["Overlapping date ranges in OIS017","GLS200","MWS410","PPS250"],"answer":0}],"checklist":["I know price lists are in OIS017, not OIS010","I can read and update a price line with dates","I test a price change on a test order"]},{"id":"rep-5","title":"Price List Maintenance and Price Increases — OIS017","duration":"40 min","videoUrl":"","steps":[[1,"Which Price List a Customer Uses","The customer's price list is set on the customer record (CRS610). If a customer is pricing wrong, check that first.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Which CRS610 panel holds the price list should be confirmed on screen.</div>"],[2,"Review Before a Change","Open OIS017 and export the current list to Excel as a before snapshot."],[3,"Apply the Change","Add new price lines with the new from date, and end the old lines the day before so there's no overlap."],[4,"Check and Share","Export again, compare, and send the change summary to Sales before the effective date.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Older material put price lists in OIS010. At Adleta OIS010 is CO Type. Open (order types). Price lists are in OIS017. Pricing programs aren't on the M3 Programs We Use list yet, so confirm the screens with Mike.</div>"]],"quiz":[{"q":"Before a price increase, first:","options":["Export the current list as a snapshot","Delete the old prices","Close the period","Change OIS010"],"answer":0},{"q":"To avoid overlap, the old price line should:","options":["End the day before the new one starts","Be deleted","Stay open","Be copied"],"answer":0},{"q":"OIS010 at Adleta is:","options":["CO Type. Open (order types)","Price lists","Customer master","Supplier master"],"answer":0}],"checklist":["I check the customer's assigned price list","I snapshot, change with dates, and compare","I tell Sales before the effective date"]},{"id":"rep-6","title":"Price Overrides on Customer Orders","duration":"35 min","videoUrl":"","steps":[[1,"Understand when a price override is appropriate","A price override is when you manually change the price on a specific order line to something different from what M3 calculated. This is appropriate for: one-time promotional pricing, correcting a pricing error, matching a competitor quote, or honoring a verbal agreement. It is NOT appropriate to routinely override prices without updating the price list in OIS017 — that creates inconsistency and audit problems.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS101 &mdash; Price Override on Customer Order Line</div><b>How a price override looks on the order line:</b><br><br><div style='background:#fff;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden;margin-bottom:8px'><div style='background:#1a7a6d;color:#fff;padding:4px 10px;font-size:11px;font-weight:700'>OIS101/B1 Customer Order Lines</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Line</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Item</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Qty</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>List price</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Override price</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>U/M</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>10</td><td style='padding:3px 8px;background:#fffbe6;'>ARM51899031</td><td style='padding:3px 8px;background:#fffbe6;'>50</td><td style='padding:3px 8px;background:#fffbe6;'>$48.80</td><td style='padding:3px 8px;background:#fffbe6;'><span style='color:#c0443b;font-weight:700'>$45.00 override</span></td><td style='padding:3px 8px;background:#fffbe6;'>CT</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>20</td><td style='padding:3px 8px;'>SHW9876543</td><td style='padding:3px 8px;'>20</td><td style='padding:3px 8px;'>$3.25</td><td style='padding:3px 8px;'>$3.25</td><td style='padding:3px 8px;'>SF</td></tr></table></div><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; To override: right-click line &rarr; Change &rarr; edit Sales price &rarr; enter reason &rarr; Change to save.</div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; Price overrides below the minimum margin threshold are flagged for manager review in Birst.</div></div><div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> Who may override a price on an order line, and whether there's an approval limit in M3, hasn't been decided.</div>"],[2,"Open OIS100 and enter an order line for practice","Press Ctrl+S to open Search and Start, type OIS100, select Customer Order. Open from the list, and click OK. Enter the customer number, set CO type to C01, click Next through the panels to reach OIS101. Enter a test item. Note the price M3 calculates automatically — this is the price from the customer's price list (OIS017)."],[3,"Override the price on the order line","On the order line, find the Unit Price field. The current price is shown. Click directly into the price field and type the new price. M3 may prompt you with a warning that the price has been changed from the standard. Acknowledge the warning and continue."],[4,"Check if your user role allows price overrides","After entering a lower price, M3 may require authorization — it depends on how much below the standard price you are going. If M3 shows a hold or authorization message, the override exceeds your approval limit. You will need to get approval from a sales manager before the order can be released."],[5,"Document the reason for the override in order notes","Right-click the order header and select Notes. Add a note explaining: why the price was overridden, who authorized it, and what the customer was told. Example: 'Price matched competitor quote from XYZ Supply. Authorized by Mike Parsons 6/10/26.' This documentation is required for audit purposes."],[6,"Release the order after authorization","Once the override is approved (either automatically within your authority, or after manager authorization), release the order normally. The overridden price will appear on the customer invoice. Verify the price on the confirmation before it goes to the customer."],[7,"Review price override reports in Birst","Check Birst for a report of changed prices (ask your Birst administrator for the name). Frequent overrides for the same customer or item usually mean the price list needs updating."],[8,"Correct a pricing error before invoicing","If an order was entered with the wrong price and has NOT been invoiced yet, open OIS100, find the order, and change the order status to allow edits. Correct the price on the line, document the change in notes, and re-release. If the order has already been invoiced, a credit memo or new order line at the difference may be needed — contact Philip Jones in accounting."]],"quiz":[{"q":"When is a price override on an order line appropriate?","options":["Any time a customer asks for a better price","For one-time situations like matching a competitor quote or correcting an error — not for routine use","Whenever the standard price seems too high","Only on will call orders"],"answer":1},{"q":"What should you always do after overriding a price on an order?","options":["Email the customer the new price","Add a note to the order explaining why the price was changed and who authorized it","Delete the original price from OIS017","Call the warehouse to hold the order"],"answer":1},{"q":"What does M3 do when a price override exceeds your authorization limit?","options":["It applies the override automatically","It sends an email to the customer","It places the order on hold and requires manager approval before it can be released","It cancels the order"],"answer":2},{"q":"If you find yourself overriding the same customer and item price every order, what should you do instead?","options":["Keep overriding — it saves time","Update the price permanently in OIS017 so M3 calculates it correctly on every new order","Ask IT to disable the standard price for that item","Apply a blanket discount in the customer master"],"answer":1}],"checklist":["Understands when a price override is and is not appropriate","Can locate and change the unit price on an OIS100 order line","Knows what to do if the override requires manager authorization","Documents every price override with a reason and authorization in order notes","Can find the price override report in Birst to monitor trends","Knows how to correct a pricing error before and after invoicing"]}]},"endToEnd":{"id":"endToEnd","name":"End-to-End Process Walkthroughs","owner":"All super users","weeks":"Week 8","pill":"pill-gold","color":"#c49a2a","programs":["CRS620","PPS170","PPS200","PPS300","APS100","APS200","CRS610","OIS100","OIS300","MWS410","MWS420","OIS350","ARS110","ARS200"],"summary":"Full cross-functional walkthroughs connecting Purchasing, Warehouse, Sales, and Finance through Procure to Pay and Order to Cash.","links":[["Procure to Pay Packet","resources/week-8-procure-to-pay-walkthrough-packet.html"],["Order to Cash Packet","resources/week-8-order-to-cash-walkthrough-packet.html"]],"sessions":[{"id":"w8-1","title":"Procure to Pay — Full Walkthrough","duration":"90 min","steps":[["1","Verify supplier — CRS620","Purchasing opens CRS620 and confirms the supplier is active, has payment terms, and is ready for a PO."],["2","Create PO header — PPS200","Purchasing opens PPS200, clicks New for a new PO. Enters supplier, PO type, buyer, warehouse, and requested delivery date."],["3","Add PO lines — PPS201","Purchasing adds at least two lines: item number, quantity, UOM, price, and delivery date. Records the PO number assigned by M3."],["4","Approve and release PO","Purchasing records the supplier's confirmation in PPS250 and follows Adleta's rule for sending the PO."],["5","Receive goods — PPS300","Warehouse opens PPS300, finds the PO, verifies packing slip against PO items and quantities, enters actual received quantities, and confirms. Records receipt number."],["6","Verify inventory update — MWS068","Warehouse checks the received stock in MWS068 (location and lot) and MMS002 (on hand for the warehouse)."],["7","Enter supplier invoice — APS100","Finance AP opens APS100 (your division (A01 in the test company), FAM 300), enters the supplier invoice, and matches it to the PO and receipt."],["8","Resolve match result","If matched: invoice is auto-approved. If variance: Finance AP contacts Purchasing (price issue) or Warehouse (quantity issue) to resolve before payment."],[9,"Pay the supplier","Finance AP includes the matched invoice in the next payment proposal and confirms it cleared in the supplier ledger (APS200)."],["10","Debrief — handoff questions","Group discusses: what must each department get right for the next step to work? Where do delays or errors originate?"]],"videoUrl":"","quiz":[{"q":"Before Warehouse can receive goods, Purchasing must ensure:","options":["The invoice is already entered in APS100","The PO is released and the supplier, item, quantity, and UOM are correct","The payment proposal is approved","Inventory is at zero for that item"],"answer":1},{"q":"The three-way match in APS100 compares:","options":["PO, receipt, and supplier invoice","PO, customer order, and payment","Supplier invoice, GL account, and payment","PO, warehouse, and freight invoice"],"answer":0},{"q":"A quantity variance on the three-way match means:","options":["The supplier invoice price is wrong","The invoice quantity does not match what was received","The PO was not released","Finance entered the wrong supplier number"],"answer":1},{"q":"Which department owns resolving a price variance between the PO and the supplier invoice?","options":["Warehouse","Finance AR","Purchasing and Finance AP together","IT"],"answer":2}],"checklist":["I can trace all 10 steps of the Procure to Pay process","I understand what each department must get right before the handoff","I can identify whether a match exception is a price variance or quantity variance","I know who to contact to resolve each type of exception","I completed a proof-of-completion entry with supplier, PO, receipt, and invoice references"]},{"id":"w8-2","title":"Order to Cash — Full Walkthrough","duration":"90 min","steps":[["1","Verify customer — CRS610","Sales / CS opens CRS610 and confirms the customer is active, reviews payment terms, price list, and credit status."],["2","Create order header — OIS100","CS opens OIS100 with Ctrl+S, finds the customer in Account Search, checks the header defaults, and fills in Customer's ord (the customer PO)."],["3","Add order lines — OIS101","Sales / CS adds at least two lines: item, quantity, UOM, price, and delivery date. Verifies M3 auto-populated the correct price from the customer's price list."],[4,"Check availability — Item search / MWS068","CS checks stock by warehouse in OIS101 Item search (green = available) or MWS068 for lots. Short stock gets communicated before going further."],[5,"Release, pick, and ship — MWS410 / MWS420","The order sits at 33-ALLOCATED. The warehouse releases the delivery in MWS410 (44-PICK RELEASED), reports the pick in MWS420, and the delivery goes out on its load or as will call."],[6,"Review the invoice — OIS350","After the delivery goes out, the customer is invoiced. Look it up in OIS350 (CO Invoice. Display): customer, order, quantity, amount."],[7,"Record the payment — ARS110","AR posts the customer's payment in ARS110 and applies it to the invoice. Counter payments come through the cash desk (OIS215)."],[8,"Check the ledger — ARS200","AR checks the customer ledger and aging in ARS200 and flags anything past due."],[9,"Handle exceptions — credit or prepay","Credit hold: credit releases it in OIS120; CS doesn't work around it. Prepay: the delivery shows C10 in MWS410 until the cash desk takes payment."],["10","Debrief — handoff questions","Group discusses: where do customer-facing problems start? Where do financial problems start? What does each department need from the previous step?"]],"videoUrl":"","quiz":[{"q":"Before Warehouse can ship an order, Sales / CS must ensure:","options":["The payment is already collected","The customer invoice is generated","The customer order has correct items, quantities, ship-to address, and requested date","The AR aging is reviewed"],"answer":2},{"q":"Confirming a shipment in OIS300 automatically:","options":["Creates a new customer order","Updates inventory and triggers the customer invoice","Sends an email to the customer","Closes the customer account"],"answer":1},{"q":"If a customer is on credit hold, Sales / CS should:","options":["Ship the order and let Finance sort it out","Contact the customer directly to collect payment","Stop order processing and contact Finance AR before any customer communication","Cancel the order without notifying anyone"],"answer":2},{"q":"Applying a customer payment in ARS200 to the wrong invoice causes:","options":["No problem — it can be corrected later without impact","The correct invoice to remain open and appear overdue, possibly triggering a credit hold","The payment to be lost","The order to be cancelled"],"answer":1},{"q":"Where does the warehouse release an order for picking?","options":["MWS410","OIS100","ARS110","PPS300"],"answer":0},{"q":"A prepay order is waiting for payment. Where do you see it?","options":["C10 stop in MWS410","Credit flag in OIS300","APS200","GLS210"],"answer":0}],"checklist":["I can trace all steps of the Order to Cash process from customer order to payment","I understand what each department must get right before the handoff","I know how to handle a backorder — availability check, decision, and customer communication","I know the credit hold process and that Sales / CS must contact Finance before communicating with the customer","I completed a proof-of-completion entry with customer, order, shipment, invoice, and payment references"]}]},"week9":{"id":"week9","name":"Trainer Readiness and Go-Live Prep","owner":"All super users","weeks":"Week 9","pill":"pill-red","color":"#c0443b","programs":["Teams","SharePoint","Issue Log","Planner"],"summary":"Teach-backs, readiness sign-off, FAQ build, go-live support roles, department training handoff, and stabilization.","links":[["Teach-Back Packet","resources/week-9-teach-back-readiness-signoff-packet.html"],["Go-Live Playbook","resources/go-live-support-playbook.html"],["Department Handoff Plan","resources/department-training-handoff-plan.html"]],"sessions":[{"id":"w9-1","title":"Teach-Back Preparation","duration":"60 min","steps":[["1","Review your module","Open your module in the portal and review every session, step, quiz, and checklist. Identify any gaps before your teach-back."],["2","Know your 15-minute structure","2 min: explain the department workflow. 5 min: walk through key M3 programs. 3 min: explain one exception and first response. 2 min: explain a department handoff. 2 min: give a practice question you would ask users. 1 min: confirm escalation path."],["3","Prepare your normal scenario","Choose one complete normal workflow you can walk through live in M3 — from opening the program to saving the transaction."],["4","Prepare your exception scenario","Choose one common exception in your module. Know the steps: identify it, who to contact, how to log it."],["5","Prepare your handoff","Name one department that hands off to you and one you hand off to. Know what data must be correct at each handoff."],["6","Prepare a department training tip","Think about one thing your department users will find confusing. Plan how you would explain or demonstrate it."],["7","Practice with a peer","Run through your 15-minute teach-back with another super user. Time yourself. Get feedback on clarity."],["8","Review the rubric","Passing requires average 2.5 or higher across all criteria and no score of 1 in navigation, transaction accuracy, or trainer readiness."]],"videoUrl":"","quiz":[{"q":"The teach-back format is 15 minutes. The first 2 minutes should cover:","options":["Walking through every screen in your module","Explaining the department workflow in plain business language","Reading from your training notes","Showing the issue log template"],"answer":1},{"q":"The passing standard for the teach-back rubric is:","options":["Perfect scores on all criteria","Average of 2.5 or higher and no score of 1 in navigation, accuracy, or trainer readiness","Completing all sessions in the portal","Attending all 9 weeks of training"],"answer":1},{"q":"If you are scored 1 (Not Ready) on System Navigation, you:","options":["Still pass if your other scores are high enough","Do not pass regardless of other scores","Can retake only that section","Are automatically assigned to IT support"],"answer":1},{"q":"The best way to prepare for your teach-back is:","options":["Memorize the program codes","Practice the full 15-minute walkthrough with a peer and time yourself","Read the training documents the night before","Ask Kristen to show you the workflow again"],"answer":2}],"checklist":["I have reviewed every session, step, and checklist in my assigned module","I know my 15-minute teach-back structure","I have a normal scenario I can walk through live in M3","I have an exception scenario with the correct handling steps","I know my upstream and downstream department handoffs","I have practiced with a peer and received feedback","I understand the rubric and passing standard"]},{"id":"w9-2","title":"Teach-Back and Readiness Sign-Off","duration":"90 min","steps":[["1","Deliver your 15-minute teach-back","Present to KRISTENB and the group. Follow the structure: workflow, programs, exception, handoff, practice question, escalation path."],["2","Receive rubric scores","KRISTENB scores each criteria 1-3. Listen for feedback. Do not argue — note coaching items for remediation."],["3","Review readiness decision","Ready: proceed to department training plan. Ready With Coaching: targeted remediation assigned before go-live. Not Ready: additional training scheduled with backup support assigned."],["4","Build your FAQ contribution","Write 3-5 questions your department users are likely to ask. Include the correct answer and which program or step it relates to. Submit to the shared FAQ."],["5","Review open issues","Go through the issue log. For each open item in your module: confirm owner, confirm resolution path, and flag anything that could block go-live."],["6","Sign readiness acknowledgment","Complete the readiness acknowledgment form: name, department, module, readiness status, required remediation, and signature. Manager countersigns."],["7","Confirm department training date","Lock in the date, location, and attendee list for your department training session. Confirm practice data is ready."]],"videoUrl":"","quiz":[{"q":"If you receive a readiness status of Ready With Coaching, your next step is:","options":["Wait for go-live and figure it out on the job","Complete assigned remediation and retest the weak area before go-live","Start training your department immediately","Request a different module assignment"],"answer":1},{"q":"Your FAQ contribution should include:","options":["Every possible M3 question","3-5 likely questions from your department users with correct answers and program references","Only questions you personally had during training","A copy of all training documents"],"answer":1},{"q":"The readiness acknowledgment confirms that you:","options":["Scored perfectly on all quizzes","Attended every training session without absence","Completed training, practiced, finished your teach-back, and understand your go-live responsibility","Have read all SharePoint documents"],"answer":2},{"q":"Before your department training session, you must confirm:","options":["That all super users have passed their teach-backs","Training date, attendees, practice data, and that your known issues are documented","That the portal has been updated","That IT has finished the system configuration"],"answer":1}],"checklist":["I delivered my 15-minute teach-back","I received my rubric scores and understand any coaching feedback","I know my readiness status — Ready, Ready With Coaching, or Not Ready","I submitted 3-5 FAQ contributions with correct answers","I reviewed all open issues in my module and confirmed owners","I signed the readiness acknowledgment","My department training date and attendee list are confirmed"]},{"id":"w9-3","title":"Go-Live Support and Department Handoff","duration":"60 min","steps":[["1","Know your support tier","You are Tier 1 — first-line support for your department. Handle how-to questions, navigation, and known workarounds. Escalate to KRISTENB (Tier 2) when an issue blocks work, affects data, or needs a configuration change."],["2","Know the issue log fields","Every issue must include: date/time, department, reported by, program, process, what happened, steps tried, business impact, priority (High/Medium/Low), owner, status, and resolution."],["3","Understand issue priority","High: blocks orders, shipments, receiving, invoicing, payment, or period close — same day triage. Medium: workaround exists but slows work — 1-2 days. Low: question, training gap, or enhancement — weekly review."],["4","Know the daily go-live rhythm","Start of day: review open high-priority issues. Midday: check blockers. End of day: review resolved items and FAQ updates. Report to KRISTENB if anything is blocking your department."],["5","Confirm your floor support availability","Know your agreed support hours during go-live week. Keep your module guide and quick reference open. Use training materials before guessing."],["6","Review your department training handoff checklist","Confirm: department user list, training date, quick reference ready, practice scenario ready, known issues documented, escalation path shared, sign-off method confirmed."],["7","Avoid unauthorized changes","Never make data or configuration changes in production without approval. Log the issue and escalate. Document everything."],["8","Post go-live stabilization","For the first 2-4 weeks: continue daily issue review, track repeated training gaps, update job aids weekly, hold department check-ins, review open items with leadership weekly."]],"videoUrl":"","quiz":[{"q":"As a Tier 1 super user, you should escalate an issue to KRISTENB when:","options":["A department user asks a how-to question","The issue blocks work, affects data, or requires a configuration or security change","Someone is confused about navigation","You want to update the FAQ"],"answer":1},{"q":"A High priority issue is one that:","options":["Is annoying but has a workaround","Blocks orders, shipments, receiving, invoicing, payment, or period close","Is a training gap or question","Was logged more than once"],"answer":1},{"q":"If a department user asks you how to do something and you are not sure, you should:","options":["Give your best guess","Tell them to call IT","Check your training materials first before answering","Ignore the question until you are certain"],"answer":2},{"q":"During the post go-live stabilization period, repeated questions should become:","options":["Ignored after the first week","FAQ updates and job aid improvements","Escalations to Infor support","New training sessions from scratch"],"answer":1}],"checklist":["I know my support tier and what I handle vs what I escalate","I can create a complete issue-log entry with all required fields","I know the three priority levels and response expectations","I know the daily go-live rhythm and when to report to KRISTENB","I have confirmed my floor support availability during go-live week","My department training handoff checklist is complete","I understand I must never make unauthorized data or configuration changes in production"]}]},"setup":{"id":"setup","name":"M3 Setup and Administration","owner":"M3 admins (Mike Parsons, Kristen B.)","weeks":"Admin track","pill":"pill-gray","color":"#4b5b6b","programs":["OIS010","OIS014","CMS082","CRS075","CRS076","OIS121","OIS210","MMS005","MMS010","CRS165","CRS022","CRS014","MNS150","ARS025"],"summary":"Order types, payment terms and prepay switches, cash desks, warehouses and bins, number series, default views, and users. Admins only.","links":[["Guide","resources/adleta-m3-setup-learningguide.html"]],"sessions":[{"id":"adm-1","title":"Order Types, Fields, and Payment Setup","duration":"1.5 hours","steps":[[1,"Who This Is For","M3 admins only. Changes here affect every user.<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS010</td><td style='padding:3px 8px;'>CO Type. Open</td><td style='padding:3px 8px;'>Order types (C01, CUT…): panel sequence, credit check, rounding, advance invoicing</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS014</td><td style='padding:3px 8px;'>CO Type. Update Field Selection</td><td style='padding:3px 8px;'>Which order fields show per order type</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CMS082</td><td style='padding:3px 8px;'>User-defined Fields. Open</td><td style='padding:3px 8px;'>Labels of user-defined fields (Sidemark, Job number…)</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS075</td><td style='padding:3px 8px;'>Payment Term. Open</td><td style='padding:3px 8px;'>Payment terms (PP, COD, PCD, N30…)</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS076</td><td style='padding:3px 8px;'>AR Payment Method. Open</td><td style='padding:3px 8px;'>Payment methods (cash, check, card)</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS121</td><td style='padding:3px 8px;'>Advance Invoice Selection Table. Open</td><td style='padding:3px 8px;'>Prepayment percentage</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS210 / 211 / 212 / 209</td><td style='padding:3px 8px;'>Cash Desk. Open / Connect Payment Method / Connect User / Connect Approver</td><td style='padding:3px 8px;'>Cash desks</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"Order Types","OIS010 controls how each CO type behaves: which panels show, whether credit is checked, rounding, advance invoicing. OIS014 decides which fields show on each order type."],[3,"Payment Terms and the Prepay Switches","In CRS075 a term's Cash payment, Calculate COD, and Payment proposal switches decide whether orders on that term wait for payment. Today PCD and CSH have them on; COD has every switch off.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> Whether to switch COD on or move the 681 COD customers to PCD is undecided.</div>"],[4,"Cash Desks","OIS210 creates desks (today 101A and 101B at Carrollton), OIS211 connects payment methods, OIS212 users, OIS209 approvers. Little Rock and Lenexa need desks before go-live."],[5,"Change Control","Test every setup change in company 100, write down what changed and why, and tell the affected teams first."]],"videoUrl":"","quiz":[{"q":"Order type behavior (credit check, panels) is in:","options":["OIS010","OIS100","CRS610","MWS410"],"answer":0},{"q":"Which switches make a term pay-first?","options":["Cash payment, Calculate COD, Payment proposal (CRS075)","Credit limit","Route","Item status"],"answer":0},{"q":"Users are connected to a cash desk in:","options":["OIS212","OIS215","MNS150 only","ARS200"],"answer":0}],"checklist":["I know what OIS010 and OIS014 control","I can read the prepay switches in CRS075","I know how cash desks are set up","I test setup changes in company 100 first"]},{"id":"adm-2","title":"Warehouses, Locations, Numbering, and Users","duration":"1.5 hours","steps":[[1,"Programs","<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS005</td><td style='padding:3px 8px;'>Warehouse. Open</td><td style='padding:3px 8px;'>Warehouses</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS010</td><td style='padding:3px 8px;'>Stock Location. Open</td><td style='padding:3px 8px;'>Bin locations</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS701</td><td style='padding:3px 8px;'>Settings - Warehouse Planning Control</td><td style='padding:3px 8px;'>Allocation time fence</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS165</td><td style='padding:3px 8px;'>Number Series. Open</td><td style='padding:3px 8px;'>Order, invoice, and receipt numbers</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS022 / CRS014</td><td style='padding:3px 8px;'>Sorting order. Open / Program start values</td><td style='padding:3px 8px;'>Sorting orders and which view a program opens with</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS171 + CMS016 / CMS017</td><td style='padding:3px 8px;'>Salesperson Selection Table / Object Control</td><td style='padding:3px 8px;'>Which salesperson goes on an order line</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MNS150</td><td style='padding:3px 8px;'>User. Open</td><td style='padding:3px 8px;'>M3 users</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>ARS025</td><td style='padding:3px 8px;'>Credit managers</td><td style='padding:3px 8px;'>Every credit manager on CRS610 must be here</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"Warehouses and Bins","MMS005 holds warehouses (CAR, plus Little Rock and Lenexa). MMS010 holds bin locations. New bins must exist before stock can be received to them."],[3,"Number Series","CRS165 sets the numbering for orders, invoices, and receipts. Don't change a series that is in use without Mike."],[4,"How Programs Open","CRS022 sorting orders and CRS014 start values decide which view a program like OIS300 opens with. Use them to give a team a better default view."],[5,"Users and Roles","MNS150 holds M3 users. Build role access from the ground up for each job. Don't copy a power user. Credit managers must also exist in ARS025."]],"videoUrl":"","quiz":[{"q":"Bin locations are set up in:","options":["MMS010","MMS005","CRS165","OIS010"],"answer":0},{"q":"Order and invoice numbering is in:","options":["CRS165","CRS075","MWS410","OIS120"],"answer":0},{"q":"When giving a new user access you should:","options":["Build the role for their job","Copy a power user","Give admin","Share your login"],"answer":0}],"checklist":["I know where warehouses, bins, and number series live","I know how CRS022/CRS014 set default views","I build user access by role, not by copying"]}]}};
const EXERCISES={"fnd-1":{"obj":"Understand why Adleta is implementing M3 and what your super user role requires.","scn":"You are attending the program kickoff. Review the go-live timeline, identify your module responsibilities, and locate your training resources on the portal.","tasks":[{"n":"Review the go-live timeline","s":["Open the portal and navigate to the Roadmap tab.","Locate your module in the 9-week schedule.","Note your week, owner name, and the programs listed for your module."]},{"n":"Understand your super user responsibilities","s":["On the Super Users tab, find your name and confirm your department.","Review the three-phase model: Kristen trains you, you get certified, you train your department.","Write down 2-3 team members you will be responsible for training."]},{"n":"Locate your training materials","s":["Navigate to your module on the Modules tab.","Open the Guide link and confirm you can access the SharePoint document.","Return to the portal and open Session 1 to review the checklist."]}],"out":["You can locate your module and sessions on the portal.","You understand your role as the department trainer after certification.","You have access to your SharePoint learning guide."],"exc":[{"q":"The portal will not load or shows an error","a":"Clear your browser cache and try again. If the issue continues, notify Kristen - do not share your login with others to work around it."},{"q":"You cannot find your name on the Super Users tab","a":"Confirm your username with Kristen. Logins are case-sensitive."},{"q":"Your SharePoint guide link shows Access Denied","a":"You need to be added to the SharePoint site. Contact Kristen or IT - do not download and share the file directly."},{"q":"A team member asks why they are not on the super user list","a":"Only the designated super users per module are on the list. Redirect them to their department super user for training after certification."}]},"fnd-2":{"obj":"Navigate M3 confidently using the 6 core navigation skills every super user must know.","scn":"You are in the M3 training environment. Practice each navigation skill before your first module session.","tasks":[{"n":"Launch M3 and use the program search","s":["Log in to the M3 test environment with your training credentials.","Press Ctrl+S to open Search and Start, type PPS200, select it, and click OK.","Confirm the Purchase Order. Open panel loads."]},{"n":"Use function keys and panel navigation","s":["In PPS200, press F1 to access Help and review field descriptions.","Press Escape to go back without saving.","Use the breadcrumb at the top to confirm your location in M3."]},{"n":"Sort, filter, and right-click","s":["Press Ctrl+S and open MMS200 (Item. Open Toolbox). Type A in the Item number field.","Press Enter to display items beginning with A.","Right-click any row and review the available options (Related, Tools).","Click the column header to sort results ascending, then descending."]},{"n":"Open a related program","s":["From MMS200, right-click an item and select Related.","Choose Balance Identity (MWS068) to see stock by location and lot for that item.","Confirm MWS068 opens filtered to the item without re-entering it."]}],"out":["You can open any M3 program with Ctrl+S (Search and Start).","You can navigate between panels, sort lists, and right-click to related programs.","You understand the difference between Escape (cancel) and closing a panel."],"exc":[{"q":"Ctrl+S does nothing","a":"Click inside the M3 window first so it has focus, then press Ctrl+S again. If it still does nothing, tell your trainer."},{"q":"Pressing Enter in a search returns no results","a":"Check for leading spaces or extra characters in the field. M3 searches are exact-match on the characters you type."},{"q":"Right-click shows no Related option","a":"The Related option only appears on list panels, not header panels. Make sure you are right-clicking a row in a list, not a field."},{"q":"A panel opens read-only and you cannot change anything","a":"Your user role may not have edit access for that program. Note the program name and report it to Kristen or IT."}]},"fnd-3":{"obj":"Map Adleta business terms to their M3 equivalents so you can find the right data in the right place.","scn":"A team member asks where to find a customer account in M3. Practice looking up the key terminology mappings and locating each one in the system.","tasks":[{"n":"Look up customers in M3","s":["Press Ctrl+S and open CRS610 (Customer. Open).<img class=\"ex-shot\" src=\"images/m3/crs610.jpg\" alt=\"CRS610 customer list\" loading=\"lazy\" onclick=\"openShot(this)\">","Search for customer number 000382.","Confirm the record shows - this is what Adleta calls a customer account."]},{"n":"Look up suppliers/suppliers","s":["Open CRS620 (Supplier. Open) in M3.","Search for supplier S900400 (AHF PRODUCTS).<img class=\"ex-shot\" src=\"images/m3/crs620.jpg\" alt=\"CRS620 supplier list\" loading=\"lazy\" onclick=\"openShot(this)\">","Note the M3 term is Supplier - Adleta calls this a vendor."]},{"n":"Locate a warehouse and item","s":["Press Ctrl+S and open MMS200 (Item. Open Toolbox). Filter Warehouse = CAR and search for any flooring item.","Right-click and select Related > Balance Identity (MWS068) to see stock by location and lot.","Confirm CAR is the Carrollton warehouse (facility 101)."]},{"n":"Self-quiz the terminology crosswalk","s":["Open the Foundation Learning Guide from the module Resources section.","Find the Terminology Crosswalk table.","Cover the M3 column and name the M3 term for each Adleta term without looking."]}],"out":["You can find customers, suppliers, warehouses, and items in M3.","You know the key Adleta-to-M3 term mappings.","You can locate the correct program for any common lookup."],"exc":[{"q":"You search for 000382 and get no results","a":"Confirm you are in the correct program (OIS300 for customers, CRS620 for suppliers). Customer and supplier numbers live in different programs."},{"q":"The M3 term does
