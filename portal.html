training data shows CARE34V, lot P236C).<img class=\"ex-shot\" src=\"images/m3/mws068.jpg\" alt=\"MWS068 stock by location and lot\" loading=\"lazy\" onclick=\"openShot(this)\">","If nothing is on hand, open MMS080 for the item and CAR to see when supply is due.<img class=\"ex-shot\" src=\"images/m3/mms080.jpg\" alt=\"MMS080 material plan\" loading=\"lazy\" onclick=\"openShot(this)\">"]},{"n":"Find the invoice","s":["Press Ctrl+S, type OIS350, and click OK.","Filter on customer 000382.<img class=\"ex-shot\" src=\"images/m3/ois350.jpg\" alt=\"OIS350 invoice display\" loading=\"lazy\" onclick=\"openShot(this)\">","Find the invoice for last week and note the invoice number."]}],"out":["Order status read correctly from OIS300.","Stock, location, and lot confirmed in MWS068.","Invoice located in OIS350."],"exc":[{"q":"OIS350 shows no invoice for the order","a":"The order may not have been invoiced yet. Check its status in OIS300."},{"q":"MWS068 shows stock but OIS101 Item search shows none available","a":"The stock may be allocated to other orders. Ask your trainer to walk through allocation for that item."}]},"cd-1":{"obj":"Take a counter payment for a will call order in OIS215.","scn":"Customer 000382 is at the Carrollton counter to pay for and pick up a will call order of 3 CT of ARM51830031. Take the payment on cash desk 101A.","tasks":[{"n":"Find the order","s":["Press Ctrl+S, type OIS300, and click OK.","Filter Customer = 000382 and find the will call order (delivery method WC).","Note the CO no and order total."]},{"n":"Take the payment","s":["Press Ctrl+S, type OIS215, and click OK.","Select cash desk 101A.<img class=\"ex-shot\" src=\"images/m3/ois215.jpg\" alt=\"OIS215 cash payment with desk 101A\" loading=\"lazy\" onclick=\"openShot(this)\">","Find the order or invoice for 000382 and confirm the amount with the customer.","Select the payment method the customer is using and save."]},{"n":"Confirm the order can move","s":["Press Ctrl+S, type MWS410, and click OK.","Find the delivery for the CO no.","If the order was on a pay-first term, confirm the C10 stop is gone.","Tell the warehouse it is paid and ready to release."]}],"out":["Payment recorded on cash desk 101A.","Delivery free of the C10 stop.","Warehouse told the order is ready."],"exc":[{"q":"Cash desk 101A does not appear","a":"Your user may not be connected to that desk (OIS212). Tell your trainer."},{"q":"The payment method you need is not offered","a":"The desk only accepts the methods connected in OIS211. Tell your trainer. Do not use a different method to get around it."}]},"cd-2":{"obj":"Recognize and clear a prepay hold.","scn":"A test customer is set to Payment terms PCD in company 100. Key a small C01 order and follow it until it can be picked.","tasks":[{"n":"Key the order","s":["Enter a small C01 order for a stocked item for the PCD test customer (your trainer provides it).","Finish the order and note the CO no."]},{"n":"Find the hold","s":["In OIS300, confirm the order shows no credit flag.","In MWS410, find the delivery. Look for stop C10 \"delivery not paid\".<img class=\"ex-shot\" src=\"images/m3/mws410.jpg\" alt=\"MWS410 delivery toolbox\" loading=\"lazy\" onclick=\"openShot(this)\">"]},{"n":"Clear it","s":["Take the payment in OIS215 on cash desk 101A.","Re-check MWS410: the C10 stop should be gone and the delivery can be released.","Write down what you saw. This test also settles open points in Mike's prepay guide."]}],"out":["C10 stop seen on a PCD order.","No credit flag in OIS300.","Stop cleared after payment in OIS215."],"exc":[{"q":"No C10 stop appears","a":"Note it and tell Mike. The order type or a prepayment selection table may also matter. This is one of the things the test is checking."}]},"cd-3":{"obj":"Close the cash drawer at the end of the day.","scn":"It's end of day at the Carrollton counter. Print the day's payments for desk 101A, reconcile, and validate the desk.","tasks":[{"n":"Print the payments","s":["Press Ctrl+S, type OIS223, and click OK.","Select desk 101A and today's date and run it."]},{"n":"Reconcile","s":["Count cash, checks, and card slips.","Compare each total to the OIS223 list.","Write down any difference before going further."]},{"n":"Validate","s":["Press Ctrl+S, type OIS217, and click OK.<img class=\"ex-shot\" src=\"images/m3/ois217.jpg\" alt=\"OIS217 cash desk validate\" loading=\"lazy\" onclick=\"openShot(this)\">","Validate desk 101A for today with your trainer watching.","Run OIS221 to list any unpaid cash invoices."]}],"out":["Day's payments printed.","Drawer reconciled by payment method.","Desk validated in OIS217."],"exc":[{"q":"The drawer doesn't match OIS223","a":"Recount first. If it still doesn't match, stop and tell your manager before validating."}]},"pur-9":{"obj":"Return damaged goods to the supplier.","scn":"Two cartons of ARM51899031 received from AHF PRODUCTS (S900400) last week were damaged. The supplier has authorized the return.","tasks":[{"n":"Find the receipt","s":["Press Ctrl+S, type PPS220, and click OK.","Find the PO for S900400 that brought in ARM51899031.","Open MWS068 and note the location and lot of the damaged cartons."]},{"n":"Enter the return","s":["Press Ctrl+S, type PPS390, and click OK.","Reference the PO, enter item ARM51899031, quantity 2, and the lot.","Save."]},{"n":"Hand off","s":["Check MWS068: the 2 cartons are gone from the location.","Send AP the PO number and return details so they expect the credit."]}],"out":["Return entered in PPS390.","Stock reduced at the location.","AP told to expect a credit."],"exc":[{"q":"PPS390 screens don't match these steps","a":"Stop and tell your trainer. The process is still being confirmed."}]},"inv-5":{"obj":"Review and update planning settings for an item.","scn":"The buyer wants a new reorder point and order quantity for ARM51830031 at CAR.","tasks":[{"n":"Open the item in the warehouse","s":["Press Ctrl+S, type MMS002, and click OK.","Filter warehouse CAR and item ARM51830031.","Right-click the row and choose Change."]},{"n":"Review settings","s":["Find reorder point, order quantity, and safety stock (use the panel tabs at the bottom).","Write down the current values."]},{"n":"Update and check","s":["Enter the new values from the buyer and save.","Reopen the record to confirm they saved.","Open MMS080 for the item and CAR to see current supply and demand.<img class=\"ex-shot\" src=\"images/m3/mms080.jpg\" alt=\"MMS080 material plan\" loading=\"lazy\" onclick=\"openShot(this)\">"]}],"out":["Planning settings reviewed and updated in MMS002.","Values confirmed saved.","Supply and demand reviewed in MMS080."],"exc":[]},"log-6":{"obj":"Explain why a customer's delivery calendar shows certain days.","scn":"CS says customer 000382 can only get deliveries on certain days. Find out why.","tasks":[{"n":"Find the customer's route","s":["Press Ctrl+S, type DRS011, and click OK.","Find the selection line that gives 000382 its route. Note the route."]},{"n":"Find the departures","s":["Press Ctrl+S, type DRS006, and click OK.","Filter on that route and note the departure days and times."]},{"n":"Compare","s":["In OIS100, start an order for 000382 and open the delivery calendar.","Confirm the days match the departures. Close without saving."]}],"out":["Customer's route found in DRS011.","Departure days found in DRS006.","Delivery calendar explained."],"exc":[{"q":"You can't see DRS011 or DRS006","a":"These are setup programs. Your role may not have access. Ask Mike."}]},"fin-8":{"obj":"Correct the GL coding on a posted supplier invoice.","scn":"An AHF PRODUCTS (S900400) freight invoice was coded to the wrong cost center.","tasks":[{"n":"Find the invoice","s":["Press Ctrl+S, type APS200, and click OK.","Find supplier S900400 and the freight invoice. Note the invoice number and current coding."]},{"n":"Recode","s":["Press Ctrl+S, type APS110, and click OK.","Find the invoice and enter the correct account string your trainer gives you.","Save and note the reason."]},{"n":"Check","s":["Press Ctrl+S, type GLS210, and click OK.","Look up both accounts and find the recode entries."]}],"out":["Invoice found in APS200.","Coding corrected in APS110.","Correction visible in GLS210."],"exc":[]},"gl-7":{"obj":"Process a period close checklist step - confirm all AP batches and GL journals are posted before close.","scn":"It is month-end. Walk through the key M3 steps to confirm AP invoices are posted, GL journals are complete, and the period is ready to close in GLS910.","tasks":[{"n":"Confirm AP invoices are posted","s":["Open APS450 (Supplier Invoice Batch. Open), set Division = A01, click Apply.","Confirm no invoices remain in an unposted or error status.","Open APS130 (Suppl Payment Proposal. Open) and confirm all payment proposals for the period are finalized.","If any invoices need to post before close, process them now."]},{"n":"Confirm GL journals are complete","s":["Open GLS100 (Journal Voucher. Enter), Division (A01 in the test company).","Check for any saved but unposted journal vouchers.","Open GLS200 (Voucher. Display), set Division = A01, filter to current period, click Apply.","Review the list to confirm all expected accrual and adjusting entries are present."]},{"n":"Run the period close in GLS910","s":["Press Ctrl+S, type GLS910, and open Year/Period. Close.","Set Division = A01 and the period to close.","Review any warnings M3 displays before closing.","Confirm the close - once closed, no additional entries can be posted to that period without reopening.","Notify the controller that the period is closed."]}],"out":["AP invoices confirmed posted before close.","GL journals reviewed and complete in GLS200.","Period closed in GLS910 for Division (A01 in the test company)."]},"gl-8":{"obj":"Run a GL financial report in M3 to review the income statement or balance sheet.","scn":"The controller needs a quick income statement for the current period. Run the GL financial report in GLS990 for Division (A01 in the test company).","tasks":[{"n":"Open GLS990 and set report parameters","s":["Press Ctrl+S, type GLS990, and open Financial Report. Create.","Set Division = A01.","Set the Period range to the current period.","Select the report layout for the income statement (the controller or GL admin can tell you which layout to use).","Click Apply or Run."]},{"n":"Review the report output","s":["GLS990 generates the financial report showing revenue, cost, and expense account balances.","Review the totals for each section - Revenue, Cost of Goods Sold, Operating Expenses.","Compare actual amounts to budget if the report includes a budget column.","Note any accounts with unexpected balances or large variances to budget."]},{"n":"Export or print the report","s":["Use the Tools menu or print icon to export the report to Excel or PDF.","Share the report with the controller or finance team.","If an account balance needs investigation, use GLS215 (GL Balance File. Display) to drill into the detail.","Document any variances or items requiring follow-up before the next leadership review."]}],"out":["Financial report run in GLS990 for Division (A01 in the test company).","Income statement reviewed for current period.","Variances identified and escalated as needed."]},"cr-1":{"obj":"Review and release a credit-held order.","scn":"An order for customer 000382 is held for credit limit (CO stop 3). Review the account and release it.","tasks":[{"n":"Find the hold","s":["Press Ctrl+S, type OIS300, and click OK.","Use the credit view and find the held order for 000382.<img class=\"ex-shot\" src=\"images/m3/ois120.jpg\" alt=\"OIS120 customer order stop\" loading=\"lazy\" onclick=\"openShot(this)\">"]},{"n":"Review the account","s":["Open CRS610 for 000382, panel J: note the credit limit and terms.<img class=\"ex-shot\" src=\"images/m3/crs610j.jpg\" alt=\"CRS610 panel J credit limits and stop codes\" loading=\"lazy\" onclick=\"openShot(this)\">","Open CRS315 for 000382. Press F15 to refresh and compare limit to balance.<img class=\"ex-shot\" src=\"images/m3/crs315.jpg\" alt=\"CRS315 customer credit limit\" loading=\"lazy\" onclick=\"openShot(this)\">","Open ARS200 for 000382 and check the aging."]},{"n":"Release","s":["Press Ctrl+S, type OIS120, and click OK.","Find the order and release it as your trainer directs (0 or 9).","Check OIS300: the credit flag is off."]}],"out":["Held order found in OIS300.","Account reviewed in CRS610, CRS315, ARS200.","Order released in OIS120."],"exc":[]},"cr-2":{"obj":"Recognize and clear a prepay hold.","scn":"A test customer is set to Payment terms PCD in company 100. Key a small C01 order and follow it until it can be picked.","tasks":[{"n":"Key the order","s":["Enter a small C01 order for a stocked item for the PCD test customer (your trainer provides it).","Finish the order and note the CO no."]},{"n":"Find the hold","s":["In OIS300, confirm the order shows no credit flag.","In MWS410, find the delivery. Look for stop C10 \"delivery not paid\"."]},{"n":"Clear it","s":["Take the payment in OIS215 on cash desk 101A.","Re-check MWS410: the C10 stop should be gone and the delivery can be released.","Write down what you saw. This test also settles open points in Mike's prepay guide."]}],"out":["C10 stop seen on a PCD order.","No credit flag in OIS300.","Stop cleared after payment in OIS215."],"exc":[{"q":"No C10 stop appears","a":"Note it and tell Mike. The order type or a prepayment selection table may also matter. This is one of the things the test is checking."}]},"cr-3":{"obj":"Review a customer's balance before a credit decision.","scn":"Credit is deciding whether to release an order for customer 000382. Pull the account picture.","tasks":[{"n":"Open the ledger","s":["Press Ctrl+S, type ARS200, and click OK.<img class=\"ex-shot\" src=\"images/m3/ars200.jpg\" alt=\"ARS200 customer ledger\" loading=\"lazy\" onclick=\"openShot(this)\">","Find customer 000382."]},{"n":"Read it","s":["Note total open balance and the oldest open invoice.","Note any unapplied payments or credits."]},{"n":"Compare to the limit","s":["Open CRS315 for 000382 and press F15.","Compare the limit to the balance. Write a one-line summary for the credit decision."]}],"out":["Open balance, oldest invoice, and unapplied items noted.","Limit vs balance compared.","Summary ready for the credit decision."],"exc":[]},"adm-1":{"obj":"Read the prepay switches on Adleta's payment terms.","scn":"Before go-live, confirm which payment terms make orders wait for payment. Read-only: change nothing.","tasks":[{"n":"Open payment terms","s":["Press Ctrl+S, type CRS075, and click OK. Company 100.<img class=\"ex-shot\" src=\"images/m3/crs075.jpg\" alt=\"CRS075 payment terms\" loading=\"lazy\" onclick=\"openShot(this)\">","For PCD, CSH, CC, DUR, COD, CSD, and PP, note Cash payment, Calculate COD, and Payment proposal."]},{"n":"Compare to Mike's table","s":["PCD and CSH should show 2 / 1 / 1. COD, CSD, and PP should show 0 / 0 / 0.","Note any difference."]},{"n":"Check the cash desks","s":["Press Ctrl+S, type OIS210, and click OK.<img class=\"ex-shot\" src=\"images/m3/ois210.jpg\" alt=\"OIS210 cash desks 101A and 101B\" loading=\"lazy\" onclick=\"openShot(this)\">","List the desks (expected 101A and 101B). Open OIS211 and OIS212 for each and note payment methods and users."]}],"out":["Switches recorded for every pay-first-related term.","Cash desk methods and users recorded.","Differences sent to Mike."],"exc":[]},"adm-2":{"obj":"Find where a setup value lives before changing anything.","scn":"Little Rock needs a cash desk and new bin locations before go-live. Find the current setup. Read-only.","tasks":[{"n":"Warehouses and bins","s":["Press Ctrl+S, type MMS005, and click OK. List the warehouse codes for Carrollton, Little Rock, and Lenexa.","Press Ctrl+S, type MMS010. Filter on the Little Rock warehouse and note how many bin locations exist."]},{"n":"Numbering","s":["Press Ctrl+S, type CRS165, and click OK.","Find the number series used for customer orde function renderExercise(s){
  var ex=EXERCISES[s.id];
  if(!ex){
    var h='<div class="card"><div class="card-title">Step-by-Step Walkthrough <span class="pill pill-gray">'+s.steps.length+' steps</span></div><div class="step-cards">';
    for(var i=0;i<s.steps.length;i++){var r=s.steps[i];h+='<div class="step-card"><div class="step-num">'+r[0]+'</div><div class="step-body"><div class="step-action">'+r[1]+'</div><div class="step-detail">'+r[2]+'</div></div></div>';}
    return h+'</div></div>';
  }
  var h='<div class="card ex-card">';
  h+='<div class="ex-objective"><div class="ex-label">Objective</div><div class="ex-text">'+ex.obj+'</div></div>';
  h+='<div class="ex-scenario"><div class="ex-label">Scenario</div><div class="ex-text">'+ex.scn+'</div></div>';
  h+='<div class="ex-section-title">Tasks</div>';
  for(var t=0;t<ex.tasks.length;t++){
    var task=ex.tasks[t];
    h+='<div class="ex-task"><div class="ex-task-head"><span class="ex-task-num">'+(t+1)+'</span><span class="ex-task-name">'+task.n+'</span></div><ol class="ex-steps">';
    for(var st=0;st<task.s.length;st++){h+='<li>'+task.s[st]+'</li>';}
    h+='</ol></div>';
  }
  h+='<div class="ex-outcome"><div class="ex-label">Expected Outcome</div><ul class="ex-outcome-list">';
  for(var o=0;o<ex.out.length;o++){h+='<li>'+ex.out[o]+'</li>';}
  h+='</ul></div>';
  if(ex.exc&&ex.exc.length){
    h+='<div class="ex-exceptions"><div class="ex-label">Exception Handling</div><div class="ex-exc-list">';
    for(var e=0;e<ex.exc.length;e++){h+='<div class="ex-exc-item"><div class="ex-exc-q">'+ex.exc[e].q+'</div><div class="ex-exc-a">'+ex.exc[e].a+'</div></div>';}
    h+='</div></div>';
  }
  return h+'</div>';
}

function findSession(sid){for(const m of Object.values(MODULES)){const s=m.sessions.find(s=>s.id===sid);if(s)return s;}return null;}
function sessionProgress(sid){const s=findSession(sid);if(!s)return 0;const done=s.checklist.filter((_,i)=>ST[`chk-${sid}-${i}`]).length;return Math.round(done/s.checklist.length*100);}
function moduleProgress(mid){const m=MODULES[mid];if(!m||!m.sessions.length)return 0;const scores=m.sessions.map(s=>ST[`quiz-score-${s.id}`]||0);return Math.round(scores.reduce((a,b)=>a+b,0)/m.sessions.length);}
function renderDashboard(){const mods=visibleModules();const tot=mods.reduce((a,m)=>a+m.sessions.length,0);const done=mods.reduce((a,m)=>a+m.sessions.filter(s=>(ST[`quiz-score-${s.id}`]||0)>=70).length,0);let html=`<div class="metrics"><div class="metric"><div class="metric-val">${mods.length}</div><div class="metric-label">My Modules</div></div><div class="metric"><div class="metric-val">${tot}</div><div class="metric-label">Sessions</div></div><div class="metric"><div class="metric-val">${done}</div><div class="metric-label">Completed</div></div><div class="metric"><div class="metric-val">${tot?Math.round(done/tot*100):0}%</div><div class="metric-label">Progress</div></div></div><div class="dash-grid"><div class="card"><div class="card-title">Mastery Model <span class="pill pill-teal">Required for sign-off</span></div><div class="mastery"><div class="mastery-node">Do it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Explain it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Troubleshoot it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Teach it</div></div></div><div class="card"><div class="card-title">Next Actions <span class="pill pill-gray">${NEXT_ACTIONS.length} items</span></div><div class="prog-wrap"><div class="prog-track"><div class="prog-fill" id="dpf" style="width:0%"></div></div><div class="prog-label" id="dpl">0%</div></div><div class="check-list" id="dcl"></div></div></div>`;
if(mods.length){html+=`<div class="sec-hd" style="margin-top:20px"><div><div class="sec-eyebrow">Your training</div><h2>My Modules</h2></div></div><div class="mod-grid">`;html+=mods.map(m=>{const pct=moduleProgress(m.id);return`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div><div class="tags">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% complete · ${m.sessions.length} session${m.sessions.length!==1?"s":""}</div></div>`;}).join("");html+=`</div>`;}
document.getElementById("view-dashboard").innerHTML=html;
const cl=document.getElementById("dcl");if(cl){NEXT_ACTIONS.forEach((text,i)=>{const id=`act-${i}`;const div=document.createElement("label");div.className="check-item";div.innerHTML=`<input type="checkbox" ${ST[id]?"checked":""}><span>${text}</span>`;div.querySelector("input").addEventListener("change",e=>{ST[id]=e.target.checked;save();updDP();});cl.appendChild(div);});updDP();}}
function updDP(){const tot=NEXT_ACTIONS.length;const done=NEXT_ACTIONS.filter((_,i)=>ST[`act-${i}`]).length;const pct=Math.round(done/tot*100);const f=document.getElementById("dpf");const l=document.getElementById("dpl");if(f)f.style.width=pct+"%";if(l)l.textContent=pct+"%";}
function renderModules(){const mods=visibleModules();const el=document.getElementById("view-modules");let html=`<div class="sec-hd"><div><div class="sec-eyebrow">Training library</div><h2>${currentUserData.role==="admin"?"All Modules":"My Training"}</h2></div><input class="search-input" id="msr" type="search" placeholder="Search modules…"></div><div class="mod-grid" id="mgr">`;html+=mods.map(m=>{const pct=moduleProgress(m.id);return`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div><div class="tags">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% complete</div><div class="mod-links">${m.links.map(([l,u])=>`<a class="mod-link" href="${u}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">${l}</a>`).join("")}</div></div>`;}).join("");html+=`</div>`;el.innerHTML=html;document.getElementById("msr").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();const f=!q?mods:mods.filter(m=>[m.name,m.owner,m.weeks,m.summary,...m.programs].join(" ").toLowerCase().includes(q));const g=document.getElementById("mgr");if(!f.length){g.innerHTML='<div class="empty">No modules match.</div>';return;}g.innerHTML=f.map(m=>`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div></div>`).join("");});}
function openModuleDetail(mid){const m=MODULES[mid];if(!m)return;const el=document.getElementById("view-session");let html=`<button class="session-back" onclick="switchView('modules')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back to modules</button><div class="session-meta"><span class="pill ${m.pill}">${m.weeks}</span><span class="pill pill-gray">${m.sessions.length} sessions</span></div><div class="session-title">${m.name}</div><p style="margin-bottom:20px;font-size:14px">${m.summary}</p><div class="tags" style="margin-bottom:20px">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="sec-hd"><div><div class="sec-eyebrow">Sessions</div><h2>Choose a session to begin</h2></div></div><div class="mod-grid">`;html+=m.sessions.map((s,i)=>{const pct=sessionProgress(s.id);const sc=ST[`quiz-score-${s.id}`];const passed=sc>=70;return`<div class="mod-card" onclick="openSession('${m.id}','${s.id}')"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="pill pill-gray">Session ${i+1}</span>${passed?`<span class="pill pill-teal">✓ Passed ${sc}%</span>`:""}</div><h3>${s.title}</h3><div class="mod-owner">${s.duration}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% checklist done</div></div>`;}).join("");html+=`</div>`;el.innerHTML=html;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));el.classList.add("active");}
function openSession(mid,sid){const m=MODULES[mid];const sIdx=m.sessions.findIndex(s=>s.id===sid);const s=m.sessions[sIdx];if(!s)return;const el=document.getElementById("view-session");const sv=ST[`video-${sid}`]||s.videoUrl||"";const cpct=sessionProgress(sid);const prevS=sIdx>0?m.sessions[sIdx-1]:null;const nextS=sIdx<m.sessions.length-1?m.sessions[sIdx+1]:null;const sc=ST[`quiz-score-${sid}`];const passed=sc>=70;let html=`<button class="session-back" onclick="openModuleDetail('${mid}')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Back to ${m.name}</button><div class="session-progress-header"><div style="flex:1"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px">${m.name} &rsaquo; Session ${sIdx+1} of ${m.sessions.length}</div><div style="font-size:17px;font-weight:700;color:var(--ink)">${s.title}</div><div style="font-size:12px;color:var(--muted);margin-top:3px">${s.duration}</div></div><div style="text-align:right;min-width:90px"><div style="font-size:20px;font-weight:800;color:${passed?"var(--teal)":"var(--ink)"}">${passed?"✓ Passed":""+cpct+"%"}</div><div style="font-size:11px;color:var(--muted)">${passed?"Quiz passed":"Checklist done"}</div><div class="prog-track" style="margin-top:6px;width:90px"><div class="prog-fill" id="cpill-bar" style="width:${cpct}%"></div></div></div></div><div class="session-body"><div class="session-content">${sv?`<div class="card"><div class="card-title"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:6px;vertical-align:-2px"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>Training Video</div>${buildVideoEmbed(sv)}</div>`:""}${renderExercise(s)}<div class="card"><div class="card-title">Knowledge Check <span class="pill ${passed?"pill-teal":"pill-gray"}">${passed?"Passed "+sc+"%":""+s.quiz.length+" questions"}</span></div><div class="quiz-wrap" id="qw">${buildQuiz(s)}</div></div>${nextS||prevS?`<div class="session-nav">${prevS?`<button class="btn" onclick="openSession('${mid}','${prevS.id}')"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Previous</button>`:""}${nextS?`<button class="btn btn-primary" onclick="openSession('${mid}','${nextS.id}')">Next: ${nextS.title} <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>`:""}</div>`:""}
</div><div class="session-sidebar">${!sv?`<div class="card"><div class="card-title">Training Video</div><div id="va"><div class="video-placeholder">No video added yet.<br><br>Paste a YouTube or SharePoint URL below.</div></div><div class="video-input-wrap"><input class="video-input" id="vui" type="url" placeholder="Paste video URL…" value="${sv}"><button class="btn btn-primary btn-sm" onclick="saveVideo('${sid}')">Add</button></div></div>`:`<div class="card"><div class="card-title">Update Video URL</div><div class="video-input-wrap"><input class="video-input" id="vui" type="url" placeholder="Paste video URL…" value="${sv}"><button class="btn btn-primary btn-sm" onclick="saveVideo('${sid}')">Save</button></div></div>`}<div class="card print-zone"><div class="card-title" style="display:flex;align-items:center;justify-content:space-between">Session Checklist <span class="pill pill-teal" id="cpill">${cpct}%</span><button class="btn btn-sm print-hide" style="font-size:11px;padding:4px 10px" onclick="window.print()"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:4px"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</button></div><div style="font-size:12px;color:var(--muted);margin-bottom:10px">${s.title}</div><div class="check-list">${s.checklist.map((item,i)=>`<label class="check-item"><input type="checkbox" ${ST[`chk-${sid}-${i}`]?"checked":""} onchange="saveCheck('${sid}',${i},this.checked)"><span>${item}</span></label>`).join("")}</div></div><div class="card"><div class="card-title">My Notes</div><textarea class="notes-area" id="notesArea" placeholder="Add tips, shortcuts, or reminders for your team…" oninput="saveNote('${sid}',this.value)">${ST[`note-${sid}`]||""}</textarea><div class="notes-saved" id="notesSaved">Saved ✓</div></div><div class="card"><div class="card-title">Resources</div><div class="mod-links">${m.links.map(([l,u])=>`<a class="mod-link" href="${u}" target="_blank" rel="noreferrer">${l}</a>`).join("")}</div></div></div></div>`;el.innerHTML=html;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));el.classList.add("active");}
function buildVideoEmbed(url){if(!url)return'';const yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);if(yt)return`<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe></div>`;return`<a href="${url}" target="_blank" rel="noreferrer" class="btn btn-primary" style="display:inline-flex;margin-bottom:8px"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:6px"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>Watch Recording</a><div style="font-size:12px;color:var(--muted);margin-top:4px">Opens in SharePoint — sign in with your Adleta account if prompted.</div>`;}
function saveVideo(sid){const url=document.getElementById("vui").value.trim();ST[`video-${sid}`]=url;save();const a=document.getElementById("va");if(a)a.innerHTML=url?buildVideoEmbed(url):'<div class="video-placeholder">No video added.</div>';}
function saveNote(sid,val){ST[`note-${sid}`]=val;save();const el=document.getElementById("notesSaved");if(el){el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",1500);}}
function saveTeamStatus(suName,email,val,sel){ST[`team-status-${suName}-${email}`]=val;save();const colors={trained:"#1a7a6d",inprogress:"#c49a2a","not-started":"var(--muted)"};sel.style.color=colors[val]||"var(--muted)";}
function saveCheck(sid,idx,checked){ST[`chk-${sid}-${idx}`]=checked;save();const pct=sessionProgress(sid);const p=document.getElementById("cpill");if(p)p.textContent=pct+"%";}
function buildQuiz(s){const score=ST[`quiz-score-${s.id}`];const ans=ST[`quiz-answers-${s.id}`];if(score!==undefined&&ans){const a=JSON.parse(ans);let html=s.quiz.map((q,qi)=>{const c=q.answer,ch=a[qi];return`<div class="quiz-q"><div class="quiz-q-text">${qi+1}. ${q.q}</div><div class="quiz-options">${q.options.map((opt,oi)=>`<div class="quiz-option ${oi===c?"correct":oi===ch&&ch!==c?"wrong":""}"><input type="radio" disabled ${oi===ch?"checked":""}><span>${opt}</span>${oi===c?" ✓":""}</div>`).join("")}</div></div>`;}).join("");html+=`<div class="quiz-result ${score>=70?"pass":"fail"}">${score>=70?"✓ Passed":"✗ Not yet passed"} — Score: ${score}%${score<70?`<br><button class="quiz-btn" style="margin-top:10px" onclick="retakeQuiz('${s.id}')">Retake Quiz</button>`:""}</div>`;return html;}return s.quiz.map((q,qi)=>`<div class="quiz-q"><div class="quiz-q-text">${qi+1}. ${q.q}</div><div class="quiz-options">${q.options.map((opt,oi)=>`<label class="quiz-option"><input type="radio" name="qz-${s.id}-${qi}" value="${oi}"><span>${opt}</span></label>`).join("")}</div></div>`).join("")+`<button class="quiz-btn" onclick="submitQuiz('${s.id}')">Submit Quiz</button>`;}
function submitQuiz(sid){const s=findSession(sid);if(!s)return;const ans=s.quiz.map((_,qi)=>{const sel=document.querySelector(`input[name="qz-${sid}-${qi}"]:checked`);return sel?parseInt(sel.value):-1;});if(ans.includes(-1)){alert("Please answer all questions first.");return;}const cor=ans.filter((a,i)=>a===s.quiz[i].answer).length;const sc=Math.round(cor/s.quiz.length*100);ST[`quiz-score-${sid}`]=sc;ST[`quiz-answers-${sid}`]=JSON.stringify(ans);save();document.getElementById("qw").innerHTML=buildQuiz(s);}
function retakeQuiz(sid){delete ST[`quiz-score-${sid}`];delete ST[`quiz-answers-${sid}`];save();const s=findSession(sid);if(s)document.getElementById("qw").innerHTML=buildQuiz(s);}
function renderRoadmap(){document.getElementById("view-roadmap").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">9-week path</div><h2>Roadmap</h2></div></div><div class="timeline">${PHASES.map(p=>`<div class="phase-card"><div class="phase-weeks">${p.weeks}</div><div class="phase-name">${p.name}</div><div class="phase-purpose">${p.purpose}</div><div class="phase-success">✓ ${p.success}</div></div>`).join("")}</div>`;}

function renderResources(){document.getElementById("view-resources").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Source library</div><h2>Training Resources</h2></div></div><div class="res-grid">${RESOURCES.map(r=>`<div class="res-card"><h3>${r.name}</h3><p>${r.summary}</p><a class="res-link" href="${r.url}" target="_blank" rel="noreferrer"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Open file</a></div>`).join("")}</div>`;}
function renderAdmin(){if(currentUserData.role!=="admin"){switchView("dashboard");return;}const rows=Object.entries(USERS).map(([un,u])=>{const mods=u.modules.includes("all")?"All":u.modules.filter(m=>m!=="all-readonly").map(id=>MODULES[id]?.name||id).join(", ");return`<tr><td><span class="status-dot dot-green"></span>${un}</td><td>${u.name}</td><td>${u.dept}</td><td>${u.role==="admin"?"Admin":"Super User"}</td><td style="font-size:11px">${mods}</td></tr>`;}).join("");const prows=Object.entries(USERS).filter(([,u])=>u.superuser===true).map(([un,u])=>{const mm=u.modules.includes("all")?Object.values(MODULES):u.modules.filter(m=>m!=="all-readonly").map(id=>MODULES[id]).filter(Boolean);const ms=mm.flatMap(m=>m.sessions);const ps=ms.filter(s=>(ST[`quiz-score-${s.id}`]||0)>=70).length;const pct=ms.length?Math.round(ps/ms.length*100):0;return`<tr><td>${u.name}</td><td>${u.dept}</td><td>${ps} / ${ms.length}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="prog-track" style="width:80px"><div class="prog-fill" style="width:${pct}%"></div></div><span style="font-size:12px;color:var(--muted)">${pct}%</span></div></td></tr>`;}).join("");document.getElementById("view-admin").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Admin only</div><h2>Admin Panel</h2></div></div>

<div class="guide-section">
<h3>How to Run a Training Session (Step by Step)</h3>
<ul class="guide-step-list">
<li><div class="guide-step-num">1</div><div><strong>Open the portal together</strong> — have the Super User log in to the portal on their own computer. You log in as admin on yours so you can see their progress.</div></li>
<li><div class="guide-step-num">2</div><div><strong>Navigate to the session</strong> — Super User clicks Modules → opens their module → selects the session. Review the session title and duration together.</div></li>
<li><div class="guide-step-num">3</div><div><strong>Watch the video first</strong> — click Watch Recording. Watch the full CRP video together. Don't skip it — the video shows the exact scenario they need to learn.</div></li>
<li><div class="guide-step-num">4</div><div><strong>Walk through the steps in M3 test</strong> — open M3 test environment side by side. Go through each numbered step on the portal, doing it live in M3. You narrate; they type.</div></li>
<li><div class="guide-step-num">5</div><div><strong>Super User does it solo</strong> — reset or start a new record and have them repeat the workflow start to finish without guidance. Only intervene if they are stuck for more than 60 seconds.</div></li>
<li><div class="guide-step-num">6</div><div><strong>Take the quiz</strong> — have them answer all questions on their own. Do not hint. Submit and review the results together. If they score below 70%, walk through the missed questions and have them retake it.</div></li>
<li><div class="guide-step-num">7</div><div><strong>Complete the checklist</strong> — go through the session checklist together. Check off each item they demonstrated. Items not yet checked = topics to revisit next session.</div></li>
<li><div class="guide-step-num">8</div><div><strong>Add notes</strong> — have the Super User type their key takeaways and any Adleta-specific tips into the My Notes box. These notes will be there when they train their dept.</div></li>
</ul>
<div class="guide-tip"><strong>💡 Tip:</strong> Cover 2–3 sessions per sitting. Back-to-back sessions on related topics (e.g., all 3 AP payment sessions in one afternoon) build context faster than spreading them out.</div>
</div>

<div class="guide-section">
<h3>After Super User Certification — Dept Training Handoff</h3>
<ul class="guide-step-list">
<li><div class="guide-step-num">1</div><div><strong>Confirm the Super User can teach it</strong> — before handoff, ask them to walk YOU through one session as if you were a new employee. If they can explain it clearly, they are ready.</div></li>
<li><div class="guide-step-num">2</div><div><strong>Set up dept user portal accounts</strong> — department employees are already in the portal. Give the Super User the list of usernames and passwords for their team (from the User Accounts table above).</div></li>
<li><div class="guide-step-num">3</div><div><strong>Super User schedules dept sessions</strong> — they should plan group sessions of 4–6 people. Longer team = more sessions needed. Suggest 1–1.5 hours per session for dept users.</div></li>
<li><div class="guide-step-num">4</div><div><strong>Same flow applies for dept training</strong> — Super User uses the portal the same way you used it with them: watch video → walk through steps in M3 test → employees do it solo → quiz → checklist.</div></li>
<li><div class="guide-step-num">5</div><div><strong>Track dept progress in the Team view</strong> — you can monitor each Super User's department from the Teams tab. Super Users can update training status for their people as they complete sessions.</div></li>
<li><div class="guide-step-num">6</div><div><strong>You are the escalation point</strong> — if a Super User or their dept encounters a scenario not covered in training, they come to you. Log it as a gap and add to the portal if it keeps coming up.</div></li>
</ul>
</div>

<li><div class="guide-step-num">✓</div><div><strong>Before teaching a department:</strong> complete observed scenarios and a scored teach-back, then obtain functional-owner and IT sign-off.</div></li>
<li><div class="guide-step-num">✓</div><div><strong>No time limit</strong> on quizzes — this is not a test, it is a learning tool. Encourage them to reference the steps while answering.</div></li>
</ul>
</div>

function renderTeam(){
  const isAdmin=currentUserData.role==="admin";
  const suMap=Object.entries(USERS).filter(([,u])=>u.superuser===true).map(([un,u])=>({un,name:u.name,dept:u.dept,color:u.color,users:DEPT_USERS[un]||[]}));
  let teamsToShow=isAdmin?suMap:suMap.filter(s=>s.un===currentUser);
  if(!isAdmin&&teamsToShow.length===0){document.getElementById("view-team").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">Department Users</div><h2>My Team</h2></div></div><div class="card"><p style="color:var(--muted)">No team roster found for your account. Contact KRISTENB.</p></div>`;return;}
  const title=isAdmin?"All Department Teams":"My Team";
  const eyebrow=isAdmin?"All departments":"Your training group";
  const totalUsers=teamsToShow.reduce((a,s)=>a+s.users.length,0);
  const html=teamsToShow.map(s=>{
    const ini=s.name.split(" ").map(n=>n[0]).join("").substring(0,2);
    const statusColors={trained:"#1a7a6d",inprogress:"#c49a2a","not-started":"var(--muted)"};
    const statusLabels={trained:"✓ Trained",inprogress:"In Progress","not-started":"Not Started"};
    const rows=s.users.map((u,i)=>{const key=`team-status-${s.un}-${u.email}`;const cur=ST[key]||"not-started";const color=statusColors[cur];return`<tr style="background:${i%2===0?"var(--surface2)":"var(--surface)"}"><td style="padding:8px 12px;font-size:13px;font-weight:600">${u.first} ${u.last}</td><td style="padding:8px 12px;font-size:13px;color:var(--body)">${u.title}</td><td style="padding:8px 12px;font-size:12px;color:var(--muted)">${u.email}</td><td style="padding:8px 12px"><select style="font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);color:${color};font-weight:600;cursor:pointer" onchange="saveTeamStatus('${s.un}','${u.email}',this.value,this)"><option value="not-started" ${cur==="not-started"?"selected":""}>Not Started</option><option value="inprogress" ${cur==="inprogress"?"selected":""}>In Progress</option><option value="trained" ${cur==="trained"?"selected":""}>✓ Trained</option></select></td></tr>`;}).join("");
    const trainedCount=s.users.filter(u=>(ST[`team-status-${s.un}-${u.email}`]||"not-started")==="trained").length;
    return`<div class="card" style="margin-bottom:16px"><div class="card-title"><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:${s.color};display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0">${ini}</div><div><div style="font-size:15px;font-weight:700">${s.name}</div><div style="font-size:12px;color:var(--muted);font-weight:400">${s.dept}</div></div></div><div style="display:flex;gap:8px"><span class="pill pill-teal">${trainedCount}/${s.users.length} trained</span></div></div><table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:2px solid var(--line)"><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Name</th><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Job Title</th><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Email</th><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600">Training Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");
  document.getElementById("view-team").innerHTML=`<div class="sec-hd"><div><div class="sec-eyebrow">${eyebrow}</div><h2>${title}</h2></div><span class="pill pill-teal">${totalUsers} total users</span></div>${html}`;
}
