 not match the Adleta term you expected","a":"Use the Terminology Crosswalk in the Foundation Learning Guide as your reference. If something is missing, flag it for Kristen to add."},{"q":"A team member uses the wrong program and enters data in the wrong place","a":"Caught early: delete the incorrect entry and re-enter in the correct program. Caught after posting: escalate to the module owner - do not attempt to fix it yourself."},{"q":"Warehouse 500 does not appear in stock balance","a":"Warehouse 500 may not carry that item. An empty result is correct - it means no stock, not an error."}]},"fnd-4":{"obj":"Demonstrate all foundation skills without assistance to confirm readiness for module training.","scn":"Kristen will call out tasks one at a time. Complete each one in M3 without referring to notes. This is your certification check for the Foundation module.","tasks":[{"n":"Navigation check","s":["Open PPS200 with Ctrl+S, without the menu.","Open MMS200 and sort the item list by description.","Use right-click Related to open Balance Identity (MWS068) from MMS200."]},{"n":"Lookup check","s":["Find supplier S900400 in CRS620 and confirm their payment terms.","Find customer 000382 in CRS610 and confirm their credit limit (panel J).","Look up item ARM51830031 and confirm its stock in warehouse CAR."]},{"n":"Terminology check","s":["State the M3 term for: Purchase Order, Vendor, Warehouse, Item Master, Customer.","State the M3 program for: entering a sales order (OIS100), receiving goods (PPS300), viewing stock by lot and location (MWS068).","Explain the difference between Escape and closing a panel to the trainer."]}],"out":["You passed the Foundation check and are cleared for module training.","You can navigate M3 and locate records without assistance.","Your trainer has signed off on your Foundation readiness checklist."],"exc":[{"q":"You cannot complete a task during the certification check","a":"Tell Kristen immediately. Do not guess or skip - the certification check is pass/fail and you can reschedule."},{"q":"You complete a task but Kristen marks it incorrect","a":"Ask Kristen to walk through the correct steps with you before the next attempt. Take notes."},{"q":"M3 is slow or unresponsive during the check","a":"Notify Kristen. The check can be paused and rescheduled - a slow system is not a failure."},{"q":"You pass navigation but struggle with terminology","a":"You can be cleared for module training and revisit terminology as needed. Flag the gaps to Kristen so she can reinforce them in module sessions."}]},"pur-1":{"obj":"Open PPS170 and release a planned purchase order generated by MRP into a confirmed PO.","scn":"MRP has generated planned orders for supplier AHF PRODUCTS (S900400) assigned to buyer ABURK. Open PPS170, review the planned order, and release it to a firm PO.","tasks":[{"n":"Open PPS170","s":["Press Ctrl+S to open Search and Start.","Type PPS170 and select Planned Purchase Order. Open. Click OK.","PPS170 opens showing a list sorted by Buyer, Supplier, PO type, and release date.<img class=\"ex-shot\" src=\"images/m3/pps170.jpg\" alt=\"PPS170 planned purchase orders\" loading=\"lazy\" onclick=\"openShot(this)\">"]},{"n":"Review the planned orders in the list","s":["The list columns are: Buyer, Supplier, Supplier name, Otp (order type), Rel dt (release date), Plan qty, Net price.","Use the Filter Options to narrow by Fac (facility = CAR) or Stat (status) if needed, then click Apply.","Locate a line for buyer ABURK and supplier S900400 (AHF PRODUCTS).","Review the planned quantity, release date, and order type before releasing."]},{"n":"Release the planned order","s":["Right-click the planned order line and review the available options.","Select the release action to convert the planned order to a firm PO.","M3 creates a PO in PPS200 and assigns a PO number (PO numbers look like 933253)."]},{"n":"Verify the new PO in PPS200","s":["Press Ctrl+S, type PPS200, and open Purchase Order. Open.<img class=\"ex-shot\" src=\"images/m3/pps200.jpg\" alt=\"PPS200 purchase order list\" loading=\"lazy\" onclick=\"openShot(this)\">","Find the new PO - it will show supplier S900400, buyer ABURK, order type B01, and warehouse CAR.","Confirm the status and quantity match what was on the planned order."]}],"out":["Planned order released and a new PO appears in PPS200.","PO linked to supplier S900400 (AHF PRODUCTS) with correct item and quantity.","MRP no longer shows the planned order - it is now a firm PO."],"exc":[{"q":"No planned orders appear in PPS170","a":"PPS170 shows orders for your buyer code. If the list is empty, MRP may not have generated orders yet or the buyer code filter is set to a different buyer. Check with Alan Burk."},{"q":"The planned order quantity looks incorrect","a":"Do not release it. Right-click and open the order detail to review the MRP parameters. Flag the issue to Alan Burk before releasing."},{"q":"The supplier on the planned order is not the expected supplier","a":"MRP assigns the preferred supplier. Confirm with Alan Burk whether to release as-is or change the supplier before releasing."},{"q":"The new PO does not appear in PPS200 after releasing","a":"Allow a minute for M3 to update. If it still does not appear, return to PPS170 to confirm the release completed without an error message."}]},"pur-2":{"obj":"Create a manual non-stock purchase order in PPS200 for a one-time exception item.","scn":"A project needs a non-stocked item that will not go through MRP. Create a manual PO in PPS200 for supplier AHF PRODUCTS (S900400), warehouse CAR.","tasks":[{"n":"Open PPS200 and start a new PO","s":["Press Ctrl+S, type PPS200, and open Purchase Order. Open.<img class=\"ex-shot\" src=\"images/m3/pps200.jpg\" alt=\"PPS200 purchase order list\" loading=\"lazy\" onclick=\"openShot(this)\">","Click the + (New) button in the toolbar to open a new PO header.","Enter Supplier = S900400. M3 auto-fills the supplier name (AHF PRODUCTS) and default payment terms."]},{"n":"Enter the PO header details","s":["Confirm Order type = B01 or select the appropriate order type for this purchase.","Set Warehouse = CAR (Carrollton).","Enter the requested delivery date.","Save the header - M3 assigns a PO number in the format like 933253."]},{"n":"Add the order line","s":["On the order lines panel, enter the item number (e.g., ARM51899031 or the correct item for this purchase).","Enter the quantity and confirm the unit of measure (CT = cartons for most flooring items).","Verify the unit price against the supplier quote - adjust if no price list entry exists.","Save the line."]}],"out":["Manual PO created in PPS200 with a system-assigned PO number.","PO linked to supplier S900400, warehouse CAR, order type B01.","Order line shows correct item, quantity, and price - ready for receiving."],"exc":[{"q":"Supplier S900400 does not appear when you search","a":"Search by the supplier number S900400, not by name. If it still does not appear, the supplier may be inactive - check status in CRS620 (should show 20-Approved)."},{"q":"The order type B01 is not available","a":"Contact Alan Burk or IT. The order type must be active and assigned to your user role before it will appear."},{"q":"No price pulls from the price list for the item","a":"Enter the agreed price manually and note the source in the PO line reference field. Ask Alan Burk to set up the price list entry so future orders price automatically."},{"q":"You save the PO but cannot find it in PPS200 afterward","a":"Filter PPS200 by your buyer code (ABURK) or search by the PO number M3 assigned. Check that you are in company 100 (CMP100)."}]},"pur-3":{"obj":"Receive goods against a confirmed PO in PPS300 and confirm the receipt details.","scn":"AHF PRODUCTS has delivered cartons of tile against an open PO. Open PPS300, enter the received quantities, and post the receipt.","tasks":[{"n":"Open PPS300 and locate the PO","s":["Press Ctrl+S, type PPS300, and open Purchase Order. Receive Goods.<img class=\"ex-shot\" src=\"images/m3/pps300.jpg\" alt=\"PPS300 receive goods\" loading=\"lazy\" onclick=\"openShot(this)\">","In the filter area, enter the PO number in the PO number field.","Confirm Warehouse = CAR (Carrollton) is already populated - this defaults to your warehouse.","Click Apply to display the PO lines."]},{"n":"Review PO lines before receiving","s":["The list shows columns: Ln (line), Sub, Item number, PO item name, Remain (remaining qty to receive), Recved qty, Com (complete), Location.","Confirm the item number and PO item name match the physical delivery.","Check the Remain column - this is the outstanding quantity not yet received.","Verify the delivery note from AHF PRODUCTS matches the items and quantities shown."]},{"n":"Enter received quantity and post","s":["Select the PO line and enter the quantity actually received in the Recved qty field.","Enter the delivery note number from the AHF PRODUCTS packing slip.","If the delivery is complete, confirm the Com (complete) flag.","Post the receipt - M3 updates inventory in warehouse CAR and creates the receipt transaction."]}],"out":["Goods receipt posted against the PO in PPS300.","Inventory in warehouse CAR increases by the received quantity.","Receipt transaction created and the PO line Remain quantity decreases."],"exc":[{"q":"PPS300 shows no lines after entering the PO number","a":"Confirm the PO exists in PPS200 and has a status that allows receiving (not status 90 cancelled). Also confirm the warehouse filter shows CAR."},{"q":"The received quantity is less than the PO quantity","a":"Enter only what physically arrived. The Remain quantity stays open for the balance - do not mark the line complete. Follow up with AHF PRODUCTS on the short delivery."},{"q":"The item on the delivery does not match the PO item name","a":"Do not receive it. Stop and contact AHF PRODUCTS to confirm what was shipped. If it is the wrong item, reject the delivery."},{"q":"PPS300 shows the receipt posted but inventory in CAR did not increase","a":"Allow a few minutes for M3 to update. If inventory still does not reflect the receipt after 5 minutes, contact IT with the receipt transaction number."}]},"pur-4":{"obj":"Create a manual PO in PPS200 for a stocking item when MRP has not generated a planned order.","scn":"A stocking item from AHF PRODUCTS (S900400) is running low and MRP has not reordered. Create a manual PO in PPS200.","tasks":[{"n":"Verify the supplier and item in M3 before creating the PO","s":["Open CRS620 (Supplier. Open) and search for S900400.","Confirm the supplier status shows 20-Approved and review payment terms.","Note the buyer assigned to AHF PRODUCTS (ABURK) - this should match Alan Burk."]},{"n":"Create the PO header in PPS200","s":["Open PPS200 and click the + (New) button.","Enter Supplier = S900400. Confirm M3 auto-fills AHF PRODUCTS.","Set Order type = B01, Warehouse = CAR, and the required delivery date.","Save the header and note the PO number assigned."]},{"n":"Add the stocking item line","s":["On the order lines, look up the item using the item search field.","Enter the quantity needed and confirm unit of measure (CT for cartons).","Verify the price pulls from the AHF PRODUCTS price list.","Save the line and confirm the PO total looks correct."]}],"out":["Manual stocking PO created in PPS200 with a system-assigned PO number.","PO linked to S900400 (AHF PRODUCTS), warehouse CAR.","Item and quantity correct - PO ready for receiving when goods arrive."],"exc":[{"q":"MRP did not generate a planned order for a stocking item","a":"This should be investigated - do not just create manual POs repeatedly. Check the item planning parameters with Alan Burk. Safety stock, lead time, or reorder point may not be configured."},{"q":"The item does not appear in the item search on the PO line","a":"Confirm the item status is active in MMS001. An inactive or discontinued item will not appear on PO lines."},{"q":"The price on the PO line does not match the current AHF PRODUCTS quote","a":"Enter the correct price manually and note the source. Ask Alan Burk to update the price list in M3 so it pulls correctly next time."},{"q":"You create the PO but Alan Burk says it was already ordered","a":"Check PPS200 first before creating manual POs. Search for open POs for supplier S900400 to confirm one does not already exist."}]},"pur-5":{"obj":"Manage an existing PO in PPS200 - cancel a line, add a delivery note, and review PO status.","scn":"An open PO with supplier S900400 (AHF PRODUCTS) needs one line cancelled and a delivery instruction note added.","tasks":[{"n":"Find the PO in PPS200","s":["Open PPS200 and search for the PO by PO number or filter by supplier S900400 and buyer ABURK.","Click the PO number to open PPS201 (Purchase Order. Open Lines) and review the line detail.","Identify the line to be cancelled and confirm its current status."]},{"n":"Cancel the PO line","s":["In PPS201, right-click the line to be cancelled.","Review the available status change options.","Select the cancel or close action - confirm M3 updates the line status.","Note: A line that already has a receipt posted cannot be cancelled directly."]},{"n":"Add a note to the PO","s":["From the PO header, navigate to the Text or Notes option (check Actions or Options menu).","Enter the delivery instruction note (e.g., Deliver to dock B - call ahead on 972-555-0100).","Set the note type as appropriate (internal vs. external - external notes print on the PO).","Save the note and confirm it is linked to the PO."]}],"out":["Selected PO line status updated to cancelled.","Delivery note saved and linked to the PO header.","Remaining PO lines are unchanged."],"exc":[{"q":"M3 will not let you cancel the PO line","a":"The line may already have a receipt posted against it . A received line cannot be cancelled directly - contact Philip Jones."},{"q":"The note type options are not clear","a":"An Internal note is visible only in M3. An External note prints on the PO confirmation sent to AHF PRODUCTS. Use External for supplier delivery instructions."},{"q":"You cancel the wrong line by mistake","a":"If the cancellation can be reversed, do so immediately. If not, you will need to add a new line with the correct item and quantity. Notify Alan Burk."},{"q":"The PO shows a status you have not seen before","a":"Don't change a status you're unsure about. Ask Alan Burk."}]},"pur-6":{"obj":"Look up a supplier record in CRS620 and confirm the key fields used on purchase orders.","scn":"Before creating a PO for a new supplier, verify their record in CRS620. Then confirm the same information pulls correctly to a PO in PPS200.","tasks":[{"n":"Open CRS620 and review the supplier record","s":["Press Ctrl+S, type CRS620, and open Supplier. Open.","The list shows: Supplier number, Supplier name, Telephone no 1, Sts (status), Sgr (supplier group), Sta (state).","Search for supplier S900400 by entering it in the Supplier filter field.<img class=\"ex-shot\" src=\"images/m3/crs620.jpg\" alt=\"CRS620 supplier list\" loading=\"lazy\" onclick=\"openShot(this)\">","Confirm Sts = 20-Approved. A supplier that is not 20-Approved cannot be used on new POs."]},{"n":"Review purchase and financial settings in CRS624","s":["From CRS620, right-click S900400 and navigate to the purchase and financial settings (CRS624).","Confirm the buyer assigned to this supplier (should show ABURK for AHF PRODUCTS).","Review payment terms and any other purchasing defaults.","Note any supplier-specific settings that affect PO creation."]},{"n":"Confirm supplier data pulls to a PO","s":["Open PPS200 and click New to start a new PO.","Enter Supplier = S900400 and confirm M3 auto-fills: supplier name (AHF PRODUCTS), payment terms, and buyer (ABURK).","Do not save this test PO - press Escape to cancel without saving.","Confirm the auto-filled values match what you saw in CRS620 and CRS624."]}],"out":["Supplier S900400 confirmed as 20-Approved in CRS620.","Buyer ABURK and payment terms confirmed in CRS624.","PO creation auto-fills supplier data correctly from the supplier master."],"exc":[{"q":"The supplier shows a status other than 20-Approved","a":"Do not create a PO for an inactive or unapproved supplier. Contact Finance (Philip Jones) to reactivate. Do NOT create a new supplier record yourself."},{"q":"The buyer assigned in CRS624 is wrong","a":"The buyer on the supplier master controls which buyer sees planned orders in PPS170. Contact Alan Burk to have the buyer assignment corrected in CRS624."},{"q":"You need a supplier that is not in CRS620 at all","a":"New suppliers must be set up by Finance before any PO can be created. Provide the supplier name, address, and payment terms to Philip Jones and wait for the setup to be completed."},{"q":"The supplier data on the PO does not match what is in CRS620","a":"The PO pulls data at the time of creation. If the supplier master was updated after the PO was created, the PO header may need to be manually corrected."}]},"pur-7":{"obj":"Record a supplier's shipping notice before the goods arrive.","scn":"AHF PRODUCTS (S900400) has emailed a shipping notice for a PO in transit to Carrollton. Record it so receiving is ready.","tasks":[{"n":"Find the PO","s":["Press Ctrl+S, type PPS220, and click OK.","Filter supplier S900400 and find the open PO lines the notice covers."]},{"n":"Record the delivery note","s":["Press Ctrl+S, type PPS260, and click OK.","Connect the supplier's delivery note number to the PO.","Enter the quantities and lots on the notice.","Save."]},{"n":"Check it is waiting","s":["Open PPS360 and confirm the delivery note shows as waiting to be received.","Confirm on-hand in MWS068 has NOT changed. Stock changes only at receipt in PPS300."]}],"out":["Delivery note connected to the PO.","Shipment visible as waiting in PPS360.","No stock change until receipt."],"exc":[{"q":"The notice quantity doesn't match the PO","a":"Record what the notice says and flag the difference to Alan before the truck arrives."},{"q":"The screens don't match these steps","a":"These program names come from training videos. Note what you see and tell your trainer."}]},"pur-8":{"obj":"Understand the full purchasing cycle in M3 from planned order to received goods.","scn":"Walk through the complete purchasing cycle for a replenishment order: from MRP planned order in PPS170, to PO in PPS200, to receipt in PPS300.","tasks":[{"n":"Trace the cycle: PPS170 to PPS200","s":["Open PPS170 and identify a planned order for buyer ABURK and supplier S900400.","Note the Plan qty, Rel dt (release date), and Otp (order type = B01).","Open PPS200 and find an existing PO for S900400 with buyer ABURK - this is what a released planned order becomes.","Compare the statuses on the planned order and the PO. Write down what each status number reads on screen. We are still confirming what each one means at Adleta."]},{"n":"Review a PO in detail","s":["In PPS200, click a PO number to open PPS201 (Purchase Order. Open Lines).","Review the line detail: Line number, Status (Lst), Warehouse (CAR), Item number (e.g., ARM51899031), Order qty, U/M (CT = cartons).","Scroll right to see additional fields - each column represents a key piece of the order."]},{"n":"Trace the cycle: PPS200 to PPS300","s":["Open PPS300 and enter the PO number of a PO that has been received.","Review Recved qty: what has already been received.","Compare Remain vs Recved qty. If Remain = 0, the PO line was fully received.","Once received, AP can match the supplier invoice in APS100."]}],"out":["You can trace a replenishment order from plan to receipt.","You know which program handles each stage: PPS170, PPS200, PPS250, PPS300.","You wrote down the status numbers you saw for confirmation."],"exc":[{"q":"A PO is stuck at a status and not advancing","a":"Status does not advance automatically in all cases. Some transitions require an action (e.g., a receipt must be posted to advance to status 50). Identify which step is missing."},{"q":"PPS170 shows planned orders but none are releasing to PPS200","a":"Planned orders require a manual release action. They do not auto-release. Alan Burk or the buyer must review and release each one in PPS170."},{"q":"The PO status in PPS200 does not match what the warehouse says happened","a":"PPS200 status reflects M3 transactions only. If goods were received physically but no receipt was posted in PPS300, the status will not match. The warehouse team must post the receipt in M3."}]},"inv-1":{"obj":"Check the on-hand stock balance for an item in a specific warehouse in M3.","scn":"A customer asks if you have stock of item ARM51830031 (IMPERIAL TEXTURE 1/8 INCH TILE) available in the Carrollton warehouse. Look up the balance in MMS200.","tasks":[{"n":"Open MMS200 and filter by warehouse","s":["Press Ctrl+S, type MMS200, and open Item. Open Toolbox.<img class=\"ex-shot\" src=\"images/m3/mms200.jpg\" alt=\"MMS200 item toolbox filtered on CAR\" loading=\"lazy\" onclick=\"openShot(this)\">","In the Filter Options, set Warehouse = CAR (Carrollton).","In the Item number filter field, type ARM51830031.","Click Apply to filter the list."]},{"n":"View the stock balance","s":["ARM51830031 (IMPERIAL TEXTURE 1/8 INCH TILE) appears in the list with item type VCT and status 20.","Right-click the row and select Related > Balance Identity to open MWS068.<img class=\"ex-shot\" src=\"images/m3/mws068.jpg\" alt=\"MWS068 stock by location and lot\" loading=\"lazy\" onclick=\"openShot(this)\">","MWS068 shows the on-hand balance by location - note Location = CARE34V and On-hand approve = 24.","This tells you there are 24 units on hand at location CARE34V in the CAR warehouse."]},{"n":"Interpret the balance","s":["On-hand approve = 24 means 24 units are approved and available.","The Lot number field shows P236C - this is the lot the stock is assigned to.","If the quantity is sufficient for the customer order, proceed to enter the order in OIS300.","If stock is low, check Availability All Warehouses (Related > Availability All Warehouses) to see other locations."]}],"out":["Stock balance checked in MMS200 for item ARM51830031.","Location CARE34V confirmed with 24 units on hand.","Availability confirmed before entering customer order."]},"inv-2":{"obj":"Trace a stock movement for a roll that can't be found.","scn":"MWS068 shows 24 of ARM51830031 at CARE34V, lot P236C, but the counter can only find 22. Trace what happened before anyone adjusts stock.","tasks":[{"n":"Confirm the book balance","s":["Press Ctrl+S, type MWS068, and click OK.","Filter item ARM51830031, warehouse CAR.","Note location CARE34V, lot P236C, and the on-hand quantity."]},{"n":"Read the history","s":["Press Ctrl+S, type MWS070, and click OK.","Filter item ARM51830031 and warehouse CAR.<img class=\"ex-shot\" src=\"images/m3/mws070.jpg\" alt=\"MWS070 stock transaction history\" loading=\"lazy\" onclick=\"openShot(this)\">","Find the most recent movements for CARE34V: picks, receipts, moves. Note date and user."]},{"n":"Decide and log","s":["If a pick or move explains the difference, follow up with whoever did it.","If nothing explains it, log the discrepancy (item, location, lot, M3 qty, physical qty) and hand it to inventory control for a count correction (inv-3)."]}],"out":["Book balance confirmed in MWS068.","Recent movements reviewed in MWS070.","Discrepancy explained or logged, not covered up."],"exc":[]},"inv-3":{"obj":"Perform a physical inventory count and enter the count result in M3.","scn":"A cycle count is being performed at CAR warehouse, location CARE34V. The physical count for item ARM51830031 shows 22 units. Enter the count in M3 and review the variance.","tasks":[{"n":"Check the current book balance","s":["Open MMS200, set Warehouse = CAR, filter Item number = ARM51830031, click Apply.","Right-click ARM51830031 and select Related > Balance Identity (MWS068).","Confirm current On-hand approve = 24 at location CARE34V, lot P236C.","Note this as your book quantity before the count."]},{"n":"Enter the counted quantity","s":["Press Ctrl+S, type MMS310, and click OK.<img class=\"ex-shot\" src=\"images/m3/mms310.jpg\" alt=\"MMS310 physical inventory quick entry\" loading=\"lazy\" onclick=\"openShot(this)\">","Enter warehouse CAR, item ARM51830031, location CARE34V, lot P236C.","Enter the counted quantity = 22.","Check the difference shown (24 book vs 22 counted = -2) before confirming."]},{"n":"Review the variance and approve","s":["Confirm the entry only after the difference is approved.","M3 adjusts on hand to 22 at CARE34V.","Return to MWS068 to confirm the balance, and MWS070 to see the adjustment transaction."]}],"out":["Count correction entered in MMS310 for ARM51830031 at CARE34V.","Difference of -2 reviewed and approved.","Balance confirmed in MWS068."]},"inv-4":{"obj":"Move stock from Carrollton to Little Rock.","scn":"Little Rock needs 10 CT of ARM51830031 from Carrollton (CAR). Create the transfer.","tasks":[{"n":"Check stock","s":["Press Ctrl+S, type MMS002, and click OK.","Check ARM51830031 at CAR has at least 10 available."]},{"n":"Create the distribution order","s":["Press Ctrl+S, type MMS100, and click OK.<img class=\"ex-shot\" src=\"images/m3/mms100.jpg\" alt=\"MMS100 distribution orders\" loading=\"lazy\" onclick=\"openShot(this)\">","Click + (New). From warehouse CAR, to warehouse Little Rock (ask your trainer for the code).","Enter the date needed and save. Note the order number.","In MMS101 add item ARM51830031, quantity 10. Save."]},{"n":"Follow it","s":["Open MWS410 at CAR and find the delivery for the distribution order.","Note its status and tell your trainer it's ready for the warehouse."]}],"out":["Distribution order created with the line.","Delivery visible in MWS410 at CAR."],"exc":[{"q":"The to warehouse code isn't accepted","a":"Ask your trainer for the exact Little Rock warehouse code in M3."}]},"ord-1":{"obj":"Enter a standard customer sales order in M3 using order type C01.","scn":"Customer 000382 (AAA EXPRESS WATER AND FIRE RES) calls in an order for 5 CT of item ARM51830031 (IMPERIAL TEXTURE 1/8 INCH TILE). Enter the order.","tasks":[{"n":"Open OIS100 and find the customer","s":["Press Ctrl+S to open Search and Start. Type OIS100, select Customer Order. Open from the list, and click OK.<img class=\"ex-shot\" src=\"images/cs/01-search-and-start.png\" alt=\"Search and Start with OIS100\" loading=\"lazy\" onclick=\"openShot(this)\">","The Account Search box pops up. Type 000382 and press Tab (you can also search by name, city, or phone). Click the customer.<img class=\"ex-shot\" src=\"images/cs/02-account-search.png\" alt=\"Account Search\" loading=\"lazy\" onclick=\"openShot(this)\">","Once the customer is found, the header fills in automatically: Customer, Payer, CO type C01, Req delivery dt, and Facility 101. Review it.<img class=\"ex-shot\" src=\"images/cs/03-order-header.png\" alt=\"Enter Customer Order header\" loading=\"lazy\" onclick=\"openShot(this)\">","Need a different delivery date? Click the calendar icon. The Delivery calendar shows the customer's route, delivery days, and the 3:00 PM cutoff the day before. Pick a delivery day and click Close.<img class=\"ex-shot\" src=\"images/cs/04-delivery-calendar.png\" alt=\"Delivery calendar\" loading=\"lazy\" onclick=\"openShot(this)\">","Click Next."]},{"n":"Fill in Order Details (OIS100/I)","s":["Check the defaults: Warehouse CAR, Priority 5-Norm, Payment terms N30, Delivery method OT (Our Truck).<img class=\"ex-shot\" src=\"images/cs/05-order-details.png\" alt=\"Order Details\" loading=\"lazy\" onclick=\"openShot(this)\">","In Customer's ord, enter the customer's PO number. This field is required.<img class=\"ex-shot\" src=\"images/cs/06-customers-ord-alert.png\" alt=\"Customer's order number alert\" loading=\"lazy\" onclick=\"openShot(this)\">","Click Next."]},{"n":"Enter the order line (OIS101)","s":["Use the entry row under the grid. Whs defaults to CAR, Ln tp stays 0, and Req dt carries over from the header.<img class=\"ex-shot\" src=\"images/cs/07-order-lines.png\" alt=\"Order Lines\" loading=\"lazy\" onclick=\"openShot(this)\">","Enter Item ARM51830031. Don't know the item number? Open Item search, type part of the number or name, and click Search. Check the CAR column for stock (green means available), then click Pick stock.<img class=\"ex-shot\" src=\"images/cs/08-item-search.png\" alt=\"Item search\" loading=\"lazy\" onclick=\"openShot(this)\">","Enter Order qty 5 and confirm U/M = CT. Sales price fills in from the customer price list.","Click Add. The line saves right away. There is no separate Save button. The line drops into the grid and the Running Total updates.","Note the CO no (order number) for follow-up."]},{"n":"Verify the order in OIS300","s":["Press Ctrl+S to open Search and Start. Type OIS300, select it from the list, and click OK.","In the Customer filter, type 000382 and press Enter.","Find your CO no. Lst (lowest status) and Hi (highest status) should both read 33-ALLOCATED. That means the stock is reserved and the order is ready for the warehouse.<img class=\"ex-shot\" src=\"images/cs/09-ois300-status.png\" alt=\"OIS300 order status\" loading=\"lazy\" onclick=\"openShot(this)\">","If your order shows 20-Line Not Entered, the header was saved with no lines. Click the CO no to open it and add the lines, or tell your trainer so it can be deleted.","Next stop is the warehouse. A 33-ALLOCATED order sits in MWS410 (Delivery. Open Toolbox) showing 0-Release until its pick list is released. Once released, OIS300 shows 44-PICK RELEASED."]}],"out":["Sales order created in M3 with CO type C01.","Customer PO entered in Customer's ord.","Order line entered with correct item, quantity, and price.","Order shows 33-ALLOCATED in OIS300 and is waiting in MWS410 for pick release.","CO number noted for follow-up."],"exc":[{"q":"Alert: Customer's order number must be entered","a":"Click OK, enter the customer's PO in Customer's ord on the Order Details screen, then click Next."},{"q":"OIS300 shows 20-Line Not Entered","a":"The order header exists but no lines were added. Open the CO and add the lines, or have your trainer delete the empty order."}]},"ord-2":{"obj":"Create a return/credit order in M3 for goods being sent back by a customer.","scn":"Customer 000382 (AAA EXPRESS WATER AND FIRE RES) is returning 2 CT of item ARM51830031 due to damage. Create a credit order using CO type C05.","tasks":[{"n":"Find the original order in OIS300","s":["Press Ctrl+S to open Search and Start, type OIS300, select it from the list, click OK, and search for customer 000382.","Locate the original order containing the item being returned.","Note the CO no of the original order."]},{"n":"Create the return order","s":["Click + (New) in OIS300. OIS100/A opens.","Enter Customer = 000382.","Enter CO type = C05 (Credit NoStkUpd).","Enter Req delivery dt = today.","Click Next."]},{"n":"Enter the return line and confirm","s":["In OIS101, enter Item = ARM51830031.","Enter Order qty = 2 (the quantity being returned).","Confirm U/M = CT.","In Your ref 1 on OIS100/I, enter the original CO no for reference.","Click Add and note the new credit order CO no."]}],"out":["Return order created with CO type C05.","Original order referenced on the credit order.","Credit CO number noted."]},"ord-3":{"obj":"Understand what happens when a customer order is stopped due to a credit limit in M3.","scn":"You enter an order for a customer who has exceeded their credit limit. M3 places a CO stop on the order. Learn what the stop looks like and who to contact.","tasks":[{"n":"Enter the order","s":["Press Ctrl+S to open Search and Start, type OIS300, select it from the list, click OK, and click + (New). OIS100/A opens.","Enter Customer = 000382, CO type = C01.","Enter Req delivery dt and click Next.","Add an order line in OIS101 and click Add."]},{"n":"Identify the credit stop","s":["Return to OIS100/I (Generic Panel) for the order.","Look at the CO stop field - a value of 3 means Credit limit stop.","A CO stop prevents the order from advancing to picking and shipping.","Do NOT release the stop without authorization from AR."]},{"n":"Escalate to AR","s":["Contact the AR team with the customer number, CO no, and order amount.","AR will review the account and either release the stop or ask the customer to pay.","Once released, the CO stop field will clear and the order can proceed.","Add a note in Your ref 1 with the date and who approved the release."]}],"out":["Credit stop identified on the order (CO stop = 3).","AR team contacted with order details.","Process for release understood."]},"ord-4":{"obj":"Enter a will call order for a customer picking up at the Carrollton counter.","scn":"Customer 000382 walks in and wants to pick up 3 CT of ARM51830031 today. Enter a will call order in OIS300 using CO type C01.","tasks":[{"n":"Create the will call order","s":["Press Ctrl+S to open Search and Start, type OIS300, select it from the list, click OK, and click + (New). OIS100/A opens.","Enter Customer = 000382.","Enter CO type = C01 (Bravo Normal/WC - WC stands for Will Call).","Enter Req delivery dt = today.","Click Next."]},{"n":"Set delivery method to will call (OIS100/I)","s":["On OIS100/I change Delivery method from OT (Our Truck) to WC (Will Call).","Confirm Warehouse = CAR.","Click Next."]},{"n":"Enter order line and notify warehouse","s":["In OIS101, enter Item = ARM51830031, Order qty = 3, confirm U/M = CT.","Click Add and note the CO no.","Notify the warehouse team so they can pick and stage the order for customer pickup.<img class=\"ex-shot\" src=\"images/m3/mws410.jpg\" alt=\"MWS410 delivery toolbox\" loading=\"lazy\" onclick=\"openShot(this)\">"]}],"out":["Will call order created with CO type C01.","Warehouse notified to pick and stage.","CO number given to customer."]},"ord-5":{"obj":"Enter a customer order where payment terms are different from the account default.","scn":"A customer wants to pay COD or with a credit card instead of their standard net terms. Enter the order and change the payment terms in OIS100/I.","tasks":[{"n":"Create the order header","s":["Press Ctrl+S to open Search and Start, type OIS300, select it from the list, click OK, and click + (New). OIS100/A opens.","Enter Customer number and CO type = C01.","Enter Req delivery dt and click Next."]},{"n":"Change payment terms (OIS100/I)","s":["On OIS100/I, find Payment terms (defaults from the customer, usually N30).","Click the search icon next to Payment terms to see the available terms.","For a pay-first order pick PCD (Prep Cash Desk). Ask first: changing terms at order entry isn't settled.","Note Payment mtd AR. It is a default only (most customers show CH1); it doesn't block anything.","Click Next."]},{"n":"Enter order line and confirm","s":["In OIS101, enter the item, quantity, and confirm U/M.","Click Add.","Note the CO no and communicate the updated payment terms to the customer.","Open MWS410 and find the delivery for your order. A PCD order should show stop C10 until the cash desk takes payment."]}],"out":["Order entered with non-standard payment terms.","C10 stop seen on the delivery in MWS410 for a pay-first term.","CO number recorded."]},"ord-6":{"obj":"Process a will call order pickup and verify the order closes correctly in M3.","scn":"A customer arrives to pick up their will call order. Confirm the order is ready, verify status, and understand how the order closes after pickup.","tasks":[{"n":"Look up the will call order in OIS300","s":["Press Ctrl+S to open Search and Start, type OIS300, select it from the list, click OK, and search by customer number or CO no.","Check the status. A paid will call order that has been released shows 44-PICK RELEASED. If it is still 33-ALLOCATED, check MWS410 for a C10 stop (payment not taken yet).","Confirm warehouse has the goods staged and ready."]},{"n":"Confirm pickup details","s":["Open the order in OIS100 and verify all lines are correct.","Confirm quantity, item, and any special handling notes.","If payment is due at pickup, confirm payment terms and collect payment before releasing goods."]},{"n":"Verify order closes after pickup","s":["After warehouse processes the will call pickup, check OIS300 for the order.","Check the status advances after the warehouse reports the pick and issues the delivery. Confirm with your trainer which final status to expect.","Verify the transaction posts correctly in AR."]}],"out":["Will call order confirmed released (44) or held for payment (C10).","Payment taken at the cash desk before release.","Order status followed through pickup."]},"ord-7":{"obj":"Create a quotation in M3 and convert it to a confirmed sales order when the customer accepts.","scn":"Customer 000382 requests a price quote for 10 CT of ARM51830031. Create a quotation using CO type C04. When the customer accepts, convert it to a live order.","tasks":[{"n":"Create the quotation","s":["Press Ctrl+S to open Search and Start, type OIS300, select it from the list, click OK, and click + (New). OIS100/A opens.","Enter Customer = 000382.","Enter CO type = C04 (Quotation).","Enter Req delivery dt and click Next.","In OIS101, enter Item = ARM51830031, Order qty = 10, U/M = CT.","Click Add and note the CO no (quote number)."]},{"n":"Review the quote with the customer","s":["Locate the quote in OIS300 by filtering CO type = C04.","Review all lines - confirm quantities and pricing are correct.","Communicate the quote details and pricing to the customer."]},{"n":"Convert the quote to a sales order","s":["When the customer accepts, open the quote in OIS100.","Go to Actions menu and select the option to copy or convert the order.","Change CO type from C04 to C01 to make it a live order.","Confirm the new order - note the new CO no.","The original C04 quote should be closed or cancelled."]}],"out":["Quotation created with CO type C04.","Customer accepted the quote.","Order converted to C01 with a new CO number."]},"ord-8":{"obj":"Process a drop ship order in M3 where goods ship directly from the supplier to the customer.","scn":"Customer 000382 orders an item Adleta does not stock. The order will ship directly from the manufacturer. Enter a drop ship order using CO type C02.","tasks":[{"n":"Create the drop ship customer order","s":["Press Ctrl+S to open Search and Start, type OIS300, select it from the list, click OK, and click + (New). OIS100/A opens.","Enter Customer = 000382.","Enter CO type = C02 (Drop Ship Order).","Enter Req delivery dt and click Next.","On OIS100/I confirm the delivery address is the customer's address.","Click Next."]},{"n":"Enter the order line","s":["In OIS101, enter the item number and quantity.","Confirm the supplier for the item - M3 will route to the correct supplier.","Click Add and note the CO no."]},{"n":"Confirm and communicate","s":["M3 will create a linked purchase order to the supplier automatically.","Confirm both the sales order CO no and the linked PO number.","When the supplier ships, the PO is received and the customer order closes.","Communicate the expected ship date to customer 000382."]}],"out":["Drop ship order created with CO type C02.","Linked supplier PO created automatically by M3.","Customer notified of expected ship date."]},"fin-1":{"obj":"Enter an AP invoice in M3 and match it to the corresponding purchase order receipt.","scn":"An invoice arrives from supplier S900400 (AHF PRODUCTS). Enter the invoice in APS100 and match it to the PO receipt.","tasks":[{"n":"Open APS100 and select the FAM function","s":["Press Ctrl+S, type APS100, and open Supplier Invoice. Record.","Check the top bar shows company 100 and your division (A01 in the test company).","Select FAM Function 300 (Approved NMS=3 - PO, D/Note, Suppl O/No) and click Apply.","Click + (New) to enter a new invoice.<img class=\"ex-shot\" src=\"images/m3/aps100.jpg\" alt=\"APS100 FAM function list\" loading=\"lazy\" onclick=\"openShot(this)\">"]},{"n":"Enter the invoice header","s":["Enter Supplier = S900400.","Enter the Supplier invoice no from the paper invoice.","Enter Invoice date and the invoice amount.","Confirm Currency = USD.","Click Next."]},{"n":"Match to the PO and post","s":["On the invoice line panel, enter the PO number from the invoice (e.g. 933253).","M3 retrieves the receipt lines - confirm quantity and price match the invoice.","If the amounts match, approve the invoice.","If there is a price discrepancy, place the invoice on hold (see fin-4)."]}],"out":["AP invoice entered in APS100 against supplier S900400.","Invoice matched to PO receipt.","Invoice approved or placed on hold if discrepancy found."]},"fin-2":{"obj":"Review and update AR settings for a customer including payment terms and credit limit in CRS610.","scn":"Review the AR configuration for customer 000382 (AAA EXPRESS WATER AND FIRE RES) - confirm payment terms, credit limit, and payment method are set correctly.","tasks":[{"n":"Open the customer record in CRS610","s":["Press Ctrl+S, type CRS610, and open Customer. Open.","Search for customer 000382.","Go to panel J (the financial panel with the credit limits and payment terms).<img class=\"ex-shot\" src=\"images/m3/crs610j.jpg\" alt=\"CRS610 panel J credit limits and stop codes\" loading=\"lazy\" onclick=\"openShot(this)\">"]},{"n":"Review AR payment settings","s":["Confirm Payment terms = N30 (30 days net).","Confirm Payment mtd AR = CH1 (Chk,allc,no rem).","Note the Credit group field - this controls credit limit checking.","If payment terms need to be changed, click the edit icon and update the Payment terms field."]},{"n":"Save and verify","s":["Save any changes to the customer record.","Create a test order for customer 000382 in OIS300 and confirm payment terms default to N30.","Check that the CO stop field on the order is 0-No stop."]}],"out":["Customer 000382 AR settings reviewed in CRS610.","Payment terms N30 and payment method CH1 confirmed.","Test order verified with correct defaults."]},"fin-3":{"obj":"Create an AP payment proposal and process a check run for supplier invoices.","scn":"Supplier S900400 (AHF PRODUCTS) has invoices due. Create a payment proposal in APS130 and process the check run.","tasks":[{"n":"Open APS130 and create a payment proposal","s":["Press Ctrl+S, type APS130, and open Suppl Payment Proposal. Open.","Click + (New) to create a new proposal.","Set the payment method and due date range to capture invoices due for S900400.","Run the proposal - M3 selects eligible invoices.","Review the selected invoices and remove any that are on hold or in dispute."]},{"n":"Approve and process the check run","s":["Confirm the total payment amount on the proposal.","Approve the proposal.","Run the check print process - M3 generates the checks.","Verify checks printed correctly and note the check numbers."]},{"n":"Post the payments","s":["Post the payment proposal - M3 clears the AP invoices and records the payments.","Confirm the invoices no longer appear in open AP.","File the printed checks for mailing."]}],"out":["Payment proposal created in APS130 for supplier S900400.","Check run processed and checks printed.","AP invoices cleared after posting."]},"fin-4":{"obj":"Place an AP invoice on hold to prevent it from being included in payment runs.","scn":"An invoice from supplier S900400 has a price discrepancy. Hold the invoice in APS450 so it is excluded from payment proposals until resolved.","tasks":[{"n":"Find the invoice in APS450","s":["Press Ctrl+S, type APS450, and open Supplier Invoice Batch. Open.","Set Division = A01 and click Apply.","Search for invoices from supplier S900400.","Locate the invoice with the price discrepancy."]},{"n":"Place the invoice on hold","s":["Right-click the invoice and look for a Hold or Change Status option.","Enter a hold reason - example: Price mismatch, PO $2.50 vs Invoice $2.75.","Save the hold status.","Confirm the invoice is excluded from the next payment proposal in APS130."]},{"n":"Notify and resolve","s":["Contact supplier S900400 to resolve the price discrepancy.","Once resolved, return to APS450 and release the hold.","The invoice will be included in the next payment proposal run."]}],"out":["Invoice from S900400 placed on hold in APS450.","Hold reason documented.","Invoice excluded from payment runs until resolved."]},"fin-5":{"obj":"Create a wire transfer payment proposal for a supplier requiring electronic payment.","scn":"A supplier requires payment by wire transfer instead of check. Create the payment proposal in APS130 and process the wire.","tasks":[{"n":"Create the wire payment proposal in APS130","s":["Press Ctrl+S, type APS130, and open Suppl Payment Proposal. Open.","Click + (New) to create a new proposal.","Set Payment method = WID (wire transfer) instead of CH1.","Select invoices for the supplier due for payment and run the proposal.","Confirm bank account details for the supplier and verify the total wire amount."]},{"n":"Approve and submit the wire","s":["Review and approve the wire proposal.","Submit the wire file to the bank through your banking portal.","Note the wire reference number from the bank."]},{"n":"Post the wire payment","s":["Post the payment proposal in APS130 - M3 clears the AP invoices.","Confirm the invoices no longer appear in open AP.","Record the bank wire reference number in M3 for audit purposes."]}],"out":["Wire transfer proposal created in APS130 with payment method WID.","Wire submitted to bank.","AP invoices cleared after posting."]},"fin-6":{"obj":"Void an AP check that was issued in error or cannot be mailed.","scn":"A check printed to a supplier was damaged and cannot be mailed. Void the check in M3 and reopen the invoices for re-payment.","tasks":[{"n":"Locate the check in APS130","s":["Press Ctrl+S, type APS130, and open Suppl Payment Proposal. Open.","Search for the payment proposal that generated the check.","Locate the specific check by supplier name or check number.","Confirm the check has not already been cashed."]},{"n":"Void the check","s":["Select the check and look for the Void option under Actions or right-click menu.","Enter the void reason (example: Check damaged - reissue required).","Enter the void date.","M3 reopens the associated invoices back to open AP status."]},{"n":"Verify and re-queue for payment","s":["Confirm the invoices are back in open AP in APS450.","Confirm the voided check is no longer in open payments.","Create a new payment proposal in APS130 to reissue the payment."]}],"out":["Check voided in APS130.","Associated invoices reopened to open AP.","New payment proposal created to reissue the check."]},"fin-7":{"obj":"Post a customer check payment and apply it.","scn":"A $2,450 check arrived from customer 000382 for two open invoices.","tasks":[{"n":"Find the invoices","s":["Press Ctrl+S, type ARS200, and click OK.","Find customer 000382 and the two open invoices the check covers."]},{"n":"Post the payment","s":["Press Ctrl+S, type ARS110, and click OK.","Enter the payment for 000382 and apply it to the two invoices.","Save."]},{"n":"Confirm","s":["Return to ARS200: both invoices show a zero balance."]}],"out":["Payment posted in ARS110.","Applied to the right invoices.","Balances confirmed in ARS200."],"exc":[]},"gl-1":{"obj":"Enter a manual journal entry in M3 using the GL Journal Voucher program.","scn":"An accrual entry needs to be posted for the current period. Enter a manual journal voucher in GLS100 for Division (A01 in the test company) using FAM function 201 (USD Multi Function Entry).","tasks":[{"n":"Open GLS100 and select the FAM function","s":["Press Ctrl+S, type GLS100, and open Journal Voucher. Enter.","The Select FAM Function screen appears - confirm Division = A01.","Select FAM function 201 (USD Multi Function Entry, voucher name GL01201).","Click Apply or double-click 201 to open the journal entry form.<img class=\"ex-shot\" src=\"images/m3/gls100.jpg\" alt=\"GLS100 FAM function list\" loading=\"lazy\" onclick=\"openShot(this)\">"]},{"n":"Enter the journal voucher header","s":["A new voucher header opens with Division (A01 in the test company) pre-filled.","Enter the Accounting date (the period the entry should post to).","Enter a Voucher text describing the purpose of the entry (e.g., Monthly accrual - [description]).","The voucher number is assigned automatically by M3."]},{"n":"Enter the debit and credit lines","s":["On the journal lines panel, enter the first account number and debit amount.","Enter the offsetting account number and credit amount.","Confirm debit total equals credit total - M3 will not allow an unbalanced voucher.","Click Save or Next to post the journal entry.","Note the voucher number assigned - use GLS200 (Voucher. Display) to confirm it posted."]}],"out":["Manual journal entry posted in GLS100 for Division (A01 in the test company).","FAM function 201 (USD Multi Function Entry) used.","Voucher confirmed in GLS200 after posting."]},"gl-2":{"obj":"Reverse a GL journal voucher that was posted in error.","scn":"A journal entry was posted to the wrong accounting period or account. Reverse the original voucher in GLS100 using FAM function 101 (Autoreverse Voucher) or use Voucher. Reverse from the GL menu.","tasks":[{"n":"Find the incorrect voucher in GLS200","s":["Press Ctrl+S, type GLS200, and open Voucher. Display.<img class=\"ex-shot\" src=\"images/m3/gls200.jpg\" alt=\"GLS200 voucher display\" loading=\"lazy\" onclick=\"openShot(this)\">","Set Division = A01 and click Apply.","Filter by Voucher number or Accounting date to locate the incorrect entry.","Click the voucher to review the lines and confirm it is the entry to be reversed."]},{"n":"Reverse the voucher","s":["From GLS200, right-click the voucher and look for a Reverse option.","Alternatively, open GLS100, select FAM function 101 (Autoreverse Voucher).","Enter the original voucher number to reverse.","Enter the reversal date - typically the first day of the next period.","M3 creates a new voucher with all debit and credit lines swapped."]},{"n":"Verify the reversal posted","s":["Return to GLS200 and search for the reversal voucher.","Confirm the reversal voucher has the same amounts as the original but opposite signs.","If a correcting entry is also needed, enter it in GLS100 with FAM 201 (USD Multi Function Entry).","Confirm the net effect on the affected accounts is correct."]}],"out":["Incorrect voucher located in GLS200.","Reversal voucher posted using FAM 101 or Voucher. Reverse.","Correcting entry posted if required."]},"gl-3":{"obj":"Display GL account balances and review period activity for a GL account.","scn":"The controller asks you to pull the current period balance and activity for a GL account. Use GLS215 (GL Balance File. Display) to review the account.","tasks":[{"n":"Open GLS215 and set filters","s":["Press Ctrl+S, type GLS215, and open GL Balance File. Display.","Set Period = current period (format YYMM, e.g., 2606 for June 2026).","Set Division = A01.","Set the Account From and To range for the account you want to review.","Click Apply."]},{"n":"Review the account balance","s":["GLS215 shows each account with Actual Period, Budget Period, and Variance columns.","The Actual Period column shows the net activity posted to the account in the current period.","To see individual transactions behind the balance, right-click the account row and select Related > Voucher lines or Transaction detail.","Review the voucher lines to identify what transactions make up the balance."]},{"n":"Investigate discrepancies","s":["If the balance does not match expectations, drill into the voucher lines.","Note the voucher numbers and accounting dates of any unexpected entries.","Use GLS200 (Voucher. Display) to pull up the full voucher detail for any questionable entry.","Escalate any unrecognized entries to the controller or accounting team."]}],"out":["GL account balance reviewed in GLS215 for Division (A01 in the test company).","Period activity confirmed.","Voucher detail drilled into via GLS200 for any discrepancies."]},"gl-4":{"obj":"Write off a small open balance.","scn":"Customer 000382 has a $3.17 short-pay left open. Finance has approved writing it off.","tasks":[{"n":"Find it","s":["Press Ctrl+S, type ARS200, and click OK.","Find 000382 and the $3.17 item."]},{"n":"Enter the credit","s":["Press Ctrl+S, type ARS120, and click OK.","Enter a manual credit for $3.17 for 000382 using the account Finance gave you.","Note the approval in the text."]},{"n":"Check","s":["ARS200 shows the item closed.","GLS210 shows the posting."]}],"out":["Write-off approved and documented.","Credit entered in ARS120.","Item closed in ARS200."],"exc":[]},"gl-5":{"obj":"Prepare and document a collections call.","scn":"Customer 000382 has an invoice over 45 days past due.","tasks":[{"n":"Prepare","s":["Open ARS200 for 000382.","Note the past-due invoice, amount, and total open."]},{"n":"Call and document","s":["Make the (practice) call.","Record who you spoke to, the date, what was promised, and the next follow-up date where your trainer shows you."]},{"n":"Escalate if needed","s":["If this is the third missed promise, tell your manager. Credit decides on a stop in CRS610."]}],"out":["Account reviewed before the call.","Contact documented with next follow-up date.","Escalation path followed."],"exc":[]},"log-1":{"obj":"Locate a delivery in MWS410 and review the pick list status for a customer order.","scn":"A customer order for consignee 007822 is ready for picking in the CAR warehouse. Open MWS410 to find the delivery and review its status.","tasks":[{"n":"Open MWS410 and filter for the delivery","s":["Press Ctrl+S, type MWS410, and open Delivery. Open Toolbox.","Set Warehouse = CAR (Carrollton) and click Apply.","The list shows deliveries with columns: Dely no, Consignee, Dmt (Delivery method), Order no, and status.","Locate the delivery for consignee 007822 - note the Delivery number and status (e.g., 1-Picking List Generated).<img class=\"ex-shot\" src=\"images/m3/mws410.jpg\" alt=\"MWS410 delivery toolbox\" loading=\"lazy\" onclick=\"openShot(this)\">"]},{"n":"Review the delivery detail","s":["Click the Delivery number link to open the delivery detail.","Review the delivery lines - confirm item, quantity, and warehouse location.","Note the Delivery method (Dmt) field - OT means Our Truck, WC means Will Call.","If status is 1-Picking List Generated, the pick list has been printed and picking is in progress."]},{"n":"Confirm pick status in MWS420","s":["Press Ctrl+S, type MWS420, and open Picking List. Report.","Set Warehouse = CAR, Pick sts = 40-Picking, and click Apply.","Locate the delivery in the list - confirm it shows the correct print date (Prt dt) and pick time.","Once warehouse confirms picking is complete, the delivery status will advance to the next step."]}],"out":["Delivery located in MWS410 for warehouse CAR.","Pick list status confirmed in MWS420.","Delivery detail reviewed with correct items and quantities."]},"log-2":{"obj":"Print and review a pick list report in MWS420 for the CAR warehouse.","scn":"The warehouse team needs the pick list for today's deliveries. Run MWS420 to print or display the picking list for CAR warehouse.","tasks":[{"n":"Open MWS420 and set filters","s":["Press Ctrl+S, type MWS420, and open Picking List. Report.","Set Warehouse = CAR.","Set Pick sts = 40-Picking to show orders actively being picked.","Set Rep date = today's date.","Click Apply - the list shows all deliveries with their delivery number, size (Sz), print date (Prt dt), and print time (Prt t).<img class=\"ex-shot\" src=\"images/m3/mws420.jpg\" alt=\"MWS420 picking list report\" loading=\"lazy\" onclick=\"openShot(this)\">"]},{"n":"Review the pick list","s":["The list shows columns: Dely no (delivery number), Sfx, Sz (size/carton count), Prt dt (print date), Prt t (print time), Pck t (pick time), Picker.","Confirm the deliveries that need to go out today are listed.","If a delivery is missing from the list, return to MWS410 and verify the delivery status.","Click a delivery number to drill into the individual pick lines for that delivery."]},{"n":"Assign pickers and track progress","s":["Use the Picker field to assign a warehouse employee to a delivery if required.","Once items are picked, the warehouse team enters the pick time (Pck t) to confirm completion.","Deliveries with a pick time confirmed are ready for loading and shipment.","Return to MWS410 to process the delivery confirmation once all lines are picked."]}],"out":["Pick list report run in MWS420 for CAR warehouse.","Deliveries at pick status 40 reviewed.","Pick assignments tracked and confirmed."]},"log-3":{"obj":"Check a truck load before it leaves.","scn":"The OT route for tomorrow from CAR is being loaded. Check the shipment.","tasks":[{"n":"Find the shipment","s":["Press Ctrl+S, type DRS100, and click OK.","Find tomorrow's shipment for the route from CAR.<img class=\"ex-shot\" src=\"images/m3/drs100.jpg\" alt=\"DRS100 shipments for WHCAR\" loading=\"lazy\" onclick=\"openShot(this)\">"]},{"n":"Check the deliveries","s":["For each delivery on the load, check in MWS410 it is picked and has no stop.","Note any delivery with a stop. It stays off the truck."]},{"n":"Close","s":["With your trainer, close the shipment once loaded."]}],"out":["Shipment found in DRS100.","Every delivery checked for pick and stops.","Load closed with trainer."],"exc":[]},"log-4":{"obj":"Get a will call order from the system to the counter.","scn":"A WC order for customer 000382 is in MWS410 at CAR. The customer is coming at 2 PM.","tasks":[{"n":"Find the delivery","s":["Press Ctrl+S, type MWS410, and click OK.","Set Warehouse = CAR and Apply.","Find the delivery with Dmt = WC for 000382. Check for a C10 stop."]},{"n":"Release and pick","s":["If there is no stop, release it for picking.","Open MWS420, find the pick list, pick the items, and report the picked quantities.","Stage the goods at the counter."]},{"n":"Hand over","s":["When the customer arrives, check the order number.","Hand over the goods and complete the issue step with your trainer.","Check OIS300: the order status has moved on."]}],"out":["Will call delivery released and picked.","Goods staged and handed over.","Order status updated in OIS300."],"exc":[{"q":"The delivery has a C10 stop","a":"The customer hasn't paid. Send them to the cash desk (OIS215) first."}]},"log-5":{"obj":"Answer a customer's \"where is my delivery\" question.","scn":"Consignee 007822 calls asking when their order will arrive.","tasks":[{"n":"Find the order","s":["Press Ctrl+S, type OIS300, and click OK.","Filter on customer 007822 and read the order's status."]},{"n":"Find the delivery","s":["Open MWS410, Warehouse = CAR, Apply.","Find the delivery for 007822. Note status, Dmt (OT/WC/CC), and any stop."]},{"n":"Answer","s":["If OT, check which load (DRS100) and route it is on.","If there is a stop, tell the customer why (for C10: payment needed).","Note what you told the customer."]}],"out":["Order and delivery status found.","Delivery method and any stop identified.","Customer given an accurate answer."],"exc":[]},"prd-1":{"obj":"Discontinue an item in M3 by updating its status and reviewing remaining inventory.","scn":"A flooring style is being discontinued. Update the item status in MMS001 and review remaining stock in the CAR warehouse before the item is phased out.","tasks":[{"n":"Find the item and update status in MMS001","s":["Press Ctrl+S, type MMS001, and open Item. Open.","In the Item number filter, type the item number to discontinue and click Apply.","Click Change (or right-click > Change) on the item row to open the edit screen.","On the Basic Information panel, change Item status from 20-Released to 90-Discontinued (or the appropriate phase-out status).","Save the change."]},{"n":"Review remaining inventory in MMS200","s":["Open MMS200 (Item. Open Toolbox), set Warehouse = CAR, enter the item number, click Apply.","Right-click the item and select Related > Balance Identity (MWS068) to see on-hand quantity.","If stock remains, coordinate with purchasing to cancel any open purchase orders for this item.","Notify the sales team so no new customer orders are placed for the discontinued item."]},{"n":"Confirm item is no longer orderable","s":["Return to MMS001 and confirm the item status is updated.","Attempt to add the item to a test order in OIS300 - M3 should warn or block the item based on its status.","If the item appears on any active open orders, review those orders with the sales team.","Document the discontinuation date and notify the product manager (Lauren Calvey)."]}],"out":["Item status updated to discontinued in MMS001.","Remaining inventory reviewed in MMS200/MWS068 for CAR warehouse.","Sales and purchasing teams notified of discontinuation."]},"prd-2":{"obj":"Review an item record in MMS001 and update the customer price list in OIS017.","scn":"A product manager needs to review the item master for a VCT tile and confirm its pricing in OIS017 for customer 000382 (AAA EXPRESS WATER AND FIRE RES).","tasks":[{"n":"Review the item in MMS001","s":["Press Ctrl+S, type MMS001, and open Item. Open.","Filter by Item type = VCT (Vinyl Composition Tile) and Status = 20-Released, then click Apply.","Locate item ARM51830031 (IMPERIAL TEXTURE 1/8 INCH TILE) in the list.","Click Change to open the item and review: Description, Item type (VCT), U/M (CT), Item mgr (MPARSONS), and P grp (AHC).","Confirm Status = 20-Released and the item is active."]},{"n":"Review the price list in OIS017","s":["Press Ctrl+S, type OIS017, and open Price List. Open.","Search for the price list that applies to customer 000382 - this is typically LP1.","Filter for item ARM51830031 to see the current price.","Review the price, effective date, and currency (USD).","If the price needs to be updated, click Change and enter the new price and effective date."]},{"n":"Verify pricing on a test order","s":["Open OIS300 and create a test order for customer 000382 with item ARM51830031.","Confirm the Net price field on OIS101 populates automatically from price list LP1.","Verify the price matches what was set in OIS017.","Cancel the test order - do not submit it."]}],"out":["Item ARM51830031 reviewed in MMS001 - status 20-Released, type VCT.","Price confirmed in OIS017 for price list LP1.","Price verified on test order in OIS300 for customer 000382."]},"prd-3":{"obj":"Complete all master data steps in M3 to set up a new product for purchasing and sales.","scn":"A new flooring product is being added to the Adleta catalog. Set up the item master in MMS001, assign it to the CAR warehouse in MMS002, and add it to the price list in OIS017.","tasks":[{"n":"Create the item master in MMS001","s":["Open MMS001 (Item. Open) and click + (New) to create a new item.","Enter the Item number (follow Adleta naming convention, e.g., manufacturer prefix + style code).","Enter the item Name and Description 2 (full product description).","Set Item type = VCT (or RES for residential, depending on the product category).","Set U/M = CT (carton) or LF (linear foot) as appropriate.","Set Status = 20-Released and assign Item mgr = MPARSONS (or the responsible product manager).","Set P grp (Product group) = AHC (or appropriate group) and save."]},{"n":"Assign the item to the CAR warehouse in MMS002","s":["Press Ctrl+S, type MMS002, and open Item. Connect Warehouse.","Enter the new item number and Warehouse = CAR.","Set the reorder point, order quantity, and lead time based on purchasing input.","Set Lot control = 3-In lot master if the item is lot-tracked.","Save the item/warehouse record - the item is now available for ordering in the CAR warehouse."]},{"n":"Add the item to the price list in OIS017 and test","s":["Open OIS017 (Price List. Open) and locate price list LP1.","Click + (New) to add a line for the new item.","Enter the item number, sales price, and effective date.","Save the price list entry.","Create a test order in OIS300 for customer 000382 - add the new item and confirm the price defaults from LP1.","Cancel the test order after verifying pricing."]}],"out":["New item created in MMS001 with correct type, U/M, and status 20-Released.","Item connected to CAR warehouse in MMS002 with replenishment parameters.","Item added to price list LP1 in OIS017 and verified on test order."]},"rep-1":{"obj":"Navigate to Infor M3 Analytics (Birst) and explore the Sales collection dashboards.","scn":"Jeanell needs to check the open order book for the week. Open Birst from the M3 toolbar, navigate to the Sales collection, and review the Open Customer Order Book dashboard.","tasks":[{"n":"Open Birst from the M3 toolbar","s":["In M3, look at the top navigation bar - you will see tabs: Rhythm Commerce Business Center, Rhythm Portal, Infor M3, and Birst.","Click the Birst tab. Infor M3 Analytics for M3 Cloud opens (version 2025.10.00).","The landing page shows admin options and a Spaces list. You will work in the M3ADIS-Consumer space.","Click into the M3ADIS-Consumer space if it does not open automatically."]},{"n":"Navigate to the Sales collection","s":["Click the hamburger menu (three lines) on the upper left to open the Collections panel.","The Collections list shows: Home, Admin, Sales, Procurement, Finance, Production, Rental, Equipment, Warehouse, C-Suite.","Click Sales. The first dashboard that opens is Open Customer Order Book.","Note the breadcrumb at the top: Sales / Open Customer Order Book."]},{"n":"Review the Open Customer Order Book dashboard","s":["The filter chips at the top show: = 100 - CMP100 (company/division), = Open Orders, = Week, = [current week number], = 2026.","Review the KPI tiles on the left: Overdue Line Amt, Line Amt, Order Value, No. of Stopped Order Lines, Order Qty.","The charts on the right show Overdue Stock Analysis and Stop Code Analysis by week.","To change the week, click the week number filter chip and select a different period.","To see all Sales dashboards, click the dropdown arrow next to Open Customer Order Book in the breadcrumb - there are 17 Sales dashboards total."]}],"out":["Birst opens from the M3 toolbar - no separate login needed.","Sales collection shows 17 dashboards including Open Customer Order Book.","Open Customer Order Book shows current week open orders, overdue amounts, and stopped order lines."],"exc":[{"q":"The Birst tab is not visible in the M3 toolbar","a":"The Birst tab appears next to the Infor M3 tab in the top navigation bar. If it is not there, try refreshing M3 or contact IT - your user account may not have Birst access yet."},{"q":"Birst opens but shows no data for the current week","a":"Birst data loads daily at approximately 6:02 AM. If today's ETL has not run yet, data will reflect yesterday. Check Admin > Incremental Load Logs to confirm the last successful load date."},{"q":"The dashboard shows data but the numbers look unusually high or low","a":"Check the Company filter - it should show 100 - CMP100. If it is blank or set to a different company, the numbers will be wrong. Click the filter chip and set it to 100."},{"q":"You cannot find the Sales collection","a":"Click the hamburger menu on the upper left. If it is already open and you do not see Sales, scroll down in the Collections panel - it appears after Admin."}]},"rep-2":{"obj":"Use the Sales Manager - Margin dashboard in Birst to review gross margin performance.","scn":"Jeanell needs to review margin performance by product and customer for the current year. Open the Sales Manager - Margin dashboard and identify any margin concerns.","tasks":[{"n":"Open the Sales Manager - Margin dashboard","s":["In Birst with the Sales collection open, click the dropdown arrow next to the current dashboard name in the breadcrumb.","Select Sales Manager - Margin from the list.","The dashboard header shows: Sales Manager - Margin | Currency: USD | Year: 2026."]},{"n":"Review the KPI tiles and charts","s":["The four KPI tiles across the top show: Gross Margin % FY, Invcd Net Amt, Gross Profit $, COGS Standard.","Gross Margin % FY is the primary metric - this is your year-to-date margin percentage.","Below the tiles are charts: Sales Margin by Period (trend over time), Pct of Total by Product, Pct of Total by Customer, Invcd Amt Breakdown of Top Gross Profit 2, and Top Sales Margin.","Sales Margin by Period shows how margin has trended week by week or month by month."]},{"n":"Filter and drill into margin details","s":["The filter chips show: = 100 - CMP100, = Invcd Net Amt, = [period], = 2026.","To change from weekly to monthly view, click the period filter chip (Week/Month) and switch to Month.","To drill into a specific product line, click Drill Across on the Pct of Total by Product chart.","Note any products or customers showing lower-than-expected margin for follow-up."]}],"out":["Gross Margin % FY, Invcd Net Amt, Gross Profit $, and COGS Standard reviewed.","Sales Margin by Period chart shows margin trend across the year.","Product and customer margin breakdowns visible for drill-down."],"exc":[{"q":"All KPI tiles show 0 or No data was returned","a":"The filter period may have no invoiced data. Change the period filter from Week to Month, or change the year. In the test environment, data may only exist for certain periods."},{"q":"Gross Margin % FY seems much lower than expected","a":"Confirm the filter is set to Invcd Net Amt (invoiced amount) and not a different measure. Also confirm the company filter = 100 - CMP100. If both are correct, bring the number to Tony Shipka before taking action."},{"q":"You want to export the margin data to Excel","a":"Use the export icon in the dashboard toolbar (the share/upload icon). Select the export format. If the export is blocked by a popup blocker, allow popups for the Birst URL and try again."},{"q":"A product line is missing from the Pct of Total by Product chart","a":"The chart may only show top N products. Use the Sales Analysis Ad Hoc dashboard or drill across to see the full product list including items with small volumes."}]},"rep-3":{"obj":"Use the Customer Profitability Analysis dashboard in Birst to review revenue and margin by customer. Then pull a custom report from Sales Analysis Ad Hoc.","scn":"Jeanell needs to identify which customers are driving the most profit this year. Open Customer Profitability Analysis and review the top customers.","tasks":[{"n":"Open the Customer Profitability Analysis dashboard","s":["In Birst Sales collection, click the dashboard dropdown in the breadcrumb and select Customer Profitability Analysis.","The dashboard loads showing customer-level revenue and profitability data.","Confirm the filters show Company = 100 - CMP100 and Year = 2026."]},{"n":"Review customer profitability","s":["Review the top customers by invoiced amount and gross profit.","Look for customers with high revenue but low margin - these may need pricing review.","Look for customers with declining revenue year-over-year - these may need sales follow-up.","Use the Drill Across option on any chart to get more detail on a specific customer."]},{"n":"Connect findings to M3 for action","s":["If a customer shows an unusual margin, open M3 and check their price list in OIS017 (price lists).","Search by customer number - remember the format is six digits, e.g., 000382 for AAA EXPRESS WATER AND FIRE RES.","Compare the OIS017 price list entries to the Birst margin data to identify whether pricing or cost is the issue.","Document any customers needing pricing review and bring to Tony Shipka."]},{"n":"Set the filters for the report","s":["Set Company = 100 - CMP100.","Set the date range to cover the last 3 months.","If available, filter by the relevant product category or item group.","Click Apply or refresh to run the report."]},{"n":"Review and export the results","s":["Review the data returned - confirm it matches the scope of the request (correct dates, correct division).","Use the export function to download to Excel.","Name the file clearly with the date range and criteria (e.g., Sales_by_ProductGroup_Q2_2026).","Share the export with the sales manager - do not share the Birst link directly unless they have Birst access."]}],"out":["Top customers by revenue and profit identified in Birst.","Customers with margin concerns flagged for pricing review.","Connection made between Birst profitability data and M3 price list in OIS017.","Sales by product category pulled for the last 3 months from Birst.","Data exported to Excel and ready to share."],"exc":[]},"rep-4":{"obj":"Check and update a customer-specific price in OIS017 and verify it applies to a new order.","scn":"Customer 000382 (AAA EXPRESS WATER AND FIRE RES) has a negotiated price for a specific item that differs from the standard list. Verify and update it in OIS017.","tasks":[{"n":"Open OIS017 and look up the customer","s":["Press Ctrl+S, type OIS017, and open price lists.<img class=\"ex-shot\" src=\"images/m3/ois017.jpg\" alt=\"OIS017 sales price lists\" loading=\"lazy\" onclick=\"openShot(this)\">","In the filter fields, enter Customer = 000382 (AAA EXPRESS WATER AND FIRE RES).","Press Enter or click Apply to load the customer-specific price list.","OIS017 shows only items with negotiated prices for this customer - not the full catalog."]},{"n":"Review the customer price entries","s":["Each line shows: item number, item name, customer-specific price, unit, and effective/expiration dates.","Confirm each price matches the current negotiated agreement with Alan Wheelock.","Note: a customer-specific price in OIS017 always overrides the standard price list in the standard price list for that customer.","If an item is not listed in OIS017, the customer will be charged the standard the standard price list price."]},{"n":"Update or add a customer price","s":["To update an existing price: select the line and click Change. Enter the new price and effective date.","To add a new item: click the + (New) button. Enter the customer number, item number, price, and effective date.","Save and verify the entry appears in the list.","To confirm the price will apply to a new order, open OIS100 and start a test order for customer 000382 with the item - the price should auto-fill from OIS017."]}],"out":["Customer 000382 price verified in OIS017.","Customer-specific price updated with correct amount and effective date.","OIS017 price confirmed to override the standard price list standard price for this customer."],"exc":[{"q":"OIS017 shows no entries for customer 000382","a":"This customer may be using only the standard the standard price list price list with no negotiated exceptions. That is normal. If the customer should have a special price, add it using the + button."},{"q":"You updated the price in OIS017 but a new order still shows the old price","a":"Check the effective date - if it is set to a future date, the new price will not apply until that date. Also confirm the item number in OIS017 exactly matches the item on the order."},{"q":"The customer number you enter in OIS017 is rejected","a":"Customer numbers in M3 are six digits with leading zeros: 000382, not 000382. If you are unsure of a customer number, look it up in CRS610 first - the Customer column shows the correct format."},{"q":"A customer asks why their price changed on a recent order","a":"Check the effective date on their OIS017 entry. If a new price went live and was applied to an order the customer expected the old price on, bring the details to Tony Shipka and Philip Jones before making any adjustment."}]},"rep-5":{"obj":"Review and update a customer price list in OIS017 in M3.","scn":"A price update is needed for a product line. Review the current price list in OIS017 and update the effective price and date.","tasks":[{"n":"Open OIS017 and find the price list","s":["Open OIS017 (price lists) with Ctrl+S.<img class=\"ex-shot\" src=\"images/m3/ois017.jpg\" alt=\"OIS017 sales price lists\" loading=\"lazy\" onclick=\"openShot(this)\">","OIS017 shows the standard price lists used across all customers.","Use the filter fields to search by price list ID or item group.","Locate the price list that applies to the product line needing an update."]},{"n":"Review the price list entries","s":["Click into the price list to view the line-level entries.","Each line shows: item number, item name, price, unit of measure, and effective dates.","Confirm the current price matches what is in the supplier agreement or product management direction.","Note the expiration date - if it has passed, the price will not apply to new orders."]},{"n":"Update the price","s":["Select the price list line to update and click Change.","Enter the new price and the effective date (the date the new price should start applying to orders).","If the old price should stop applying before the new price starts, also update the expiration date on the old line.","Save the change and confirm the new price appears correctly in the list."]}],"out":["Price list entry updated in OIS017 with new price and effective date.","New orders created after the effective date will use the updated price.","Old price line has correct expiration date so there is no overlap."],"exc":[{"q":"The price list you need is not in OIS017","a":"OIS017 shows standard price lists. Customer-specific prices are in OIS017. If the price list does not appear in OIS017, check OIS017 with the customer number (format: 000382)."},{"q":"The new price takes effect but existing open orders still show the old price","a":"M3 prices orders at the time of entry. An open order keeps its original price unless manually updated. If a customer was quoted the new price, update the order line manually with Tony Shipka approval."},{"q":"You are not sure which effective date to use","a":"The effective date should be the date you and Tony Shipka agreed the new price applies to new orders. Do not backdate a price change without explicit approval from Philip Jones."},{"q":"The price list line shows a unit of measure you do not recognize","a":"Common units in M3: CT = cartons, EA = each, SF = square feet, LF = linear feet, PC = pieces. If an unfamiliar unit appears, confirm with Lauren Calvey before changing the price - the unit affects the total calculation."}]},"rep-6":{"obj":"Change the price on one order line and document why.","scn":"Customer 000382 was quoted a lower price on ARM51830031 than the price list. Your manager has approved it for this order only.","tasks":[{"n":"Start the order","s":["Press Ctrl+S, open OIS100, find 000382, and click Next through to OIS101.","Enter item ARM51830031 and quantity. Note the price that fills in."]},{"n":"Override the price","s":["Change the sales price on the line to the approved price.","Read any warning M3 shows and write it down.","Click Add."]},{"n":"Document","s":["Add a note on the order: approved price, who approved, why.","If this customer will get this price on every order, ask for the price list (OIS017) to be updated instead."]}],"out":["Line entered at the approved price.","Warning noted.","Approval documented on the order."],"exc":[]},"ord-9":{"obj":"Answer common customer calls using M3 lookups only.","scn":"Customer 000382 (AAA EXPRESS WATER AND FIRE RES) calls with three questions: where is their latest order, do you have ARM51830031 in stock at Carrollton and in which lot, and can you resend last week's invoice.","tasks":[{"n":"Find the order","s":["Press Ctrl+S, type OIS300, and click OK.","Filter Customer = 000382 and press Enter.","Read Lst and Hi on the latest CO no. 33 = allocated and waiting for pick release; 44 = pick released.<img class=\"ex-shot\" src=\"images/m3/ois301.jpg\" alt=\"OIS301 order lines across orders\" loading=\"lazy\" onclick=\"openShot(this)\">","If it is still 33 and the customer expected it, check the delivery in MWS410 for a stop."]},{"n":"Check stock and lot","s":["Press Ctrl+S, type MWS068, and click OK.","Filter item ARM51830031 and warehouse CAR.","Note each location, lot, and on-hand quantity (the
