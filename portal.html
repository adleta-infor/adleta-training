  financeGL:{id:"financeGL",name:"Finance — General Ledger",owner:"Philip Jones",weeks:"Week 6",pill:"pill-red",color:"#c0443b",programs:["GLS040","GLS100","GLS050","GLS910","GLS990"],summary:"Chart of accounts, journal entries, period close, GL inquiry, financial reports.",links:[["Deck",SP+"/Adleta_M3_Finance_GL_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Finance_GL_LearningGuide.docx"]],sessions:[{id:"gl-1",title:"Journal Entries and Period Close — GLS100 and GLS050",duration:"60 min",steps:[["1","Open GLS100","Navigate to General Ledger > Journal Entry > GLS100"],["2","Enter Journal Date","Must be in an open accounting period"],["3","Enter Description","Clear explanation — required for audit"],["4","Enter Debit Lines","Account number, amount, line description"],["5","Enter Credit Lines","Account number, amount, line description"],["6","Verify Balance","Debits must equal credits — M3 blocks unbalanced entries"],["7","Attach Documentation","Supporting docs required for all manual entries"],["8","Post","Press F5 after approval — M3 updates GL balances"],["9","Period Close via GLS050","Confirm all transactions done, get approval, close period"]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/FINANCE/AP-%20Finance%20Master%20List%20Configuration-20241205_093242-Meeting%20Recording.mp4",quiz:[{q:"A journal entry will be rejected by M3 if:",options:["It has a description","Debits do not equal credits","It is entered before noon","It references more than 2 accounts"],answer:1},{q:"After closing a period in GLS050:",options:["Entries can still be posted","No further postings are allowed","The period reopens automatically","Finance receives an email"],answer:1},{q:"All manual journal entries must have:",options:["A vendor reference","A customer number","Clear description and supporting documentation","A purchase order number"],answer:2}],checklist:["I can create a balanced journal entry in GLS100","I understand when to use reversing vs standard journal entries","I can complete the period close checklist steps","I know how to reopen a period with manager authorization if needed"]},{id:"gl-2",title:"Chart of Accounts and GL Inquiry — GLS040 and GLS910",duration:"45 min",steps:[["1","Open GLS040","Navigate to General Ledger > Chart of Accounts > GLS040"],["2","Browse the account structure","Review account ranges: assets, liabilities, equity, revenue, expense. Note the Adleta account numbering convention."],["3","Look up an account","Enter an account number and press Enter. Review account type, description, and posting rules."],["4","Check if an account allows posting","Look at the posting flag. Non-posting accounts are summary accounts — transactions must go to detail accounts below them."],["5","Open GLS910","Navigate to General Ledger > GL Inquiry > GLS910"],["6","Enter account and period","Type the GL account number, financial year, and period range."],["7","Review balance and transactions","See opening balance, period activity (debits and credits), and closing balance."],["8","Drill into transactions","Select a transaction line and press Enter to see the source document — journal entry, AP invoice, AR payment, etc."],["9","Export if needed","Press F17 to export the inquiry results to Excel for review or reconciliation."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2008%202025%20-%20Finance/Bravo%20-%20MiniCRP%20Finance%20scenarios-20251208%20AP%20Display%20(APS200)%20Change%20Acc%20String%20and%20Reverse%20Invoice.mp4",quiz:[{q:"A non-posting account in GLS040 means:",options:["The account is closed","Transactions must be posted to detail accounts below it, not to this account directly","The account requires manager approval","The account is only used for reporting"],answer:1},{q:"In GLS910 you can drill into a transaction to see:",options:["The vendor's contact details","The source document — journal entry, invoice, or payment — that created the posting","The budget for that account","The period close status"],answer:1},{q:"The correct way to find why a GL account balance changed in a period is:",options:["Run a new journal entry","Open GLS910, enter the account and period, and review the transaction detail","Ask IT to run a report","Check the AR aging in ARS300"],answer:1},{q:"Account ranges in the Adleta chart of accounts are organized by:",options:["Alphabetical order","Department name","Account type — assets, liabilities, equity, revenue, expense","Transaction date"],answer:2}],checklist:["I can navigate the chart of accounts in GLS040 and identify account types","I can distinguish between posting and non-posting accounts","I can run a GL inquiry in GLS910 for any account and period","I can drill into a transaction to find its source document","I can export GL inquiry results to Excel"]},{id:"gl-3",title:"Financial Reports and Period Review — GLS990",duration:"45 min",steps:[["1","Open GLS990","Navigate to General Ledger > Financial Reports > GLS990"],["2","Select report type","Choose from: Balance Sheet, Income Statement, or custom report layout configured for Adleta."],["3","Enter parameters","Select financial year, period, and accounting dimension (division, cost center, or consolidated)."],["4","Run the report","Press F5 — M3 generates the financial statement with current period and year-to-date figures."],["5","Review key lines","Check total revenue, total expenses, and net income on the income statement. Check total assets equals total liabilities plus equity on the balance sheet."],["6","Compare to prior period","Re-run with the previous period selected. Note significant variances that need explanation."],["7","Export to Excel","Press F17 to export. Use for management reporting, variance commentary, or audit support."],["8","Identify out-of-balance items","If the balance sheet does not balance, flag immediately — do not close the period until resolved."],["9","File the signed-off report","Save a copy to SharePoint as part of the period close documentation package."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/FINANCE/Automatic%20Bank%20Reconciliation%20Demo-20240711_140316-Meeting%20Recording.mp4",quiz:[{q:"On a balance sheet, total assets must equal:",options:["Total revenue minus total expenses","Total liabilities plus equity","Net income plus equity","Total debits minus total credits"],answer:1},{q:"Before closing a period, the balance sheet shows a discrepancy. You should:",options:["Close the period anyway and fix it next month","Export to Excel and adjust the spreadsheet","Flag it immediately and do not close until resolved","Repost all journal entries"],answer:2},{q:"The GLS990 parameter that controls whether you see one division or the full company is:",options:["Period","Financial year","Accounting dimension","Report type"],answer:2},{q:"Year-to-date figures in GLS990 represent:",options:["Only the current period","The cumulative total from the start of the financial year through the selected period","The prior year comparison","The budget for the year"],answer:1}],checklist:["I can run a balance sheet and income statement in GLS990","I can select the correct period, year, and accounting dimension","I can compare current period to prior period and identify variances","I know what to do if the balance sheet is out of balance","I can export financial reports and file them to SharePoint"]},{id:"gl-4",title:"AR Debit Notes and Write-offs",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AR%20Debit%20Note%20Write%20Off.mp4",steps:[["1","View Open Debit Notes","Open the AR Debit Notes program. Filter by customer, status, or date range to view open debit notes."],["2","Review Debit Note Details","Select a debit note. Review the disputed amount, original invoice, and any supporting documentation attached."],["3","Investigate the Dispute","Coordinate with Sales or Customer Service to understand the root cause — damaged goods, pricing error, short shipment, etc."],["4","Approve for Write-off","If the dispute is valid and will not be recovered: select the debit note → Approve for Write-off. Enter write-off reason code and the GL account for the write-off. Confirm."],["5","Approve for Credit","If the customer will receive a credit to use against future invoices: select the debit note → Approve for Credit. M3 creates a credit memo. Confirm."],["6","Verify AR Aging","Review AR aging after resolution to confirm the debit note is cleared and the customer balance is accurate."],["7","Communicate Resolution","Notify the customer, Sales, and relevant stakeholders of the resolution."]],quiz:[{q:"A debit note in AR represents:",options:["A payment received from a customer","A disputed charge or customer claim against an Adleta invoice","A credit memo issued to a new customer","A GL journal entry"],answer:1},{q:"When a debit note is approved for write-off, M3 posts an entry to:",options:["The vendor account","The write-off GL account","The customer deposit account","The PO budget"],answer:1},{q:"When approved for credit, M3 creates a:",options:["New customer order","Credit memo applicable to future invoices","Refund check","Debit to the AR account"],answer:1},{q:"AR debit note management at Adleta is owned by:",options:["Warehouse","Customer Service","Finance/Credit department","Purchasing"],answer:2}],checklist:["I can view and review open AR debit notes in M3","I understand the difference between write-off and credit approval","I can process a debit note for write-off with the correct GL account","I can process a debit note for credit memo","I know when to escalate a debit note to management for approval"]},{id:"gl-5",title:"AR Tickler Notes and Collection Follow-up",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2017%202025%20-%20Finance/AR%20Tickler%20Notes.mp4",steps:[["1","Access Tickler Notes","Open the AR Tickler Notes program (or navigate from the customer account in ARS200). Tickler notes are the core tool for collection follow-up tracking."],["2","Create a New Tickler","Select New. Enter note text — be specific about what was communicated and the outcome. Set the follow-up date and priority."],["3","Assign the Tickler","Assign the tickler to yourself or the responsible collector. The note appears in the daily collection work queue."],["4","Create an Invoice-Level Tickler","From an individual invoice view, create a tickler tied to that specific invoice. Useful for tracking disputes or payment promises on a specific invoice."],["5","Work the Daily Tickler Queue","Each day, open the tickler queue and work through due and overdue items. Contact customers, document outcomes, and update follow-up dates."],["6","Close a Resolved Tickler","When a tickler is resolved — payment received, dispute settled, escalated — select the note and mark it as Closed. Enter the resolution details."],["7","Escalate Overdue Ticklers","If a customer is not responding or a balance is significantly overdue, escalate per Adleta's collection policy. Document escalation in the tickler."]],quiz:[{q:"Tickler notes in M3 AR are primarily used for:",options:["Recording GL journal entries","Accounts receivable collection follow-up tracking","Entering new customer orders","Processing AP payments"],answer:1},{q:"A tickler note should include at minimum:",options:["Just the customer number","Note text, follow-up date, and assigned collector","Only the invoice amount","The vendor name"],answer:1},{q:"Invoice-level ticklers differ from account-level ticklers because:",options:["They cost more to process","They are tied to a specific invoice rather than the full account","They can only be created by managers","They expire automatically"],answer:1},{q:"After resolving a collection issue, you should:",options:["Delete the tickler note","Leave the tickler open indefinitely","Close the tickler with a resolution note","Create a new debit note"],answer:2}],checklist:["I can create a tickler note at the account and invoice level","I can assign tickler notes with due dates and priority","I can close a resolved tickler with a resolution note","I review open ticklers as part of my daily collection routine","I know how to escalate overdue ticklers per Adleta policy"]}]},
  logistics:{id:"logistics",name:"Logistics / Transportation",owner:"Abbey Parker",weeks:"Week 5-6",pill:"pill-blue",color:"#5b7fa6",programs:["OIS300","MWS410","MWS420","DRS001","OIS600"],summary:"Carrier setup, delivery management, shipment tracking, freight coordination, and logistics reporting.",links:[],sessions:[{id:"log-1",title:"Delivery Management and Shipment Tracking — OIS300 and MWS410",duration:"60 min",steps:[["1","Understand logistics in M3","Logistics in M3 connects warehouse fulfillment with carrier delivery. Your role is to ensure shipments leave with the right carrier, correct freight terms, and accurate tracking information."],["2","Open OIS300","Navigate to Sales > Shipment Processing > OIS300. This is where warehouse confirms shipments. Logistics reviews and coordinates carrier assignment at this stage."],["3","Review shipment details","For each shipment confirm: ship-to address, item, quantity, UOM, and requested delivery date. Flag any mismatches before the carrier is booked."],["4","Open MWS410","Navigate to Warehouse Management > Delivery > MWS410. This is the delivery toolbox — review deliveries ready for carrier pickup."],["5","Assign carrier","Select the delivery. Enter the carrier ID, service type (standard, express, freight), and freight terms (prepaid, collect, third party)."],["6","Enter tracking number","Once the carrier picks up, enter the carrier tracking number on the delivery record. This connects the physical shipment to the M3 record."],["7","Confirm delivery","Press F5 to confirm. M3 updates the order status to shipped and the tracking number is available to Sales / CS for customer inquiries."],["8","Handle exceptions","If a carrier cannot pick up on time: contact Sales / CS immediately. If a shipment is damaged in transit: log issue with carrier name, tracking number, delivery reference, and business impact."]],videoUrl:"",quiz:[{q:"Before booking a carrier for a shipment, you must verify:",options:["The GL account for freight expense","Ship-to address, item, quantity, UOM, and requested delivery date are correct","The customer's credit status","The purchase order is approved"],answer:1},{q:"Freight terms Prepaid means:",options:["The customer pays freight at delivery","Adleta pays freight and the cost is included in the invoice","A third party account is billed","Freight is free"],answer:1},{q:"After a carrier picks up a shipment, you must:",options:["Wait for the customer to confirm receipt","Enter the carrier tracking number on the delivery record in M3","Call the warehouse to confirm","Create a new sales order for the next shipment"],answer:1},{q:"If a carrier cannot pick up on time, your first action is:",options:["Cancel the shipment","Contact Sales / CS immediately so they can communicate with the customer","Wait until the next day","Re-assign the order to a different warehouse"],answer:1}],checklist:["I can review deliveries ready for carrier pickup in MWS410","I can assign a carrier, service type, and freight terms to a delivery","I always enter the tracking number after carrier pickup","I know how to confirm a delivery and update the order status in M3","I know the exception process for late pickup or damaged shipment"]},{id:"log-2",title:"Freight Coordination and Logistics Reporting — OIS600",duration:"45 min",steps:[["1","Understand your reporting role","As the logistics super user you own visibility into shipment status, on-time delivery, and freight cost. You are the first person to know when something is delayed or missing."],["2","Open OIS600 — Shipment Status Report","Navigate to Sales > Reports > OIS600. Enter a date range. Review orders by shipment status: confirmed, in transit, delivered, and exceptions."],["3","Identify unconfirmed shipments","Filter for orders that are released to warehouse but not yet shipped. These are at risk of missing the customer's requested delivery date. Contact Warehouse if overdue."],["4","Identify in-transit exceptions","Review any shipments flagged as delayed by the carrier. Cross-reference with tracking numbers. Log each exception with carrier, tracking number, customer, and expected resolution date."],["5","Review freight costs","If freight cost reporting is available, review cost by carrier and service type. Flag shipments where actual freight significantly exceeds expected cost."],["6","Communicate proactively","For any shipment that will miss its delivery date, notify Sales / CS before the customer calls. Include: order number, expected new delivery date, and reason."],["7","Build your daily rhythm","Each morning: review open shipments due today. Check for unconfirmed pickups. Verify yesterday's shipments are showing tracking activity. Escalate anything that is stuck."],["8","Log and escalate","Log all carrier exceptions, damages, and delays in the issue log with priority, owner, and resolution. Escalate High priority issues — anything blocking a customer delivery — to KRISTENB same day."]],videoUrl:"",quiz:[{q:"An order that is released to warehouse but not yet shipped and is past its requested delivery date should be:",options:["Cancelled and re-entered","Escalated to Warehouse and flagged for the customer","Left until the customer calls","Reassigned to a different carrier automatically"],answer:1},{q:"Your primary job when a shipment will miss its delivery date is:",options:["Wait for the customer to call and then explain","Notify Sales / CS proactively before the customer calls","Update the delivery date in M3 without telling anyone","Contact Infor support"],answer:1},{q:"A High priority logistics issue is one that:",options:["Is a question about carrier setup","Involves a small quantity overage","Blocks a customer delivery","Is a freight cost question"],answer:2},{q:"The OIS600 report shows:",options:["Financial statements for freight expense","Shipment status — confirmed, in transit, delivered, and exceptions — by date range","Inventory stock balances by warehouse","Supplier invoice payment status"],answer:1}],checklist:["I can run OIS600 and identify unconfirmed, in-transit, and exception shipments","I review open shipments each morning as part of my daily rhythm","I notify Sales / CS proactively when a delivery will be late — before the customer calls","I log all carrier exceptions with carrier name, tracking number, customer, and resolution","I know when to escalate a logistics issue to KRISTENB same day"]},{id:"log-3",title:"Carrier Setup and Freight Cost Management — MWS420",duration:"45 min",steps:[["1","Understand carrier master","Every carrier Adleta uses must exist as an active carrier record in M3 before it can be assigned to a delivery. The carrier record controls default service types, freight terms, and contact information."],["2","Open MWS420","Navigate to Warehouse Management > Carrier > MWS420. Press F3 to create a new carrier or enter an existing carrier ID to review."],["3","Review existing carriers","Before adding a new carrier, search for the carrier name to confirm it does not already exist under a different ID. Duplicate carrier records cause reporting errors and split freight history."],["4","Set up a new carrier record","Enter carrier ID, name, contact information, and default service type. Confirm the carrier ID format with IT — Adleta uses a consistent naming convention. Set status to Active."],["5","Configure freight terms","On each delivery you can override the default freight terms. The three main terms are: Prepaid (Adleta pays, cost billed to customer), Collect (customer pays carrier directly), Third Party (billed to a third-party freight account). Confirm which term applies to each customer type."],["6","Review freight cost visibility","If freight costs are captured in M3, open OIS600 and review freight cost by carrier and service type. Identify carriers with higher-than-expected cost per shipment. Flag significant cost increases to management."],["7","Carrier performance tracking","Track on-time pickup rate, damage claims, and tracking accuracy by carrier. If a carrier consistently misses pickups or has high damage rates, document the pattern and raise with management for carrier review."],["8","Keep carrier records current","Update carrier records when contact information or service terms change. Inactivate carriers that are no longer used — do not delete. This preserves freight history for reporting and audit."]],videoUrl:"",quiz:[{q:"Before adding a new carrier in MWS420, you should first:",options:["Call the carrier to confirm they can use M3","Search for the carrier name to confirm it does not already exist under a different ID","Get approval from Finance","Create a test delivery"],answer:1},{q:"Freight terms Collect means:",options:["Adleta pays freight and bills the customer","The customer pays the carrier directly","A third-party account is billed","Freight is included in the product price"],answer:1},{q:"If a carrier consistently misses pickups or has high damage rates, you should:",options:["Immediately delete the carrier from M3","Continue using them until a better option is found","Document the pattern and raise it with management for carrier review","Only use them for low-priority shipments"],answer:2},{q:"When a carrier is no longer used, you should:",options:["Delete the carrier record","Inactivate the carrier — do not delete, to preserve freight history","Leave it active but stop using it","Archive it to SharePoint"],answer:1}],checklist:["I can set up a new carrier record in MWS420 with correct ID, name, service type, and status","I check for duplicate carrier records before creating a new one","I understand the three freight term types — Prepaid, Collect, and Third Party","I can identify freight cost variances in OIS600 and know when to escalate","I track carrier performance — on-time, damage, tracking accuracy — and document patterns","I inactivate unused carriers rather than deleting them to preserve history"]},{id:"log-4",title:"Will Call — Pick, Pack, and Issue",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Pick%20pack%20issue%20WC.mp4",steps:[["1","Receive the Will Call Order","Receive the Will Call order from Customer Service. Order is in picking status in M3."],["2","Print the Pick List","Open the picking program (MWS420 or warehouse picking program). Print or view the pick list for the Will Call order."],["3","Pick Items from Warehouse","Pick items from the warehouse locations per the pick list. Verify item numbers, quantities, and warehouse locations."],["4","Pack the Order","Pack the items for customer pickup. Stage at the Will Call counter or designated staging area."],["5","Confirm Pick Quantities in M3","In M3, confirm the picked quantities for the order. Correct any short picks or substitutions."],["6","Issue the Delivery at Delivery Level","Navigate to the delivery in M3. Issue the delivery at the delivery level — NOT the shipment level. No dock assignment or load building required."],["7","Customer Picks Up","Verify customer identity and order details. Hand over staged goods."],["8","Delivery Confirmed — Inventory Decremented","M3 decrements inventory automatically when the delivery is issued. The order cycle is complete."]],quiz:[{q:"Will Call orders are issued at which level in M3?",options:["Shipment level","Load level","Delivery level","Invoice level"],answer:2},{q:"Why do Will Call orders not require load building?",options:["Will Call orders are too small for load planning","The customer picks up at the warehouse — no truck loading needed","IT disabled load building for Will Call","The warehouse team skips this step"],answer:1},{q:"When is inventory decremented for a Will Call order?",options:["When the pick list is printed","When the customer confirms by phone","When the delivery is issued in M3","At month-end inventory close"],answer:2},{q:"After issuing the Will Call delivery, the next step is:",options:["Create a new order for the customer","Process an AP invoice","The order cycle is complete — inventory is decremented","Submit for supervisor approval"],answer:2}],checklist:["I can locate and print a Will Call pick list in M3","I can confirm pick quantities in M3 after picking","I can issue a Will Call delivery at the delivery level","I understand Will Call does not require load building or dock assignment","I know how to stage orders for customer pickup"]},{id:"log-5",title:"Common Carrier — Shipment Processing",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Common%20carrier%20scenario.mp4",steps:[["1","Receive the Common Carrier Order","Order is released for picking from Customer Service. Confirm delivery method is CC in M3."],["2","Print Pick List and Pick Items","Print the pick list. Pick items from warehouse locations, verifying item numbers and quantities."],["3","Pack and Stage for Carrier","Pack items securely for common carrier shipment. Stage in the carrier staging area."],["4","Issue Delivery at Delivery Level","In M3, issue the delivery at the delivery level — not the shipment level. Use desktop or RF handheld device."],["5","Obtain Tracking Number","Obtain the tracking number from the carrier or TMS system when the carrier picks up."],["6","Enter Tracking Number in M3","Enter the tracking number at the delivery level in M3. This creates the shipment record and links tracking to the customer order."],["7","Update Delivery Address if Needed","If a delivery address change is needed, it MUST be done before issuing the delivery. Use system shortcuts to update."],["8","AR Invoice is Triggered","After the delivery is issued, M3 automatically triggers the AR invoice to the customer. The Order to Cash cycle is complete."]],quiz:[{q:"Common Carrier deliveries are issued at the:",options:["Shipment level","Delivery level","Load level","Order header level"],answer:1},{q:"Tracking numbers for Common Carrier shipments are entered in M3 at the:",options:["Order header","Invoice","Pick list","Delivery level"],answer:3},{q:"A delivery address change must be completed:",options:["After issuing the delivery","At any time up to invoicing","Before issuing the delivery","Only by a Finance user"],answer:2},{q:"After a Common Carrier delivery is issued in M3, what happens automatically?",options:["A PO is created","The AR invoice is triggered","The item is back-ordered","The pick list is reprinted"],answer:1}],checklist:["I can process a Common Carrier pick and pack workflow","I can issue a Common Carrier delivery at the delivery level in M3","I can enter a tracking number at the delivery level","I know how to update a delivery address before issuing","I understand that issuing the delivery triggers the AR invoice"]}]},
  productManagement:{id:"productManagement",name:"Product Management",owner:"Lauren Calvey",weeks:"Week 5-6",pill:"pill-gray",color:"#7a5ea6",programs:["MMS060","MMS001","MMS002","OIS010","MMS200"],summary:"Item master setup and maintenance, product lifecycle, pricing structures, and product catalog management in M3.",links:[],sessions:[{id:"prd-1",title:"Item Master Setup and Maintenance — MMS060",duration:"60 min",steps:[["1","Understand the item master","Every product Adleta buys, sells, or stocks must exist as an active item in MMS060 before it can appear on a PO, sales order, or inventory transaction. The item record is the foundation of every department's work."],["2","Open MMS060","Navigate to Inventory > Item Master > MMS060. Press F3 to create a new item or enter an existing item number to review."],["3","Enter item number and description","Item numbers follow the Adleta naming convention — confirm the standard with your manager before creating new items. Description must be clear and consistent."],["4","Set item status","New items start at status 10 (Pending). Change to status 20 (Active) only after all required fields are complete and the item is approved. Inactive items use status 90."],["5","Set unit of measure","UOM is critical for flooring products — confirm whether the item sells in SQF, BOX, RL, EA, or PLT. Incorrect UOM causes errors on POs, sales orders, and inventory counts."],["6","Set item category and type","Item category controls how M3 handles the item in purchasing, inventory, and sales. Confirm the correct category with IT or your implementation team."],["7","Set stock method","Choose whether the item is stocked (held in warehouse) or non-stocked (purchased on demand). This affects replenishment, forecasting, and reporting."],["8","Save and verify","Press Enter to save. Open MMS200 to confirm the item appears in inventory with zero stock balance. Verify the item can be added to a test PO and sales order before marking it fully active."]],videoUrl:"",quiz:[{q:"Before an item can be used on a PO or sales order, its status in MMS060 must be:",options:["10 — Pending","20 — Active","90 — Inactive","Any status is acceptable"],answer:1},{q:"Unit of measure on an item record is critical because:",options:["It only affects the purchase order","It affects POs, sales orders, inventory counts, pricing, and reporting — an incorrect UOM causes errors across all departments","It is only used for reporting","Finance sets it separately from the item record"],answer:1},{q:"A non-stocked item in M3 means:",options:["The item is discontinued","The item is purchased on demand and not held in warehouse inventory","The item has no price assigned","The item requires special handling"],answer:1},{q:"After creating a new item, you should verify it by:",options:["Sending an email to IT","Opening MMS200 to confirm it appears and testing it on a PO and sales order before marking it fully active","Printing the item record","Checking the GL account"],answer:1}],checklist:["I understand why the item master is the foundation for all department transactions","I can create a new item in MMS060 with the correct status, UOM, category, and stock method","I know the Adleta item numbering convention and confirm before creating new items","I verify new items in MMS200 and test on a PO and sales order before activating","I know the three key item statuses: Pending (10), Active (20), Inactive (90)"]},{id:"prd-2",title:"Product Lifecycle and Pricing Structure — MMS060 and OIS010",duration:"60 min",steps:[["1","Understand product lifecycle","Products move through stages: new, active, being phased out, and discontinued. M3 controls which transactions are allowed at each stage through item status. Your job is to keep item records accurate as products change."],["2","Managing a product change","When a product is updated — new description, UOM change, category change — do not delete the old record. Update it in MMS060 and document the change with a note and date."],["3","Discontinuing a product","When Adleta stops selling an item, set status to 90 (Inactive) in MMS060 only after confirming: no open POs, no open sales orders, and zero stock on hand. Contact Purchasing, Sales, and Warehouse before inactivating."],["4","Understand price list structure","Prices in M3 live in OIS010, not on the item record. An item can have different prices on different price lists — standard, promotional, customer-specific."],["5","Open OIS010","Navigate to Sales > Price List > OIS010. Select a price list and find an item. Review base price, effective date, expiry date, and UOM."],["6","Add or update an item price","Select the price list. Add the item number, price, effective date, and UOM. Set an expiry date if this is a promotional price. Save."],["7","Verify price on a sales order","Open OIS100, enter the customer and item. Confirm M3 pulls the correct price based on the customer's assigned price list. If the wrong price appears, check the customer's price list assignment in OIS017."],["8","Coordinate price changes","Price changes affect Sales, Finance, and customer communications. Notify KRISTENB and Sales before updating a price list that is assigned to active customers. Document the effective date and reason for every change."]],videoUrl:"",quiz:[{q:"To discontinue an item in M3, you set its status to 90. Before doing this you must confirm:",options:["The item has been in the system for at least one year","There are no open POs, no open sales orders, and zero stock on hand — and you have notified Purchasing, Sales, and Warehouse","Finance has approved the removal","IT has deleted the item from the price list"],answer:1},{q:"Item prices in M3 are stored in:",options:["MMS060 on the item record","OIS010 on the price list","MMS200 in the stock balance","GLS040 in the chart of accounts"],answer:1},{q:"If a sales order is pulling the wrong price for a customer, the first place to check is:",options:["The item record in MMS060","The customer's price list assignment in OIS017","The GL account","The purchase order"],answer:1},{q:"When making a price list change that affects active customers, you should:",options:["Make the change immediately and notify no one","Update the expiry date but leave the price alone","Notify KRISTENB and Sales before updating, document the effective date and reason","Wait until the end of the financial year"],answer:2}],checklist:["I understand the product lifecycle stages and how item status controls M3 transactions","I know the steps to safely discontinue a product — checking POs, orders, stock, and notifying departments","I can add and update item prices in OIS010 with correct effective and expiry dates","I verify price changes on a test sales order before communicating to the business","I document every price change with effective date and reason and notify affected teams in advance"]},{id:"prd-3",title:"Master Data Quality and New Product Launch Coordination",duration:"60 min",steps:[["1","Understand master data ownership","As Product Management super user, you own the accuracy of the item master. Bad item data — wrong UOM, wrong category, missing description, wrong status — creates errors in Purchasing, Warehouse, Sales, and Finance. Master data quality is not just a Product Management problem; it affects every department."],["2","Run a regular item master audit","Periodically review MMS060 for items that need attention: items with status 10 (Pending) that have been sitting for more than 30 days, items with missing descriptions, items with incorrect UOM, and items that are no longer sold but still show as Active."],["3","Check for duplicate items","Search MMS060 by description keyword to find potential duplicates. Duplicates cause split inventory history, pricing inconsistencies, and reporting errors. If duplicates exist, coordinate with IT and Purchasing before consolidating — do not inactivate without confirming which record is correct."],["4","Coordinate a new product launch","When Adleta adds a new product line: create the item record in MMS060 (status 10 while building). Confirm UOM, category, and stock method with Purchasing and Warehouse. Add the price in OIS010 with correct effective date. Notify Sales before the item goes Active — they need to know it is available to sell."],["5","Communicate launch timing","Product Management owns the launch checklist: item created, UOM confirmed, price set, Purchasing notified to set up supplier, Warehouse notified to receive first stock, Sales notified of availability date. All five must be complete before status changes to 20 (Active)."],["6","Handle item substitutes and alternates","When a product is temporarily out of stock or discontinued, Sales may need a substitute. Document known substitutes on the item record notes field and share with Sales. Communicate lead time and availability differences so Sales can set correct customer expectations."],["7","Manage seasonal and promotional items","Seasonal items should be set up well in advance — confirm with Purchasing on lead times. Set the item price in OIS010 with a specific effective date and expiry date. After the season ends, inactivate if it will not return, or leave Active with no open orders if it will return next season."],["8","Document everything","Every item creation, status change, UOM change, and price change must be documented: who made the change, when, and why. Use the Notes field in MMS060 and the team SharePoint folder. This protects the business during audits and helps troubleshoot issues when something unexpected happens downstream."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Turn%20Off%20MRP%20on%20item%20when%20discontinued%20Sts-50.mp4",quiz:[{q:"Before a new item's status is changed to Active (20) in MMS060, which five things must be complete?",options:["Item number, color, weight, size, and brand","Item created, UOM confirmed, price set, Purchasing and Warehouse notified, Sales notified of availability","IT approval, Finance approval, manager sign-off, legal review, and vendor contract","Item created, test order placed, shipped, invoiced, and paid"],answer:1},{q:"If you find a potential duplicate item in MMS060, you should:",options:["Immediately inactivate the newer one","Coordinate with IT and Purchasing to confirm which record is correct before taking action","Delete both and start over","Leave it — duplicates are normal in M3"],answer:1},{q:"Item substitutes for out-of-stock products should be:",options:["Handled verbally between Sales reps without any documentation","Documented in the item record notes and shared with Sales, including lead time and availability differences","Created as new item records in MMS060","Entered as returns in OIS390"],answer:1},{q:"A seasonal item whose price expires at end of season should be handled by:",options:["Deleting the price record after the season","Setting an expiry date on the price in OIS010 when the price is created — not managing it manually after the fact","Leaving the old price active until the next season starts","Contacting Finance to remove the price"],answer:1}],checklist:["I understand my role as master data owner and how item data quality affects every department","I can run a regular item master audit and identify items needing attention in MMS060","I know the five-step new product launch checklist before changing status to Active","I document all item changes with who, when, and why — in MMS060 notes and SharePoint","I know how to handle item substitutes and communicate them to Sales with lead time differences","I manage seasonal item prices with correct effective and expiry dates in OIS010"]}]},
  week9:{id:"week9",name:"Trainer Readiness and Go-Live Prep",owner:"All super users",weeks:"Week 9",pill:"pill-red",color:"#c0443b",programs:["Teams","SharePoint","Issue Log","Planner"],summary:"Teach-backs, readiness sign-off, FAQ build, go-live support roles, department training handoff, and stabilization.",links:[["Teach-Back Packet",SP+"/Week_9_Teach_Back_Readiness_Signoff_Packet.md"],["Go-Live Playbook",SP+"/Go_Live_Support_Playbook.md"],["Department Handoff Plan",SP+"/Department_Training_Handoff_Plan.md"]],sessions:[{id:"w9-1",title:"Teach-Back Preparation",duration:"60 min",steps:[["1","Review your module","Open your module in the portal and review every session, step, quiz, and checklist. Identify any gaps before your teach-back."],["2","Know your 15-minute structure","2 min: explain the department workflow. 5 min: walk through key M3 programs. 3 min: explain one exception and first response. 2 min: explain a department handoff. 2 min: give a practice question you would ask users. 1 min: confirm escalation path."],["3","Prepare your normal scenario","Choose one complete normal workflow you can walk through live in M3 — from opening the program to saving the transaction."],["4","Prepare your exception scenario","Choose one common exception in your module. Know the steps: identify it, who to contact, how to log it."],["5","Prepare your handoff","Name one department that hands off to you and one you hand off to. Know what data must be correct at each handoff."],["6","Prepare a department training tip","Think about one thing your department users will find confusing. Plan how you would explain or demonstrate it."],["7","Practice with a peer","Run through your 15-minute teach-back with another super user. Time yourself. Get feedback on clarity."],["8","Review the rubric","Passing requires average 2.5 or higher across all criteria and no score of 1 in navigation, transaction accuracy, or trainer readiness."]],videoUrl:"",quiz:[{q:"The teach-back format is 15 minutes. The first 2 minutes should cover:",options:["Walking through every screen in your module","Explaining the department workflow in plain business language","Reading from your training notes","Showing the issue log template"],answer:1},{q:"The passing standard for the teach-back rubric is:",options:["Perfect scores on all criteria","Average of 2.5 or higher and no score of 1 in navigation, accuracy, or trainer readiness","Completing all sessions in the portal","Attending all 9 weeks of training"],answer:1},{q:"If you are scored 1 (Not Ready) on System Navigation, you:",options:["Still pass if your other scores are high enough","Do not pass regardless of other scores","Can retake only that section","Are automatically assigned to IT support"],answer:1},{q:"The best way to prepare for your teach-back is:",options:["Memorize the program codes","Practice the full 15-minute walkthrough with a peer and time yourself","Read the training documents the night before","Ask Kristen to show you the workflow again"],answer:2}],checklist:["I have reviewed every session, step, and checklist in my assigned module","I know my 15-minute teach-back structure","I have a normal scenario I can walk through live in M3","I have an exception scenario with the correct handling steps","I know my upstream and downstream department handoffs","I have practiced with a peer and received feedback","I understand the rubric and passing standard"]},{id:"w9-2",title:"Teach-Back and Readiness Sign-Off",duration:"90 min",steps:[["1","Deliver your 15-minute teach-back","Present to KRISTENB and the group. Follow the structure: workflow, programs, exception, handoff, practice question, escalation path."],["2","Receive rubric scores","KRISTENB scores each criteria 1-3. Listen for feedback. Do not argue — note coaching items for remediation."],["3","Review readiness decision","Ready: proceed to department training plan. Ready With Coaching: targeted remediation assigned before go-live. Not Ready: additional training scheduled with backup support assigned."],["4","Build your FAQ contribution","Write 3-5 questions your department users are likely to ask. Include the correct answer and which program or step it relates to. Submit to the shared FAQ."],["5","Review open issues","Go through the issue log. For each open item in your module: confirm owner, confirm resolution path, and flag anything that could block go-live."],["6","Sign readiness acknowledgment","Complete the readiness acknowledgment form: name, department, module, readiness status, required remediation, and signature. Manager countersigns."],["7","Confirm department training date","Lock in the date, location, and attendee list for your department training session. Confirm practice data is ready."]],videoUrl:"",quiz:[{q:"If you receive a readiness status of Ready With Coaching, your next step is:",options:["Wait for go-live and figure it out on the job","Complete assigned remediation and retest the weak area before go-live","Start training your department immediately","Request a different module assignment"],answer:1},{q:"Your FAQ contribution should include:",options:["Every possible M3 question","3-5 likely questions from your department users with correct answers and program references","Only questions you personally had during training","A copy of all training documents"],answer:1},{q:"The readiness acknowledgment confirms that you:",options:["Scored perfectly on all quizzes","Attended every training session without absence","Completed training, practiced, finished your teach-back, and understand your go-live responsibility","Have read all SharePoint documents"],answer:2},{q:"Before your department training session, you must confirm:",options:["That all super users have passed their teach-backs","Training date, attendees, practice data, and that your known issues are documented","That the portal has been updated","That IT has finished the system configuration"],answer:1}],checklist:["I delivered my 15-minute teach-back","I received my rubric scores and understand any coaching feedback","I know my readiness status — Ready, Ready With Coaching, or Not Ready","I submitted 3-5 FAQ contributions with correct answers","I reviewed all open issues in my module and confirmed owners","I signed the readiness acknowledgment","My department training date and attendee list are confirmed"]},{id:"w9-3",title:"Go-Live Support and Department Handoff",duration:"60 min",steps:[["1","Know your support tier","You are Tier 1 — first-line support for your department. Handle how-to questions, navigation, and known workarounds. Escalate to KRISTENB (Tier 2) when an issue blocks work, affects data, or needs a configuration change."],["2","Know the issue log fields","Every issue must include: date/time, department, reported by, program, process, what happened, steps tried, business impact, priority (High/Medium/Low), owner, status, and resolution."],["3","Understand issue priority","High: blocks orders, shipments, receiving, invoicing, payment, or period close — same day triage. Medium: workaround exists but slows work — 1-2 days. Low: question, training gap, or enhancement — weekly review."],["4","Know the daily go-live rhythm","Start of day: review open high-priority issues. Midday: check blockers. End of day: review resolved items and FAQ updates. Report to KRISTENB if anything is blocking your department."],["5","Confirm your floor support availability","Know your agreed support hours during go-live week. Keep your module guide and quick reference open. Use training materials before guessing."],["6","Review your department training handoff checklist","Confirm: department user list, training date, quick reference ready, practice scenario ready, known issues documented, escalation path shared, sign-off method confirmed."],["7","Avoid unauthorized changes","Never make data or configuration changes in production without approval. Log the issue and escalate. Document everything."],["8","Post go-live stabilization","For the first 2-4 weeks: continue daily issue review, track repeated training gaps, update job aids weekly, hold department check-ins, review open items with leadership weekly."]],videoUrl:"",quiz:[{q:"As a Tier 1 super user, you should escalate an issue to KRISTENB when:",options:["A department user asks a how-to question","The issue blocks work, affects data, or requires a configuration or security change","Someone is confused about navigation","You want to update the FAQ"],answer:1},{q:"A High priority issue is one that:",options:["Is annoying but has a workaround","Blocks orders, shipments, receiving, invoicing, payment, or period close","Is a training gap or question","Was logged more than once"],answer:1},{q:"If a department user asks you how to do something and you are not sure, you should:",options:["Give your best guess","Tell them to call IT","Check your training materials first before answering","Ignore the question until you are certain"],answer:2},{q:"During the post go-live stabilization period, repeated questions should become:",options:["Ignored after the first week","FAQ updates and job aid improvements","Escalations to Infor support","New training sessions from scratch"],answer:1}],checklist:["I know my support tier and what I handle vs what I escalate","I can create a complete issue-log entry with all required fields","I know the three priority levels and response expectations","I know the daily go-live rhythm and when to report to KRISTENB","I have confirmed my floor support availability during go-live week","My department training handoff checklist is complete","I understand I must never make unauthorized data or configuration changes in production"]}]},
  endToEnd:{id:"endToEnd",name:"End-to-End Process Walkthroughs",owner:"All super users",weeks:"Week 8",pill:"pill-gold",color:"#c49a2a",programs:["CRS610","CRS620","PPS200","PPS300","OIS100","OIS300","APS100","APS200","ARS100","ARS200","MMS200"],summary:"Full cross-functional walkthroughs connecting Purchasing, Warehouse, Sales, and Finance through Procure to Pay and Order to Cash.",links:[["Procure to Pay Packet",SP+"/Week_8_Procure_to_Pay_Walkthrough_Packet.md"],["Order to Cash Packet",SP+"/Week_8_Order_to_Cash_Walkthrough_Packet.md"]],sessions:[{id:"w8-1",title:"Procure to Pay — Full Walkthrough",duration:"90 min",steps:[["1","Verify supplier — CRS620","Purchasing opens CRS620 and confirms the supplier is active, has payment terms, and is ready for a PO."],["2","Create PO header — PPS200","Purchasing opens PPS200, presses F3 for a new PO. Enters supplier, PO type, buyer, warehouse, and requested delivery date."],["3","Add PO lines — PPS201","Purchasing adds at least two lines: item number, quantity, UOM, price, and delivery date. Records the PO number assigned by M3."],["4","Approve and release PO","Purchasing confirms the PO status is released/ready per Adleta rules before communicating to the supplier."],["5","Receive goods — PPS300","Warehouse opens PPS300, finds the PO, verifies packing slip against PO items and quantities, enters actual received quantities, and confirms. Records receipt number."],["6","Verify inventory update — MMS200","Warehouse opens MMS200 and confirms the received item shows updated on-hand and available balances."],["7","Enter supplier invoice — APS100","Finance AP opens APS100, enters the supplier invoice referencing the PO number. Enters invoice date, amount, and runs F14 three-way match."],["8","Resolve match result","If matched: invoice is auto-approved. If variance: Finance AP contacts Purchasing (price issue) or Warehouse (quantity issue) to resolve before payment."],["9","Create payment proposal — APS200","Finance AP opens APS200, includes the approved invoice in a payment proposal. Reviews before processing."],["10","Debrief — handoff questions","Group discusses: what must each department get right for the next step to work? Where do delays or errors originate?"]],videoUrl:"",quiz:[{q:"Before Warehouse can receive goods, Purchasing must ensure:",options:["The invoice is already entered in APS100","The PO is released and the supplier, item, quantity, and UOM are correct","The payment proposal is approved","Inventory is at zero for that item"],answer:1},{q:"The three-way match in APS100 compares:",options:["PO, receipt, and supplier invoice","PO, customer order, and payment","Supplier invoice, GL account, and payment","PO, warehouse, and freight invoice"],answer:0},{q:"A quantity variance on the three-way match means:",options:["The supplier invoice price is wrong","The invoice quantity does not match what was received","The PO was not released","Finance entered the wrong supplier number"],answer:1},{q:"Which department owns resolving a price variance between the PO and the supplier invoice?",options:["Warehouse","Finance AR","Purchasing and Finance AP together","IT"],answer:2}],checklist:["I can trace all 10 steps of the Procure to Pay process","I understand what each department must get right before the handoff","I can identify whether a match exception is a price variance or quantity variance","I know who to contact to resolve each type of exception","I completed a proof-of-completion entry with supplier, PO, receipt, and invoice references"]},{id:"w8-2",title:"Order to Cash — Full Walkthrough",duration:"90 min",steps:[["1","Verify customer — CRS610","Sales / CS opens CRS610 and confirms the customer is active, reviews payment terms, price list, and credit status."],["2","Create order header — OIS100","Sales / CS opens OIS100, presses F3 for a new order. Enters customer number, order type, ship-to address, requested delivery date, and customer PO number."],["3","Add order lines — OIS101","Sales / CS adds at least two lines: item, quantity, UOM, price, and delivery date. Verifies M3 auto-populated the correct price from the customer's price list."],["4","Check availability — MMS200","Sales / CS or Warehouse checks available quantity in MMS200. If stock is short, a backorder decision is made and communicated to the customer before proceeding."],["5","Confirm shipment — OIS300","Warehouse opens OIS300, finds the order, verifies items and ship-to address, enters actual shipped quantities, ship date, and carrier/tracking. Presses F5 to confirm — inventory updates and invoice is triggered."],["6","Review customer invoice — ARS100","Finance AR opens ARS100, locates the invoice generated from the shipment. Verifies customer, order number, shipped quantity, and invoice amount."],["7","Apply customer payment — ARS200","Finance AR opens ARS200, enters the customer payment, and applies it to the correct invoice. Verifies the invoice balance clears to zero."],["8","Review aging if needed — ARS300","Finance AR opens ARS300 to confirm the customer's aging is updated. Flags any remaining overdue balances for follow-up."],["9","Handle exception — backorder or credit hold","If backorder: Sales / CS documents and communicates delay. If credit hold: Sales / CS stops and contacts Finance AR before any customer communication."],["10","Debrief — handoff questions","Group discusses: where do customer-facing problems start? Where do financial problems start? What does each department need from the previous step?"]],videoUrl:"",quiz:[{q:"Before Warehouse can ship an order, Sales / CS must ensure:",options:["The payment is already collected","The customer invoice is generated","The customer order has correct items, quantities, ship-to address, and requested date","The AR aging is reviewed"],answer:2},{q:"Confirming a shipment in OIS300 automatically:",options:["Creates a new customer order","Updates inventory and triggers the customer invoice","Sends an email to the customer","Closes the customer account"],answer:1},{q:"If a customer is on credit hold, Sales / CS should:",options:["Ship the order and let Finance sort it out","Contact the customer directly to collect payment","Stop order processing and contact Finance AR before any customer communication","Cancel the order without notifying anyone"],answer:2},{q:"Applying a customer payment in ARS200 to the wrong invoice causes:",options:["No problem — it can be corrected later without impact","The correct invoice to remain open and appear overdue, possibly triggering a credit hold","The payment to be lost","The order to be cancelled"],answer:1}],checklist:["I can trace all steps of the Order to Cash process from customer order to payment","I understand what each department must get right before the handoff","I know how to handle a backorder — availability check, decision, and customer communication","I know the credit hold process and that Sales / CS must contact Finance before communicating with the customer","I completed a proof-of-completion entry with customer, order, shipment, invoice, and payment references"]}]},
  reporting:{id:"reporting",name:"Pricing and Reporting",owner:"Jeanell Coral",weeks:"Week 7",pill:"pill-gray",color:"#344b5f",programs:["OIS600","OIS620","OIS017","OIS010","MMS600","ARS300","GLS990"],summary:"Price lists, customer pricing, price overrides, standard reports, exports, scheduled reports, and KPI dashboards.",links:[["Deck",SP+"/Adleta_M3_Reporting_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Reporting_LearningGuide.docx"]],sessions:[{id:"rep-1",title:"Running Reports and Scheduling",duration:"45 min",steps:[["1","Navigate to Report","Find in relevant module Reports submenu"],["2","Enter Parameters","Date range, customer, item, warehouse as needed"],["3","Press F5","M3 generates the report"],["4","Filter and Sort","Use filter bar and column headers to refine"],["5","Export","Press F17 to export to Excel"],["6","Schedule","Open Report Scheduler, set frequency, time, and email recipients"],["7","Save as Favorite","Save with standard parameters for quick future access"]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Content%20Overview%20Workshop.mp4",quiz:[{q:"The keyboard shortcut to export a report to Excel is:",options:["F5","F6","F14","F17"],answer:3},{q:"The Back Order report in M3 is found at:",options:["OIS600","OIS620","MMS600","ARS300"],answer:1},{q:"When scheduling an automated report, the best run time is:",options:["Midnight","Early morning so results are ready at start of day","End of day","Whenever the server is least busy"],answer:1}],checklist:["I can run a standard report with filters in M3","I can export results to Excel","I have scheduled at least one report to run automatically","I have saved my most-used reports as Favorites"]},{id:"rep-2",title:"Price Lists and Customer Pricing — OIS017 and OIS010",duration:"60 min",steps:[["1","Open OIS010","Navigate to Sales > Price List > OIS010. This is where Adleta's standard price lists are defined."],["2","Review a price list","Enter a price list ID and press Enter. Review item pricing, effective dates, and currency."],["3","Check item price on a list","Find a specific item on the price list. Note base price, UOM, and any quantity break tiers."],["4","Open OIS017","Navigate to Sales > Customer Price — OIS017. This shows pricing assigned to a specific customer."],["5","Look up a customer's price list","Enter the customer number. M3 shows which price list is assigned and any customer-specific overrides."],["6","Understand price hierarchy","M3 applies pricing in this order: customer-specific price → customer price list → standard price list → item base price."],["7","Check a price on a sales order","Open OIS100, enter a customer and item. M3 auto-populates the price. Verify it matches the expected price list."],["8","Process a price override","On an order line in OIS101, manually change the price. M3 requires a reason code and may require manager approval depending on Adleta rules."],["9","Document exceptions","Any price override must be noted in the order or issue log with customer name, item, approved price, and authorizer."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Visualizer%20workshop.mp4",quiz:[{q:"In M3, customer-specific pricing takes priority over:",options:["All other pricing — it is always the highest priority","The standard price list assigned to that customer","Item base price only","Nothing — all prices are equal"],answer:0},{q:"Where do you look to see which price list is assigned to a specific customer?",options:["MMS060","OIS010","OIS017","ARS100"],answer:2},{q:"A price override on a sales order line requires:",options:["Nothing — anyone can change prices freely","A reason code and possibly manager approval","A new price list to be created","IT to unlock the field"],answer:1},{q:"Effective dates on a price list mean:",options:["The price list was created on that date","The pricing is only valid within that date range — orders outside the range use a different list","The price list expires and must be recreated","The customer must order before that date"],answer:1}],checklist:["I can look up a standard price list in OIS010 and find item pricing","I can check which price list is assigned to a customer in OIS017","I understand the M3 price hierarchy and which price wins","I can verify the price on a sales order matches the expected price list","I know the process for a price override including required approvals"]},{id:"rep-3",title:"KPI Dashboards and Management Reporting",duration:"45 min",steps:[["1","Identify your key reports","Work with your manager to confirm which reports you own and review on a daily, weekly, and monthly basis."],["2","Open the Sales Order Status report — OIS600","Navigate to Sales > Reports > OIS600. Enter date range and customer or item filters. Review open orders, shipped, and back orders."],["3","Open the Back Order report — OIS620","Navigate to Sales > Reports > OIS620. Filter by item or customer. Use this to prioritize fulfillment and communicate delays."],["4","Open the Inventory Balance report — MMS600","Navigate to Inventory > Reports > MMS600. Review on-hand, allocated, and available by item and warehouse."],["5","Build your daily rhythm","Decide which reports to run each morning. Save each with your standard parameters as a Favorite so you can open and run in one click."],["6","Set up scheduled delivery","For reports needed by management, use the Report Scheduler to send results automatically by email each morning."],["7","Identify KPIs to track","Work with management to confirm the 3-5 KPIs your department owns — fill rate, order cycle time, inventory turns, on-time delivery, overdue AR, etc."],["8","Export and distribute","Press F17 to export. Paste into the management reporting template in SharePoint. Add brief commentary on variances over 10%."],["9","Escalate anomalies immediately","If a report shows a significant gap — large back order spike, inventory discrepancy, overdue AR surge — flag to your manager the same day."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Dashboards%20workshop.mp4",quiz:[{q:"OIS620 is used to:",options:["Enter new sales orders","Review back orders by item or customer","Run the GL income statement","Check supplier payment status"],answer:1},{q:"The best way to run the same report with the same parameters every day is:",options:["Re-enter all parameters manually each time","Save the report as a Favorite with standard parameters","Ask IT to run it for you","Export it once and reuse the Excel file"],answer:1},{q:"If a report shows a significant anomaly — like a large inventory discrepancy — you should:",options:["Wait until the end of the month to report it","Adjust the numbers in Excel before sharing","Flag it to your manager the same day","Ignore it if it resolves itself next period"],answer:2},{q:"KPIs your department owns should be:",options:["Tracked only at year end","Confirmed with management and reviewed on a regular cadence","Created independently without manager input","Only tracked by Finance"],answer:1}],checklist:["I know which reports I own and my review cadence — daily, weekly, monthly","I can run OIS600, OIS620, and MMS600 with correct filters","I have saved my standard reports as Favorites","I have scheduled at least one report for automatic delivery","I can identify and escalate a KPI anomaly on the same day I see it"]},
{id:"rep-4",title:"Purchasing & Inventory Reports",duration:"40 min",videoUrl:"",steps:[[1,"Open PUR 7 - Reorder Report","Navigate to Purchasing > PUR 7. Set facility, manufacturer, and buying category filters. Run daily to identify items that need reordering."],[2,"Open ROO 2 - Open Orders by Item","Navigate to ROO 2. Filter by item number to see backorders. Use this daily to monitor non-stock direct orders awaiting PO placement."],[3,"Open ROO 4 - Open Orders by Date","Navigate to ROO 4. Filter by date range and facility to see all direct open orders. Confirm statuses are correct."],[4,"Run Fill Rate Report","Access Fill Rate from the Purchasing menu. Review daily to measure how well stock meets customer demand."],[5,"Run Stock Status - RIV 04","Navigate to RIV > Option 4. Enter warehouse and item filters. Review on-hand, committed, and available quantities."],[6,"Run Inventory Value and Aging - RIV 03","Navigate to RIV > Option 3. Set date range and warehouse. Use monthly for financial reconciliation."],[7,"Run Serial Number Listing - RIV 101","Navigate to RIV > Option 101. Filter by warehouse. Use to identify locked or suspended items needing attention."],[8,"Run Cycle Count Reports - CYC 2, 4, 5","CYC 2: Create cycle count tickets. CYC 4: Print counts and variance report. CYC 5: Post and update counts to make adjustments permanent. Run daily - minimum 15 counts per month."]],quiz:[{q:"Which report do you run daily to identify items that need reordering?",options:["RIV 04","PUR 7","ROO 2","CYC 2"],answer:1},{q:"ROO 2 is used to check open orders filtered by:",options:["Date range","Customer name","Item number","Warehouse"],answer:2},{q:"Which cycle count step posts adjustments and makes quantity changes permanent?",options:["CYC 2","CYC 4","CYC 5","RIV 101"],answer:2},{q:"RIV 03 - Inventory Value and Aging is primarily used for:",options:["Daily shipping","Financial reconciliation","Customer invoicing","Reorder planning"],answer:1}],checklist:["Can open and filter PUR 7 Reorder Report","Can run ROO 2 and ROO 4 open order reports","Can run Fill Rate Report","Can run Stock Status (RIV 04)","Can run Inventory Value and Aging (RIV 03)","Can run Serial Number Listing (RIV 101)","Can create, print, and post cycle counts (CYC 2/4/5)"]}

{id:"rep-5",title:"Finance and AR Reports",duration:"35 min",videoUrl:"",steps:[[1,"Run AR Summary Aging Report","Navigate to the AR menu. Run the AR Summary Aging (Terms Accounts) weekly to review open balances, reconcile, and identify accounts needing collection activity."],[2,"Run AR Detailed Aging - COD Accounts","Run the AR Detailed Aging for COD accounts weekly to match prepayments against open invoices and resolve discrepancies."],[3,"Run COD Report","Access COD Report daily. Provides drivers and office staff with all COD orders for the day. Run multiple times daily as needed."],[4,"Run Invoice Register","Navigate to the Invoice Register (POD Register) daily each morning. Confirm all signed Proof of Delivery documents are accounted for and invoiced."],[5,"Run AP History File Audits","Navigate to AP > History Audits. Run monthly to reconcile claims, freight, and direct ship accounts. Parameters: vendor number, invoice number, GL account."],[6,"Run GL Audit Trail","Access General Ledger > Audit Trail monthly. Shows all activity in a GL account for the month. Used to reconcile investment and claims accounts."],[7,"Run Order Desk Daily Cash Report","Run daily to verify all COD entries for the day are correct and balanced before close."],[8,"Review Past Due Items","Pull Past Due 60-day open items weekly. Focus collection on lines requiring phone calls, follow-up emails, and escalations."]],quiz:[{q:"The AR Summary Aging report for Terms Accounts should be run:",options:["Daily","Weekly","Monthly","Once per quarter"],answer:1},{q:"Which report confirms all signed POD documents are accounted for?",options:["COD Report","AR Detailed Aging","Invoice Register","GL Audit Trail"],answer:2},{q:"AP History File Audits are run monthly primarily to:",options:["Check open orders","Reconcile claims and freight accounts","Create purchase orders","Review inventory levels"],answer:1},{q:"The GL Audit Trail shows:",options:["Open customer orders","All activity in a GL account for the month","Vendor payment schedules","COD collection totals"],answer:1}],checklist:["Can run AR Summary Aging (Terms Accounts)","Can run AR Detailed Aging (COD Accounts)","Can run daily COD Report","Can run daily Invoice Register","Can run AP History File Audits monthly","Can run GL Audit Trail","Can run Order Desk Daily Cash Report","Can pull Past Due 60-day open items list"]}

{id:"rep-6",title:"Logistics and Transportation Reports",duration:"30 min",videoUrl:"",steps:[[1,"Print Customer Load Sheets - C1","Navigate to WAR 8 > C1. Run 10 or more times daily to generate load sheets for customer shipments. Provides warehouse staff with order details for picking and loading."],[2,"Print Customer Manifest - C3","Navigate to WAR 8 > C3. Generate daily manifests listing all customer orders on a route. Required before trucks depart."],[3,"Print Customer Packing Lists - C6","Navigate to WAR 8 > C6. Print packing lists and Proof of Delivery documents twice daily. Drivers carry these for customer sign-off."],[4,"Print Transfer Load Sheets - T1","Navigate to WAR 8 > T1. Check incoming and outgoing warehouse transfers by date range 4-5 times daily."],[5,"Run Shipping Analysis - DEL 10","Navigate to DEL 10. Run Shipments Analysis weekly to measure weights by ship via. Run On-Time Report monthly to track delivery performance."],[6,"Run WAR 10 - Ship Via and Order Status","Navigate to WAR 10. Check ship via assignments and order status 4 times daily to ensure orders are routing correctly."],[7,"Run Deliveries Report - RSA 14","Navigate to RSA 14. Run as needed to review customer delivery fees and identify accounts for route change analysis."],[8,"Run Customer Route Reports - RMF","Navigate to RMF 1 (Bill-To file), RMF 15 (Ship-To file), or RMF 108 (Customer Route and Delivery) as needed for route change requests."]],quiz:[{q:"Customer Load Sheets (C1) are typically printed how many times per day?",options:["Once","Twice","4-6 times","10 or more times"],answer:3},{q:"Which document do drivers carry for customer sign-off upon delivery?",options:["Customer Manifest","Transfer Load Sheet","Customer Packing List / POD","Shipping Analysis"],answer:2},{q:"DEL 10 Shipping Analysis is run weekly to measure:",options:["Inventory levels by location","Weights going to specific areas by ship via","Open customer orders","Transfer statuses"],answer:1},{q:"Which menu provides Customer Manifest, Load Sheets, and Packing Lists?",options:["DEL menu","RMF menu","WAR 8","ROO menu"],answer:2}],checklist:["Can print Customer Load Sheets (WAR 8 > C1)","Can generate Customer Manifest (WAR 8 > C3)","Can print Customer Packing Lists/PODs (WAR 8 > C6)","Can print Transfer Load Sheets (WAR 8 > T1)","Can run WAR 10 for ship via and order status","Can run DEL 10 Shipping Analysis","Can run RSA 14 Deliveries report","Can navigate RMF reports for route changes"]}
]}

function switchView(viewId){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));const el=document.getElementById("view-"+viewId);if(el)el.classList.add("active");const btn=document.querySelector(`[data-view="${viewId}"]`);if(btn)btn.classList.add("active");renderView(viewId);}
function renderView(v){const r={dashboard:renderDashboard,modules:renderModules,roadmap:renderRoadmap,superusers:renderSuperUsers,resources:renderResources,team:renderTeam,admin:renderAdmin};if(r[v])r[v]();}
function visibleModules(){if(currentUserData.role==="admin"||currentUserData.modules.includes("all"))return Object.values(MODULES);return currentUserData.modules.filter(id=>id!=="all-readonly").map(id=>MODULES[id]).filter(Boolean);}
function findSession(sid){for(const m of Object.values(MODULES)){const s=m.sessions.find(s=>s.id===sid);if(s)return s;}return null;}
function sessionProgress(sid){const s=findSession(sid);if(!s)return 0;const done=s.checklist.filter((_,i)=>ST[`chk-${sid}-${i}`]).length;return Math.round(done/s.checklist.length*100);}
function moduleProgress(mid){const m=MODULES[mid];if(!m||!m.sessions.length)return 0;const scores=m.sessions.map(s=>ST[`quiz-score-${s.id}`]||0);return Math.round(scores.reduce((a,b)=>a+b,0)/m.sessions.length);}
function renderDashboard(){const mods=visibleModules();const tot=mods.reduce((a,m)=>a+m.sessions.length,0);const done=mods.reduce((a,m)=>a+m.sessions.filter(s=>(ST[`quiz-score-${s.id}`]||0)>=70).length,0);let html=`<div class="metrics"><div class="metric"><div class="metric-val">${mods.length}</div><div class="metric-label">My Modules</div></div><div class="metric"><div class="metric-val">${tot}</div><div class="metric-label">Sessions</div></div><div class="metric"><div class="metric-val">${done}</div><div class="metric-label">Completed</div></div><div class="metric"><div class="metric-val">${tot?Math.round(done/tot*100):0}%</div><div class="metric-label">Progress</div></div></div><div class="dash-grid"><div class="card"><div class="card-title">Mastery Model <span class="pill pill-teal">Required for sign-off</span></div><div class="mastery"><div class="mastery-node">Do it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Explain it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Troubleshoot it</div><div class="mastery-arr"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><div class="mastery-node">Teach it</div></div></div><div class="card"><div class="card-title">Next Actions <span class="pill pill-gray">${NEXT_ACTIONS.length} items</span></div><div class="prog-wrap"><div class="prog-track"><div class="prog-fill" id="dpf" style="width:0%"></div></div><div class="prog-label" id="dpl">0%</div></div><div class="check-list" id="dcl"></div></div></div>`;
if(mods.length){html+=`<div class="sec-hd" style="margin-top:20px"><div><div class="sec-eyebrow">Your training</div><h2>My Modules</h2></div></div><div class="mod-grid">`;html+=mods.map(m=>{const pct=moduleProgress(m.id);return`<div class="mod-card" onclick="openModuleDetail('${m.id}')"><span class="pill ${m.pill}">${m.weeks}</span><h3>${m.name}</h3><div class="mod-owner">${m.owner}</div><div class="mod-summary">${m.summary}</div><div class="tags">${m.programs.map(p=>`<span class="tag">${p}</span>`).join("")}</div><div class="mod-progress"><div class="mod-progress-fill" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${pct}% complete · ${m.sessions.length} session${m.sessions.length!==1?"s":""}</div></div>`;}).join("");html+=`</div>`;}
