<html lang="en">
<head>
<meta charset="utf-8">

<title>Adleta Infor M3 — Training Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================
   ADLETA M3 TRAINING PORTAL — FULL BUILD
   Role-based access | Sessions | Quizzes | Video
   ===================================== */
:root {
  --navy:#0f2133;--navy2:#172d42;--navy3:#1f3a52;
  --teal:#1a7a6d;--teal2:#22a08f;--teal3:#e0f2ee;
  --gold:#c49a2a;--gold2:#faf0db;
  --red:#c0443b;--red2:#fce8e7;
  --blue:#2d6fa3;--blue2:#e0ecf7;
  --ink:#0f1f2e;--body:#344b5f;--muted:#6b8199;
  --line:#dde5ed;--bg:#f2f5f8;--surface:#fff;--surface2:#f7f9fb;
  --r:10px;--rsm:6px;
  --shadow:0 2px 12px rgba(15,33,51,0.08);
  --shadow2:0 8px 32px rgba(15,33,51,0.12);
  font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.55;
}
*,*::before,*::after{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--ink);min-height:100vh;}
a{color:var(--teal);text-decoration:none;font-weight:500;}
a:hover{text-decoration:underline;}
button,input,select{font:inherit;}
h1,h2,h3,h4{line-height:1.2;font-weight:700;}
p{color:var(--body);line-height:1.6;}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{background:var(--navy);color:#e8f1f8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-top{padding:22px 18px 16px;}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;}
.brand-mark{width:42px;height:42px;background:linear-gradient(135deg,var(--teal2),var(--teal));border-radius:10px;display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:13px;color:#fff;flex-shrink:0;}
.brand-name{font-size:14px;font-weight:700;color:#fff;line-height:1.2;}
.brand-sub{font-size:12px;color:#7fa3be;}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:var(--rsm);color:#a8c4d8;font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:all .15s;}
.nav-btn svg{opacity:.65;flex-shrink:0;}
.nav-btn:hover,.nav-btn.active{background:var(--navy3);color:#fff;}
.nav-btn.active svg{opacity:1;}
.sidebar-footer{margin-top:auto;padding:14px 18px 20px;border-top:1px solid rgba(255,255,255,0.07);}
.user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--navy3);border-radius:var(--rsm);}
.user-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;color:#fff;}
.user-role{font-size:11px;color:#7fa3be;}
.logout-btn{margin-top:8px;width:100%;padding:7px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:var(--rsm);color:#7fa3be;font-size:13px;cursor:pointer;transition:all .15s;}
.logout-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
.main{display:flex;flex-direction:column;min-width:0;}
.hero{background:var(--navy);padding:28px 36px 24px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 500px 250px at 100% 50%,rgba(26,122,109,0.2) 0%,transparent 70%),repeating-linear-gradient(120deg,rgba(255,255,255,0.015) 0 1px,transparent 1px 52px);pointer-events:none;}
.hero-inner{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.hero-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--teal2);font-weight:700;margin-bottom:8px;}
.hero h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;}
.hero-sub{font-size:13px;color:#7fa3be;}
.hero-actions{display:flex;gap:8px;flex-shrink:0;margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rsm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--teal2);color:#fff;}
.btn-primary:hover{background:var(--teal);color:#fff;text-decoration:none;}
.btn-ghost{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}
.btn-ghost:hover{background:rgba(255,255,255,0.18);color:#fff;text-decoration:none;}
.btn-sm{padding:6px 12px;font-size:13px;}
.content{padding:24px 36px 40px;flex:1;}
.view{display:none;}
.view.active{display:block;}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.sec-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);font-weight:700;margin-bottom:4px;}
.sec-hd h2{font-size:20px;color:var(--ink);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--teal);}
.metric:nth-child(2){border-top-color:var(--blue);}
.metric:nth-child(3){border-top-color:var(--gold);}
.metric:nth-child(4){border-top-color:var(--red);}
.metric-val{font-size:28px;font-weight:800;color:var(--teal);line-height:1;margin-bottom:3px;}
.metric:nth-child(2) .metric-val{color:var(--blue);}
.metric:nth-child(3) .metric-val{color:var(--gold);}
.metric:nth-child(4) .metric-val{color:var(--red);}
.metric-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.dash-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:20px;}
.mastery{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr;align-items:center;}
.mastery-node{background:var(--teal3);border:1px solid #b0d9d2;border-radius:var(--r);padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--teal);min-height:64px;display:grid;place-items:center;}
.mastery-arr{display:grid;place-items:center;color:var(--teal);opacity:.5;}
.prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.prog-track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.prog-label{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;}
.check-list{display:flex;flex-direction:column;gap:6px;}
.check-item{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.check-item:last-child{border-bottom:none;}
.check-item input{width:15px;height:15px;margin-top:2px;accent-color:var(--teal);cursor:pointer;}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.pill-teal{background:var(--teal3);color:#145c52;}
.pill-blue{background:var(--blue2);color:#1e4f7a;}
.pill-gold{background:var(--gold2);color:#7a5c12;}
.pill-red{background:var(--red2);color:#8a2e28;}
.pill-gray{background:#eef2f6;color:#344b5f;}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.mod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all .15s;}
.mod-card:hover{border-color:var(--teal);box-shadow:var(--shadow2);transform:translateY(-1px);}
.mod-card h3{font-size:14px;color:var(--ink);}
.mod-owner{font-size:11px;color:var(--muted);font-weight:600;}
.mod-summary{font-size:12px;color:var(--body);line-height:1.5;flex:1;}
.tags{display:flex;flex-wrap:wrap;gap:4px;}
.tag{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:#eef2f6;color:#344b5f;}
.mod-progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px;}
.mod-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.mod-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.mod-link{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--rsm);color:var(--teal);font-weight:600;transition:all .15s;}
.mod-link:hover{background:var(--teal3);border-color:var(--teal);text-decoration:none;}
.session-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;border:none;background:none;padding:0;margin-bottom:12px;}
.session-back:hover{color:var(--teal);}
.session-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.session-title{font-size:22px;font-weight:700;margin-bottom:16px;}
.session-body{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
.session-content{display:flex;flex-direction:column;gap:16px;}
.session-sidebar{display:flex;flex-direction:column;gap:14px;}
.notes-area{width:100%;min-height:90px;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:13px;color:var(--ink);background:var(--surface);resize:vertical;font-family:inherit;}
.notes-area:focus{outline:none;border-color:var(--teal);}
.notes-saved{font-size:11px;color:var(--teal);margin-top:4px;display:none;}
@media print{body *{visibility:hidden;}.print-zone,.print-zone *{visibility:visible;}.print-zone{position:fixed;top:0;left:0;width:100%;padding:20px;}.print-hide{display:none!important;}}
.step-cards{display:flex;flex-direction:column;gap:12px;}
.step-card{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:box-shadow .15s;}
.step-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.step-num{width:36px;height:36px;min-width:36px;border-radius:50%;background:var(--teal);color:#fff;font-size:15px;font-weight:800;display:grid;place-items:center;font-family:'DM Mono',monospace;}
.step-body{flex:1;}
.step-action{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.step-detail{font-size:13px;color:var(--body);line-height:1.55;}
.session-progress-header{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:16px;margin-bottom:4px;}
.session-progress-header .prog-track{flex:1;height:8px;border-radius:4px;background:var(--line);}
.session-progress-header .prog-fill{height:100%;border-radius:4px;background:var(--teal);transition:width .3s;}
.session-nav{display:flex;gap:10px;margin-top:8px;}
.session-nav .btn{flex:1;justify-content:center;}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--r);}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:var(--r);}
.video-placeholder{background:var(--navy2);border-radius:var(--r);aspect-ratio:16/9;display:grid;place-items:center;color:#7fa3be;font-size:13px;text-align:center;padding:20px;}
.video-input-wrap{display:flex;gap:8px;margin-top:8px;}
.video-input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:var(--rsm);font-size:13px;outline:none;}
.video-input:focus{border-color:var(--teal);}
.quiz-wrap{display:flex;flex-direction:column;gap:16px;}
.quiz-q{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
.quiz-q-text{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--ink);}
.quiz-options{display:flex;flex-direction:column;gap:8px;}
.quiz-option{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--rsm);cursor:pointer;font-size:13px;transition:all .15s;background:var(--surface);}
.quiz-option:hover{border-color:var(--teal);background:var(--teal3);}
.quiz-option.correct{border-color:#22a08f;background:#e0f2ee;color:#145c52;}
.quiz-option.wrong{border-color:var(--red);background:var(--red2);color:var(--red);}
.quiz-option input{margin-top:2px;accent-color:var(--teal);}
.quiz-result{text-align:center;padding:16px;border-radius:var(--r);font-size:15px;font-weight:700;}
.quiz-result.pass{background:var(--teal3);color:#145c52;}
.quiz-result.fail{background:var(--red2);color:var(--red);}
.quiz-btn{width:100%;padding:10px;background:var(--teal);color:#fff;border:none;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .15s;}
.quiz-btn:hover{background:var(--teal2);}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.phase-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border-top:4px solid var(--teal);}
.phase-card:nth-child(2){border-top-color:var(--blue);}
.phase-card:nth-child(3){border-top-color:var(--gold);}
.phase-card:nth-child(4){border-top-color:var(--red);}
.phase-weeks{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
.phase-name{font-size:16px;font-weight:700;margin-bottom:8px;}
.phase-purpose{font-size:12px;color:var(--body);margin-bottom:8px;line-height:1.5;}
.phase-success{font-size:12px;color:var(--teal);font-style:italic;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;line-height:1.5;}
.su-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.su-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.su-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;}
.su-name{font-size:14px;font-weight:700;}
.su-dept{font-size:11px;color:var(--muted);}
.su-mod{font-size:10px;font-family:'DM Mono',monospace;color:var(--teal);margin-top:3px;}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;}
.res-card h3{font-size:14px;}
.res-card p{font-size:12px;color:var(--body);flex:1;}
.res-link{font-size:13px;display:inline-flex;align-items:center;gap:5px;margin-top:4px;}
.search-input{padding:8px 13px;border-radius:var(--rsm);border:1px solid var(--line);background:var(--surface);width:260px;font-size:13px;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--teal);}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.user-table{width:100%;border-collapse:collapse;font-size:13px;}
.user-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:12px;font-weight:600;}
.user-table td{padding:9px 12px;border-bottom:1px solid var(--line);}
.user-table tr:hover td{background:var(--surface2);}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.dot-green{background:#22a08f;}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
@media(max-width:1100px){.mod-grid,.res-grid,.su-grid{grid-template-columns:repeat(2,1fr);}.timeline{grid-template-columns:repeat(2,1fr);}.metrics{grid-template-columns:repeat(2,1fr);}.session-body{grid-template-columns:1fr;}}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{height:auto;position:static;}.hero{padding:20px;}.content{padding:16px 18px 32px;}.dash-grid,.admin-grid{grid-template-columns:1fr;}.mod-grid,.res-grid,.su-grid,.timeline{grid-template-columns:1fr;}.mastery{grid-template-columns:1fr;gap:6px;}}

.admin-tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:20px;}
.admin-tab{padding:10px 20px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;}
.admin-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
.admin-tab-pane{display:none;}.admin-tab-pane.active{display:block;}
.guide-section{margin-bottom:28px;}
.guide-section h3{font-size:14px;font-weight:800;color:var(--ink);margin:0 0 10px 0;padding-bottom:8px;border-bottom:1px solid var(--line);}
.guide-su-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px;}
.guide-su-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);}
.guide-su-name{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:2px;}
.guide-su-dept{font-size:11px;color:var(--muted);margin-bottom:8px;}
.guide-su-modules{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.guide-su-sessions{font-size:12px;color:var(--body);margin-bottom:6px;}
.guide-step-list{list-style:none;padding:0;margin:0;}
.guide-step-list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--body);}
.guide-step-list li:last-child{border-bottom:none;}
.guide-step-num{width:22px;height:22px;min-width:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;}
.guide-tip{background:#fef9ec;border:1px solid #f0d060;border-radius:var(--r);padding:12px 14px;font-size:12px;color:#7a6020;margin-top:8px;}
.guide-tip strong{color:#5a4010;}

</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="sidebar-top">
    <div class="brand">
      <div class="brand-mark">M3</div>
      <div><div class="brand-name">Adleta Infor M3</div><div class="brand-sub">Training Portal</div></div>
    </div>
    <nav id="navLinks"></nav>
  </div>
  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="user-avatar" id="userAvatar" style="background:var(--teal)">KB</div>
      <div><div class="user-name" id="userName">Loading...</div><div class="user-role" id="userRoleLabel">...</div></div>
    </div>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </div>
</aside>
<main class="main">
  <div class="hero">
    <div class="hero-inner">
      <div>
        <div class="hero-eyebrow">Super User Academy</div>
        <h1>Build department masters who can do, explain, troubleshoot, and teach.</h1>
        <div class="hero-sub" id="heroSub">Adleta Corporation &nbsp;&middot;&nbsp; Infor M3 Rollout &nbsp;&middot;&nbsp; 9-Week Program</div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
        <a class="btn btn-primary btn-sm" href="https://adleta.sharepoint.com/sites/ProjectManagement/Shared%20Documents" target="_blank" rel="noreferrer">SharePoint</a>
      </div>
    </div>
  </div>
  <div class="content">
    <div id="view-dashboard" class="view active"></div>
    <div id="view-modules" class="view"></div>
    <div id="view-session" class="view"></div>
    <div id="view-roadmap" class="view"></div>
    <div id="view-superusers" class="view"></div>
    <div id="view-resources" class="view"></div>
    <div id="view-team" class="view"></div>
    <div id="view-admin" class="view"></div>
  </div>
</main>
</div>
<script>
const SP="https://adleta.sharepoint.com/sites/ProjectManagement/Shared%20Documents";
const USERS={
  kristenb:{pass:"Adleta2026!",role:"admin",name:"Kristen B.",dept:"Administrator",color:"#1a7a6d",modules:["all"]},
  mikeparsons:{pass:"Adleta2026!",role:"admin",name:"Mike Parsons",dept:"Administrator",color:"#2d6fa3",modules:["all"]},

 which program it lives in, who owns it, and why it matters to their department."],["6","Add missing terms","Each super user adds at least five department-specific terms or questions to the crosswalk parking lot."]],videoUrl:"",quiz:[{q:"Who is responsible for setting up a new supplier in M3?",options:["Purchasing","Warehouse","Finance / Vendor master owner","The supplier themselves"],answer:2},{q:"Available stock in MMS200 equals:",options:["Total on-hand quantity","On-hand minus allocated quantity","Quantity on order","Quantity in transit"],answer:1},{q:"In the Procure to Pay flow, which step triggers the three-way match?",options:["Creating the purchase order","Receiving the goods","Entering the supplier invoice in APS100","Approving the payment"],answer:2},{q:"Customer order entry is owned by:",options:["Finance AR","Warehouse","Sales / Customer Service","Purchasing"],answer:2}],checklist:["I can explain the difference between a customer, supplier, item, and warehouse in M3","I can name the primary program for each core entity","I know which department owns each record type","I can trace the Procure to Pay and Order to Cash flows","I have added at least five department-specific terms to the crosswalk"]},{id:"fnd-4",title:"Foundation Mastery Check",duration:"1.5 hours",steps:[["1","Navigation practical","Each super user opens three programs relevant to their module without coaching. Trainer observes and notes any gaps."],["2","Record lookup practical","Each super user looks up one customer, one supplier, and one item. They name the key fields to verify on each record."],["3","Entity explanation","Each super user explains one record type: what it is, which program, who owns it, why it matters."],["4","Teach-back — 3 to 5 minutes","Each super user explains how they would help a department user find the right screen, look up a record, and log an issue."],["5","Issue log review","Review all open issues from Weeks 1-2. Assign owners. Confirm any access blockers are resolved before Week 3."],["6","Readiness decision","Trainer marks each super user: Ready, Ready With Coaching, or Not Ready. Not Ready requires remediation before module training."]],videoUrl:"",quiz:[{q:"A super user is ready for module training when they can:",options:["Recite all program codes from memory","Navigate programs, look up records, explain terms, and submit a complete issue log entry without coaching","Complete all sessions with 100% quiz scores","Shadow the trainer for one full week"],answer:1},{q:"If a super user cannot log in to the training environment, you should:",options:["Have them watch someone else's screen","Skip them and move to module training","Route them to IT immediately and resolve before the next session","Mark them as Not Ready and move on"],answer:2},{q:"Ready With Coaching means:",options:["The super user failed and must restart Week 1","The super user can attend module training but needs targeted follow-up on one foundation skill","The super user is fully cleared with no gaps","The super user needs two more weeks of foundation training"],answer:1},{q:"The foundation teach-back should include:",options:["A full presentation of all M3 modules","One program code, one record lookup, one required-field check, one issue-log example","A quiz with 10 questions","A written report submitted to management"],answer:1}],checklist:["I can open three role-relevant programs without coaching","I can find a customer, supplier, and item and name the key fields to verify","I can explain one entity in plain language — program, owner, and why it matters","I completed my foundation teach-back","I have no unresolved access blockers going into module training","My trainer has marked me Ready or Ready With Coaching"]}]},
  purchasing:{id:"purchasing",name:"Purchasing / Procurement",owner:"Alan Burk",weeks:"Week 3",pill:"pill-blue",color:"#2d6fa3",programs:["CRS620","PPS200","PPS201","PPS300","APS100"],summary:"Supplier lookup, purchase orders, receiving handoff, approvals, and three-way match.",links:[["Deck",SP+"/Adleta_M3_Purchasing_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Purchasing_LearningGuide.docx"]],sessions:[{id:"pur-1",title:"Planned PO Release",duration:"45 min",steps:[[1,"Open the Planned PO Queue","Press Ctrl+R and type PPS170 (or navigate to Purchasing > Planned Purchase Orders). This screen lists all planned POs generated by M3 from demand planning and reorder points."],
[2,"Filter by buyer and warehouse","Set the Buyer field to your buyer code and enter your warehouse. Press Enter. M3 shows only planned POs assigned to you. Review the list — item number, vendor, planned quantity, and suggested order date."],
[3,"Review a planned PO before releasing","Click into a planned PO line. Verify: item number is correct, vendor is correct, quantity matches the reorder quantity, and the suggested delivery date is realistic. Adjust quantity or date if needed."],
[4,"Verify the vendor is active","Before releasing, note the vendor number. Open CRS620 in a second tab (Ctrl+R > CRS620), look up the vendor, and confirm Active status. Return to PPS170."],
[5,"Select planned POs to release","Check the box next to each planned PO that is ready to release. You can select multiple lines at once."],
[6,"Release the planned POs","With lines selected, choose Release from the action menu (or press the Release button). M3 converts each planned PO into a firm Purchase Order and assigns a PO number."],
[7,"Confirm the released POs in PPS200","Open PPS200. Filter by your vendor or buyer code. Confirm the newly released POs appear with status 15 or 20. Verify item, quantity, and delivery date are correct."],
[8,"Transmit the PO to the vendor","In PPS200, select the released PO and choose Print/Transmit (PPS310). Send the PO to the vendor by EDI, email, or print. Confirm transmission was successful."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Planned%20PO%20Release.mp4",quiz:[{q:"What M3 program is used to look up vendor records?",options:["PPS200","CRS620","MMS060","OIS100"],answer:1},{q:"Before creating a PO, the vendor status must be:",options:["Pending","Inactive","Active","Approved"],answer:2},{q:"If a vendor is not in M3, you should:",options:["Create the record yourself","Contact Finance to set them up","Skip the vendor field","Use a different vendor"],answer:1}],checklist:["I can find a vendor by number in CRS620","I can search a vendor by name using the lookup icon","I know what fields to verify before creating a PO","I understand what to do if a vendor is missing or inactive"]},{id:"pur-2",title:"Non-Stocking WHS PO — One-Time Exception",duration:"60 min",steps:[[1,"Identify the need for a one-time exception PO","A non-stocking warehouse PO is used when a customer needs an item Adleta does not normally stock. The item will be received into the warehouse and then shipped to the customer. Get the item details, customer order number, and requested quantity."],
[2,"Open PPS200 and create a new PO header","Press Ctrl+R > PPS200. click the + New button to create a new PO. Enter the vendor number, PO type (confirm the non-stock PO type with your trainer), warehouse, and requested delivery date."],
[3,"Enter the non-stocking item on the PO line","In PPS201, enter the item number. If the item is not in M3 as a stock item, use the designated non-stock item code (confirm with purchasing admin). Enter the quantity, unit of measure, and the negotiated unit price."],
[4,"Enter the customer order reference","In the order line notes or reference field, enter the customer order number this PO is tied to. This links the exception PO back to the customer demand so the item is not left sitting in the warehouse."],
[5,"Verify freight terms and delivery address","Confirm whether the vendor ships to Adleta warehouse (then Adleta ships to customer) or direct to the customer. Set the ship-to address on the PO accordingly. Confirm freight terms with the vendor."],
[6,"Save and submit for approval if required","Save the PO. If the amount exceeds your approval threshold, M3 routes it for management approval. Monitor approval status in PPS200 before transmitting to the vendor."],
[7,"Transmit the PO to the vendor","Once approved, open PPS310 to print, email, or EDI-transmit the PO. Confirm the vendor received it and can meet the delivery date."],
[8,"Monitor and close the exception","Track the PO in PPS200 until received. Once received, notify the customer service rep so the customer order can be shipped. Flag these non-stock purchases for purchasing review — if a non-stock item is ordered repeatedly, it may need to be set up as a regular stocking item."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Non-Stocking%20WHS%20PO%20for%20one%20time%20exception.mp4",quiz:[{q:"What keyboard shortcut creates a new PO in PPS200?",options:["F1","F3","F5","F14"],answer:1},{q:"After saving the PO header, M3 automatically opens:",options:["PPS300","APS100","PPS201","CRS620"],answer:2},{q:"The Requested Delivery Date is:",options:["Today's date","The date you want goods at the warehouse","The vendor's ship date","The invoice date"],answer:1}],checklist:["I can create a PO header in PPS200","I can add PO lines in PPS201","I know how to verify pricing on PO lines","I can record and track the PO number assigned by M3"]},{id:"pur-3",title:"Receiving Goods — PPS300 and Three-Way Match",duration:"60 min",steps:[["1","Open PPS300","Navigate to Purchasing > Goods Receiving > PPS300"],["2","Find PO","Enter the PO number"],["3","Verify Delivery","Confirm packing slip matches PO items and quantities"],["4","Enter Receipt Date","Today's date"],["5","Enter Received Quantities","Actual quantity physically received"],["6","Confirm","click the checkmark ✓ (Save) button — M3 updates inventory and creates receipt"],["7","Check Three-Way Match","Finance enters invoice in APS100 and runs F14 match"],["8","Resolve Discrepancies","Price or qty variance — contact vendor for corrected invoice"]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215_141931-Meeting%20Recording.mp4",quiz:[{q:"What program is used to receive goods against a PO?",options:["PPS200","APS100","PPS300","MMS150"],answer:2},{q:"The three-way match compares:",options:["PO, receipt, and vendor invoice","PO, customer order, and payment","Receipt, invoice, and credit memo","PO, vendor, and warehouse"],answer:0},{q:"If you receive LESS than the PO quantity, M3 will:",options:["Close the PO automatically","Delete the remaining lines","Keep the PO open for the remaining quantity","Reject the receipt"],answer:2}],checklist:["I can receive a full shipment in PPS300","I can handle a partial receipt","I understand how the three-way match works","I know how to resolve a price or quantity discrepancy"]},{id:"pur-4",title:"Manual Purchase Order — Stocking Item",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2003%202025%20-%20P2P/Bravo%20-%20Mini%20CRP%20P2P%20scenarios-20251203%20Manual%20PO%20Stocking%20Item.mp4",steps:[["1","Verify the Vendor","Open CRS620. Look up the vendor by number or name. Confirm the account is active and payment terms are correct."],["2","Open PPS200","Open PPS200 and select Create to start a new Purchase Order."],["3","Enter PO Header","Enter vendor number, order type, buyer, warehouse, and requested delivery date. Save the header — M3 assigns a PO number."],["4","Add PO Lines in PPS201","M3 opens PPS201. Enter item number, quantity, unit of measure, and price for each item line."],["5","Verify Pricing","Verify pricing on each line against the vendor price agreement in CRS620. Flag any discrepancies before saving."],["6","Save PO Lines","Save all PO lines. Review the PO total."],["7","Submit for Approval if Required","If the PO total exceeds the approval threshold, M3 routes it for approval. Monitor approval status."],["8","Print/Transmit PO to Vendor","Once approved, use PPS310 to print, email, or EDI-transmit the PO to the vendor."],["9","Monitor Until Received","Track PO status in PPS200 until goods are received."]],quiz:[{q:"To create a manual purchase order, you open:",options:["CRS620","OIS100","PPS200","APS100"],answer:2},{q:"Individual item lines are added to a PO in:",options:["PPS200","PPS201","PPS300","CRS620"],answer:1},{q:"To print or transmit a PO to a vendor, you use:",options:["PPS200","PPS201","PPS310","APS100"],answer:2},{q:"Before creating a PO you should verify the vendor is active in:",options:["OIS100","PPS200","CRS620","MMS060"],answer:2}],checklist:["I can look up a vendor in CRS620 and verify their account is active","I can create a manual PO header in PPS200","I can add item lines in PPS201","I can verify pricing against the vendor agreement","I can print/transmit a PO using PPS310"]},{id:"pur-5",title:"PO Management — Cancel, Split, and Notes",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Cancel%20PO%20in%20Status%2035%20Standalone.mp4",steps:[["1","Locate the PO","Open PPS200. Find the PO by PO number, vendor, or status."],["2","Add Notes to a PO","Right-click the PO and select Notes. Enter note text — use notes to document vendor communication, changes, or special instructions. Save."],["3","Split a PO Line","Select the PO line to split. Choose Split from the action menu. Enter the quantity to split off — M3 creates a new line with the split quantity. Use this to manage partial shipments or different delivery dates."],["4","Update Warehouse on a PO Line (Status 35)","Select the PO line. Choose Change. Update the warehouse field. Save."],["5","Update Supplier on a PO","Select the PO header. Choose Change. Update the supplier field (only available in certain statuses). Save."],["6","Cancel a PO in Status 35","Verify that no partial receiving has occurred on this PO. Contact the vendor first to confirm cancellation. Select the PO and choose Cancel from the action menu. Confirm — M3 changes status to Cancelled."],["7","Verify the Cancellation","Confirm the PO status shows as Cancelled. If partial receiving has occurred, the PO cannot be fully cancelled — close it instead."]],quiz:[{q:"PO status 35 in M3 means:",options:["PO is in draft","PO has been released/sent to the vendor","PO is fully received","PO is cancelled"],answer:1},{q:"Before cancelling a PO, you should:",options:["Print the PO first","Verify no partial receiving has occurred and contact the vendor","Change status to 20","Delete all PO lines"],answer:1},{q:"The Split action on a PO line is used to:",options:["Copy the line to a new PO","Divide one PO line into two separate lines","Cancel half the quantity","Move the line to a different vendor"],answer:1},{q:"PO notes are most useful for documenting:",options:["Financial journal entries","Vendor communication, change reasons, and special instructions","Customer order details","Inventory adjustments"],answer:1}],checklist:["I can add notes to a purchase order in PPS200","I can split a PO line into multiple lines","I can cancel a PO in status 35 after verifying no partial receiving","I can update warehouse and supplier on a PO","I know when to cancel vs. close a PO"]},{id:"pur-6",title:"Updating the Supplier on a Purchase Order",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2003%202025%20-%20P2P/Bravo%20-%20Mini%20CRP%20P2P%20scenarios-20251203%20Update%20Supplier%20on%20PO.mp4",steps:[[1,"Open PPS200 and find the PO","Press Ctrl+R > PPS200. Search for the PO by PO number or filter by original vendor. Confirm the PO status — supplier changes are only allowed before the PO is received (status below 50)."],
[2,"Confirm why the supplier is changing","Before making any change, document the reason: vendor merger, pricing issue, vendor out of stock, or routing to a backup supplier. Add a note to the PO (right-click > Notes) with the reason and date."],
[3,"Select the PO and choose Change","Click the PO header line. Right-click and select Change (or click the lookup icon). The PO header opens in edit mode."],
[4,"Update the Supplier field","In the Supplier field, clear the current vendor number and type the new vendor number. click the lookup icon if you need to search. M3 will update the vendor name and default payment terms automatically."],
[5,"Verify updated vendor fields","After changing the supplier, review: vendor name, payment terms, currency, and default delivery address. Confirm these are correct for the new vendor. Adjust if needed."],
[6,"Update pricing if required","Navigate to the PO lines (PPS201). If the new vendor has different pricing, update the unit price on each line. Verify against the new vendor price agreement in CRS620."],
[7,"Save and re-transmit the PO","Save the PO header changes. Then open PPS310 to transmit the revised PO to the new vendor. Confirm the new vendor received the PO."],
[8,"Cancel or notify the original vendor","If the original vendor was already notified of the PO, contact them to cancel the order. Document this in the PO notes. Update the PO status if the original vendor confirms cancellation."]],quiz:[{q:"The M3 program for vendor/supplier records is:",options:["OIS100","PPS200","CRS620","MMS060"],answer:2},{q:"Vendor price agreements are found in CRS620 under:",options:["The Notes tab","Related → Price Agreements","The Change screen","PPS201"],answer:1},{q:"Who is responsible for creating new vendor records in M3?",options:["The purchasing super user","Any M3 user","Finance/Purchasing admin","The vendor themselves"],answer:2},{q:"Vendor lead time in CRS620 affects:",options:["Customer invoice dates","The recommended PO release date for planned orders","Payroll processing","Inventory cycle counts"],answer:1}],checklist:["I can look up a vendor in CRS620 by number and by name","I can review payment terms, lead time, and price agreements","I know which vendor fields I am authorized to update","I understand the process for requesting new vendor setup","I know how to check EDI settings for a vendor"]},
{id:"pur-7",title:"Pre-Receipts in M3",duration:"35 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/PreReceipt%20Discussion.mp4",steps:[[1,"Open PPS300 in M3","Press Ctrl+R and type PPS300, then press Enter. This is the Pre-Receipt screen used to record incoming shipment data before the truck arrives at the warehouse."],
[2,"Enter the PO number","In PPS300, type the Purchase Order number from the supplier shipping notice. Press Enter. M3 loads the PO header with vendor name, warehouse, and expected delivery date."],
[3,"Enter the delivery note / manifest number","In the Delivery Note field, type the manifest or ASN number from the supplier. This links the pre-receipt to the specific shipment."],
[4,"Review the PO lines","M3 displays all open lines on the PO. Verify item numbers and expected quantities match the supplier shipping notice. Flag any discrepancies before continuing."],
[5,"Enter lot numbers and shade/dye-lot for each line","For each PO line, click into the Lot Number field and type the shade or dye-lot from the supplier carton label or emailed shipping notice. This is critical — floor covering items must be shade-matched."],
[6,"Enter freight and dock charges at the header","At the PO header level, enter total freight cost and any dock fees in the Charge fields. M3 automatically splits these costs across all PO lines in proportion to quantity."],
[7,"Save and confirm the pre-receipt","click the checkmark ✓ (Save) button. M3 records the pre-receipt with lot data and charges. The warehouse can now receive the physical shipment quickly without re-entering this data."],
[8,"Verify the pre-receipt record","In PPS300, search for the PO number. Confirm the pre-receipt status shows as open and all lot numbers and charges are saved correctly before the truck arrives."]],quiz:[{q:"What is the main benefit of entering a pre-receipt before goods arrive?",options:["It automatically orders more stock","It records lot/shade data and freight costs for fast warehouse receiving","It generates the customer invoice","It creates the purchase order"],answer:1},{q:"Which M3 screen is used for manual pre-receipt entry?",options:["PPS001","PPS300","ROO 02","WAR 8"],answer:1},{q:"When a supplier sends an EDI 856, what does M3 do automatically?",options:["Places a new purchase order","Approves the payment","Creates the pre-receipt record with lot numbers and quantities","Sends a packing list to the warehouse"],answer:2},{q:"Freight costs entered at the header level in PPS300 are:",options:["Assigned only to the first PO line","Distributed proportionally across all PO lines in the delivery","Added to the customer invoice","Ignored until final receipt"],answer:1}],checklist:["Understand the purpose of pre-receipts for lot/shade-managed items","Can open PPS300 and enter a PO and delivery note","Can enter lot numbers and shade data for each PO line","Can distribute freight and dock charges across PO lines","Can save and confirm a pre-receipt","Understand how EDI 856 auto-populates pre-receipt data","Can verify pre-receipt status before warehouse receiving"]}
,
{id:"pur-8",title:"EDI in Purchasing",duration:"30 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/BRAVO%20EDI%20WebService%20Demo.mp4",steps:[[1,"Confirm a vendor is EDI-enabled in CRS620","Open CRS620 and look up the supplier. Navigate to Related > EDI Settings. Confirm the EDI flag is active and the correct trading partner ID is on file. If blank or inactive, contact IT before placing a PO."],
[2,"Create a PO for an EDI supplier — M3 sends the 850 automatically","Open PPS200 and create a purchase order for an EDI-enabled vendor. When you save and release the PO, M3 automatically generates and transmits an EDI 850 (Purchase Order) to the supplier. No extra steps needed."],
[3,"Check for incoming EDI 855 acknowledgements","In PPS200, filter open POs by the EDI supplier. Review the PO status. If the supplier sent an EDI 855 (acknowledgement) and there are line rejections or quantity changes, M3 will flag those lines. Review and take action."],
[4,"Check for an EDI 856 creating a pre-receipt automatically","When a supplier ships and sends an EDI 856 (Advance Ship Notice), M3 automatically creates a pre-receipt in PPS300. Open PPS300 and search for the PO to confirm the pre-receipt was created with lot numbers and quantities."],
[5,"Add freight charges to the auto-created pre-receipt","Open the auto-created pre-receipt in PPS300. The lot numbers are already populated from the EDI 856. You only need to add freight and dock charges in the Charge fields, then save."],
[6,"Review EDI 810 invoices in APS100","Open APS100 — Supplier Invoice Entry. EDI 810 invoices from suppliers appear here automatically. Review each for a 3-way match against the PO and receipt. Invoices that match post automatically; exceptions stay open for review."],
[7,"Resolve an EDI 810 match exception","In APS100, find invoices with a match exception (price or quantity variance). Click into the exception, review the discrepancy, and either approve the variance, request a credit memo from the vendor, or contact the buyer to correct the PO."],
[8,"Handle a failed EDI 856 — enter pre-receipt manually","If a supplier ships but the EDI 856 was not received or failed, open PPS300 and manually enter the pre-receipt (steps in the Pre-Receipts session). Contact your EDI coordinator if the same supplier misses EDI 856 transmissions repeatedly."]],quiz:[{q:"Which EDI document type is sent by Adleta to the supplier to place a purchase order?",options:["EDI 810","EDI 855","EDI 850","EDI 856"],answer:2},{q:"An EDI 856 Advance Ship Notice automatically creates:",options:["A new purchase order","A pre-receipt record in M3","An AP invoice","A customer shipment"],answer:1},{q:"EDI 810 is used for:",options:["Sending purchase orders","Receiving inbound supplier invoices","Advance ship notices","PO acknowledgements"],answer:1},{q:"If an EDI 856 fails to process, you should:",options:["Delete the PO and start over","Wait for the supplier to resend","Manually enter the pre-receipt in PPS300","Call the customer"],answer:2}],checklist:["Know the four EDI document types (850, 855, 856, 810) and their purposes","Understand how EDI 850 is sent automatically when a PO is created","Can monitor incoming EDI 855 acknowledgements for exceptions","Understand how EDI 856 triggers automatic pre-receipt creation","Can review EDI 810 invoice matches and exceptions in AP","Can check EDI transaction log for errors","Know how to manually handle EDI failures via PPS300"]}
]},
  inventory:{id:"inventory",name:"Inventory Management",owner:"Alan Burk / Jose Manjarrez",weeks:"Week 4",pill:"pill-teal",color:"#1a7a6d",programs:["MMS060","MMS200","MMS100","MMS150","MMS300"],summary:"Item lookup, stock balances, transfers, adjustments, cycle counts, discrepancy handling.",links:[["Deck",SP+"/Adleta_M3_Inventory_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Inventory_LearningGuide.docx"]],sessions:[{id:"inv-1",title:"Item Lookup and Stock Balance — MMS060 and MMS200",duration:"45 min",steps:[["1","Open MMS060","Navigate to Inventory > Item Master > MMS060"],["2","Enter Item Number","Type the Adleta item number and press Enter"],["3","Review Item Record","Check status, UOM, item category, stock method"],["4","Open MMS200","Navigate to Inventory > Stock Balance > MMS200"],["5","Enter Item Number","See all stock for that item across all locations"],["6","Check Available Qty","On-hand minus Allocated = Available. Use Available when promising stock"]],videoUrl:"",quiz:[{q:"What does Available quantity mean in MMS200?",options:["Total in warehouse","On-hand minus allocated","Quantity on order","Quantity shipped today"],answer:1},{q:"Before any inventory transaction, the item status must be:",options:["Pending (10)","Active (20)","Inactive (90)","On hold (50)"],answer:1},{q:"Which program shows stock balance by location?",options:["MMS060","MMS150","MMS200","MMS300"],answer:2}],checklist:["I can look up an item record in MMS060","I can check on-hand and available stock in MMS200","I understand the difference between on-hand, allocated, and available","I know which quantity to use when promising stock to Sales"]},{id:"inv-2",title:"Transfers and Adjustments — MMS100 and MMS150",duration:"60 min",steps:[["1","Open MMS100","Navigate to Inventory > Stock Transfer > MMS100"],["2","Enter Item and From Location","Item number and the bin the stock is leaving"],["3","Enter To Location","Destination warehouse and bin"],["4","Enter Quantity","Must not exceed available at From location"],["5","Confirm Transfer","Press Enter — both balances update immediately"],["6","Open MMS150 for Adjustments","Navigate to Inventory > Stock Adjustment > MMS150"],["7","Enter Reason Code","CYCLE / DAMAGE / EXPIRE / RCVERR / SHRINK / WRITUP"],["8","Enter Notes","Required for audit — explain why the adjustment is needed"]],videoUrl:"",quiz:[{q:"Which program is used to move stock between warehouse locations?",options:["MMS060","MMS150","MMS200","MMS100"],answer:3},{q:"An inventory adjustment for damaged goods uses reason code:",options:["CYCLE","DAMAGE","SHRINK","RCVERR"],answer:1},{q:"Adjustments above $500 in value require:",options:["IT approval","Manager approval before entry","Finance approval after entry","No approval needed"],answer:1}],checklist:["I can process a stock transfer between locations","I can process an inventory adjustment with the correct reason code","I know when manager approval is required for adjustments","I always verify available quantity before transferring"]},{id:"inv-3",title:"Cycle Counting — MMS300",duration:"60 min",steps:[["1","Understand cycle counting","Cycle counting is a method of counting a subset of inventory on a regular schedule instead of shutting down for a full physical count. M3 manages this in MMS300."],["2","Open MMS300","Navigate to Inventory > Cycle Count > MMS300."],["3","Review the count list","M3 generates a list of items and locations assigned for counting. Review item number, location, and system on-hand quantity."],["4","Perform the physical count","Go to the physical location. Count actual units. Do not look at the system quantity before counting — blind counts are more accurate."],["5","Enter count results","Return to MMS300. Enter the actual counted quantity for each line. If the count matches, confirm. If different, recount before entering."],["6","Review variances","M3 flags lines where counted quantity differs from system quantity. Review each variance — note the item, location, system qty, counted qty, and difference."],["7","Approve or escalate variances","Small variances within Adleta tolerance: enter with reason code CYCLE. Large variances: escalate to manager before posting. Finance may need to approve if financial impact is significant."],["8","Post the count","After approval, post the cycle count. M3 updates on-hand balances to match counted quantities and creates an audit record."],["9","Investigate root cause","For repeated variances on the same item or location, investigate: receiving errors, transfer errors, unreported damage, or picking errors. Log findings in the issue log."]],videoUrl:"",quiz:[{q:"The best practice when performing a physical cycle count is:",options:["Check the system quantity first so you know what to expect","Count blind — do not look at the system quantity before counting","Only count items with recent transactions","Count everything in the warehouse at once"],answer:1},{q:"A large cycle count variance should be:",options:["Posted immediately so the system is updated","Escalated to management before posting, especially if the financial impact is significant","Ignored if the item is low value","Adjusted using reason code DAMAGE"],answer:1},{q:"After posting a cycle count, M3:",options:["Sends an alert to Finance automatically","Updates on-hand balances to match the counted quantities and creates an audit record","Closes the item record until the next count","Requires IT approval to finalize"],answer:1},{q:"Repeated variances on the same item or location most likely indicate:",options:["A system configuration error that only IT can fix","A counting error by the same person","A process problem — receiving, transfer, damage, or picking errors — that needs root cause investigation","Normal inventory shrinkage that requires no action"],answer:2}],checklist:["I understand the purpose of cycle counting and how it differs from a full physical count","I can open MMS300 and review a cycle count list","I perform counts blind without checking system quantity first","I know how to enter count results and review variances","I know when to post a variance vs escalate to management","I can investigate and log the root cause of a repeated variance"]},
{id:"inv-4",title:"AAA - Automatic Allocation Algorithm",duration:"45 min",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/AAA%2010-16-2025.mp4",steps:[[1,"Open an item in MMS060 and check the AAA flag","Press Ctrl+R and type MMS060. Look up a floor covering item (carpet, LVP, hardwood). Navigate to the custom fields panel (Panel G). Look for the field labeled AAA Item. If it says YES, AAA logic applies to this item at order entry."],
[2,"Check the Rule Set ID on the item","In MMS060 on the same item, find the Rule Set ID field in the custom panel. This tells you which allocation rule the system uses — for example, shade-match priority vs. FIFO. Note the Rule Set ID."],
[3,"Check the Roll Good Indicator","Still in MMS060, find the Roll Good Indicator field. YES means this is roll goods (carpet sold by the yard) — the system tries to fill from one roll to avoid shade breaks. NO means cut goods (tile/plank) where lots may be combined."],
[4,"Enter an order line for an AAA item in OIS100","Open OIS100 — Customer Order Entry. Enter a customer, order type, and warehouse. On the order line, enter an AAA-flagged item and a quantity. Press Enter. M3 pauses to run the AAA allocation logic."],
[5,"Review the AAA allocation proposal","M3 displays the proposed lot/shade allocation — which specific lot numbers it selected and why (shade match, age, warehouse location). Review the proposed lots against what the customer needs. Accept or override."],
[6,"Override an allocation if needed","If the proposed lot does not work for the customer (wrong shade, damaged), select Override on the allocation screen. Choose a different available lot from the list. M3 updates the allocation. Document the reason in order notes."],
[7,"Check AAA settings if allocation does not run","If you enter an order for an AAA item and the system does not show an allocation screen, open MMS060 and verify: (1) AAA Item flag is YES, (2) Rule Set ID is populated. If both look correct, contact Purchasing — the Rule Set may be misconfigured."],
[8,"Look up AAA screens for reference (view only)","Press Ctrl+R and type AAA900 to open the AAA Administration screen. Super users can view Rule Sets and allocation settings here. Do NOT change any settings without approval from IT or the Purchasing manager."]],quiz:[{q:"What is the primary business reason AAA was built for floor covering distribution?",options:["To speed up order entry","To ensure customers receive matching shade/dye-lot inventory","To reduce purchase order processing time","To automate truck routing"],answer:1},{q:"AAA logic only applies to items where which flag is set?",options:["Roll Good Indicator = YES","AAA Item flag = YES","Lot Managed = YES","Direct Ship = YES"],answer:1},{q:"What is a Rule Set ID?",options:["The item lot number","The configuration that defines AAA allocation priority logic","The EDI transaction code","The warehouse zone for the item"],answer:1},{q:"If an order is not being allocated by AAA, what should you check first?",options:["The customer credit limit","Whether the AAA flag and Rule Set ID are set on the item master","The freight terms on the order","The EDI 850 status"],answer:1}],checklist:["Understand why AAA exists and what business problem it solves","Can identify AAA-eligible items using the item master custom fields","Know what a Rule Set ID controls","Understand Roll Goods vs Cut Goods allocation difference","Know how order entry works with AAA allocation","Understand how back-orders are filled using AAA logic","Can look up AAA settings on an item (view-only)","Know when to escalate AAA allocation issues to Purchasing"]}
]},
  orderManagement:{id:"orderManagement",name:"Order Management / Sales",owner:"Tony Shipka + Jeanell Coral",weeks:"Week 5",pill:"pill-gold",color:"#c49a2a",programs:["CRS610","OIS100","OIS101","OIS300","OIS390","MMS200"],summary:"Customer lookup, order entry, pricing, availability, shipments, backorders, and returns.",links:[["Deck",SP+"/Adleta_M3_OrderManagement_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_OrderManagement_LearningGuide.docx"]],sessions:[{id:"ord-1",title:"Manual Order Entry — Standard Net Terms (CL1)",duration:"60 min",steps:[[1,"Open OIS100 — Customer Order Entry","Press Ctrl+R > OIS100. click the + New button to create a new order. This is the standard manual order entry screen used for the majority of Adleta customer orders."],
[2,"Enter the customer number","Type the customer number (Bill-To) and press Enter. M3 populates the customer name, address, payment terms, currency, and assigned salesperson. Verify the customer account is active and in good standing."],
[3,"Set the order type and warehouse","Confirm the order type (CL1 = standard charge/net terms billing). Set the warehouse to the correct shipping warehouse. Enter the requested delivery date."],
[4,"Set delivery method and ship-to","Confirm the ship-to address. If the customer has multiple ship-to locations, click the lookup icon in the Ship-To field to select the correct one. Set the delivery method (route, carrier, or will call)."],
[5,"Add order lines — enter item and quantity","Press Enter to go to the order lines screen. Enter the item number and press Enter. M3 shows the item description, available quantity, and list price. Enter the quantity ordered. Press Enter to confirm the line."],
[6,"Verify pricing on the order line","Check that the unit price on the line matches the customer price agreement. If price is incorrect, click the lookup icon on the price field to review price sources. Do not override price without authorization."],
[7,"Add additional lines as needed","Repeat the item entry for each line on the order. When all lines are entered, review the order total."],
[8,"Release the order","click the checkmark ✓ to save, then click Release. M3 allocates inventory, assigns the order to a route, and changes the order status to released. Provide the customer order number to the customer service rep or customer."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2005%202025%20-%20Manual%20Order/Bravo%20-%20Mini-CRP%20Manual%20order%20scenarios-20251205%20Manual%20Order%20CL1.mp4",quiz:[{q:"Where do you look up a customer's price list assignment?",options:["OIS100","OIS010","CRS610","MMS060"],answer:2},{q:"The Customer PO Number field is:",options:["Not required ever","Required when the customer provides one","Generated automatically by M3","Only used for returns"],answer:1},{q:"After saving the order header in OIS100, you add products in:",options:["OIS300","CRS610","OIS101","OIS390"],answer:2}],checklist:["I can look up a customer in CRS610 and verify their details","I can create a sales order header in OIS100","I always enter the customer PO number when provided","I record the M3 order number after saving"]},{id:"ord-2",title:"Customer Return — Creating a Return Order",duration:"60 min",steps:[[1,"Identify the original order and reason for return","Get the original customer order number, item(s) being returned, quantity, and reason for return (damaged, wrong item, customer changed mind, shade mismatch). Having the original order number is required."],
[2,"Open OIS100 and create a new return order","Press Ctrl+R > OIS100. click the + New button. Select the return order type (confirm the correct return type with your trainer — different types handle restocking vs. write-off differently)."],
[3,"Enter the customer number","Type the customer number. Confirm the Bill-To and Ship-To match the original order."],
[4,"Reference the original order","In the reference field or order header, enter the original customer order number. This links the return to the original sale for reporting and GL posting purposes."],
[5,"Add the return line — negative quantity","Enter the item number being returned. Enter the quantity as a NEGATIVE number (e.g., -10 for 10 units returned). M3 will create a credit line. Enter the return reason code."],
[6,"Set the return warehouse","Confirm which warehouse the returned goods are going to. For lot/shade items, note the lot number on the return so inventory is booked back to the correct shade."],
[7,"Review the credit amount","Confirm the credit amount on the return line matches the original sale price (or the agreed return value). Do not issue credit above the original invoice amount without manager approval."],
[8,"Release the return order","Release the return. M3 creates a credit memo that will be applied to the customer account. Notify the warehouse team that a return is expected so they can inspect and receive the goods."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Customer%20Return.mp4",quiz:[{q:"Confirming a shipment in OIS300 automatically:",options:["Creates a new order","Updates inventory and generates invoice","Sends email to customer","Closes the customer account"],answer:1},{q:"Before processing a return in OIS390, you must:",options:["Enter the return in CRS610","Get manager authorization","Check stock in MMS200","Create a new sales order"],answer:1},{q:"Which reason code is used when the wrong item was shipped?",options:["DEFECT","CUSTCANCEL","WRONGITEM","OVERSHIP"],answer:2}],checklist:["I can process a shipment confirmation in OIS300","I can handle a partial shipment correctly","I know the return process and when to get authorization","I can select the correct return reason code in OIS390"]},{id:"ord-3",title:"Order Entry — Handling a Credit Hold",duration:"60 min",steps:[[1,"Enter the order normally in OIS100","Press Ctrl+R > OIS100. click the + New button and enter the customer order as normal — customer number, order type, warehouse, delivery date, and order lines with items and quantities."],
[2,"Recognize the credit hold message","When you try to release the order, M3 displays a credit hold warning. The order is placed in Hard Hold status and cannot ship until the hold is resolved. Do NOT try to bypass this — contact the credit team immediately."],
[3,"Note the hold reason","M3 will indicate why the hold was triggered: over credit limit, past due balance, or manual hold placed by Collections. Note the specific reason — this determines who needs to take action."],
[4,"Contact the Collections or Credit team","Call or message the AR/Collections team (Philip Jones or their designee). Provide the customer name, order number, order amount, and hold reason. They will review the account and decide whether to approve, require payment, or deny the order."],
[5,"Do NOT release the hold without authorization","A credit hold exists to protect Adleta from shipping to a non-paying customer. Only the authorized credit approver can release a hard hold. Do not change the order status yourself."],
[6,"Credit approver releases the hold in M3","The authorized approver opens the order in OIS100, reviews the hold, and either: (A) releases the hold so the order can ship, (B) requests a prepayment before releasing, or (C) cancels the order."],
[7,"Complete the order after hold release","Once the hold is lifted, return to OIS100, confirm the order is now in released status, and verify warehouse is notified to fulfill the order."],
[8,"Document the resolution","Add a note to the order (right-click > Notes) documenting: who authorized the hold release, date, and any conditions (e.g., customer promised payment). This protects the team if the account goes unpaid."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20Manual%20Order%20Hard%20Hold%20Credit.mp4",quiz:[{q:"When promising stock to a customer, you should use:",options:["On-hand quantity","Allocated quantity","Available quantity — on-hand minus allocated","Quantity on order from suppliers"],answer:2},{q:"When M3 cannot fulfill the full order quantity, it:",options:["Cancels the entire order","Holds the order until all stock is available","Creates two lines — one for what can ship now and one backorder line for the remainder","Sends an automatic email to the customer"],answer:2},{q:"If a customer's order shows status Released but has not shipped, your first step is:",options:["Cancel the order and re-enter it","Contact Warehouse to check the shipment status","Call the customer and tell them it shipped","Re-enter the order with a new delivery date"],answer:1},{q:"Before confirming a backorder with a customer, you must:",options:["Process the shipment first","Get manager approval to create any backorder","Contact the customer to confirm whether partial shipment, backorder, or cancellation is acceptable","Check the GL account balance"],answer:2}],checklist:["I use Available quantity from MMS200 — not On-hand — when promising stock","I understand how M3 handles backorders and can explain it to a customer","I know the key order status codes and what each one means","I can locate a stuck order and identify whether it is a warehouse or credit issue","I know how to handle a partial shipment and what happens to the remaining quantity","I can cancel a backorder line with the correct reason code"]},{id:"ord-4",title:"Will Call Order — Immediate Pickup",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Immediate%20delivery%20via%20will%20call.mp4",steps:[[1,"Open OIS100 and create a new order","Press Ctrl+R > OIS100. click the + New button. The customer is at the counter or calling in for same-day pickup. Enter the customer number and verify the account is active."],
[2,"Set the order type to Will Call","Set the delivery method to Will Call (WC). This tells M3 the customer is picking up at the warehouse — no delivery route is needed. Set the warehouse to the location where the customer will pick up."],
[3,"Set the requested delivery date to today","Enter today as the requested delivery date. For immediate/same-day will call, this is critical so the warehouse prioritizes the pick."],
[4,"Enter order lines — check available quantity first","Enter the item number. Before confirming the quantity, check the Available field. Confirm the quantity is available in the warehouse TODAY. If not, let the customer know before accepting the order."],
[5,"Confirm pricing and any customer discounts","Verify the price on the line. Will call customers sometimes have specific pickup pricing. Confirm before finalizing."],
[6,"Release the order and print the pick ticket","Release the order. M3 allocates the inventory. Print the pick ticket immediately and hand it to the warehouse team — they need to pull the order before the customer arrives."],
[7,"Notify the warehouse team","Call or radio the warehouse to let them know a will call order is ready to pick. Give them the order number, items, and quantities. Tell them when the customer is expected."],
[8,"Invoice when customer picks up","When the customer arrives and signs for the goods, mark the order as picked up in M3. Process the invoice and collect payment (cash, check, or credit card) at the time of pickup. Hand the customer their invoice."]],quiz:[{q:"Will Call orders are issued at which level?",options:["Shipment level","Load level","Delivery level","Invoice level"],answer:2},{q:"Why do Will Call orders not require load building?",options:["They are too small","Customer picks up at the warehouse — no truck loading needed","IT disabled it for Will Call","The warehouse skips this step"],answer:1},{q:"Where do you change the delivery method to Will Call?",options:["CRS610","APS100","OIS300/OIS100 order header","PPS200"],answer:2},{q:"Will Call charges are added in which section of the order?",options:["Item lines","Order header comments","Charges section","Delivery notes"],answer:2}],checklist:["I can create a Will Call order in OIS300/OIS100","I know how to change the delivery method to Will Call","I can add Will Call charges to an order","I understand Will Call orders are issued at the delivery level — no load building required","I can verify the correct warehouse and Will Call route are assigned"]},{id:"ord-5",title:"Manual Order — Credit Card and COD Payment",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20Manual%20Order%20CC%20COD.mp4",steps:[[1,"Open OIS100 and enter the customer order","Press Ctrl+R > OIS100. click the + New button. Enter the customer number. If this is a COD customer, M3 may automatically flag the account — confirm you see the COD payment type on the order header."],
[2,"Set the payment type to COD or Credit Card","In the order header, locate the Payment Type or Terms field. Set it to COD (collect on delivery) or CC (credit card) depending on what the customer is using. Confirm with your trainer which code Adleta uses for each."],
[3,"For Credit Card: enter card details per Adleta policy","If the customer is paying by credit card, follow Adleta policy for capturing card information. Do NOT write card numbers on paper or store them in M3 notes. Use the approved card processing method only."],
[4,"For COD: confirm the COD amount on the order","The COD amount must match the total invoice amount including freight. Review the order total before releasing. Drivers collect this exact amount — any discrepancy causes problems at delivery."],
[5,"Enter order lines — items and quantities","Add the order lines as normal. Verify available inventory for each item."],
[6,"Verify the order total matches expected payment","Before releasing, review the order total. Confirm with the customer that they understand the exact amount due at delivery (COD) or that the card will be charged (CC)."],
[7,"Release the order","Release the order. M3 allocates inventory and flags the order as COD or prepaid. The COD amount will appear on the delivery load sheets and manifest so drivers know how much to collect."],
[8,"Confirm with the driver before dispatch","For COD orders, verify the driver knows the exact amount to collect and the accepted payment forms (cash, check, or card). Flag any COD orders where the customer has a history of not paying."]],quiz:[{q:"The delivery method code for Common Carrier in M3 is:",options:["OT","WC","CC","PP"],answer:2},{q:"Tracking numbers for Common Carrier shipments are entered at the:",options:["Order header","Invoice","Delivery level","Shipment level"],answer:2},{q:"A delivery address change must be completed:",options:["After issuing the delivery","Before issuing the delivery","At the invoice stage","At any time"],answer:1},{q:"If you encounter load building or tracking number issues, you should:",options:["Skip that step","Delete the order and re-enter","Escalate to the Support Team","Ask the customer to call back"],answer:2}],checklist:["I can create a Common Carrier order in OIS100","I know how to apply delivery charges at the line and header level","I can issue a delivery at the delivery level","I know how to update a delivery address before issuing","I can enter a tracking number at the delivery level"]},{id:"ord-6",title:"Will Call Order — COD Payment at Pickup",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Manual%20Order%20WC%20COD.mp4",steps:[[1,"Open OIS100 and enter the customer","Press Ctrl+R > OIS100. click the + New button. Enter the customer number. Will Call COD means the customer is picking up AND paying at time of pickup — common for cash customers or new accounts without established credit."],
[2,"Set delivery method to Will Call","In the order header, set the delivery method to Will Call. Set today as the delivery date if the customer is coming in. Set the warehouse to the pickup location."],
[3,"Set payment type to COD","In the payment/terms field, set the type to COD. For will call, COD means they pay at the counter when they pick up — not when a driver delivers."],
[4,"Enter order lines and check availability","Enter item number and quantity. Confirm available quantity is sufficient for today's pickup. Do not promise items that are not in stock."],
[5,"Review the total and confirm with the customer","Before releasing, confirm the order total with the customer so they know how much to bring or have their card ready. No surprises at pickup."],
[6,"Release the order and pull the pick ticket","Release the order. Print the pick ticket for the warehouse. Alert the counter or warehouse that a will call COD order is being prepped."],
[7,"Collect payment before releasing goods","When the customer arrives, collect full payment BEFORE releasing the goods. Process cash, check, or card as appropriate. Do not allow pickup without payment — this is a COD order."],
[8,"Post the cash receipt and invoice","After payment is collected, post the cash receipt to the customer account in M3. Print and hand the customer their invoice. Mark the order as complete."]],quiz:[{q:"COD stands for:",options:["Confirmed Order Delivery","Cash On Delivery","Customer Order Date","Close of Day"],answer:1},{q:"When is payment collected for COD orders?",options:["30 days after invoice","At or before delivery","Upon order entry","After the monthly statement"],answer:1},{q:"If a COD customer wants will call, the delivery method should be set to:",options:["OT","CC","Will Call with COD terms","Standard delivery"],answer:2},{q:"Prepayment for a COD order in M3 must be processed:",options:["After goods ship","Before releasing the order to the warehouse","At month end","By Finance only"],answer:1}],checklist:["I understand the difference between COD and net terms orders","I can enter a COD order in OIS100 for will call and common carrier scenarios","I know when prepayment is required and how to process it","I can apply the correct delivery method for COD orders"]},{id:"ord-7",title:"Quote to Customer Order — Converting a Quote (N30)",duration:"1 hour",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20LnTp%200%20Quote%20to%20CO%20OT%20N30.mp4",steps:[[1,"Open OIS100 and create a Quote","Press Ctrl+R > OIS100. click the + New button. Select the Quote order type (line type 0 = standard stocked item, order type Quote). Enter the customer number, warehouse, and requested date. Quotes are not binding — inventory is not allocated until conversion."],
[2,"Enter quote lines — items and quantities","Add the item numbers and quantities the customer is considering. M3 will show pricing. For shade/lot-managed items, note that availability is not guaranteed until the quote converts to a firm order."],
[3,"Review and confirm pricing on the quote","Check that all line prices reflect the current customer price agreement. Add any special pricing or discounts that have been negotiated. Save the quote."],
[4,"Give the customer the quote number","Provide the customer with the quote order number so they can reference it when they are ready to place the order. Quotes are valid per Adleta's standard quote validity period (confirm with your trainer)."],
[5,"Retrieve the quote when customer is ready to order","When the customer confirms they want to place the order, open OIS100 and look up the quote by order number or customer. Confirm the items, quantities, and pricing are still valid."],
[6,"Convert the quote to a Customer Order","Select the quote and choose Convert (or change the order type) to Customer Order. Set the order type to N30 (Net 30 terms). M3 converts the quote — inventory is now allocated."],
[7,"Verify the converted order","Confirm the customer order number was assigned. Check that all lines converted correctly — items, quantities, prices, and delivery date. The order is now a firm order."],
[8,"Release the order","Release the converted customer order. M3 allocates inventory, assigns to a route, and the order flows into the warehouse pick queue. Notify the customer of their confirmed order number."]],quiz:[{q:"A quote in M3 differs from a confirmed customer order because:",options:["Quotes have no items","Quotes do not commit inventory until converted to a CO","Quotes cannot have delivery dates","Quotes skip the invoicing step"],answer:1},{q:"To convert a quote to a customer order, you use:",options:["A new order entry in OIS100","The conversion action within OIS100","PPS200","A manual journal entry"],answer:1},{q:"After converting a quote to a CO, M3 will:",options:["Delete the original quote","Commit inventory to the order","Automatically invoice the customer","Require re-entry of all items"],answer:1},{q:"The quote workflow is typically used for:",options:["All routine daily orders","Small will call orders","Large or custom orders requiring customer approval before commitment","COD customers only"],answer:2}],checklist:["I can create a quote in OIS100 using the correct order type or line type","I can save a quote and locate it later by quote number or customer","I can convert a quote to a confirmed customer order","I understand the inventory commitment difference between a quote and a CO"]},{id:"ord-8",title:"Drop Ship Order — Quote to Customer Order with Non-Cancel",duration:"1.5 hours",videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Drop%20Ship%20Quote%20to%20CO%20with%20NonCX.mp4",steps:[[1,"Open OIS100 and create a Drop Ship Quote","Press Ctrl+R > OIS100. click the + New button. Select the Drop Ship order type. Enter the customer number and the vendor who will ship directly to the customer. Drop ship means the vendor ships directly — Adleta never physically handles the product."],
[2,"Enter the customer ship-to address","For drop ships, verify the ship-to is the customer delivery address (not Adleta warehouse). click the lookup icon in the Ship-To field if you need to add a new delivery address for this customer."],
[3,"Enter the item and quantity on the quote line","Add the item number and quantity. For drop ship, confirm the item is set up for drop ship in M3 (your trainer can verify). Enter the sell price to the customer."],
[4,"Set the Non-Cancel (NonCX) flag","On the order line, locate the Non-Cancel field and set it to YES (or the correct NonCX indicator). This flag means once Adleta places the PO with the vendor, the customer cannot cancel the order without penalty. Confirm the customer agrees to this before setting NonCX."],
[5,"Save the quote and get customer confirmation","Save the drop ship quote. Contact the customer to confirm: item, quantity, delivery address, price, and the non-cancel terms. Get their approval before converting to a firm order."],
[6,"Convert the quote to a Customer Order","Once the customer confirms, open the quote and convert it to a Customer Order. M3 automatically generates a corresponding Purchase Order to the drop ship vendor."],
[7,"Verify the auto-generated PO in PPS200","Open PPS200 and confirm the drop ship PO was created to the correct vendor with the correct item, quantity, and the customer delivery address as the ship-to. Transmit the PO to the vendor."],
