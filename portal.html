olid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS300 &mdash; Common Carrier Shipment Processing</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Open OIS300</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Create shipment</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Add orders</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Confirm pick MWS410</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Assign carrier MWS420</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Print BOL</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Issue shipment</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Carrier<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>UPS Ground</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Ship date<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>2026-06-11</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>PRO / tracking number</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>Carrier tracking number</span></span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>CO#</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Customer</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Cartons</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Weight</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Status</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>CO-100001</td><td style='padding:3px 8px;background:#fffbe6;'>Alan Wheelock</td><td style='padding:3px 8px;background:#fffbe6;'>5 CT</td><td style='padding:3px 8px;background:#fffbe6;'>120 lbs</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989; Ready</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>CO-100002</td><td style='padding:3px 8px;background:#fffbe6;'>Abby Sydnor</td><td style='padding:3px 8px;background:#fffbe6;'>3 CT</td><td style='padding:3px 8px;background:#fffbe6;'>80 lbs</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989; Ready</td></tr></table></div>"],["2","Print Pick List and Pick Items","Print the pick list. Pick items from warehouse locations, verifying item numbers and quantities."],["3","Pack and Stage for Carrier","Pack items securely for common carrier shipment. Stage in the carrier staging area."],["4","Issue Delivery at Delivery Level","In M3, issue the delivery at the delivery level — not the shipment level. Use desktop or RF handheld device."],["5","Obtain Tracking Number","Obtain the tracking number from the carrier or TMS system when the carrier picks up."],["6","Enter Tracking Number in M3","Enter the tracking number at the delivery level in M3. This creates the shipment record and links tracking to the customer order."],["7","Update Delivery Address if Needed","If a delivery address change is needed, it MUST be done before issuing the delivery. Use system shortcuts to update."],["8","AR Invoice is Triggered","After the delivery is issued, M3 automatically triggers the AR invoice to the customer. The Order to Cash cycle is complete."]],quiz:[{q:"Common Carrier deliveries are issued at the:",options:["Shipment level","Delivery level","Load level","Order header level"],answer:1},{q:"Tracking numbers for Common Carrier shipments are entered in M3 at the:",options:["Order header","Invoice","Pick list","Delivery level"],answer:3},{q:"A delivery address change must be completed:",options:["After issuing the delivery","At any time up to invoicing","Before issuing the delivery","Only by a Finance user"],answer:2},{q:"After a Common Carrier delivery is issued in M3, what happens automatically?",options:["A PO is created","The AR invoice is triggered","The item is back-ordered","The pick list is reprinted"],answer:1}],checklist:["I can process a Common Carrier pick and pack workflow","I can issue a Common Carrier delivery at the delivery level in M3","I can enter a tracking number at the delivery level","I know how to update a delivery address before issuing","I understand that issuing the delivery triggers the AR invoice"]}]},
  productManagement:{id:"productManagement",name:"Product Management",owner:"Lauren Calvey",weeks:"Week 5-6",pill:"pill-gray",color:"#7a5ea6",programs:["MMS060","MMS001","MMS002","OIS010","MMS200"],summary:"Item master setup and maintenance, product lifecycle, pricing structures, and product catalog management in M3.",links:[["Guide",SP+"/Adleta_M3_ProductManagement_LearningGuide.docx"]],sessions:[{id:"prd-1",title:"Discontinuing an Item — Status 50 and MRP Off",duration:"60 min",steps:[[1,"Review the Item in MMS060","Open MMS060. Look up the test item to be discontinued. Review its current status, on-hand quantity, and any open purchase orders or customer orders that reference it.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; MMS001 &mdash; Discontinue Item &mdash; Status 50 + MRP Off</div><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Open MMS001</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Status &rarr; 50</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>MRP &rarr; OFF</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Review open orders</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Cancel remaining POs</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>Archive item</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Item number<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>ARM51899031</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Item status<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>50 = Discontinued</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>MRP indicator<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>0 = Off (no more POs generated)</span></span></div><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Status code</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Meaning</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>10</td><td style='padding:3px 8px;'>New &mdash; not yet active</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>20</td><td style='padding:3px 8px;'>Active &mdash; normal ordering</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>50</td><td style='padding:3px 8px;background:#fffbe6;'>Phase-out &mdash; sell remaining stock only</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>90</td><td style='padding:3px 8px;'>Inactive &mdash; no transactions allowed</td></tr></table><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; Before setting status 50, check MMS060 for remaining on-hand stock and OIS100 for any open customer orders.</div></div>"],
      [2,"Turn Off MRP Planning Flag","Navigate to the correct panel in MMS060. Change the MRP/planning flag to OFF. Save. This stops M3 from auto-generating planned purchase orders for the item going forward."],
      [3,"Change Item Status to 50","Change the Item Status to 50 (Discontinued). Save. Status 50 prevents new customer orders from being placed for this item. Existing open orders are not affected."],
      [4,"Verify New Orders Are Blocked","Open OIS100 and try to enter an order line for the discontinued item. M3 should error or display a warning. Show the exact message so Lauren knows what the customer service team will see."],
      [5,"Document the Discontinuation","Add a note to the item in MMS060 documenting: the discontinuation date, the reason (e.g., replaced by new item number), and who authorized the change. This is required for audit purposes."]],videoUrl:"",quiz:[{q:"Item master records are managed in:",options:["OIS100","CRS610","MMS060","PPS200"],answer:2},{q:"Setting the MRP flag to OFF on an item stops M3 from:",options:["Shipping the item","Auto-generating planned purchase orders for that item","Displaying the item in OIS100","Deleting the item"],answer:1},{q:"Item Status 50 prevents:",options:["Receiving against open POs","New customer orders from being placed","Existing open orders from shipping","The item from appearing in Birst"],answer:1}],checklist:["I can look up an item in MMS060 and review its status and open orders","I can turn off the MRP planning flag and explain what it does","I can change Item Status to 50 and verify new orders are blocked in OIS100","I add a note to the item with discontinuation date, reason, and authorizer"]},{id:"prd-2",title:"Product Lifecycle and Pricing Structure — MMS060 and OIS010",duration:"60 min",steps:[["1","Understand product lifecycle","Products move through stages: new, active, being phased out, and discontinued. M3 controls which transactions are allowed at each stage through item status. Your job is to keep item records accurate as products change.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; MMS060 / OIS017 &mdash; Product Lifecycle and Pricing Structure</div><b>Pricing hierarchy in M3:</b><br><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Level</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What it controls</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Item base price</td><td style='padding:3px 8px;'>MMS001</td><td style='padding:3px 8px;'>Default list price per item</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Customer price list</td><td style='padding:3px 8px;background:#fffbe6;'>OIS017</td><td style='padding:3px 8px;background:#fffbe6;'>Price list assigned to a customer or group</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Price list details</td><td style='padding:3px 8px;'>OIS010</td><td style='padding:3px 8px;'>Specific items + prices on a price list</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Order-line override</td><td style='padding:3px 8px;'>OIS101</td><td style='padding:3px 8px;'>One-time price change on a specific line</td></tr></table><br><b>MMS060 &mdash; item lifecycle fields to know:</b><br><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Item status</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>20 = Active</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>On-hand qty</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>500 CT</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Last received date</span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;'><span style='color:#aaa'>2026-05-15</span></span></div></div>"],["2","Managing a product change","When a product is updated — new description, UOM change, category change — do not delete the old record. Update it in MMS060 and document the change with a note and date."],["3","Discontinuing a product","When Adleta stops selling an item, set status to 90 (Inactive) in MMS060 only after confirming: no open POs, no open sales orders, and zero stock on hand. Contact Purchasing, Sales, and Warehouse before inactivating."],["4","Understand price list structure","Prices in M3 live in OIS010, not on the item record. An item can have different prices on different price lists — standard, promotional, customer-specific."],["5","Open OIS010","Navigate to Sales > Price List > OIS010. Select a price list and find an item. Review base price, effective date, expiry date, and UOM."],["6","Add or update an item price","Select the price list. Add the item number, price, effective date, and UOM. Set an expiry date if this is a promotional price. Save."],["7","Verify price on a sales order","Open OIS100, enter the customer and item. Confirm M3 pulls the correct price based on the customer's assigned price list. If the wrong price appears, check the customer's price list assignment in OIS017."],["8","Coordinate price changes","Price changes affect Sales, Finance, and customer communications. Notify KRISTENB and Sales before updating a price list that is assigned to active customers. Document the effective date and reason for every change."]],videoUrl:"",quiz:[{q:"To discontinue an item in M3, you set its status to 90. Before doing this you must confirm:",options:["The item has been in the system for at least one year","There are no open POs, no open sales orders, and zero stock on hand — and you have notified Purchasing, Sales, and Warehouse","Finance has approved the removal","IT has deleted the item from the price list"],answer:1},{q:"Item prices in M3 are stored in:",options:["MMS060 on the item record","OIS010 on the price list","MMS200 in the stock balance","GLS040 in the chart of accounts"],answer:1},{q:"If a sales order is pulling the wrong price for a customer, the first place to check is:",options:["The item record in MMS060","The customer's price list assignment in OIS017","The GL account","The purchase order"],answer:1},{q:"When making a price list change that affects active customers, you should:",options:["Make the change immediately and notify no one","Update the expiry date but leave the price alone","Notify KRISTENB and Sales before updating, document the effective date and reason","Wait until the end of the financial year"],answer:2}],checklist:["I understand the product lifecycle stages and how item status controls M3 transactions","I know the steps to safely discontinue a product — checking POs, orders, stock, and notifying departments","I can add and update item prices in OIS010 with correct effective and expiry dates","I verify price changes on a test sales order before communicating to the business","I document every price change with effective date and reason and notify affected teams in advance"]},{id:"prd-3",title:"Master Data Quality and New Product Launch Coordination",duration:"60 min",steps:[["1","Understand master data ownership","As Product Management super user, you own the accuracy of the item master. Bad item data — wrong UOM, wrong category, missing description, wrong status — creates errors in Purchasing, Warehouse, Sales, and Finance. Master data quality is not just a Product Management problem; it affects every department.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; MMS001 &mdash; New Product Launch &mdash; Master Data Checklist</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Data element</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Required?</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Item number and description</td><td style='padding:3px 8px;background:#fffbe6;'>MMS001</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Item status = 20 active</td><td style='padding:3px 8px;background:#fffbe6;'>MMS001</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Unit of measure CT / SF / EA</td><td style='padding:3px 8px;background:#fffbe6;'>MMS001</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Base price</td><td style='padding:3px 8px;background:#fffbe6;'>MMS001 / OIS017</td><td style='padding:3px 8px;background:#fffbe6;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Stocking warehouse</td><td style='padding:3px 8px;'>MMS002</td><td style='padding:3px 8px;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>MRP indicator</td><td style='padding:3px 8px;'>MMS003</td><td style='padding:3px 8px;'>&#9989; Required</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Lot tracking on/off</td><td style='padding:3px 8px;'>MMS001</td><td style='padding:3px 8px;'>Required if shade/dye lot item</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Customer price list</td><td style='padding:3px 8px;'>OIS017 / OIS010</td><td style='padding:3px 8px;'>If customer-specific pricing</td></tr></table><div style='background:#fce8e7;border:1px solid #c0443b;border-radius:4px;padding:7px 10px;font-size:12px;color:#c0443b;margin-top:8px'>&#9888; Do not enter sales orders for a new item until all required fields above are complete and verified in the test environment.</div></div>"],["2","Run a regular item master audit","Periodically review MMS060 for items that need attention: items with status 10 (Pending) that have been sitting for more than 30 days, items with missing descriptions, items with incorrect UOM, and items that are no longer sold but still show as Active."],["3","Check for duplicate items","Search MMS060 by description keyword to find potential duplicates. Duplicates cause split inventory history, pricing inconsistencies, and reporting errors. If duplicates exist, coordinate with IT and Purchasing before consolidating — do not inactivate without confirming which record is correct."],["4","Coordinate a new product launch","When Adleta adds a new product line: create the item record in MMS060 (status 10 while building). Confirm UOM, category, and stock method with Purchasing and Warehouse. Add the price in OIS010 with correct effective date. Notify Sales before the item goes Active — they need to know it is available to sell."],["5","Communicate launch timing","Product Management owns the launch checklist: item created, UOM confirmed, price set, Purchasing notified to set up supplier, Warehouse notified to receive first stock, Sales notified of availability date. All five must be complete before status changes to 20 (Active)."],["6","Handle item substitutes and alternates","When a product is temporarily out of stock or discontinued, Sales may need a substitute. Document known substitutes on the item record notes field and share with Sales. Communicate lead time and availability differences so Sales can set correct customer expectations."],["7","Manage seasonal and promotional items","Seasonal items should be set up well in advance — confirm with Purchasing on lead times. Set the item price in OIS010 with a specific effective date and expiry date. After the season ends, inactivate if it will not return, or leave Active with no open orders if it will return next season."],["8","Document everything","Every item creation, status change, UOM change, and price change must be documented: who made the change, when, and why. Use the Notes field in MMS060 and the team SharePoint folder. This protects the business during audits and helps troubleshoot issues when something unexpected happens downstream."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Turn%20Off%20MRP%20on%20item%20when%20discontinued%20Sts-50.mp4",quiz:[{q:"Before a new item's status is changed to Active (20) in MMS060, which five things must be complete?",options:["Item number, color, weight, size, and brand","Item created, UOM confirmed, price set, Purchasing and Warehouse notified, Sales notified of availability","IT approval, Finance approval, manager sign-off, legal review, and vendor contract","Item created, test order placed, shipped, invoiced, and paid"],answer:1},{q:"If you find a potential duplicate item in MMS060, you should:",options:["Immediately inactivate the newer one","Coordinate with IT and Purchasing to confirm which record is correct before taking action","Delete both and start over","Leave it — duplicates are normal in M3"],answer:1},{q:"Item substitutes for out-of-stock products should be:",options:["Handled verbally between Sales reps without any documentation","Documented in the item record notes and shared with Sales, including lead time and availability differences","Created as new item records in MMS060","Entered as returns in OIS390"],answer:1},{q:"A seasonal item whose price expires at end of season should be handled by:",options:["Deleting the price record after the season","Setting an expiry date on the price in OIS010 when the price is created — not managing it manually after the fact","Leaving the old price active until the next season starts","Contacting Finance to remove the price"],answer:1}],checklist:["I understand my role as master data owner and how item data quality affects every department","I can run a regular item master audit and identify items needing attention in MMS060","I know the five-step new product launch checklist before changing status to Active","I document all item changes with who, when, and why — in MMS060 notes and SharePoint","I know how to handle item substitutes and communicate them to Sales with lead time differences","I manage seasonal item prices with correct effective and expiry dates in OIS010"]}]},
  week9:{id:"week9",name:"Trainer Readiness and Go-Live Prep",owner:"All super users",weeks:"Week 9",pill:"pill-red",color:"#c0443b",programs:["Teams","SharePoint","Issue Log","Planner"],summary:"Teach-backs, readiness sign-off, FAQ build, go-live support roles, department training handoff, and stabilization.",links:[["Teach-Back Packet",SP+"/Week_9_Teach_Back_Readiness_Signoff_Packet.md"],["Go-Live Playbook",SP+"/Go_Live_Support_Playbook.md"],["Department Handoff Plan",SP+"/Department_Training_Handoff_Plan.md"]],sessions:[{id:"w9-1",title:"Teach-Back Preparation",duration:"60 min",steps:[["1","Review your module","Open your module in the portal and review every session, step, quiz, and checklist. Identify any gaps before your teach-back."],["2","Know your 15-minute structure","2 min: explain the department workflow. 5 min: walk through key M3 programs. 3 min: explain one exception and first response. 2 min: explain a department handoff. 2 min: give a practice question you would ask users. 1 min: confirm escalation path."],["3","Prepare your normal scenario","Choose one complete normal workflow you can walk through live in M3 — from opening the program to saving the transaction."],["4","Prepare your exception scenario","Choose one common exception in your module. Know the steps: identify it, who to contact, how to log it."],["5","Prepare your handoff","Name one department that hands off to you and one you hand off to. Know what data must be correct at each handoff."],["6","Prepare a department training tip","Think about one thing your department users will find confusing. Plan how you would explain or demonstrate it."],["7","Practice with a peer","Run through your 15-minute teach-back with another super user. Time yourself. Get feedback on clarity."],["8","Review the rubric","Passing requires average 2.5 or higher across all criteria and no score of 1 in navigation, transaction accuracy, or trainer readiness."]],videoUrl:"",quiz:[{q:"The teach-back format is 15 minutes. The first 2 minutes should cover:",options:["Walking through every screen in your module","Explaining the department workflow in plain business language","Reading from your training notes","Showing the issue log template"],answer:1},{q:"The passing standard for the teach-back rubric is:",options:["Perfect scores on all criteria","Average of 2.5 or higher and no score of 1 in navigation, accuracy, or trainer readiness","Completing all sessions in the portal","Attending all 9 weeks of training"],answer:1},{q:"If you are scored 1 (Not Ready) on System Navigation, you:",options:["Still pass if your other scores are high enough","Do not pass regardless of other scores","Can retake only that section","Are automatically assigned to IT support"],answer:1},{q:"The best way to prepare for your teach-back is:",options:["Memorize the program codes","Practice the full 15-minute walkthrough with a peer and time yourself","Read the training documents the night before","Ask Kristen to show you the workflow again"],answer:2}],checklist:["I have reviewed every session, step, and checklist in my assigned module","I know my 15-minute teach-back structure","I have a normal scenario I can walk through live in M3","I have an exception scenario with the correct handling steps","I know my upstream and downstream department handoffs","I have practiced with a peer and received feedback","I understand the rubric and passing standard"]},{id:"w9-2",title:"Teach-Back and Readiness Sign-Off",duration:"90 min",steps:[["1","Deliver your 15-minute teach-back","Present to KRISTENB and the group. Follow the structure: workflow, programs, exception, handoff, practice question, escalation path."],["2","Receive rubric scores","KRISTENB scores each criteria 1-3. Listen for feedback. Do not argue — note coaching items for remediation."],["3","Review readiness decision","Ready: proceed to department training plan. Ready With Coaching: targeted remediation assigned before go-live. Not Ready: additional training scheduled with backup support assigned."],["4","Build your FAQ contribution","Write 3-5 questions your department users are likely to ask. Include the correct answer and which program or step it relates to. Submit to the shared FAQ."],["5","Review open issues","Go through the issue log. For each open item in your module: confirm owner, confirm resolution path, and flag anything that could block go-live."],["6","Sign readiness acknowledgment","Complete the readiness acknowledgment form: name, department, module, readiness status, required remediation, and signature. Manager countersigns."],["7","Confirm department training date","Lock in the date, location, and attendee list for your department training session. Confirm practice data is ready."]],videoUrl:"",quiz:[{q:"If you receive a readiness status of Ready With Coaching, your next step is:",options:["Wait for go-live and figure it out on the job","Complete assigned remediation and retest the weak area before go-live","Start training your department immediately","Request a different module assignment"],answer:1},{q:"Your FAQ contribution should include:",options:["Every possible M3 question","3-5 likely questions from your department users with correct answers and program references","Only questions you personally had during training","A copy of all training documents"],answer:1},{q:"The readiness acknowledgment confirms that you:",options:["Scored perfectly on all quizzes","Attended every training session without absence","Completed training, practiced, finished your teach-back, and understand your go-live responsibility","Have read all SharePoint documents"],answer:2},{q:"Before your department training session, you must confirm:",options:["That all super users have passed their teach-backs","Training date, attendees, practice data, and that your known issues are documented","That the portal has been updated","That IT has finished the system configuration"],answer:1}],checklist:["I delivered my 15-minute teach-back","I received my rubric scores and understand any coaching feedback","I know my readiness status — Ready, Ready With Coaching, or Not Ready","I submitted 3-5 FAQ contributions with correct answers","I reviewed all open issues in my module and confirmed owners","I signed the readiness acknowledgment","My department training date and attendee list are confirmed"]},{id:"w9-3",title:"Go-Live Support and Department Handoff",duration:"60 min",steps:[["1","Know your support tier","You are Tier 1 — first-line support for your department. Handle how-to questions, navigation, and known workarounds. Escalate to KRISTENB (Tier 2) when an issue blocks work, affects data, or needs a configuration change."],["2","Know the issue log fields","Every issue must include: date/time, department, reported by, program, process, what happened, steps tried, business impact, priority (High/Medium/Low), owner, status, and resolution."],["3","Understand issue priority","High: blocks orders, shipments, receiving, invoicing, payment, or period close — same day triage. Medium: workaround exists but slows work — 1-2 days. Low: question, training gap, or enhancement — weekly review."],["4","Know the daily go-live rhythm","Start of day: review open high-priority issues. Midday: check blockers. End of day: review resolved items and FAQ updates. Report to KRISTENB if anything is blocking your department."],["5","Confirm your floor support availability","Know your agreed support hours during go-live week. Keep your module guide and quick reference open. Use training materials before guessing."],["6","Review your department training handoff checklist","Confirm: department user list, training date, quick reference ready, practice scenario ready, known issues documented, escalation path shared, sign-off method confirmed."],["7","Avoid unauthorized changes","Never make data or configuration changes in production without approval. Log the issue and escalate. Document everything."],["8","Post go-live stabilization","For the first 2-4 weeks: continue daily issue review, track repeated training gaps, update job aids weekly, hold department check-ins, review open items with leadership weekly."]],videoUrl:"",quiz:[{q:"As a Tier 1 super user, you should escalate an issue to KRISTENB when:",options:["A department user asks a how-to question","The issue blocks work, affects data, or requires a configuration or security change","Someone is confused about navigation","You want to update the FAQ"],answer:1},{q:"A High priority issue is one that:",options:["Is annoying but has a workaround","Blocks orders, shipments, receiving, invoicing, payment, or period close","Is a training gap or question","Was logged more than once"],answer:1},{q:"If a department user asks you how to do something and you are not sure, you should:",options:["Give your best guess","Tell them to call IT","Check your training materials first before answering","Ignore the question until you are certain"],answer:2},{q:"During the post go-live stabilization period, repeated questions should become:",options:["Ignored after the first week","FAQ updates and job aid improvements","Escalations to Infor support","New training sessions from scratch"],answer:1}],checklist:["I know my support tier and what I handle vs what I escalate","I can create a complete issue-log entry with all required fields","I know the three priority levels and response expectations","I know the daily go-live rhythm and when to report to KRISTENB","I have confirmed my floor support availability during go-live week","My department training handoff checklist is complete","I understand I must never make unauthorized data or configuration changes in production"]}]},
  endToEnd:{id:"endToEnd",name:"End-to-End Process Walkthroughs",owner:"All super users",weeks:"Week 8",pill:"pill-gold",color:"#c49a2a",programs:["CRS610","CRS620","PPS200","PPS300","OIS100","OIS300","APS100","APS200","ARS100","ARS200","MMS200"],summary:"Full cross-functional walkthroughs connecting Purchasing, Warehouse, Sales, and Finance through Procure to Pay and Order to Cash.",links:[["Procure to Pay Packet",SP+"/Week_8_Procure_to_Pay_Walkthrough_Packet.md"],["Order to Cash Packet",SP+"/Week_8_Order_to_Cash_Walkthrough_Packet.md"]],sessions:[{id:"w8-1",title:"Procure to Pay — Full Walkthrough",duration:"90 min",steps:[["1","Verify supplier — CRS620","Purchasing opens CRS620 and confirms the supplier is active, has payment terms, and is ready for a PO."],["2","Create PO header — PPS200","Purchasing opens PPS200, clicks New for a new PO. Enters supplier, PO type, buyer, warehouse, and requested delivery date."],["3","Add PO lines — PPS201","Purchasing adds at least two lines: item number, quantity, UOM, price, and delivery date. Records the PO number assigned by M3."],["4","Approve and release PO","Purchasing confirms the PO status is released/ready per Adleta rules before communicating to the supplier."],["5","Receive goods — PPS300","Warehouse opens PPS300, finds the PO, verifies packing slip against PO items and quantities, enters actual received quantities, and confirms. Records receipt number."],["6","Verify inventory update — MMS200","Warehouse opens MMS200 and confirms the received item shows updated on-hand and available balances."],["7","Enter supplier invoice — APS100","Finance AP opens APS100, enters the supplier invoice referencing the PO number. Enters invoice date, amount, and runs F14 three-way match."],["8","Resolve match result","If matched: invoice is auto-approved. If variance: Finance AP contacts Purchasing (price issue) or Warehouse (quantity issue) to resolve before payment."],["9","Create payment proposal — APS200","Finance AP opens APS200, includes the approved invoice in a payment proposal. Reviews before processing."],["10","Debrief — handoff questions","Group discusses: what must each department get right for the next step to work? Where do delays or errors originate?"]],videoUrl:"",quiz:[{q:"Before Warehouse can receive goods, Purchasing must ensure:",options:["The invoice is already entered in APS100","The PO is released and the supplier, item, quantity, and UOM are correct","The payment proposal is approved","Inventory is at zero for that item"],answer:1},{q:"The three-way match in APS100 compares:",options:["PO, receipt, and supplier invoice","PO, customer order, and payment","Supplier invoice, GL account, and payment","PO, warehouse, and freight invoice"],answer:0},{q:"A quantity variance on the three-way match means:",options:["The supplier invoice price is wrong","The invoice quantity does not match what was received","The PO was not released","Finance entered the wrong supplier number"],answer:1},{q:"Which department owns resolving a price variance between the PO and the supplier invoice?",options:["Warehouse","Finance AR","Purchasing and Finance AP together","IT"],answer:2}],checklist:["I can trace all 10 steps of the Procure to Pay process","I understand what each department must get right before the handoff","I can identify whether a match exception is a price variance or quantity variance","I know who to contact to resolve each type of exception","I completed a proof-of-completion entry with supplier, PO, receipt, and invoice references"]},{id:"w8-2",title:"Order to Cash — Full Walkthrough",duration:"90 min",steps:[["1","Verify customer — CRS610","Sales / CS opens CRS610 and confirms the customer is active, reviews payment terms, price list, and credit status."],["2","Create order header — OIS100","Sales / CS opens OIS100, clicks New for a new order. Enters customer number, order type, ship-to address, requested delivery date, and customer PO number."],["3","Add order lines — OIS101","Sales / CS adds at least two lines: item, quantity, UOM, price, and delivery date. Verifies M3 auto-populated the correct price from the customer's price list."],["4","Check availability — MMS200","Sales / CS or Warehouse checks available quantity in MMS200. If stock is short, a backorder decision is made and communicated to the customer before proceeding."],["5","Confirm shipment — OIS300","Warehouse opens OIS300, finds the order, verifies items and ship-to address, enters actual shipped quantities, ship date, and carrier/tracking. Presses F5 to confirm — inventory updates and invoice is triggered."],["6","Review customer invoice — ARS100","Finance AR opens ARS100, locates the invoice generated from the shipment. Verifies customer, order number, shipped quantity, and invoice amount."],["7","Apply customer payment — ARS200","Finance AR opens ARS200, enters the customer payment, and applies it to the correct invoice. Verifies the invoice balance clears to zero."],["8","Review aging if needed — ARS300","Finance AR opens ARS300 to confirm the customer's aging is updated. Flags any remaining overdue balances for follow-up."],["9","Handle exception — backorder or credit hold","If backorder: Sales / CS documents and communicates delay. If credit hold: Sales / CS stops and contacts Finance AR before any customer communication."],["10","Debrief — handoff questions","Group discusses: where do customer-facing problems start? Where do financial problems start? What does each department need from the previous step?"]],videoUrl:"",quiz:[{q:"Before Warehouse can ship an order, Sales / CS must ensure:",options:["The payment is already collected","The customer invoice is generated","The customer order has correct items, quantities, ship-to address, and requested date","The AR aging is reviewed"],answer:2},{q:"Confirming a shipment in OIS300 automatically:",options:["Creates a new customer order","Updates inventory and triggers the customer invoice","Sends an email to the customer","Closes the customer account"],answer:1},{q:"If a customer is on credit hold, Sales / CS should:",options:["Ship the order and let Finance sort it out","Contact the customer directly to collect payment","Stop order processing and contact Finance AR before any customer communication","Cancel the order without notifying anyone"],answer:2},{q:"Applying a customer payment in ARS200 to the wrong invoice causes:",options:["No problem — it can be corrected later without impact","The correct invoice to remain open and appear overdue, possibly triggering a credit hold","The payment to be lost","The order to be cancelled"],answer:1}],checklist:["I can trace all steps of the Order to Cash process from customer order to payment","I understand what each department must get right before the handoff","I know how to handle a backorder — availability check, decision, and customer communication","I know the credit hold process and that Sales / CS must contact Finance before communicating with the customer","I completed a proof-of-completion entry with customer, order, shipment, invoice, and payment references"]}]},
  reporting:{id:"reporting",name:"Pricing and Reporting",owner:"Jeanell Coral",weeks:"Week 7",pill:"pill-gray",color:"#344b5f",programs:["OIS600","OIS620","OIS017","OIS010","MMS600","ARS300","GLS990"],summary:"Price lists, customer pricing, price overrides, standard reports, exports, scheduled reports, and KPI dashboards.",links:[["Deck",SP+"/Adleta_M3_Reporting_Training_Deck.pptx"],["Guide",SP+"/Adleta_M3_Reporting_LearningGuide.docx"]],sessions:[{id:"rep-1",title:"Birst for Sales — Daily Sales Performance",duration:"40 min",steps:[[1,"Run the Open Orders Report (OIS600)","Navigate to OIS600 in the M3 training environment. Enter the parameters: set the date range to the last 30 days, leave all other parameters at default. Press F5 to run. M3 generates a list of all open customer orders.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; Birst &mdash; Sales Performance Dashboard</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Section</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What it shows</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Left panel</td><td style='padding:3px 8px;background:#fffbe6;'>Your saved reports and folders</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Center canvas</td><td style='padding:3px 8px;'>Active report or dashboard tiles</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Top bar</td><td style='padding:3px 8px;'>Filters: Date range, Division, Warehouse, Rep</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Refresh indicator</td><td style='padding:3px 8px;'>When data was last updated (overnight refresh)</td></tr></table><br><b>Key Sales KPIs in the pre-built dashboard:</b><br><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>KPI</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Source in M3</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Refresh</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>Sales MTD ($)</td><td style='padding:3px 8px;background:#fffbe6;'>OIS invoiced orders</td><td style='padding:3px 8px;background:#fffbe6;'>Daily</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Open orders (#)</td><td style='padding:3px 8px;'>OIS100 status 20-66</td><td style='padding:3px 8px;'>Daily</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Top 10 customers</td><td style='padding:3px 8px;'>OIS revenue by customer</td><td style='padding:3px 8px;'>Daily</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Sales by product line</td><td style='padding:3px 8px;'>OIS by item group</td><td style='padding:3px 8px;'>Daily</td></tr></table><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; Birst data refreshes overnight. For real-time order status, check OIS100 in M3 directly.</div></div>"],
      [2,"Filter Results to Status 22 (Released)","Use the filter bar at the top of the report to narrow results to orders with status 22 (Released). This shows only orders currently in the warehouse queue waiting to ship. Review the filtered list."],
      [3,"Export to Excel and Sort","Press F17 to export the report results to Excel. In Excel, sort the data by Requested Delivery Date from oldest to newest. This prioritizes the most overdue orders at the top of the list for immediate follow-up."],
      [4,"Save as a Favorite with Standard Parameters","Return to M3. Set up OIS600 with the parameters you use most (last 30 days, status 22). Save this as a Favorite so you can run it in one click each morning without re-entering the parameters."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Content%20Overview%20Workshop.mp4",quiz:[{q:"The Open Orders Report is found in:",options:["GLS990","ARS300","OIS600","MMS600"],answer:2},{q:"To export a report from M3 to Excel, you press:",options:["F3","F5","F14","F17"],answer:3},{q:"Saving a report as a Favorite in M3 lets you:",options:["Share it with all users automatically","Run it with your standard parameters in one click","Lock the parameters so no one can change them","Schedule it to run automatically every morning"],answer:1}],checklist:["I can navigate to OIS600 and run the Open Orders report for the last 30 days","I can filter report results by order status (status 22)","I can export report results to Excel using F17","I can sort the Excel export by requested delivery date oldest to newest","I have saved OIS600 with standard parameters as a Favorite"]},{id:"rep-2",title:"Birst Visualizer — Building a Custom Sales Report",duration:"50 min",steps:[[1,"Run the Back Order Report (OIS620)","Navigate to OIS620. Run the report for all warehouses with no other filters. Press F5. M3 displays all orders with unshipped lines past the requested delivery date. This is the daily report Terri uses to monitor fulfillment.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; Birst Visualizer &mdash; Building a Custom Report</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Step</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Action</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>1</td><td style='padding:3px 8px;background:#fffbe6;'>Click New Report in Birst</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>2</td><td style='padding:3px 8px;'>Choose subject area: Sales, Inventory, AP, or AR</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>3</td><td style='padding:3px 8px;'>Drag dimensions to rows: Customer, Item, Date, Rep</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>4</td><td style='padding:3px 8px;'>Drag measures to values: Revenue, Qty, Margin</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>5</td><td style='padding:3px 8px;'>Add filters: date range, customer group, warehouse</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>6</td><td style='padding:3px 8px;'>Choose chart type: table, bar, line, or pie</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>7</td><td style='padding:3px 8px;'>Save to Shared &gt; Super User folder</td></tr></table><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; Save reports to the Shared folder so other super users can access them. Reports in My Reports are private.</div></div>"],
      [2,"Identify the Top 3 Back Order Items","Review the report results. Sort or scan to identify the 3 items with the highest total back order quantity across all customers. Record the item numbers and quantities — these are the highest-priority items for the purchasing team to expedite."],
      [3,"Check Expected Receipt Dates in MMS200","For each of the top 3 back order items, open MMS200. Check if there is incoming stock on purchase orders — look for expected receipt dates. This tells you when the back order can ship so you can communicate accurate dates to customers."],
      [4,"Schedule OIS620 as a Daily Automated Report","From the OIS620 output, open the Report Scheduler. Name the scheduled report: Daily Back Order Report. Set frequency to Daily (weekdays). Set run time to 7:00 AM. Set recipients to yourself and KRISTENB. Set output format to Excel. Save and verify the schedule was created correctly."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Visualizer%20workshop.mp4",quiz:[{q:"The Back Order Report is found in:",options:["OIS600","OIS610","OIS620","OIS700"],answer:2},{q:"After identifying back order items, you check expected receipt dates in:",options:["ARS300","MMS200","CRS610","GLS040"],answer:1},{q:"The Daily Back Order Report should be scheduled to run at:",options:["End of business (5pm)","Early morning (7am) so results are ready for the day","Weekly on Mondays only","Only when back orders exist"],answer:1}],checklist:["I can navigate to OIS620 and run the Back Order report for all warehouses","I can identify the top 3 items by back order quantity","I can check expected receipt dates for back order items in MMS200","I have scheduled OIS620 to run daily at 7am with correct recipients and Excel output"]},{id:"rep-3",title:"Birst Dashboards — Building a Sales KPI Dashboard",duration:"45 min",steps:[[1,"Create a new dashboard","From the Birst home screen, click Dashboards, then + New Dashboard. A blank grid canvas opens. Dashboards are different from reports — they show multiple reports and KPIs on one screen so you see everything at a glance without clicking around.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; Birst &mdash; KPI Dashboard Setup</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Step</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>How to do it</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>1. Build tile reports</td><td style='padding:3px 8px;background:#fffbe6;'>Create individual reports in Birst Visualizer first</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>2. Pin to dashboard</td><td style='padding:3px 8px;'>Open report &rarr; click pin icon &rarr; choose target dashboard</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>3. Arrange tiles</td><td style='padding:3px 8px;'>Drag tiles to resize and reposition on the canvas</td></tr></table><br><b>Recommended tiles for a Sales KPI dashboard:</b><br><br><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Tile</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Data source</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Sales MTD vs. Target</td><td style='padding:3px 8px;'>Revenue this month vs. quota</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Open Orders by Status</td><td style='padding:3px 8px;'>Count of orders at each M3 status code</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Top 10 Customers</td><td style='padding:3px 8px;'>Revenue ranking by customer</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Sales by Product Line</td><td style='padding:3px 8px;'>Revenue by item group</td></tr></table></div>"],
[2,"Add a Sales Total KPI tile","Click + Add Widget, then select KPI (or Metric tile). Choose Sales Amount as the measure. Set the period to This Month. Type your monthly sales target in the Goal field. Birst shows the actual vs. target in large numbers — green if on track, red if behind. Resize the tile small — it only needs to show one number."],
[3,"Add a second KPI tile for Number of Orders","Click + Add Widget > KPI again. This time choose Order Count. Set period to This Month. Place it next to the Sales Total tile. Two KPIs at the top of your dashboard give you the two most important daily numbers instantly."],
[4,"Add the Top Customers chart","Click + Add Widget > Chart. In the dropdown, find the Top 20 Customers report you saved in the Visualizer session. Select it. Resize the widget to fill roughly half the dashboard. This brings your saved report directly into the dashboard."],
[5,"Add an Open Quotes table","Click + Add Widget > Table. Select the Sales subject area. Add these columns: Quote Number, Customer Name, Quote Amount, Quote Date. Add a filter: Status = Quote (open). This keeps all your pending quotes visible without opening OIS100."],
[6,"Set a dashboard-level date filter","Click + Add Filter at the top of the dashboard (not inside a widget). Select Invoice Date or Order Date. Check the box that applies this filter to All Widgets. Now one date change at the top updates every tile, chart, and table on the page simultaneously."],
[7,"Add a Branch filter","Click + Add Filter again. Select Branch. Set your default branch as the starting value. Now you can switch branches in one click and all widgets update together. Resize and rearrange all widgets so nothing requires scrolling."],
[8,"Save and share the dashboard","Click Save. Name it Sales Dashboard — Daily. Click Share (or the share icon). Add Tony Shipka and Mike Parsons by name. They will see this dashboard in their Birst list the next time they log in. Your data updates overnight from M3 automatically."]],videoUrl:"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/Birst/Bravo%20-%20Birst%20Dashboards%20workshop.mp4",quiz:[{q:"What is the main difference between a Birst Dashboard and a Birst Report?",options:["Dashboards are only for managers; reports are for everyone","A dashboard combines multiple reports and KPIs on one screen for an at-a-glance view","Reports update automatically; dashboards require manual refresh","Dashboards can only show charts, not tables"],answer:1},
{q:"What does a dashboard-level filter do that a widget-level filter does not?",options:["It makes the dashboard load faster","When you change it, ALL widgets on the dashboard update at the same time","It restricts which users can see the dashboard","It only applies to KPI tiles, not charts"],answer:1},
{q:"What is a KPI tile in Birst used for?",options:["Displaying a full list of customer orders","Showing one key number (like total sales) compared to a target","Building a custom report from scratch","Setting up automated email reports"],answer:1},
{q:"After you share a Birst dashboard with a teammate, what do they need to do to see it?",options:["Download a file you send them","Log in to Birst — it will appear in their Dashboards list","Install a separate Birst app on their computer","Ask IT to copy the data to their account"],answer:1}],checklist:["Creates a new Birst dashboard from scratch","Adds a KPI tile with a sales target","Adds a chart widget from a saved report","Adds a table widget for open quotes","Applies dashboard-level date and branch filters that update all widgets","Shares the dashboard with teammates"]},
{id:"rep-4",title:"Pricing in M3 — OIS017 Customer Price Lists",duration:"45 min",videoUrl:"",steps:[[1,"Understand how M3 pricing works at Adleta","When an order line is entered in OIS100, M3 looks up the price in a specific order: (1) Customer-item specific price in OIS017, (2) Customer price list, (3) Standard price list. The first match wins. If you have set a specific price for a customer and item in OIS017, that price overrides everything else.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS017 &mdash; Customer Price List Assignment</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Price list</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Customer</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Valid from</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Valid to</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Currency</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>PL-STANDARD-2026</td><td style='padding:3px 8px;background:#fffbe6;'>001001 Alan Wheelock</td><td style='padding:3px 8px;background:#fffbe6;'>2026-01-01</td><td style='padding:3px 8px;background:#fffbe6;'>2026-12-31</td><td style='padding:3px 8px;background:#fffbe6;'>USD</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>PL-CONTRACT-001</td><td style='padding:3px 8px;'>002050 Contract Customer</td><td style='padding:3px 8px;'>2026-03-01</td><td style='padding:3px 8px;'>2026-08-31</td><td style='padding:3px 8px;'>USD</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>PL-GROUP-RETAIL</td><td style='padding:3px 8px;'>Group: RETAIL</td><td style='padding:3px 8px;'>2026-01-01</td><td style='padding:3px 8px;'>2026-12-31</td><td style='padding:3px 8px;'>USD</td></tr></table><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Right-click a row &rarr; Select to open | Change to edit | click + to create a new assignment</div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; A customer-level assignment overrides a group-level assignment.</div></div>"],
[2,"Open OIS017 — Customer Price List","In the M3 search bar, type OIS017 and press Enter. This is the Customer Item Price program — where you set the price a specific customer pays for a specific item. Every customer-item price agreement at Adleta lives here."],
[3,"Look up an existing customer price","In OIS017, click the lookup icon in the Customer field and search for a customer. Press Enter. M3 displays all item prices set up for that customer. Review the list: item number, price, unit of measure, and the date range the price is valid."],
[4,"Check the effective dates on a price line","Click into a price line and review the Valid From and Valid To dates. This is how time-limited pricing works — a promotional price can be set with a future Valid To date and M3 will automatically stop using it after that date. Prices with no Valid To date are open-ended."],
[5,"Add a new customer-item price","Click the + New button. Enter the customer number, item number, and unit of measure. Enter the price amount. Set the Valid From date (usually today or the start of the new agreement). Set Valid To date if the price is temporary, or leave blank for an ongoing price. Click the checkmark ✓ to save."],
[6,"Update an existing price","In OIS017, find the customer-item price line you need to change. Right-click and select Change. Update the price amount or the Valid To date. Click the checkmark ✓ to save. The new price will apply to all new orders entered after your save — it does not retroactively change existing open orders."],
[7,"Verify the new price on a test order","Open OIS100 and enter a test order for that customer and item. When the order line populates the price, verify it shows the price you just set in OIS017. If the price is wrong, the most common cause is an overlapping price line with a different date range — go back to OIS017 and check for duplicate entries."],
[8,"Delete an expired or incorrect price line","In OIS017, find the price line that needs to be removed. Right-click and select Delete. M3 asks you to confirm. Once deleted, M3 will fall back to the next price source (standard price list). Only delete lines that are truly wrong — if a price is simply expired, it is better to set a past Valid To date so there is a record that it existed."]],quiz:[{q:"In M3, which price source takes highest priority when pricing an order line?",options:["The standard price list","The customer price list","A customer-item specific price set in OIS017","The price entered manually by the order desk"],answer:2},
{q:"What is the purpose of the Valid To date on a price line in OIS017?",options:["It shows when the price was last updated","It is the date the price will automatically expire and no longer apply to new orders","It is required on every price line","It controls which warehouse the price applies to"],answer:1},
{q:"If you update a price in OIS017 today, what happens to open orders that were already entered?",options:["They are automatically updated to the new price","They keep the price they were entered at — only new orders get the new price","M3 sends an alert to the order desk to review them","They are put on hold until repriced"],answer:1},
{q:"If a customer order line shows the wrong price, what should you check first?",options:["Call the customer to confirm the price","Open OIS017 for that customer and item and look for overlapping or duplicate price lines","Delete all prices for that customer and re-enter them","Open OIS100 and manually override the price on the order"],answer:1}],checklist:["Can open OIS017 and look up existing prices for a customer","Reads effective date ranges on price lines","Adds a new customer-item price with correct dates","Updates an existing price and verifies on a test order in OIS100","Identifies and resolves overlapping price lines"]}

{id:"rep-5",title:"Price List Setup and Maintenance — OIS010",duration:"40 min",videoUrl:"",steps:[[1,"Understand the difference between OIS010 and OIS017","OIS010 is where you manage standard price lists — lists that apply to a group of customers (like a contractor price list or a dealer price list). OIS017 is for customer-specific item prices. Think of it this way: OIS010 = a price list with a name that can be assigned to many customers. OIS017 = a one-to-one price for a single customer and item.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS010 &mdash; Price List Detail &mdash; Items and Prices</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Item number</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Description</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Sales price</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>U/M</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Valid from</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Valid to</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>ARM51899031</td><td style='padding:3px 8px;background:#fffbe6;'>Imperial Texture Tile</td><td style='padding:3px 8px;background:#fffbe6;'>$48.80</td><td style='padding:3px 8px;background:#fffbe6;'>CT</td><td style='padding:3px 8px;background:#fffbe6;'>2026-01-01</td><td style='padding:3px 8px;background:#fffbe6;'>2026-12-31</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>SHW9876543</td><td style='padding:3px 8px;'>Shaw Carpet Plank</td><td style='padding:3px 8px;'>$3.25</td><td style='padding:3px 8px;'>SF</td><td style='padding:3px 8px;'>2026-01-01</td><td style='padding:3px 8px;'>2026-12-31</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>MOH1234567</td><td style='padding:3px 8px;'>Mohawk Wood Look</td><td style='padding:3px 8px;'>$4.10</td><td style='padding:3px 8px;'>SF</td><td style='padding:3px 8px;'>2026-01-01</td><td style='padding:3px 8px;'>2026-12-31</td></tr></table><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Right-click a row &rarr; Change to update a price. Click + to add a new item.</div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; Changing a price here takes effect on new orders immediately. Existing open orders are not repriced automatically.</div></div>"],
[2,"Open OIS010 — Price List","In the M3 search bar, type OIS010 and press Enter. This program shows all active price lists at Adleta. Review the list: price list name, currency, description, and effective dates. These are the named price lists you can assign to customers in CRS610."],
[3,"Open a price list and review its lines","Click into a price list (right-click > Open, or double-click). The price list lines screen shows every item on this list with its price and unit of measure. Scroll through and review a few items. Note the structure: each line is an item number + price + unit."],
[4,"Add a new item to a price list","In the price list lines screen, click the + New button. Enter the item number. Enter the price and unit of measure. Set effective dates if this is a temporary pricing change (like a promotion). Click the checkmark ✓ to save. The item will now be priced from this list for all customers assigned to it."],
[5,"Update a price on an existing price list line","Find the item in the price list you need to update. Right-click and select Change. Update the price amount. Click the checkmark ✓. Confirm: this price change applies to ALL customers on this price list immediately for new orders. If only one customer needs a different price, use OIS017 instead."],
[6,"Check which price list a customer is assigned to","Open CRS610 and look up the customer. Find the Price List field (it may be on panel B or C — confirm with Bravo). The price list shown here is what M3 uses as the default for this customer when no specific OIS017 price exists. If it is blank, the customer gets the standard price list."],
[7,"Assign a price list to a customer","In CRS610 for the customer, navigate to the Price List field. Click the lookup icon and select the correct price list. Click the checkmark ✓ to save. From this point forward, new orders for this customer will use prices from that price list (unless overridden by OIS017)."],
[8,"Run a price list comparison before a price increase","Before updating prices in OIS010, export the current price list to Excel (use the export/print function in OIS010). This gives you a before snapshot. After the price increase is applied, run the same export and compare. Share the comparison with the sales team so they know what changed and can notify their accounts."]],quiz:[{q:"What is the key difference between OIS010 and OIS017?",options:["OIS010 is for inventory; OIS017 is for accounting","OIS010 manages named price lists assigned to groups of customers; OIS017 sets a price for one specific customer and item","OIS010 is read-only; OIS017 is where you make changes","They are the same program with different menu paths"],answer:1},
{q:"If you update a price in OIS010, who does it affect?",options:["Only the customer you are currently viewing","All customers who are assigned to that price list","Only customers in the same branch","Only new customers — existing customers keep their old price"],answer:1},
{q:"Where in M3 do you check which price list a customer is assigned to?",options:["OIS017","OIS010","CRS610 — the Customer Master","OIS100 — the Order Entry screen"],answer:2},
{q:"When should you use OIS010 vs OIS017 to set a price?",options:["Use OIS010 when the price applies to all customers on a list; use OIS017 when only one customer gets that specific price","Use OIS010 for new items; OIS017 for existing items","Use OIS010 for temporary prices; OIS017 for permanent prices","It does not matter — they do the same thing"],answer:0}],checklist:["Can navigate OIS010 and view all active price lists","Opens a price list and reviews its line items","Adds a new item to a price list with correct effective dates","Updates an existing price list line","Checks and updates a customer price list assignment in CRS610","Understands when to use OIS010 vs OIS017"]}

{id:"rep-6",title:"Price Overrides on Customer Orders",duration:"35 min",videoUrl:"",steps:[[1,"Understand when a price override is appropriate","A price override is when you manually change the price on a specific order line to something different from what M3 calculated. This is appropriate for: one-time promotional pricing, correcting a pricing error, matching a competitor quote, or honoring a verbal agreement. It is NOT appropriate to routinely override prices without updating OIS017 — that creates inconsistency and audit problems.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS101 &mdash; Price Override on Customer Order Line</div><b>How a price override looks on the order line:</b><br><br><div style='background:#fff;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden;margin-bottom:8px'><div style='background:#1a7a6d;color:#fff;padding:4px 10px;font-size:11px;font-weight:700'>OIS101/B1 Customer Order Lines</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Line</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Item</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Qty</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>List price</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Override price</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>U/M</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;background:#fffbe6;'>10</td><td style='padding:3px 8px;background:#fffbe6;'>ARM51899031</td><td style='padding:3px 8px;background:#fffbe6;'>50</td><td style='padding:3px 8px;background:#fffbe6;'>$48.80</td><td style='padding:3px 8px;background:#fffbe6;'><span style='color:#c0443b;font-weight:700'>$45.00 override</span></td><td style='padding:3px 8px;background:#fffbe6;'>CT</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>20</td><td style='padding:3px 8px;'>SHW9876543</td><td style='padding:3px 8px;'>20</td><td style='padding:3px 8px;'>$3.25</td><td style='padding:3px 8px;'>$3.25</td><td style='padding:3px 8px;'>SF</td></tr></table></div><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; To override: right-click line &rarr; Change &rarr; edit Sales price &rarr; enter reason &rarr; Change to save.</div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; Price overrides below the minimum margin threshold are flagged for manager review in Birst.</div></div>"],
[2,"Open OIS100 and enter an order line for practice","In the M3 search bar, type OIS100 and press Enter. Click the + New button. Enter the customer number, set CO type to C01, click Next through the panels to reach OIS101. Enter a test item. Note the price M3 calculates automatically — this is the price from OIS017 or OIS010."],
[3,"Override the price on the order line","On the order line, find the Unit Price field. The current price is shown. Click directly into the price field and type the new price. M3 may prompt you with a warning that the price has been changed from the standard. Acknowledge the warning and continue."],
[4,"Check if your user role allows price overrides","After entering a lower price, M3 may require authorization — it depends on how much below the standard price you are going. If M3 shows a hold or authorization message, the override exceeds your approval limit. You will need to get approval from a sales manager before the order can be released."],
[5,"Document the reason for the override in order notes","Right-click the order header and select Notes. Add a note explaining: why the price was overridden, who authorized it, and what the customer was told. Example: 'Price matched competitor quote from XYZ Supply. Authorized by Mike Parsons 6/10/26.' This documentation is required for audit purposes."],
[6,"Release the order after authorization","Once the override is approved (either automatically within your authority, or after manager authorization), release the order normally. The overridden price will appear on the customer invoice. Verify the price on the confirmation before it goes to the customer."],
[7,"Review price override reports in Birst","Open Birst and find the Price Override or Discount Report (confirm the report name with IT or your Birst administrator). This report shows all orders where the price was changed from the standard. Review it weekly to identify patterns — frequent overrides for the same customer or item may mean the OIS017 price needs to be updated."],
[8,"Correct a pricing error before invoicing","If an order was entered with the wrong price and has NOT been invoiced yet, open OIS100, find the order, and change the order status to allow edits. Correct the price on the line, document the change in notes, and re-release. If the order has already been invoiced, a credit memo or new order line at the difference may be needed — contact Philip Jones in accounting."]],quiz:[{q:"When is a price override on an order line appropriate?",options:["Any time a customer asks for a better price","For one-time situations like matching a competitor quote or correcting an error — not for routine use","Whenever the standard price seems too high","Only on will call orders"],answer:1},
{q:"What should you always do after overriding a price on an order?",options:["Email the customer the new price","Add a note to the order explaining why the price was changed and who authorized it","Delete the original price from OIS017","Call the warehouse to hold the order"],answer:1},
{q:"What does M3 do when a price override exceeds your authorization limit?",options:["It applies the override automatically","It sends an email to the customer","It places the order on hold and requires manager approval before it can be released","It cancels the order"],answer:2},
{q:"If you find yourself overriding the same customer and item price every order, what should you do instead?",options:["Keep overriding — it saves time","Update the price permanently in OIS017 so M3 calculates it correctly on every new order","Ask IT to disable the standard price for that item","Apply a blanket discount in the customer master"],answer:1}],checklist:["Understands when a price override is and is not appropriate","Can locate and change the unit price on an OIS100 order line","Knows what to do if the override requires manager authorization","Documents every price override with a reason and authorization in order notes","Can find the price override report in Birst to monitor trends","Knows how to correct a pricing error before and after invoicing"]}
]}
