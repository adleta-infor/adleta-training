<html lang="en">
<head>
<meta charset="utf-8">

<title>Adleta Infor M3 — Training Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================
   ADLETA M3 TRAINING PORTAL — FULL BUILD
   Role-based access | Sessions | Quizzes | Video
   ===================================== */
:root {
  --navy:#0f2133;--navy2:#172d42;--navy3:#1f3a52;
  --teal:#1a7a6d;--teal2:#22a08f;--teal3:#e0f2ee;
  --gold:#c49a2a;--gold2:#faf0db;
  --red:#c0443b;--red2:#fce8e7;
  --blue:#2d6fa3;--blue2:#e0ecf7;
  --ink:#0f1f2e;--body:#344b5f;--muted:#6b8199;
  --line:#dde5ed;--bg:#f2f5f8;--surface:#fff;--surface2:#f7f9fb;
  --r:10px;--rsm:6px;
  --shadow:0 2px 12px rgba(15,33,51,0.08);
  --shadow2:0 8px 32px rgba(15,33,51,0.12);
  font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.55;
}
*,*::before,*::after{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--ink);min-height:100vh;}
a{color:var(--teal);text-decoration:none;font-weight:500;}
a:hover{text-decoration:underline;}
button,input,select{font:inherit;}
h1,h2,h3,h4{line-height:1.2;font-weight:700;}
p{color:var(--body);line-height:1.6;}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{background:var(--navy);color:#e8f1f8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-top{padding:22px 18px 16px;}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;}
.brand-mark{width:42px;height:42px;background:linear-gradient(135deg,var(--teal2),var(--teal));border-radius:10px;display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:13px;color:#fff;flex-shrink:0;}
.brand-name{font-size:14px;font-weight:700;color:#fff;line-height:1.2;}
.brand-sub{font-size:12px;color:#7fa3be;}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:var(--rsm);color:#a8c4d8;font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:all .15s;}
.nav-btn svg{opacity:.65;flex-shrink:0;}
.nav-btn:hover,.nav-btn.active{background:var(--navy3);color:#fff;}
.nav-btn.active svg{opacity:1;}
.sidebar-footer{margin-top:auto;padding:14px 18px 20px;border-top:1px solid rgba(255,255,255,0.07);}
.user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--navy3);border-radius:var(--rsm);}
.user-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;color:#fff;}
.user-role{font-size:11px;color:#7fa3be;}
.logout-btn{margin-top:8px;width:100%;padding:7px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:var(--rsm);color:#7fa3be;font-size:13px;cursor:pointer;transition:all .15s;}
.logout-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
.main{display:flex;flex-direction:column;min-width:0;}
.hero{background:var(--navy);padding:28px 36px 24px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 500px 250px at 100% 50%,rgba(26,122,109,0.2) 0%,transparent 70%),repeating-linear-gradient(120deg,rgba(255,255,255,0.015) 0 1px,transparent 1px 52px);pointer-events:none;}
.hero-inner{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.hero-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--teal2);font-weight:700;margin-bottom:8px;}
.hero h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;}
.hero-sub{font-size:13px;color:#7fa3be;}
.hero-actions{display:flex;gap:8px;flex-shrink:0;margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rsm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--teal2);color:#fff;}
.btn-primary:hover{background:var(--teal);color:#fff;text-decoration:none;}
.btn-ghost{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}
.btn-ghost:hover{background:rgba(255,255,255,0.18);color:#fff;text-decoration:none;}
.btn-sm{padding:6px 12px;font-size:13px;}
.content{padding:24px 36px 40px;flex:1;}
.view{display:none;}
.view.active{display:block;}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.sec-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);font-weight:700;margin-bottom:4px;}
.sec-hd h2{font-size:20px;color:var(--ink);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--teal);}
.metric:nth-child(2){border-top-color:var(--blue);}
.metric:nth-child(3){border-top-color:var(--gold);}
.metric:nth-child(4){border-top-color:var(--red);}
.metric-val{font-size:28px;font-weight:800;color:var(--teal);line-height:1;margin-bottom:3px;}
.metric:nth-child(2) .metric-val{color:var(--blue);}
.metric:nth-child(3) .metric-val{color:var(--gold);}
.metric:nth-child(4) .metric-val{color:var(--red);}
.metric-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.dash-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:20px;}
.mastery{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr;align-items:center;}
.mastery-node{background:var(--teal3);border:1px solid #b0d9d2;border-radius:var(--r);padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--teal);min-height:64px;display:grid;place-items:center;}
.mastery-arr{display:grid;place-items:center;color:var(--teal);opacity:.5;}
.prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.prog-track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.prog-label{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;}
.check-list{display:flex;flex-direction:column;gap:6px;}
.check-item{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.check-item:last-child{border-bottom:none;}
.check-item input{width:15px;height:15px;margin-top:2px;accent-color:var(--teal);cursor:pointer;}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.pill-teal{background:var(--teal3);color:#145c52;}
.pill-blue{background:var(--blue2);color:#1e4f7a;}
.pill-gold{background:var(--gold2);color:#7a5c12;}
.pill-red{background:var(--red2);color:#8a2e28;}
.pill-gray{background:#eef2f6;color:#344b5f;}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.mod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all .15s;}
.mod-card:hover{border-color:var(--teal);box-shadow:var(--shadow2);transform:translateY(-1px);}
.mod-card h3{font-size:14px;color:var(--ink);}
.mod-owner{font-size:11px;color:var(--muted);font-weight:600;}
.mod-summary{font-size:12px;color:var(--body);line-height:1.5;flex:1;}
.tags{display:flex;flex-wrap:wrap;gap:4px;}
.tag{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:#eef2f6;color:#344b5f;}
.mod-progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px;}
.mod-progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .4s;}
.mod-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.mod-link{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--rsm);color:var(--teal);font-weight:600;transition:all .15s;}
.mod-link:hover{background:var(--teal3);border-color:var(--teal);text-decoration:none;}
.session-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;border:none;background:none;padding:0;margin-bottom:12px;}
.session-back:hover{color:var(--teal);}
.session-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.session-title{font-size:22px;font-weight:700;margin-bottom:16px;}
.session-body{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
.session-content{display:flex;flex-direction:column;gap:16px;}
.session-sidebar{display:flex;flex-direction:column;gap:14px;}
.notes-area{width:100%;min-height:90px;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:13px;color:var(--ink);background:var(--surface);resize:vertical;font-family:inherit;}
.notes-area:focus{outline:none;border-color:var(--teal);}
.notes-saved{font-size:11px;color:var(--teal);margin-top:4px;display:none;}
@media print{body *{visibility:hidden;}.print-zone,.print-zone *{visibility:visible;}.print-zone{position:fixed;top:0;left:0;width:100%;padding:20px;}.print-hide{display:none!important;}}
.step-cards{display:flex;flex-direction:column;gap:12px;}
.step-card{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:box-shadow .15s;}
.step-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.step-num{width:36px;height:36px;min-width:36px;border-radius:50%;background:var(--teal);color:#fff;font-size:15px;font-weight:800;display:grid;place-items:center;font-family:'DM Mono',monospace;}
.step-body{flex:1;}
.step-action{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.step-detail{font-size:13px;color:var(--body);line-height:1.55;}
.session-progress-header{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:16px;margin-bottom:4px;}
.session-progress-header .prog-track{flex:1;height:8px;border-radius:4px;background:var(--line);}
.session-progress-header .prog-fill{height:100%;border-radius:4px;background:var(--teal);transition:width .3s;}
.session-nav{display:flex;gap:10px;margin-top:8px;}
.session-nav .btn{flex:1;justify-content:center;}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--r);}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:var(--r);}
.video-placeholder{background:var(--navy2);border-radius:var(--r);aspect-ratio:16/9;display:grid;place-items:center;color:#7fa3be;font-size:13px;text-align:center;padding:20px;}
.video-input-wrap{display:flex;gap:8px;margin-top:8px;}
.video-input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:var(--rsm);font-size:13px;outline:none;}
.video-input:focus{border-color:var(--teal);}
.quiz-wrap{display:flex;flex-direction:column;gap:16px;}
.quiz-q{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
.quiz-q-text{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--ink);}
.quiz-options{display:flex;flex-direction:column;gap:8px;}
.quiz-option{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--rsm);cursor:pointer;font-size:13px;transition:all .15s;background:var(--surface);}
.quiz-option:hover{border-color:var(--teal);background:var(--teal3);}
.quiz-option.correct{border-color:#22a08f;background:#e0f2ee;color:#145c52;}
.quiz-option.wrong{border-color:var(--red);background:var(--red2);color:var(--red);}
.quiz-option input{margin-top:2px;accent-color:var(--teal);}
.quiz-result{text-align:center;padding:16px;border-radius:var(--r);font-size:15px;font-weight:700;}
.quiz-result.pass{background:var(--teal3);color:#145c52;}
.quiz-result.fail{background:var(--red2);color:var(--red);}
.quiz-btn{width:100%;padding:10px;background:var(--teal);color:#fff;border:none;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .15s;}
.quiz-btn:hover{background:var(--teal2);}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.phase-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border-top:4px solid var(--teal);}
.phase-card:nth-child(2){border-top-color:var(--blue);}
.phase-card:nth-child(3){border-top-color:var(--gold);}
.phase-card:nth-child(4){border-top-color:var(--red);}
.phase-weeks{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
.phase-name{font-size:16px;font-weight:700;margin-bottom:8px;}
.phase-purpose{font-size:12px;color:var(--body);margin-bottom:8px;line-height:1.5;}
.phase-success{font-size:12px;color:var(--teal);font-style:italic;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;line-height:1.5;}
.su-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.su-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.su-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;}
.su-name{font-size:14px;font-weight:700;}
.su-dept{font-size:11px;color:var(--muted);}
.su-mod{font-size:10px;font-family:'DM Mono',monospace;color:var(--teal);margin-top:3px;}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;}
.res-card h3{font-size:14px;}
.res-card p{font-size:12px;color:var(--body);flex:1;}
.res-link{font-size:13px;display:inline-flex;align-items:center;gap:5px;margin-top:4px;}
.search-input{padding:8px 13px;border-radius:var(--rsm);border:1px solid var(--line);background:var(--surface);width:260px;font-size:13px;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--teal);}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.user-table{width:100%;border-collapse:collapse;font-size:13px;}
.user-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-size:12px;font-weight:600;}
.user-table td{padding:9px 12px;border-bottom:1px solid var(--line);}
.user-table tr:hover td{background:var(--surface2);}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.dot-green{background:#22a08f;}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
@media(max-width:1100px){.mod-grid,.res-grid,.su-grid{grid-template-columns:repeat(2,1fr);}.timeline{grid-template-columns:repeat(2,1fr);}.metrics{grid-template-columns:repeat(2,1fr);}.session-body{grid-template-columns:1fr;}}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{height:auto;position:static;}.hero{padding:20px;}.content{padding:16px 18px 32px;}.dash-grid,.admin-grid{grid-template-columns:1fr;}.mod-grid,.res-grid,.su-grid,.timeline{grid-template-columns:1fr;}.mastery{grid-template-columns:1fr;gap:6px;}}

.admin-tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:20px;}
.admin-tab{padding:10px 20px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;}
.admin-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
.admin-tab-pane{display:none;}.admin-tab-pane.active{display:block;}
.guide-section{margin-bottom:28px;}
.guide-section h3{font-size:14px;font-weight:800;color:var(--ink);margin:0 0 10px 0;padding-bottom:8px;border-bottom:1px solid var(--line);}
.guide-su-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px;}
.guide-su-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);}
.guide-su-name{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:2px;}
.guide-su-dept{font-size:11px;color:var(--muted);margin-bottom:8px;}
.guide-su-modules{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.guide-su-sessions{font-size:12px;color:var(--body);margin-bottom:6px;}
.guide-step-list{list-style:none;padding:0;margin:0;}
.guide-step-list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--body);}
.guide-step-list li:last-child{border-bottom:none;}
.guide-step-num{width:22px;height:22px;min-width:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;}
.guide-tip{background:#fef9ec;border:1px solid #f0d060;border-radius:var(--r);padding:12px 14px;font-size:12px;color:#7a6020;margin-top:8px;}
.guide-tip strong{color:#5a4010;}


.ex-card{padding:0!important;}
.ex-objective,.ex-scenario{padding:16px 20px;border-bottom:1px solid var(--line);}
.ex-objective{background:color-mix(in srgb,var(--teal) 8%,var(--surface));}
.ex-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);margin-bottom:4px;}
.ex-text{font-size:14px;color:var(--ink);line-height:1.5;}
.ex-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 20px 4px;}
.ex-task{padding:12px 20px;border-bottom:1px solid var(--line);}
.ex-task-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.ex-task-num{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ex-task-name{font-size:13px;font-weight:700;color:var(--ink);}
.ex-steps{margin:0 0 0 32px;padding:0;font-size:13px;color:var(--body);line-height:1.7;}
.ex-outcome{padding:14px 20px;background:color-mix(in srgb,var(--teal) 6%,var(--surface));border-top:1px solid var(--line);}
.ex-outcome-list{margin:4px 0 0 16px;padding:0;font-size:13px;color:var(--body);line-height:1.7;}
.ex-exceptions{padding:14px 20px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--navy2) 4%,var(--surface));}
.ex-exc-list{margin-top:8px;display:flex;flex-direction:column;gap:10px;}
.ex-exc-item{background:var(--surface2);border-radius:var(--rsm);padding:10px 14px;border-left:3px solid var(--teal3);}
.ex-exc-q{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.ex-exc-a{font-size:12px;color:var(--body);line-height:1.6;}
.ex-shot{display:block;max-width:100%;width:560px;margin:8px 0 4px;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;box-shadow:0 1px 3px rgba(0,0,0,.08)}
#shotBox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out;padding:20px}
#shotBox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
@media(max-width:768px){.ex-shot{width:100%}}
</style>

d></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Stock balances &amp; item lookup</td><td style='padding:3px 8px;'>MMS001 / MMS200</td><td style='padding:3px 8px;'>Read + search</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Sales order entry</td><td style='padding:3px 8px;'>OIS100 / OIS101</td><td style='padding:3px 8px;'>Enter + edit</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Purchase orders</td><td style='padding:3px 8px;'>PPS200 / PPS300</td><td style='padding:3px 8px;'>Enter + receive</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>AP invoices &amp; payments</td><td style='padding:3px 8px;'>APS100 / APS130</td><td style='padding:3px 8px;'>Enter + approve</td></tr></table><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; The TST badge in the top-right of M3 confirms you are in the test environment. If you do not see TST, stop before doing anything.</div></div>"],[2,"Super User Responsibilities","Cover the three phases of super user duty: before training (practice, attend, log issues), during go-live (support your department), and post go-live (ongoing escalation point)."],[3,"Module Ownership","Confirm which super user owns each module: Purchasing, Inventory, Order Management, Finance AP, Finance GL, and Reporting. Each owner is accountable for their area."],[4,"Training Model Walkthrough","Walk through the Adleta training model: Concept &#8594; Demo &#8594; Practice &#8594; Real Scenario &#8594; Teach-Back. Teach-back is required for sign-off."],[5,"Readiness Expectations","Review expectations: practice requirements, issue log, attendance policy, sign-off process, and the department training plan each super user must complete."],[6,"Open Discussion","Each super user names their biggest department workflow and their biggest concern about M3. Capture concerns in the issue log."]],"videoUrl":"","quiz":[{"q":"Super users are responsible for supporting their department during:","options":["Discovery workshops only","Go-live and the first 90 days","IT testing only","Annual audits"],"answer":1},{"q":"The Adleta training model ends with:","options":["A written test","A teach-back to the group","A manager sign-off form","A Birst dashboard"],"answer":1},{"q":"Module ownership means a super user is accountable for:","options":["Entering all data in their module","Supporting their department and escalating issues","Approving all transactions","Writing training documentation"],"answer":1}],"checklist":["I can name my module and what I own","I understand my responsibilities before, during, and after go-live","I know the training model and what is required for sign-off","I have documented my biggest workflow concern in the issue log"]},{"id":"fnd-2","title":"Getting Around M3 — The 6 Things You Need to Know","duration":"2 hours","steps":[[1,"Log In Together","Log in to M3 together. Point out the TST badge (top-right = test environment), the home screen Favorites and Recent, and the company/division indicator. Confirm everyone is in the correct environment.<br><br><div style='font-family:monospace;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;line-height:1.8'><div style='background:#1a7a6d;color:#fff;padding:4px 10px;border-radius:4px;margin-bottom:8px;font-size:11px'>&#9472;&#9472; TOP BAR &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; <span style='float:right'>&#9660; TST = YOU ARE IN TEST</span></div><div style='display:flex;gap:12px'><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:8px;min-width:140px;font-size:11px'><b>LEFT PANEL</b><br>&#128269; Search bar &#8592; type here<br>&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;<br>&#9733; Favorites<br>&nbsp;&nbsp;OIS100<br>&nbsp;&nbsp;CRS610<br>&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;<br>&#128336; Recent</div><div style='background:#fff;border:1px solid #d0d5dd;border-radius:4px;padding:8px;flex:1;font-size:11px'><b>MAIN AREA</b><br><br>&#9733; Favorites &nbsp;&nbsp;&nbsp;&nbsp; &#128336; Recent<br>&nbsp;&nbsp;cmp100 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; CRS610<br>&nbsp;&nbsp;OIS100<br><br><br>Company: 100 CMP100<br>Division: Adleta (100/Blank)<br>User: KBICKERSTA</div></div></div><br><b>Key things to notice:</b> The <b>TST badge</b> in the top right means you are in the test environment — safe to practice. <b>Ctrl+S</b> (Search and Start) is how you open any program. Your <b>Favorites</b> are shortcuts to programs you use often."],[2,"Open a Program with Ctrl+S","Press <b>Ctrl+S</b>. The Search and Start box opens. Type CRS610, select it from the list, and click OK. Every program in M3 opens this way.<div style='background:#e8f4f2;border:1px solid #9fd0c7;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; Older handouts say \"type it in the search bar\". At Adleta, use Ctrl+S.</div>"],[3,"Multiple Programs Open at Once","Open CRS610, then PPS200, then OIS100. Show the tabs at the top &#8212; all three programs are open simultaneously. Explain how to switch between them without losing work."],[4,"Panel Navigation","Open CRS610 and look up customer 000382. Point to the panel tabs at the bottom (E, F, G, H, J&#8230;). Click through each and name what it contains. Explain that every program has its own panel set."],[5,"Right-Click in a List","From the CRS610 list, right-click any row. Show: Select (Ctrl+1) = open/use it, Change (Ctrl+2) = edit it, Display (Ctrl+4) = read-only. Right-click is the main navigation method in M3."],[6,"Lookup Icon","In any field with a &#128269; icon, click it to search. Type part of a name, press Enter, click the result. Demo in both a customer field and an item field."],[7,"Add and Change Buttons","Show OIS101 &#8212; the entry row at the bottom with the Add button adds a line. The Change button at the top saves edits to existing lines. These are different from the panel tabs."],[8,"Set Up a Favorite","Navigate to a program, right-click the tab or use the star icon. Show how it appears on the home screen under Favorites for quick access."],[9,"Issue Log Practice","Show the issue log in Teams/SharePoint. Have each learner submit one test entry: program code, steps to reproduce, question, and business impact. This is how they escalate problems during go-live."]],"videoUrl":"","quiz":[{"q":"To open a program in M3, you type the program code in:","options":["The URL bar","The left panel Ctrl+S (Search and Start)","The Settings menu","The Help menu"],"answer":1},{"q":"In a list view, right-clicking a row and choosing Change does:","options":["Deletes the record","Opens the record for editing","Displays the record read-only","Copies the record"],"answer":1},{"q":"The panel tabs at the bottom of a program (E, F, G...) represent:","options":["Different companies","Different users logged in","Different data panels for the same record","Different warehouses"],"answer":2}],"checklist":["I can open any M3 program with Ctrl+S (Search and Start)","I can navigate panel tabs and name what each contains","I use right-click (not double-click) to Select, Change, and Display records","I can use the lookup icon to search for a customer, supplier, or item","I have submitted a test entry to the issue log"]},{"id":"fnd-3","title":"Terminology — What We Call It vs. What M3 Calls It","duration":"1.5 hours","steps":[[1,"M3 Entity Map","Walk the M3 entity map: Customer (CRS610), Supplier (CRS620), Item (MMS001), Stock by lot and location (MWS068), Warehouse, Purchase Order (PPS200), Customer Order (OIS100), AP Invoice (APS100). Show where each lives.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; Terminology &mdash; Adleta Word vs. M3 Word</div><table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What you call it today</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What M3 calls it</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Customer</td><td style='padding:3px 8px;'>Customer</td><td style='padding:3px 8px;'>CRS610</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Supplier / supplier</td><td style='padding:3px 8px;'>Supplier</td><td style='padding:3px 8px;'>CRS620</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>SKU / part number</td><td style='padding:3px 8px;'>Item number</td><td style='padding:3px 8px;'>MMS001</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Stock on hand</td><td style='padding:3px 8px;'>On-hand balance</td><td style='padding:3px 8px;'>MWS068</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Lot / shade / dye lot</td><td style='padding:3px 8px;'>Lot number</td><td style='padding:3px 8px;'>MWS068</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Sales order</td><td style='padding:3px 8px;'>Customer Order (CO)</td><td style='padding:3px 8px;'>OIS100</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Purchase order</td><td style='padding:3px 8px;'>Purchase Order (PO)</td><td style='padding:3px 8px;'>PPS200</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Customer PO number</td><td style='padding:3px 8px;'>Your ref 1</td><td style='padding:3px 8px;'>OIS100/I</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Receiving</td><td style='padding:3px 8px;'>Receipt</td><td style='padding:3px 8px;'>PPS300</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>AP invoice</td><td style='padding:3px 8px;'>Supplier Invoice</td><td style='padding:3px 8px;'>APS100</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Check run</td><td style='padding:3px 8px;'>Payment Proposal</td><td style='padding:3px 8px;'>APS130</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;'>Wire</td><td style='padding:3px 8px;'>WID payment</td><td style='padding:3px 8px;'>APS130</td></tr></table></div>"],[2,"Terminology Crosswalk","Review the Terminology Crosswalk &#8212; map Adleta terms to M3 terms. Examples: &quot;vendor&quot; = Supplier, &quot;product/SKU&quot; = Item number, &quot;branch&quot; = Warehouse, &quot;invoice&quot; = AP Invoice or AR Invoice depending on direction."],[3,"Procure to Pay Trace","Trace Procure to Pay: Planned PO (PPS170) → PO (PPS200) → Supplier confirmation (PPS250) → Receipt (PPS300) → Supplier invoice matched to the PO (APS100) → Payment. Open each program briefly so they see the flow."],[4,"Order to Cash Trace","Trace Order to Cash: Customer Order (OIS100/OIS101) → Allocated, waiting for release (OIS300 status 33) → Released for picking (MWS410, status 44) → Pick reported (MWS420) → Load / issue → Invoice (OIS350) → Customer payment (ARS110). Credit holds (OIS120) and prepay stops (C10, cash desk OIS215) can pause it."],[5,"Teach-Back: Name an Entity","Each super user explains one entity: what it is, which program it lives in, who owns it, and why it matters to their department. No notes allowed &#8212; this is the teach-back portion."]],"videoUrl":"","quiz":[{"q":"The M3 program for managing customer master records is:","options":["PPS200","CRS610","MWS068","OIS100"],"answer":1},{"q":"In Adleta terminology, a branch maps to which M3 entity?","options":["Division","Warehouse","Company","Cost Center"],"answer":1},{"q":"Procure to Pay starts with a PO in PPS200 and ends with:","options":["A customer invoice in OIS300","A cash receipt in ARS110","A supplier payment in APS130","A stock receipt in MWS068"],"answer":2}],"checklist":["I can name the M3 program for each core entity in my module","I can translate Adleta terms to M3 terms without notes","I can trace Procure to Pay from PO through supplier payment","I can trace Order to Cash from customer order through cash receipt"]},{"id":"fnd-4","title":"Foundation Check — Prove You Can Do It","duration":"1.5 hours","steps":[[1,"Navigation Practical","Ask each super user to open three programs for their module with Ctrl+S, no coaching. Note anyone who hesitates."],[2,"Record Lookup Practical","Ask them to find a specific customer, supplier, and item by number. Then ask them to name 2&#8211;3 key fields on the record. No looking at notes."],[3,"Right-Click Practical","Open a list view (e.g., CRS610). Ask them to open a record for editing. Watch that they right-click and choose Change &#8212; not just single-click or double-click."],[4,"Entity Explanation","Each super user explains one record type &#8212; what it is, which program, who owns it, why it matters &#8212; in plain language to the rest of the group."],[5,"Teach-Back","Each super user explains (3&#8211;5 min) how they would help a department user find the right screen and look up a record. No notes. Grade on clarity and accuracy."],[6,"Issue Log Review","Go through all open issues from fnd-1 through fnd-3. Assign owners. Resolve all access blockers before the next module begins."]],"videoUrl":"","quiz":[{"q":"During the navigation practical, you should open programs:","options":["Using bookmarks a trainer set up","By opening programs with Ctrl+S without coaching","By asking IT to open them","From the help menu"],"answer":1},{"q":"To edit a record in a list view, the correct method is to:","options":["Double-click the row","Single-click the row","Right-click and choose Change","Press F5"],"answer":2},{"q":"A super user is cleared for go-live when they:","options":["Attend all sessions","Pass the teach-back and complete the issue log review","Complete the online quiz only","Get IT approval"],"answer":1}],"checklist":["I opened three role-relevant programs without coaching","I looked up a customer, supplier, and item and named key fields","I right-clicked correctly to open a record for editing","I completed my teach-back without notes","All my open issues from fnd-1 through fnd-3 are assigned or resolved"]}]},"orderManagement":{"id":"orderManagement","name":"Customer Service and Order Entry","owner":"Tony Shipka + Jeanell Coral","weeks":"Week 5","pill":"pill-gold","color":"#c49a2a","programs":["OIS100","OIS101","OIS300","OIS301","OIS110","OIS350","CRS610","OIS002","MMS200","MMS002","MMS080","MWS068"],"summary":"Order entry, order lookups, returns, quotes, drop ship, will call, and what happens when an order is held for credit or prepayment.","links":[["Deck","resources/adleta-m3-ordermanagement-training-deck.html"],["Guide","resources/adleta-m3-ordermanagement-learningguide.html"]],"sessions":[{"id":"ord-1","title":"Manual Order Entry — Standard Net Terms (CL1)","duration":"60 min","steps":[[1,"Look Up the Customer in CRS610","Press Ctrl+S to open Search and Start, type CRS610, select it from the list, and click OK. Search for customer number 000382 (or the test customer provided). Verify the customer name, address, payment terms, price list, and that the status is Active. Record the customer number. If a customer is not in M3, contact Finance — do NOT create a new record yourself.<br><br><div style='font-family:sans-serif;font-size:12px;background:#f4f6f8;border:1px solid #d0d5dd;border-radius:6px;padding:12px;margin-top:4px'><div style='background:#1a7a6d;color:#fff;padding:5px 10px;border-radius:4px;margin-bottom:10px;font-weight:700;font-size:12px'>&#128187; OIS100 &mdash; Customer Order Entry &mdash; Standard Net Terms</div><b>Four screens in sequence:</b><br><br><div style='display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS100/A Header</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS100/I Customer PO#</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#c49a2a;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS102/H Address</span><span style='font-size:14px;color:#888;margin:0 4px'>&rarr;</span><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap'>OIS101/B1 Order Lines</span></div><br><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Customer<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>000382 &mdash; AAA EXPRESS WATER AND FIRE RES</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>CO type<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>C01 &mdash; Bravo Normal/WC (standard)</span></span></div><div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'><span style='width:130px;color:#555;font-size:11px'>Your ref 1<span style='color:#c0443b'>*</span></span><span style='flex:1;background:#fff;border:1px solid #aaa;border-radius:3px;padding:3px 8px;font-family:monospace;font-size:11px;background:#fffbe6;border-color:#f0c040;'><span style='color:#aaa'>Customer PO number</span></span></div><div style='background:#e8f4f2;border:1px solid #a0d4c8;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; OIS101/B1 = order lines. Fill warehouse, item, qty, U/M &rarr; click Add per line &rarr; click Change to save.</div><div style='display:flex;gap:3px;margin-top:10px;flex-wrap:wrap'><span style='background:#1a7a6d;color:#fff;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700'>A</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>B</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>E</span><span style='background:#d0d5dd;color:#444;border-radius:4px;padding:3px 10px;font-size:11px'>I</span><span style='background:#2d6fa3;color:#fff;border-radius:4px;padding:3px 10px;font-size:11px;margin-left:auto'>Next &rsaquo;</span></div></div>"],[2,"Create a New Sales Order in OIS100","Press Ctrl+S to open Search and Start, type OIS100, select Customer Order. Open from the list, and click OK. The Account Search box pops up. Type the account # and press Tab (or search by name, city, or phone), then click the customer. Customer and Payer fill in automatically on the Enter Customer Order screen. Once the customer is found, the rest of the header fills in automatically (CO type, Req delivery dt, Facility, address). Review it and click Next. To change the delivery date, click the calendar icon. The Delivery calendar shows the customer's route, delivery days, and the 3:00 PM cutoff the day before."],[3,"Fill In Order Details (OIS100/I)","On the Order Details screen, check the defaults: Warehouse CAR (Carrollton), Priority 5-Norm, Payment terms N30, Delivery method OT (Our Truck). In Customer's ord, enter the customer PO number: TEST-PO-001. This field is required. If you skip it, M3 shows the alert \"Customer's order number must be entered\" and won't let you continue. Click Next to move through the address screen (Customer Order. Connect Address) to order lines. M3 assigns the CO number — record it."],[4,"Add Order Lines in OIS101","M3 opens OIS101 (Order Lines). Use the entry row under the grid. Whs defaults to CAR, Ln tp stays 0, and Req dt carries over from the header. In Item, type the item number, or open Item search to find it (use test items provided by your trainer). In Item search, type part of the item number or name and click Search. Each result shows stock on hand by warehouse (CAR, HOU, LEN, LIT; green means stock is available) and the price per unit. Check the CAR column, then click Pick stock on the item you want. Enter Order qty 100 and check the U/M. Sales price fills in from the customer price list. Click Add. The line drops into the Order Lines grid above and the Running Total updates. Repeat for 2 more items. To remove a line, select it in the grid and click Delete line."],[5,"Verify Pricing on Each Line","Review each order line. The sales price should be pulled automatically from the customer price list. If a price does not match what was quoted, do NOT override it yourself — document the discrepancy and contact your sales manager or Finance for authorization before changing any price."],[6,"Check the Order in OIS300","Press Ctrl+S to open Search and Start, type OIS300, select from the list, and click OK. Filter on the customer and find your CO no. Lst (lowest status) and Hi (highest status) should both read <b>33-ALLOCATED</b>: the stock is reserved and the order is waiting in MWS410 for the warehouse to release it for picking. If it shows <b>20-Line Not Entered</b>, the header saved with no lines. Open it and add the lines.<div style='background:#e8f4f2;border:1px solid #9fd0c7;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; There is no separate Save or Release step in order entry. Lines save as soon as you click Add. Pick release happens later, in the warehouse (MWS410).</div>"]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2005%202025%20-%20Manual%20Order/Bravo%20-%20Mini-CRP%20Manual%20order%20scenarios-20251205%20Manual%20Order%20CL1.mp4","quiz":[{"q":"When you enter a customer number in OIS100, M3 automatically fills in:","options":["Item prices only","Name, address, payment terms, and price list","Warehouse location and carrier","Nothing — you fill all fields manually"],"answer":1},{"q":"The customer PO number field is important because:","options":["It is required to release the order","It prints on the invoice and packing slip for customer reference","It auto-populates the price list","It routes the order to the correct warehouse"],"answer":1},{"q":"A new order shows 33-ALLOCATED in OIS300. That means:","options":["The order has shipped","Stock is reserved and the order is waiting for pick release in MWS410","The order is on credit hold","The header saved without lines"],"answer":1}],"checklist":["I open programs with Ctrl+S (Search and Start)","I can start an order in OIS100 from Account Search and check the header defaults","I always fill in Customer's ord (the customer PO)","I can add lines in OIS101 and know they save when I click Add","I can find my order in OIS300 and read 33-ALLOCATED vs 20-Line Not Entered"]},{"id":"ord-2","title":"Customer Return — Credit Order (C05)","duration":"60 min","steps":[[1,"Get Authorization First","Confirm the return is approved by your manager before you enter anything. A credit order creates a credit for the customer."],[2,"Find the Original Order","Press Ctrl+S to open Search and Start, type OIS300, select from the list, and click OK. Filter on the customer and find the order the product shipped on. Note its CO no, item, quantity, and price. OIS350 (CO Invoice. Display) shows the invoice if you need it."],[3,"Create the Credit Order","In OIS300 click + (New). OIS100 opens. Enter the customer and CO type <b>C05</b> (Credit NoStkUpd). Click Next. On Order Details, put the original CO no in Your ref 1 so AR can match the credit.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> C05 is a credit with no stock update: it credits the customer but does not put product back on hand. If the product is coming back to stock, ask Mike which CO type to use. That type is not on the program list yet.</div>"],[4,"Enter the Return Line","In OIS101 enter the item and the quantity being returned. Check the U/M and price match the original order. Click Add. Note the new CO no."],[5,"Hand Off","Tell AR the credit CO no and the original CO no. If product is physically coming back, tell the warehouse so they expect it."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Customer%20Return.mp4","quiz":[{"q":"Before entering a return you must:","options":["Check stock","Get manager authorization","Call the supplier","Create a quote"],"answer":1},{"q":"CO type C05 is:","options":["A quote","A drop ship order","A credit order with no stock update","A will call order"],"answer":2},{"q":"Where do you record the original order number on the credit order?","options":["Customer's ord","Your ref 1","Item number","Delivery method"],"answer":1}],"checklist":["I get authorization before entering a return","I can find the original order in OIS300","I can create a C05 credit order in OIS100 and reference the original CO","I know C05 does not return product to stock"]},{"id":"ord-3","title":"Order Entry — When an Order Is Held for Credit","duration":"60 min","steps":[[1,"What a Credit Hold Looks Like","Enter a normal order for the credit-hold test customer. The order saves and the lines save, but the order stops. In OIS100/I the <b>CO stop</b> field shows a value (3 = credit limit stop in the exercise). In OIS300 the credit flag is on, so credit sees it in their held-orders view.<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS300</td><td style='padding:3px 8px;'>Customer Order. Open Toolbox</td><td style='padding:3px 8px;'>Credit view: all held orders</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS120</td><td style='padding:3px 8px;'>Customer Order. Stop</td><td style='padding:3px 8px;'>Release a credit-held order (credit only)</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS610 panel J</td><td style='padding:3px 8px;'>Customer. Open</td><td style='padding:3px 8px;'>Credit limits, payment terms, customer stop</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CRS315</td><td style='padding:3px 8px;'>Customer Credit Limit. Open</td><td style='padding:3px 8px;'>Limits and current balances</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"Look, Don't Touch, in CRS610","Press Ctrl+S to open Search and Start, type CRS610, select from the list, and click OK. Find the customer. Panel J has the credit limits, payment terms, and customer stop. Panel K shows the credit manager. You are here to read it, not change it."],[3,"Escalate to Credit","Contact the credit manager shown on CRS610 panel K (or AR) with the customer number, CO no, and order total. Credit decides. They release the order in OIS120. CS does not release holds or change terms to get around one."],[4,"Know the Difference: Credit Hold vs Prepay Hold","A prepay customer's order does <b>not</b> show a credit flag. It stops on the <b>delivery</b> in MWS410 with stop <b>C10</b> (delivery not paid) until the money is taken at the cash desk. If an order isn't moving and there is no credit flag, check MWS410.<div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: How to Set Up a Prepay (Cash Only) Customer in M3, Mike Parsons, 6 Oct 2026 (draft, not yet proven with a test order)</div>"],[5,"Document It","Add a note on the order: who you contacted, when, and what they said. Example: Called credit 10:15am. Reviewing. Will confirm by EOD."]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20Manual%20Order%20Hard%20Hold%20Credit.mp4","quiz":[{"q":"Who releases a credit-held order?","options":["The CSR who entered it","Credit / AR, in OIS120","The warehouse","IT"],"answer":1},{"q":"Where are a customer's credit limits and payment terms?","options":["OIS101","CRS610 panel J","MMS001","PPS200"],"answer":1},{"q":"A prepay order isn't moving and OIS300 shows no credit flag. Where do you look?","options":["CRS620","MWS410, for a C10 stop on the delivery","GLS200","OIS010"],"answer":1}],"checklist":["I can recognize a credit stop on an order","I can read (not change) CRS610 panel J and K","I escalate to credit and never work around a hold","I know a prepay hold shows as C10 on the delivery, not as a credit flag","I document who I called and when"]},{"id":"ord-4","title":"Will Call Order — Customer Pickup","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203/Week%201/Day%201/Bravo%20-%20Immediate%20delivery%20via%20will%20call.mp4","steps":[[1,"Start the Order","Press Ctrl+S to open Search and Start, type OIS100, select Customer Order. Open from the list, and click OK. Find the customer in Account Search. CO type C01 covers normal and will call orders (WC = Will Call)."],[2,"Set Delivery Method to WC","On Order Details (OIS100/I) change Delivery method from OT (Our Truck) to <b>WC</b> (Will Call). Confirm the warehouse is the one the customer is picking up from. Set Req delivery dt to the pickup day."],[3,"Check Stock Before You Promise","In OIS101 use Item search: it shows stock by warehouse (green = available). The customer is coming in expecting the product, so check the pickup warehouse column before you add the line."],[4,"Add the Lines","Enter item, quantity, and U/M. Click Add. Note the CO no and give it to the customer."],[5,"Tell the Warehouse","Let the warehouse know a will call is coming so they release it in MWS410 and pull it. The order shows 44-PICK RELEASED in OIS300 once released."],[6,"Payment at Pickup","If the customer pays at the counter, the payment is taken at the cash desk in <b>OIS215</b> (see the Cash Desk module). For a prepay customer the delivery won't release for picking until that payment is taken.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Cash desks today exist only at Carrollton (101A and 101B). There are none yet for Little Rock or Lenexa.</div>"]],"quiz":[{"q":"Which delivery method marks an order as will call?","options":["OT","WC","CC","C10"],"answer":1},{"q":"Where is a counter payment taken?","options":["OIS100","OIS215 (Cash Payment. Open)","APS100","CRS610"],"answer":1},{"q":"Before promising a will call order you should:","options":["Release it in MWS410","Check stock for the pickup warehouse in Item search","Change payment terms","Create a PO"],"answer":1}],"checklist":["I can enter a will call order with delivery method WC","I check stock in the pickup warehouse first","I tell the warehouse so they release and pull the order","I know counter payments go through the cash desk (OIS215)"]},{"id":"ord-5","title":"Payment Terms on an Order — COD, Prepay, and Credit Card","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20Manual%20Order%20CC%20COD.mp4","steps":[[1,"Prepay Is a Payment Term","M3 has no prepay checkbox. A customer is prepay because of their payment terms (CRS610 panel J). Some terms have switches that mean \"pay first\": the order saves and allocates, but the delivery can't be picked until money is taken at the cash desk.<div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: How to Set Up a Prepay (Cash Only) Customer in M3, Mike Parsons, 6 Oct 2026 (draft, not yet proven with a test order)</div>"],[2,"Which Terms Do What at Adleta","<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What it does</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>PCD</td><td style='padding:3px 8px;'>Prep Cash Desk</td><td style='padding:3px 8px;'>Pay first: delivery stops (C10) until paid</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CSH</td><td style='padding:3px 8px;'>Cash Desk</td><td style='padding:3px 8px;'>Pay first: same switches as PCD</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>CC</td><td style='padding:3px 8px;'>Credit Card</td><td style='padding:3px 8px;'>Probably pay first. To be tested</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>COD / CSD / PP</td><td style='padding:3px 8px;'>COD / COD PRO / Prepaid</td><td style='padding:3px 8px;'>Label only today. Does NOT stop the order</td></tr></table><div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> Today the COD term has every switch off, so a COD order goes to the warehouse like any other. 681 active customers are on COD. Fixing that before go-live is still open.</div>"],[3,"Changing Terms on One Order","On OIS100/I the Payment terms field defaults from the customer. You can pick a different term with the search icon, which makes one order prepay (or takes prepay off).<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> Whether CSRs should be allowed to change terms at order entry has not been decided. Until it is, ask before you change them.</div>"],[4,"What the CSR Sees on a Prepay Order","The order saves normally. OIS300 shows <b>no</b> credit flag. The delivery in MWS410 carries stop <b>C10 \"delivery not paid\"</b>. A payment proposal shows the amount due and can be printed for the customer. Once the cash desk takes the payment (OIS215), the stop comes off and the delivery releases."]],"quiz":[{"q":"What makes a customer prepay in M3?","options":["A prepay checkbox on the customer","Their payment terms","The warehouse","The CO type alone"],"answer":1},{"q":"At Adleta today, an order on COD terms:","options":["Stops until paid","Goes to the warehouse like any other order","Cannot be saved","Goes on credit hold"],"answer":1},{"q":"A prepay delivery is held with which stop in MWS410?","options":["C01","C10 \"delivery not paid\"","33","CL1"],"answer":1}],"checklist":["I know prepay comes from payment terms (PCD, CSH), not a checkbox","I know COD is a label only at Adleta today","I can spot a C10 stop on a prepay delivery in MWS410","I ask before changing payment terms on an order"]},{"id":"ord-6","title":"Will Call Order — Pay at the Counter","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Manual%20Order%20WC%20COD.mp4","steps":[[1,"Enter the Order","Enter the will call order as in ord-4 (delivery method WC). If the customer pays before pickup, use a pay-first term (PCD) on the order."],[2,"The Delivery Waits for Payment","With PCD the order allocates, but the delivery in MWS410 shows stop C10 and will not release for picking. That is expected, not an error."],[3,"Take the Payment","When the customer pays (at the counter or by phone), the cash desk records it in <b>OIS215</b> against the order. The C10 stop comes off and the delivery can be released."],[4,"Release, Pick, Hand Over","The warehouse releases the delivery in MWS410 (OIS300 shows 44-PICK RELEASED), picks it, and hands it over when the customer arrives."],[5,"Confirm in OIS300","Check the order's status advanced. Ask the trainer which final status a picked-up will call order shows in Adleta's setup.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> The status a will call order ends at after pickup has not been confirmed on screen yet.</div>"]],"quiz":[{"q":"On a PCD will call order, why won't the delivery release?","options":["It is on credit hold","C10: the delivery hasn't been paid","No stock","Wrong warehouse"],"answer":1},{"q":"Which program takes the counter payment?","options":["OIS215","OIS120","ARS200","APS100"],"answer":0},{"q":"After the payment is taken:","options":["The order must be re-entered","The C10 stop comes off and the delivery can be released","AR posts a journal","Nothing changes"],"answer":1}],"checklist":["I can enter a will call order with a pay-first term","I expect the C10 stop until payment","I know payment is taken in OIS215","I can follow the order through release and pickup in OIS300"]},{"id":"ord-7","title":"Quote to Customer Order (C04)","duration":"1 hour","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2012%202025%20-%20O2C/Bravo%20-%20MiniCRP%20Order%20To%20Cash-20251212%20LnTp%200%20Quote%20to%20CO%20OT%20N30.mp4","steps":[[1,"Create the Quote","Press Ctrl+S to open Search and Start, type OIS300, select from the list, and click OK. Click + (New). Enter the customer and CO type <b>C04</b> (Quotation). Click Next through the header, then add the lines in OIS101. Note the CO no: that is the quote number you give the customer."],[2,"Find Open Quotes","In OIS300 filter CO type = C04 to see quotes. Use OIS110 (Customer Order. Simulate Totals) if the customer wants a total before deciding."],[3,"Convert When Accepted","Open the quote and copy it to a live order with CO type C01 (Actions menu). Note the new CO no and check every line carried over: item, quantity, price.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> The exact menu option for copying a C04 to a C01 has not been confirmed with screenshots yet. Confirm with your trainer.</div>"],[4,"Close the Quote","The original C04 should be closed or cancelled so it doesn't sit open in OIS300."]],"quiz":[{"q":"The quotation CO type is:","options":["C01","C02","C04","C05"],"answer":2},{"q":"To see all open quotes:","options":["Filter OIS300 by CO type C04","Open CRS610","Open PPS200","Run GLS200"],"answer":0},{"q":"After converting a quote you must:","options":["Check every line carried over and close the quote","Delete the customer","Release it in MWS410","Nothing"],"answer":0}],"checklist":["I can create a C04 quote and give the customer the CO no","I can find open quotes in OIS300","I can convert a quote to a C01 order and check the lines","I close the quote after converting"]},{"id":"ord-8","title":"Drop Ship Order (C02)","duration":"1.5 hours","videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2023%202025%20-%20O2C/Bravo%20-%20Mini%20CRP%20O2C%20scenarios-20251223%20Drop%20Ship%20Quote%20to%20CO%20with%20NonCX.mp4","steps":[[1,"When to Use Drop Ship","The supplier ships straight to the customer. Adleta never handles the product, so on-hand stock doesn't change. Use it for items Adleta doesn't stock."],[2,"Create the Order","Press Ctrl+S to open Search and Start, type OIS300, select from the list, and click OK. Click + (New). Enter the customer and CO type <b>C02</b> (Drop Ship Order). On Order Details confirm the delivery address is the customer's, not an Adleta warehouse. Use OIS002 if the ship-to needs adding."],[3,"Enter the Line","In OIS101 enter the item, quantity, and price. Click Add and note the CO no."],[4,"Find the Linked PO","M3 creates a purchase order to the supplier for the drop ship line. Press Ctrl+S to open Search and Start, type PPS200, select from the list, and click OK. Find the PO and check the supplier, item, quantity, and that the ship-to is the customer.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Whether drop ship lines use a special line type and whether a non-cancel flag is used at Adleta is not confirmed.</div>"],[5,"Follow It Through","Purchasing follows the PO; CS follows the CO. When the supplier ships, the PO is received and the customer is invoiced."]],"quiz":[{"q":"The drop ship CO type in the exercise is:","options":["C01","C02","C04","C05"],"answer":1},{"q":"In a drop ship order, goods ship from:","options":["Carrollton","The supplier, straight to the customer","Will call counter","Lenexa"],"answer":1},{"q":"Saving a drop ship line creates:","options":["A journal voucher","A purchase order linked to the customer order","A credit order","Nothing"],"answer":1}],"checklist":["I can enter a C02 drop ship order with the customer's ship-to","I can find the linked PO in PPS200","I know drop ship doesn't change on-hand stock"]},{"id":"ord-9","title":"Answering Customer Questions — Order, Stock, and Invoice Lookups","duration":"1 hour","steps":[[1,"The Lookups You Use Every Day","<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS300</td><td style='padding:3px 8px;'>Customer Order. Open Toolbox</td><td style='padding:3px 8px;'>Find any order: status, change, copy</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS301</td><td style='padding:3px 8px;'>Customer Order. Open Line Toolbox</td><td style='padding:3px 8px;'>Find order lines across orders</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS110</td><td style='padding:3px 8px;'>Customer Order. Simulate Totals</td><td style='padding:3px 8px;'>Order total before saving</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS350</td><td style='padding:3px 8px;'>CO Invoice. Display</td><td style='padding:3px 8px;'>Look up an invoice</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS002</td><td style='padding:3px 8px;'>Customer. Connect Addresses</td><td style='padding:3px 8px;'>Ship-to addresses</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS200 / MMS001</td><td style='padding:3px 8px;'>Item. Open Toolbox / Item. Open</td><td style='padding:3px 8px;'>Search for and look up items</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS002</td><td style='padding:3px 8px;'>Item. Connect Warehouse</td><td style='padding:3px 8px;'>Item in a warehouse: on hand, issue multiple</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MMS080</td><td style='padding:3px 8px;'>Material Plan. Open</td><td style='padding:3px 8px;'>When stock is coming</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>MWS068</td><td style='padding:3px 8px;'>Balance Identity. Open Toolbox</td><td style='padding:3px 8px;'>Exactly which rolls / lots are where</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"\"Where is my order?\"","Press Ctrl+S to open Search and Start, type OIS300, select from the list, and click OK. Filter on the customer. Read Lst/Hi status: 20 = header with no lines, 33 = allocated (waiting for pick release), 44 = pick released. If it's not moving and there's no credit flag, check the delivery in MWS410 for a stop."],[3,"\"Did my item ship on any order?\"","Press Ctrl+S to open Search and Start, type OIS301, select from the list, and click OK. Filter on item or customer to see lines across all orders at once."],[4,"\"When is it coming in?\"","Press Ctrl+S to open Search and Start, type MMS080, select from the list, and click OK. Enter item and warehouse. The material plan lists supply (POs, transfers) and demand by date."],[5,"\"Do you have it in my dye lot?\"","Press Ctrl+S to open Search and Start, type MWS068, select from the list, and click OK. Filter on the item and warehouse. Each line is a balance identity: location, lot, and quantity, so you can see exactly which rolls or lots are where."],[6,"\"Send me a copy of the invoice.\"","Press Ctrl+S to open Search and Start, type OIS350, select from the list, and click OK. Find the invoice by customer or order number."]],"videoUrl":"","quiz":[{"q":"Which program shows order lines across many orders?","options":["OIS300","OIS301","OIS110","CRS610"],"answer":1},{"q":"A customer asks when stock is coming in. Use:","options":["MMS080 Material Plan","OIS350","CRS620","GLS200"],"answer":0},{"q":"To see which lot / roll is in which location:","options":["MWS068","OIS002","APS100","OIS110"],"answer":0}],"checklist":["I can answer \"where is my order\" from OIS300","I can search lines across orders in OIS301","I can check when stock is coming in MMS080","I can check lots and locations in MWS068","I can find an invoice in OIS350"]}]},"cashDesk":{"id":"cashDesk","name":"Will Call Counter and Cash Desk","owner":"Customer Service / will call counter","weeks":"Week 5","pill":"pill-gold","color":"#b5832a","programs":["OIS215","OIS217","OIS223","OIS221","MWS410"],"summary":"Taking payments at the counter or by phone, prepay orders that wait for payment, and closing the drawer at the end of the day.","links":[["Guide","resources/adleta-m3-cashdesk-learningguide.html"]],"sessions":[{"id":"cd-1","title":"Taking a Payment at the Cash Desk — OIS215","duration":"1 hour","steps":[[1,"What the Cash Desk Is","A cash desk is where money is taken: at the will call counter or over the phone. Each payment is recorded in OIS215 against the order or invoice.<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS215</td><td style='padding:3px 8px;'>Cash Payment. Open</td><td style='padding:3px 8px;'>Take a payment at the counter or by phone</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS217</td><td style='padding:3px 8px;'>Cash Desk. Validate</td><td style='padding:3px 8px;'>End of day: count, reconcile, close the drawer</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS223</td><td style='padding:3px 8px;'>Cash Payment. Print</td><td style='padding:3px 8px;'>List of the day's payments</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>OIS221</td><td style='padding:3px 8px;'>Cash Invoice. Print Unpaid</td><td style='padding:3px 8px;'>Unpaid cash invoices</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div><div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> Cash desks exist only at Carrollton (facility 101): 101A and 101B. Little Rock (201) and Lenexa (301) have none yet. Which payment methods each desk accepts (OIS211) and who is authorized (OIS212) still needs to be confirmed on screen.</div>"],[2,"Open OIS215","Press Ctrl+S to open Search and Start, type OIS215, select from the list, and click OK. Select your cash desk (101A or 101B at Carrollton).<div style='background:#e8f4f2;border:1px solid #9fd0c7;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; OIS215 asks for the cash desk first. After the desk, enter Payer, Payment mtd AR, and Cash received, then click <b>Validate payment</b>.</div>"],[3,"Find What the Customer Is Paying","Find the order or invoice the customer is paying for. Check the customer and amount due with them before taking money."],[4,"Pick the Payment Method","Choose how they are paying: cash, check, or card. The method you pick is what goes on the payment.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> M3 has no per-customer \"cash only, no checks\" switch. If a customer is cash-only, the clerk has to catch it. The fix is still being decided.</div>"],[5,"Save and Give a Receipt","Save the payment. For a prepay order, the C10 stop on the delivery comes off and the warehouse can release it for picking."]],"videoUrl":"","quiz":[{"q":"Which program takes a payment at the counter?","options":["OIS215","OIS217","OIS120","ARS110"],"answer":0},{"q":"Where do cash desks exist today?","options":["All three warehouses","Carrollton only (101A, 101B)","Lenexa only","None"],"answer":1},{"q":"Can M3 stop a cash-only customer paying by check?","options":["Yes, automatically","No. There is no per-customer switch; the clerk must catch it","Only on Fridays","Only for COD"],"answer":1}],"checklist":["I can open OIS215 on the right cash desk","I confirm the order/invoice and amount before taking money","I pick the right payment method","I know taking payment on a prepay order releases its C10 stop"]},{"id":"cd-2","title":"Prepay Orders — Why the Order Isn't Moving","duration":"45 min","steps":[[1,"The Prepay Flow","Customer on a pay-first term (PCD or CSH) → CSR keys the order as usual → stock allocates → delivery in MWS410 gets stop <b>C10 \"delivery not paid\"</b> → payment proposal shows the amount due → cash desk takes the payment in OIS215 → stop comes off → warehouse releases for picking.<div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: How to Set Up a Prepay (Cash Only) Customer in M3, Mike Parsons, 6 Oct 2026 (draft, not yet proven with a test order)</div>"],[2,"It's Not a Credit Hold","A prepay hold doesn't show the OIS300 credit flag. If a customer calls about an order that isn't moving and there is no credit flag, look at the delivery in MWS410."],[3,"Check the Delivery","Press Ctrl+S to open Search and Start, type MWS410, select from the list, and click OK. Find the delivery for the order and look for stop C10."],[4,"Clear It","Take the payment in OIS215 (cd-1). Re-check MWS410: the C10 stop should be gone."],[5,"Which Customers Are Prepay","Only customers on PCD or CSH (and probably CC) stop for payment today. COD, CSD, and PP are labels only and do not stop anything.<div style='background:#fdecea;border:1px solid #e0a39d;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Not settled yet:</b> The 681 customers on COD terms are not being stopped today. Pro shop and cash-only walk-in accounts aren't in M3 yet. Part payments (e.g. 50%) vs 100% prepay is also undecided.</div>"]],"videoUrl":"","quiz":[{"q":"A prepay order allocates but won't release. The stop on the delivery is:","options":["C10","33","CL1","C05"],"answer":0},{"q":"Does a prepay hold show as a credit flag in OIS300?","options":["Yes","No","Only for COD","Only after 30 days"],"answer":1},{"q":"Which terms actually make the order wait for payment today?","options":["COD and PP","PCD and CSH","N30","All terms"],"answer":1}],"checklist":["I can explain the prepay flow end to end","I check MWS410 for C10 when a prepay order isn't moving","I know which terms stop for payment and which are labels only"]},{"id":"cd-3","title":"End of Day — Closing the Drawer","duration":"45 min","steps":[[1,"Print the Day's Payments","Press Ctrl+S to open Search and Start, type OIS223, select from the list, and click OK. Run Cash Payment. Print for your desk and today's date. This is the list of everything taken."],[2,"Count and Reconcile","Count the drawer: cash, checks, and card slips. Compare to the OIS223 list by payment method."],[3,"Validate the Cash Desk","Press Ctrl+S to open Search and Start, type OIS217, select from the list, and click OK. Validate the desk for the day. This closes the drawer in M3.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> The exact OIS217 screens and what happens to a difference (over/short) haven't been walked through on screen yet. Do this with your trainer.</div><div style='background:#e8f4f2;border:1px solid #9fd0c7;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; OIS217 has <b>Validate cash desk</b> and <b>Add movement</b> buttons. Filter by Payment date and Cash desk.</div>"],[4,"Checks Go to the Bank","Checks taken at the cash desk go to the bank through AR's check deposit (ARS300). Hand off per the AR process."],[5,"Follow Up on Unpaid Cash Invoices","Press Ctrl+S to open Search and Start, type OIS221, select from the list, and click OK. Print unpaid cash invoices to see who still owes."]],"videoUrl":"","quiz":[{"q":"Which program lists the day's payments?","options":["OIS223","OIS215","OIS100","MWS420"],"answer":0},{"q":"Which program closes the drawer?","options":["OIS217 Cash Desk. Validate","OIS120","GLS100","CRS610"],"answer":0},{"q":"Unpaid cash invoices are listed by:","options":["OIS221","OIS002","PPS220","ARS110"],"answer":0}],"checklist":["I can print the day's payments in OIS223","I count and reconcile the drawer by payment method","I can validate the desk in OIS217 with my trainer","I can list unpaid cash invoices in OIS221"]}]},"purchasing":{"id":"purchasing","name":"Purchasing / Procurement","owner":"Alan Burk","weeks":"Week 3","pill":"pill-blue","color":"#2d6fa3","programs":["PPS170","PPS200","PPS201","PPS220","PPS250","PPS260","PPS300","PPS330","PPS360","PPS390","PPS040","PPS100","CRS620"],"summary":"Planned PO release, manual POs, supplier confirmations, receiving, delivery notes, supplier returns, and supplier data.","links":[["Deck","resources/adleta-m3-purchasing-training-deck.html"],["Guide","resources/adleta-m3-purchasing-learningguide.html"]],"sessions":[{"id":"pur-1","title":"Planned PO Release — PPS170","duration":"45 min","steps":[[1,"The Purchasing Programs","<table style='width:100%;border-collapse:collapse;font-size:11px;border:1px solid #d0d5dd;margin-top:8px'><tr><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Program</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>Infor name</td><td style='padding:3px 8px;font-weight:700;background:#e8f4f2;color:#145c52'>What we use it for</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>PPS170</td><td style='padding:3px 8px;'>Planned Purchase Order. Open</td><td style='padding:3px 8px;'>M3's buying suggestions: review and release</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>PPS200 / PPS201</td><td style='padding:3px 8px;'>Purchase Order. Open / Open Lines</td><td style='padding:3px 8px;'>Create or change a PO and its lines</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>PPS220</td><td style='padding:3px 8px;'>Purchase Order. Display Lines</td><td style='padding:3px 8px;'>Find POs and their status</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>PPS250</td><td style='padding:3px 8px;'>Purchase Order. Confirm</td><td style='padding:3px 8px;'>Record the supplier's confirmation</td></tr><tr style='border-top:1px solid #eee'><td style='padding:3px 8px;font-weight:700'>PPS300</td><td style='padding:3px 8px;'>Purchase Order. Receive Goods</td><td style='padding:3px 8px;'>Receive stock</td></tr></table><div style='color:#5b6b7a;font-size:11px;margin-top:6px'>Source: M3 Programs We Use, Mike Parsons, 20 Oct 2026</div>"],[2,"Open PPS170","Press Ctrl+S to open Search and Start, type PPS170, select Planned Purchase Order. Open from the list, and click OK. The list is sorted by Buyer, Supplier, PO type, and release date. Use Filter Options (facility CAR) and find your buyer code."],[3,"Review Before Releasing","Check each planned order: supplier, Plan qty, release date, order type, net price. These are M3's suggestions, not orders yet. If a quantity or supplier looks wrong, don't release it. Ask Alan."],[4,"Release","Right-click the planned order and release it. M3 creates a firm PO in PPS200 (PO numbers look like 933253)."],[5,"Check the New PO","Press Ctrl+S to open Search and Start, type PPS200, select from the list, and click OK. Find the new PO: supplier, buyer, order type B01, warehouse CAR, and quantity should match the planned order.<div style='background:#fff3cd;border:1px solid #ffc107;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#9888; <b>Check on screen:</b> PO status numbers haven't been confirmed on Adleta's screens yet. Read the lowest/highest status columns in PPS200 and PPS220 and confirm what each number means with your trainer. Don't rely on a number from an old handout.</div><div style='background:#e8f4f2;border:1px solid #9fd0c7;border-radius:4px;padding:7px 10px;font-size:12px;margin-top:8px'>&#128161; In the test company, PPS200 shows statuses like <b>15-Approved</b> and order type <b>B01 (Bravo Std PO)</b>.</div>"]],"videoUrl":"https://adleta.sharepoint.com/sites/InforERP/Shared%20Documents/CRP/CRP3%20FOLDER/CRP%203-mini/December%2015%202025%20-%20P2P/Bravo%20-%20MiniCRP%20P2P-20251215%20Planned%20PO%20Release.mp4","quiz":[{"q":"Planned POs in PPS170 come from:","options":["The buyer typing them","M3's planning based on demand","The supplier","AP"],"answer":1},{"q":"After releasing, you check the new PO in:","options":["APS100","PPS200","CRS610","MWS410"],"answer":1},{"q":"A plann
